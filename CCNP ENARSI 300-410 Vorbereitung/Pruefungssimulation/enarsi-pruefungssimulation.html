<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENARSI Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:800px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
code{background:var(--chip);border-radius:4px;padding:0 4px;font:.88em Menlo,Consolas,monospace}pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
/* Reihenfolge */
.ord{list-style:none;padding:0;margin:8px 0}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card);cursor:grab;touch-action:none}
.ord li.drag{opacity:.4}.ord li.over{border-color:var(--acc);border-style:dashed}
.ord .n{color:var(--mut);font-variant-numeric:tabular-nums;min-width:1.4em}
.ord .t{flex:1}
.ord button{padding:2px 9px;font-size:.9rem}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.bad{border-color:var(--bad);background:var(--badbg)}
/* Zuordnung */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;min-height:48px;margin:8px 0}
.chip{border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:grab;font-size:.92rem;user-select:none}
.chip.pick{background:var(--acc);color:#fff}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.zone{min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.zone.over{border-color:var(--acc)}.zone .ph{color:var(--mut);font-size:.85rem;padding:0 6px}
.zone.ok{border:1px solid var(--ok);background:var(--okbg)}.zone.bad{border:1px solid var(--bad);background:var(--badbg)}
.right{color:var(--ok);font-size:.85rem}
@media(max-width:560px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<input type="file" id="file" accept=".json,application/json" class="hide">
<script>
const BUILTIN={title:'CCNP ENARSI 300-410 · Prüfungssimulation',domains:{1:'Layer-3-Technologien',2:'VPN-Technologien',3:'Infrastruktur-Security',4:'Infrastruktur-Services'},weights:{1:35,2:20,3:20,4:25},examN:55,examSec:5400,allSec:10200,questions:[{"d": 1, "q": "Der Router lernt 10.1.1.0/24 gleichzeitig per RIP, OSPF, internem EIGRP und eBGP. Welche Route landet in der Routing-Tabelle?", "o": ["Die eBGP-Route (AD 20)", "Die interne EIGRP-Route (AD 90)", "Die OSPF-Route (AD 110)", "Die RIP-Route, weil sie die geringste Metrik hat"], "c": [0], "e": "Die eBGP-Route. Bei gleichem Präfix und gleicher Länge entscheidet die Administrative Distance, die kleinere gewinnt: eBGP 20, internes EIGRP 90, OSPF 110, RIP 120. Die Metrik wird nur innerhalb eines Protokolls verglichen."}, {"t": "order", "d": 1, "q": "Bring diese Routenquellen nach Administrative Distance in die Reihenfolge, beginnend mit der vertrauenswürdigsten.", "o": ["Direkt verbunden (0)", "Statische Route (1)", "eBGP (20)", "EIGRP intern (90)", "OSPF (110)", "RIP (120)", "EIGRP extern (170)", "iBGP (200)"], "e": "0, 1, 20, 90, 110, 120, 170, 200. Merke: EIGRP extern (170) ist deutlich schlechter als intern (90), und iBGP (200) schlechter als eBGP (20)."}, {"d": 1, "q": "Welchen Next Hop nutzt der Router für ein Paket an 10.1.1.5?", "x": "R1# show ip route\nD    10.0.0.0/8 [90/3072] via 10.0.0.1, Gi0/0\nO    10.1.0.0/16 [110/20] via 10.0.0.2, Gi0/1\nR    10.1.1.0/24 [120/2] via 10.0.0.3, Gi0/2\nS*   0.0.0.0/0 [1/0] via 10.0.0.9", "o": ["10.0.0.3 (die /24-Route)", "10.0.0.1 (die /8-Route)", "10.0.0.2 (die /16-Route)", "Die Default-Route, weil das Ziel nicht direkt verbunden ist"], "c": [0], "e": "10.0.0.3. Es gilt der Longest Prefix Match: Die /24 passt am genauesten. AD und Metrik spielen erst eine Rolle, wenn dasselbe Präfix mehrfach bekannt ist."}, {"d": 1, "q": "Eine Default-Route per OSPF (AD 110) ist primär, die Default-Route zum Zweit-Provider soll nur bei deren Ausfall greifen. Welche Konfiguration passt?", "o": ["<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 150</code>", "<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 100</code>", "<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code>", "<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 permanent</code>"], "c": [0], "e": "Die Floating Static Route mit AD 150. Sie muss schlechter (höher) sein als die 110 von OSPF, sonst verdrängt sie diese sofort. Eine Static ohne Zusatz hat AD 1, 100 wäre noch besser als 110."}, {"d": 1, "q": "Was passiert bei Redistribution mit Routen, die auf keine Sequenz einer Route-Map passen?", "o": ["Sie werden nicht redistribuiert (implizites <code>deny</code> am Ende).", "Sie werden mit Standardmetrik redistribuiert.", "Sie werden redistribuiert, aber mit Tag 0.", "Die Route-Map wird ignoriert."], "c": [0], "e": "Nicht redistribuiert. Jede Route-Map endet mit einem unsichtbaren <code>deny any</code>. Eine Sequenz ohne <code>match</code> trifft dagegen alles."}, {"d": 1, "q": "Was bewirkt <code>continue</code> in einer Route-Map-Sequenz?", "o": ["Nach einem Treffer wird die Auswertung in einer späteren Sequenz fortgesetzt.", "Der Router springt zurück zur ersten Sequenz.", "Die Route-Map wird für diese Route beendet und die Route verworfen.", "Die Sequenz wird auch für die Gegenrichtung genutzt."], "c": [0], "e": "Die Auswertung geht weiter, normalerweise mit der nächsten Sequenz oder mit <code>continue 30</code> bei einer bestimmten. So lassen sich mehrere <code>set</code>-Aktionen aus verschiedenen Matches kombinieren."}, {"d": 1, "q": "Welche Präfixe passen auf <code>ip prefix-list P seq 5 permit 10.0.0.0/8 ge 16 le 24</code>? (Wähle zwei)", "o": ["10.1.0.0/16", "10.1.1.0/24", "10.0.0.0/8", "10.1.1.128/25"], "c": [0, 1], "e": "10.1.0.0/16 und 10.1.1.0/24. Die Länge muss zwischen 16 und 24 liegen und die ersten 8 Bit müssen zu 10.0.0.0 passen. Die /8 ist zu kurz, die /25 zu lang."}, {"d": 1, "q": "Ein Router wendet PBR auf Interface Gi0/1 an. Pings vom Router selbst folgen der Policy trotzdem nicht. Was fehlt?", "o": ["<code>ip local policy route-map NAME</code> global", "<code>ip policy route-map NAME</code> auf dem Ausgangsinterface", "<code>set ip default next-hop</code> in der Route-Map", "<code>ip route-cache policy</code>"], "c": [0], "e": "<code>ip local policy route-map</code>. <code>ip policy route-map</code> am Interface greift nur für Pakete, die dort <i>eingehen</i>. Vom Router selbst erzeugter Verkehr braucht die lokale Policy."}, {"d": 1, "q": "Was unterscheidet <code>set ip next-hop</code> von <code>set ip default next-hop</code> in einer PBR-Route-Map?", "o": ["<code>default</code> wird nur genutzt, wenn die Routing-Tabelle keine explizite Route zum Ziel hat.", "<code>default</code> gilt nur für Verkehr zu 0.0.0.0/0, alles andere folgt der Tabelle.", "<code>set ip next-hop</code> funktioniert nur mit Standard-ACLs im Match.", "Es gibt keinen Unterschied, <code>default</code> ist nur ein Alias des Befehls."], "c": [0], "e": "<code>set ip next-hop</code> hat Vorrang vor der Routing-Tabelle, <code>set ip default next-hop</code> gilt nur als Fallback, wenn die Tabelle keine spezifische Route hat (eine Default-Route zählt dabei nicht)."}, {"d": 1, "q": "PBR schickt Verkehr an einen Next Hop, der ausgefallen ist, weil das Interface up bleibt. Wie verhinderst du das?", "o": ["<code>set ip next-hop verify-availability 192.0.2.1 10 track 1</code> mit einem IP-SLA-Objekt", "<code>ip policy route-map</code> mit dem Schlüsselwort <code>fallback</code> am Interface", "Die Route-Map-Sequenz auf <code>permit 5</code> setzen und neu anwenden", "<code>bfd all-interfaces</code> für den PBR-Prozess aktivieren und neu starten"], "c": [0], "e": "<code>verify-availability</code> mit Track-Objekt. Der Router prüft den Next Hop per IP SLA und nimmt ihn aus der Policy, wenn er nicht antwortet. Ohne das bleibt PBR bei Layer-2-Interface-Status hängen."}, {"d": 1, "q": "Wie testest du die Erreichbarkeit von 10.10.0.2 innerhalb der VRF KUNDE-A?", "o": ["<code>ping vrf KUNDE-A 10.10.0.2</code>", "<code>ping 10.10.0.2 vrf KUNDE-A source global</code>", "<code>ping 10.10.0.2</code> im Konfigurationsmodus der VRF", "<code>vrf ping KUNDE-A 10.10.0.2</code>"], "c": [0], "e": "<code>ping vrf KUNDE-A …</code>. Ein normaler Ping nutzt die globale Tabelle, in der die Kundenrouten nicht stehen. Ebenso <code>show ip route vrf KUNDE-A</code>."}, {"d": 1, "q": "Nach <code>vrf forwarding KUNDE-A</code> am Interface fehlt die IP-Adresse. Warum?", "o": ["IOS löscht die Adresse, wenn das Interface einer VRF zugewiesen wird. Sie muss danach neu gesetzt werden.", "Die VRF besitzt keine IPv4-Adressfamilie, deshalb wird die Adresse nicht angezeigt.", "Das Interface wurde durch den Befehl heruntergefahren und die Adresse blieb erhalten.", "Die Adresse wurde automatisch in die globale Routing-Tabelle verschoben."], "c": [0], "e": "Die Adresse wird entfernt und muss nach <code>vrf forwarding</code> neu konfiguriert werden. Deshalb immer zuerst die VRF zuweisen, dann die IP setzen."}, {"d": 1, "q": "BFD läuft mit <code>interval 300 min_rx 300 multiplier 3</code>. Nach wie vielen Millisekunden meldet BFD den Nachbarn als ausgefallen?", "o": ["900 ms", "300 ms", "3000 ms", "100 ms"], "c": [0], "e": "900 ms (Intervall × Multiplier). Nach drei verpassten Paketen wird der Nachbar als down gemeldet, deutlich schneller als die Hello-Timer von OSPF oder EIGRP."}, {"d": 1, "q": "Welches Transportprotokoll und welchen Port nutzt BFD für Single-Hop-Sitzungen?", "o": ["UDP 3784", "TCP 179", "UDP 520", "UDP 3785"], "c": [0], "e": "UDP 3784 für Control-Pakete. 3785 ist Echo-Modus, TCP 179 gehört zu BGP."}, {"d": 1, "q": "OSPF-Routen werden in EIGRP redistribuiert, aber im EIGRP-Netz erscheint keine davon. Die Konfiguration lautet <code>redistribute ospf 1</code>. Was fehlt?", "o": ["Eine Seed-Metrik, zum Beispiel <code>metric 10000 100 255 1 1500</code> oder <code>default-metric</code>", "Das Schlüsselwort <code>subnets</code>, damit auch Subnetze übernommen werden", "Eine Distribute-List, die die redistribuierten Routen zulässt", "Ein passendes <code>network</code>-Statement für die OSPF-Netze unter EIGRP"], "c": [0], "e": "Die Seed-Metrik. EIGRP kann OSPF-Metriken nicht übernehmen und braucht Bandbreite, Delay, Reliability, Load und MTU. Ohne sie bleibt die Metrik unendlich und die Route wird nicht angekündigt (Ausnahme: Redistribution von statischen oder verbundenen Routen)."}, {"d": 1, "q": "Welche Wirkung hat <code>redistribute eigrp 100</code> ohne <code>subnets</code> in OSPF?", "o": ["Es werden nur klassenbehaftete Netze redistribuiert.", "Es werden alle Routen als E1 mit der internen Metrik verteilt.", "Es werden nur Default-Routen und Summary-Routen verteilt.", "Die Redistribution wird vom Router ohne Fehlermeldung abgelehnt."], "c": [0], "e": "Nur klassenbehaftete Netze, also kaum die gewünschten Subnetze. Für typische Netze braucht man <code>subnets</code>."}, {"d": 1, "q": "Was unterscheidet OSPF E1 und E2?", "o": ["E2 behält die Metrik des ASBR, bei E1 kommen die internen Kosten bis zum ASBR dazu.", "E1 gilt nur in NSSA-Areas, E2 nur in normalen Areas und Stub-Areas.", "E2 hat eine höhere Administrative Distance als E1 und verliert den Vergleich.", "E1 wird nur per Summary-LSA (Typ 3) und nicht als External-LSA verteilt."], "c": [0], "e": "E2 (Standard) trägt nur die Seed-Metrik, E1 addiert die Kosten innerhalb des OSPF-Netzes. E1 ist sinnvoll, wenn mehrere ASBRs bevorzugt werden sollen."}, {"d": 1, "q": "Zwei Router redistribuieren beidseitig zwischen EIGRP und OSPF. Im Netz treten Schleifen auf. Welche Maßnahme hilft am besten?", "o": ["Route-Tags beim Redistribuieren setzen und per Route-Map filtern", "Die AD von OSPF auf 90 setzen, damit OSPF vor EIGRP bevorzugt wird.", "Auf beiden Seiten <code>default-information originate</code> aktivieren.", "Die Metrik bei der Redistribution auf 1 setzen, damit Pfade gleich sind."], "c": [0], "e": "Route-Tags und Filter. Wer eine Route schon einmal redistribuiert hat, markiert sie, und der zweite Punkt lässt sie nicht erneut zurück. AD-Spielereien helfen nur teilweise."}, {"d": 1, "q": "Wie hoch ist die AD der Null0-Route, die EIGRP automatisch für eine Summary-Route anlegt?", "o": ["5", "0", "1", "90"], "c": [0], "e": "5. Die Route verhindert Schleifen für Ziele, die zur Summary gehören, aber nicht existieren. Bei Bedarf änderbar mit <code>ip summary-address eigrp 100 … 5</code> am Ende des Befehls."}, {"d": 1, "q": "Wo konfigurierst du die Summarization von Intra-Area-Routen in OSPF, und wo die externer Routen?", "o": ["<code>area X range</code> am ABR, <code>summary-address</code> am ASBR", "<code>ip summary-address ospf</code> am Interface beider", "<code>area X range</code> am ASBR, <code>summary-address</code> am ABR", "Beides nur am DR"], "c": [0], "e": "Intra-Area-Routen werden am ABR mit <code>area X range</code> zusammengefasst, Routen aus Redistribution am ASBR mit <code>summary-address</code>."}, {"d": 1, "q": "Welche Metrikwerte gehen bei EIGRP standardmäßig in die Berechnung ein?", "o": ["Kleinste Bandbreite und summiertes Delay (K1 = K3 = 1)", "Nur die Hop-Zahl, wie bei RIP, ohne Bandbreite und Delay", "Bandbreite und Load (K1 = K2 = 1), Delay bleibt unberücksichtigt", "Delay und Reliability (K3 = K4 = 1), Bandbreite bleibt unberücksichtigt"], "c": [0], "e": "Bandbreite (kleinster Wert auf dem Pfad) und Delay (Summe), mit K1 und K3 gleich 1. K2, K4 und K5 sind 0. Auf den Nachbarn müssen die K-Werte übereinstimmen."}, {"d": 1, "q": "Welche Nachbarn sind aus Sicht von R1 Feasible Successor für 10.1.1.0/24?", "x": "R1# show ip eigrp topology\nP 10.1.1.0/24, 1 successors, FD is 3072\n        via 10.0.0.2 (3072/2816), Gi0/0\n        via 10.0.1.2 (5120/2560), Gi0/1\n        via 10.0.2.2 (4096/3072), Gi0/2", "o": ["Nur 10.0.1.2", "10.0.1.2 und 10.0.2.2", "Nur 10.0.2.2", "Keiner, es gibt nur einen Successor"], "c": [0], "e": "Nur 10.0.1.2. Die Feasibility Condition verlangt, dass die Reported Distance kleiner ist als die Feasible Distance des Successors (3072). 2560 erfüllt das, 3072 nicht (gleich ist nicht kleiner)."}, {"d": 1, "q": "Welche Ursachen verhindern eine EIGRP-Nachbarschaft? (Wähle zwei)", "o": ["Unterschiedliche AS-Nummern", "Unterschiedliche K-Werte", "Unterschiedliche Hello-Timer", "Unterschiedliche Hold-Timer"], "c": [0, 1], "e": "AS-Nummer und K-Werte müssen übereinstimmen, dazu Subnetz und Authentifizierung. Unterschiedliche Hello- oder Hold-Timer blockieren in EIGRP die Nachbarschaft nicht, anders als bei OSPF."}, {"d": 1, "q": "Welche Routen kündigt ein Router mit <code>eigrp stub</code> ohne weitere Optionen an?", "o": ["Verbundene und zusammengefasste Routen", "Alle Routen, die der Router selbst lernt, inklusive der Routen der Nachbarn", "Nur statische Routen, verbundene und zusammengefasste fehlen", "Keine Routen, ein Stub-Router kündigt nichts an"], "c": [0], "e": "Connected und Summary (Standard). Stub-Router beantworten Queries außerdem nicht, sondern melden die Route als unerreichbar. Das verkleinert den Query-Bereich und beugt Stuck-in-Active vor."}, {"d": 1, "q": "Wo konfigurierst du bei EIGRP im Named Mode die Authentifizierung für ein Interface?", "o": ["<code>af-interface</code> innerhalb der Address Family", "Direkt unter <code>router eigrp NAME</code>", "Im Interface mit <code>ip eigrp authentication</code>", "Nur global mit <code>key chain</code>"], "c": [0], "e": "Im <code>af-interface</code>-Block der Address Family, mit <code>authentication mode hmac-sha-256 KEY</code>. Im Named Mode liegen alle Einstellungen an einem Ort."}, {"d": 1, "q": "Mit <code>variance 3</code> sollen auch schlechtere Pfade genutzt werden. Welche Bedingung gilt für einen Pfad?", "o": ["Er ist Feasible Successor und seine Metrik ist höchstens das Dreifache der besten.", "Er ist Feasible Successor und seine Metrik ist höchstens das Dreifache der Reported Distance.", "Er hat eine höhere AD als der Successor und ist deshalb zulässig.", "Alle Pfade ohne Summary werden genutzt, unabhängig von ihrer Metrik."], "c": [0], "e": "Feasible Successor und Metrik ≤ 3 × FD des Successors. Ein Pfad, der die Feasibility Condition nicht erfüllt, wird auch mit hoher Variance nicht benutzt."}, {"d": 1, "q": "Welches Protokoll und welche Multicast-Adresse nutzt EIGRP für IPv4?", "o": ["IP-Protokoll 88, 224.0.0.10", "TCP 179, 224.0.0.5", "UDP 520, 224.0.0.9", "IP-Protokoll 89, 224.0.0.6"], "c": [0], "e": "EIGRP läuft direkt auf IP (Protokoll 88) und nutzt 224.0.0.10 (IPv6: FF02::A). OSPF ist 89, RIP UDP 520, BGP TCP 179."}, {"d": 1, "q": "Was deutet der Eintrag in der Ausgabe an?", "x": "R1# show ip eigrp neighbors\nH   Address      Interface  Hold Uptime   SRTT  RTO   Q   Seq\n                          (sec)         (ms)        Cnt Num\n0   10.0.0.2     Gi0/0      12   00:05:10 0     5000  3   14", "o": ["Pakete werden nicht bestätigt, es liegt ein Problem auf dem Link zum Nachbarn vor.", "Die Nachbarschaft ist völlig in Ordnung, der Wert ist ein normaler Startwert.", "Der Nachbar läuft mit anderer AS-Nummer und wird deshalb verworfen.", "Der Nachbar ist als Stub konfiguriert und sendet nur Summary-Routen."], "c": [0], "e": "Die Queue-Zähler (Q Cnt 3) und das RTO von 5000 zeigen, dass Pakete nicht bestätigt werden. Ursachen sind typisch MTU-Probleme, ACLs oder ein Fehler beim Unicast-Transport."}, {"d": 1, "q": "Zwei OSPF-Nachbarn hängen dauerhaft im Zustand EXSTART. Was ist die häufigste Ursache?", "o": ["Unterschiedliche Interface-MTU", "Unterschiedliche Hello-Timer", "Falsche Area-ID", "Unterschiedliche Prozess-IDs"], "c": [0], "e": "MTU-Mismatch. Beim Austausch der DBD-Pakete passt die Größe nicht, die Nachbarn kommen nicht über EXSTART/EXCHANGE hinaus. Hello-Timer und Area-ID verhindern schon die Nachbarschaft davor."}, {"d": 1, "q": "Auf einem Broadcast-Segment zeigen zwei DROTHER-Router den Zustand 2WAY zueinander. Was bedeutet das?", "o": ["Das ist normal, nur zu DR und BDR wird die Adjacency FULL.", "Die Authentifizierung ist falsch, deshalb bleibt die Adjacency unvollständig.", "Die Router haben unterschiedliche MTUs und kommen nicht über 2WAY hinaus.", "Der DR ist ausgefallen und der BDR muss erst gewählt werden."], "c": [0], "e": "Normal. DROTHER-Router bleiben untereinander bei 2WAY und tauschen die Datenbank nur mit DR und BDR."}, {"d": 1, "q": "Welche Ursachen verhindern eine OSPF-Nachbarschaft? (Wähle zwei)", "o": ["Unterschiedliche Hello- und Dead-Intervalle", "Unterschiedliche Stub-Flags der Area", "Unterschiedliche Prozess-IDs", "Unterschiedliche Interface-Kosten"], "c": [0, 1], "e": "Hello/Dead und Stub-Flags müssen passen, dazu Area-ID, Subnetz, Authentifizierung. Die Prozess-ID gilt nur lokal, die Kosten sind pro Interface frei wählbar."}, {"d": 1, "q": "Ein neuer Router mit OSPF-Priorität 255 startet in einem Segment, in dem schon DR und BDR gewählt sind. Welche Rolle bekommt er?", "o": ["DROTHER, die Wahl ist nicht präemptiv.", "DR", "BDR", "Er erzwingt eine neue Wahl."], "c": [0], "e": "DROTHER. Die DR-Wahl ist nicht präemptiv. Erst wenn der DR ausfällt, rückt der BDR nach und eine Neuwahl bestimmt den BDR."}, {"t": "match", "d": 1, "q": "Ordne den OSPF-LSA-Typen die passende Aufgabe zu.", "l": ["Typ 1", "Typ 2", "Typ 3", "Typ 5"], "o": ["Router-LSA: Links des Routers innerhalb der Area", "Network-LSA: vom DR für ein Multi-Access-Segment", "Summary-LSA: Präfixe aus anderen Areas, vom ABR", "External-LSA: Routen aus Redistribution, vom ASBR"], "c": [0, 1, 2, 3], "e": "Typ 1 Router, Typ 2 Network (nur der DR erzeugt ihn), Typ 3 Summary (ABR), Typ 5 External (ASBR). Typ 4 beschreibt den Weg zum ASBR, Typ 7 ist der NSSA-External."}, {"d": 1, "q": "Welche Area lässt einen ASBR zu, blockiert aber Typ-5-LSAs vom Backbone?", "o": ["NSSA", "Stub", "Totally Stubby", "Backbone"], "c": [0], "e": "NSSA. Externe Routen des lokalen ASBR kommen als Typ 7 in die Area und werden am ABR in Typ 5 gewandelt. Typ-5-LSAs von außen kommen nicht hinein."}, {"d": 1, "q": "Area 2 hat keine direkte Verbindung zu Area 0, sondern hängt an Area 1. Wie löst du das?", "o": ["Mit einem Virtual Link über Area 1 zum Backbone", "Mit <code>area 2 stub</code>, damit Area 2 den Backbone nicht braucht", "Mit <code>ip ospf network point-to-point</code> auf dem Uplink von Area 2", "Mit einer zweiten OSPF-Prozess-ID und Redistribution zwischen beiden"], "c": [0], "e": "Virtual Link. Jede Area muss am Backbone hängen. Ein Virtual Link verbindet sie logisch über eine Transit-Area, ist aber nur eine Notlösung."}, {"d": 1, "q": "Welche Kosten bekommt ein 1-Gbit/s-Interface in OSPF mit der Standard-Referenzbandbreite?", "o": ["1", "10", "100", "1000"], "c": [0], "e": "1. Die Referenzbandbreite ist 100 Mbit/s, alles ab Fast Ethernet hat Kosten 1. Bei Gigabit-Netzen daher <code>auto-cost reference-bandwidth</code> auf allen Routern anpassen."}, {"d": 1, "q": "Welche Rolle hat der lokale Router?", "x": "R1# show ip ospf neighbor\nNeighbor ID  Pri  State        Dead Time  Address    Interface\n2.2.2.2      1    FULL/DR      00:00:34   10.0.0.2   Gi0/0\n3.3.3.3      1    FULL/BDR     00:00:36   10.0.0.3   Gi0/0\n4.4.4.4      1    2WAY/DROTHER 00:00:31   10.0.0.4   Gi0/0", "o": ["DROTHER", "DR", "BDR", "Backup-ASBR"], "c": [0], "e": "DROTHER. Er sieht DR und BDR als FULL und zu einem weiteren DROTHER nur 2WAY. Wäre er selbst DR oder BDR, wäre er zu allen anderen FULL."}, {"d": 1, "q": "Ein Loopback mit 10.1.1.1/24 wird in OSPF als 10.1.1.1/32 angekündigt. Wie erreichst du, dass /24 erscheint?", "o": ["<code>ip ospf network point-to-point</code> auf dem Loopback", "<code>passive-interface Loopback0</code> unter dem OSPF-Prozess", "<code>ip ospf cost 1</code> auf dem Loopback-Interface", "<code>area 0 range 10.1.1.0 255.255.255.0</code> am ABR"], "c": [0], "e": "Loopbacks gelten in OSPF als Host-Route (/32). Der Netzwerktyp <code>point-to-point</code> am Loopback übernimmt die konfigurierte Maske."}, {"d": 1, "q": "Wie wird OSPF für alle Interfaces einer Area auf MD5 umgestellt?", "o": ["<code>area 0 authentication message-digest</code> plus <code>ip ospf message-digest-key</code> am Interface", "<code>ip ospf authentication-key</code> mit Typ 7 am Interface, ohne Area-Befehl", "<code>enable secret</code> unter <code>router ospf</code> mit Schlüsselwort md5", "<code>neighbor … password</code> unter <code>router ospf</code> für jeden Nachbarn"], "c": [0], "e": "Area-Authentifizierung aktivieren und je Interface den Schlüssel setzen. Alternativ <code>ip ospf authentication message-digest</code> pro Interface. Mit Key-Chain geht auch HMAC-SHA."}, {"d": 1, "q": "Ein Interface ist mit <code>passive-interface</code> konfiguriert. Wie verhält sich OSPF?", "o": ["Keine Hellos und keine Nachbarn, das Netz wird aber weiter angekündigt.", "Das Netz wird nicht mehr angekündigt, weil das Interface keine Hellos sendet.", "Hellos werden gesendet, aber eingehende Hellos werden ignoriert.", "Das Interface wird administrativ heruntergefahren und Nachbarn fallen aus."], "c": [0], "e": "Keine Hellos, keine Nachbarn, aber das angeschlossene Netz bleibt in OSPF. Ideal für Interfaces zu Endgeräten."}, {"d": 1, "q": "OSPFv3 startet nicht und meldet keinen Router-ID. Was ist die Ursache?", "o": ["Keine IPv4-Adresse vorhanden, die Router-ID muss mit <code>router-id</code> gesetzt werden.", "OSPFv3 nutzt IPv6-Adressen als Router-ID und braucht deshalb eine globale Adresse.", "<code>ipv6 unicast-routing</code> ist aktiv, daher ist keine weitere Einstellung nötig.", "Die Prozess-ID fehlt, deshalb startet der Prozess nicht."], "c": [0], "e": "OSPFv3 nutzt weiterhin eine 32-Bit-Router-ID. Fehlt eine IPv4-Adresse, wird keine gewählt, und man setzt sie manuell."}, {"d": 1, "q": "Worin unterscheidet sich <code>default-information originate always</code> von der Variante ohne <code>always</code>?", "o": ["Mit <code>always</code> wird sie auch ohne eigene Default-Route angekündigt.", "Mit <code>always</code> wird die Default-Route als E1 statt als E2 gesendet.", "Ohne <code>always</code> wird die Default-Route nur in Stub-Areas verteilt.", "Es gibt keinen Unterschied, <code>always</code> ist nur ein Kommentar."], "c": [0], "e": "<code>always</code> kündigt die Default-Route unabhängig von der eigenen Tabelle an. Ohne das Schlüsselwort muss der ASBR selbst eine Default-Route haben."}, {"d": 1, "q": "Warum kann eine <code>distribute-list in</code> in OSPF nicht verhindern, dass ein Router eine Route lernt?", "o": ["Sie filtert nur, was in die Routing-Tabelle kommt, die LSDB bleibt unverändert.", "OSPF unterstützt keine Filter, weil alle Router dieselbe LSDB haben müssen.", "Sie wirkt nur auf Typ-5-LSAs und lässt Typ-3-LSAs unberührt.", "Sie funktioniert nur für OSPFv3, nicht für OSPFv2."], "c": [0], "e": "Die LSDB muss in einer Area identisch bleiben. Der Filter unterdrückt nur die Installation in der RIB auf diesem Router, die LSAs werden weiter geflutet."}, {"d": 1, "q": "Welcher Befehl zeigt Hello- und Dead-Timer, Netzwerktyp und die DR-Rolle eines Interfaces?", "o": ["<code>show ip ospf interface</code>", "<code>show ip ospf database</code>", "<code>show ip protocols</code>", "<code>show ip ospf neighbor detail</code>"], "c": [0], "e": "<code>show ip ospf interface</code> zeigt Timer, Netzwerktyp, Kosten, DR und BDR. <code>show ip ospf interface brief</code> gibt die Kurzform."}, {"d": 1, "q": "Welcher Pfad wird gewählt?", "x": "R1# show ip bgp 10.5.0.0/16\n  Path 1: 65010 65020, weight 100, localpref 300, from 10.0.0.2\n  Path 2: 65030 65040 65050, weight 200, localpref 100, from 10.0.1.2", "o": ["Pfad 2 (Weight 200)", "Pfad 1 (Local Preference 300)", "Pfad 1, weil der AS-Pfad kürzer ist", "Beide, per Load Balancing"], "c": [0], "e": "Pfad 2. Zuerst entscheidet das Weight (lokal, höher gewinnt), erst danach Local Preference. Weight 200 schlägt Weight 100 ohne Rücksicht auf LocPrf."}, {"d": 1, "q": "Warum gibt ein iBGP-Router von einem iBGP-Peer gelernte Routen nicht an einen anderen iBGP-Peer weiter?", "o": ["Zur Schleifenvermeidung, deshalb braucht man ein Full Mesh, Route Reflector oder Confederation.", "Weil der AS-Pfad beim iBGP-Weiterreichen verloren geht und Schleifen entstehen.", "Weil iBGP grundsätzlich keine Präfixe austauschen darf, nur Keepalives.", "Weil die Next Hops im iBGP-Teil des Netzes nicht erreichbar sind."], "c": [0], "e": "Split-Horizon-Regel von iBGP: Es gibt keinen AS-Pfad als Schleifenschutz innerhalb eines AS. Mit Route Reflectors oder Confederations wird die Regel kontrolliert aufgehoben."}, {"d": 1, "q": "Ein iBGP-Router lernt eine Route von einem eBGP-Peer, markiert sie aber als „inaccessible“ und nutzt sie nicht. Was ist die wahrscheinliche Ursache?", "o": ["Der Next Hop ist im AS nicht erreichbar, es fehlt <code>next-hop-self</code> am Grenzrouter.", "Die Route hat ein zu hohes Weight und wird deshalb ausgeblendet.", "Der AS-Pfad enthält die eigene AS-Nummer und wird verworfen.", "Die Community <code>no-export</code> ist gesetzt und blockiert die Weitergabe."], "c": [0], "e": "Der Next Hop bleibt bei der Weitergabe von eBGP nach iBGP unverändert. Mit <code>neighbor … next-hop-self</code> auf dem Grenzrouter setzt dieser sich selbst als Next Hop."}, {"d": 1, "q": "Ein eBGP-Peering über Loopbacks kommt nicht hoch. Es läuft über ein Zwischengerät. Welche zwei Dinge fehlen? (Wähle zwei)", "o": ["<code>neighbor … ebgp-multihop 2</code>", "<code>neighbor … update-source Loopback0</code>", "<code>neighbor … next-hop-self</code>", "<code>bgp always-compare-med</code>"], "c": [0, 1], "e": "eBGP-Pakete haben TTL 1, <code>ebgp-multihop</code> erhöht das. Mit <code>update-source</code> wird die Loopback als Quelle genutzt, damit die Adresse zum Nachbarn passt."}, {"d": 1, "q": "Was bedeutet der Zustand „Active“ in der Spalte für 10.0.1.2?", "x": "R1# show ip bgp summary\nNeighbor    V  AS    MsgRcvd MsgSent TblVer InQ OutQ Up/Down  State/PfxRcd\n10.0.0.2    4  65002 120     118     8      0   0    01:45:12 5\n10.0.1.2    4  65003 0       0       1      0   0    never    Active", "o": ["Der Router versucht eine TCP-Verbindung aufzubauen, es kommt aber keine zustande.", "Die Sitzung ist aufgebaut und der Nachbar sendet bereits Routen.", "Der Nachbar sendet bereits Updates, es fehlen nur noch Keepalives.", "Die Sitzung wurde administrativ abgeschaltet und wartet auf Freigabe."], "c": [0], "e": "Active heißt: TCP-Aufbau läuft, ohne Erfolg. Mögliche Ursachen sind keine Route zum Peer, falsche Adresse, ACL auf TCP 179 oder ein fehlendes Gegenstück. Bei 10.0.0.2 zeigt die Zahl 5 empfangene Präfixe, dort ist die Sitzung Established."}, {"d": 1, "q": "Welche Community verhindert, dass eine Route an eBGP-Peers weitergegeben wird?", "o": ["<code>no-export</code>", "<code>no-advertise</code>", "<code>local-as</code>", "<code>internet</code>"], "c": [0], "e": "<code>no-export</code> hält die Route im AS (bzw. in der Confederation). <code>no-advertise</code> gibt sie an gar keinen Peer weiter. Communities werden nur gesendet, wenn <code>send-community</code> aktiv ist."}, {"d": 1, "q": "Du willst, dass eingehender Verkehr aus dem Internet bevorzugt über ISP A kommt. Welches Mittel nutzt du?", "o": ["AS-Path-Prepending bei den Ankündigungen an ISP B", "Höhere Local Preference für ISP B auf allen Routern im eigenen AS", "Höheres Weight für ISP B auf allen Routern im eigenen AS", "<code>bgp deterministic-med</code> aktivieren und die Sitzung neu starten"], "c": [0], "e": "Prepending. Du machst den Pfad über ISP B länger und damit weniger attraktiv für Absender. Local Preference und Weight steuern ausgehenden Verkehr."}, {"d": 1, "q": "Welchen Verkehr steuert die Local Preference?", "o": ["Ausgehenden Verkehr, Wert wird innerhalb des AS per iBGP verteilt, höher ist besser (Standard 100).", "Eingehenden Verkehr, der Wert wird an eBGP-Peers weitergegeben, höher ist besser.", "Nur Verkehr innerhalb eines Routers, der Wert verlässt das Gerät nie.", "Eingehenden Verkehr, niedriger Wert ist besser, Standardwert ist 0."], "c": [0], "e": "Ausgehend. Die Local Preference wird innerhalb des AS mitgegeben, höher gewinnt. MED beeinflusst dagegen den Verkehr, der in dein AS kommt."}, {"d": 1, "q": "Wie wird der MED standardmäßig verglichen?", "o": ["Nur zwischen Pfaden vom selben Nachbar-AS, niedriger gewinnt.", "Zwischen allen Pfaden unabhängig vom Nachbar-AS, höher gewinnt.", "Nur innerhalb des eigenen AS, höher gewinnt, Standardwert 100.", "Gar nicht, solange eBGP genutzt wird, er gilt nur für iBGP."], "c": [0], "e": "Standardmäßig nur bei Pfaden desselben Nachbar-AS, kleinerer Wert gewinnt. Mit <code>bgp always-compare-med</code> werden alle verglichen."}, {"d": 1, "q": "Welche zwei Attribute schützen in einer Route-Reflector-Umgebung vor Schleifen?", "o": ["ORIGINATOR_ID und CLUSTER_LIST", "AS_PATH und NEXT_HOP", "LOCAL_PREF und MED", "WEIGHT und ORIGIN"], "c": [0], "e": "ORIGINATOR_ID (Router-ID des Ursprungs) und CLUSTER_LIST (IDs der durchlaufenen Cluster). Sieht ein Router die eigene ID darin, verwirft er die Route."}, {"d": 1, "q": "Nach einer Änderung der Inbound-Policy soll die BGP-Tabelle ohne Sitzungsabbruch neu bewertet werden. Welcher Befehl passt?", "o": ["<code>clear ip bgp 10.0.0.2 soft in</code>", "<code>clear ip bgp 10.0.0.2</code>", "<code>clear ip bgp * hard</code>", "<code>reload in 1</code>"], "c": [0], "e": "Der Soft-Reset nutzt Route Refresh und fordert die Routen neu an. Ein Hard-Reset (<code>clear ip bgp 10.0.0.2</code>) beendet die Sitzung."}, {"t": "match", "d": 1, "q": "Ordne den BGP-Attributen ihre Kategorie zu.", "l": ["ORIGIN", "LOCAL_PREF", "COMMUNITY", "MED"], "o": ["Well-known mandatory", "Well-known discretionary", "Optional transitive", "Optional non-transitive"], "c": [0, 1, 2, 3], "e": "ORIGIN gehört zu jedem Update (mandatory), LOCAL_PREF ist Pflicht im iBGP, wird aber nicht in jedem Update mitgeschickt (discretionary). COMMUNITY wird weitergegeben, wenn der Router es versteht, MED wird nicht an Dritt-AS weitergegeben."}, {"d": 1, "q": "Wie fasst du 10.0.0.0/16 bis 10.0.255.0/24 in BGP zu 10.0.0.0/16 zusammen und unterdrückst die Einzelrouten?", "o": ["<code>aggregate-address 10.0.0.0 255.255.0.0 summary-only</code>", "<code>network 10.0.0.0 mask 255.255.0.0 summary-only</code>", "<code>summary-address 10.0.0.0 255.255.0.0</code>", "<code>bgp auto-summary</code>"], "c": [0], "e": "<code>aggregate-address … summary-only</code>. Ohne <code>summary-only</code> werden Summary und Einzelrouten angekündigt."}, {"d": 1, "q": "Welcher AS-Pfad-Filter erfasst nur Routen, die im eigenen AS entstanden sind?", "o": ["<code>ip as-path access-list 1 permit ^$</code>", "<code>ip as-path access-list 1 permit .*</code>", "<code>ip as-path access-list 1 permit _65001_</code>", "<code>ip as-path access-list 1 permit ^65001</code>"], "c": [0], "e": "<code>^$</code>, der leere AS-Pfad. Lokal erzeugte Routen haben noch keine fremde AS-Nummer im Pfad."}, {"d": 1, "q": "<code>network 10.0.0.0 mask 255.255.0.0</code> kündigt das Netz nicht an. Welche Ursache liegt am nächsten?", "o": ["Es gibt keine exakt passende Route 10.0.0.0/16 in der Routing-Tabelle.", "BGP kennt keinen <code>network</code>-Befehl für Subnetze, nur für Klassen.", "Die Maske muss immer klassenbehaftet sein, hier eine /8.", "Das Netz muss zuvor in OSPF stehen, sonst wird es nicht angekündigt."], "c": [0], "e": "Das <code>network</code>-Statement braucht eine exakt passende Route (Präfix und Länge) in der RIB, z. B. eine Static auf Null0."}, {"d": 1, "q": "Welche Standard-Timer nutzt BGP, und welcher Wert gilt zwischen zwei Peers?", "o": ["Keepalive 60 s, Hold 180 s, es gilt der kleinere ausgehandelte Hold-Wert.", "Keepalive 30 s, Hold 90 s, es gilt der größere der beiden Hold-Werte.", "Keepalive 5 s, Hold 15 s, wie bei den Standard-Timern von EIGRP.", "Keepalive 10 s, Hold 40 s, es gilt der lokal konfigurierte Wert."], "c": [0], "e": "60/180. Beide Seiten senden ihren Hold-Wert im Open, der kleinere wird verwendet."}, {"d": 1, "q": "Ein Router nutzt IPv6-Routing nicht, obwohl IPv6-Adressen konfiguriert sind. Was fehlt?", "o": ["<code>ipv6 unicast-routing</code>", "<code>ipv6 enable</code> global", "<code>ip routing</code>", "<code>ipv6 cef</code> allein genügt"], "c": [0], "e": "<code>ipv6 unicast-routing</code>. Ohne diesen Befehl arbeitet der Router wie ein IPv6-Host und leitet keine Pakete weiter."}, {"d": 2, "q": "Welche Aufgabe hat ein P-Router in einem MPLS-Backbone?", "o": ["Er schaltet Pakete nur anhand des Labels und kennt keine Kundenrouten.", "Er hält die VRFs der Kunden.", "Er terminiert den Kundenanschluss und vergibt das VPN-Label.", "Er betreibt BGP mit dem CE-Router."], "c": [0], "e": "Der P-Router (Provider) vermittelt nur Labels. VRFs, VPN-Labels und das Peering mit dem Kunden liegen am PE-Router."}, {"t": "order", "d": 2, "q": "Bring die Schritte eines Pakets von CE1 nach CE2 durch ein MPLS-L3VPN in die richtige Reihenfolge.", "o": ["CE1 sendet ein IP-Paket an PE1", "PE1 setzt VPN-Label und Transport-Label (Push)", "Der P-Router tauscht das Transport-Label (Swap)", "Der vorletzte Router entfernt das Transport-Label (PHP)", "PE2 wertet das VPN-Label aus und entfernt es", "PE2 sendet das IP-Paket an CE2"], "e": "Das Paket kommt als IP an PE1, bekommt zwei Labels, wird im Kern per Swap weitergeleitet, und das Transport-Label fällt beim vorletzten Hop weg (PHP). PE2 nutzt das innere VPN-Label, um die richtige VRF zu finden."}, {"d": 2, "q": "Welches Protokoll verteilt in einem MPLS-Netz standardmäßig die Transport-Labels zwischen direkten Nachbarn?", "o": ["LDP (Port 646)", "RSVP (Port 179)", "BGP-LU (Port 646)", "NHRP (Port 646)"], "c": [0], "e": "LDP über TCP/UDP 646. Discovery per UDP-Hello an 224.0.0.2, die Sitzung dann per TCP. Alternativen wie RSVP-TE oder Segment Routing gibt es, LDP ist der klassische Standard."}, {"d": 2, "q": "Was bewirkt Penultimate Hop Popping (PHP)?", "o": ["Der vorletzte Router entfernt das Transport-Label, der Egress-PE spart einen Lookup.", "Das VPN-Label wird schon am ersten Router entfernt, damit nur noch IP läuft.", "Der erste Router sendet das Paket ohne Label an den Rest des Backbones.", "Der letzte Router vergibt ein neues Label, bevor er das Paket ausliefert."], "c": [0], "e": "Der Egress-PE bekommt das Paket mit nur noch dem VPN-Label und muss das Transport-Label nicht auswerten. Der PE kündigt dafür das Implicit-Null-Label (3) an."}, {"d": 2, "q": "Welchen Wert hat das Implicit-Null-Label, das PHP anfordert?", "o": ["3", "0", "1", "16"], "c": [0], "e": "3 (Implicit Null). Label 0 ist Explicit Null für IPv4, 1 ist Router Alert, ab 16 beginnen die normalen Labels."}, {"d": 2, "q": "Wie viele Byte kommen pro MPLS-Label zum Paket dazu, und worauf muss man bei L3VPN achten?", "o": ["4 Byte pro Label, bei zwei Labels 8 Byte mehr, MTU im Kern anpassen.", "2 Byte pro Label, es ist keine Anpassung der MTU nötig.", "16 Byte pro Label, nur im VPN, im Kern nicht.", "Keine, Labels stehen in der Layer-2-Hülle und brauchen keinen Platz."], "c": [0], "e": "4 Byte je Label. Mit Transport- und VPN-Label sind das 8 Byte mehr. Die MTU im Kern anheben (z. B. <code>mpls mtu 1508</code> oder Interface-MTU erhöhen), sonst gibt es Fragmentierung oder Drops."}, {"d": 2, "q": "Welche zwei Befehle brauchst du mindestens, damit ein Interface MPLS mit LDP spricht? (Wähle zwei)", "o": ["<code>mpls ip</code> am Interface", "<code>mpls label protocol ldp</code> (global oder am Interface)", "<code>mpls bgp forwarding</code> am Interface", "<code>ip vrf forwarding</code> am Interface"], "c": [0, 1], "e": "<code>mpls ip</code> schaltet Label-Switching ein, <code>mpls label protocol ldp</code> wählt das Verteilprotokoll (Standard je nach Plattform). <code>mpls bgp forwarding</code> ist für eBGP-Labels."}, {"d": 2, "q": "Welche Tabelle nutzt ein Router, um beim Eingang eines gelabelten Pakets den Ausgang zu bestimmen?", "o": ["LFIB (<code>show mpls forwarding-table</code>)", "FIB (<code>show ip cef</code>), die Tabelle für IP-Pakete ohne Label", "RIB (<code>show ip route</code>), die alle gelernten Routen enthält", "NHRP-Tabelle (<code>show ip nhrp</code>), die Tunnelziele zuordnet"], "c": [0], "e": "Die LFIB. Die FIB (CEF) gilt für IP-Pakete, die LFIB für Pakete mit Label. Am Ingress-PE schaut man in die FIB, am P-Router in die LFIB."}, {"d": 2, "q": "Zwei Kunden nutzen beide 10.0.0.0/24, ihre Routen werden per MP-BGP zwischen PEs ausgetauscht. Wie bleiben die Präfixe unterscheidbar?", "o": ["Durch den Route Distinguisher (RD), der vor das IPv4-Präfix gesetzt wird (VPNv4).", "Durch den Route Target (RT), der vor das Präfix gestellt wird.", "Durch unterschiedliche AS-Nummern der beiden PE-Router.", "Durch NAT am PE, das beide Kunden auf getrennte Adressen übersetzt."], "c": [0], "e": "Der RD macht aus 10.0.0.0/24 ein eindeutiges VPNv4-Präfix (z. B. 65000:100:10.0.0.0/24). Er sagt nichts darüber, wer die Route importiert, das macht der RT."}, {"d": 2, "q": "Was steuert der Route Target (RT) in einem L3VPN?", "o": ["Welche VPN-Routen in welche VRF exportiert und importiert werden.", "Wie Präfixe im Backbone eindeutig werden, durch Voranstellen eines Werts.", "Welches Label der P-Router für das VPN verwendet.", "Welche Kosten OSPF am PE für Routen aus der VRF nutzt."], "c": [0], "e": "Der RT ist eine Extended Community: Export-RT markiert Routen beim Weg ins VPNv4, Import-RT bestimmt, was eine VRF aufnimmt. Über RTs baut man auch Hub-and-Spoke oder Extranets."}, {"d": 2, "q": "Zwei PEs tauschen VPNv4-Routen aus, die VRF des Kunden bekommt aber nichts. Welcher Befehl fehlt typischerweise für die RTs?", "o": ["<code>neighbor … send-community extended</code> in der VPNv4-Address-Family", "<code>neighbor … next-hop-self all</code> im IPv4-Teil der BGP-Konfiguration", "<code>mpls ldp router-id Loopback0 force</code> auf beiden PEs", "<code>ip vrf default-mode</code> in der globalen Konfiguration"], "c": [0], "e": "Route Targets sind Extended Communities. In der VPNv4-Address-Family ist <code>send-community extended</code> in der Regel Pflicht (wird bei <code>address-family vpnv4</code> meist automatisch gesetzt, aber nicht in jeder Konfiguration). Ohne RT kein Import."}, {"d": 2, "q": "Welche Labels trägt ein Paket im Kern eines L3VPN?", "o": ["Ein äußeres Transport-Label (LDP) und ein inneres VPN-Label (MP-BGP)", "Nur ein Label, das der P-Router für die gesamte Strecke vergibt", "Nur das VPN-Label, das der PE für die VRF vergeben hat", "Pro Hop ein zusätzliches Label, das vom Vorgänger aufgestapelt wird"], "c": [0], "e": "Zwei Labels. Das Transport-Label bringt das Paket zum Egress-PE, das VPN-Label wählt dort die Kunden-VRF. Die P-Router sehen nur das äußere."}, {"d": 2, "q": "Welcher Befehl zeigt die VPNv4-Routen mit RD und Label auf einem PE?", "o": ["<code>show bgp vpnv4 unicast all</code>", "<code>show ip route vrf all</code>", "<code>show mpls ldp bindings</code>", "<code>show ip bgp neighbors</code>"], "c": [0], "e": "<code>show bgp vpnv4 unicast all</code> (auch <code>show ip bgp vpnv4 all</code>) zeigt RD, RT-Info und Label. <code>show ip route vrf …</code> zeigt dagegen die Routen in der VRF-RIB."}, {"d": 2, "q": "Beide Kunden-Standorte nutzen AS 65001, der Provider verbindet sie per eBGP. CE1 lehnt Routen von CE2 ab. Warum, und wie hilfst du?", "o": ["AS-Path-Loop-Prevention, Lösung mit <code>as-override</code> am PE oder <code>allowas-in</code> am CE", "Der RT stimmt nicht, <code>send-community</code> fehlt am PE.", "Die MTU ist zu klein, <code>mpls mtu</code> muss angepasst werden.", "Die LDP-Sitzung zwischen CE und PE fehlt und muss konfiguriert werden."], "c": [0], "e": "Der AS-Pfad enthält 65001 zweimal. Mit <code>as-override</code> ersetzt der PE die Kunden-AS durch die eigene, oder der CE akzeptiert mit <code>allowas-in</code> die eigene AS im Pfad."}, {"d": 2, "q": "Wozu dient bei OSPF als PE-CE-Protokoll ein Sham Link?", "o": ["Er lässt den MPLS-Pfad wie einen Intra-Area-Pfad wirken und schlägt damit die Backdoor-Strecke.", "Er ersetzt LDP zwischen den PEs durch eine direkte Verbindung der Areas.", "Er verschlüsselt den OSPF-Verkehr zwischen PE und CE.", "Er teilt die VRFs eines Kunden auf mehrere PEs auf."], "c": [0], "e": "Ohne Sham Link erscheinen Routen über den MPLS-Backbone als Inter-Area (Typ 3), eine Backdoor-Strecke in der Area wäre immer besser. Der Sham Link behandelt den MPLS-Pfad wie eine Intra-Area-Verbindung."}, {"d": 2, "q": "Welche Erweiterung stellt sicher, dass ein PE eine aus dem Backbone gelernte OSPF-Route nicht wieder in das Backbone zurückgibt?", "o": ["Das DN-Bit (Down-Bit) im LSA", "Das Tag-Bit im OSPF-Header", "Das Overflow-Bit im EIGRP-Paket", "Die Domain-ID in LDP"], "c": [0], "e": "Das DN-Bit. Ein PE setzt es beim Weitergeben von VPN-Routen als Typ-3-LSA, ein anderer PE im selben Standort ignoriert solche LSAs und verhindert Schleifen."}, {"d": 2, "q": "Welche Aufgabe hat NHRP in DMVPN?", "o": ["Es ordnet Tunnel-Adressen den NBMA-(Underlay-)Adressen zu, ähnlich ARP.", "Es verschlüsselt den Tunnel und tauscht die IPsec-Schlüssel aus.", "Es verteilt Routen zwischen Hub und Spokes wie ein IGP.", "Es regelt den Spanning Tree über den GRE-Tunnel."], "c": [0], "e": "NHRP, die Zuordnung Tunnel-IP ↔ öffentliche IP. Spokes registrieren sich am Hub (NHS), und für direkte Spoke-zu-Spoke-Tunnel fragen sie per NHRP-Resolution nach."}, {"t": "match", "d": 2, "q": "Ordne den DMVPN-Phasen ihr Verhalten zu.", "l": ["Phase 1", "Phase 2", "Phase 3"], "o": ["Nur Hub-and-Spoke, Spokes mit p2p-GRE oder mGRE, kein direkter Spoke-Verkehr", "Spoke-zu-Spoke-Tunnel, Hub darf aber keine Summary senden und muss Next Hop erhalten", "Spoke-zu-Spoke per NHRP-Redirect und Shortcut, Summarization am Hub möglich"], "c": [0, 1, 2], "e": "Phase 1 leitet immer über den Hub. Phase 2 baut direkte Tunnel, braucht aber vollständige Routen mit Original-Next-Hop. Phase 3 nutzt NHRP Redirect (Hub) und Shortcut (Spoke), dadurch geht auch Summarization."}, {"d": 2, "q": "Was gehört in eine Phase-3-Konfiguration am Hub und an den Spokes?", "o": ["Hub: <code>ip nhrp redirect</code>, Spokes: <code>ip nhrp shortcut</code>", "Hub: <code>ip nhrp shortcut</code>, Spokes: <code>ip nhrp redirect</code>", "Auf beiden Seiten <code>ip nhrp map multicast dynamic</code>", "Auf beiden Seiten <code>no ip next-hop-self eigrp</code>"], "c": [0], "e": "Der Hub sendet beim Weiterleiten eines Spoke-Pakets einen Redirect, der Spoke installiert mit Shortcut den direkten NHRP-Eintrag. Die Befehle stehen am Tunnel-Interface."}, {"d": 2, "q": "Welcher Tunnel-Modus wird an Hub und Spokes in einem mGRE-DMVPN benutzt?", "o": ["<code>tunnel mode gre multipoint</code>", "<code>tunnel mode ipip</code>", "<code>tunnel mode gre ip</code> mit <code>tunnel destination</code>", "<code>tunnel mode ipsec ipv4</code>"], "c": [0], "e": "<code>gre multipoint</code> (mGRE) braucht keine feste <code>tunnel destination</code>, die Ziele kommen aus NHRP. Beim Spoke in Phase 1 kann auch p2p-GRE genutzt werden."}, {"d": 2, "q": "Warum kann ein Spoke in <code>show dmvpn</code> den Zustand NHRP zeigen, ohne dass der Tunnel auf UP kommt?", "o": ["Die NHRP-Registrierung am Hub ist fehlgeschlagen, es fehlt die Zuordnung zum Hub.", "IKE-Phase 1 ist fehlgeschlagen, der Tunnel wird nicht verschlüsselt.", "Das ESP-Protokoll wird vom Underlay geblockt.", "Der Hub nutzt einen anderen Routing-Prozess als die Spokes."], "c": [0], "e": "NHRP. Der Zustand beschreibt, wo es hängt: IKE bedeutet Probleme bei ISAKMP, IPSEC bei der IPsec-SA, NHRP bei der Registrierung. Erst bei UP ist alles aufgebaut."}, {"d": 2, "q": "Wie stellst du bei EIGRP-DMVPN in Phase 2 sicher, dass der Hub den Original-Next-Hop beibehält?", "o": ["<code>no ip next-hop-self eigrp 100</code> und <code>no ip split-horizon eigrp 100</code> am Hub-Tunnel", "<code>ip next-hop-self eigrp 100</code> am Hub-Tunnel, Split Horizon bleibt aktiv", "<code>ip split-horizon eigrp 100</code> an den Spokes und am Hub", "<code>redistribute connected</code> am Hub-Tunnel, ohne Änderung am Next Hop"], "c": [0], "e": "EIGRP setzt den Hub standardmäßig als Next Hop und wendet Split Horizon an. Beides muss am Hub-Tunnel aus, damit Spokes Routen der anderen Spokes mit dem richtigen Next Hop lernen."}, {"d": 2, "q": "Welche OSPF-Einstellung braucht ein Hub im DMVPN, damit er DR wird, und die Spokes nicht?", "o": ["<code>ip ospf network broadcast</code> auf allen Tunneln, Priorität 0 an den Spokes", "<code>ip ospf network point-to-point</code> auf allen Tunneln", "<code>ip ospf network non-broadcast</code> mit Priorität 255 an den Spokes", "Prozess-ID 0 am Hub"], "c": [0], "e": "Netzwerktyp Broadcast und Priorität 0 auf den Spokes, damit der Hub DR wird. Spokes dürfen nicht DR/BDR werden, weil sie nicht zu allen anderen direkte Verbindungen haben."}, {"d": 2, "q": "Welcher Befehl bindet ein IPsec-Profil an den DMVPN-Tunnel?", "o": ["<code>tunnel protection ipsec profile NAME</code>", "<code>crypto map NAME</code> am Tunnel", "<code>ip nhrp authentication NAME</code>", "<code>ipsec transform NAME</code>"], "c": [0], "e": "<code>tunnel protection ipsec profile NAME</code> am Tunnel-Interface. Bei DMVPN nutzt man Profile statt Crypto Maps, damit dynamische Spokes ohne feste Gegenstelle auskommen."}, {"d": 2, "q": "Welche Ports und Protokolle muss das Underlay für DMVPN mit IPsec und NAT-Traversal durchlassen?", "o": ["GRE (IP-Protokoll 47), ESP (50), UDP 500 und UDP 4500", "TCP 179 und UDP 3784 für BGP und BFD", "UDP 646 und IP-Protokoll 89 für LDP und OSPF", "TCP 22 und TCP 443 für SSH und HTTPS"], "c": [0], "e": "GRE (47), ESP (50), IKE (UDP 500) und bei NAT-T UDP 4500. Fehlt eines, kommt der Tunnel nicht oder nur ohne Daten hoch."}, {"d": 2, "q": "Der DMVPN-Tunnel steht, aber große Dateien laufen sehr langsam, kleine Pakete gehen. Was ist die wahrscheinliche Ursache?", "o": ["Die effektive MTU durch GRE und IPsec ist zu klein, es fehlt <code>ip tcp adjust-mss</code>.", "Der NHRP-Network-ID stimmt zwischen Hub und Spoke nicht überein.", "Die Hello-Timer des Routingprotokolls sind zu kurz eingestellt.", "Auf dem Hub fehlt <code>ip nhrp redirect</code> für Phase 3."], "c": [0], "e": "GRE und IPsec fügen Header hinzu. Typisch sind Tunnel-MTU 1400 und <code>ip tcp adjust-mss 1360</code>, damit TCP-Pakete passen und nicht fragmentiert oder verworfen werden."}, {"d": 2, "q": "Was unterscheidet VRF-Lite von MPLS L3VPN?", "o": ["VRF-Lite hat weder Labels noch MP-BGP, jede VRF braucht eine eigene Verbindung und ein eigenes Routing.", "VRF-Lite braucht LDP zwischen den Routern, ein L3VPN braucht es nicht.", "VRF-Lite unterstützt keine überlappenden Adressräume zwischen den VRFs.", "VRF-Lite braucht Route Distinguisher und MP-BGP, L3VPN nur statische Routen."], "c": [0], "e": "Ohne MPLS gibt es keine Transport-Labels. Die Trennung entsteht pro Hop durch VRF an jedem Interface oder Subinterface, mit eigenem IGP oder BGP je VRF."}, {"d": 2, "q": "Welchen Eintrag erwartest du im Output, wenn der Tunnel zum Hub vollständig steht?", "x": "Spoke1# show dmvpn\nInterface: Tunnel0, Type:Spoke, NHRP Peers:1\n # Ent  Peer NBMA Addr  Peer Tunnel Add  State  UpDn Tm Attrb\n ----- --------------- --------------- ----- -------- -----\n     1 203.0.113.1     10.99.0.1       UP    00:12:44     S", "o": ["Attrb <code>S</code>, State <code>UP</code> beim Hub-Eintrag", "State <code>NHRP</code> beim Hub", "State <code>IKE</code> bei allen Einträgen", "Kein Eintrag, nur <code>D</code> für Dynamic"], "c": [0], "e": "UP mit Attribut S (Static) für den konfigurierten Hub. Dynamische Spoke-Einträge haben D, und im Zustand UP sind IKE, IPsec und NHRP fertig."}, {"d": 2, "q": "Wie nennt man den Hub, bei dem sich Spokes in DMVPN registrieren?", "o": ["NHS (Next Hop Server)", "NHC (Next Hop Client)", "DR (Designated Router)", "RP (Rendezvous Point)"], "c": [0], "e": "NHS. Der Hub ist der Next Hop Server, die Spokes sind Next Hop Clients und registrieren ihre NBMA-Adresse bei ihm."}, {"d": 2, "q": "Der Hub kennt über <code>ip nhrp map multicast dynamic</code> was genau?", "o": ["Er sendet Multicast (z. B. Routing-Hellos) an alle registrierten Spokes.", "Er verschlüsselt Multicast mit IPsec.", "Er lernt dynamisch die Tunnel-Adressen der Spokes aus DHCP.", "Er verteilt LDP-Labels an die Spokes."], "c": [0], "e": "Damit repliziert der Hub Multicast, etwa OSPF- oder EIGRP-Hellos, an jeden dynamisch registrierten Spoke. Ohne den Befehl bilden sich über den Tunnel keine IGP-Nachbarschaften."}, {"d": 2, "q": "Ein Spoke registriert sich nicht am Hub. Welche NHRP-Parameter müssen auf Hub und Spoke übereinstimmen? (Wähle zwei)", "o": ["<code>ip nhrp network-id</code>", "<code>ip nhrp authentication</code> (falls gesetzt)", "<code>tunnel key</code> muss gleich sein, NHRP-ID ist egal", "Der Hello-Timer des Routingprotokolls"], "c": [0, 1], "e": "Network-ID und NHRP-Authentifizierung müssen passen, ebenso Tunnel-Key, falls eingesetzt. Hello-Timer betreffen erst das Routing nach erfolgreicher Registrierung."}, {"d": 2, "q": "Welche Aussage zu Route Distinguisher (RD) und Route Target (RT) stimmt?", "o": ["Der RD macht Präfixe eindeutig, der RT steuert den Import in die VRFs.", "Der RD steuert den Import in die VRF, der RT macht Präfixe eindeutig.", "RD und RT erfüllen dieselbe Aufgabe, einer von beiden genügt.", "Der RD filtert Routen am CE, der RT bestimmt die BGP-Pfadwahl am PE."], "c": [0], "e": "RD = Eindeutigkeit, RT = Steuerung. RD und RT werden oft verwechselt, auch wenn sie gleich aussehen können."}, {"d": 3, "q": "Welche Ports nutzen RADIUS und TACACS+?", "o": ["RADIUS UDP 1812/1813 (Auth/Accounting), TACACS+ TCP 49", "RADIUS TCP 49 und TACACS+ UDP 1812, Accounting 1813.", "RADIUS TCP 1812 und TACACS+ UDP 49, jeweils ohne Accounting-Port.", "Beide Protokolle UDP 1645 für Authentifizierung und Accounting."], "c": [0], "e": "RADIUS nutzt UDP 1812 für Authentifizierung und 1813 für Accounting (ältere Geräte 1645/1646), TACACS+ TCP 49. TACACS+ verschlüsselt den gesamten Body, RADIUS nur das Passwort."}, {"d": 3, "q": "Mit <code>aaa authentication login default group tacacs+ local</code>: Wann greift die lokale Datenbank?", "o": ["Nur wenn der TACACS+-Server nicht erreichbar ist, nicht bei einer Ablehnung.", "Immer zusätzlich zu TACACS+, falls der Server den Login ablehnt.", "Nur bei Konsolenzugriff, an den VTY-Lines nie.", "Nie, <code>local</code> am Ende der Liste wird vom Router ignoriert."], "c": [0], "e": "Die nächste Methode wird nur bei „ERROR“ (kein Server erreichbar) befragt. Lehnt der Server ab (FAIL), ist der Login gescheitert. Wer das lokal absichern will, nutzt <code>local-case</code> oder eine lokale Backup-Anmeldung."}, {"d": 3, "q": "Du konfigurierst <code>aaa authentication login VTY-LIST group tacacs+ local</code>, aber die VTY-Anmeldung nutzt weiter die lokale Datenbank. Was fehlt?", "o": ["<code>login authentication VTY-LIST</code> unter <code>line vty 0 15</code>", "<code>aaa authorization exec VTY-LIST</code> global", "<code>transport input telnet</code> unter den VTY-Lines", "<code>enable secret</code> mit Typ 9"], "c": [0], "e": "Eine benannte Methodenliste gilt nur, wenn sie an der Line zugewiesen ist. Die Liste <code>default</code> wird dagegen automatisch überall genutzt, wo nichts anderes steht."}, {"d": 3, "q": "Was bewirkt <code>aaa authorization exec default group tacacs+ if-authenticated</code>?", "o": ["Der Server legt das Privilegienlevel fest, bei Serverausfall wird der Benutzer trotzdem zugelassen.", "Jeder einzelne Befehl wird vom Server vor der Ausführung freigegeben.", "Der Benutzer erhält immer Level 15, unabhängig von der Server-Antwort.", "Es wird Accounting für den Beginn der Exec-Sitzung gestartet."], "c": [0], "e": "Authorization für die Exec-Sitzung: Der Server liefert Level (<code>priv-lvl</code>). <code>if-authenticated</code> erlaubt den Zugang, wenn die Authentifizierung schon erfolgreich war. Einzelbefehle autorisiert man mit <code>aaa authorization commands</code>."}, {"d": 3, "q": "Mit welchem Befehl testest du, ob ein AAA-Server Benutzername und Passwort akzeptiert, ohne dich anzumelden?", "o": ["<code>test aaa group tacacs+ user pass new-code</code>", "<code>debug aaa test</code> mit den Zugangsdaten als Argument", "<code>show aaa servers test</code> mit Benutzername und Passwort", "<code>aaa test tacacs+ user pass</code> im Konfigurationsmodus"], "c": [0], "e": "<code>test aaa group …</code> sendet eine Testanfrage. Mit <code>show aaa servers</code> siehst du dazu Statistik und den Zustand (UP/DEAD) der Server."}, {"d": 3, "q": "Wozu dient <code>aaa accounting commands 15 default start-stop group tacacs+</code>?", "o": ["Zur Protokollierung jedes Befehls auf Level 15 am Server", "Zur Autorisierung von Level-15-Befehlen durch den Server", "Zum Wechsel in den Enable-Modus mit einem Server-Passwort", "Zum Sperren von Level-15-Benutzern bei Fehlversuchen"], "c": [0], "e": "Accounting. Am Server steht, wer wann welchen Befehl eingegeben hat. Das ist die Nachvollziehbarkeit, die Autorisierung entscheidet dagegen, ob der Befehl erlaubt ist."}, {"d": 3, "q": "Eine Extended ACL soll Antwortverkehr nur zulassen, wenn die TCP-Verbindung aus dem Inneren aufgebaut wurde. Welches Schlüsselwort nutzt du?", "o": ["<code>established</code>", "<code>reflect</code>", "<code>log</code>", "<code>fragments</code>"], "c": [0], "e": "<code>established</code> prüft auf ACK- oder RST-Flag und lässt Antworten zu. Es ist kein echtes Zustandsprotokoll, dafür bräuchte man reflexive ACLs oder eine Firewall."}, {"d": 3, "q": "Nach welcher Regel wertet ein Router eine ACL aus?", "o": ["Von oben nach unten, die erste passende Zeile gilt, am Ende steht ein implizites deny.", "Alle Zeilen werden geprüft, und die spezifischste Zeile gewinnt.", "Von unten nach oben, die letzte passende Zeile gewinnt.", "Alle permit-Zeilen werden vor den deny-Zeilen ausgewertet."], "c": [0], "e": "Top-down, First Match. Deshalb stehen spezifische Regeln oben. Ohne passende Zeile greift das implizite <code>deny ip any any</code>."}, {"d": 3, "q": "Die Zeile <code>permit tcp any any eq 22</code> steht hinter <code>deny ip 10.0.0.0 0.255.255.255 any</code>. SSH von 10.1.1.1 wird nicht erlaubt. Warum?", "o": ["Die <code>deny</code>-Zeile steht oben und trifft zuerst.", "TCP 22 braucht <code>established</code>.", "Das implizite deny blockiert SSH grundsätzlich.", "Wildcard-Masken sind immer invers zu invertieren."], "c": [0], "e": "Die erste passende Zeile gewinnt: Der Verkehr von 10.1.1.1 trifft das <code>deny</code>. Die permit-Zeile müsste vorher stehen, oder die ACL wird umsortiert."}, {"d": 3, "q": "Wie fügst du in eine benannte Extended ACL eine Zeile an einer bestimmten Stelle ein?", "o": ["Mit einer Sequenznummer, etwa <code>15 permit tcp host 10.1.1.1 any eq 22</code>", "Mit <code>insert</code> vor der Zeile", "Die ACL löschen und neu anlegen ist die einzige Möglichkeit", "Mit <code>ip access-list resequence move</code>"], "c": [0], "e": "Benannte und nummerierte ACLs (im Named-Modus bearbeitet) unterstützen Sequenznummern. Mit <code>ip access-list resequence</code> lässt sich die Nummerierung glätten."}, {"d": 3, "q": "Ein Interface hat <code>ip access-group BLOCK in</code>. Wann wird die ACL angewendet?", "o": ["Auf Pakete, die in das Interface kommen, bevor sie weitergeleitet werden.", "Auf Pakete, die das Interface verlassen, nachdem geroutet wurde.", "Nur auf Verkehr, der vom Router selbst erzeugt wird.", "Auf Pakete beim Eingang und beim Ausgang des Interfaces."], "c": [0], "e": "<code>in</code> prüft eingehende Pakete vor der Routing-Entscheidung, <code>out</code> erst danach beim Verlassen des Interfaces. Vom Router selbst erzeugter Verkehr wird nie durch eine ausgehende ACL gefiltert."}, {"d": 3, "q": "Zeitlich begrenzter Zugang: Eine ACL-Zeile soll nur werktags 8 bis 18 Uhr gelten. Was brauchst du?", "o": ["<code>time-range</code> mit <code>periodic weekdays 8:00 to 18:00</code> und <code>time-range</code> in der ACL-Zeile", "<code>ip access-list timer 8-18</code> in der ACL", "<code>archive time-range</code> mit Stundenangabe", "Eine NTP-Synchronisation genügt, die ACL gilt dann automatisch zeitgesteuert."], "c": [0], "e": "Eine Zeitbereichs-Definition (<code>time-range</code>) und der Bezug in der ACL-Zeile. Dazu muss die Uhr stimmen, also NTP."}, {"d": 3, "q": "Wie sperrst du Verwaltungszugriff auf die VTY-Lines für alle Hosts außer 10.0.0.0/24?", "o": ["Standard-ACL mit <code>permit 10.0.0.0 0.0.0.255</code> und <code>access-class</code> an den VTY-Lines", "<code>ip access-group</code> am Verwaltungsinterface in Richtung <code>in</code>", "<code>ip access-class</code> unter <code>router ospf</code> mit der ACL", "<code>access-list 1 deny any</code> direkt unter den VTY-Lines"], "c": [0], "e": "<code>access-class</code> unter den VTY-Lines. <code>ip access-group</code> gilt für Interfaces, ein Interface-ACL würde auch Transitverkehr treffen."}, {"d": 3, "q": "Welche Aussage zu IPv6-ACLs stimmt?", "o": ["Am Ende stehen implizit zwei <code>permit</code>-Zeilen für ND (nd-na, nd-ns) vor dem <code>deny</code>.", "Sie nutzen wie IPv4 Wildcard-Masken in jeder Zeile.", "Sie werden mit <code>ip access-group</code> am Interface angewendet.", "Sie blockieren Neighbor Discovery und brauchen immer eine Ausnahme."], "c": [0], "e": "Implizit sind <code>permit icmp any any nd-na</code> und <code>nd-ns</code> sowie am Ende <code>deny ipv6 any any</code>. IPv6-ACLs werden mit <code>ipv6 traffic-filter</code> angewendet und nutzen Präfixlängen. Wer ND blockiert, bricht IPv6 auf dem Segment."}, {"d": 3, "q": "Welche Wirkung hat uRPF im Strict-Modus?", "o": ["Das Paket wird verworfen, wenn die Quelle nicht über das Eingangsinterface erreichbar ist.", "Das Paket wird verworfen, wenn die Quelle in keiner Route der Tabelle steht.", "Das Paket wird nur protokolliert und trotzdem weitergeleitet.", "Alle Pakete mit privaten Quelladressen werden grundsätzlich erlaubt."], "c": [0], "e": "Strict: Reverse-Path-Check gegen das Eingangsinterface (<code>ip verify unicast source reachable-via rx</code>). Loose (<code>any</code>) prüft nur, ob die Quelle irgendwo in der Tabelle steht."}, {"d": 3, "q": "uRPF Strict verwirft legitimen Verkehr an einem Multihoming-Router mit asymmetrischem Routing. Welche Option passt besser?", "o": ["Loose Mode: <code>ip verify unicast source reachable-via any</code>", "<code>ip verify unicast source reachable-via rx allow-default</code>", "<code>ip verify unicast source reachable-via rx</code> mit höherer Metrik", "uRPF abschalten und eine ACL mit denselben Adressen bauen"], "c": [0], "e": "Bei asymmetrischen Pfaden kommen Pakete über ein anderes Interface als das, über das die Rückroute läuft. Loose prüft nur, ob die Quelle überhaupt erreichbar ist, und ist der passende Kompromiss."}, {"d": 3, "q": "Was schützt CoPP (Control Plane Policing)?", "o": ["Die Control Plane des Routers vor Überlast, durch Begrenzung des Verkehrs zum Router selbst.", "Den Datenverkehr zwischen den Interfaces, der durch den Router fließt", "Die Management-Zugänge mit Passwort und Login-Sperre", "Nur BGP-Sitzungen, alle anderen Protokolle bleiben ungeschützt"], "c": [0], "e": "CoPP wendet Policing auf Pakete an, die für den Router selbst bestimmt sind (SSH, Routing-Protokolle, ICMP …), mit MQC am virtuellen Control-Plane-Interface."}, {"t": "order", "d": 3, "q": "Bring die Schritte zur Konfiguration von CoPP in die richtige Reihenfolge.", "o": ["ACL für den zu begrenzenden Verkehr anlegen", "<code>class-map</code> mit <code>match access-group</code> erstellen", "<code>policy-map</code> mit <code>police</code> anlegen", "In <code>control-plane</code> mit <code>service-policy input</code> anwenden"], "e": "ACL, Class-Map, Policy-Map, Anwenden am Control-Plane-Interface. Der Aufbau ist wie bei jeder MQC-Policy, nur die Anwendung läuft über <code>control-plane</code>."}, {"d": 3, "q": "Die Policy-Map zeigt für die Klasse SSH viele <code>exceeded</code>-Pakete. Was bedeutet das?", "x": "R1# show policy-map control-plane\n Class-map: COPP-SSH (match-all)\n   packets 4210\n   police: cir 8000 bps, bc 1500 bytes\n     conformed 120 packets; actions: transmit\n     exceeded  4090 packets; actions: drop", "o": ["Mehr SSH-Verkehr zum Router als erlaubt, der Überschuss wurde verworfen.", "Die ACL der Klasse passt auf keinen Verkehr, daher wird alles gezählt.", "Die Policy ist am Control-Plane-Interface nicht angewendet.", "Der Router hat zu wenig Speicher für die Warteschlange."], "c": [0], "e": "Das Policing hat den Überschuss (Exceed) aufgrund der Rate verworfen. Zu hohe Werte können auf einen Scan oder Angriff hindeuten oder auf eine zu niedrige Rate."}, {"d": 3, "q": "Welche Schutzfunktion lässt Router Advertisements nur von Ports zu, an denen ein echter Router hängt?", "o": ["RA Guard", "DHCPv6 Guard", "IPv6 Source Guard", "ND Inspection"], "c": [0], "e": "RA Guard. Eine Policy mit <code>device-role router</code> am Uplink und <code>device-role host</code> an Endgeräteports verwirft Router Advertisements von Hosts."}, {"d": 3, "q": "Welches Feature verhindert, dass ein Client Pakete mit gefälschter IPv6-Quelladresse sendet?", "o": ["IPv6 Source Guard (auf Basis der Binding-Tabelle)", "RA Guard, es verwirft Router Advertisements von Hosts", "DHCPv6 Guard, es verwirft Server-Nachrichten von Clients", "IPv6 Destination Guard, es prüft die Zieladresse gegen die ND-Tabelle"], "c": [0], "e": "Source Guard prüft die Quelladresse gegen die Binding-Tabelle des IPv6-Snooping. Fehlt eine Zuordnung, wird der Verkehr verworfen."}, {"d": 3, "q": "Was ist die Grundlage für ND Inspection und IPv6 Source Guard?", "o": ["Die Binding-Tabelle aus IPv6 Snooping mit Adresse, MAC, Port und VLAN", "Die DHCPv4-Snooping-Tabelle mit den MAC-Adressen", "Die CAM-Tabelle des Switches mit MAC und Port", "Die NHRP-Tabelle mit Tunnel- und NBMA-Adressen"], "c": [0], "e": "IPv6 Snooping lernt Bindungen aus ND- und DHCPv6-Verkehr und pflegt sie in einer Tabelle, auf die Inspection und Source Guard aufsetzen."}, {"d": 3, "q": "Ein Angreifer an einem Access-Port sendet gefälschte DHCPv6-Antworten. Welche Funktion hilft?", "o": ["DHCPv6 Guard mit <code>device-role client</code> am Port", "RA Guard mit <code>device-role host</code> am Access-Port", "Port Security mit <code>maximum 1</code> am Port", "IPv6 Prefix Guard allein, ohne weitere Funktion"], "c": [0], "e": "DHCPv6 Guard blockt Server-Nachrichten (Advertise, Reply) von Ports mit Rolle Client. Nur der Port zum echten Server oder Relay bekommt <code>device-role server</code>."}, {"d": 3, "q": "Wie beschränkst du den IPv6-Zugriff auf die VTY-Lines auf ein Verwaltungsnetz?", "o": ["<code>ipv6 access-class NAME in</code> unter <code>line vty 0 15</code>", "<code>ip access-class NAME in</code> mit IPv6-ACL", "<code>ipv6 traffic-filter NAME in</code> unter den Lines", "<code>ipv6 access-group NAME</code> unter <code>line vty</code>"], "c": [0], "e": "Für IPv6 heißt der Befehl an den Lines <code>ipv6 access-class</code>. <code>ip access-class</code> gilt nur für IPv4, <code>ipv6 traffic-filter</code> wird an Interfaces angewendet."}, {"d": 3, "q": "Was bedeutet <code>enable secret 9</code> in der Konfiguration?", "o": ["Das Passwort ist mit scrypt gehasht.", "Es ist mit AES-128 verschlüsselt.", "Es ist als Klartext mit Typ 9 markiert.", "Es ist ein Typ-7-Passwort mit Salt."], "c": [0], "e": "Typ 9 = scrypt, Typ 8 = PBKDF2-SHA256, beides sicher. Typ 5 (MD5) gilt als veraltet, Typ 7 ist umkehrbar und kein echter Schutz."}, {"d": 3, "q": "Mit welchem Befehl lässt du SSH-Zugriff nur noch Version 2 mit Schlüssellänge 2048 zu?", "o": ["<code>ip ssh version 2</code> und <code>crypto key generate rsa modulus 2048</code>", "<code>ssh enable 2048</code> im globalen Konfigurationsmodus", "<code>transport input telnet ssh2</code> unter den VTY-Lines", "<code>ip ssh rsa 2048 version 2</code> im globalen Konfigurationsmodus"], "c": [0], "e": "Version 2 per <code>ip ssh version 2</code>, den RSA-Schlüssel mit <code>crypto key generate rsa modulus 2048</code>. Dazu Hostname und Domain-Name, sonst lässt sich der Schlüssel nicht erzeugen."}, {"d": 3, "q": "Telnet soll an den VTY-Lines verboten werden. Welche Zeile erreicht das?", "o": ["<code>transport input ssh</code>", "<code>no transport telnet</code>", "<code>transport output ssh</code>", "<code>access-class SSH in</code>"], "c": [0], "e": "<code>transport input ssh</code> unter den VTY-Lines erlaubt nur SSH für eingehende Verbindungen."}, {"d": 3, "q": "Das Privilege-Level 5 soll nur <code>show ip route</code> und <code>ping</code> zusätzlich zum Level 1 erlauben. Wie vergibst du den Befehl?", "o": ["<code>privilege exec level 5 show ip route</code>", "<code>privilege level 5 show ip route</code>", "<code>aaa authorization level 5 show</code>", "<code>enable level 5 allow show ip route</code>"], "c": [0], "e": "<code>privilege exec level 5 …</code> weist dem Level den Befehl zu. Der Benutzer meldet sich mit diesem Level an oder wechselt mit <code>enable 5</code>."}, {"d": 3, "q": "Wie begrenzt du Anmeldeversuche nach 3 Fehlern innerhalb von 60 Sekunden mit 120 Sekunden Sperre?", "o": ["<code>login block-for 120 attempts 3 within 60</code>", "<code>login block 3 60 120</code>", "<code>security passwords max-attempts 3</code>", "<code>aaa lockout 120</code>"], "c": [0], "e": "<code>login block-for 120 attempts 3 within 60</code>. Während der Sperre sind SSH und Telnet nicht erreichbar, es sei denn, eine ACL ist in <code>login quiet-mode access-class</code> eingetragen."}, {"d": 3, "q": "Eine ACL soll nur bestimmte Hosts auch während der Login-Sperre zulassen. Was brauchst du?", "o": ["<code>login quiet-mode access-class NAME</code>", "<code>login allow-list NAME</code>", "<code>access-class NAME out</code> auf den VTY-Lines", "<code>login on-failure log</code>"], "c": [0], "e": "<code>login quiet-mode access-class</code> verweist auf eine ACL mit Hosts, die auch während der Sperre Verbindungen aufbauen dürfen."}, {"d": 3, "q": "Am Internet-Interface kommen Pakete mit Quelladressen aus dem eigenen Präfix 198.51.100.0/24 an. Wie blockierst du das?", "o": ["Eingehende ACL am WAN-Interface mit <code>deny 198.51.100.0 0.0.0.255</code> (oder uRPF)", "Ausgehende ACL am LAN-Interface mit <code>permit any</code> am Ende", "<code>passive-interface</code> am WAN-Interface unter dem Routingprotokoll", "Eine Standard-ACL mit <code>permit any</code> in beide Richtungen"], "c": [0], "e": "Pakete aus dem Internet dürfen nie eine Quelladresse aus dem eigenen Adressraum haben. Eine eingehende ACL oder uRPF am WAN-Interface verwirft sie bevor sie weitergeleitet werden."}, {"d": 4, "q": "Welche SNMP-Version bietet Authentifizierung und Verschlüsselung?", "o": ["SNMPv3 mit <code>priv</code>", "SNMPv2c mit Community", "SNMPv1 mit <code>auth</code>", "SNMPv2 mit <code>noAuthNoPriv</code>"], "c": [0], "e": "SNMPv3. v1 und v2c schicken die Community im Klartext. v3 kennt drei Stufen: noAuthNoPriv, authNoPriv (Authentifizierung) und authPriv (zusätzlich Verschlüsselung)."}, {"t": "order", "d": 4, "q": "Bring die Schritte zur Einrichtung von SNMPv3 mit authPriv auf einem Router in die richtige Reihenfolge.", "o": ["View anlegen (<code>snmp-server view</code>)", "Gruppe mit <code>priv</code> und View anlegen (<code>snmp-server group</code>)", "Benutzer mit Authentifizierung und Verschlüsselung anlegen (<code>snmp-server user</code>)", "Trap-Ziel konfigurieren (<code>snmp-server host</code>)"], "e": "Erst die Sichtbarkeit (View), dann die Gruppe mit Sicherheitsstufe, dann der Benutzer, am Ende das Ziel für Traps."}, {"d": 4, "q": "Was unterscheidet einen SNMP-Trap von einem Inform?", "o": ["Ein Inform wird vom Manager bestätigt und bei Verlust wiederholt, ein Trap nicht.", "Ein Trap nutzt TCP und wird bestätigt, ein Inform nutzt UDP und nicht.", "Ein Trap wird vom Manager aktiv angefordert, ein Inform vom Agenten gesendet.", "Ein Inform läuft nur mit SNMPv1, ein Trap nur mit SNMPv3."], "c": [0], "e": "Trap = ungesichert (UDP 162), Inform = bestätigt. Informs gibt es ab SNMPv2c, belasten Gerät und Manager aber stärker."}, {"d": 4, "q": "Ein NMS fragt per SNMP die Interface-Zähler ab. Welche Struktur beschreibt, welche Werte ein Gerät liefert?", "o": ["Die MIB mit OIDs", "Die RIB", "Die CAM-Tabelle", "Das Syslog-Facility-Schema"], "c": [0], "e": "Die MIB (Management Information Base) definiert die Objekte, jedes Objekt hat eine OID im Baum. Das NMS fragt per Get oder GetBulk nach OIDs."}, {"d": 4, "q": "Wie begrenzt du den SNMP-Zugriff mit einer Community auf einen Manager, und nur lesend?", "o": ["<code>snmp-server community SECRET ro 10</code> mit ACL 10 für den Manager", "<code>snmp-server community SECRET rw 10</code> mit ACL 10 für den Manager", "<code>snmp-server host 10.0.0.5 SECRET</code> und Zugriff nur für Traps", "<code>snmp-server enable traps</code> für alle Ereignisse"], "c": [0], "e": "<code>ro</code> = nur lesen, die Zahl am Ende verweist auf eine ACL, die den Zugriff auf den Manager einschränkt."}, {"d": 4, "q": "Ab welchem Syslog-Level werden mit <code>logging trap warnings</code> Meldungen an den Server geschickt?", "o": ["Level 4 und schwerer (0 bis 4)", "Nur Level 4", "Level 4 und leichter (4 bis 7)", "Level 5 und schwerer"], "c": [0], "e": "Warnings (4) und alle schwereren Stufen (0–3: Emergency, Alert, Critical, Error). Das Level gilt als Obergrenze der Zahl: bis einschließlich 4."}, {"d": 4, "q": "Welche Konfiguration sorgt dafür, dass Syslog-Meldungen an den Server immer mit der Loopback-Adresse als Quelle gesendet werden?", "o": ["<code>logging source-interface Loopback0</code>", "<code>logging host 10.0.0.5 Loopback0</code>", "<code>logging trap source Loopback0</code>", "<code>service source-interface Loopback0</code>"], "c": [0], "e": "<code>logging source-interface</code>. So bleibt die Absenderadresse stabil, auch wenn ein physisches Interface ausfällt, und ACLs am Server lassen sich einfach halten."}, {"d": 4, "q": "Meldungen in <code>show logging</code> haben nur eine Uptime statt eines Datums. Was fehlt?", "o": ["<code>service timestamps log datetime msec</code>", "<code>logging buffered datetime</code>", "<code>clock timezone UTC 0</code>", "<code>logging origin-id</code>"], "c": [0], "e": "Standard sind Zeitstempel in Uptime. Mit <code>service timestamps log datetime</code> kommen Datum und Zeit dazu, vorausgesetzt die Uhr stimmt (NTP)."}, {"d": 4, "q": "Ein Debug soll nur Pakete von 10.1.1.1 betreffen, damit der Router nicht überlastet wird. Wie gehst du vor?", "o": ["<code>access-list 100 permit ip host 10.1.1.1 any</code> und <code>debug ip packet 100</code>", "<code>debug ip packet all</code> ohne weitere Einschränkung", "<code>logging debug 10.1.1.1</code> im globalen Konfigurationsmodus", "<code>terminal monitor 10.1.1.1</code> in der VTY-Sitzung"], "c": [0], "e": "<code>debug ip packet</code> mit ACL begrenzt die Ausgabe auf passende Pakete. Ohne ACL kann es einen produktiven Router lahmlegen. Alternativ <code>debug condition</code>."}, {"d": 4, "q": "Debug-Ausgaben erscheinen nicht in der SSH-Sitzung. Was fehlt?", "o": ["<code>terminal monitor</code>", "<code>logging console debugging</code>", "<code>line vty 0 15</code> mit <code>logging synchronous</code>", "<code>service debug-output</code>"], "c": [0], "e": "Auf der Konsole werden Meldungen standardmäßig angezeigt, in VTY-Sitzungen erst nach <code>terminal monitor</code>."}, {"d": 4, "q": "Wie schaltest du alle laufenden Debugs sofort aus?", "o": ["<code>undebug all</code>", "<code>no logging</code>", "<code>debug off</code>", "<code>reload</code>"], "c": [0], "e": "<code>undebug all</code> (oder <code>no debug all</code>). Bei starker Last ist es oft die erste Handlung."}, {"d": 4, "q": "Ein Client bekommt beim DHCP keine Adresse, der Server steht in einem anderen Subnetz. Was fehlt am Gateway?", "o": ["<code>ip helper-address 10.0.0.5</code> am Interface, das die Clients bedient", "<code>ip dhcp relay</code> im globalen Konfigurationsmodus des Gateways", "<code>ip dhcp pool</code> am Gateway mit dem Subnetz der Clients", "<code>ip forward-protocol udp 67</code> am Server-Interface"], "c": [0], "e": "<code>ip helper-address</code> leitet den DHCP-Broadcast als Unicast an den Server weiter und trägt die Gateway-Adresse (giaddr) ein, nach der der Server den Pool auswählt."}, {"d": 4, "q": "Welche Funktion von DHCP-Option 82 gibt dem Server Hinweise, aus welchem Port eine Anfrage kam?", "o": ["Relay Agent Information", "Domain Name", "Client Identifier", "Vendor Class"], "c": [0], "e": "Option 82 (Relay Agent Information) wird vom Relay oder Snooping-Switch eingefügt, etwa Circuit-ID und Remote-ID."}, {"d": 4, "q": "Welche Adressen nimmst du von einem DHCP-Pool aus?", "o": ["Statisch vergebene, etwa Gateway und Server, mit <code>ip dhcp excluded-address</code>", "Alle Adressen, die Option 82 tragen, damit sie nicht doppelt vergeben werden", "Nur die Broadcast-Adresse, alles andere wird automatisch erkannt", "Keine, DHCP erkennt Konflikte nicht und braucht dazu keine Einstellung"], "c": [0], "e": "<code>ip dhcp excluded-address</code> nimmt Adressen aus der Vergabe. Der Router erkennt Konflikte mit <code>ip dhcp conflict logging</code> und per Ping, aber das ersetzt nicht die Planung."}, {"d": 4, "q": "Ein IPv6-Client bekommt per SLAAC eine Adresse und per DHCPv6 nur DNS-Server. Wie heißt dieser Modus?", "o": ["Stateless DHCPv6 (Other-Config-Flag im RA)", "Stateful DHCPv6, bei dem der Server auch die Adresse vergibt", "DHCPv6 Prefix Delegation, bei der ein Präfix an einen Router geht", "DHCPv6 Relay, bei dem ein Router Anfragen weiterleitet"], "c": [0], "e": "Stateless DHCPv6: Die Adresse kommt per SLAAC (A-Flag), weitere Optionen per DHCPv6 (O-Flag). Bei Stateful (M-Flag) vergibt der Server auch die Adresse."}, {"d": 4, "q": "Welche Flags im Router Advertisement stehen für Managed und Other Config?", "o": ["M-Flag und O-Flag", "A-Flag und L-Flag", "R-Flag und P-Flag", "S-Flag und D-Flag"], "c": [0], "e": "M = Managed (Adresse per DHCPv6), O = Other Config (nur weitere Optionen per DHCPv6). A (Autonomous) und L (On-Link) beziehen sich auf das Präfix."}, {"d": 4, "q": "Wie leitet ein Ro
