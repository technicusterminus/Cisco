uter DHCPv6-Anfragen zu einem Server in einem anderen Subnetz weiter?", "o": ["<code>ipv6 dhcp relay destination 2001:db8::10</code> am Client-Interface", "<code>ip helper-address 2001:db8::10</code> am Interface zu den Clients", "<code>ipv6 dhcp server relay</code> im globalen Konfigurationsmodus", "<code>ipv6 nd relay 2001:db8::10</code> am Interface zu den Clients"], "c": [0], "e": "<code>ipv6 dhcp relay destination</code> am Interface zu den Clients. <code>ip helper-address</code> gilt nur für IPv4."}, {"d": 4, "q": "Welchen Zweck hat eine IP-SLA-Operation vom Typ <code>icmp-echo</code>?", "o": ["Sie misst regelmäßig Erreichbarkeit und Antwortzeit eines Ziels.", "Sie spiegelt Pakete an einen Analyzer zur späteren Auswertung.", "Sie begrenzt die ICMP-Rate, die der Router verarbeiten darf.", "Sie lernt MAC-Adressen und legt sie in der CAM-Tabelle ab."], "c": [0], "e": "IP SLA sendet aktiv Testpakete und wertet Ergebnis und Zeit aus. Mit einem Track-Objekt kann man darauf reagieren, etwa eine Route entfernen."}, {"t": "order", "d": 4, "q": "Bring die Konfigurationsschritte für eine Backup-Route abhängig von einer IP-SLA-Messung in die richtige Reihenfolge.", "o": ["<code>ip sla 1</code> mit <code>icmp-echo</code> und <code>frequency</code> anlegen", "<code>ip sla schedule 1 life forever start-time now</code>", "<code>track 1 ip sla 1 reachability</code>", "<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1</code>"], "e": "Messung anlegen, starten, Track-Objekt daran hängen und die Route mit dem Track verbinden. Ohne <code>ip sla schedule</code> misst nichts."}, {"d": 4, "q": "Der IP-SLA-Test läuft nicht, <code>show ip sla statistics</code> zeigt keine Messungen. Was fehlt am wahrscheinlichsten?", "o": ["<code>ip sla schedule</code>", "<code>ip sla enable responder</code> am Quellrouter", "<code>logging trap ip-sla</code>", "<code>ip sla reaction-configuration</code>"], "c": [0], "e": "Ohne Schedule bleibt die Operation inaktiv. Ein Responder wird nur für bestimmte Typen (z. B. UDP-Jitter) am Zielgerät gebraucht."}, {"d": 4, "q": "Für welche Messung braucht man einen IP-SLA-Responder am Ziel?", "o": ["UDP-Jitter", "ICMP-Echo", "HTTP-GET", "DNS"], "c": [0], "e": "UDP-Jitter benötigt am Ziel einen IP-SLA-Responder (<code>ip sla responder</code>), der Zeitstempel zurückgibt. ICMP-Echo, HTTP und DNS funktionieren mit normalen Zielen."}, {"d": 4, "q": "Welche Zeile gehört in eine Flexible-NetFlow-Konfiguration?", "o": ["Flow Record, Flow Exporter und Flow Monitor, am Interface angewendet", "Nur ein Flow Monitor, mit <code>ip flow ingress</code> am Interface", "Eine ACL mit dem Schlüsselwort <code>flow</code> am Interface", "Ein SNMP-Trap für jeden einzelnen erfassten Flow"], "c": [0], "e": "Flexible NetFlow besteht aus Record (welche Felder), Exporter (wohin) und Monitor (verbindet beides). Der Monitor wird mit <code>ip flow monitor NAME input</code> am Interface angewendet."}, {"d": 4, "q": "Welchen Befehl nutzt du, um die aktuellen Flows in NetFlow auf dem Router zu sehen?", "o": ["<code>show flow monitor NAME cache</code>", "<code>show ip flow export</code> allein", "<code>show ip cache flow raw</code> für Flexible NetFlow", "<code>show netflow records</code>"], "c": [0], "e": "<code>show flow monitor NAME cache</code> zeigt den Cache eines Flexible-NetFlow-Monitors. <code>show flow exporter</code> prüft den Exporter."}, {"d": 4, "q": "Was ist IPFIX?", "o": ["Er ist der IETF-Nachfolger von NetFlow v9 und nutzt UDP 4739.", "Er ist Ciscos proprietärer Nachfolger von SNMP und nutzt TCP 161.", "Er ist ein Syslog-Standard für strukturierte Meldungen.", "Er ist ein Sampling-Verfahren für SPAN-Sitzungen."], "c": [0], "e": "IPFIX (RFC 7011) ist die standardisierte Version von NetFlow v9 mit Templates. Der Standardport des Collectors ist UDP 4739."}, {"d": 4, "q": "Welche Vorteile bietet Flexible NetFlow gegenüber klassischem NetFlow?", "o": ["Frei wählbare Schlüssel- und Nicht-Schlüsselfelder, mehrere parallele Monitore", "Es zeichnet jedes Paket einzeln auf, statt Flows zusammenzufassen.", "Es braucht keinen Collector, die Daten bleiben auf dem Router.", "Es funktioniert nur für IPv6, klassisches NetFlow nur für IPv4."], "c": [0], "e": "Flexible NetFlow erlaubt eigene Records, mehrere Exporter und Monitore. Klassisches NetFlow hat feste Felder."}, {"d": 4, "q": "Eine Reihe von Flows wird nicht erfasst, weil das Interface nur in eine Richtung überwacht wird. Was ist die Ursache?", "o": ["Der Monitor ist nur mit <code>input</code> angewendet, die Gegenrichtung braucht <code>output</code>.", "Der Exporter nutzt UDP, deshalb gehen Flows in der Gegenrichtung verloren.", "Das Template fehlt am Collector und wird nie nachgeliefert.", "Es fehlt <code>ip flow-cache timeout</code> auf dem Interface."], "c": [0], "e": "NetFlow erfasst Verkehr pro Interface und Richtung. Für beide Richtungen muss der Monitor mit <code>input</code> und <code>output</code> angewendet werden."}, {"d": 4, "q": "Welche Ausgabe zeigt, ob der Collector Flows bekommt?", "o": ["<code>show flow exporter</code> mit Statistik der gesendeten Pakete", "<code>show ip route</code> mit den Routen zum Collector", "<code>show ip nhrp</code> mit den Einträgen des Tunnels", "<code>show logging</code> mit den letzten Meldungen"], "c": [0], "e": "<code>show flow exporter</code> (<code>statistics</code>) zeigt gesendete Pakete und Fehler. Steigen die Zähler nicht, liegt das Problem am Monitor oder am Interface."}, {"d": 4, "q": "Welche Funktion bietet Catalyst Center Assurance?", "o": ["Es bewertet Netz, Clients und Anwendungen mit Health Scores und zeigt Issues.", "Es konfiguriert nur VLANs und Interfaces auf den Switches.", "Es ersetzt den RADIUS-Server und prüft Anmeldungen.", "Es ist ein reiner Syslog-Server ohne Analyse oder Bewertung."], "c": [0], "e": "Assurance sammelt Telemetrie (u. a. SNMP, Syslog, NetFlow, Streaming), berechnet Health Scores und bietet Issue-Analyse mit Vorschlägen, Path Trace und Sensor-Tests."}, {"d": 4, "q": "Wie nennt man bei Catalyst Center die Funktion, die den Weg eines Pakets zwischen zwei Endpunkten visuell nachverfolgt?", "o": ["Path Trace", "Intent Trace", "Flow Sniffer", "Topology Replay"], "c": [0], "e": "Path Trace. Es zeigt Hops, Interfaces, ACLs und wo ein Paket stoppt. Das ist besonders nützlich bei der Fehlersuche."}, {"d": 4, "q": "Warum ist NTP für Syslog, Debug und Assurance wichtig?", "o": ["Ereignisse verschiedener Geräte lassen sich nur mit gleicher Zeit zuordnen.", "Syslog funktioniert ohne NTP überhaupt nicht und verwirft Meldungen.", "Debug-Ausgaben werden ohne gleiche Uhrzeit verworfen.", "Assurance akzeptiert Geräte ohne NTP-Lizenz nicht."], "c": [0], "e": "Ohne gleiche Zeit lassen sich Ereignisketten nicht rekonstruieren. Für Zertifikate und Protokolle wie Kerberos ist sie ebenso wichtig."}, {"d": 4, "q": "Welcher Befehl zeigt, ob ein Router per NTP synchronisiert ist und welchen Stratum er hat?", "o": ["<code>show ntp status</code>", "<code>show clock detail</code> allein", "<code>show ntp config</code>", "<code>show ntp servers stratum</code>"], "c": [0], "e": "<code>show ntp status</code> zeigt <i>Clock is synchronized</i> und den Stratum. <code>show ntp associations</code> zeigt die Peers, ein <code>*</code> markiert die gewählte Quelle."}, {"d": 4, "q": "Was zeigt das Sternchen vor einem Peer in <code>show ntp associations</code>?", "x": "R1# show ntp associations\n  address       ref clock   st  when  poll reach delay  offset  disp\n *~10.0.0.1     .GPS.       1   34    64   377   0.9    0.12    0.4\n +~10.0.0.2     10.0.0.1    2   12    64   377   1.1    0.31    0.5\n  ~10.0.0.3     .INIT.      16  -     64   0     0.0    0.00    15937", "o": ["Dieser Peer ist die Quelle, mit der der Router synchronisiert ist.", "Der Peer ist nicht erreichbar und wird daher markiert.", "Der Peer ist ein Backup und wird erst bei Ausfall genutzt.", "Der Peer ist authentifiziert, aber noch nicht synchronisiert."], "c": [0], "e": "<code>*</code> = Sync-Quelle, <code>+</code> = Kandidat, <code>~</code> = konfiguriert. Ohne Stern gibt es keine Synchronisation."}, {"d": 4, "q": "Wie sicherst du die NTP-Synchronisation gegen gefälschte Server ab?", "o": ["NTP-Authentifizierung mit <code>ntp authenticate</code>, Key und <code>ntp trusted-key</code>", "Eine ACL auf Port 123 am Interface reicht in jedem Fall aus.", "<code>ntp master</code> auf allen Geräten, damit alle gleich vertrauen.", "<code>clock set</code> nach jedem Neustart von Hand ausführen."], "c": [0], "e": "Mit Schlüsseln (MD5/SHA) und Trusted-Key. Auf dem Client zusätzlich <code>ntp server … key N</code>, sonst wird nicht authentifiziert."}, {"d": 4, "q": "Wie sicherst du die Übertragung von Konfigurationsdateien statt über TFTP ab?", "o": ["SCP über SSH mit <code>ip scp server enable</code>", "FTP im aktiven Modus mit Benutzername und Passwort", "TFTP mit zusätzlichem Passwort auf dem Server", "RCP mit Benutzername und Passwort"], "c": [0], "e": "SCP nutzt SSH und verschlüsselt die Datei. TFTP und FTP senden im Klartext, TFTP hat keine Authentifizierung."}, {"d": 4, "q": "Der Router soll bei jeder Konfigurationsänderung automatisch eine Sicherung ablegen. Welche Funktion nutzt du?", "o": ["Die Archive-Funktion: <code>archive</code>, <code>path flash:backup</code> und <code>write-memory</code>", "<code>kron policy-list</code> mit anschließendem Reload des Geräts", "<code>logging buffered</code> mit dem Befehl <code>archive</code> im Puffer", "<code>file prompt quiet</code> mit Speichern nach jeder Änderung"], "c": [0], "e": "Mit <code>archive</code> (Pfad, <code>time-period</code> oder <code>write-memory</code>) legt IOS automatisch Versionen ab. Mit <code>configure replace</code> lässt sich auf eine Version zurück."}, {"d": 4, "q": "Welche Möglichkeit gibt es, eine Konfiguration atomar auf einen gesicherten Stand zurückzusetzen?", "o": ["<code>configure replace flash:backup.cfg</code>", "<code>copy flash:backup.cfg running-config</code> ersetzt ebenfalls komplett", "<code>reload in 5</code>", "<code>erase startup-config</code>"], "c": [0], "e": "<code>configure replace</code> ersetzt die laufende Konfiguration vollständig. <code>copy … running-config</code> verschmilzt dagegen nur."}, {"d": 4, "q": "Eine Änderung an der Verwaltungs-ACL kann den Zugang kappen. Wie sicherst du dich ab?", "o": ["<code>reload in 10</code> vorher, danach nach Test mit <code>reload cancel</code>", "<code>write memory</code> nach der Änderung, damit sie dauerhaft gilt", "<code>terminal length 0</code> vor der Änderung der ACL", "<code>logging synchronous</code> an der VTY-Line setzen"], "c": [0], "e": "Der verzögerte Neustart lädt bei Verlust des Zugangs die gespeicherte Startup-Konfiguration. Die Änderung darf deshalb vorher nicht gespeichert werden."}, {"d": 4, "q": "Wie zeigst du nur die Zeilen der laufenden Konfiguration, die „ospf“ enthalten?", "o": ["<code>show running-config | include ospf</code>", "<code>show running-config ospf</code>", "<code>show ospf running</code>", "<code>show running-config | exclude ospf</code>"], "c": [0], "e": "Mit <code>| include</code>. Für Abschnitte nutzt man <code>| section ospf</code>, bei Blöcken ist das lesbarer."}, {"d": 4, "q": "Wozu dient <code>logging synchronous</code> unter <code>line console 0</code>?", "o": ["Meldungen unterbrechen die Eingabe nicht, die angefangene Zeile wird neu angezeigt.", "Meldungen werden sofort mit dem Syslog-Server synchronisiert.", "Logs werden direkt auf den Server geschrieben, nicht auf die Konsole.", "Es verhindert, dass Debug-Ausgaben auf der Konsole erscheinen."], "c": [0], "e": "Es gibt die Eingabezeile nach einer Meldung wieder aus. Das ist reine Bequemlichkeit."}, {"d": 4, "q": "Ein Router soll Syslog-Meldungen bis Level 6 lokal puffern. Welche Zeile genügt?", "o": ["<code>logging buffered 16384 informational</code>", "<code>logging trap informational</code>", "<code>logging console informational</code>", "<code>logging local 6</code>"], "c": [0], "e": "<code>logging buffered</code> legt einen Puffer im RAM an. <code>logging trap</code> gilt für den Server, <code>logging console</code> für die Konsole."}, {"d": 4, "q": "Der Router erkennt IP-SLA-Fehler, aber die Route bleibt im Routing. Wo suchst du?", "o": ["Beim Track-Objekt: <code>reachability</code> gesetzt, und ist die Route mit <code>track</code> verknüpft?", "Bei der ACL der VTY-Lines, die den Zugriff auf den Router steuert", "Bei der SNMP-Community, die das Track-Objekt abfragt", "Beim Syslog-Level, der die Ereignisse des Track-Objekts filtert"], "c": [0], "e": "Die Kette ist Messung, Track-Objekt, Route. Ein Fehler in einem Glied (z. B. <code>state</code> statt <code>reachability</code>, oder fehlender Bezug <code>track 1</code>) lässt die Route stehen."}, {"d": 1, "q": "Welche Aussage über 172.16.0.0/16 stimmt?", "x": "R1# show ip route ospf\nO E2  172.16.0.0/16 [110/20] via 10.0.0.2, 00:10:12, Gi0/0\nO IA  192.168.5.0/24 [110/65] via 10.0.0.2, 00:10:12, Gi0/0\nO     10.9.0.0/24 [110/2] via 10.0.0.2, 00:10:12, Gi0/0", "o": ["Eine redistribuierte Route mit E2-Metrik 20, die auf dem Weg nicht wächst.", "Es ist eine Intra-Area-Route aus Area 0 mit Metrik 20.", "Es ist eine Summary-Route des ABR (Typ 3) aus einer anderen Area.", "Es ist eine EIGRP-Route mit der AD 110."], "c": [0], "e": "<code>O E2</code> steht für OSPF External Typ 2, also Redistribution. <code>O IA</code> wäre Inter-Area (Typ 3). Bei E2 bleibt die Metrik 20, egal wie weit der Weg im OSPF-Netz ist."}, {"d": 1, "q": "Was ist die Ursache für diese Meldung?", "x": "%DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.0.0.2 (GigabitEthernet0/0) is down: K-value mismatch", "o": ["Die beiden Router nutzen unterschiedliche K-Werte.", "Die AS-Nummern der beiden Router sind verschieden.", "Die Hello-Timer passen nicht zusammen.", "Die Interface-MTU der beiden Router unterscheidet sich."], "c": [0], "e": "Der Text nennt es direkt: K-value mismatch. Standardwerte sind K1 = K3 = 1, die anderen 0. Wer sie ändert, muss es auf beiden Seiten tun."}, {"d": 1, "q": "Was ist die Ursache für diese Meldung auf R1?", "x": "%OSPF-4-ERRRCV: Received invalid packet: Mismatch Authentication type. Input packet specified type 0, we use type 2 from 10.0.0.2, GigabitEthernet0/0", "o": ["Der Nachbar sendet ohne Authentifizierung, R1 verlangt MD5.", "Die Area-ID der beiden Router ist verschieden.", "Die Prozess-ID der beiden Router passt nicht zusammen.", "Die Interface-Kosten der beiden Router sind verschieden."], "c": [0], "e": "Typ 0 = keine Authentifizierung, Typ 2 = MD5 (Typ 1 = Klartext). R1 erwartet MD5, der Nachbar sendet ohne. Es entsteht keine Nachbarschaft."}, {"d": 1, "q": "Welches Kriterium wählt den besten Pfad für 10.5.0.0/16?", "x": "R1# show ip bgp 10.5.0.0\n   Network      Next Hop    Metric LocPrf Weight Path\n * 10.5.0.0/16   10.0.1.2        50    100      0 65020 i\n *>10.5.0.0/16   10.0.0.2        20    100      0 65020 i", "o": ["Der niedrigere MED (20 gegenüber 50)", "Die höhere Local Preference", "Der kürzere AS-Pfad", "Das höhere Weight"], "c": [0], "e": "Weight, Local Preference, AS-Pfad-Länge und Origin sind gleich. Beide Pfade kommen aus demselben Nachbar-AS 65020, deshalb wird der MED verglichen, und 20 ist besser als 50."}, {"d": 1, "q": "Was bedeutet der Eintrag für den Nachbar 10.0.1.2?", "x": "R1# show ip bgp summary\nNeighbor   V  AS    MsgRcvd MsgSent TblVer InQ OutQ Up/Down  State/PfxRcd\n10.0.1.2   4  65003 5102    240     0      0   0    00:03:10 Idle (PfxCt)", "o": ["Die Sitzung wurde beendet, weil die konfigurierte Maximalzahl an Präfixen überschritten wurde.", "Der Nachbar ist administrativ abgeschaltet worden (Admin-Shutdown).", "Es besteht keine Route zum Nachbarn, daher kommt keine TCP-Sitzung zustande.", "Die AS-Nummer des Nachbarn ist falsch konfiguriert."], "c": [0], "e": "<code>Idle (PfxCt)</code> heißt: <code>neighbor … maximum-prefix</code> wurde überschritten, die Sitzung ist down. Erst nach <code>clear ip bgp</code> oder Ablauf der Restart-Zeit beginnt sie neu. Administrativ down wäre <code>Idle (Admin)</code>."}, {"d": 2, "q": "Was zeigt dieser Auszug über die LDP-Nachbarschaft auf Gi0/0?", "x": "PE1# show mpls ldp discovery\n Local LDP Identifier:\n    10.255.0.1:0\n Discovery Sources:\n  Interfaces:\n    GigabitEthernet0/0 (ldp): xmit", "o": ["Hellos werden nur gesendet, es kommen keine an: LDP fehlt drüben oder UDP 646 wird gefiltert.", "Die TCP-Sitzung zum Nachbarn ist aufgebaut, Labels werden getauscht.", "Der Nachbar nutzt ein anderes Label-Protokoll als LDP.", "Die MTU ist zu klein und blockiert die Hellos."], "c": [0], "e": "In <code>show mpls ldp discovery</code> steht bei einer funktionierenden Adjacency <code>xmit/recv</code>. Nur <code>xmit</code> bedeutet, dass keine Hellos zurückkommen: auf der Gegenseite fehlt <code>mpls ip</code>, oder ein Filter blockt die Hellos."}, {"d": 2, "q": "Welche Adresse ist der Egress-PE für 10.20.0.0/24 im VPN?", "x": "PE1# show bgp vpnv4 unicast all\nRoute Distinguisher: 65000:200\n *>i 10.20.0.0/24   192.0.2.2    0   100   0 65002 i", "o": ["192.0.2.2", "65000:200", "65002", "10.20.0.0"], "c": [0], "e": "Der Next Hop 192.0.2.2 ist die Loopback des Egress-PE, der die Route per MP-BGP angekündigt hat. 65000:200 ist der Route Distinguisher, 65002 die AS des Kunden."}, {"d": 2, "q": "Was bedeutet das Flag <code>registered</code> in diesem Eintrag auf dem Hub?", "x": "Hub# show ip nhrp\n10.99.0.2/32 via 10.99.0.2\n   Tunnel0 created 00:20:10, expire 01:39:50\n   Type: dynamic, Flags: registered nhop\n   NBMA address: 198.51.100.2", "o": ["Der Spoke hat sich per NHRP-Registrierung beim Hub angemeldet.", "Der Eintrag wurde manuell konfiguriert.", "Der Tunnel ist per IPsec geschützt.", "Der Spoke ist über einen Shortcut direkt erreichbar."], "c": [0], "e": "<code>registered</code> markiert einen Spoke, der sich selbst beim Hub (NHS) registriert hat. Statische Einträge tragen <code>static</code>, Shortcut-Einträge <code>router</code>."}, {"d": 3, "q": "Was zeigt die Ausgabe?", "x": "R1# show ip interface Gi0/0 | include verify\n  IP verify source reachable-via RX\n   1234 verification drops\n   0 suppressed verification drops", "o": ["uRPF ist im Strict-Modus (<code>rx</code>) aktiv und hat 1234 Pakete verworfen.", "uRPF läuft im Loose-Modus (<code>any</code>) und hat 1234 Pakete verworfen.", "uRPF ist konfiguriert, hat aber bisher nichts verworfen.", "Es sind 1234 Pakete durch die Prüfung als gültig erlaubt worden."], "c": [0], "e": "<code>reachable-via RX</code> ist der Strict-Modus (Quelle muss über das Eingangsinterface erreichbar sein), Loose heißt <code>ANY</code>. Der Zähler zählt Drops."}, {"d": 3, "q": "Was bedeutet der Zustand DEAD für den RADIUS-Server?", "x": "R1# show aaa servers\nRADIUS: id 1, priority 1, host 10.0.0.5, auth-port 1812, acct-port 1813\n     State: current DEAD, duration 120s, previous duration 0s\n     Quarantined: No\n     Authen: request 45, timeouts 45", "o": ["Der Router nutzt die nächste Methode in der Liste, zum Beispiel <code>local</code>.", "Alle Anmeldungen werden abgelehnt, auch die lokalen.", "Der Server wurde endgültig aus der Konfiguration entfernt.", "Der Router wechselt automatisch auf TACACS+ als Ersatz."], "c": [0], "e": "Antwortet der Server nicht, markiert der Router ihn als DEAD und fragt zunächst die nächste Methode oder den nächsten Server. Nach <code>deadtime</code> wird er wieder versucht."}, {"d": 4, "q": "Was bedeutet die Ausgabe für das Track-Objekt, das daran hängt?", "x": "R1# show ip sla statistics 1\nIPSLAs Latest Operation Statistics\nIPSLA operation id: 1\n        Latest RTT: NoConnection/Busy/Timeout\nLatest operation return code: Timeout\nNumber of successes: 0\nNumber of failures: 12", "o": ["Es geht auf Down, weil die Messung in einen Timeout läuft.", "Es geht auf Up, weil die Operation läuft.", "Es ist nicht konfiguriert.", "Es bleibt unverändert, solange die Operation geplant ist."], "c": [0], "e": "Der letzte Rückgabecode ist Timeout, das Ziel antwortet nicht. Bei <code>reachability</code> wechselt das Track-Objekt auf Down, und eine daran gebundene Route verschwindet."}, {"d": 4, "q": "Welche Information liefert die Meldung?", "x": "%SYS-5-CONFIG_I: Configured from console by admin on vty0 (10.1.1.9)", "o": ["Die Konfiguration wurde von 10.1.1.9 per VTY vom Benutzer admin geändert (Level 5).", "Eine Hardwarefehler-Meldung mit Level 5 und betroffener Karte", "Ein Neustart des Routers durch den Benutzer admin", "Ein fehlgeschlagener Anmeldeversuch von admin über die Konsole"], "c": [0], "e": "<code>%SYS-5-CONFIG_I</code> wird bei jeder Konfigurationsänderung geschrieben und nennt den Benutzer, die Line und die Quelladresse. Damit lässt sich ein Änderer nachvollziehen."}, {"d": 4, "q": "Welcher Host verursacht im Cache den größten Verkehr, und worüber?", "x": "R1# show flow monitor MON cache\nIPV4 SRC ADDR  IPV4 DST ADDR   TRNS SRC PORT  TRNS DST PORT   bytes\n10.1.1.10      203.0.113.5     51514           443             9820000\n10.1.1.22      198.51.100.7    40122           22              120000\n10.1.1.31      203.0.113.9     51200           80              450000", "o": ["10.1.1.10 über HTTPS (TCP 443)", "10.1.1.22 über SSH", "10.1.1.31 über HTTP", "Alle drei etwa gleich"], "c": [0], "e": "10.1.1.10 hat rund 9,8 MB zu Port 443 gesendet, deutlich mehr als die anderen. Port 22 ist SSH, Port 80 HTTP."}, {"d": 4, "q": "Warum ist der Router nicht synchronisiert?", "x": "R1# show ntp status\nClock is unsynchronized, stratum 16, no reference clock\nnominal freq is 250.0000 Hz, actual freq is 250.0000 Hz, precision is 2**10", "o": ["Kein NTP-Server erreichbar, oder der Server wird nicht akzeptiert (z. B. Authentifizierung).", "Stratum 16 ist ein Zeichen für eine perfekte Referenzquelle.", "Die Zeitzone ist falsch gesetzt, die Synchronisation läuft aber.", "Der Router ist selbst NTP-Master und deshalb nicht synchronisiert."], "c": [0], "e": "<code>Clock is unsynchronized</code> mit Stratum 16 heißt: keine gültige Quelle. Typische Ursachen sind ein nicht erreichbarer Server, UDP 123 gefiltert, falsche Schlüssel oder nicht vertrauenswürdige Quelle."}]};
const KEY='enarsi_sim';
let POOL=BUILTIN,Q,DOM,WEIGHT;
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich=s=>esc(s).replace(/&lt;(\/?)(code|b)&gt;/g,'<$1$2>');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const typ=q=>q.t||'choice';
const qid=q=>{let h=5381;const s=(q.q||'')+'|'+(q.x||'');for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const poolKey=()=>KEY+(POOL===BUILTIN?'':'_custom');
function usePool(p){POOL=p;Q=p.questions;DOM=p.domains||{1:'Alle Fragen'};WEIGHT=p.weights||null;}
usePool(BUILTIN);

// ---------- Startseite ----------
function home(){clearInterval(timer);S=null;
  const hist=lsGet(poolKey()+'_hist')||[],wrong=(lsGet(poolKey()+'_wrong')||[]).filter(id=>Q.some(q=>qid(q)===id));
  const custom=POOL!==BUILTIN,examN=Math.min(POOL.examN||60,Q.length),examSec=custom?Math.round(examN*(BUILTIN.examSec/BUILTIN.examN)):POOL.examSec;
  const nDD=Q.filter(q=>typ(q)!=='choice').length,nX=Q.filter(q=>q.x).length;
  let h=`<h1>${esc(POOL.title)}</h1><p class="sub">${Q.length} Fragen${nX?`, davon ${nX} mit Exhibit`:''}${nDD?` und ${nDD} zum Ordnen oder Zuordnen`:''}. Läuft offline im Browser.</p>`;
  if(custom)h+=`<div class="card"><b>Eigener Fragenpool geladen.</b> <span class="sub">Ergebnisse und Wiederholungsliste werden getrennt vom eingebauten Pool gespeichert.</span><div class="nav"><button class="sec" onclick="usePool(BUILTIN);home()">Zurück zum eingebauten Pool</button></div></div>`;
  h+=`<div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (${examN} Fragen, ${Math.round(examSec/60)} Minuten)<small>${WEIGHT?'Zufallsauswahl nach Domänengewicht':'Zufallsauswahl'}, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, ${Math.round((custom?Q.length*BUILTIN.allSec/BUILTIN.questions.length:POOL.allSec)/60)} Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  if(wrong.length)h+=`<button onclick="start('wrong')">Falsch beantwortete wiederholen (${wrong.length})<small>Jede Frage verschwindet von der Liste, sobald du sie richtig beantwortest</small></button>`;
  if(nDD)h+=`<button class="sec" onclick="start('dd')">Ordnen und Zuordnen (${nDD})<small>Nur die Drag-and-drop-Fragen</small></button>`;
  if(nX)h+=`<button class="sec" onclick="start('ex')">Exhibits (${nX})<small>Nur Fragen mit Ausgaben, Konfigurationen oder Code</small></button>`;
  for(const d of Object.keys(DOM)){const n=Q.filter(q=>String(q.d||1)===d).length;if(n)h+=`<button class="sec" onclick="start('practice','${d}')">${Object.keys(DOM).length>1?`Domäne ${d}: `:''}${esc(DOM[d])}<small>${n} Fragen${WEIGHT&&WEIGHT[d]?` · Gewicht ${WEIGHT[d]} %`:''}</small></button>`}
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<div class="card"><h2>Eigene Fragen</h2><p class="sub" style="margin:0">Der Player lädt jeden Fragenpool im JSON-Format dieser Simulation. Speichere den eingebauten Pool als Vorlage, ergänze eigene Fragen und lade die Datei wieder. Das Format steht in der README.</p>
  <div class="nav"><button class="sec" onclick="document.getElementById('file').click()">Fragenpool laden (JSON)</button><button class="sec" onclick="exportPool()">Aktuellen Pool als JSON speichern</button></div><div id="msg" class="sub" style="margin-top:8px"></div></div>`;
  h+=`<p class="sub">Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}

// ---------- Eigene Pools ----------
function validate(p){const qs=Array.isArray(p)?p:p&&p.questions;if(!Array.isArray(qs)||!qs.length)throw new Error('Keine Fragen gefunden. Erwartet wird ein Array oder ein Objekt mit "questions".');
  qs.forEach((q,i)=>{const n=`Frage ${i+1}`;if(!q.q)throw new Error(`${n}: Feld "q" fehlt.`);const t=typ(q);
    if(t==='choice'){if(!Array.isArray(q.o)||q.o.length<2)throw new Error(`${n}: "o" braucht mindestens zwei Antworten.`);if(!Array.isArray(q.c)||!q.c.length||q.c.some(c=>!(c>=0&&c<q.o.length)))throw new Error(`${n}: "c" muss gültige Indizes der richtigen Antworten enthalten.`)}
    else if(t==='order'){if(!Array.isArray(q.o)||q.o.length<2)throw new Error(`${n}: "o" braucht mindestens zwei Elemente in richtiger Reihenfolge.`)}
    else if(t==='match'){if(!Array.isArray(q.l)||!Array.isArray(q.o)||!Array.isArray(q.c)||q.c.length!==q.l.length||q.c.some(c=>!(c>=0&&c<q.o.length)))throw new Error(`${n}: Zuordnung braucht "l", "o" und für jedes Element in "l" einen Index in "c".`)}
    else throw new Error(`${n}: unbekannter Typ "${t}".`);});
  if(Array.isArray(p))p={questions:p};
  return{title:p.title||'Eigener Fragenpool',domains:p.domains||null,weights:p.weights||null,examN:p.examN||60,questions:qs};}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=validate(JSON.parse(r.result));if(!p.domains){const ds=[...new Set(p.questions.map(q=>String(q.d||1)))];p.domains=Object.fromEntries(ds.map(d=>[d,ds.length>1?'Domäne '+d:'Alle Fragen']))}usePool(p);home();}
    catch(err){home();document.getElementById('msg').textContent='Konnte die Datei nicht laden: '+err.message}};
  r.readAsText(f,'utf-8');e.target.value='';});
function exportPool(){const p={title:POOL.title,domains:POOL.domains,weights:POOL.weights,examN:POOL.examN,questions:Q};
  const b=new Blob([JSON.stringify(p,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(POOL===BUILTIN?KEY.replace(/_sim$/,''):'fragenpool')+'-fragen.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}

// ---------- Ablauf ----------
function start(mode,dom){
  let qs;const custom=POOL!==BUILTIN,examN=Math.min(POOL.examN||60,Q.length);
  if(mode==='exam'){if(WEIGHT){qs=[];for(const d in WEIGHT)qs.push(...shuffle(Q.filter(q=>String(q.d)===d)).slice(0,Math.round(examN*WEIGHT[d]/100)));qs=shuffle(qs)}else qs=shuffle(Q).slice(0,examN)}
  else if(mode==='all')qs=shuffle(Q);
  else if(mode==='wrong'){const w=lsGet(poolKey()+'_wrong')||[];qs=shuffle(Q.filter(q=>w.includes(qid(q))))}
  else if(mode==='dd')qs=shuffle(Q.filter(q=>typ(q)!=='choice'));
  else if(mode==='ex')qs=shuffle(Q.filter(q=>q.x));
  else qs=shuffle(Q.filter(q=>String(q.d||1)===String(dom)));
  qs=qs.map(q=>{const t=typ(q);
    if(t==='choice')return{...q,order:shuffle(q.o.map((_,i)=>i))};
    if(t==='order')return{...q};
    return{...q,lorder:shuffle(q.l.map((_,i)=>i)),porder:shuffle(q.o.map((_,i)=>i))}});
  const ans=qs.map(q=>{const t=typ(q);if(t==='choice')return[];
    if(t==='order'){let a;do{a=shuffle(q.o.map((_,i)=>i))}while(q.o.length>1&&a.every((v,i)=>v===i));return a}
    return q.l.map(()=>null)});
  const per=custom?BUILTIN.examSec/BUILTIN.examN:0;
  const left=mode==='exam'?(custom?Math.round(qs.length*per):POOL.examSec):mode==='all'?(custom?Math.round(qs.length*BUILTIN.allSec/BUILTIN.questions.length):POOL.allSec):0;
  const practice=!['exam','all'].includes(mode);
  S={mode,dom,practice,qs,i:0,ans,touched:qs.map(()=>false),done:qs.map(()=>false),left,sel:null};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function answered(i){const q=S.qs[i],t=typ(q);if(t==='choice')return S.ans[i].length>0;if(t==='order')return S.touched[i];return S.ans[i].every(x=>x!==null);}
const ok=i=>{const q=S.qs[i],a=S.ans[i],t=typ(q);
  if(t==='choice')return a.length===q.c.length&&q.c.every(x=>a.includes(x));
  if(t==='order')return S.touched[i]&&a.every((v,k)=>v===k);
  return a.every((v,k)=>v===q.c[k]);};

function render(){
  const q=S.qs[S.i],t=typ(q),locked=S.practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length}${Object.keys(DOM).length>1?` · Domäne ${q.d}`:''}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}`;
  if(t==='choice')h+=renderChoice(q,locked);else if(t==='order')h+=renderOrder(q,locked);else h+=renderMatch(q,locked);
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${rich(q.e||'')}</div>`;
  h+=`<div class="nav">`;
  if(!S.practice)h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(S.practice&&!locked)h+=`<button onclick="check()" ${answered(S.i)?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(!S.practice||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(!S.practice&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(S.practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(!S.practice){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.qs.filter((_,i)=>answered(i)).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${answered(i)?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;
  if(!locked){if(t==='order')wireOrder();if(t==='match')wireMatch();}}

function renderChoice(q,locked){const multi=q.c.length>1;
  let h=`<div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${rich(q.o[oi])}</span></label>`});
  return h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}

// Reihenfolge: Ziehen oder Pfeile
function renderOrder(q,locked){const a=S.ans[S.i];
  let h=`<div class="hint">Bring die Elemente in die richtige Reihenfolge: ziehen oder mit den Pfeilen verschieben.</div><ol class="ord" id="ord">`;
  a.forEach((v,k)=>{const cls=locked?(v===k?'ok':'bad'):'';
    h+=`<li draggable="${!locked}" data-k="${k}" class="${cls}"><span class="n">${k+1}.</span><span class="t">${rich(q.o[v])}</span>${locked?(v!==k?`<span class="right">gehört auf Platz ${v+1}</span>`:''):`<button class="sec" ${k==0?'disabled':''} onclick="mv(${k},-1)" aria-label="nach oben">↑</button><button class="sec" ${k==a.length-1?'disabled':''} onclick="mv(${k},1)" aria-label="nach unten">↓</button>`}</li>`});
  h+=`</ol>`;
  if(locked&&!ok(S.i))h+=`<div class="hint">Richtige Reihenfolge:</div><ol>${q.o.map(x=>`<li>${rich(x)}</li>`).join('')}</ol>`;
  return h;}
function mv(k,d){const a=S.ans[S.i],j=k+d;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];S.touched[S.i]=true;render();}
function wireOrder(){const ol=document.getElementById('ord');if(!ol)return;let from=null;
  ol.querySelectorAll('li').forEach(li=>{
    li.addEventListener('dragstart',e=>{from=+li.dataset.k;li.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(from))}catch(_){}});
    li.addEventListener('dragend',()=>li.classList.remove('drag'));
    li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over')});
    li.addEventListener('dragleave',()=>li.classList.remove('over'));
    li.addEventListener('drop',e=>{e.preventDefault();const to=+li.dataset.k;if(from===null||from===to)return;const a=S.ans[S.i];const [x]=a.splice(from,1);a.splice(to,0,x);S.touched[S.i]=true;render();});});}

// Zuordnung: Karte antippen, dann Feld antippen, oder ziehen
function renderMatch(q,locked){const a=S.ans[S.i];const reuse=q.o.length<q.l.length||q.reuse;
  let h=`<div class="hint">Ordne jedem Begriff links die passende Karte zu: ziehen, oder erst die Karte und dann das Feld antippen.${reuse?' Eine Karte kann mehrfach passen.':''}</div>`;
  if(!locked){const used=new Set(a.filter(x=>x!==null));
    h+=`<div class="pool" id="pool">${q.porder.filter(p=>reuse||!used.has(p)).map(p=>`<span class="chip${S.sel===p?' pick':''}" draggable="true" data-p="${p}">${rich(q.o[p])}</span>`).join('')||'<span class="hint">Alle Karten verteilt.</span>'}</div>`;}
  q.lorder.forEach(li=>{const v=a[li];let cls='zone';if(locked)cls+=v===q.c[li]?' ok':' bad';
    h+=`<div class="mrow"><div>${rich(q.l[li])}</div><div><div class="${cls}" data-l="${li}">${v===null?'<span class="ph">hier ablegen</span>':`<span class="chip" data-p="${v}" data-from="${li}">${rich(q.o[v])}</span>`}</div>${locked&&v!==q.c[li]?`<div class="right">richtig: ${rich(q.o[q.c[li]])}</div>`:''}</div></div>`});
  return h;}
function place(li,p){const q=S.qs[S.i],a=S.ans[S.i];const reuse=q.o.length<q.l.length||q.reuse;
  if(!reuse){const k=a.indexOf(p);if(k>=0)a[k]=null;}
  a[li]=p;S.sel=null;render();}
function wireMatch(){let drag=null;
  app.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('dragstart',e=>{drag={p:+ch.dataset.p,from:ch.dataset.from};try{e.dataTransfer.setData('text/plain',ch.dataset.p)}catch(_){}});
    ch.addEventListener('click',e=>{e.stopPropagation();if(ch.dataset.from!==undefined){S.ans[S.i][+ch.dataset.from]=null;S.sel=null;render();return}
      S.sel=S.sel===+ch.dataset.p?null:+ch.dataset.p;render();});});
  app.querySelectorAll('.zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();if(!drag)return;if(drag.from!==undefined)S.ans[S.i][+drag.from]=null;place(+z.dataset.l,drag.p);drag=null;});
    z.addEventListener('click',()=>{if(S.sel!==null)place(+z.dataset.l,S.sel);});});
  const pool=document.getElementById('pool');
  if(pool){pool.addEventListener('dragover',e=>e.preventDefault());pool.addEventListener('drop',e=>{e.preventDefault();if(drag&&drag.from!==undefined){S.ans[S.i][+drag.from]=null;drag=null;render()}});}}

function check(){S.done[S.i]=true;const id=qid(S.qs[S.i]);let w=lsGet(poolKey()+'_wrong')||[];
  if(ok(S.i))w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id);lsSet(poolKey()+'_wrong',w);render();}
function go(d){S.i+=d;S.sel=null;render();}
function jump(i){S.i=i;S.sel=null;render();}
function confirmFinish(){const n=S.qs.filter((_,i)=>!answered(i)).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function ansText(q,i){const a=S.ans[i],t=typ(q);
  if(t==='choice')return a.length?a.map(x=>rich(q.o[x])).join(' · '):'<em>keine</em>';
  if(t==='order')return S.touched[i]?a.map(x=>rich(q.o[x])).join(' → '):'<em>nicht sortiert</em>';
  return q.l.map((l,k)=>`${rich(l)}: ${a[k]===null?'–':rich(q.o[a[k]])}`).join(' · ');}
function rightText(q){const t=typ(q);
  if(t==='choice')return q.c.map(x=>rich(q.o[x])).join(' · ');
  if(t==='order')return q.o.map(rich).join(' → ');
  return q.l.map((l,k)=>`${rich(l)}: ${rich(q.o[q.c[k]])}`).join(' · ');}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{const d=q.d||1;per[d]=per[d]||{r:0,n:0};per[d].n++;if(ok(i))per[d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=n?Math.round(100*r/n):0;
  const name={exam:'Prüfung',all:'Alle Fragen',wrong:'Wiederholung',dd:'Ordnen/Zuordnen',ex:'Exhibits',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet(poolKey()+'_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet(poolKey()+'_hist',hist.slice(-20));
  if(!S.practice){let w=lsGet(poolKey()+'_wrong')||[];S.qs.forEach((q,i)=>{const id=qid(q);if(ok(i))w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id)});lsSet(poolKey()+'_wrong',w);}
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'} Falsche Fragen landen in der Liste „Falsch beantwortete wiederholen“.</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${Object.keys(DOM).length>1?d+' ':''}${esc(DOM[d]||'')}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${ansText(q,i)}</div><div style="color:var(--ok)">Richtig: ${rightText(q)}</div><div class="expl">${rich(q.e||'')}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
