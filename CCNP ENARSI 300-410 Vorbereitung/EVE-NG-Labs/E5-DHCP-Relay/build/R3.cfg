hostname R3
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 10.0.23.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.1.2.1 255.255.255.0
 no shutdown
ip route 0.0.0.0 0.0.0.0 10.0.23.1
