lab:
  title: 'Lab E4 – Unicast Reverse Path Forwarding: Strict, Loose, ACL (Repair)'
  description: 'Ein Provider-Edge-Router (PE) schützt sich mit uRPF vor gefälschten Absenderadressen: Strict Mode zum Kunden, Loose Mode zum Internet, eine Ausnahme-ACL für einen Altbestand. Du siehst, was ein Default-Route im Loose Mode bewirkt und warum Strict Mode bei asymmetrischem Routing Verkehr verwirft.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: CE
  node_definition: iosv
  x: 100
  y: 150
  configuration: |
    hostname CE
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 203.0.113.1 255.255.255.0
    interface Loopback2
     ip address 10.200.0.77 255.255.255.0
    interface Loopback3
     ip address 10.77.0.1 255.255.255.0
    interface Loopback4
     ip address 10.66.66.1 255.255.255.0
    ip route 0.0.0.0 0.0.0.0 198.51.100.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: PE
  node_definition: iosv
  x: 350
  y: 150
  configuration: |
    hostname PE
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 192.0.2.1 255.255.255.252
     no shutdown
    interface Loopback9
     ip address 10.200.0.1 255.255.255.0
    ip route 0.0.0.0 0.0.0.0 192.0.2.2
    ip route 192.0.2.88 255.255.255.255 192.0.2.2
    ip route 203.0.131.0 255.255.255.0 198.51.100.2
    ip cef
    access-list 120 permit ip 10.77.1.0 0.0.0.255 any
    interface GigabitEthernet0/0
     ip verify unicast source reachable-via any 120
    interface GigabitEthernet0/1
     ip verify unicast source reachable-via any allow-default
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: NET
  node_definition: iosv
  x: 600
  y: 150
  configuration: |
    hostname NET
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.0.2.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 192.0.2.88 255.255.255.255
    interface Loopback2
     ip address 10.99.99.1 255.255.255.0
    ip route 203.0.113.0 255.255.255.0 192.0.2.1
    ip route 0.0.0.0 0.0.0.0 192.0.2.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: CE-GigabitEthernet0/0<->PE-GigabitEthernet0/0
- id: l1
  n1: n1
  n2: n2
  i1: i2
  i2: i1
  label: PE-GigabitEthernet0/1<->NET-GigabitEthernet0/0
