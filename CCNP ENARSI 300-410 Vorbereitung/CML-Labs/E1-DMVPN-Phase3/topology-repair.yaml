lab:
  title: Lab E1 – DMVPN Phase 3 mit EIGRP (Repair)
  description: 'Ein Hub und zwei Spokes bauen über einen simulierten Internet-Router ein DMVPN auf: mGRE, NHRP-Registrierung, EIGRP über den Tunnel und Phase 3 mit NHRP-Redirect und Shortcut. Du siehst, wie aus einer Summary-Route über den Hub eine direkte Spoke-to-Spoke-Verbindung wird.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: HUB
  node_definition: iosv
  x: 200
  y: 100
  configuration: |
    hostname HUB
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.10.0.1 255.255.255.0
    ip route 0.0.0.0 0.0.0.0 198.51.100.2
    interface Tunnel0
     ip address 172.16.0.1 255.255.255.0
     no ip redirects
     ip mtu 1400
     ip tcp adjust-mss 1360
     ip nhrp network-id 100
     ip nhrp authentication DMVPN
     ip nhrp map multicast dynamic
     ip summary-address eigrp 100 10.10.0.0 255.255.255.0
     tunnel source GigabitEthernet0/0
     tunnel mode gre multipoint
     tunnel key 100
    router eigrp 100
     network 172.16.0.0 0.0.0.255
     network 10.10.0.0 0.0.0.255
     no auto-summary
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: ISP
