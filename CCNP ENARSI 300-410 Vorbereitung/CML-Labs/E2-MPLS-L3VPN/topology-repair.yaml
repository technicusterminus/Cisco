lab:
  title: Lab E2 – MPLS L3VPN mit LDP und MP-BGP (Repair)
  description: 'Ein kleines Provider-Netz (PE1, P, PE2) verbindet zwei Standorte eines Kunden per MPLS L3VPN: OSPF und LDP im Core, VRF mit Route Distinguisher und Route Targets auf den PEs, eBGP zu den Kunden-Routern (CE) und VPNv4 zwischen den PEs. Dazu die typische Fehlersuche, wenn die BGP-Sitzung steht, aber kein Verkehr fließt.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: CE1
  node_definition: iosv
  x: 0
  y: 150
  configuration: |
    hostname CE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.1.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.100.1.1 255.255.255.0
    router bgp 65001
     bgp router-id 10.100.1.1
     neighbor 192.168.1.1 remote-as 65000
     network 10.100.1.0 mask 255.255.255.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: PE1
  node_definition: iosv
  x: 200
  y: 150
  configuration: |
    hostname PE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    vrf definition CUST-A
     rd 65000:100
     address-family ipv4
      route-target import 65000:101
     exit-address-family
    interface GigabitEthernet0/1
     vrf forwarding CUST-A
     ip address 192.168.1.1 255.255.255.252
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    interface GigabitEthernet0/0
     mpls ip
    router bgp 65000
     bgp router-id 10.255.0.1
     no bgp default ipv4-unicast
     neighbor 10.255.0.3 remote-as 65000
     neighbor 10.255.0.3 update-source Loopback0
     address-family vpnv4
      neighbor 10.255.0.3 activate
      neighbor 10.255.0.3 send-community extended
     exit-address-family
     address-family ipv4 vrf CUST-A
      neighbor 192.168.1.2 remote-as 65001
      neighbor 192.168.1.2 activate
     exit-address-family
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: P
  node_definition: iosv
  x: 400
  y: 150
  configuration: |
    hostname P
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.1 255.255.255.252
     no shutdown
    router ospf 1
     router-id 10.255.0.2
     network 10.255.0.2 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.0.23.0 0.0.0.3 area 0
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    interface GigabitEthernet0/0
     mpls ip
    interface GigabitEthernet0/1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n3
  label: PE2
  node_definition: iosv
  x: 600
  y: 150
  configuration: |
    hostname PE2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.3 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.23.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    vrf definition CUST-A
     rd 65000:100
     address-family ipv4
      route-target export 65000:100
      route-target import 65000:100
     exit-address-family
    interface GigabitEthernet0/1
     vrf forwarding CUST-A
     ip address 192.168.2.1 255.255.255.252
    router ospf 1
     router-id 10.255.0.3
     network 10.255.0.3 0.0.0.0 area 0
     network 10.0.23.0 0.0.0.3 area 0
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    interface GigabitEthernet0/0
     mpls ip
    router bgp 65000
     bgp router-id 10.255.0.3
     no bgp default ipv4-unicast
     neighbor 10.255.0.1 remote-as 65000
     address-family vpnv4
      neighbor 10.255.0.1 activate
      neighbor 10.255.0.1 send-community extended
     exit-address-family
     address-family ipv4 vrf CUST-A
      neighbor 192.168.2.2 remote-as 65002
      neighbor 192.168.2.2 activate
     exit-address-family
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n4
  label: CE2
  node_definition: iosv
  x: 800
  y: 150
  configuration: |
    hostname CE2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.2.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.100.2.1 255.255.255.0
    router bgp 65002
     bgp router-id 10.100.2.1
     neighbor 192.168.2.1 remote-as 65100
     network 10.100.2.0 mask 255.255.255.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i2
  label: CE1-GigabitEthernet0/0<->PE1-GigabitEthernet0/1
- id: l1
  n1: n1
  n2: n2
  i1: i1
  i2: i1
  label: PE1-GigabitEthernet0/0<->P-GigabitEthernet0/0
- id: l2
  n1: n2
  n2: n3
  i1: i2
  i2: i1
  label: P-GigabitEthernet0/1<->PE2-GigabitEthernet0/0
- id: l3
  n1: n3
  n2: n4
  i1: i2
  i2: i1
  label: PE2-GigabitEthernet0/1<->CE2-GigabitEthernet0/0
