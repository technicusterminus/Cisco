<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCNA Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"d": 1, "q": "Welches Gerät erkennt Angriffe und kann sie zusätzlich aktiv blockieren, weil es inline im Datenpfad sitzt?", "x": null, "o": ["IPS", "IDS", "Layer-2-Switch", "Wireless LAN Controller"], "c": [0], "e": "Ein IPS arbeitet inline und kann Verkehr blockieren. Ein IDS erkennt und alarmiert nur."}, {"d": 1, "q": "Welche Aufgabe hat ein Lightweight Access Point in einer Controller-Architektur?", "x": null, "o": ["Er ist über CAPWAP mit dem WLC verbunden und wird von ihm konfiguriert.", "Er routet zwischen VLANs.", "Er ersetzt den DHCP-Server.", "Er arbeitet autonom ohne Controller."], "c": [0], "e": "Lightweight-APs werden zentral vom WLC gesteuert; die Verbindung läuft über einen CAPWAP-Tunnel."}, {"d": 1, "q": "Ein Standort mit zwei Core- und mehreren Access-Switches nutzt keine eigene Distribution-Schicht. Wie heißt dieses Design?", "x": null, "o": ["Collapsed Core (Zwei-Schichten-Design)", "Spine-Leaf", "Full Mesh", "Hub-and-Spoke"], "c": [0], "e": "Beim Collapsed Core sind Core und Distribution in einer Schicht zusammengefasst."}, {"d": 1, "q": "Welche Eigenschaft kennzeichnet eine Spine-Leaf-Topologie?", "x": null, "o": ["Jeder Leaf ist mit jedem Spine verbunden, Leafs sind untereinander nicht verbunden.", "Spines sind untereinander vollvermascht, Leafs hängen an genau einem Spine.", "Alle Geräte hängen an einem gemeinsamen Bus.", "Leafs sind in einem Ring verbunden."], "c": [0], "e": "Spine-Leaf bietet gleiche Pfadlänge zwischen Leafs und eignet sich für Ost-West-Verkehr im Rechenzentrum."}, {"d": 1, "q": "Zwei Switches stehen in zwei Gebäuden 2 km auseinander. Welches Medium ist geeignet?", "x": null, "o": ["Singlemode-Glasfaser", "Cat6a-UTP", "Multimode-Glasfaser mit LED", "Koaxialkabel"], "c": [0], "e": "UTP erreicht 100 m, Multimode wenige hundert Meter. Für Kilometer wird Singlemode genutzt."}, {"d": 1, "q": "Ein Switch-Port zeigt up/up, aber der Durchsatz ist schlecht, und es treten Late Collisions auf. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Duplex-Mismatch zwischen den Port-Partnern", "Falsche Subnetzmaske am Host", "Fehlendes Default Gateway", "Falsche Native VLAN"], "c": [0], "e": "Late Collisions bei up/up deuten auf Duplex-Mismatch (eine Seite Half-, die andere Vollduplex) hin."}, {"d": 1, "q": "Welcher Port wird für DNS-Standardabfragen verwendet?", "x": null, "o": ["UDP 53", "TCP 25", "UDP 69", "UDP 123"], "c": [0], "e": "DNS nutzt UDP 53, bei großen Antworten und Zonentransfers TCP 53."}, {"d": 1, "q": "Welche Protokollkombination gehört zu NTP und TFTP?", "x": null, "o": ["NTP: UDP 123, TFTP: UDP 69", "NTP: TCP 123, TFTP: TCP 69", "NTP: UDP 69, TFTP: UDP 123", "NTP: UDP 161, TFTP: UDP 514"], "c": [0], "e": "NTP verwendet UDP 123, TFTP UDP 69."}, {"d": 1, "q": "Wie lautet die Broadcastadresse des Subnetzes 192.168.1.64/26?", "x": null, "o": ["192.168.1.127", "192.168.1.128", "192.168.1.126", "192.168.1.255"], "c": [0], "e": "Blockgröße 64: Das Subnetz reicht von .64 bis .127. .127 ist der Broadcast."}, {"d": 1, "q": "Wie viele nutzbare Hosts bietet ein /28-Subnetz?", "x": null, "o": ["14", "16", "30", "12"], "c": [0], "e": "2^4 − 2 = 14."}, {"d": 1, "q": "Welche Subnetzmaske gehört zu /27?", "x": null, "o": ["255.255.255.224", "255.255.255.192", "255.255.255.240", "255.255.255.248"], "c": [0], "e": "27 = 24 + 3 Bit: 128+64+32 = 224."}, {"d": 1, "q": "Ein Host hat 10.1.1.130/25. Welcher Host liegt im selben Subnetz?", "x": null, "o": ["10.1.1.200", "10.1.1.100", "10.1.2.130", "10.1.1.127"], "c": [0], "e": "Das /25-Subnetz 10.1.1.128 reicht von .128 bis .255."}, {"d": 1, "q": "Für ein Subnetz werden 50 nutzbare Hosts benötigt. Welche kleinste Präfixlänge passt?", "x": null, "o": ["/26", "/25", "/27", "/28"], "c": [0], "e": "/26 liefert 62 Hosts, /27 nur 30."}, {"d": 1, "q": "Welche Adresse ist eine private IPv4-Adresse nach RFC 1918?", "x": null, "o": ["172.20.5.4", "172.32.0.1", "169.254.10.1", "100.64.0.1"], "c": [0], "e": "Privat ist 172.16.0.0–172.31.255.255. 169.254/16 ist Link-Local, 100.64/10 Shared Address Space."}, {"d": 1, "q": "Ein PC erhält die Adresse 169.254.12.7. Was bedeutet das?", "x": null, "o": ["Er hat keine DHCP-Antwort erhalten (APIPA).", "Er hat eine Adresse aus dem Pool des Servers erhalten.", "Er nutzt statische Konfiguration.", "Er befindet sich im Management-VLAN."], "c": [0], "e": "169.254.0.0/16 wird selbst vergeben, wenn kein DHCP-Server antwortet."}, {"d": 1, "q": "Welche Kurzform ist für 2001:0DB8:0000:0000:0000:0000:0000:0001 korrekt?", "x": null, "o": ["2001:db8::1", "2001:db8:::1", "2001:db8::0:1::", "2001:0db8::0001"], "c": [0], "e": "Führende Nullen entfallen, genau eine Folge von Nullgruppen wird durch :: ersetzt."}, {"d": 1, "q": "Welche Adresse ist eine Link-Local-IPv6-Adresse?", "x": null, "o": ["FE80::1", "FC00::1", "2001:db8::1", "FF02::1"], "c": [0], "e": "Link-Local liegt in FE80::/10. FC00::/7 ist ULA, FF00::/8 Multicast."}, {"d": 1, "q": "Welche Multicastadresse erreicht alle IPv6-Router im Segment?", "x": null, "o": ["FF02::2", "FF02::1", "FF02::5", "FF05::1"], "c": [0], "e": "FF02::1 = alle Knoten, FF02::2 = alle Router, FF02::5 = OSPF."}, {"d": 1, "q": "Wie lautet die EUI-64-Interface-ID zur MAC 00:1A:2B:3C:4D:5E?", "x": null, "o": ["021A:2BFF:FE3C:4D5E", "001A:2BFF:FE3C:4D5E", "021A:2BFE:FF3C:4D5E", "001A:2B3C:4D5E:FFFE"], "c": [0], "e": "FFFE kommt in die Mitte, das 7. Bit des ersten Bytes wird invertiert (00 → 02)."}, {"d": 1, "q": "Ein Host erreicht 8.8.8.8, aber nicht www.example.com. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Falscher oder fehlender DNS-Server", "Falsches Default Gateway", "Falsche Subnetzmaske", "Defekter Switch-Port"], "c": [0], "e": "IP-Konnektivität besteht, nur die Namensauflösung schlägt fehl."}, {"d": 1, "q": "Welches Frequenzband bietet nur drei überlappungsfreie 20-MHz-Kanäle?", "x": null, "o": ["2,4 GHz", "5 GHz", "6 GHz", "60 GHz"], "c": [0], "e": "Im 2,4-GHz-Band sind das typischerweise die Kanäle 1, 6 und 11."}, {"d": 1, "q": "Ein Switch empfängt einen Unicast-Frame mit unbekannter Ziel-MAC. Was tut er?", "x": null, "o": ["Er flutet den Frame an alle Ports desselben VLANs außer dem Eingangsport.", "Er verwirft den Frame.", "Er sendet ihn an alle Ports des Geräts.", "Er sendet ihn an den Root-Port."], "c": [0], "e": "Unknown Unicast Flooding innerhalb des VLANs."}, {"d": 1, "q": "Welche Aussage über VRF ist korrekt?", "x": null, "o": ["Mehrere getrennte Routing-Tabellen können auf einem Router existieren.", "VRF ersetzt VLANs auf Layer 2.", "VRF verbindet mehrere Switches zu einem logischen Gerät.", "VRF verschlüsselt den Verkehr."], "c": [0], "e": "Virtual Routing and Forwarding trennt Routing-Tabellen, auch bei überlappenden Adressen."}, {"d": 1, "q": "Welche Funktion hat ein Layer-3-Switch im Vergleich zu einem Layer-2-Switch?", "x": null, "o": ["Er kann zwischen VLANs routen (SVIs, Hardware-Weiterleitung).", "Er arbeitet nur mit MAC-Adressen.", "Er ersetzt die Firewall.", "Er verbindet nur Glasfaserstrecken."], "c": [0], "e": "Ein L3-Switch beherrscht Routing, meist mit hoher Portdichte."}, {"d": 1, "q": "Welcher PoE-Standard liefert bis zu 30 W pro Port?", "x": null, "o": ["802.3at (PoE+)", "802.3af", "802.3bt Type 4", "802.3u"], "c": [0], "e": "af: 15,4 W, at: 30 W, bt: 60 bzw. 90 W."}, {"d": 1, "q": "Was unterscheidet eine Next-Generation Firewall von einer klassischen zustandsbehafteten Firewall?", "x": null, "o": ["Anwendungs- und Benutzererkennung sowie integrierte IPS-Funktionen", "Sie arbeitet nur auf Layer 2.", "Sie filtert ausschließlich nach MAC-Adressen.", "Sie ersetzt den Router."], "c": [0], "e": "NGFWs bewerten Verkehr über Ports hinaus inhaltlich."}, {"d": 1, "q": "Wo gehört der Webserver in einem Netz mit DMZ typischerweise hin?", "x": null, "o": ["In die DMZ, getrennt von internem Netz und Internet durch die Firewall", "Direkt ins interne Management-VLAN", "Außerhalb der Firewall ohne Schutz", "Auf den Access-Switch des Büros"], "c": [0], "e": "Die DMZ trennt öffentlich erreichbare Dienste vom internen Netz."}, {"d": 1, "q": "Welche Schicht des Drei-Schichten-Modells verbindet Endgeräte mit dem Netz?", "x": null, "o": ["Access", "Distribution", "Core", "WAN-Edge"], "c": [0], "e": "Access = Endgeräte, Distribution = Aggregation und Richtlinien, Core = schnelles Backbone."}, {"d": 1, "q": "Welcher Verkehr wird als Ost-West-Verkehr bezeichnet?", "x": null, "o": ["Verkehr zwischen Servern innerhalb des Rechenzentrums", "Verkehr zwischen Client und Internet", "Verkehr zwischen zwei Standorten über das WAN", "Management-Verkehr zum NMS"], "c": [0], "e": "Spine-Leaf ist für Ost-West-Verkehr optimiert."}, {"d": 1, "q": "Welche Eigenschaft hat ein SOHO-Netz typischerweise?", "x": null, "o": ["Ein Gerät bündelt Routing, Switch, WLAN, NAT und DHCP.", "Zwei redundante Core-Router", "Spine-Leaf-Topologie", "Ein MPLS-Backbone im eigenen Betrieb"], "c": [0], "e": "Heimrouter übernehmen mehrere Rollen in einem Gerät."}, {"d": 1, "q": "Welche maximale Länge hat ein Ethernet-Kupfersegment (UTP) laut Standard?", "x": null, "o": ["100 m", "50 m", "185 m", "1000 m"], "c": [0], "e": "Gilt für 10/100/1000BASE-T."}, {"d": 1, "q": "Zwei Switches sollen per Kupfer verbunden werden, Auto-MDIX ist auf beiden aus. Welches Kabel?", "x": null, "o": ["Crossover", "Straight-through", "Rollover", "Koax"], "c": [0], "e": "Gleiche Gerätetypen brauchen ohne Auto-MDIX ein Crossover-Kabel."}, {"d": 1, "q": "Welche Aderpaare nutzt 1000BASE-T?", "x": null, "o": ["Alle vier Paare gleichzeitig", "Zwei Paare", "Ein Paar", "Nur Paar 1 und 2"], "c": [0], "e": "100BASE-TX nutzt zwei Paare."}, {"d": 1, "q": "Der Befehl show interfaces zeigt viele CRC-Fehler und Runts. Welche Ursache ist plausibel?", "x": null, "o": ["Defektes Kabel, Störungen oder Duplex-Mismatch", "Fehlendes Default Gateway", "Falsche VLAN-ID", "Fehlendes NTP"], "c": [0], "e": "Fehlerzähler deuten auf Layer-1/2-Probleme hin."}, {"d": 1, "q": "Ein Port steht auf err-disabled. Was ist der Grund?", "x": null, "o": ["Der Switch hat den Port wegen einer Verletzung (z. B. Port Security, BPDU Guard) abgeschaltet.", "Das Kabel wurde gezogen.", "Es besteht ein Duplex-Mismatch.", "Der Port ist im Trunk-Modus."], "c": [0], "e": "Nach Beheben der Ursache hilft shutdown/no shutdown."}, {"d": 1, "q": "Welches Protokoll baut Verbindungen mit einem Drei-Wege-Handshake auf?", "x": null, "o": ["TCP", "UDP", "ICMP", "ARP"], "c": [0], "e": "SYN, SYN/ACK, ACK."}, {"d": 1, "q": "Welche Eigenschaft passt zu UDP?", "x": null, "o": ["Verbindungslos, ohne Zustellgarantie, geringer Overhead", "Verbindungsorientiert mit Fenstersteuerung", "Garantiert Reihenfolge", "Nutzt Drei-Wege-Handshake"], "c": [0], "e": "Typisch für DNS, VoIP, TFTP."}, {"d": 1, "q": "Welcher Port gehört zu SSH?", "x": null, "o": ["TCP 22", "TCP 23", "TCP 25", "UDP 22"], "c": [0], "e": "Telnet = TCP 23."}, {"d": 1, "q": "Welcher Port gehört zu HTTPS?", "x": null, "o": ["TCP 443", "TCP 80", "TCP 8080", "UDP 443"], "c": [0], "e": "HTTP = 80."}, {"d": 1, "q": "Wie viele nutzbare Hosts hat ein /30-Subnetz?", "x": null, "o": ["2", "4", "6", "0"], "c": [0], "e": "2^2 − 2 = 2."}, {"d": 1, "q": "Welche Subnetzmaske hat ein /26?", "x": null, "o": ["255.255.255.192", "255.255.255.128", "255.255.255.224", "255.255.255.240"], "c": [0], "e": "26 = 24 + 2 Bit: 128 + 64 = 192."}, {"d": 1, "q": "Zwei Hosts: 10.1.1.200/25 und 10.1.1.20/25. Können sie direkt miteinander kommunizieren?", "x": null, "o": ["Nein, sie liegen in verschiedenen Subnetzen.", "Ja, beide liegen im 10.1.1.0/24.", "Ja, das /25 schließt beide ein.", "Nur mit Trunk."], "c": [0], "e": ".20 liegt in .0–.127, .200 in .128–.255."}, {"d": 1, "q": "Was ist die Netzadresse von 172.16.35.99/20?", "x": null, "o": ["172.16.32.0", "172.16.35.0", "172.16.0.0", "172.16.48.0"], "c": [0], "e": "Blockgröße 16 im 3. Oktett: 35 liegt im Block 32–47."}, {"d": 1, "q": "Wofür ist die Adresse 127.0.0.1 reserviert?", "x": null, "o": ["Loopback", "Multicast", "APIPA", "Broadcast"], "c": [0], "e": "127.  Eigenschaft beschreibt Idempotenz?", "x": null, "o": ["Mehrfaches Ausführen führt zum selben Zielzustand.", "Jede Ausführung verändert die Konfiguration erneut.", "Ausführung nur einmalig möglich.", "Änderungen werden rückgängig gemacht."], "c": [0], "e": "Wichtig für Automatisierung: wiederholbare Läufe ohne unerwünschte Nebenwirkungen."}, {"d": 6, "q": "In welcher Plane laufen Routing-Protokolle?", "x": null, "o": ["Control Plane", "Data Plane", "Management Plane", "Forwarding Plane"], "c": [0], "e": "Data Plane leitet Pakete weiter, Management Plane dient der Verwaltung."}, {"d": 6, "q": "Welche API verbindet in einer SDN-Architektur Anwendungen mit dem Controller?", "x": null, "o": ["Northbound API (z. B. REST)", "Southbound API", "Eastbound API", "Westbound API"], "c": [0], "e": "Southbound verbindet Controller und Geräte."}, {"d": 6, "q": "Was beschreibt ein Underlay?", "x": null, "o": ["Das physische IP-Netz, über das Overlay-Tunnel laufen", "Das virtuelle Netz über dem physischen Netz", "Eine Cloud-Region", "Ein Hypervisor"], "c": [0], "e": "Das Overlay ist das virtuelle Netz darüber (z. B. VXLAN)."}, {"d": 6, "q": "Welche HTTP-Methode entspricht dem Anlegen einer Ressource in einer REST-API?", "x": null, "o": ["POST", "GET", "DELETE", "HEAD"], "c": [0], "e": "GET = Read, PUT/PATCH = Update, DELETE = Delete."}, {"d": 6, "q": "Ein REST-Aufruf liefert HTTP 401. Was bedeutet das?", "x": null, "o": ["Authentifizierung fehlt oder ist ungültig.", "Ressource nicht gefunden.", "Serverfehler.", "Zugriff verboten trotz gültiger Anmeldung."], "c": [0], "e": "404 = nicht gefunden, 403 = verboten, 500 = Serverfehler."}, {"d": 6, "q": "Was ist der Wert von interfaces[1] in {\"hostname\":\"R1\",\"interfaces\":[\"Gi0/0\",\"Gi0/1\"]}?", "x": null, "o": ["\"Gi0/1\"", "\"Gi0/0\"", "\"R1\"", "Nicht definiert"], "c": [0], "e": "Arrays beginnen bei 0."}, {"d": 6, "q": "Welcher Fehler steckt in {\"name\":\"R1\",\"vlans\":[10,20,30,]}?", "x": null, "o": ["Abschließendes Komma nach dem letzten Element", "Fehlende Anführungszeichen bei Zahlen", "Falsche Klammerart", "Fehlender Doppelpunkt"], "c": [0], "e": "JSON erlaubt kein Komma nach dem letzten Element."}, {"d": 6, "q": "Welches Werkzeug arbeitet agentenlos mit YAML-Playbooks?", "x": null, "o": ["Ansible", "Puppet", "Chef", "SaltStack-Agent"], "c": [0], "e": "Ansible verbindet sich per SSH oder API; Puppet und Chef nutzen Agenten."}, {"d": 6, "q": "Welche Aussage zu Terraform ist korrekt?", "x": null, "o": ["Es beschreibt Infrastruktur deklarativ und plant Änderungen mit terraform plan.", "Es ist ein Router-Protokoll.", "Es ersetzt SNMP.", "Es arbeitet nur per CLI-Scraping."], "c": [0], "e": "terraform apply führt die Änderungen aus."}, {"d": 6, "q": "Welche Cisco-Komponente zentralisiert Campus-Automatisierung und Assurance?", "x": null, "o": ["Cisco DNA Center (Catalyst Center)", "Cisco Packet Tracer", "Cisco Identity Services Engine (ISE)", "Cisco Umbrella Resolver"], "c": [0], "e": "DNA Center ist der Controller für Campus-Netze und SD-Access."}, {"d": 6, "q": "Welche Aussage beschreibt Infrastructure as Code?", "x": null, "o": ["Infrastruktur wird in versionierten Dateien beschrieben und automatisiert ausgerollt.", "Konfiguration nur per Konsole", "Code wird auf Switches kompiliert", "Infrastruktur ohne Dokumentation"], "c": [0], "e": "Typisch: Git, Templates, Playbooks."}, {"d": 6, "q": "Was ist Konfigurationsdrift?", "x": null, "o": ["Abweichung der tatsächlichen Konfiguration vom Soll-Zustand", "Ein Routing-Loop", "Ein Zeitversatz", "Paketverlust"], "c": [0], "e": "Automatisierung erkennt und korrigiert Drift."}, {"d": 6, "q": "Was unterscheidet deklarative von imperativen Beschreibungen?", "x": null, "o": ["Deklarativ beschreibt den Zielzustand, imperativ die Schritte.", "Deklarativ ist immer schneller.", "Imperativ beschreibt nur Zustände.", "Kein Unterschied."], "c": [0], "e": "Terraform ist deklarativ, Skripte meist imperativ."}, {"d": 6, "q": "Was ist die Data Plane?", "x": null, "o": ["Sie leitet Pakete anhand der Tabellen weiter.", "Sie berechnet Routen.", "Sie verwaltet Konfigurationen.", "Sie enthält die API."], "c": [0], "e": "Meist in spezialisierter Hardware (ASIC)."}, {"d": 6, "q": "Was beschreibt Intent-based Networking?", "x": null, "o": ["Der Admin formuliert das Ziel, das System setzt um und prüft fortlaufend.", "Das Netz arbeitet ohne Konfiguration.", "Die Hardware wird automatisch ersetzt.", "Nur Cloud-Netze."], "c": [0], "e": "Controller und Assurance gehören dazu."}, {"d": 6, "q": "Was gehört zur Management Plane?", "x": null, "o": ["SSH, SNMP, Syslog, NETCONF", "OSPF-Hellos", "ARP-Tabelle", "MAC-Weiterleitung"], "c": [0], "e": "OSPF gehört zur Control Plane."}, {"d": 6, "q": "Welche Komponente koordiniert in SDN die Geräte zentral?", "x": null, "o": ["Controller", "Hypervisor", "DHCP-Server", "Access Point"], "c": [0], "e": "Southbound-Protokolle: NETCONF, OpenFlow, CLI."}, {"d": 6, "q": "Welche Southbound-Technik programmiert Flow-Tabellen in Switches?", "x": null, "o": ["OpenFlow", "SNMPv1", "TFTP", "LLDP"], "c": [0], "e": "Controller schreiben Flow-Einträge."}, {"d": 6, "q": "Welche HTTP-Statuscodes bedeuten Erfolg?", "x": null, "o": ["200, 201, 204", "301, 302, 307", "400, 401, 403", "500, 502, 503"], "c": [0], "e": "4xx = Clientfehler, 5xx = Serverfehler."}, {"d": 6, "q": "Welcher HTTP-Statuscode bedeutet \"nicht gefunden\"?", "x": null, "o": ["404", "401", "403", "500"], "c": [0], "e": "403 = verboten."}, {"d": 6, "q": "Was bedeutet es, dass REST zustandslos ist?", "x": null, "o": ["Jeder Request enthält alle nötigen Informationen.", "Der Server speichert die Sitzung.", "Es gibt keine Authentifizierung.", "Antworten sind immer leer."], "c": [0], "e": "Skalierung und Einfachheit."}, {"d": 6, "q": "Welches Format nutzt NETCONF?", "x": null, "o": ["XML über SSH", "JSON über HTTP", "YAML über Telnet", "CSV über TFTP"], "c": [0], "e": "RESTCONF nutzt HTTP mit JSON oder XML."}, {"d": 6, "q": "Wie sind Schlüssel in JSON geschrieben?", "x": null, "o": ["In doppelten Anführungszeichen", "In einfachen Anführungszeichen", "Ohne Anführungszeichen", "In eckigen Klammern"], "c": [0], "e": "Strings und Schlüssel brauchen doppelte Anführungszeichen."}, {"d": 6, "q": "Welchen Datentyp hat \"enabled\": true in JSON?", "x": null, "o": ["Boolean", "String", "Zahl", "Array"], "c": [0], "e": "\"true\" in Anführungszeichen wäre ein String."}];
const DOM={1:'Network Fundamentals',2:'Network Access',3:'IP Connectivity',4:'IP Services',5:'Security Fundamentals',6:'Automation and Programmability'};
const WEIGHT={1:20,2:20,3:25,4:10,5:15,6:10};
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function home(){clearInterval(timer);S=null;
  const hist=lsGet('ccna_sim_hist')||[];
  let h=`<h1>CCNA 200-301 · Prüfungssimulation</h1><p class="sub">${Q.length} Fragen, gewichtet nach den sechs Domänen. Läuft offline im Browser.</p>
  <div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (60 Fragen, 60 Minuten)<small>Zufallsauswahl nach Domänengewicht, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, 120 Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  for(const d of Object.keys(DOM))h+=`<button class="sec" onclick="start('practice',${d})">Domäne ${d}: ${DOM[d]}<small>${Q.filter(q=>q.d==d).length} Fragen · Gewicht ${WEIGHT[d]} %</small></button>`;
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<p class="sub">Hinweis: Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}
function start(mode,dom){
  let qs;
  if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(60*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?3600:mode==='all'?7200:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){
  const q=S.qs[S.i],multi=q.c.length>1,practice=S.mode==='practice',locked=practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Domäne ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${esc(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Prüfung',all:'Alle Fragen',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet('ccna_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('ccna_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${esc(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
