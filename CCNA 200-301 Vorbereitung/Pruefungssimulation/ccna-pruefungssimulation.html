<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCNA Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"d": 1, "q": "Welches Gerät erkennt Angriffe und kann sie zusätzlich aktiv blockieren, weil es inline im Datenpfad sitzt?", "x": null, "o": ["IPS", "IDS", "Layer-2-Switch", "Wireless LAN Controller"], "c": [0], "e": "Ein IPS arbeitet inline und kann Verkehr blockieren. Ein IDS erkennt und alarmiert nur."}, {"d": 1, "q": "Welche Aufgabe hat ein Lightweight Access Point in einer Controller-Architektur?", "x": null, "o": ["Er ist über CAPWAP mit dem WLC verbunden und wird von ihm konfiguriert.", "Er routet zwischen VLANs.", "Er ersetzt den DHCP-Server.", "Er arbeitet autonom ohne Controller."], "c": [0], "e": "Lightweight-APs werden zentral vom WLC gesteuert; die Verbindung läuft über einen CAPWAP-Tunnel."}, {"d": 1, "q": "Ein Standort mit zwei Core- und mehreren Access-Switches nutzt keine eigene Distribution-Schicht. Wie heißt dieses Design?", "x": null, "o": ["Collapsed Core (Zwei-Schichten-Design)", "Spine-Leaf", "Full Mesh", "Hub-and-Spoke"], "c": [0], "e": "Beim Collapsed Core sind Core und Distribution in einer Schicht zusammengefasst."}, {"d": 1, "q": "Welche Eigenschaft kennzeichnet eine Spine-Leaf-Topologie?", "x": null, "o": ["Jeder Leaf ist mit jedem Spine verbunden, Leafs sind untereinander nicht verbunden.", "Spines sind untereinander vollvermascht, Leafs hängen an genau einem Spine.", "Alle Geräte hängen an einem gemeinsamen Bus.", "Leafs sind in einem Ring verbunden."], "c": [0], "e": "Spine-Leaf bietet gleiche Pfadlänge zwischen Leafs und eignet sich für Ost-West-Verkehr im Rechenzentrum."}, {"d": 1, "q": "Zwei Switches stehen in zwei Gebäuden 2 km auseinander. Welches Medium ist geeignet?", "x": null, "o": ["Singlemode-Glasfaser", "Cat6a-UTP", "Multimode-Glasfaser mit LED", "Koaxialkabel"], "c": [0], "e": "UTP erreicht 100 m, Multimode wenige hundert Meter. Für Kilometer wird Singlemode genutzt."}, {"d": 1, "q": "Ein Switch-Port zeigt up/up, aber der Durchsatz ist schlecht, und es treten Late Collisions auf. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Duplex-Mismatch zwischen den Port-Partnern", "Falsche Subnetzmaske am Host", "Fehlendes Default Gateway", "Falsche Native VLAN"], "c": [0], "e": "Late Collisions bei up/up deuten auf Duplex-Mismatch (eine Seite Half-, die andere Vollduplex) hin."}, {"d": 1, "q": "Welcher Port wird für DNS-Standardabfragen verwendet?", "x": null, "o": ["UDP 53", "TCP 25", "UDP 69", "UDP 123"], "c": [0], "e": "DNS nutzt UDP 53, bei großen Antworten und Zonentransfers TCP 53."}, {"d": 1, "q": "Welche Protokollkombination gehört zu NTP und TFTP?", "x": null, "o": ["NTP: UDP 123, TFTP: UDP 69", "NTP: TCP 123, TFTP: TCP 69", "NTP: UDP 69, TFTP: UDP 123", "NTP: UDP 161, TFTP: UDP 514"], "c": [0], "e": "NTP verwendet UDP 123, TFTP UDP 69."}, {"d": 1, "q": "Wie lautet die Broadcastadresse des Subnetzes 192.168.1.64/26?", "x": null, "o": ["192.168.1.127", "192.168.1.128", "192.168.1.126", "192.168.1.255"], "c": [0], "e": "Blockgröße 64: Das Subnetz reicht von .64 bis .127. .127 ist der Broadcast."}, {"d": 1, "q": "Wie viele nutzbare Hosts bietet ein /28-Subnetz?", "x": null, "o": ["14", "16", "30", "12"], "c": [0], "e": "2^4 − 2 = 14."}, {"d": 1, "q": "Welche Subnetzmaske gehört zu /27?", "x": null, "o": ["255.255.255.224", "255.255.255.192", "255.255.255.240", "255.255.255.248"], "c": [0], "e": "27 = 24 + 3 Bit: 128+64+32 = 224."}, {"d": 1, "q": "Ein Host hat 10.1.1.130/25. Welcher Host liegt im selben Subnetz?", "x": null, "o": ["10.1.1.200", "10.1.1.100", "10.1.2.130", "10.1.1.127"], "c": [0], "e": "Das /25-Subnetz 10.1.1.128 reicht von .128 bis .255."}, {"d": 1, "q": "Für ein Subnetz werden 50 nutzbare Hosts benötigt. Welche kleinste Präfixlänge passt?", "x": null, "o": ["/26", "/25", "/27", "/28"], "c": [0], "e": "/26 liefert 62 Hosts, /27 nur 30."}, {"d": 1, "q": "Welche Adresse ist eine private IPv4-Adresse nach RFC 1918?", "x": null, "o": ["172.20.5.4", "172.32.0.1", "169.254.10.1", "100.64.0.1"], "c": [0], "e": "Privat ist 172.16.0.0–172.31.255.255. 169.254/16 ist Link-Local, 100.64/10 Shared Address Space."}, {"d": 1, "q": "Ein PC erhält die Adresse 169.254.12.7. Was bedeutet das?", "x": null, "o": ["Er hat keine DHCP-Antwort erhalten (APIPA).", "Er hat eine Adresse aus dem Pool des Servers erhalten.", "Er nutzt statische Konfiguration.", "Er befindet sich im Management-VLAN."], "c": [0], "e": "169.254.0.0/16 wird selbst vergeben, wenn kein DHCP-Server antwortet."}, {"d": 1, "q": "Welche Kurzform ist für 2001:0DB8:0000:0000:0000:0000:0000:0001 korrekt?", "x": null, "o": ["2001:db8::1", "2001:db8:::1", "2001:db8::0:1::", "2001:0db8::0001"], "c": [0], "e": "Führende Nullen entfallen, genau eine Folge von Nullgruppen wird durch :: ersetzt."}, {"d": 1, "q": "Welche Adresse ist eine Link-Local-IPv6-Adresse?", "x": null, "o": ["FE80::1", "FC00::1", "2001:db8::1", "FF02::1"], "c": [0], "e": "Link-Local liegt in FE80::/10. FC00::/7 ist ULA, FF00::/8 Multicast."}, {"d": 1, "q": "Welche Multicastadresse erreicht alle IPv6-Router im Segment?", "x": null, "o": ["FF02::2", "FF02::1", "FF02::5", "FF05::1"], "c": [0], "e": "FF02::1 = alle Knoten, FF02::2 = alle Router, FF02::5 = OSPF."}, {"d": 1, "q": "Wie lautet die EUI-64-Interface-ID zur MAC 00:1A:2B:3C:4D:5E?", "x": null, "o": ["021A:2BFF:FE3C:4D5E", "001A:2BFF:FE3C:4D5E", "021A:2BFE:FF3C:4D5E", "001A:2B3C:4D5E:FFFE"], "c": [0], "e": "FFFE kommt in die Mitte, das 7. Bit des ersten Bytes wird invertiert (00 → 02)."}, {"d": 1, "q": "Ein Host erreicht 8.8.8.8, aber nicht www.example.com. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Falscher oder fehlender DNS-Server", "Falsches Default Gateway", "Falsche Subnetzmaske", "Defekter Switch-Port"], "c": [0], "e": "IP-Konnektivität besteht, nur die Namensauflösung schlägt fehl."}, {"d": 1, "q": "Welches Frequenzband bietet nur drei überlappungsfreie 20-MHz-Kanäle?", "x": null, "o": ["2,4 GHz", "5 GHz", "6 GHz", "60 GHz"], "c": [0], "e": "Im 2,4-GHz-Band sind das typischerweise die Kanäle 1, 6 und 11."}, {"d": 1, "q": "Ein Switch empfängt einen Unicast-Frame mit unbekannter Ziel-MAC. Was tut er?", "x": null, "o": ["Er flutet den Frame an alle Ports desselben VLANs außer dem Eingangsport.", "Er verwirft den Frame.", "Er sendet ihn an alle Ports des Geräts.", "Er sendet ihn an den Root-Port."], "c": [0], "e": "Unknown Unicast Flooding innerhalb des VLANs."}, {"d": 1, "q": "Welche Aussage über VRF ist korrekt?", "x": null, "o": ["Mehrere getrennte Routing-Tabellen können auf einem Router existieren.", "VRF ersetzt VLANs auf Layer 2.", "VRF verbindet mehrere Switches zu einem logischen Gerät.", "VRF verschlüsselt den Verkehr."], "c": [0], "e": "Virtual Routing and Forwarding trennt Routing-Tabellen, auch bei überlappenden Adressen."}, {"d": 2, "q": "Welcher Befehl zeigt alle VLANs und die zugeordneten Access-Ports?", "x": null, "o": ["show vlan brief", "show interfaces trunk", "show vtp status", "show mac address-table vlan"], "c": [0], "e": "Trunk-Ports erscheinen in show vlan brief nicht, nur Access-Ports."}, {"d": 2, "q": "Welcher Befehl ordnet den Port Fa0/5 dem VLAN 10 als Access-Port zu?", "x": null, "o": ["switchport mode access, dann switchport access vlan 10", "switchport trunk allowed vlan 10", "vlan 10 fa0/5", "switchport voice vlan 10"], "c": [0], "e": "Access-Modus setzen und dann das Access-VLAN zuweisen."}, {"d": 2, "q": "Router-on-a-Stick: Welche Zeile gehört in das Subinterface für VLAN 20?", "x": null, "o": ["encapsulation dot1q 20", "switchport access vlan 20", "ip helper-address 20", "vlan dot1q 20"], "c": [0], "e": "Subinterfaces nutzen encapsulation dot1q <VLAN-ID>, danach folgt die IP-Adresse."}, {"d": 2, "q": "Eine SVI für VLAN 30 bleibt down/down, obwohl sie nicht shutdown ist. Was ist eine mögliche Ursache?", "x": null, "o": ["VLAN 30 hat keinen aktiven Port und keinen Trunk, der es führt.", "ip routing fehlt.", "Der Native VLAN ist 1.", "Die Subnetzmaske ist /24."], "c": [0], "e": "Eine SVI geht nur hoch, wenn das VLAN existiert und mindestens ein aktiver Port bzw. Trunk es führt."}, {"d": 2, "q": "An zwei Trunk-Enden ist das Native VLAN unterschiedlich (1 und 99). Welche Folge ist wahrscheinlich?", "x": null, "o": ["CDP/STP melden einen Native-VLAN-Mismatch, Verkehr kann im falschen VLAN landen.", "Der Trunk wechselt auf Access.", "EtherChannel wird gebildet.", "Beide Seiten deaktivieren DTP."], "c": [0], "e": "Das Native VLAN muss auf beiden Seiten übereinstimmen."}, {"d": 2, "q": "Welche Kombination von DTP-Modi bildet keinen Trunk?", "x": null, "o": ["dynamic auto – dynamic auto", "dynamic desirable – dynamic auto", "dynamic desirable – dynamic desirable", "trunk – dynamic auto"], "c": [0], "e": "Beide passiven Seiten fragen nicht an, der Port bleibt Access."}, {"d": 2, "q": "Welcher Befehl zeigt Trunks mit erlaubten und aktiven VLANs?", "x": null, "o": ["show interfaces trunk", "show vlan brief", "show etherchannel summary", "show spanning-tree summary"], "c": [0], "e": "Er zeigt Mode, Encapsulation, Status, Native VLAN und die VLAN-Listen."}, {"d": 2, "q": "Welche Protokolle sind herstellerunabhängig bzw. Cisco-proprietär? Wähle die richtige Zuordnung.", "x": null, "o": ["LLDP: offener Standard, CDP: Cisco-proprietär", "LLDP: Cisco-proprietär, CDP: offener Standard", "Beide sind offene IEEE-Standards", "Beide sind Cisco-proprietär"], "c": [0], "e": "LLDP = IEEE 802.1AB, CDP = Cisco."}, {"d": 2, "q": "Auf einem Cisco-Switch sollen LLDP-Nachbarn angezeigt werden. Was ist nötig?", "x": null, "o": ["lldp run global aktivieren, dann show lldp neighbors", "cdp run aktivieren", "spanning-tree lldp", "Nichts, LLDP ist standardmäßig aktiv."], "c": [0], "e": "CDP ist standardmäßig an, LLDP muss mit lldp run aktiviert werden."}, {"d": 2, "q": "Welche Befehlszeile bildet einen LACP-EtherChannel?", "x": null, "o": ["channel-group 1 mode active", "channel-group 1 mode desirable", "channel-group 1 mode auto", "etherchannel 1 lacp"], "c": [0], "e": "active/passive gehören zu LACP, desirable/auto zu PAgP."}, {"d": 2, "q": "Welche zwei Modi bilden mit LACP keinen Channel? (Wähle zwei)", "x": null, "o": ["passive – passive", "on – active", "active – active", "active – passive"], "c": [0, 1], "e": "passive–passive: niemand startet die Aushandlung. on schaltet statisch und passt nicht zu LACP."}, {"d": 2, "q": "Im Ausgabeformat von show etherchannel summary steht für ein Port-Channel \"SU\". Was bedeutet das?", "x": "Group  Port-channel  Protocol    Ports\n1      Po1(SU)       LACP      Gi0/1(P)  Gi0/2(P)", "o": ["Layer 2, in Benutzung", "Layer 3, in Benutzung", "Down, suspendiert", "Standalone"], "c": [0], "e": "S = Layer 2, U = in use. (P) bei den Ports bedeutet: Teil des Bundles."}, {"d": 2, "q": "Welcher Switch wird Root Bridge?", "x": "SW1  Priorität 32768  MAC 0000.0000.0002\nSW2  Priorität 24576  MAC 0000.0000.0009\nSW3  Priorität 24576  MAC 0000.0000.0001", "o": ["SW3", "SW1", "SW2", "Nicht bestimmbar"], "c": [0], "e": "Niedrigste Priorität, bei Gleichstand die niedrigste MAC: SW3 (24576, ...0001)."}, {"d": 2, "q": "Welche Bridge-Priorität zeigt show spanning-tree für VLAN 10, wenn die Priorität 24576 konfiguriert wurde?", "x": null, "o": ["24586", "24576", "32778", "4106"], "c": [0], "e": "Die VLAN-ID wird als Extended System ID addiert."}, {"d": 2, "q": "Welche zwei Portrollen gibt es in RSTP zusätzlich zu Root und Designated? (Wähle zwei)", "x": null, "o": ["Alternate", "Backup", "Listening", "Blocking"], "c": [0, 1], "e": "Alternate und Backup sind RSTP-Rollen. Listening und Blocking sind 802.1D-Zustände."}, {"d": 2, "q": "Welcher Befehl aktiviert Rapid PVST+?", "x": null, "o": ["spanning-tree mode rapid-pvst", "spanning-tree mode mst", "spanning-tree rapid", "spanning-tree portfast default"], "c": [0], "e": "Rapid PVST+ ist ein Spanning-Tree-Modus."}, {"d": 2, "q": "Welche Funktion setzt einen PortFast-Port bei empfangener BPDU in err-disabled?", "x": null, "o": ["BPDU Guard", "Root Guard", "Loop Guard", "UplinkFast"], "c": [0], "e": "BPDU Guard schützt Access-Ports vor angeschlossenen Switches."}, {"d": 2, "q": "Welcher AP-Modus erlaubt lokales Switching der Clientdaten und Weiterbetrieb bei WLC-Ausfall?", "x": null, "o": ["FlexConnect", "Local", "Monitor", "Sniffer"], "c": [0], "e": "Im Local-Modus brechen Clients bei WLC-Ausfall ab."}, {"d": 2, "q": "Welche Ports nutzt CAPWAP zwischen AP und WLC?", "x": null, "o": ["UDP 5246 und 5247", "UDP 161 und 162", "TCP 22 und 23", "UDP 67 und 68"], "c": [0], "e": "5246 für Steuerung, 5247 für Daten."}, {"d": 2, "q": "Welche Befehle sind für SSH-Zugriff notwendig? (Wähle zwei)", "x": null, "o": ["crypto key generate rsa", "transport input ssh an den VTY-Leitungen", "ip http server", "snmp-server community"], "c": [0, 1], "e": "Zusätzlich Hostname, Domain-Name und lokaler Benutzer (login local)."}, {"d": 2, "q": "Welche Einstellung begrenzt VTY-Zugriff auf ein Management-Subnetz?", "x": null, "o": ["access-class an der line vty", "ip access-group an der line vty", "ip helper-address", "login block-for"], "c": [0], "e": "access-class bindet eine ACL an die VTY-Leitungen, ip access-group an Interfaces."}, {"d": 2, "q": "Auf der WLC-GUI zeigt ein Client RSSI −82 dBm. Was bedeutet das?", "x": null, "o": ["Schwaches Signal, für Sprache ungeeignet.", "Sehr gutes Signal", "Kanalinterferenz von 82 %", "Der Client nutzt 82 Mbit/s"], "c": [0], "e": "Richtwert für Sprache ist besser als −67 dBm."}, {"d": 2, "q": "Wie wird ein Lightweight-AP einer SSID und einem VLAN zugeordnet?", "x": null, "o": ["Die WLAN wird einem Interface bzw. VLAN am WLC zugeordnet.", "Durch switchport access vlan am AP.", "Durch DTP.", "Durch VTP-Pruning."], "c": [0], "e": "Die Zuordnung erfolgt im WLAN-Profil über Interface/Interface Group am WLC."}, {"d": 3, "q": "Welche Route wird für das Ziel 10.1.1.5 genutzt?", "x": "S    10.0.0.0/8 [1/0] via 192.168.1.2\nO    10.1.0.0/16 [110/20] via 192.168.1.3\nD    10.1.1.0/24 [90/3072] via 192.168.1.4", "o": ["10.1.1.0/24 via 192.168.1.4", "10.0.0.0/8 via 192.168.1.2", "10.1.0.0/16 via 192.168.1.3",   if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(60*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?3600:mode==='all'?7200:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){
  const q=S.qs[S.i],multi=q.c.length>1,practice=S.mode==='practice',locked=practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Domäne ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${esc(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Prüfung',all:'Alle Fragen',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet('ccna_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('ccna_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${esc(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
