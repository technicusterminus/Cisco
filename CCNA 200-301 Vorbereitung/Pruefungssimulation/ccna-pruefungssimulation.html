zdaten ausgehandelt (IPsec-SAs)."}, {"d": 5, "q": "Welche UDP-Ports nutzt IPsec zum Schlüsselaustausch und bei NAT-Traversal?", "x": null, "o": ["UDP 500 und 4500", "UDP 53 und 67", "TCP 22 und 443", "UDP 161 und 162"], "c": [0], "e": "UDP 500 und 4500. 500 ist IKE, 4500 NAT-Traversal. ESP selbst ist IP-Protokoll 50."}, {"d": 5, "q": "Welcher VPN-Typ verbindet zwei Standorte dauerhaft über Gateways?", "x": null, "o": ["Site-to-Site-VPN", "Remote-Access-VPN", "Clientless SSL-VPN", "Split Tunneling"], "c": [0], "e": "Site-to-Site-VPN. Remote-Access-VPNs verbinden einzelne Benutzer."}, {"d": 5, "q": "Welcher Bereich nutzt eine erweiterte ACL mit Nummern?", "x": null, "o": ["100–199 und 2000–2699", "1–99", "200–299", "3000–3999"], "c": [0], "e": "100 bis 199 und 2000 bis 2699. Standard-ACLs haben 1 bis 99 und 1300 bis 1999."}, {"d": 5, "q": "Welcher Befehl wendet eine ACL auf ein Interface für eingehenden Verkehr an?", "x": null, "o": ["ip access-group NAME in", "access-class NAME in", "ip access-list NAME in", "apply acl NAME"], "c": [0], "e": "ip access-group NAME in am Interface. access-class gilt für die VTY-Lines, ip access-list legt die ACL nur an."}, {"d": 5, "q": "Wie fügst du in eine benannte ACL eine Zeile an einer bestimmten Stelle ein?", "x": null, "o": ["Mit einer Sequenznummer, z. B. 15 permit ...", "Mit insert before", "Es ist nicht möglich.", "Mit ip access-list resequence only"], "c": [0], "e": "Mit einer Sequenznummer, z. B. 15 permit … zwischen den Zeilen 10 und 20. resequence nummeriert nur neu."}, {"d": 5, "q": "Was bewirkt ein Port-Security-Maximum von 2?", "x": null, "o": ["Höchstens zwei MAC-Adressen sind auf dem Port erlaubt.", "Höchstens zwei VLANs", "Zwei parallele SSH-Sitzungen", "Zwei Trunks"], "c": [0], "e": "Am Port sind höchstens zwei MAC-Adressen erlaubt. Eine dritte löst eine Verletzung aus."}, {"d": 5, "q": "Was bewirkt switchport port-security mac-address sticky?", "x": null, "o": ["Gelernte MAC-Adressen werden in der Running-Config gespeichert.", "Der Port wird dauerhaft gesperrt.", "MACs werden verschlüsselt.", "Der Port wird zum Trunk."], "c": [0], "e": "Gelernte MAC-Adressen werden in die Running-Config geschrieben. Damit sie einen Neustart überleben, musst du die Konfiguration speichern."}, {"d": 5, "q": "Welche Ports sind bei DHCP Snooping trusted?", "x": null, "o": ["Ports zum DHCP-Server und Uplinks", "Alle Access-Ports", "Nur Trunks ohne Server", "Keine Ports"], "c": [0], "e": "Die Ports zum DHCP-Server und die Uplinks. Access-Ports zu Endgeräten bleiben untrusted, dort darf kein DHCP-Server antworten."}, {"d": 5, "q": "Wogegen schützt BPDU Guard?", "x": null, "o": ["Gegen angeschlossene Switches an PortFast-Ports", "Gegen DHCP-Server", "Gegen ARP-Spoofing", "Gegen DoS im WAN"], "c": [0], "e": "Gegen einen Switch, der an einem PortFast-Port angeschlossen wird. Kommt dort eine BPDU an, geht der Port in err-disabled."}, {"d": 5, "q": "Welche Funktion bietet AAA Accounting?", "x": null, "o": ["Protokollierung von Anmeldungen und Aktionen", "Prüfung der Identität", "Zuweisung von Rechten", "Verschlüsselung"], "c": [0], "e": "Protokollieren, wer sich wann angemeldet und was getan hat. Authentication prüft, wer jemand ist, Authorization, was er darf."}, {"d": 5, "q": "Welcher Befehl aktiviert AAA mit lokaler Rückfalloption?", "x": null, "o": ["aaa authentication login default group tacacs+ local", "aaa login local only", "login tacacs local", "authentication aaa default"], "c": [0], "e": "aaa authentication login default group tacacs+ local. Vorher muss aaa new-model gesetzt sein. local greift, wenn kein TACACS+-Server antwortet."}, {"d": 5, "q": "Wie unterscheiden sich WPA2-Personal und -Enterprise?", "x": null, "o": ["Personal nutzt PSK, Enterprise 802.1X mit RADIUS.", "Personal nutzt 802.1X, Enterprise PSK.", "Beide nutzen einen gemeinsamen Schlüssel.", "Enterprise ist unverschlüsselt."], "c": [0], "e": "Personal nutzt einen gemeinsamen Schlüssel (PSK), Enterprise eine Anmeldung pro Benutzer über 802.1X und RADIUS."}, {"d": 5, "q": "Welche Verschlüsselung gehört zu WPA2?", "x": null, "o": ["AES-CCMP", "RC4", "TKIP als Pflicht", "Keine"], "c": [0], "e": "AES-CCMP. RC4 gehört zu WEP, TKIP war die Übergangslösung von WPA."}, {"d": 5, "q": "Was ist ein Evil Twin?", "x": null, "o": ["Ein gefälschter AP mit gleicher SSID", "Ein redundanter AP", "Ein zweiter WLC", "Ein Repeater"], "c": [0], "e": "Ein gefälschter AP mit derselben SSID. Clients verbinden sich mit ihm, und der Angreifer kann mitlesen."}, {"d": 6, "q": "Welche Eigenschaft beschreibt Idempotenz?", "x": null, "o": ["Mehrfaches Ausführen führt zum selben Zielzustand.", "Jede Ausführung verändert die Konfiguration erneut.", "Ausführung nur einmalig möglich.", "Änderungen werden rückgängig gemacht."], "c": [0], "e": "Mehrfaches Ausführen führt zum selben Zielzustand. Ist das Ziel schon erreicht, ändert ein weiterer Lauf nichts. Das macht Automatisierung wiederholbar."}, {"d": 6, "q": "In welcher Plane laufen Routing-Protokolle?", "x": null, "o": ["Control Plane", "Data Plane", "Management Plane", "Forwarding Plane"], "c": [0], "e": "In der Control Plane. Die Data Plane leitet Pakete weiter, die Management Plane dient der Verwaltung."}, {"d": 6, "q": "Welche API verbindet in einer SDN-Architektur Anwendungen mit dem Controller?", "x": null, "o": ["Northbound API (z. B. REST)", "Southbound API", "Eastbound API", "Westbound API"], "c": [0], "e": "Die Northbound-API, meist REST. Die Southbound-API verbindet den Controller mit den Geräten."}, {"d": 6, "q": "Was beschreibt ein Underlay?", "x": null, "o": ["Das physische IP-Netz, über das Overlay-Tunnel laufen", "Das virtuelle Netz über dem physischen Netz", "Eine Cloud-Region", "Ein Hypervisor"], "c": [0], "e": "Das physische IP-Netz, über das die Tunnel des Overlays laufen. Das Overlay ist das virtuelle Netz darüber, z. B. mit VXLAN."}, {"d": 6, "q": "Welche HTTP-Methode entspricht dem Anlegen einer Ressource in einer REST-API?", "x": null, "o": ["POST", "GET", "DELETE", "HEAD"], "c": [0], "e": "POST. GET liest, PUT und PATCH ändern, DELETE löscht."}, {"d": 6, "q": "Ein REST-Aufruf liefert HTTP 401. Was bedeutet das?", "x": null, "o": ["Authentifizierung fehlt oder ist ungültig.", "Ressource nicht gefunden.", "Serverfehler.", "Zugriff verboten trotz gültiger Anmeldung."], "c": [0], "e": "Die Anmeldung fehlt oder ist ungültig. 403 hieße: angemeldet, aber nicht berechtigt. 404 heißt nicht gefunden, 500 Fehler im Server."}, {"d": 6, "q": "Was ist der Wert von interfaces[1] in {\"hostname\":\"R1\",\"interfaces\":[\"Gi0/0\",\"Gi0/1\"]}?", "x": null, "o": ["\"Gi0/1\"", "\"Gi0/0\"", "\"R1\"", "Nicht definiert"], "c": [0], "e": "\"Gi0/1\". Arrays zählen ab 0, also ist [1] das zweite Element."}, {"d": 6, "q": "Welcher Fehler steckt in {\"name\":\"R1\",\"vlans\":[10,20,30,]}?", "x": null, "o": ["Abschließendes Komma nach dem letzten Element", "Fehlende Anführungszeichen bei Zahlen", "Falsche Klammerart", "Fehlender Doppelpunkt"], "c": [0], "e": "Das Komma nach dem letzten Element. JSON erlaubt es nicht. Zahlen brauchen keine Anführungszeichen."}, {"d": 6, "q": "Welches Werkzeug arbeitet agentenlos mit YAML-Playbooks?", "x": null, "o": ["Ansible", "Puppet", "Chef", "SaltStack-Agent"], "c": [0], "e": "Ansible. Es verbindet sich per SSH oder API und braucht keinen Agenten. Puppet und Chef arbeiten mit Agenten."}, {"d": 6, "q": "Welche Aussage zu Terraform ist korrekt?", "x": null, "o": ["Es beschreibt Infrastruktur deklarativ und plant Änderungen mit terraform plan.", "Es ist ein Router-Protokoll.", "Es ersetzt SNMP.", "Es arbeitet nur per CLI-Scraping."], "c": [0], "e": "Terraform beschreibt Infrastruktur deklarativ, terraform plan zeigt die geplanten Änderungen. terraform apply führt sie aus."}, {"d": 6, "q": "Welche Cisco-Komponente zentralisiert Campus-Automatisierung und Assurance?", "x": null, "o": ["Cisco DNA Center (Catalyst Center)", "Cisco Packet Tracer", "Cisco Identity Services Engine (ISE)", "Cisco Umbrella Resolver"], "c": [0], "e": "Catalyst Center (früher DNA Center). Es ist der Controller für Campus-Netze und SD-Access. ISE kümmert sich um Identität und Zugang."}, {"d": 6, "q": "Welche Aussage beschreibt Infrastructure as Code?", "x": null, "o": ["Infrastruktur wird in versionierten Dateien beschrieben und automatisiert ausgerollt.", "Konfiguration nur per Konsole", "Code wird auf Switches kompiliert", "Infrastruktur ohne Dokumentation"], "c": [0], "e": "Die Infrastruktur steht in versionierten Dateien und wird automatisch ausgerollt. Typische Werkzeuge: Git, Templates, Playbooks."}, {"d": 6, "q": "Was ist Konfigurationsdrift?", "x": null, "o": ["Abweichung der tatsächlichen Konfiguration vom Soll-Zustand", "Ein Routing-Loop", "Ein Zeitversatz", "Paketverlust"], "c": [0], "e": "Die echte Konfiguration weicht vom Sollzustand ab. Automatisierung erkennt das und stellt den Sollzustand wieder her."}, {"d": 6, "q": "Was unterscheidet deklarative von imperativen Beschreibungen?", "x": null, "o": ["Deklarativ beschreibt den Zielzustand, imperativ die Schritte.", "Deklarativ ist immer schneller.", "Imperativ beschreibt nur Zustände.", "Kein Unterschied."], "c": [0], "e": "Deklarativ beschreibt das Ziel, imperativ die Schritte dorthin. Terraform ist deklarativ, ein Skript mit Befehlen meist imperativ."}, {"d": 6, "q": "Was ist die Data Plane?", "x": null, "o": ["Sie leitet Pakete anhand der Tabellen weiter.", "Sie berechnet Routen.", "Sie verwaltet Konfigurationen.", "Sie enthält die API."], "c": [0], "e": "Sie leitet Pakete anhand der Tabellen weiter. Berechnet werden die Tabellen in der Control Plane. Die Data Plane arbeitet meist in spezieller Hardware (ASICs)."}, {"d": 6, "q": "Was beschreibt Intent-based Networking?", "x": null, "o": ["Der Admin formuliert das Ziel, das System setzt um und prüft fortlaufend.", "Das Netz arbeitet ohne Konfiguration.", "Die Hardware wird automatisch ersetzt.", "Nur Cloud-Netze."], "c": [0], "e": "Der Admin beschreibt das Ziel, das System setzt es um und prüft laufend, ob es erreicht ist. Dazu gehören Controller und Assurance."}, {"d": 6, "q": "Was gehört zur Management Plane?", "x": null, "o": ["SSH, SNMP, Syslog, NETCONF", "OSPF-Hellos", "ARP-Tabelle", "MAC-Weiterleitung"], "c": [0], "e": "SSH, SNMP, Syslog und NETCONF. OSPF gehört zur Control Plane, ARP-Tabelle und MAC-Weiterleitung zur Data Plane."}, {"d": 6, "q": "Welche Komponente koordiniert in SDN die Geräte zentral?", "x": null, "o": ["Controller", "Hypervisor", "DHCP-Server", "Access Point"], "c": [0], "e": "Der Controller. Er steuert die Geräte über Southbound-Protokolle wie NETCONF, OpenFlow oder die CLI."}, {"d": 6, "q": "Welche Southbound-Technik programmiert Flow-Tabellen in Switches?", "x": null, "o": ["OpenFlow", "SNMPv1", "TFTP", "LLDP"], "c": [0], "e": "OpenFlow. Damit schreibt ein Controller Einträge direkt in die Flow-Tabellen der Switches."}, {"d": 6, "q": "Welche HTTP-Statuscodes bedeuten Erfolg?", "x": null, "o": ["200, 201, 204", "301, 302, 307", "400, 401, 403", "500, 502, 503"], "c": [0], "e": "200, 201 und 204. 3xx sind Umleitungen, 4xx Fehler des Clients, 5xx Fehler des Servers."}, {"d": 6, "q": "Welcher HTTP-Statuscode bedeutet \"nicht gefunden\"?", "x": null, "o": ["404", "401", "403", "500"], "c": [0], "e": "404. 401 heißt nicht angemeldet, 403 keine Berechtigung, 500 Fehler im Server."}, {"d": 6, "q": "Was bedeutet es, dass REST zustandslos ist?", "x": null, "o": ["Jeder Request enthält alle nötigen Informationen.", "Der Server speichert die Sitzung.", "Es gibt keine Authentifizierung.", "Antworten sind immer leer."], "c": [0], "e": "Jede Anfrage bringt alle nötigen Informationen mit. Der Server merkt sich nichts zwischen zwei Anfragen. Das macht REST einfach und gut skalierbar."}, {"d": 6, "q": "Welches Format nutzt NETCONF?", "x": null, "o": ["XML über SSH", "JSON über HTTP", "YAML über Telnet", "CSV über TFTP"], "c": [0], "e": "XML über SSH, auf Port 830. RESTCONF nutzt HTTPS mit JSON oder XML."}, {"d": 6, "q": "Wie sind Schlüssel in JSON geschrieben?", "x": null, "o": ["In doppelten Anführungszeichen", "In einfachen Anführungszeichen", "Ohne Anführungszeichen", "In eckigen Klammern"], "c": [0], "e": "In doppelten Anführungszeichen. Einfache Anführungszeichen sind in JSON nicht erlaubt."}, {"d": 6, "q": "Welchen Datentyp hat \"enabled\": true in JSON?", "x": null, "o": ["Boolean", "String", "Zahl", "Array"], "c": [0], "e": "Boolean. Mit Anführungszeichen, also \"true\", wäre es ein String."}];
const DOM={1:'Network Fundamentals',2:'Network Access',3:'IP Connectivity',4:'IP Services',5:'Security Fundamentals',6:'Automation and Programmability'};
const WEIGHT={1:20,2:20,3:25,4:10,5:15,6:10};
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function home(){clearInterval(timer);S=null;
  const hist=lsGet('ccna_sim_hist')||[];
  let h=`<h1>CCNA 200-301 · Prüfungssimulation</h1><p class="sub">${Q.length} Fragen, gewichtet nach den sechs Domänen. Läuft offline im Browser.</p>
  <div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (60 Fragen, 60 Minuten)<small>Zufallsauswahl nach Domänengewicht, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, 120 Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  for(const d of Object.keys(DOM))h+=`<button class="sec" onclick="start('practice',${d})">Domäne ${d}: ${DOM[d]}<small>${Q.filter(q=>q.d==d).length} Fragen · Gewicht ${WEIGHT[d]} %</small></button>`;
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<p class="sub">Hinweis: Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}
function start(mode,dom){
  let qs;
  if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(60*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?3600:mode==='all'?7200:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){
  const q=S.qs[S.i],multi=q.c.length>1,practice=S.mode==='practice',locked=practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Domäne ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${esc(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Prüfung',all:'Alle Fragen',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet('ccna_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('ccna_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${esc(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
