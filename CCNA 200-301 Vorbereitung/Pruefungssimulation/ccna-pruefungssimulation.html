<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCNA Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"d": 1, "q": "Welches Gerät erkennt Angriffe und kann sie zusätzlich aktiv blockieren, weil es inline im Datenpfad sitzt?", "x": null, "o": ["IPS", "IDS", "Layer-2-Switch", "Wireless LAN Controller"], "c": [0], "e": "IPS. Es sitzt direkt im Datenweg und kann deshalb Pakete verwerfen. Ein IDS bekommt nur Kopien des Verkehrs und kann nur melden."}, {"d": 1, "q": "Welche Aufgabe hat ein Lightweight Access Point in einer Controller-Architektur?", "x": null, "o": ["Er ist über CAPWAP mit dem WLC verbunden und wird von ihm konfiguriert.", "Er routet zwischen VLANs.", "Er ersetzt den DHCP-Server.", "Er arbeitet autonom ohne Controller."], "c": [0], "e": "Er hängt über CAPWAP am WLC und wird von ihm konfiguriert. Der WLC steuert alle Lightweight-APs zentral. Ein AP, der ohne Controller arbeitet, wäre ein autonomer AP."}, {"d": 1, "q": "Ein Standort mit zwei Core- und mehreren Access-Switches nutzt keine eigene Distribution-Schicht. Wie heißt dieses Design?", "x": null, "o": ["Collapsed Core (Zwei-Schichten-Design)", "Spine-Leaf", "Full Mesh", "Hub-and-Spoke"], "c": [0], "e": "Collapsed Core. Core und Distribution sind in einer Schicht zusammengelegt, das spart Geräte. Spine-Leaf ist ein Design für Rechenzentren."}, {"d": 1, "q": "Welche Eigenschaft kennzeichnet eine Spine-Leaf-Topologie?", "x": null, "o": ["Jeder Leaf ist mit jedem Spine verbunden, Leafs sind untereinander nicht verbunden.", "Spines sind untereinander vollvermascht, Leafs hängen an genau einem Spine.", "Alle Geräte hängen an einem gemeinsamen Bus.", "Leafs sind in einem Ring verbunden."], "c": [0], "e": "Jeder Leaf hängt an jedem Spine, Leafs untereinander nicht. Dadurch liegen zwischen zwei Leafs immer gleich viele Hops. Das passt gut für Verkehr zwischen Servern im Rechenzentrum."}, {"d": 1, "q": "Zwei Switches stehen in zwei Gebäuden 2 km auseinander. Welches Medium ist geeignet?", "x": null, "o": ["Singlemode-Glasfaser", "Cat6a-UTP", "Multimode-Glasfaser mit LED", "Koaxialkabel"], "c": [0], "e": "Singlemode-Glasfaser. UTP reicht nur 100 m, Multimode wenige hundert Meter. Für Kilometer braucht es Singlemode."}, {"d": 1, "q": "Ein Switch-Port zeigt up/up, aber der Durchsatz ist schlecht, und es treten Late Collisions auf. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Duplex-Mismatch zwischen den Port-Partnern", "Falsche Subnetzmaske am Host", "Fehlendes Default Gateway", "Falsche Native VLAN"], "c": [0], "e": "Duplex-Mismatch. Eine Seite arbeitet Half-, die andere Vollduplex. Auf der Half-Duplex-Seite entstehen dadurch Late Collisions, obwohl der Link up/up ist."}, {"d": 1, "q": "Welcher Port wird für DNS-Standardabfragen verwendet?", "x": null, "o": ["UDP 53", "TCP 25", "UDP 69", "UDP 123"], "c": [0], "e": "UDP 53. Bei großen Antworten und Zonentransfers nutzt DNS zusätzlich TCP 53. TCP 25 ist SMTP, UDP 69 TFTP, UDP 123 NTP."}, {"d": 1, "q": "Welche Protokollkombination gehört zu NTP und TFTP?", "x": null, "o": ["NTP: UDP 123, TFTP: UDP 69", "NTP: TCP 123, TFTP: TCP 69", "NTP: UDP 69, TFTP: UDP 123", "NTP: UDP 161, TFTP: UDP 514"], "c": [0], "e": "NTP nutzt UDP 123, TFTP UDP 69. UDP 161 ist SNMP, UDP 514 Syslog."}, {"d": 1, "q": "Wie lautet die Broadcastadresse des Subnetzes 192.168.1.64/26?", "x": null, "o": ["192.168.1.127", "192.168.1.128", "192.168.1.126", "192.168.1.255"], "c": [0], "e": "192.168.1.127. /26 hat die Blockgröße 64. Das Subnetz reicht von .64 bis .127, die letzte Adresse ist der Broadcast. .128 ist schon das nächste Subnetz, .126 der letzte Host."}, {"d": 1, "q": "Wie viele nutzbare Hosts bietet ein /28-Subnetz?", "x": null, "o": ["14", "16", "30", "12"], "c": [0], "e": "14. /28 lässt 4 Hostbits: 2⁴ − 2 = 14. 16 hat Netz- und Broadcastadresse nicht abgezogen."}, {"d": 1, "q": "Welche Subnetzmaske gehört zu /27?", "x": null, "o": ["255.255.255.224", "255.255.255.192", "255.255.255.240", "255.255.255.248"], "c": [0], "e": "255.255.255.224. /27 sind 24 Bit plus 3 Bit im letzten Oktett: 128 + 64 + 32 = 224."}, {"d": 1, "q": "Ein Host hat 10.1.1.130/25. Welcher Host liegt im selben Subnetz?", "x": null, "o": ["10.1.1.200", "10.1.1.100", "10.1.2.130", "10.1.1.127"], "c": [0], "e": "10.1.1.200. 10.1.1.130/25 liegt im Subnetz 10.1.1.128 bis .255, und .200 auch. .100 und .127 liegen im unteren Subnetz .0 bis .127."}, {"d": 1, "q": "Für ein Subnetz werden 50 nutzbare Hosts benötigt. Welche kleinste Präfixlänge passt?", "x": null, "o": ["/26", "/25", "/27", "/28"], "c": [0], "e": "/26. Es bietet 2⁶ − 2 = 62 Hosts. /27 hätte nur 30 und reicht nicht für 50."}, {"d": 1, "q": "Welche Adresse ist eine private IPv4-Adresse nach RFC 1918?", "x": null, "o": ["172.20.5.4", "172.32.0.1", "169.254.10.1", "100.64.0.1"], "c": [0], "e": "172.20.5.4. Privat ist 172.16.0.0 bis 172.31.255.255. 172.32.0.1 ist öffentlich, 169.254.10.1 Link-Local und 100.64.0.1 der Bereich für Carrier-Grade NAT."}, {"d": 1, "q": "Ein PC erhält die Adresse 169.254.12.7. Was bedeutet das?", "x": null, "o": ["Er hat keine DHCP-Antwort erhalten (APIPA).", "Er hat eine Adresse aus dem Pool des Servers erhalten.", "Er nutzt statische Konfiguration.", "Er befindet sich im Management-VLAN."], "c": [0], "e": "Er hat keine Antwort von einem DHCP-Server bekommen (APIPA). Adressen aus 169.254.0.0/16 gibt sich ein Host selbst, wenn DHCP schweigt."}, {"d": 1, "q": "Welche Kurzform ist für 2001:0DB8:0000:0000:0000:0000:0000:0001 korrekt?", "x": null, "o": ["2001:db8::1", "2001:db8:::1", "2001:db8::0:1::", "2001:0db8::0001"], "c": [0], "e": "2001:db8::1. Führende Nullen fallen weg, und die eine lange Folge von Null-Gruppen wird zu ::. Ein :: darf nur einmal vorkommen, ::: gibt es nicht."}, {"d": 1, "q": "Welche Adresse ist eine Link-Local-IPv6-Adresse?", "x": null, "o": ["FE80::1", "FC00::1", "2001:db8::1", "FF02::1"], "c": [0], "e": "FE80::1. Link-Local liegt in FE80::/10. FC00::/7 ist ULA, 2001:db8:: ein Dokumentationsbereich, FF02::1 Multicast."}, {"d": 1, "q": "Welche Multicastadresse erreicht alle IPv6-Router im Segment?", "x": null, "o": ["FF02::2", "FF02::1", "FF02::5", "FF05::1"], "c": [0], "e": "FF02::2. FF02::1 erreicht alle Knoten, FF02::2 alle Router, FF02::5 alle OSPFv3-Router."}, {"d": 1, "q": "Wie lautet die EUI-64-Interface-ID zur MAC 00:1A:2B:3C:4D:5E?", "x": null, "o": ["021A:2BFF:FE3C:4D5E", "001A:2BFF:FE3C:4D5E", "021A:2BFE:FF3C:4D5E", "001A:2B3C:4D5E:FFFE"], "c": [0], "e": "021A:2BFF:FE3C:4D5E. FFFE kommt in die Mitte, und das 7. Bit des ersten Bytes wird umgedreht: 00 wird zu 02."}, {"d": 1, "q": "Ein Host erreicht 8.8.8.8, aber nicht www.example.com. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Falscher oder fehlender DNS-Server", "Falsches Default Gateway", "Falsche Subnetzmaske", "Defekter Switch-Port"], "c": [0], "e": "Der DNS-Server fehlt oder ist falsch. 8.8.8.8 ist erreichbar, also funktionieren Gateway und Routing. Nur die Namensauflösung klappt nicht."}, {"d": 1, "q": "Welches Frequenzband bietet nur drei überlappungsfreie 20-MHz-Kanäle?", "x": null, "o": ["2,4 GHz", "5 GHz", "6 GHz", "60 GHz"], "c": [0], "e": "2,4 GHz. Dort sind nur die Kanäle 1, 6 und 11 überlappungsfrei. 5 GHz und 6 GHz bieten viel mehr Kanäle."}, {"d": 1, "q": "Ein Switch empfängt einen Unicast-Frame mit unbekannter Ziel-MAC. Was tut er?", "x": null, "o": ["Er flutet den Frame an alle Ports desselben VLANs außer dem Eingangsport.", "Er verwirft den Frame.", "Er sendet ihn an alle Ports des Geräts.", "Er sendet ihn an den Root-Port."], "c": [0], "e": "Er flutet den Frame an alle Ports im selben VLAN, außer dem Eingangsport. Andere VLANs bekommen ihn nicht, verworfen wird er auch nicht."}, {"d": 1, "q": "Welche Aussage über VRF ist korrekt?", "x": null, "o": ["Mehrere getrennte Routing-Tabellen können auf einem Router existieren.", "VRF ersetzt VLANs auf Layer 2.", "VRF verbindet mehrere Switches zu einem logischen Gerät.", "VRF verschlüsselt den Verkehr."], "c": [0], "e": "Auf einem Router können mehrere getrennte Routing-Tabellen existieren. Das trennt Netze, sogar wenn sie dieselben Adressen nutzen. VRF arbeitet auf Layer 3 und verschlüsselt nichts."}, {"d": 1, "q": "Welche Funktion hat ein Layer-3-Switch im Vergleich zu einem Layer-2-Switch?", "x": null, "o": ["Er kann zwischen VLANs routen (SVIs, Hardware-Weiterleitung).", "Er arbeitet nur mit MAC-Adressen.", "Er ersetzt die Firewall.", "Er verbindet nur Glasfaserstrecken."], "c": [0], "e": "Er kann zwischen VLANs routen, über SVIs und in Hardware. Ein Layer-2-Switch arbeitet nur mit MAC-Adressen."}, {"d": 1, "q": "Welcher PoE-Standard liefert bis zu 30 W pro Port?", "x": null, "o": ["802.3at (PoE+)", "802.3af", "802.3bt Type 4", "802.3u"], "c": [0], "e": "802.3at (PoE+). 802.3af liefert bis 15,4 W, 802.3at bis 30 W, 802.3bt bis 60 bzw. 90 W."}, {"d": 1, "q": "Was unterscheidet eine Next-Generation Firewall von einer klassischen zustandsbehafteten Firewall?", "x": null, "o": ["Anwendungs- und Benutzererkennung sowie integrierte IPS-Funktionen", "Sie arbeitet nur auf Layer 2.", "Sie filtert ausschließlich nach MAC-Adressen.", "Sie ersetzt den Router."], "c": [0], "e": "Sie erkennt Anwendungen und Benutzer und bringt IPS-Funktionen mit. Eine klassische Firewall sieht nur Adressen, Ports und den Verbindungszustand."}, {"d": 1, "q": "Wohin gehört der Webserver in einem Netz mit DMZ?", "x": null, "o": ["In die DMZ, getrennt von internem Netz und Internet durch die Firewall", "Direkt ins interne Management-VLAN", "Außerhalb der Firewall ohne Schutz", "Auf den Access-Switch des Büros"], "c": [0], "e": "In die DMZ. Die Firewall trennt sie vom Internet und vom internen Netz. Wird der Webserver angegriffen, steht der Angreifer nicht gleich im internen Netz."}, {"d": 1, "q": "Welche Schicht des Drei-Schichten-Modells verbindet Endgeräte mit dem Netz?", "x": null, "o": ["Access", "Distribution", "Core", "WAN-Edge"], "c": [0], "e": "Access. Distribution bündelt die Access-Switches und setzt Regeln durch, Core verbindet alles schnell."}, {"d": 1, "q": "Welcher Verkehr wird als Ost-West-Verkehr bezeichnet?", "x": null, "o": ["Verkehr zwischen Servern innerhalb des Rechenzentrums", "Verkehr zwischen Client und Internet", "Verkehr zwischen zwei Standorten über das WAN", "Management-Verkehr zum NMS"], "c": [0], "e": "Verkehr zwischen Servern im Rechenzentrum. Verkehr in das Rechenzentrum hinein oder heraus heißt Nord-Süd."}, {"d": 1, "q": "Welche Eigenschaft hat ein SOHO-Netz?", "x": null, "o": ["Ein Gerät bündelt Routing, Switch, WLAN, NAT und DHCP.", "Zwei redundante Core-Router", "Spine-Leaf-Topologie", "Ein MPLS-Backbone im eigenen Betrieb"], "c": [0], "e": "Ein Gerät erledigt Routing, Switching, WLAN, NAT und DHCP. Das ist der typische Heimrouter. Redundante Core-Router oder Spine-Leaf gibt es dort nicht."}, {"d": 1, "q": "Welche maximale Länge hat ein Ethernet-Kupfersegment (UTP) laut Standard?", "x": null, "o": ["100 m", "50 m", "185 m", "1000 m"], "c": [0], "e": "100 m. Das gilt für 10/100/1000BASE-T und umfasst auch die Patchkabel."}, {"d": 1, "q": "Zwei Switches sollen per Kupfer verbunden werden, Auto-MDIX ist auf beiden aus. Welches Kabel?", "x": null, "o": ["Crossover", "Straight-through", "Rollover", "Koax"], "c": [0], "e": "Crossover. Zwei gleiche Gerätetypen brauchen ohne Auto-MDIX ein gekreuztes Kabel. Rollover ist das Konsolenkabel."}, {"d": 1, "q": "Welche Aderpaare nutzt 1000BASE-T?", "x": null, "o": ["Alle vier Paare gleichzeitig", "Zwei Paare", "Ein Paar", "Nur Paar 1 und 2"], "c": [0], "e": "Alle vier Paare gleichzeitig. 1000BASE-T sendet und empfängt auf allen vier Paaren. 100BASE-TX nutzt nur zwei."}, {"d": 1, "q": "Der Befehl show interfaces zeigt viele CRC-Fehler und Runts. Welche Ursache ist plausibel?", "x": null, "o": ["Defektes Kabel, Störungen oder Duplex-Mismatch", "Fehlendes Default Gateway", "Falsche VLAN-ID", "Fehlendes NTP"], "c": [0], "e": "Defektes Kabel, Störungen oder ein Duplex-Mismatch. CRC-Fehler und Runts deuten auf Layer 1 oder 2. Gateway, VLAN oder NTP würden keine Fehlerzähler erhöhen."}, {"d": 1, "q": "Ein Port steht auf err-disabled. Was ist der Grund?", "x": null, "o": ["Der Switch hat den Port wegen einer Verletzung (z. B. Port Security, BPDU Guard) abgeschaltet.", "Das Kabel wurde gezogen.", "Es besteht ein Duplex-Mismatch.", "Der Port ist im Trunk-Modus."], "c": [0], "e": "Der Switch hat den Port wegen eines Verstoßes abgeschaltet, z. B. durch Port Security oder BPDU Guard. Erst die Ursache beheben, dann shutdown und no shutdown."}, {"d": 1, "q": "Welches Protokoll baut Verbindungen mit einem Drei-Wege-Handshake auf?", "x": null, "o": ["TCP", "UDP", "ICMP", "ARP"], "c": [0], "e": "TCP, mit SYN, SYN/ACK und ACK. UDP, ICMP und ARP bauen keine Verbindung auf."}, {"d": 1, "q": "Welche Eigenschaft passt zu UDP?", "x": null, "o": ["Verbindungslos, ohne Zustellgarantie, geringer Overhead", "Verbindungsorientiert mit Fenstersteuerung", "Garantiert Reihenfolge", "Nutzt Drei-Wege-Handshake"], "c": [0], "e": "Verbindungslos, ohne Zustellgarantie und mit wenig Overhead. Genau deshalb nutzen DNS, Sprache und TFTP UDP. Handshake, Fenster und Reihenfolge gehören zu TCP."}, {"d": 1, "q": "Welcher Port gehört zu SSH?", "x": null, "o": ["TCP 22", "TCP 23", "TCP 25", "UDP 22"], "c": [0], "e": "TCP 22. Telnet nutzt TCP 23, SMTP TCP 25."}, {"d": 1, "q": "Welcher Port gehört zu HTTPS?", "x": null, "o": ["TCP 443", "TCP 80", "TCP 8080", "UDP 443"], "c": [0], "e": "TCP 443. HTTP nutzt TCP 80, 8080 ist ein häufiger Ersatzport für Webserver."}, {"d": 1, "q": "Wie viele nutzbare Hosts hat ein /30-Subnetz?", "x": null, "o": ["2", "4", "6", "0"], "c": [0], "e": "2. /30 lässt 2 Hostbits: 2² − 2 = 2. Typisch für Verbindungen zwischen zwei Routern."}, {"d": 1, "q": "Welche Subnetzmaske hat ein /26?", "x": null, "o": ["255.255.255.192", "255.255.255.128", "255.255.255.224", "255.255.255.240"], "c": [0], "e": "255.255.255.192. /26 sind 24 Bit plus 2 Bit: 128 + 64 = 192."}, {"d": 1, "q": "Zwei Hosts: 10.1.1.200/25 und 10.1.1.20/25. Können sie direkt miteinander kommunizieren?", "x": null, "o": ["Nein, sie liegen in verschiedenen Subnetzen.", "Ja, beide liegen im 10.1.1.0/24.", "Ja, das /25 schließt beide ein.", "Nur mit Trunk."], "c": [0], "e": "Nein, sie liegen in verschiedenen Subnetzen. /25 teilt bei .128: .20 liegt in .0 bis .127, .200 in .128 bis .255. Dazwischen braucht es einen Router."}, {"d": 1, "q": "Was ist die Netzadresse von 172.16.35.99/20?", "x": null, "o": ["172.16.32.0", "172.16.35.0", "172.16.0.0", "172.16.48.0"], "c": [0], "e": "172.16.32.0. /20 hat im 3. Oktett die Blockgröße 16 (16, 32, 48 …). 35 liegt im Block 32 bis 47."}, {"d": 1, "q": "Wofür ist die Adresse 127.0.0.1 reserviert?", "x": null, "o": ["Loopback", "Multicast", "APIPA", "Broadcast"], "c": [0], "e": "Loopback. Der ganze Bereich 127.0.0.0/8 ist dafür reserviert. Ein Ping auf 127.0.0.1 testet den eigenen TCP/IP-Stack."}, {"d": 1, "q": "Welcher Adressbereich ist IPv4-Multicast?", "x": null, "o": ["224.0.0.0/4", "240.0.0.0/4", "192.0.2.0/24", "169.254.0.0/16"], "c": [0], "e": "224.0.0.0/4, also 224.0.0.0 bis 239.255.255.255 (die alte Klasse D). 240.0.0.0/4 ist reserviert, 169.254.0.0/16 Link-Local."}, {"d": 1, "q": "Welche Präfixlänge ist für ein IPv6-LAN mit SLAAC erforderlich?", "x": null, "o": ["/64", "/48", "/56", "/128"], "c": [0], "e": "/64. SLAAC baut aus dem Präfix und einer 64-Bit-Interface-ID die Adresse. Mit einem anderen Präfix funktioniert das nicht."}, {"d": 1, "q": "Wofür dient die IPv6-Adresse ::1?", "x": null, "o": ["Loopback", "Unspezifizierte Adresse", "Default Route", "Multicast aller Knoten"], "c": [0], "e": "Loopback. :: allein ist die unspezifizierte Adresse, die ein Host benutzt, solange er noch keine hat."}, {"d": 1, "q": "Welches Protokoll ersetzt ARP bei IPv6?", "x": null, "o": ["NDP (Neighbor Discovery Protocol)", "ICMPv4", "DHCPv6", "SLAAC"], "c": [0], "e": "NDP. Neighbor Solicitation und Neighbor Advertisement finden die MAC zu einer IPv6-Adresse. DHCPv6 und SLAAC vergeben Adressen, lösen aber nichts auf."}, {"d": 1, "q": "Welcher Befehl zeigt unter Windows die vollständige IP-Konfiguration inklusive DHCP-Server?", "x": null, "o": ["ipconfig /all", "ifconfig -a", "ip addr show", "show ip interface"], "c": [0], "e": "ipconfig /all. ifconfig und ip addr gehören zu Linux und macOS, show ip interface zu Cisco."}, {"d": 1, "q": "Welcher Befehl zeigt die Route zu einem Ziel unter Windows?", "x": null, "o": ["tracert", "traceroute", "pathping -r", "nslookup -t"], "c": [0], "e": "tracert. Unter Linux, macOS und Cisco heißt der Befehl traceroute."}, {"d": 1, "q": "Was bedeutet SSID?", "x": null, "o": ["Netzwerkname eines WLANs", "MAC-Adresse des AP", "Kanalnummer", "Verschlüsselungsverfahren"], "c": [0], "e": "Der Name des WLANs. Die MAC-Adresse des Funkmoduls eines APs heißt BSSID."}, {"d": 1, "q": "Welcher Standard entspricht Wi-Fi 6?", "x": null, "o": ["802.11ax", "802.11ac", "802.11n", "802.11g"], "c": [0], "e": "802.11ax. Wi-Fi 5 ist 802.11ac, Wi-Fi 4 ist 802.11n."}, {"d": 1, "q": "Welcher Hypervisor-Typ läuft direkt auf der Hardware?", "x": null, "o": ["Typ 1", "Typ 2", "Container-Engine", "Emulator"], "c": [0], "e": "Typ 1. Er läuft direkt auf der Hardware, z. B. ESXi. Typ 2 läuft als Programm auf einem Betriebssystem, z. B. VirtualBox."}, {"d": 1, "q": "Worin unterscheiden sich Container von virtuellen Maschinen?", "x": null, "o": ["Container teilen den Kernel des Hosts.", "Container enthalten ein vollständiges Gastbetriebssystem.", "Container benötigen immer einen Hypervisor Typ 1.", "Container laufen nur auf Switches."], "c": [0], "e": "Container teilen sich den Kernel des Hosts. Deshalb starten sie schneller und brauchen weniger Ressourcen als VMs, die jeweils ein eigenes Betriebssystem haben."}, {"d": 1, "q": "Wie viele Kollisionsdomänen hat ein 24-Port-Switch mit voll belegten Ports?", "x": null, "o": ["24", "1", "2", "48"], "c": [0], "e": "24. Jeder Switch-Port ist eine eigene Kollisionsdomäne. Ein Hub hätte nur eine."}, {"d": 1, "q": "Welche Aging-Zeit hat die MAC-Tabelle eines Cisco-Switches standardmäßig?", "x": null, "o": ["300 Sekunden", "60 Sekunden", "600 Sekunden", "5 Sekunden"], "c": [0], "e": "300 Sekunden. Jeder neue Frame der Quelle setzt die Zeit zurück."}, {"d": 1, "q": "Wie nennt man den Angriff, bei dem viele gefälschte Quell-MACs die MAC-Tabelle füllen?", "x": null, "o": ["MAC Flooding", "ARP-Spoofing", "DHCP Starvation", "VLAN Hopping"], "c": [0], "e": "MAC Flooding. Ist die Tabelle voll, flutet der Switch wie ein Hub, und der Angreifer kann mitlesen. Gegenmittel ist Port Security."}, {"d": 2, "q": "Welcher Befehl zeigt alle VLANs und die zugeordneten Access-Ports?", "x": null, "o": ["show vlan brief", "show interfaces trunk", "show vtp status", "show mac address-table vlan"], "c": [0], "e": "show vlan brief. Er zeigt jedes VLAN mit seinen Access-Ports. Trunk-Ports tauchen dort nicht auf, die zeigt show interfaces trunk."}, {"d": 2, "q": "Welcher Befehl ordnet den Port Fa0/5 dem VLAN 10 als Access-Port zu?", "x": null, "o": ["switchport mode access, dann switchport access vlan 10", "switchport trunk allowed vlan 10", "vlan 10 fa0/5", "switchport voice vlan 10"], "c": [0], "e": "Erst switchport mode access, dann switchport access vlan 10. switchport voice vlan ist für Telefone, switchport trunk allowed nur für Trunks."}, {"d": 2, "q": "Router-on-a-Stick: Welche Zeile gehört in das Subinterface für VLAN 20?", "x": null, "o": ["encapsulation dot1q 20", "switchport access vlan 20", "ip helper-address 20", "vlan dot1q 20"], "c": [0], "e": "encapsulation dot1q 20. Damit weiß das Subinterface, welches VLAN-Tag es bedient. Danach folgt die IP-Adresse des Gateways."}, {"d": 2, "q": "Eine SVI für VLAN 30 bleibt down/down, obwohl sie nicht shutdown ist. Was ist eine mögliche Ursache?", "x": null, "o": ["VLAN 30 hat keinen aktiven Port und keinen Trunk, der es führt.", "ip routing fehlt.", "Der Native VLAN ist 1.", "Die Subnetzmaske ist /24."], "c": [0], "e": "VLAN 30 hat keinen aktiven Port und keinen Trunk, der es trägt. Eine SVI kommt erst hoch, wenn ihr VLAN existiert und mindestens ein aktiver Port es führt. ip routing betrifft das Routing, nicht den Zustand der SVI."}, {"d": 2, "q": "An zwei Trunk-Enden ist das Native VLAN unterschiedlich (1 und 99). Welche Folge ist wahrscheinlich?", "x": null, "o": ["CDP/STP melden einen Native-VLAN-Mismatch, Verkehr kann im falschen VLAN landen.", "Der Trunk wechselt auf Access.", "EtherChannel wird gebildet.", "Beide Seiten deaktivieren DTP."], "c": [0], "e": "CDP und STP melden einen Native-VLAN-Mismatch, und Verkehr landet im falschen VLAN. Frames ohne Tag gehören auf jeder Seite zu einem anderen VLAN. Der Trunk selbst bleibt bestehen."}, {"d": 2, "q": "Welche Kombination von DTP-Modi bildet keinen Trunk?", "x": null, "o": ["dynamic auto – dynamic auto", "dynamic desirable – dynamic auto", "dynamic desirable – dynamic desirable", "trunk – dynamic auto"], "c": [0], "e": "dynamic auto und dynamic auto. Beide warten, keiner fragt an, also bleibt der Port Access. Sobald eine Seite desirable oder trunk ist, entsteht ein Trunk."}, {"d": 2, "q": "Welcher Befehl zeigt Trunks mit erlaubten und aktiven VLANs?", "x": null, "o": ["show interfaces trunk", "show vlan brief", "show etherchannel summary", "show spanning-tree summary"], "c": [0], "e": "show interfaces trunk. Er zeigt Modus, Encapsulation, Status, Native VLAN und die erlaubten, aktiven und weitergeleiteten VLANs."}, {"d": 2, "q": "Welche Protokolle sind herstellerunabhängig bzw. Cisco-proprietär? Wähle die richtige Zuordnung.", "x": null, "o": ["LLDP: offener Standard, CDP: Cisco-proprietär", "LLDP: Cisco-proprietär, CDP: offener Standard", "Beide sind offene IEEE-Standards", "Beide sind Cisco-proprietär"], "c": [0], "e": "LLDP ist der offene Standard (IEEE 802.1AB), CDP ist Cisco-eigen."}, {"d": 2, "q": "Auf einem Cisco-Switch sollen LLDP-Nachbarn angezeigt werden. Was ist nötig?", "x": null, "o": ["lldp run global aktivieren, dann show lldp neighbors", "cdp run aktivieren", "spanning-tree lldp", "Nichts, LLDP ist standardmäßig aktiv."], "c": [0], "e": "Global lldp run, dann show lldp neighbors. Auf Cisco-Geräten ist nur CDP standardmäßig aktiv, LLDP muss man einschalten."}, {"d": 2, "q": "Welche Befehlszeile bildet einen LACP-EtherChannel?", "x": null, "o": ["channel-group 1 mode active", "channel-group 1 mode desirable", "channel-group 1 mode auto", "etherchannel 1 lacp"], "c": [0], "e": "channel-group 1 mode active. active und passive gehören zu LACP, desirable und auto zu PAgP."}, {"d": 2, "q": "Welche zwei Modi bilden mit LACP keinen Channel? (Wähle zwei)", "x": null, "o": ["passive – passive", "on – active", "active – active", "active – passive"], "c": [0, 1], "e": "passive/passive und on/active. Bei passive/passive fängt niemand an. on handelt gar nicht und passt deshalb nicht zu einer Seite mit LACP."}, {"d": 2, "q": "Im Ausgabeformat von show etherchannel summary steht für ein Port-Channel \"SU\". Was bedeutet das?", "x": "Group  Port-channel  Protocol    Ports\n1      Po1(SU)       LACP      Gi0/1(P)  Gi0/2(P)", "o": ["Layer 2, in Benutzung", "Layer 3, in Benutzung", "Down, suspendiert", "Standalone"], "c": [0], "e": "Layer 2, in Benutzung. S steht für Layer 2, U für in use. Das (P) bei den Ports heißt: im Bündel. Layer 3 wäre R."}, {"d": 2, "q": "Welcher Switch wird Root Bridge?", "x": "SW1  Priorität 32768  MAC 0000.0000.0002\nSW2  Priorität 24576  MAC 0000.0000.0009\nSW3  Priorität 24576  MAC 0000.0000.0001", "o": ["SW3", "SW1", "SW2", "Nicht bestimmbar"], "c": [0], "e": "SW3. Zuerst zählt die Priorität: SW2 und SW3 haben beide 24576. Bei Gleichstand gewinnt die kleinere MAC, und die hat SW3 (…0001)."}, {"d": 2, "q": "Welche Bridge-Priorität zeigt show spanning-tree für VLAN 10, wenn die Priorität 24576 konfiguriert wurde?", "x": null, "o": ["24586", "24576", "32778", "4106"], "c": [0], "e": "24586. PVST+ addiert die VLAN-ID zur Priorität (Extended System ID): 24576 + 10."}, {"d": 2, "q": "Welche zwei Portrollen gibt es in RSTP zusätzlich zu Root und Designated? (Wähle zwei)", "x": null, "o": ["Alternate", "Backup", "Listening", "Blocking"], "c": [0, 1], "e": "Alternate und Backup. Alternate ist der Ersatz für den Root-Port, Backup der Ersatz für einen Designated Port im selben Segment. Listening und Blocking sind Zustände aus dem alten STP, keine Rollen."}, {"d": 2, "q": "Welcher Befehl aktiviert Rapid PVST+?", "x": null, "o": ["spanning-tree mode rapid-pvst", "spanning-tree mode mst", "spanning-tree rapid", "spanning-tree portfast default"], "c": [0], "e": "spanning-tree mode rapid-pvst. mode mst würde auf MST umschalten."}, {"d": 2, "q": "Welche Funktion setzt einen PortFast-Port bei empfangener BPDU in err-disabled?", "x": null, "o": ["BPDU Guard", "Root Guard", "Loop Guard", "UplinkFast"], "c": [0], "e": "BPDU Guard. Kommt an einem PortFast-Port eine BPDU an, hängt dort ein Switch, und der Port wird abgeschaltet. Root Guard blockiert nur, er schaltet nicht ab."}, {"d": 2, "q": "Welcher AP-Modus erlaubt lokales Switching der Clientdaten und Weiterbetrieb bei WLC-Ausfall?", "x": null, "o": ["FlexConnect", "Local", "Monitor", "Sniffer"], "c": [0], "e": "FlexConnect. Der AP schaltet die Daten der Clients direkt ins lokale Netz und arbeitet ohne WLC weiter. Im Local-Modus brechen die Clients ab."}, {"d": 2, "q": "Welche Ports nutzt CAPWAP zwischen AP und WLC?", "x": null, "o": ["UDP 5246 und 5247", "UDP 161 und 162", "TCP 22 und 23", "UDP 67 und 68"], "c": [0], "e": "UDP 5246 und 5247. 5246 trägt die Steuerung, 5247 die Daten. 161/162 ist SNMP, 67/68 DHCP."}, {"d": 2, "q": "Welche Befehle sind für SSH-Zugriff notwendig? (Wähle zwei)", "x": null, "o": ["crypto key generate rsa", "transport input ssh an den VTY-Leitungen", "ip http server", "snmp-server community"], "c": [0, 1], "e": "crypto key generate rsa und transport input ssh an den VTY-Lines. Außerdem braucht es Hostname, Domänenname und einen lokalen Benutzer. ip http server ist die Weboberfläche, nicht SSH."}, {"d": 2, "q": "Welche Einstellung begrenzt VTY-Zugriff auf ein Management-Subnetz?", "x": null, "o": ["access-class an der line vty", "ip access-group an der line vty", "ip helper-address", "login block-for"], "c": [0], "e": "access-class an der line vty. ip access-group gibt es nur an Interfaces, nicht an Lines."}, {"d": 2, "q": "Auf der WLC-GUI zeigt ein Client RSSI −82 dBm. Was bedeutet das?", "x": null, "o": ["Schwaches Signal, für Sprache ungeeignet.", "Sehr gutes Signal", "Kanalinterferenz von 82 %", "Der Client nutzt 82 Mbit/s"], "c": [0], "e": "Ein schwaches Signal, für Sprache zu wenig. Für Sprache sollte der RSSI besser als −67 dBm sein. −82 dBm liegt deutlich darunter."}, {"d": 2, "q": "Wie wird ein Lightweight-AP einer SSID und einem VLAN zugeordnet?", "x": null, "o": ["Die WLAN wird einem Interface bzw. VLAN am WLC zugeordnet.", "Durch switchport access vlan am AP.", "Durch DTP.", "Durch VTP-Pruning."], "c": [0], "e": "Am WLC wird das WLAN einem Interface und damit einem VLAN zugeordnet. Der AP selbst bekommt dafür keine Switchport-Befehle."}, {"d": 2, "q": "Wo wird die VLAN-Datenbank eines Catalyst-Switches gespeichert?", "x": null, "o": ["In vlan.dat im Flash", "In der Running-Config", "Im NVRAM der Startup-Config", "Im RADIUS-Server"], "c": [0], "e": "In der Datei vlan.dat im Flash, nicht in der Running-Config. Zum Zurücksetzen: delete flash:vlan.dat und Neustart."}, {"d": 2, "q": "Welcher Bereich gehört zu erweiterten VLANs?", "x": null, "o": ["1006–4094", "2–1001", "1–99", "4095–8190"], "c": [0], "e": "1006 bis 4094. Der normale Bereich geht von 1 bis 1005."}, {"d": 2, "q": "Wofür dient ein Voice-VLAN?", "x": null, "o": ["Telefone und PC am selben Port logisch trennen und Sprache priorisieren", "Telefonie über das Native VLAN", "VoIP-Verkehr verschlüsseln", "Trunking zum Telefon deaktivieren"], "c": [0], "e": "Um Telefon und PC am selben Port zu trennen und Sprache zu bevorzugen. Das Telefon sendet mit Tag im Voice-VLAN, der PC ohne Tag im Daten-VLAN. Konfiguriert mit switchport voice vlan."}, {"d": 2, "q": "Ein Host in VLAN 10 erreicht sein Gateway nicht, das Gateway liegt hinter einem Trunk. Was prüfst du zuerst?", "x": null, "o": ["Ob VLAN 10 auf dem Trunk erlaubt und aktiv ist", "Ob NTP funktioniert", "Ob OSPF läuft", "Den DNS-Server"], "c": [0], "e": "Ob VLAN 10 auf dem Trunk erlaubt und aktiv ist. Das zeigt show interfaces trunk. NTP, OSPF und DNS spielen für die Verbindung zum Gateway keine Rolle."}, {"d": 2, "q": "Welche Zeile ist in einer Router-on-a-Stick-Konfiguration ebenfalls nötig?", "x": null, "o": ["no shutdown auf dem physischen Interface", "switchport mode trunk auf dem Router", "ip routing auf dem Router", "vtp mode client"], "c": [0], "e": "no shutdown auf dem physischen Interface. Ist es down, sind alle Subinterfaces down. Router kennen keinen switchport-Befehl."}, {"d": 2, "q": "Welche 802.1Q-Tag-Länge gilt?", "x": null, "o": ["4 Byte", "2 Byte", "8 Byte", "12 Byte"], "c": [0], "e": "4 Byte: TPID, Priorität, DEI und 12 Bit VLAN-ID."}, {"d": 2, "q": "Auf welchem VLAN werden Frames auf einem 802.1Q-Trunk ohne Tag gesendet?", "x": null, "o": ["Native VLAN", "VLAN 1 immer", "Management-VLAN", "Voice-VLAN"], "c": [0], "e": "Im Native VLAN. Standard ist VLAN 1, man kann es aber ändern. Deshalb ist „VLAN 1 immer“ falsch."}, {"d": 2, "q": "Welcher Befehl verhindert DTP-Verhandlungen auf einem Trunk-Port?", "x": null, "o": ["switchport nonegotiate", "switchport mode dynamic auto", "no cdp enable", "spanning-tree portfast"], "c": [0], "e": "switchport nonegotiate. Damit es funktioniert, muss der Port fest auf trunk oder access stehen."}, {"d": 2, "q": "Welches Intervall verwendet CDP standardmäßig zum Senden?", "x": null, "o": ["60 Sekunden", "30 Sekunden", "10 Sekunden", "180 Sekunden"], "c": [0], "e": "60 Sekunden, Holdtime 180 Sekunden. LLDP sendet alle 30 Sekunden mit 120 Sekunden Holdtime."}, {"d": 2, "q": "Welcher Befehl zeigt die IP-Adresse eines CDP-Nachbarn?", "x": null, "o": ["show cdp neighbors detail", "show cdp interface", "show cdp traffic", "show lldp"], "c": [0], "e": "show cdp neighbors detail. Erst die Detailausgabe zeigt die Management-IP, dazu Plattform und IOS-Version."}, {"d": 2, "q": "Welcher Befehl deaktiviert CDP nur auf einem Interface?", "x": null, "o": ["no cdp enable", "no cdp run", "cdp disable", "no lldp transmit"], "c": [0], "e": "no cdp enable am Interface. no cdp run schaltet CDP global auf dem ganzen Gerät ab."}, {"d": 2, "q": "Wie viele Links können in einem LACP-EtherChannel maximal gleichzeitig aktiv sein?", "x": null, "o": ["8", "2", "4", "16"], "c": [0], "e": "8. Weitere Links kann LACP als Reserve (Standby) halten."}, {"d": 2, "q": "Welche Einstellungen müssen auf allen Mitgliedsports eines EtherChannels übereinstimmen?", "x": null, "o": ["Speed, Duplex und Trunk-/VLAN-Konfiguration", "Nur der Port-Name", "Nur die Port-Priorität", "Nur die MAC-Adresse"], "c": [0], "e": "Speed, Duplex und die Trunk- bzw. VLAN-Einstellungen. Weicht ein Port ab, wird er suspendiert und nicht gebündelt."}, {"d": 2, "q": "Wie verteilt ein EtherChannel den Verkehr?", "x": null, "o": ["Per Hash auf Basis von MAC, IP oder Ports", "Paketweise im Round-Robin", "Immer nur auf dem ersten Link", "Nach Link-Auslastung in Echtzeit"], "c": [0], "e": "Per Hash über MAC, IP oder Ports. Eine einzelne Verbindung nutzt deshalb immer nur einen Link. Round-Robin pro Paket würde die Reihenfolge durcheinanderbringen."}, {"d": 2, "q": "Welcher Befehl zeigt den Zustand eines EtherChannels?", "x": null, "o": ["show etherchannel summary", "show interfaces trunk", "show spanning-tree", "show lacp counters nur"], "c": [0], "e": "show etherchannel summary. Die Flags sagen: P = im Bündel, D = down, s = suspendiert."}, {"d": 2, "q": "Welche STP-Kosten hat Gigabit Ethernet in der Short-Methode?", "x": null, "o": ["4", "19", "2", "100"], "c": [0], "e": "4. Kurze Methode: 10 Mbit/s = 100, 100 Mbit/s = 19, 1 Gbit/s = 4, 10 Gbit/s = 2."}, {"d": 2, "q": "Wie wählt ein Nicht-Root-Switch seinen Root-Port?", "x": null, "o": ["Niedrigste Root-Pfadkosten", "Höchste Port-ID", "Port mit der höchsten Bandbreite ohne Kostenvergleich", "Zufällig"], "c": [0], "e": "Nach den geringsten Kosten zur Root. Bei Gleichstand entscheiden die niedrigere Bridge-ID des Senders, dann die niedrigere Port-ID des Senders."}, {"d": 2, "q": "Welche Portzustände kennt RSTP?", "x": null, "o": ["Discarding, Learning, Forwarding", "Blocking, Listening, Learning, Forwarding", "Down, Init, Full", "Idle, Active, Backup"], "c": [0], "e": "Discarding, Learning, Forwarding. Blocking und Listening gibt es nur im alten STP (802.1D)."}, {"d": 2, "q": "Wofür dient PortFast?", "x": null, "o": ["Access-Ports gehen sofort in Forwarding.", "Es erhöht die Bandbreite von Trunks.", "Es bildet EtherChannels.", "Es verhindert Root-Wechsel."], "c": [0], "e": "Der Port geht sofort auf Forwarding. Das ist nur für Ports zu Endgeräten gedacht, am besten mit BPDU Guard."}, {"d": 2, "q": "Welche Funktion verhindert, dass ein neuer Switch die Root Bridge übernimmt?", "x": null, "o": ["Root Guard", "BPDU Guard", "PortFast", "Loop Guard"], "c": [0], "e": "Root Guard. Kommt über diesen Port eine bessere BPDU, wird er root-inconsistent und blockiert. BPDU Guard würde den Port dagegen ganz abschalten, und zwar bei jeder BPDU."}, {"d": 2, "q": "Welcher Befehl macht den Switch zur Root-Primary für VLAN 20?", "x": null, "o": ["spanning-tree vlan 20 root primary", "spanning-tree vlan 20 priority 61440", "spanning-tree root vlan 20", "spanning-tree mode root"], "c": [0], "e": "spanning-tree vlan 20 root primary. Der Switch setzt seine Priorität auf 24576 oder, falls nötig, noch niedriger. 61440 wäre die schlechteste Priorität."}, {"d": 2, "q": "Welche Standardpriorität hat ein Switch in STP?", "x": null, "o": ["32768", "4096", "8192", "61440"], "c": [0], "e": "32768. Die Priorität lässt sich in Schritten von 4096 ändern. Bei PVST+ kommt noch die VLAN-ID hinzu."}, {"d": 2, "q": "Welcher AP-Modus erfasst Funkverkehr für einen Analyzer und bedient keine Clients?", "x": null, "o": ["Sniffer", "FlexConnect", "Local", "Bridge"], "c": [0], "e": "Sniffer. Der AP schickt den mitgeschnittenen Funkverkehr an ein Analyseprogramm. Der Monitor-Modus sucht dagegen nach fremden APs."}, {"d": 2, "q": "Wie findet ein Lightweight-AP den WLC?", "x": null, "o": ["DHCP Option 43, DNS oder vorher bekannte Controller", "Nur per CDP", "Per SNMP-Trap", "Per RIP"], "c": [0], "e": "Über DHCP-Option 43, DNS oder schon bekannte Controller. Der DNS-Name lautet CISCO-CAPWAP-CONTROLLER."}, {"d": 2, "q": "Welche Architektur trennt Echtzeit-Funktionen (AP) von Management-Funktionen (WLC)?", "x": null, "o": ["Split-MAC", "Autonomous AP", "Mesh", "FlexConnect-only"], "c": [0], "e": "Split-MAC. Der AP erledigt Echtzeit-Aufgaben wie Beacons und Verschlüsselung, der WLC die Verwaltung. Verbunden sind beide über CAPWAP."}, {"d": 2, "q": "Welche WLC-Schnittstelle dient der Out-of-Band-Verwaltung?", "x": null, "o": ["Service Port", "Distribution-System-Port", "Redundancy Port", "Dynamic Interface"], "c": [0], "e": "Der Service-Port. Die Distribution-System-Ports tragen die Daten, der Redundancy-Port verbindet zwei WLCs."}, {"d": 2, "q": "Wie werden mehrere Distribution-Ports eines WLC gebündelt?", "x": null, "o": ["LAG (ohne LACP), am Switch channel-group mode on", "LACP active am Switch", "PAgP desirable", "STP"], "c": [0], "e": "Per LAG ohne LACP. Am Switch braucht es deshalb channel-group mode on."}, {"d": 2, "q": "Welche Methode ist beim Fernzugriff auf die CLI zu bevorzugen?", "x": null, "o": ["SSH", "Telnet", "HTTP", "TFTP"], "c": [0], "e": "SSH. Telnet und HTTP übertragen alles im Klartext, auch das Passwort."}, {"d": 2, "q": "Was bewirkt \"exec-timeout 5 0\" in einer Line?", "x": null, "o": ["Sitzung wird nach 5 Minuten Inaktivität beendet.", "Passwort läuft nach 5 Tagen ab.", "Maximal 5 gleichzeitige Sitzungen.", "Login nach 5 Sekunden gesperrt."], "c": [0], "e": "Die Sitzung endet nach 5 Minuten ohne Eingabe. Die beiden Zahlen sind Minuten und Sekunden."}, {"d": 2, "q": "Auf welcher Schnittstelle konfigurierst du die Management-IP eines Layer-2-Switches?", "x": null, "o": ["Auf einer SVI, z. B. interface vlan 99", "Auf einem Access-Port", "Auf dem Trunk-Port", "Auf der Konsole"], "c": [0], "e": "Auf einer SVI, z. B. interface vlan 99. Dazu gehört ip default-gateway, damit der Switch aus anderen Netzen erreichbar ist."}, {"d": 2, "q": "Welche Information zeigt die Client-Detailseite einer WLC-GUI?", "x": null, "o": ["SSID, AP-Name, Sicherheitsrichtlinie und VLAN", "Nur die Seriennummer des WLC", "Die STP-Root", "Die OSPF-Nachbarn"], "c": [0], "e": "SSID, AP, Sicherheitseinstellung und VLAN, dazu Signalwerte wie RSSI und SNR."}, {"d": 2, "q": "Welche Werte beschreiben die Signalqualität eines Clients?", "x": null, "o": ["RSSI und SNR", "TTL und MTU", "BSSID und SSID", "DSCP und CoS"], "c": [0], "e": "RSSI und SNR. RSSI ist die Empfangsstärke in dBm, SNR der Abstand zwischen Signal und Rauschen in dB."}, {"d": 3, "q": "Welche Route wird für das Ziel 10.1.1.5 genutzt?", "x": "S    10.0.0.0/8 [1/0] via 192.168.1.2\nO    10.1.0.0/16 [110/20] via 192.168.1.3\nD    10.1.1.0/24 [90/3072] via 192.168.1.4", "o": ["10.1.1.0/24 via 192.168.1.4", "10.0.0.0/8 via 192.168.1.2", "10.1.0.0/16 via 192.168.1.3", "Alle drei gleichzeitig"], "c": [0], "e": "10.1.1.0/24 über 192.168.1.4. Alle drei Routen passen, aber /24 ist am genauesten (Longest Prefix Match). Administrative Distanz und Metrik zählen erst bei gleichem Präfix."}, {"d": 3, "q": "Welche Administrative Distance hat eine intern gelernte EIGRP-Route?", "x": null, "o": ["90", "110", "120", "170"], "c": [0], "e": "90. Übersicht: connected 0, statisch 1, EIGRP intern 90, OSPF 110, RIP 120, EIGRP extern 170."}, {"d": 3, "q": "Auf dem Router steht der Eintrag \"O 10.2.0.0/16 [110/65] via 10.0.0.2\". Was bedeutet 65?", "x": null, "o": ["OSPF-Metrik (Kosten)", "Administrative Distance", "Anzahl Hops", "Alter der Route in Sekunden"], "c": [0], "e": "Die OSPF-Metrik, also die Kosten. In [110/65] ist 110 die Administrative Distanz, 65 die Metrik."}, {"d": 3, "q": "Eine statische Route und eine OSPF-Route führen zum selben Präfix. Welche wird installiert?", "x": null, "o": ["Die statische Route (AD 1)", "Die OSPF-Route (AD 110)", "Beide mit Lastverteilung", "Die mit der kleineren Metrik"], "c": [0], "e": "Die statische Route. Bei gleichem Präfix entscheidet die Administrative Distanz: 1 schlägt OSPF mit 110. Metriken verschiedener Quellen werden nicht verglichen."}, {"d": 3, "q": "Welcher Befehl konfiguriert eine Default Route zum Next-Hop 203.0.113.1?", "x": null, "o": ["ip route 0.0.0.0 0.0.0.0 203.0.113.1", "ip default-route 203.0.113.1", "ip route 0.0.0.0 255.255.255.255 203.0.113.1", "default-gateway 203.0.113.1"], "c": [0], "e": "ip route 0.0.0.0 0.0.0.0 203.0.113.1. Die Default-Route ist 0.0.0.0/0, also Maske 0.0.0.0. Mit 255.255.255.255 wäre es eine Host-Route für 0.0.0.0."}, {"d": 3, "q": "Eine Floating Static Route soll nur bei Ausfall der OSPF-Route greifen. Welche AD ist geeignet?", "x": null, "o": ["130", "1", "90", "110"], "c": [0], "e": "130. Die Ersatzroute braucht eine höhere Distanz als die Hauptroute, hier also über 110. Mit 1 oder 90 würde sie die OSPF-Route verdrängen."}, {"d": 3, "q": "Pings von A nach B funktionieren, die Antwort kommt aber nicht zurück. Was fehlt am wahrscheinlichsten?", "x": null, "o": ["Eine Rückroute zum Netz von A", "Ein DHCP-Server", "Ein NTP-Server", "VLAN 1 am Trunk"], "c": [0], "e": "Die Route zurück ins Netz von A. Der Hinweg funktioniert, aber ein Router auf dem Rückweg kennt das Netz des Absenders nicht."}, {"d": 3, "q": "Welche Angabe in einer OSPF-network-Anweisung wird für die Maske verwendet?", "x": null, "o": ["Wildcard-Maske", "Subnetzmaske", "Präfixlänge mit Schrägstrich", "Hexadezimalmaske"], "c": [0], "e": "Eine Wildcard-Maske, z. B. network 10.0.0.0 0.0.0.255 area 0."}, {"d": 3, "q": "Wie wird die OSPF-Router-ID gewählt, wenn nichts konfiguriert ist?", "x": null, "o": ["Höchste Loopback-IP, sonst höchste aktive Interface-IP", "Niedrigste Interface-IP", "Höchste MAC-Adresse", "Zufällig"], "c": [0], "e": "Die höchste Loopback-Adresse, sonst die höchste Adresse eines aktiven Interfaces. Eine von Hand gesetzte router-id hat immer Vorrang."}, {"d": 3, "q": "Zwei Router bleiben im OSPF-Zustand EXSTART/EXCHANGE hängen. Was ist die typische Ursache?", "x": null, "o": ["MTU-Mismatch zwischen den Interfaces", "Hello-Timer verschieden", "Falsche Area-ID", "Fehlende Default Route"], "c": [0], "e": "Die MTU ist verschieden. Verschiedene Hello-Timer oder Areas würden die Nachbarschaft schon viel früher stoppen. Die MTU wird erst beim Austausch der Datenbank geprüft, also in ExStart und Exchange."}, {"d": 3, "q": "Zwei Router bleiben im Zustand INIT. Was ist wahrscheinlich?", "x": null, "o": ["Hello-Pakete werden nur in einer Richtung empfangen.", "MTU stimmt nicht.", "DR-Wahl hat fehlgeschlagen.", "Die Router-IDs sind verschieden."], "c": [0], "e": "Hellos kommen nur in eine Richtung an. INIT heißt: Der Router sieht Hellos vom Nachbarn, findet seine eigene Router-ID darin aber nicht. Der Nachbar hört ihn also nicht."}, {"d": 3, "q": "Wer wird auf einem Ethernet-Segment OSPF-DR?", "x": null, "o": ["Router mit der höchsten Priorität, bei Gleichstand höchste Router-ID", "Router mit niedrigster Router-ID", "Router mit höchster Bandbreite", "Der Router, der zuerst gestartet wurde, immer"], "c": [0], "e": "Der Router mit der höchsten Priorität, bei Gleichstand der mit der höchsten Router-ID. Priorität 0 heißt: nimmt nicht teil. Die Wahl ist nicht präemptiv."}, {"d": 3, "q": "Wie lauten die Standard-Hello- und Dead-Timer von OSPF auf Ethernet?", "x": null, "o": ["10 und 40 Sekunden", "30 und 120 Sekunden", "5 und 15 Sekunden", "60 und 180 Sekunden"], "c": [0], "e": "10 und 40 Sekunden. Das gilt für Broadcast- und Punkt-zu-Punkt-Netze. NBMA nutzt 30 und 120."}, {"d": 3, "q": "Welcher Befehl verhindert OSPF-Hellos auf dem Interface zu den Hosts, kündigt das Netz aber weiter an?", "x": null, "o": ["passive-interface im OSPF-Prozess", "no ip ospf", "shutdown", "ip ospf cost 0"], "c": [0], "e": "passive-interface im OSPF-Prozess. Das Interface schickt keine Hellos mehr, sein Netz wird aber weiter angekündigt. shutdown würde das Netz ganz abschalten."}, {"d": 3, "q": "Welche Referenzbandbreite nutzt OSPF standardmäßig für die Kostenberechnung?", "x": null, "o": ["100 Mbit/s", "1 Gbit/s", "10 Gbit/s", "10 Mbit/s"], "c": [0], "e": "100 Mbit/s. Kosten = 100 Mbit/s ÷ Bandbreite, mindestens 1. FastEthernet und GigabitEthernet kosten damit beide 1."}, {"d": 3, "q": "Welcher Befehl zeigt OSPF-Nachbarschaften?", "x": null, "o": ["show ip ospf neighbor", "show ip ospf database summary only", "show ip route static", "show ospf peers"], "c": [0], "e": "show ip ospf neighbor. Er zeigt Router-ID, Priorität, Zustand, Dead-Zeit, Adresse und Interface jedes Nachbarn."}, {"d": 3, "q": "Wie verhält sich HSRP standardmäßig bei Preemption?", "x": null, "o": ["Keine, preempt muss konfiguriert werden.", "Immer aktiv", "Nur bei Priorität 255", "Nur mit Tracking"], "c": [0], "e": "Preempt ist aus und muss mit standby preempt eingeschaltet werden. Sonst holt sich ein zurückkehrender Router mit höherer Priorität die Rolle nicht zurück."}, {"d": 3, "q": "Welche Adresse tragen Hosts bei HSRP als Default Gateway ein?", "x": null, "o": ["Die virtuelle IP-Adresse der HSRP-Gruppe", "Die reale IP des Active-Routers", "Die reale IP des Standby-Routers", "Die Multicastadresse 224.0.0.2"], "c": [0], "e": "Die virtuelle IP der HSRP-Gruppe. Sie bleibt beim Wechsel gleich, deshalb merken die Hosts nichts. 224.0.0.2 ist die Multicast-Adresse der HSRP-Hellos."}, {"d": 3, "q": "Welche Aussage zu VRRP ist korrekt?", "x": null, "o": ["Offener Standard (RFC) mit Master/Backup", "Cisco-proprietär mit Active/Standby", "Verteilt Last auf mehrere Gateways automatisch", "Nur für IPv6"], "c": [0], "e": "Offener Standard (RFC) mit Master und Backup. Cisco-eigen mit Active/Standby ist HSRP, Lastverteilung bietet GLBP."}, {"d": 3, "q": "Was passiert, wenn der Router für ein Paket keine passende Route (auch keine Default Route) hat?", "x": null, "o": ["Er verwirft das Paket und sendet ICMP Destination Unreachable.", "Er flutet das Paket an alle Interfaces.", "Er leitet es an den Next-Hop mit der besten Metrik.", "Er puffert es bis zur Konvergenz."], "c": [0], "e": "Er verwirft das Paket und meldet ICMP Destination Unreachable an den Absender. Router fluten nicht."}, {"d": 3, "q": "Welche Änderung nimmt ein Router beim Weiterleiten an einem Paket vor?", "x": null, "o": ["TTL um 1 verringern und Layer-2-Header neu schreiben", "Quell-IP ersetzen", "Subnetzmaske anpassen", "TCP-Ports ändern"], "c": [0], "e": "TTL um 1 senken und einen neuen Layer-2-Header schreiben. Die IP-Adressen bleiben gleich, nur NAT würde sie ändern."}, {"d": 3, "q": "Welcher Befehl zeigt nur die OSPF-Routen der Routing-Tabelle?", "x": null, "o": ["show ip route ospf", "show ip ospf route table", "show ip protocols ospf", "show routing ospf"], "c": [0], "e": "show ip route ospf. Mit show ip route und dem Namen einer Quelle filterst du die Tabelle."}, {"d": 3, "q": "Welcher Eintrag in der Routing-Tabelle steht für die eigene Interface-Adresse als /32?", "x": null, "o": ["L (Local)", "C (Connected)", "S (Static)", "O (OSPF)"], "c": [0], "e": "L (Local). Der C-Eintrag steht für das ganze Netz am Interface, der L-Eintrag für die eigene Adresse als /32."}, {"d": 3, "q": "Welche Wirkung hat \"ip route 10.0.0.0 255.0.0.0 192.168.2.2 200\" neben einer OSPF-Route zu 10.0.0.0/8?", "x": null, "o": ["Die statische Route bleibt als Reserve ungenutzt, solange OSPF die Route stellt.", "Sie ersetzt die OSPF-Route.", "Beide werden lastverteilt.", "Sie wird nie installiert."], "c": [0], "e": "Sie bleibt als Reserve ungenutzt, solange OSPF die Route liefert. Ihre Distanz 200 ist höher als die von OSPF (110). Fällt die OSPF-Route weg, rückt die statische nach (Floating Static Route)."}, {"d": 3, "q": "Welches Merkmal gehört zu Equal-Cost Multipath (ECMP)?", "x": null, "o": ["Mehrere Pfade mit gleicher Metrik werden gleichzeitig genutzt.", "Nur ein Pfad, der andere ist Reserve.", "Pfade mit unterschiedlicher AD werden kombiniert.", "Nur für statische Routen."], "c": [0], "e": "Mehrere Wege mit gleicher Metrik werden gleichzeitig genutzt. OSPF und EIGRP können das. Wege mit verschiedener Administrativer Distanz werden nie kombiniert."}, {"d": 3, "q": "Hosts können das eigene Subnetz erreichen, aber kein anderes. Was prüfst du zuerst?", "x": null, "o": ["Default Gateway und Subnetzmaske des Hosts", "Den NTP-Server", "Die SNMP-Community", "Syslog-Server"], "c": [0], "e": "Default Gateway und Subnetzmaske des Hosts. Ein fehlendes oder falsches Gateway ist der häufigste Grund, warum nur das eigene Subnetz erreichbar ist."}, {"d": 3, "q": "Welche Option verteilt eine Default Route per OSPF an Nachbarn?", "x": null, "o": ["default-information originate", "redistribute static default", "ip default-network", "network 0.0.0.0 area 0"], "c": [0], "e": "default-information originate. Der Router muss dafür selbst eine Default-Route haben, oder man ergänzt always."}, {"d": 3, "q": "Wie viele Einträge erkennst du im Exhibit als dynamisch gelernt?", "x": "C    10.0.0.0/24 is directly connected, Gi0/0\nL    10.0.0.1/32 is directly connected, Gi0/0\nS    10.1.0.0/16 [1/0] via 10.0.0.2\nO    10.2.0.0/16 [110/20] via 10.0.0.3, 00:03:10, Gi0/0\nD    10.3.0.0/16 [90/3072] via 10.0.0.4, 00:01:05, Gi0/0", "o": ["2 (OSPF und EIGRP)", "1", "3", "5"], "c": [0], "e": "Zwei: die OSPF-Route (O) und die EIGRP-Route (D). C und L entstehen durch die eigenen Interfaces, S wurde von Hand eingetragen."}, {"d": 3, "q": "Welche Route greift im Exhibit für das Ziel 10.2.5.9?", "x": "O    10.2.0.0/16 [110/20] via 10.0.0.3\nO    10.2.5.0/24 [110/30] via 10.0.0.4\nS*   0.0.0.0/0 [1/0] via 10.0.0.9", "o": ["O 10.2.5.0/24 via 10.0.0.4", "O 10.2.0.0/16 via 10.0.0.3", "S* 0.0.0.0/0 via 10.0.0.9", "Alle drei"], "c": [0], "e": "O 10.2.5.0/24 über 10.0.0.4. Das längste passende Präfix gewinnt, auch wenn seine Metrik höher ist. Metriken zählen erst bei gleichem Präfix."}, {"d": 3, "q": "Was bedeutet der Stern bei \"S*\" in der Routing-Tabelle?", "x": null, "o": ["Die Route ist Kandidat für die Default Route.", "Die Route ist inaktiv.", "Die Route wurde über OSPF gelernt.", "Die Route ist redundant."], "c": [0], "e": "Die Route ist Kandidat für die Default-Route. Mit ihr wird das Gateway of last resort gesetzt."}, {"d": 3, "q": "Was bedeutet \"Gateway of last resort is not set\"?", "x": null, "o": ["Es existiert keine Default Route.", "Das Gateway ist nicht erreichbar.", "Alle Routen sind statisch.", "OSPF ist deaktiviert."], "c": [0], "e": "Es gibt keine Default-Route. Pakete an Ziele ohne passende Route werden verworfen."}, {"d": 3, "q": "Welche AD hat eine statische Route standardmäßig?", "x": null, "o": ["1", "0", "5", "90"], "c": [0], "e": "1. Direkt verbundene Netze haben 0, eBGP hat 20."}, {"d": 3, "q": "Welche AD hat OSPF?", "x": null, "o": ["110", "90", "120", "170"], "c": [0], "e": "110. EIGRP intern hat 90, RIP 120, EIGRP extern 170."}, {"d": 3, "q": "Welche AD hat iBGP?", "x": null, "o": ["200", "20", "170", "110"], "c": [0], "e": "200. eBGP hat 20, weil Routen von außen meist bevorzugt werden sollen."}, {"d": 3, "q": "Welche Quelle gewinnt bei gleichem Präfix: RIP (120) oder OSPF (110)?", "x": null, "o": ["OSPF", "RIP", "Beide gleichzeitig", "Die mit der kleineren Metrik"], "c": [0], "e": "OSPF. Bei gleichem Präfix gewinnt die kleinere Administrative Distanz: 110 vor 120. Die Metriken verschiedener Protokolle werden nicht verglichen."}, {"d": 3, "q": "Wie bestimmt ein Router bei mehreren Treffern die verwendete Route?", "x": null, "o": ["Erst längster Präfix, dann niedrigste AD, dann niedrigste Metrik", "Erst niedrigste Metrik, dann AD", "Erst AD, dann Präfixlänge", "Immer die zuletzt gelernte"], "c": [0], "e": "Erst das längste Präfix, dann die kleinste Administrative Distanz, dann die kleinste Metrik."}, {"d": 3, "q": "Was passiert beim Weiterleiten mit der TTL eines IP-Pakets?", "x": null, "o": ["Sie wird um 1 verringert.", "Sie bleibt gleich.", "Sie wird verdoppelt.", "Sie wird auf 0 gesetzt."], "c": [0], "e": "Sie sinkt um 1. Erreicht sie 0, verwirft der Router das Paket."}, {"d": 3, "q": "Welche Meldung sendet ein Router bei TTL = 0?", "x": null, "o": ["ICMP Time Exceeded", "ICMP Redirect", "ICMP Echo Reply", "ICMP Source Quench"], "c": [0], "e": "ICMP Time Exceeded. Genau das nutzt traceroute: Es schickt Pakete mit steigender TTL und sammelt die Meldungen jedes Routers ein."}, {"d": 3, "q": "Wie sieht eine Host-Route aus?", "x": null, "o": ["ip route 10.1.1.5 255.255.255.255 192.168.1.2", "ip route 10.1.1.5 255.255.255.0 192.168.1.2", "ip route 10.1.1.0 0.0.0.255 192.168.1.2", "ip route host 10.1.1.5"], "c": [0], "e": "ip route 10.1.1.5 255.255.255.255 192.168.1.2. Eine Host-Route hat die Maske /32 und gilt für genau eine Adresse. 0.0.0.255 ist eine Wildcard und hat in ip route nichts zu suchen."}, {"d": 3, "q": "Welcher Befehl konfiguriert eine statische IPv6-Route?", "x": null, "o": ["ipv6 route 2001:db8:2::/64 2001:db8:1::2", "ip route 2001:db8:2::/64 2001:db8:1::2", "route ipv6 2001:db8:2:: 64", "ipv6 static 2001:db8:2::/64"], "c": [0], "e": "ipv6 route 2001:db8:2::/64 2001:db8:1::2. Für IPv6 heißt der Befehl ipv6 route, nicht ip route. Voraussetzung ist ipv6 unicast-routing."}, {"d": 3, "q": "Welcher Befehl aktiviert IPv6-Routing auf einem Cisco-Router?", "x": null, "o": ["ipv6 unicast-routing", "ipv6 enable global", "ip routing ipv6", "ipv6 route enable"], "c": [0], "e": "ipv6 unicast-routing. Ohne diesen Befehl leitet der Router kein IPv6 weiter, auch wenn die Interfaces Adressen haben."}, {"d": 3, "q": "Welche Eigenschaft hat OSPF als Protokoll?", "x": null, "o": ["Link-State, SPF-Algorithmus, IP-Protokoll 89", "Distanzvektor, Hop-Count-Metrik", "Pfadvektor, TCP 179", "Distanzvektor mit DUAL"], "c": [0], "e": "Link-State mit SPF-Algorithmus, IP-Protokoll 89. Hop-Count ist RIP, TCP 179 ist BGP, DUAL ist EIGRP."}, {"d": 3, "q": "Welche Multicastadresse nutzt OSPF für alle OSPF-Router?", "x": null, "o": ["224.0.0.5", "224.0.0.6", "224.0.0.9", "224.0.0.10"], "c": [0], "e": "224.0.0.5. An 224.0.0.6 erreicht man nur DR und BDR. 224.0.0.9 ist RIPv2, 224.0.0.10 EIGRP."}, {"d": 3, "q": "Welche Parameter müssen für eine OSPF-Nachbarschaft übereinstimmen?", "x": null, "o": ["Area-ID, Hello-/Dead-Timer, Authentifizierung und Subnetz", "Router-ID", "Interface-Beschreibung", "Prozess-ID"], "c": [0], "e": "Area-ID, Hello- und Dead-Timer, Authentisierung und Subnetz. Die Router-IDs müssen dagegen verschieden sein. Die Prozess-ID gilt nur lokal und darf abweichen."}, {"d": 3, "q": "Welcher Zustand folgt in OSPF nach 2-Way (bei DR/BDR-Beziehungen)?", "x": null, "o": ["ExStart", "Init", "Down", "Loading direkt"], "c": [0], "e": "ExStart. Die Reihenfolge lautet Down, Init, 2-Way, ExStart, Exchange, Loading, Full."}, {"d": 3, "q": "Welche Rolle hat der BDR?", "x": null, "o": ["Er übernimmt, wenn der DR ausfällt.", "Er sendet alle LSAs allein.", "Er ist Root der Area.", "Er löscht die LSDB."], "c": [0], "e": "Er übernimmt, wenn der DR ausfällt. Dafür hält er schon eine volle Nachbarschaft zu allen. DR und BDR verringern die Zahl der Nachbarschaften im Segment."}, {"d": 3, "q": "Welche Beziehung besteht zwischen zwei DROTHER-Routern im selben Segment?", "x": null, "o": ["2-Way, keine volle Adjazenz", "Full", "Down", "ExStart"], "c": [0], "e": "2-Way, ohne volle Nachbarschaft. Voll benachbart sind nur DR und BDR mit allen anderen. Das ist normal und kein Fehler."}, {"d": 3, "q": "Wie wird OSPF direkt am Interface aktiviert?", "x": null, "o": ["ip ospf 1 area 0", "ospf enable area 0", "network area 0 ip", "router ospf area 0"], "c": [0], "e": "ip ospf 1 area 0 am Interface. Das ist die Alternative zu network-Befehlen unter router ospf."}, {"d": 3, "q": "Welche Kosten hat ein Gigabit-Interface bei Referenzbandbreite 100 Mbit/s?", "x": null, "o": ["1", "10", "100", "0"], "c": [0], "e": "1. 100 ÷ 1000 ergibt 0,1, aber das Minimum ist 1. Deshalb passt man in Netzen mit schnellen Links die Referenzbandbreite an."}, {"d": 3, "q": "Welcher Befehl passt die OSPF-Referenzbandbreite auf 10 Gbit/s an?", "x": null, "o": ["auto-cost reference-bandwidth 10000", "ip ospf cost 10000", "bandwidth 10000000", "ospf reference 10G"], "c": [0], "e": "auto-cost reference-bandwidth 10000. Der Wert ist in Mbit/s und muss auf allen Routern gleich sein. ip ospf cost setzt nur die Kosten eines einzelnen Interfaces."}, {"d": 3, "q": "Welcher Befehl zeigt Hello-/Dead-Timer eines OSPF-Interfaces?", "x": null, "o": ["show ip ospf interface", "show ip ospf database", "show ip route ospf", "show running-config ospf"], "c": [0], "e": "show ip ospf interface. Er zeigt auch Kosten, DR, BDR und den Netztyp."}, {"d": 3, "q": "Wie lang ist die OSPF-Dead-Zeit auf Ethernet?", "x": null, "o": ["40 Sekunden", "10 Sekunden", "120 Sekunden", "4 Sekunden"], "c": [0], "e": "40 Sekunden, also das Vierfache der Hello-Zeit von 10 Sekunden."}, {"d": 3, "q": "Was bewirkt Priorität 0 auf einem OSPF-Interface?", "x": null, "o": ["Der Router nimmt nicht an der DR-/BDR-Wahl teil.", "Der Router wird DR.", "Das Interface wird deaktiviert.", "Hellos werden unterdrückt."], "c": [0], "e": "Der Router nimmt nicht an der DR- und BDR-Wahl teil. Das Interface bleibt aktiv und sendet weiter Hellos."}, {"d": 3, "q": "Welche Maske gehört in network 192.168.1.0 0.0.0.255 area 0?", "x": null, "o": ["Wildcard 0.0.0.255 entspricht /24.", "Subnetzmaske 0.0.0.255", "/8", "/32"], "c": [0], "e": "Die Wildcard 0.0.0.255 entspricht /24. Wildcards sind umgekehrte Masken: Eine 0 heißt „muss passen“, eine 1 „egal“."}, {"d": 3, "q": "Welche Funktion bieten FHRPs?", "x": null, "o": ["Virtuelles Standard-Gateway mit automatischem Wechsel bei Ausfall", "Lastverteilung zwischen VLANs", "Verschlüsselung von Routing-Updates", "Schleifenschutz im Layer 2"], "c": [0], "e": "Ein virtuelles Gateway, das bei einem Ausfall automatisch auf einen anderen Router wechselt. Beispiele sind HSRP, VRRP und GLBP."}, {"d": 3, "q": "Welche Timer nutzt HSRP standardmäßig?", "x": null, "o": ["Hello 3 s, Hold 10 s", "Hello 10 s, Hold 40 s", "Hello 1 s, Hold 3 s", "Hello 30 s, Hold 120 s"], "c": [0], "e": "Hello 3 s, Hold 10 s. 10 und 40 Sekunden sind die Timer von OSPF."}, {"d": 3, "q": "Welche Rolle übernimmt der Standby-Router in HSRP?", "x": null, "o": ["Er übernimmt, wenn der Active-Router ausfällt.", "Er leitet allen Verkehr weiter.", "Er ist DHCP-Server.", "Er überwacht STP."], "c": [0], "e": "Er übernimmt, wenn der Active-Router ausfällt. Bis dahin leitet nur der Active weiter und beantwortet die ARP-Anfragen nach der virtuellen IP."}, {"d": 3, "q": "Wie verringert HSRP-Tracking die Priorität?", "x": null, "o": ["Wenn das beobachtete Interface ausfällt, sinkt die Priorität um den konfigurierten Wert.", "Es erhöht die Priorität bei Überlast.", "Es schaltet das Interface ab.", "Es synchronisiert die Uhrzeit."], "c": [0], "e": "Fällt das überwachte Interface aus, sinkt die Priorität um den eingestellten Wert. Beispiel: standby 1 track g0/1 20. Damit der Standby übernimmt, braucht er Preempt."}, {"d": 3, "q": "Welcher Befehl zeigt eine Kurzübersicht der HSRP-Gruppen?", "x": null, "o": ["show standby brief", "show hsrp", "show ip hsrp", "show glbp"], "c": [0], "e": "show standby brief. Er zeigt Gruppe, Priorität, Zustand, Active, Standby und virtuelle IP."}, {"d": 3, "q": "Beide HSRP-Router zeigen Active. Was ist die wahrscheinlichste Ursache?", "x": null, "o": ["Die Hellos erreichen sich nicht (Layer-2-Problem, ACL, falsche Gruppe).", "OSPF-Area passt nicht.", "NTP ist falsch.", "MTU zu groß."], "c": [0], "e": "Die Hellos kommen nicht an, z. B. wegen eines Problems auf Layer 2, einer ACL oder einer falschen Gruppe. Jeder Router glaubt, allein zu sein, und wird Active."}, {"d": 3, "q": "Welche Pfadauswahl gilt bei zwei gleichwertigen OSPF-Pfaden?", "x": null, "o": ["Lastverteilung über beide Pfade (ECMP)", "Nur der Pfad mit der niedrigeren Next-Hop-IP", "Nur der erste gelernte Pfad", "Kein Pfad, bis ein Admin entscheidet"], "c": [0], "e": "Lastverteilung über beide Wege (ECMP). OSPF nutzt standardmäßig bis zu vier gleich gute Wege."}, {"d": 4, "q": "Welche Konfiguration ist für PAT auf die Interface-Adresse nötig? (Wähle zwei)", "x": null, "o": ["ip nat inside source list 1 interface g0/1 overload", "ip nat inside bzw. ip nat outside an den Interfaces", "ip nat pool ohne ACL", "ip nat outside source static"], "c": [0, 1], "e": "ip nat inside source list 1 interface g0/1 overload und ip nat inside bzw. outside an den Interfaces. Ohne die Markierung der Interfaces wird nichts übersetzt. Ein Pool ist für PAT auf die Interface-Adresse nicht nötig."}, {"d": 4, "q": "Welche Bezeichnung hat die öffentliche Adresse eines internen Hosts nach der Übersetzung?", "x": null, "o": ["Inside Global", "Inside Local", "Outside Local", "Outside Global"], "c": [0], "e": "Inside Global. Inside Local ist die private Adresse des Hosts, Inside Global die Adresse, unter der er außen erscheint."}, {"d": 4, "q": "Welcher Befehl zeigt aktive NAT-Übersetzungen?", "x": null, "o": ["show ip nat translations", "show ip nat pool", "show nat table", "show ip interface nat"], "c": [0], "e": "show ip nat translations. show ip nat statistics zeigt Zähler und welche Interfaces inside und outside sind."}, {"d": 4, "q": "Welche Stratum-Nummer hat ein NTP-Server, der direkt mit einer Referenzuhr verbunden ist?", "x": null, "o": ["1", "0", "2", "15"], "c": [0], "e": "1. Stratum 0 ist die Referenzuhr selbst, der direkt daran angeschlossene Server hat Stratum 1."}, {"d": 4, "q": "Welcher Befehl richtet einen Router als NTP-Client zu 192.0.2.1 ein?", "x": null, "o": ["ntp server 192.0.2.1", "ntp client 192.0.2.1", "ntp master 192.0.2.1", "clock source 192.0.2.1"], "c": [0], "e": "ntp server 192.0.2.1. ntp master macht den Router dagegen selbst zur Zeitquelle."}, {"d": 4, "q": "Wie läuft die DHCP-Adressvergabe in der richtigen Reihenfolge ab?", "x": null, "o": ["Discover, Offer, Request, Acknowledge", "Request, Offer, Discover, Acknowledge", "Offer, Discover, Acknowledge, Request", "Discover, Request, Offer, Acknowledge"], "c": [0], "e": "Discover, Offer, Request, Acknowledge (DORA). Der Client sucht, der Server bietet an, der Client fordert an, der Server bestätigt."}, {"d": 4, "q": "DHCP-Clients in VLAN 20 erhalten keine Adressen, der Server steht in einem anderen Subnetz. Was fehlt am wahrscheinlichsten?", "x": null, "o": ["ip helper-address am Gateway-Interface von VLAN 20", "ip dhcp snooping trust am Client-Port", "ntp server", "ip nat inside"], "c": [0], "e": "ip helper-address am Gateway-Interface von VLAN 20. Das Discover ist ein Broadcast und endet am Router. Der Relay schickt es als Unicast an den Server weiter."}, {"d": 4, "q": "Welche Version von SNMP bietet Authentifizierung und Verschlüsselung?", "x": null, "o": ["SNMPv3", "SNMPv1", "SNMPv2c", "Alle Versionen"], "c": [0], "e": "SNMPv3. v1 und v2c senden die Community im Klartext und verschlüsseln nichts."}, {"d": 4, "q": "Wie lautet der Syslog-Schweregrad 3?", "x": null, "o": ["Error", "Warning", "Critical", "Notification"], "c": [0], "e": "Error. Die Reihenfolge: 0 Emergency, 1 Alert, 2 Critical, 3 Error, 4 Warning, 5 Notification, 6 Informational, 7 Debug."}, {"d": 4, "q": "Welche DSCP-Klasse wird üblicherweise für Sprachpakete verwendet?", "x": null, "o": ["EF (46)", "AF11", "CS0", "AF41"], "c": [0], "e": "EF mit dem Wert 46. AF41 ist für Video gedacht, CS0 ist Best Effort."}, {"d": 4, "q": "Welche Maßnahme gehört zu Shaping im Gegensatz zu Policing?", "x": null, "o": ["Überschüssiger Verkehr wird gepuffert und später gesendet.", "Überschüssiger Verkehr wird sofort verworfen.", "Pakete werden nur markiert.", "Die Verbindung wird getrennt."], "c": [0], "e": "Der Überschuss wird gepuffert und später gesendet. Policing verwirft ihn dagegen sofort oder markiert ihn um."}, {"d": 4, "q": "Welches Protokoll nutzt UDP 69 und überträgt Dateien ohne Authentifizierung?", "x": null, "o": ["TFTP", "FTP", "SCP", "SFTP"], "c": [0], "e": "TFTP. FTP nutzt TCP 20 und 21 mit Anmeldung. SCP und SFTP laufen verschlüsselt über SSH."}, {"d": 4, "q": "Welcher NAT-Typ ordnet viele interne Adressen einer öffentlichen Adresse über Ports zu?", "x": null, "o": ["PAT (NAT Overload)", "Statisches NAT", "Dynamisches NAT mit Pool", "Destination NAT"], "c": [0], "e": "PAT (NAT Overload). Es unterscheidet die Verbindungen über die Quellports. Statisches und dynamisches NAT ordnen dagegen 1:1 zu."}, {"d": 4, "q": "Wann setzt du statisches NAT ein?", "x": null, "o": ["Wenn ein interner Server unter fester öffentlicher Adresse erreichbar sein soll.", "Wenn viele Clients ins Internet sollen.", "Wenn IPv6 genutzt wird.", "Wenn DHCP fehlt."], "c": [0], "e": "Wenn ein interner Server unter einer festen öffentlichen Adresse erreichbar sein soll. Für viele Clients ins Internet nimmt man PAT."}, {"d": 4, "q": "PAT funktioniert nicht, die ACL ist korrekt. Was ist die häufigste Ursache?", "x": null, "o": ["ip nat inside oder ip nat outside fehlt an einem Interface.", "NTP ist nicht synchron.", "STP blockiert einen Port.", "Der Syslog-Server fehlt."], "c": [0], "e": "ip nat inside oder ip nat outside fehlt an einem Interface. Danach prüfen: Steht overload im Befehl, und ist das Outside-Interface up?"}, {"d": 4, "q": "Welche Ports nutzt DHCP?", "x": null, "o": ["UDP 67 (Server) und 68 (Client)", "UDP 53 und 69", "TCP 67 und 68", "UDP 161 und 162"], "c": [0], "e": "UDP 67 für den Server und 68 für den Client. 53 ist DNS, 69 TFTP, 161/162 SNMP."}, {"d": 4, "q": "Wie lange dauert es bis zur ersten Erneuerung des DHCP-Leases (T1)?", "x": null, "o": ["50 % der Lease-Zeit", "25 %", "87,5 %", "100 %"], "c": [0], "e": "Nach 50 % der Lease-Zeit (T1). Dann fragt der Client seinen Server direkt. Bei 87,5 % (T2) fragt er per Broadcast jeden Server."}, {"d": 4, "q": "Welcher Befehl schließt Adressen von der DHCP-Vergabe aus?", "x": null, "o": ["ip dhcp excluded-address", "ip dhcp pool exclude", "no ip dhcp address", "dhcp deny range"], "c": [0], "e": "ip dhcp excluded-address. Damit nimmst du z. B. Gateway, Server und Drucker von der Vergabe aus."}, {"d": 4, "q": "Welche Datensatzart löst einen Namen in eine IPv4-Adresse auf?", "x": null, "o": ["A-Record", "AAAA-Record", "MX-Record", "PTR-Record"], "c": [0], "e": "Der A-Record. AAAA gilt für IPv6, MX nennt den Mailserver, PTR löst rückwärts auf."}, {"d": 4, "q": "Welche Aufgabe hat ein SNMP-Trap?", "x": null, "o": ["Das Gerät meldet ein Ereignis selbständig an den Manager.", "Der Manager fragt Werte ab.", "Der Manager ändert eine Einstellung.", "Das Gerät authentifiziert einen Benutzer."], "c": [0], "e": "Das Gerät meldet ein Ereignis von sich aus an den Manager, über UDP 162. Abfragen und Änderungen gehen dagegen vom Manager aus."}, {"d": 4, "q": "Welche Syslog-Zielart speichert Meldungen im RAM des Geräts?", "x": null, "o": ["Buffer (logging buffered)", "logging host", "logging trap", "logging snmp"], "c": [0], "e": "Der Puffer, eingerichtet mit logging buffered. logging host schickt an einen Server, logging trap legt das Level dafür fest."}, {"d": 4, "q": "Welche Syslog-Stufe hat die höchste Dringlichkeit?", "x": null, "o": ["0 (Emergency)", "7 (Debug)", "1 (Alert)", "3 (Error)"], "c": [0], "e": "0 (Emergency). 7 (Debug) ist am wenigsten dringend. logging trap 4 schickt die Level 0 bis 4."}, {"d": 4, "q": "Wofür steht CoS im Zusammenhang mit QoS?", "x": null, "o": ["3 Bit im 802.1Q-Tag auf Layer 2", "6 Bit im IP-Header", "Ein Routing-Metrik-Wert", "Ein Kompressionsverfahren"], "c": [0], "e": "3 Bit im 802.1Q-Tag, also auf Layer 2. DSCP sind die 6 Bit im IP-Header."}, {"d": 4, "q": "Welche Voraussetzungen hat SSH auf einem Cisco-Router?", "x": null, "o": ["Hostname, Domain-Name, RSA-Schlüssel und lokaler Benutzer", "Nur ein enable password", "Nur ein HTTP-Server", "Nur eine ACL"], "c": [0], "e": "Hostname, Domänenname, RSA-Schlüssel und ein lokaler Benutzer. Danach an den VTY-Lines transport input ssh und login local."}, {"d": 4, "q": "Welcher Befehl sichert die Running-Config auf einen TFTP-Server?", "x": null, "o": ["copy running-config tftp:", "copy tftp: flash:", "write tftp", "backup config tftp"], "c": [0], "e": "copy running-config tftp:. Der Router fragt danach Server-Adresse und Dateiname ab. copy tftp: flash: kopiert in die Gegenrichtung."}, {"d": 5, "q": "Welches Schutzziel verletzt ein Angreifer, der Daten im Transit mitliest?", "x": null, "o": ["Vertraulichkeit", "Integrität", "Verfügbarkeit", "Nichtabstreitbarkeit"], "c": [0], "e": "Vertraulichkeit. Mitlesen verletzt die Vertraulichkeit, Verändern die Integrität, Lahmlegen die Verfügbarkeit."}, {"d": 5, "q": "Welche Aussage beschreibt Phishing am besten?", "x": null, "o": ["Täuschung von Benutzern, um Zugangsdaten oder Aktionen zu erschleichen", "Überlastung eines Servers durch viele Anfragen", "Abhören von Funkverkehr", "Ausnutzen eines unbekannten Softwarefehlers"], "c": [0], "e": "Benutzer werden getäuscht, um an Zugangsdaten zu kommen oder sie zu einer Handlung zu bringen. Phishing ist Social Engineering, meist per E-Mail. Überlastung wäre DoS."}, {"d": 5, "q": "Welcher Befehl speichert das privilegierte Passwort als Hash?", "x": null, "o": ["enable secret", "enable password", "service password-encryption", "password 7"], "c": [0], "e": "enable secret. enable password steht im Klartext in der Konfiguration oder wird mit service password-encryption nur als Typ 7 verschleiert."}, {"d": 5, "q": "Welche Passworttypen gelten als stark?", "x": null, "o": ["Typ 8 und Typ 9", "Typ 0 und Typ 7", "Nur Typ 5", "Nur Typ 7"], "c": [0], "e": "Typ 8 und Typ 9. Typ 8 ist PBKDF2, Typ 9 scrypt. Typ 0 ist Klartext, Typ 7 lässt sich umkehren, Typ 5 (MD5) gilt als schwach."}, {"d": 5, "q": "Welcher Zweck gehört zu IPsec ESP?", "x": null, "o": ["Verschlüsselung und Integrität der Nutzdaten", "Nur Authentifizierung ohne Verschlüsselung", "Schlüsselaustausch für SSH", "Routenaustausch"], "c": [0], "e": "Verschlüsselung und Schutz der Nutzdaten vor Veränderung. AH schützt nur vor Veränderung, ohne zu verschlüsseln."}, {"d": 5, "q": "Welcher IPsec-Modus verpackt bei Site-to-Site-VPNs das ganze Paket mit einem neuen IP-Header?", "x": null, "o": ["Tunnelmodus", "Transportmodus", "Aggressive Mode", "Quick Mode"], "c": [0], "e": "Der Tunnelmodus. Er verpackt das komplette Paket und setzt die Adressen der Gateways außen davor. Der Transportmodus schützt nur die Nutzlast. Main, Aggressive und Quick Mode sind Phasen von IKE, keine IPsec-Modi."}, {"d": 5, "q": "Wo wird eine Standard-ACL idealerweise platziert?", "x": null, "o": ["Nahe am Ziel", "Nahe an der Quelle", "Immer am Core", "Auf der Konsolenleitung"], "c": [0], "e": "Nah am Ziel. Eine Standard-ACL kennt nur die Quelle. Nah an der Quelle würde sie den Absender für alle Ziele sperren. Extended-ACLs gehören dagegen nah an die Quelle."}, {"d": 5, "q": "Welche Wildcard-Maske passt zu 192.168.10.0/26?", "x": null, "o": ["0.0.0.63", "0.0.0.31", "255.255.255.192", "0.0.0.127"], "c": [0], "e": "0.0.0.63. Die Wildcard ist die Umkehrung der Maske: 255.255.255.255 − 255.255.255.192 = 0.0.0.63. 255.255.255.192 ist die Maske selbst."}, {"d": 5, "q": "Welche Zeile erlaubt HTTP von 10.1.1.0/24 zu jedem Ziel?", "x": null, "o": ["permit tcp 10.1.1.0 0.0.0.255 any eq 80", "permit tcp 10.1.1.0 255.255.255.0 any eq 80", "permit udp 10.1.1.0 0.0.0.255 any eq 80", "permit ip any 10.1.1.0 0.0.0.255 eq 80"], "c": [0], "e": "permit tcp 10.1.1.0 0.0.0.255 any eq 80. HTTP läuft über TCP, und ACLs erwarten eine Wildcard, keine Subnetzmaske. In der letzten Option stehen Quelle und Ziel vertauscht, und eq ist bei ip nicht erlaubt."}, {"d": 5, "q": "Eine ACL enthält nur \"deny tcp any any eq 23\". Welche Folge hat die Anwendung am Interface?", "x": null, "o": ["Aller Verkehr wird blockiert (implizites deny any).", "Nur Telnet wird blockiert.", "Nur Telnet wird erlaubt.", "Die ACL ist wirkungslos."], "c": [0], "e": "Alles wird blockiert. Am Ende steht das unsichtbare deny any. Ohne eine einzige permit-Zeile kommt nichts durch."}, {"d": 5, "q": "Welche Port-Security-Violation-Aktion setzt den Port auf err-disabled?", "x": null, "o": ["shutdown", "restrict", "protect", "drop"], "c": [0], "e": "shutdown, und das ist auch der Standard. restrict verwirft und meldet, protect verwirft still. „drop“ gibt es als Modus nicht."}, {"d": 5, "q": "Welche Funktion verhindert gefälschte DHCP-Server im Netz?", "x": null, "o": ["DHCP Snooping", "Dynamic ARP Inspection", "Port Security", "BPDU Guard"], "c": [0], "e": "DHCP Snooping. Nur Ports, die als trusted markiert sind, dürfen DHCP-Antworten schicken. DAI prüft dagegen ARP."}, {"d": 5, "q": "Welche Funktion nutzt die DHCP-Snooping-Binding-Tabelle, um ARP-Spoofing zu blockieren?", "x": null, "o": ["Dynamic ARP Inspection", "Port Security", "IP Source Guard allein", "Root Guard"], "c": [0], "e": "Dynamic ARP Inspection. Sie vergleicht jede ARP-Nachricht mit der Tabelle aus DHCP Snooping und verwirft falsche Zuordnungen."}, {"d": 5, "q": "Welche Protokolleigenschaft passt zu TACACS+?", "x": null, "o": ["TCP 49, verschlüsselt den gesamten Inhalt, trennt AAA", "UDP 1812, verschlüsselt nur das Passwort", "UDP 514, überträgt Logs", "TCP 22"], "c": [0], "e": "TCP 49, das ganze Paket verschlüsselt, die drei A getrennt. UDP 1812 mit nur verschlüsseltem Passwort ist RADIUS, UDP 514 Syslog, TCP 22 SSH."}, {"d": 5, "q": "Welche Rolle hat der Supplicant bei 802.1X?", "x": null, "o": ["Der Client, der sich authentifiziert", "Der Switch, der den Port steuert", "Der RADIUS-Server", "Der DHCP-Server"], "c": [0], "e": "Das Endgerät, das sich anmeldet. Der Switch oder AP ist der Authenticator, der RADIUS-Server der Authentication Server."}, {"d": 5, "q": "Welcher Standard bietet ein SAE-Verfahren statt eines PSK-Handshakes?", "x": null, "o": ["WPA3-Personal", "WEP", "WPA2-Enterprise", "WPA-TKIP"], "c": [0], "e": "WPA3-Personal. SAE ersetzt den PSK-Handshake von WPA2. Ein mitgeschnittener Handshake lässt sich dann nicht mehr offline knacken."}, {"d": 5, "q": "Welche Schritte sind in der WLC-GUI nötig, um ein WPA2-PSK-WLAN anzulegen? (Wähle zwei)", "x": null, "o": ["Security-Tab: WPA2 mit PSK und Passphrase festlegen", "WLAN einem Interface/VLAN zuordnen und aktivieren", "Einen RADIUS-Server als Authentication Server angeben", "Einen TACACS+-Server definieren"], "c": [0, 1], "e": "Im Reiter Security WPA2 mit PSK und Passphrase wählen, außerdem das WLAN einem Interface zuordnen und aktivieren. Einen RADIUS-Server braucht nur Enterprise (802.1X)."}, {"d": 5, "q": "Was ist der Unterschied zwischen Bedrohung und Schwachstelle?", "x": null, "o": ["Bedrohung ist die mögliche Ursache eines Schadens, Schwachstelle die ausnutzbare Schwäche.", "Beide Begriffe sind Synonyme.", "Schwachstelle ist ein Angreifer, Bedrohung eine Software.", "Bedrohung ist immer physisch."], "c": [0], "e": "Die Bedrohung ist die mögliche Ursache eines Schadens, die Schwachstelle die Schwäche, die sie ausnutzen kann. Trifft beides zusammen, entsteht ein Risiko."}, {"d": 5, "q": "Welche Maßnahme schützt vor Social Engineering am besten?", "x": null, "o": ["Schulung und klare Prozesse zur Identitätsprüfung", "Eine ACL am Perimeter", "Höhere Bandbreite", "Mehr VLANs"], "c": [0], "e": "Schulung und klare Abläufe, wie man Identitäten prüft. Social Engineering täuscht Menschen, das verhindert keine ACL und keine Bandbreite."}, {"d": 5, "q": "Welche Aussage beschreibt Defense in Depth?", "x": null, "o": ["Mehrere hintereinander liegende Schutzschichten", "Ein einziger starker Schutz am Perimeter", "Verzicht auf Passwörter", "Nur Verschlüsselung"], "c": [0], "e": "Mehrere Schutzschichten hintereinander. Fällt eine aus, halten die anderen noch."}, {"d": 5, "q": "Welche drei Faktoren kombiniert Multi-Faktor-Authentifizierung?", "x": null, "o": ["Wissen, Besitz, Inhärenz", "Benutzername, Passwort, Domain", "Token, Zertifikat, Passwort desselben Typs", "IP, MAC, VLAN"], "c": [0], "e": "Wissen, Besitz und Sein (Inhärenz). Also z. B. Passwort, Smartphone und Fingerabdruck. Zwei Faktoren derselben Art, etwa zwei Passwörter, sind keine MFA."}, {"d": 5, "q": "Warum ist ein Passwort mit 16 Zeichen oft besser als ein kurzes komplexes?", "x": null, "o": ["Länge erhöht die Zahl der Möglichkeiten stark und ist merkbar.", "Komplexität zählt nie.", "Es spielt keine Rolle.", "Kurze Passwörter sind nicht angreifbar."], "c": [0], "e": "Weil jede zusätzliche Stelle die Zahl der Möglichkeiten vervielfacht und eine Passphrase sich gut merken lässt. Komplexität hilft auch, aber Länge wirkt stärker."}, {"d": 5, "q": "Was bedeutet Least Privilege?", "x": null, "o": ["Nur die nötigen Rechte vergeben", "Alle Benutzer erhalten Administratorrechte", "Rechte werden nie entzogen", "Nur der Chef hat Zugriff"], "c": [0], "e": "Nur die Rechte vergeben, die für die Aufgabe nötig sind. Wird ein Konto übernommen, bleibt der Schaden so klein."}, {"d": 5, "q": "Welche Passwortart bietet service password-encryption?", "x": null, "o": ["Typ 7 (reversibel)", "Typ 5", "Typ 8", "Typ 9"], "c": [0], "e": "Typ 7. Er lässt sich leicht umkehren und schützt nur vor einem Blick über die Schulter."}, {"d": 5, "q": "Wie begrenzt du Anmeldeversuche gegen Brute Force?", "x": null, "o": ["login block-for 120 attempts 5 within 60", "exec-timeout 120", "password min-length 120", "banner motd"], "c": [0], "e": "login block-for 120 attempts 5 within 60. Nach 5 Fehlversuchen in 60 Sekunden ist die Anmeldung 120 Sekunden gesperrt. exec-timeout beendet nur untätige Sitzungen."}, {"d": 5, "q": "Welche Aufgabe hat IKE Phase 1?", "x": null, "o": ["Aufbau eines sicheren Kanals zwischen den Peers (IKE SA)", "Verschlüsselung der Nutzdaten", "Routing-Austausch", "Zuweisung von IP-Adressen"], "c": [0], "e": "Einen sicheren Kanal zwischen den beiden Peers aufbauen (IKE-SA). Erst in Phase 2 werden die Schlüssel für die Nut
