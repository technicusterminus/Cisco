 (was wird passieren), Prescriptive (was ist zu tun)."}, {"d": 3, "q": "Die OSPF-Nachbarschaft zwischen R1 und R2 bleibt in EXSTART. Was ist die wahrscheinlichste Ursache?", "x": "R1# show ip ospf neighbor\nNeighbor ID  Pri State            Dead Time  Address     Interface\n2.2.2.2        1 EXSTART/DR       00:00:33   10.0.0.2    Gi0/0\nR1# show interfaces gi0/0 | include MTU\n  MTU 1500 bytes\nR2# show interfaces gi0/0 | include MTU\n  MTU 1400 bytes", "o": ["MTU-Mismatch zwischen den Interfaces", "Unterschiedliche Hello-Timer", "Unterschiedliche Area-ID", "Falsche Authentifizierung"], "c": [0], "e": "Die MTU ist unterschiedlich (1500 gegen 1400). OSPF vergleicht die MTU in den DBD-Paketen und hängt dann in ExStart oder Exchange fest. Falsche Timer, Area oder Authentisierung würden schon früher stoppen, in Init oder gar nicht."}, {"d": 3, "q": "Welche Route nutzt R1 für das Ziel 10.1.1.5?", "x": "R1# show ip route\nO    10.1.0.0/16 [110/20] via 192.168.1.2, Gi0/0\nD    10.1.1.0/24 [90/3072] via 192.168.2.2, Gi0/1\nS    10.1.1.0/25 [1/0] via 192.168.3.2\nB    10.0.0.0/8 [20/0] via 192.168.4.2", "o": ["Die statische Route 10.1.1.0/25 via 192.168.3.2", "Die EIGRP-Route 10.1.1.0/24", "Die OSPF-Route 10.1.0.0/16", "Die BGP-Route 10.0.0.0/8"], "c": [0], "e": "Die statische Route 10.1.1.0/25. Beim Weiterleiten gewinnt immer das längste passende Präfix, und /25 enthält .5. Die Administrative Distance zählt erst bei gleich langen Präfixen."}, {"d": 3, "q": "Warum bleibt der EtherChannel nicht aktiv?", "x": "SW1# show etherchannel summary\nGroup  Port-channel  Protocol    Ports\n1      Po1(SD)       LACP        Gi0/1(I)  Gi0/2(I)\n\nSW1# show running-config interface gi0/1\ninterface GigabitEthernet0/1\n channel-group 1 mode passive\nSW2# show running-config interface gi0/1\ninterface GigabitEthernet0/1\n channel-group 1 mode passive", "o": ["Beide Seiten sind passive, keine Seite startet die LACP-Aushandlung.", "LACP ist nicht kompatibel mit Gigabit-Ports.", "Port-Channel-Nummer muss auf beiden Seiten verschieden sein.", "Es fehlt switchport mode trunk."], "c": [0], "e": "Beide Seiten stehen auf passive, also fragt keine Seite nach. Mindestens eine muss active sein. Die Ports zeigen (I): Sie arbeiten einzeln, ohne Channel."}, {"d": 3, "q": "Welcher Port wird von R2 als Root-Port für VLAN 1 gewählt?", "x": "R2# show spanning-tree vlan 1\nRoot ID    Priority 32769  Address 0011.1111.1111\n           Cost 4  Port 1 (GigabitEthernet0/1)\nBridge ID  Priority 32769  Address 0022.2222.2222\n\nInterface   Role Sts Cost Prio.Nbr Type\nGi0/1       Root FWD 4    128.1    P2p\nGi0/2       Altn BLK 4    128.2    P2p\nGi0/3       Desg FWD 4    128.3    P2p", "o": ["Gi0/1", "Gi0/2", "Gi0/3", "Keiner, R2 ist die Root Bridge"], "c": [0], "e": "Gi0/1. Er hat die Rolle Root und leitet weiter. Gi0/2 ist Alternate und blockiert, Gi0/3 ist Designated. R2 ist nicht Root, weil Root-ID und eigene Bridge-ID verschieden sind."}, {"d": 3, "q": "Warum kommt keine BGP-Sitzung zustande?", "x": "R1# show ip bgp summary\nNeighbor     V   AS MsgRcvd MsgSent  Up/Down  State/PfxRcd\n203.0.113.2  4  65002       0       5  00:05:12  Active\n\nR1# show running-config | section router bgp\nrouter bgp 65001\n neighbor 203.0.113.2 remote-as 65003", "o": ["remote-as stimmt nicht mit der AS-Nummer des Nachbarn (65002 laut Tabelle) überein.", "Das BGP-Passwort fehlt.", "Die eBGP-Peers müssen in derselben AS liegen.", "Der Router benötigt eine Router-ID im IPv6-Format."], "c": [0], "e": "R1 erwartet AS 65003, der Nachbar meldet sich im OPEN aber mit 65002. R1 bricht mit der Fehlermeldung „Bad Peer AS“ ab, und die Sitzung pendelt zwischen Idle und Active. Lösung: <code>neighbor 203.0.113.2 remote-as 65002</code>."}, {"d": 4, "q": "Welche Aussage zu diesem IP-SLA-Ergebnis stimmt?", "x": "R1# show ip sla statistics\nIPSLAs Latest Operation Statistics\nIPSLA operation id: 10\n  Latest RTT: NoConnection/Busy/Timeout\nLatest operation return code: Timeout\nNumber of successes: 0\nNumber of failures: 12", "o": ["Das Ziel antwortet nicht; ein daran gekoppeltes Tracking-Objekt wäre down.", "Das Ziel ist erreichbar, aber langsam.", "Die Messung ist noch nicht gestartet.", "Der Responder fehlt für ICMP-Echo."], "c": [0], "e": "Das Ziel antwortet nicht: 12 Fehlversuche, kein Erfolg, Rückgabe Timeout. Ein daran gekoppeltes Tracking-Objekt wäre down, die getrackte Route also entfernt. Für ICMP-Echo braucht es keinen Responder."}, {"d": 5, "q": "Warum wird der Client am Port nicht authentifiziert?", "x": "SW1# show authentication sessions interface gi0/5\n  Interface:   GigabitEthernet0/5\n  MAC Address: 0050.7966.6801\n  Status:      Unauth\n  Method status list:\n     dot1x      Failed over\n     mab        Not run", "o": ["Der Client hat keinen 802.1X-Supplicant (Failover), MAB ist nicht konfiguriert oder nicht aktiv.", "Der Client hat ein falsches Passwort eingegeben.", "Der Port ist in err-disabled.", "Spanning Tree blockiert den Port."], "c": [0], "e": "802.1X fand keinen Supplicant („Failed over“), und MAB ist nicht gelaufen („Not run“). Ohne MAB bleibt ein Gerät ohne 802.1X unauthorisiert. Lösung: <code>mab</code> am Port und <code>authentication order dot1x mab</code>."}, {"d": 5, "q": "Welche Wirkung hat die ACL auf Verkehr von 10.1.1.10 zu 10.2.2.20 per HTTP?", "x": "ip access-list extended TEST\n 10 deny tcp 10.1.1.0 0.0.0.255 any eq 80\n 20 permit tcp host 10.1.1.10 any eq 80\n 30 permit ip any any\ninterface g0/0\n ip access-group TEST in", "o": ["Der Verkehr wird verworfen, weil Zeile 10 zuerst trifft.", "Der Verkehr wird erlaubt, weil Zeile 20 genauer ist.", "Der Verkehr wird erlaubt, weil Zeile 30 alles erlaubt.", "Der Verkehr wird gespiegelt."], "c": [0], "e": "Der Verkehr wird verworfen, weil Zeile 10 zuerst passt. Die ACL hört beim ersten Treffer auf. Dass Zeile 20 genauer ist, spielt keine Rolle."}, {"d": 6, "q": "Was gibt dieser Python-Code aus?", "x": "data = {\"devices\": [{\"name\": \"R1\", \"up\": True}, {\"name\": \"R2\", \"up\": False}]}\nfor d in data[\"devices\"]:\n    if not d[\"up\"]:\n        print(d[\"name\"])", "o": ["R2", "R1", "R1 und R2", "True"], "c": [0], "e": "R2. Die Schleife gibt nur Geräte aus, deren up-Wert False ist. <code>not False</code> ist True."}, {"d": 6, "q": "Welche Aktion erzeugt die folgende REST-Anfrage?", "x": "PUT /restconf/data/ietf-interfaces:interfaces/interface=Gi0%2F1\nContent-Type: application/yang-data+json\n{\"ietf-interfaces:interface\":{\"name\":\"Gi0/1\",\"enabled\":false}}", "o": ["Sie ersetzt die Konfiguration von Gi0/1 und schaltet das Interface administrativ ab.", "Sie liest den Zustand von Gi0/1.", "Sie löscht das Interface.", "Sie fügt ein zusätzliches Interface hinzu."], "c": [0], "e": "Sie ersetzt die Konfiguration von Gi0/1 und schaltet das Interface ab. PUT ersetzt die ganze Ressource durch den mitgeschickten Inhalt, und <code>enabled: false</code> entspricht shutdown."}];
const DOM={1:'Architektur',2:'Virtualisierung',3:'Infrastruktur',4:'Network Assurance',5:'Security',6:'Automation'};
const WEIGHT={1:15,2:10,3:30,4:10,5:20,6:15};
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rich=s=>esc(s).replace(/&lt;(\/?)(code|b)&gt;/g,'<$1$2>');const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function home(){clearInterval(timer);S=null;
  const hist=lsGet('encor_sim_hist')||[];
  let h=`<h1>CCNP ENCOR 350-401 v1.2 · Prüfungssimulation</h1><p class="sub">${Q.length} Fragen, gewichtet nach den sechs Domänen. Läuft offline im Browser.</p>
  <div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (60 Fragen, 75 Minuten)<small>Zufallsauswahl nach Domänengewicht, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, 180 Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  for(const d of Object.keys(DOM))h+=`<button class="sec" onclick="start('practice',${d})">Domäne ${d}: ${DOM[d]}<small>${Q.filter(q=>q.d==d).length} Fragen · Gewicht ${WEIGHT[d]} %</small></button>`;
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<p class="sub">Hinweis: Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}
function start(mode,dom){
  let qs;
  if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(60*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?4500:mode==='all'?10800:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){
  const q=S.qs[S.i],multi=q.c.length>1,practice=S.mode==='practice',locked=practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Domäne ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${rich(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Prüfung',all:'Alle Fragen',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet('encor_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('encor_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${rich(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
