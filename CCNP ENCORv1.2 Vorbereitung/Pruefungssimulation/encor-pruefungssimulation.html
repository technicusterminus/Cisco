redictive führt die Reparatur automatisch aus.", "Prescriptive misst nur Bandbreite.", "Beide ersetzen Telemetrie."], "c": [0], "e": "Predictive sagt Probleme anhand von Mustern voraus, Prescriptive schlägt zusätzlich Gegenmaßnahmen vor. Die Stufen: Descriptive (was ist passiert), Diagnostic (warum), Predictive (was wird passieren), Prescriptive (was ist zu tun)."}, {"d": 3, "q": "Die OSPF-Nachbarschaft zwischen R1 und R2 bleibt in EXSTART. Was ist die wahrscheinlichste Ursache?", "x": "R1# show ip ospf neighbor\nNeighbor ID  Pri State            Dead Time  Address     Interface\n2.2.2.2        1 EXSTART/DR       00:00:33   10.0.0.2    Gi0/0\nR1# show interfaces gi0/0 | include MTU\n  MTU 1500 bytes\nR2# show interfaces gi0/0 | include MTU\n  MTU 1400 bytes", "o": ["MTU-Mismatch zwischen den Interfaces", "Unterschiedliche Hello-Timer", "Unterschiedliche Area-ID", "Falsche Authentifizierung"], "c": [0], "e": "Die MTU ist unterschiedlich (1500 gegen 1400). OSPF vergleicht die MTU in den DBD-Paketen und hängt dann in ExStart oder Exchange fest. Falsche Timer, Area oder Authentisierung würden schon früher stoppen, in Init oder gar nicht."}, {"d": 3, "q": "Welche Route nutzt R1 für das Ziel 10.1.1.5?", "x": "R1# show ip route\nO    10.1.0.0/16 [110/20] via 192.168.1.2, Gi0/0\nD    10.1.1.0/24 [90/3072] via 192.168.2.2, Gi0/1\nS    10.1.1.0/25 [1/0] via 192.168.3.2\nB    10.0.0.0/8 [20/0] via 192.168.4.2", "o": ["Die statische Route 10.1.1.0/25 via 192.168.3.2", "Die EIGRP-Route 10.1.1.0/24", "Die OSPF-Route 10.1.0.0/16", "Die BGP-Route 10.0.0.0/8"], "c": [0], "e": "Die statische Route 10.1.1.0/25. Beim Weiterleiten gewinnt immer das längste passende Präfix, und /25 enthält .5. Die Administrative Distance zählt erst bei gleich langen Präfixen."}, {"d": 3, "q": "Warum bleibt der EtherChannel nicht aktiv?", "x": "SW1# show etherchannel summary\nGroup  Port-channel  Protocol    Ports\n1      Po1(SD)       LACP        Gi0/1(I)  Gi0/2(I)\n\nSW1# show running-config interface gi0/1\ninterface GigabitEthernet0/1\n channel-group 1 mode passive\nSW2# show running-config interface gi0/1\ninterface GigabitEthernet0/1\n channel-group 1 mode passive", "o": ["Beide Seiten sind passive, keine Seite startet die LACP-Aushandlung.", "LACP ist nicht kompatibel mit Gigabit-Ports.", "Port-Channel-Nummer muss auf beiden Seiten verschieden sein.", "Es fehlt switchport mode trunk."], "c": [0], "e": "Beide Seiten stehen auf passive, also fragt keine Seite nach. Mindestens eine muss active sein. Die Ports zeigen (I): Sie arbeiten einzeln, ohne Channel."}, {"d": 3, "q": "Welcher Port wird von R2 als Root-Port für VLAN 1 gewählt?", "x": "R2# show spanning-tree vlan 1\nRoot ID    Priority 32769  Address 0011.1111.1111\n           Cost 4  Port 1 (GigabitEthernet0/1)\nBridge ID  Priority 32769  Address 0022.2222.2222\n\nInterface   Role Sts Cost Prio.Nbr Type\nGi0/1       Root FWD 4    128.1    P2p\nGi0/2       Altn BLK 4    128.2    P2p\nGi0/3       Desg FWD 4    128.3    P2p", "o": ["Gi0/1", "Gi0/2", "Gi0/3", "Keiner, R2 ist die Root Bridge"], "c": [0], "e": "Gi0/1. Er hat die Rolle Root und leitet weiter. Gi0/2 ist Alternate und blockiert, Gi0/3 ist Designated. R2 ist nicht Root, weil Root-ID und eigene Bridge-ID verschieden sind."}, {"d": 3, "q": "Warum kommt keine BGP-Sitzung zustande?", "x": "R1# show ip bgp summary\nNeighbor     V   AS MsgRcvd MsgSent  Up/Down  State/PfxRcd\n203.0.113.2  4  65002       0       5  00:05:12  Active\n\nR1# show running-config | section router bgp\nrouter bgp 65001\n neighbor 203.0.113.2 remote-as 65003", "o": ["remote-as stimmt nicht mit der AS-Nummer des Nachbarn (65002 laut Tabelle) überein.", "Das BGP-Passwort fehlt.", "Die eBGP-Peers müssen in derselben AS liegen.", "Der Router benötigt eine Router-ID im IPv6-Format."], "c": [0], "e": "R1 erwartet AS 65003, der Nachbar meldet sich im OPEN aber mit 65002. R1 bricht mit der Fehlermeldung „Bad Peer AS“ ab, und die Sitzung pendelt zwischen Idle und Active. Lösung: <code>neighbor 203.0.113.2 remote-as 65002</code>."}, {"d": 4, "q": "Welche Aussage zu diesem IP-SLA-Ergebnis stimmt?", "x": "R1# show ip sla statistics\nIPSLAs Latest Operation Statistics\nIPSLA operation id: 10\n  Latest RTT: NoConnection/Busy/Timeout\nLatest operation return code: Timeout\nNumber of successes: 0\nNumber of failures: 12", "o": ["Das Ziel antwortet nicht; ein daran gekoppeltes Tracking-Objekt wäre down.", "Das Ziel ist erreichbar, aber langsam.", "Die Messung ist noch nicht gestartet.", "Der Responder fehlt für ICMP-Echo."], "c": [0], "e": "Das Ziel antwortet nicht: 12 Fehlversuche, kein Erfolg, Rückgabe Timeout. Ein daran gekoppeltes Tracking-Objekt wäre down, die getrackte Route also entfernt. Für ICMP-Echo braucht es keinen Responder."}, {"d": 5, "q": "Warum wird der Client am Port nicht authentifiziert?", "x": "SW1# show authentication sessions interface gi0/5\n  Interface:   GigabitEthernet0/5\n  MAC Address: 0050.7966.6801\n  Status:      Unauth\n  Method status list:\n     dot1x      Failed over\n     mab        Not run", "o": ["Der Client hat keinen 802.1X-Supplicant (Failover), MAB ist nicht konfiguriert oder nicht aktiv.", "Der Client hat ein falsches Passwort eingegeben.", "Der Port ist in err-disabled.", "Spanning Tree blockiert den Port."], "c": [0], "e": "802.1X fand keinen Supplicant („Failed over“), und MAB ist nicht gelaufen („Not run“). Ohne MAB bleibt ein Gerät ohne 802.1X unauthorisiert. Lösung: <code>mab</code> am Port und <code>authentication order dot1x mab</code>."}, {"d": 5, "q": "Welche Wirkung hat die ACL auf Verkehr von 10.1.1.10 zu 10.2.2.20 per HTTP?", "x": "ip access-list extended TEST\n 10 deny tcp 10.1.1.0 0.0.0.255 any eq 80\n 20 permit tcp host 10.1.1.10 any eq 80\n 30 permit ip any any\ninterface g0/0\n ip access-group TEST in", "o": ["Der Verkehr wird verworfen, weil Zeile 10 zuerst trifft.", "Der Verkehr wird erlaubt, weil Zeile 20 genauer ist.", "Der Verkehr wird erlaubt, weil Zeile 30 alles erlaubt.", "Der Verkehr wird gespiegelt."], "c": [0], "e": "Der Verkehr wird verworfen, weil Zeile 10 zuerst passt. Die ACL hört beim ersten Treffer auf. Dass Zeile 20 genauer ist, spielt keine Rolle."}, {"d": 6, "q": "Was gibt dieser Python-Code aus?", "x": "data = {\"devices\": [{\"name\": \"R1\", \"up\": True}, {\"name\": \"R2\", \"up\": False}]}\nfor d in data[\"devices\"]:\n    if not d[\"up\"]:\n        print(d[\"name\"])", "o": ["R2", "R1", "R1 und R2", "True"], "c": [0], "e": "R2. Die Schleife gibt nur Geräte aus, deren up-Wert False ist. <code>not False</code> ist True."}, {"d": 6, "q": "Welche Aktion erzeugt die folgende REST-Anfrage?", "x": "PUT /restconf/data/ietf-interfaces:interfaces/interface=Gi0%2F1\nContent-Type: application/yang-data+json\n{\"ietf-interfaces:interface\":{\"name\":\"Gi0/1\",\"enabled\":false}}", "o": ["Sie ersetzt die Konfiguration von Gi0/1 und schaltet das Interface administrativ ab.", "Sie liest den Zustand von Gi0/1.", "Sie löscht das Interface.", "Sie fügt ein zusätzliches Interface hinzu."], "c": [0], "e": "Sie ersetzt die Konfiguration von Gi0/1 und schaltet das Interface ab. PUT ersetzt die ganze Ressource durch den mitgeschickten Inhalt, und <code>enabled: false</code> entspricht shutdown."}, {"d": 3, "q": "Warum ist der Pfad über 10.12.0.2 der beste?", "x": "R1# show ip bgp 203.0.113.0\nBGP routing table entry for 203.0.113.0/24, version 12\nPaths: (2 available, best #2, table default)\n  65020 65100\n    10.13.0.2 from 10.13.0.2 (3.3.3.3)\n      Origin IGP, metric 0, localpref 100, valid, external\n  65010 65100\n    10.12.0.2 from 10.12.0.2 (20.20.20.20)\n      Origin IGP, metric 0, localpref 150, valid, external, best", "o": ["Er hat die höhere Local Preference (150 gegen 100).", "Er hat die niedrigere Router-ID.", "Er hat den kürzeren AS-Pfad.", "Er ist der ältere eBGP-Pfad."], "c": [0], "e": "Wegen der Local Preference 150. Weight ist bei beiden 0, also entscheidet als Nächstes die Local Preference, und höher gewinnt. AS-Pfad-Länge (je 2) und Router-ID kämen erst später, die Router-ID von 10.12.0.2 (20.20.20.20) ist sogar die höhere."}, {"d": 3, "q": "Was sagt die Ausgabe über den Nachbarn 10.13.0.2?", "x": "R1# show ip bgp summary\nNeighbor        V    AS MsgRcvd MsgSent   TblVer  InQ OutQ Up/Down  State/PfxRcd\n10.12.0.2       4 65010     152     149       12    0    0 02:11:43        5\n10.13.0.2       4 65020       0       0        1    0    0 never    Active", "o": ["Es besteht keine Sitzung. R1 versucht weiter, eine TCP-Verbindung aufzubauen.", "Die Sitzung steht und ist aktiv, es kommen nur keine Präfixe.", "Der Nachbar ist mit shutdown administrativ abgeschaltet.", "Die Sitzung steht, R1 hat 0 Präfixe gefiltert."], "c": [0], "e": "Keine Sitzung, R1 versucht es weiter. „Active“ ist trotz des Namens ein Fehlerzustand: R1 wartet auf oder versucht eine TCP-Verbindung. Eine stehende Sitzung zeigt in dieser Spalte eine Zahl (empfangene Präfixe), ein abgeschalteter Nachbar „Idle (Admin)“."}, {"d": 3, "q": "R3 ist mit drei Routern im selben Segment. Welche Aussage trifft zu?", "x": "R3# show ip ospf neighbor\nNeighbor ID     Pri   State           Dead Time   Address       Interface\n1.1.1.1         100   FULL/DR         00:00:35    10.0.0.1      Gi0/0\n2.2.2.2          50   FULL/BDR        00:00:31    10.0.0.2      Gi0/0\n4.4.4.4           1   2WAY/DROTHER    00:00:38    10.0.0.4      Gi0/0", "o": ["Alles normal: R3 ist selbst DROTHER, und zwei DROTHER bleiben untereinander in 2WAY.", "Zu R4 gibt es einen MTU-Mismatch, sonst wäre er FULL.", "R3 ist der DR des Segments.", "R4 hat die falsche Area und hängt deshalb in 2WAY."], "c": [0], "e": "Das ist normal. Auf Multiaccess-Segmenten bilden die Router nur mit DR und BDR eine volle Nachbarschaft. Zwei DROTHER sehen sich, tauschen aber keine Datenbank aus und bleiben in 2WAY. Ein MTU-Problem zeigte sich in EXSTART oder EXCHANGE, eine falsche Area verhinderte die Nachbarschaft ganz."}, {"d": 3, "q": "Welche Aussagen zur Routing-Tabelle stimmen? (Wähle zwei)", "x": "R1# show ip route ospf\nO        10.1.1.0/24 [110/2] via 10.0.12.2, 00:12:01, GigabitEthernet0/0\nO IA     10.2.2.0/24 [110/3] via 10.0.12.2, 00:12:01, GigabitEthernet0/0\nO E2     172.16.0.0/16 [110/20] via 10.0.12.2, 00:12:01, GigabitEthernet0/0\nO N2     192.168.50.0/24 [110/20] via 10.0.13.3, 00:03:44, GigabitEthernet0/1", "o": ["10.2.2.0/24 liegt in einer anderen Area und kommt per Typ-3-LSA.", "192.168.50.0/24 wurde in einer NSSA redistributiert und kommt als Typ-7-LSA.", "Bei 172.16.0.0/16 enthält die Metrik 20 schon die internen OSPF-Kosten.", "10.1.1.0/24 ist eine externe Route."], "c": [0, 1], "e": "IA = Inter-Area (Typ 3), N2 = NSSA-extern (Typ 7). Bei E2 und N2 bleibt die Metrik auf dem Wert, mit dem sie eingespeist wurden (hier 20), die internen Kosten kommen nicht dazu. „O“ ohne Zusatz ist eine Route aus der eigenen Area."}, {"d": 3, "q": "Ist 10.0.13.3 ein Feasible Successor für 10.5.0.0/24?", "x": "R1# show ip eigrp topology all-links\nP 10.5.0.0/24, 1 successors, FD is 3072, serno 14\n        via 10.0.12.2 (3072/2816), GigabitEthernet0/0\n        via 10.0.13.3 (3328/3072), GigabitEthernet0/1", "o": ["Nein. Seine Reported Distance 3072 ist nicht kleiner als die Feasible Distance 3072.", "Ja, weil seine Metrik 3328 nur knapp über dem Successor liegt.", "Ja, jeder zweite Pfad ist automatisch Feasible Successor.", "Nein, weil er über ein anderes Interface läuft."], "c": [0], "e": "Nein. Die Feasibility Condition verlangt RD < FD, also 3072 < 3072, und das ist falsch. Gleichheit reicht nicht, denn dann könnte der Weg über R1 selbst zurückführen. Fällt der Successor aus, muss EIGRP deshalb eine Query starten."}, {"d": 3, "q": "Warum ist R1 trotz Priorität 110 nur Standby?", "x": "R1# show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nVl10        10   110   Standby 10.1.10.3       local           10.1.10.1", "o": ["Auf R1 fehlt preempt, und R2 (10.1.10.3) war zuerst Active.", "Die Priorität 110 ist kleiner als der Standardwert.", "R1 und R2 haben unterschiedliche virtuelle IPs.", "HSRP wählt den Active Router nach der höchsten IP-Adresse."], "c": [0], "e": "preempt fehlt, die Spalte P ist leer. Ohne preempt übernimmt ein Router mit höherer Priorität nicht, solange der bisherige Active Router läuft. R1 kam vermutlich später hoch oder wurde neu gestartet. Die IP-Adresse entscheidet nur bei gleicher Priorität."}, {"d": 3, "q": "Welche Aussagen zu SW2 stimmen? (Wähle zwei)", "x": "SW2# show spanning-tree vlan 10\nVLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority    24586\n             Address     0011.1111.1111\n             Cost        4\n             Port        1 (GigabitEthernet1/0/1)\n  Bridge ID  Priority    32778  (priority 32768 sys-id-ext 10)\n             Address     0022.2222.2222\nInterface           Role Sts Cost      Prio.Nbr Type\n------------------- ---- --- --------- -------- ----------\nGi1/0/1             Root FWD 4         128.1    P2p\nGi1/0/2             Altn BLK 4         128.2    P2p\nGi1/0/10            Desg FWD 19        128.10   P2p Edge", "o": ["Auf der Root Bridge ist für VLAN 10 die Priorität 24576 eingestellt.", "Fällt Gi1/0/1 aus, wird Gi1/0/2 sofort Root Port, ohne Listening und Learning.", "SW2 ist die Root Bridge für VLAN 10.", "An Gi1/0/10 hängt ein weiterer Switch."], "c": [0, 1], "e": "Root-Priorität 24576 und Gi1/0/2 als sofortiger Ersatz. 24586 = 24576 + VLAN 10 (Extended System ID). Ein Alternate Port ist bei RSTP der vorberechnete Ersatz für den Root Port und wechselt ohne Wartezeit. SW2 hat einen Root Port, ist also nicht Root. „Edge“ heißt PortFast, dort hängt ein Endgerät."}, {"d": 3, "q": "Warum ist Gi1/0/2 im Port-Channel suspendiert?", "x": "SW1# show etherchannel summary\nFlags:  D - down        P - bundled in port-channel\n        I - stand-alone s - suspended\n        S - Layer2      U - in use\nGroup  Port-channel  Protocol    Ports\n------+-------------+-----------+---------------------------\n1      Po1(SU)         LACP      Gi1/0/1(P)  Gi1/0/2(s)\n\nSW1# show interfaces status | include Gi1/0/[12]\nGi1/0/1                      connected    trunk      a-full a-1000 10/100/1000BaseTX\nGi1/0/2                      connected    trunk        full    100 10/100/1000BaseTX", "o": ["Gi1/0/2 läuft mit fest eingestellten 100 Mbit/s, die übrigen Member mit 1000.", "LACP bündelt nur einen Port pro Channel.", "Gi1/0/2 steht auf mode passive.", "Der Port-Channel ist down."], "c": [0], "e": "Die Geschwindigkeit weicht ab. Alle Member eines Channels müssen gleich konfiguriert sein, sonst setzt der Switch den abweichenden Port auf suspended (s). Der Channel selbst läuft (SU) mit Gi1/0/1. Mit passive wäre der Port nicht suspendiert, sondern bei fehlendem active-Partner stand-alone (I)."}, {"d": 2, "q": "Warum scheitert der Ping, obwohl die Route existiert?", "x": "PE1# show ip route vrf KUNDE-A\n      10.0.0.0/8 is variably subnetted, 3 subnets, 2 masks\nC        10.1.1.0/24 is directly connected, GigabitEthernet0/1\nL        10.1.1.1/32 is directly connected, GigabitEthernet0/1\nO        10.2.2.0/24 [110/2] via 172.16.0.2, 00:04:12, GigabitEthernet0/2\nPE1# ping 10.2.2.1\n.....\nSuccess rate is 0 percent (0/5)", "o": ["Der Ping läuft ohne vrf-Angabe über die globale Routing-Tabelle, dort fehlt die Route.", "OSPF-Routen lassen sich in einer VRF nicht anpingen.", "Die Route ist inaktiv, weil sie über Gi0/2 läuft.", "Für Pings braucht die VRF ein Route Distinguisher."], "c": [0], "e": "Er nutzt die globale Tabelle. Jeder Befehl ohne VRF-Angabe arbeitet global. Richtig wäre `ping vrf KUNDE-A 10.2.2.1`. Für VRF-Lite braucht es keinen Route Distinguisher, der ist erst bei MPLS-VPN nötig."}, {"d": 2, "q": "Warum ist das Line Protocol von Tunnel0 down?", "x": "R1# show interfaces tunnel0 | include line protocol|source|destination\nTunnel0 is up, line protocol is down\n  Tunnel source 192.0.2.1 (GigabitEthernet0/0), destination 198.51.100.9\nR1# show ip route 198.51.100.9\n% Network not in table", "o": ["R1 hat keine Route zum Tunnelziel 198.51.100.9.", "Auf der Gegenseite fehlt der Tunnel.", "GRE braucht immer einen IPsec-Schutz.", "Tunnel0 hat keine IP-Adresse."], "c": [0], "e": "Es fehlt die Route zum Tunnelziel. Ein GRE-Tunnel geht up/up, sobald Quelle und Ziel konfiguriert sind und das Ziel routbar ist. Ob die Gegenseite antwortet, prüft GRE ohne Keepalives gar nicht, deshalb wäre eine fehlende Gegenseite hier nicht sichtbar."}, {"d": 2, "q": "Was ist die Ursache dieser Meldung?", "x": "%TUN-5-RECURDOWN: Tunnel0 temporarily disabled due to recursive routing\n%LINEPROTO-5-UPDOWN: Line protocol on Interface Tunnel0, changed state to down", "o": ["Die Route zum Tunnelziel zeigt über den Tunnel selbst, etwa weil sie per OSPF über Tunnel0 gelernt wurde.", "Tunnelquelle und Tunnelziel sind identisch.", "Die MTU des Tunnels ist zu klein.", "Die Gegenseite hat den Tunnel abgeschaltet."], "c": [0], "e": "Rekursives Routing. Lernt R1 das Tunnelziel über den Tunnel, müsste jedes GRE-Paket durch sich selbst. IOS erkennt das und schaltet den Tunnel ab. Abhilfe: Das Tunnelziel nur über das Underlay lernen, etwa per statischer Route oder Filter im Routing-Protokoll."}, {"d": 2, "q": "Was folgt aus diesen Zählern auf R1?", "x": "R1# show crypto ipsec sa | include pkts\n    #pkts encaps: 120, #pkts encrypt: 120, #pkts digest: 120\n    #pkts decaps: 0, #pkts decrypt: 0, #pkts verify: 0", "o": ["R1 verschlüsselt und sendet, bekommt aber nichts zurück. Das Problem liegt auf dem Weg oder bei der Gegenseite.", "Phase 1 ist nicht aufgebaut.", "Die Transform-Sets passen nicht zusammen.", "R1 verschlüsselt nicht, weil die Crypto-ACL nicht trifft."], "c": [0], "e": "Senden klappt, Empfangen nicht. Die IPsec-SA existiert, sonst gäbe es keine Zähler. Phase 1 und Transform-Set sind also in Ordnung. Typische Ursachen: ESP wird unterwegs gefiltert, oder die Gegenseite schickt die Antwort nicht in den Tunnel, etwa wegen einer falschen Crypto-ACL oder Route."}, {"d": 5, "q": "Host 10.1.1.50 soll gar nichts dürfen, öffnet aber HTTPS-Seiten. Warum?", "x": "R1# show access-lists 110\nExtended IP access list 110\n    10 permit tcp 10.1.1.0 0.0.0.255 any eq 443 (1520 matches)\n    20 deny ip host 10.1.1.50 any (0 matches)\n    30 permit ip 10.1.1.0 0.0.0.255 any (845 matches)", "o": ["Zeile 10 erlaubt HTTPS für das ganze Netz, bevor Zeile 20 geprüft wird.", "Die Wildcard in Zeile 20 ist falsch.", "Die ACL hängt in der falschen Richtung.", "Zeile 30 hebt Zeile 20 auf."], "c": [0], "e": "Zeile 10 trifft zuerst. ACLs arbeiten von oben nach unten und hören beim ersten Treffer auf. HTTPS von .50 passt auf Zeile 10 und wird erlaubt. Der Zähler 0 an Zeile 20 zeigt, dass sie nie erreicht wird. Fix: `5 deny ip host 10.1.1.50 any` vor Zeile 10 einfügen."}, {"d": 5, "q": "Der Admin „netops“ hat nur ein lokales Konto auf R1. Seine Anmeldung scheitert. Warum?", "x": "R1# show running-config | include aaa authentication\naaa authentication login default group tacacs+ local\nR1# show tacacs\nTacacs+ Server - public  :\n               Server name: ISE1\n            Server address: 10.9.9.10\n               Server port: 49\n              Socket opens:         12\n             Socket closes:         12\n           Failed Connect Attempts:  0\n        Total Packets Sent:         24\n        Total Packets Recv:         24", "o": ["Der TACACS+-Server antwortet und lehnt ab. local greift nur, wenn der Server nicht erreichbar ist.", "Die Method-List prüft local vor TACACS+.", "Der TACACS+-Port 49 ist blockiert.", "local funktioniert nur auf der Konsole."], "c": [0], "e": "Der Server lehnt ab, deshalb kommt local nicht zum Zug. Eine Method-List springt nur bei einem ERROR weiter, also wenn der Server nicht antwortet. Ein REJECT ist eine gültige Antwort. Die Zähler zeigen: Jede Anfrage bekam eine Antwort, der Server ist erreichbar."}, {"d": 5, "q": "Was bewirkt diese CoPP-Klasse?", "x": "R1# show policy-map control-plane input class COPP-ICMP\n  Class-map: COPP-ICMP (match-all)\n    12850 packets, 1028000 bytes\n    Match: access-group name ICMP-TO-RP\n    police:\n        cir 8000 bps, bc 1500 bytes\n      conformed 412 packets, 32960 bytes; actions:\n        transmit\n      exceeded 12438 packets, 995040 bytes; actions:\n        drop", "o": ["ICMP an den Router selbst ist auf 8 kbit/s begrenzt, der Rest wird verworfen. Durchlaufender Verkehr ist nicht betroffen.", "Jeder ICMP-Verkehr durch den Router wird auf 8 kbit/s begrenzt.", "Der Router verwirft jeden ICMP-Verkehr.", "Die Policy greift nicht, weil sie auf input steht."], "c": [0], "e": "Nur ICMP an die Control Plane wird gedrosselt. CoPP schützt die CPU des Routers und sieht nur Pakete, die an den Router selbst gehen. Pings durch den Router hindurch laufen in Hardware und an der Policy vorbei. Die hohe exceeded-Zahl deutet auf einen Ping-Flood gegen den Router."}, {"d": 4, "q": "Warum synchronisiert R2 nicht?", "x": "R2# show ntp associations\n  address         ref clock       st   when   poll reach  delay  offset   disp\n ~10.0.0.1        .INIT.          16      -     64     0  0.000   0.000 15937.\n * sys.peer, # selected, + candidate, - outlyer, x falseticker, ~ configured", "o": ["R2 hat vom Server noch keine einzige Antwort erhalten (reach 0).", "Der Server hat Stratum 16 und ist damit die beste Zeitquelle.", "R2 ist bereits synchronisiert, das Sternchen fehlt nur in der Ausgabe.", "Das Poll-Intervall von 64 s ist zu lang."], "c": [0], "e": "Keine Antwort vom Server. reach ist ein Schieberegister der letzten acht Abfragen, 0 heißt: keine einzige beantwortet. Stratum 16 und .INIT. sind die Platzhalter für „noch nichts gehört“. Zu prüfen sind Erreichbarkeit, ACLs für UDP 123 und die Authentifizierung."}, {"d": 4, "q": "Welche Meldung erreicht den Syslog-Server?", "x": "R1# show logging | include Trap\n    Trap logging: level warnings, 42 message lines logged", "o": ["%LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down", "%LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down", "%SYS-5-CONFIG_I: Configured from console by admin", "%SYS-6-LOGGINGHOST_STARTSTOP: Logging to host 10.9.9.20 started"], "c": [0], "e": "Nur die Meldung mit Level 3. `warnings` ist Level 4, gesendet wird alles von 0 bis 4. Die Zahl hinter dem Facility-Namen ist der Level: LINK-3 geht raus, LINEPROTO-5, SYS-5 und SYS-6 bleiben lokal."}, {"d": 4, "q": "Was ist auf R1 passiert?", "x": "R1# show track 1\nTrack 1\n  IP SLA 1 reachability\n  Reachability is Down\n    3 changes, last change 00:01:12\n  Latest operation return code: Timeout\n  Tracked by:\n    Static IP Routing 0\nR1# show ip route static | include 0.0.0.0\nS*    0.0.0.0/0 [250/0] via 198.51.100.1", "o": ["Das IP-SLA-Ziel antwortet nicht mehr, die überwachte Default ist raus, und die Floating Route mit AD 250 ist aktiv.", "Die Default-Route hat AD 250, weil der Track sie hochgesetzt hat.", "IP SLA hat den primären Link abgeschaltet.", "Track 1 ist Down, weil die Default-Route fehlt."], "c": [0], "e": "Failover auf die Floating Route. Die primäre Default hängt an Track 1. Antwortet das SLA-Ziel nicht mehr, nimmt IOS sie aus der Tabelle, und die Reserve mit AD 250 rückt nach. Der Link selbst bleibt dabei up, IP SLA schaltet nichts ab."}, {"d": 4, "q": "Welcher Host verursacht den meisten Verkehr, und womit?", "x": "R1# show flow monitor FM-WAN cache format table\nIPV4 SRC ADDR    IPV4 DST ADDR    TRNS SRC PORT  TRNS DST PORT  IP PROT  bytes long\n==============   ==============   =============  =============  =======  ==========\n10.1.1.20        203.0.113.10             51522            443        6    48211934\n10.1.1.35        203.0.113.10             51877            443        6        1250\n10.1.1.20        198.51.100.7                 0              0        1        4200", "o": ["10.1.1.20 mit HTTPS (TCP 443) zu 203.0.113.10", "10.1.1.35 mit HTTPS zu 203.0.113.10", "10.1.1.20 mit ICMP zu 198.51.100.7", "203.0.113.10 mit TCP 51522"], "c": [0], "e": "10.1.1.20 per HTTPS. Protokoll 6 ist TCP, Zielport 443 ist HTTPS, und der Flow hat rund 48 MB. Protokoll 1 ist ICMP, Port 0 ist dort normal, weil ICMP keine Ports hat."}, {"d": 4, "q": "Der Analyzer an Gi1/0/24 bekommt keine Adresse per DHCP mehr. Warum?", "x": "SW1# show monitor session 1\nSession 1\n---------\nType                     : Local Session\nSource Ports             :\n    Both                 : Gi1/0/1\nDestination Ports        : Gi1/0/24\n    Encapsulation        : Native\n          Ingress        : Disabled", "o": ["Ein SPAN-Zielport nimmt keinen eigenen Verkehr an, er gibt nur Kopien aus.", "SPAN lässt nur Broadcasts durch.", "Gi1/0/1 ist als Quelle falsch, es müsste ein VLAN sein.", "Encapsulation Native blockiert DHCP."], "c": [0], "e": "Ein Zielport ist kein normaler Switchport mehr. Er sendet nur die gespiegelten Frames, eingehender Verkehr wird verworfen (Ingress: Disabled). Der Analyzer braucht für seine eigene Verbindung einen zweiten Port oder `ingress` in der Session."}, {"d": 6, "q": "Welcher Python-Ausdruck liefert „10.0.0.1“ aus dieser RESTCONF-Antwort (als data geladen)?", "x": "{\n  \"ietf-interfaces:interface\": {\n    \"name\": \"GigabitEthernet1\",\n    \"enabled\": true,\n    \"ietf-ip:ipv4\": {\n      \"address\": [\n        {\"ip\": \"10.0.0.1\", \"netmask\": \"255.255.255.0\"}\n      ]\n    }\n  }\n}", "o": ["data[\"ietf-interfaces:interface\"][\"ietf-ip:ipv4\"][\"address\"][0][\"ip\"]", "data[\"ietf-interfaces:interface\"][\"ietf-ip:ipv4\"][\"address\"][\"ip\"]", "data[\"interface\"][\"ipv4\"][\"address\"][0][\"ip\"]", "data[\"ietf-interfaces:interface\"][\"ietf-ip:ipv4\"][\"address\"][1][\"ip\"]"], "c": [0], "e": "Der erste. RESTCONF-JSON trägt die Modulpräfixe in den Schlüsseln, ohne sie gibt es einen KeyError. address ist eine Liste, deshalb braucht es den Index [0] vor [\"ip\"]. Index 1 gibt es nicht, die Liste hat nur einen Eintrag."}, {"d": 6, "q": "Bei welcher Operation antwortet ein NETCONF-Server so?", "x": "<rpc-reply message-id=\"101\" xmlns=\"urn:ietf:params:xml:ns:netconf:base:1.0\">\n  <rpc-error>\n    <error-type>application</error-type>\n    <error-tag>data-missing</error-tag>\n    <error-severity>error</error-severity>\n  </rpc-error>\n</rpc-reply>", "o": ["edit-config mit operation=\"delete\" auf einen Knoten, den es nicht gibt", "edit-config mit operation=\"remove\" auf einen Knoten, den es nicht gibt", "get-config auf das running-Datastore", "edit-config mit operation=\"merge\" auf einen neuen Knoten"], "c": [0], "e": "Bei delete auf etwas, das fehlt. delete verlangt, dass die Daten existieren, sonst kommt data-missing. remove löscht nur, wenn etwas da ist, und schweigt sonst. merge legt fehlende Knoten einfach an."}, {"d": 6, "q": "Was macht dieser Code?", "x": "import requests\nbase = \"https://catc.example.local\"\nr = requests.post(f\"{base}/dna/system/api/v1/auth/token\", auth=(\"api\", PASSWORT))\ntoken = r.json()[\"Token\"]\nd = requests.get(f\"{base}/dna/intent/api/v1/network-device\",\n                 headers={\"X-Auth-Token\": token})\nprint(len(d.json()[\"response\"]))", "o": ["Er holt mit Benutzer und Passwort einen Token und gibt damit die Zahl der Geräte im Inventar aus.", "Er legt mit dem Token ein neues Gerät an.", "Er gibt den Token aus.", "Er scheitert, weil der GET ebenfalls Basic Auth braucht."], "c": [0], "e": "Token holen, dann Inventar zählen. Der POST mit Basic Auth liefert den Token, jeder weitere Aufruf trägt ihn im Header X-Auth-Token. Die Intent API liefert die Geräte als Liste unter \"response\", len() zählt sie."}, {"d": 6, "q": "Was bewirkt dieses Applet?", "x": "event manager applet WATCH-GI1\n event syslog pattern \"Interface GigabitEthernet0/1, changed state to down\"\n action 1.0 cli command \"enable\"\n action 2.0 cli command \"configure terminal\"\n action 3.0 cli command \"interface GigabitEthernet0/1\"\n action 4.0 cli command \"no shutdown\"\n action 5.0 syslog msg \"Gi0/1 automatisch wieder aktiviert\" ", "o": ["Meldet das Syslog Gi0/1 als down, versucht es das Interface mit no shutdown wieder zu aktivieren und schreibt eine eigene Meldung.", "Es schaltet Gi0/1 jede Minute ab und wieder ein.", "Es fährt Gi0/1 herunter, sobald es down geht.", "Es schickt bei einem Ausfall eine E-Mail."], "c": [0], "e": "Reaktion auf eine Syslog-Meldung. Der Auslöser ist das Muster in der Meldung, die Aktionen tippen die Befehle wie ein Mensch. Ein `shutdown` von Hand löst nichts aus, denn dann lautet die Meldung „changed state to administratively down“, und das Muster passt nicht."}, {"d": 6, "q": "Was bedeutet diese Ansible-Ausgabe?", "x": "TASK [NTP-Server setzen] *********************************\nok: [sw1]\nchanged: [sw2]\n\nPLAY RECAP ***********************************************\nsw1 : ok=2  changed=0  unreachable=0  failed=0\nsw2 : ok=2  changed=1  unreachable=0  failed=0", "o": ["sw1 hatte den NTP-Server schon und blieb unverändert, sw2 wurde angepasst.", "Auf sw1 ist der Task fehlgeschlagen.", "sw2 war nicht erreichbar.", "Beide Switches wurden geändert."], "c": [0], "e": "sw1 war schon richtig, sw2 wurde geändert. ok heißt: Sollzustand bereits erreicht, nichts zu tun. Das ist Idempotenz, ein zweiter Lauf würde auch bei sw2 nur noch ok melden."}, {"d": 3, "q": "Was zeigt der (S,G)-Eintrag mit Flag T?", "x": "R2# show ip mroute 239.1.1.1\n(*, 239.1.1.1), 00:05:12/00:02:58, RP 10.255.0.1, flags: S\n  Incoming interface: GigabitEthernet0/0, RPF nbr 10.0.12.1\n  Outgoing interface list:\n    GigabitEthernet0/1, Forward/Sparse, 00:05:12/00:02:58\n(10.1.1.10, 239.1.1.1), 00:01:03/00:02:56, flags: T\n  Incoming interface: GigabitEthernet0/2, RPF nbr 10.0.23.3\n  Outgoing interface list:\n    GigabitEthernet0/1, Forward/Sparse, 00:01:03/00:02:56", "o": ["R2 ist auf den Shortest Path Tree umgeschaltet und empfängt die Quelle 10.1.1.10 direkt über Gi0/2 statt über den RP.", "Der Verkehr von 10.1.1.10 kommt weiterhin über den RP.", "10.1.1.10 ist der Rendezvous Point.", "Gi0/2 ist ein Outgoing Interface."], "c": [0], "e": "SPT-Umschaltung. T steht für SPT-bit: Der (S,G)-Pfad ist aktiv. Der (*,G)-Eintrag zeigt den Shared Tree über den RP (Gi0/0), die Quelle kommt jetzt aber auf dem kürzesten Weg über Gi0/2. Das ist das Standardverhalten von PIM-SM, sobald das erste Paket da ist."}, {"d": 3, "q": "Welche Aussagen stimmen? (Wähle zwei)", "x": "R1# show ip nat translations\nPro  Inside global      Inside local       Outside local      Outside global\ntcp  198.51.100.2:1025  10.1.1.10:51000    203.0.113.5:443    203.0.113.5:443\ntcp  198.51.100.2:1026  10.1.1.11:51000    203.0.113.5:443    203.0.113.5:443\n---  198.51.100.10      10.1.1.100         ---                ---", "o": ["10.1.1.10 und 10.1.1.11 teilen sich per PAT die Adresse 198.51.100.2 und werden über den Port unterschieden.", "10.1.1.100 ist statisch auf 198.51.100.10 übersetzt.", "Die Ziele werden ebenfalls übersetzt (Outside NAT).", "Die Einträge mit Port 1025 und 1026 sind statisch."], "c": [0, 1], "e": "PAT für die Clients, statisches NAT für .100. Die beiden Clients nutzen denselben Quellport 51000, PAT macht sie mit 1025 und 1026 eindeutig. Die Zeile ohne Protokoll und Ports ist eine statische 1:1-Übersetzung. Outside local und global sind gleich, die Ziele bleiben also unverändert."}, {"d": 2, "q": "Wohin schickt xTR1 ein Paket an 10.2.2.5?", "x": "xTR1# show ip lisp map-cache\nLISP IPv4 Mapping Cache for EID-table default (IID 0), 2 entries\n0.0.0.0/0, uptime: 01:10:22, expires: never, via static-send-map-request\n  Negative cache entry, action: send-map-request\n10.2.2.0/24, uptime: 00:00:41, expires: 23:59:18, via map-reply, complete\n  Locator       Uptime    State      Pri/Wgt\n  192.0.2.22    00:00:41  up           1/100", "o": ["LISP-gekapselt an den RLOC 192.0.2.22", "Unverändert an den Map-Resolver", "Per Map-Request an den Map-Server, das Paket wird verworfen", "Unverändert über die Default-Route"], "c": [0], "e": "Gekapselt an 192.0.2.22. Für 10.2.2.0/24 gibt es einen vollständigen Cache-Eintrag aus einem Map-Reply, der Locator ist up. Nur für Ziele ohne Eintrag greift der negative Default und löst einen Map-Request aus."}, {"d": 1, "q": "Was bedeutet dieser Zustand bei einem Switch mit zwei Supervisors?", "x": "SW-CORE# show redundancy states\n       my state = 13 -ACTIVE\n     peer state = 8  -STANDBY HOT\n           Mode = Duplex\nRedundancy Mode (Operational) = sso", "o": ["Der Standby-Supervisor hat Konfiguration und Zustände synchronisiert und übernimmt ohne Neustart der Linecards.", "Der Standby-Supervisor muss bei einem Ausfall erst booten.", "Beide Supervisors leiten gleichzeitig Pakete weiter.", "SSO sorgt allein dafür, dass die Routing-Nachbarn nichts merken."], "c": [0], "e": "Fertig synchronisiert, Übernahme ohne Linecard-Neustart. STANDBY HOT mit SSO heißt: Konfiguration und Layer-2-Zustände sind gespiegelt. Damit auch die Routing-Nachbarn nicht neu aufbauen, braucht es zusätzlich NSF bzw. Graceful Restart."}, {"d": 3, "q": "Warum nutzt R1 für 10.9.9.0/24 die OSPF-Route, obwohl EIGRP sie auch kennt?", "x": "R1# show ip route 10.9.9.0\nRouting entry for 10.9.9.0/24\n  Known via \"ospf 1\", distance 110, metric 20, type extern 2, forward metric 2\nR1# show ip eigrp topology 10.9.9.0/24 | include External|distance\n  Composite metric is (3072/2816), route is External", "o": ["Die OSPF-Route hat AD 110, eine externe EIGRP-Route AD 170.", "OSPF wird immer EIGRP vorgezogen.", "Die EIGRP-Metrik 3072 ist größer als 20.", "Externe Routen werden nie installiert."], "c": [0], "e": "Wegen der Administrative Distance. Externe EIGRP-Routen haben 170, interne 90. OSPF hat für alle Routen 110 und gewinnt deshalb hier. Metriken verschiedener Protokolle werden nie verglichen."}, {"d": 3, "q": "R1 und R2 sind FULL, trotzdem fehlen die Routen über diesen Link. Warum?", "x": "R1# show ip ospf interface gi0/0 | include Network Type|Hello\n  Process ID 1, Router ID 1.1.1.1, Network Type POINT_TO_POINT, Cost: 1\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\nR2# show ip ospf interface gi0/0 | include Network Type|Hello\n  Process ID 1, Router ID 2.2.2.2, Network Type BROADCAST, Cost: 1\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5", "o": ["Die Netzwerktypen passen nicht. Die Nachbarschaft kommt hoch, aber die LSAs beschreiben den Link unterschiedlich, und SPF verwirft ihn.", "Die Hello-Timer passen nicht.", "Die Kosten sind zu niedrig.", "R1 und R2 haben unterschiedliche Router-IDs."], "c": [0], "e": "Point-to-point gegen Broadcast. Weil die Timer gleich sind, wird die Nachbarschaft FULL. R2 beschreibt den Link aber als Transit-Netz mit DR, R1 als Punkt-zu-Punkt-Verbindung. Diese Beschreibungen passen im SPF nicht zusammen, die Routen fehlen. Fix: auf beiden Seiten denselben Typ."}, {"t": "order", "d": 3, "q": "Bring die Kriterien der BGP-Pfadwahl in die Reihenfolge, in der IOS sie prüft.", "o": ["Höchstes Weight", "Höchste Local Preference", "Lokal erzeugter Pfad", "Kürzester AS-Pfad", "Niedrigster Origin-Code (i < e < ?)", "Niedrigster MED", "eBGP vor iBGP", "Niedrigste IGP-Metrik zum Next Hop"], "e": "Weight, LocPrf, lokal erzeugt, AS-Pfad, Origin, MED, eBGP vor iBGP, IGP-Metrik. Danach folgen noch ältester eBGP-Pfad und niedrigste Router-ID. Merkhilfe: „We Love Oranges AS Oranges Mean Pure Refreshment“."}, {"t": "order", "d": 3, "q": "Bring die Zustände einer OSPF-Nachbarschaft in die richtige Reihenfolge.", "o": ["Down", "Init", "2-Way", "ExStart", "Exchange", "Loading", "Full"], "e": "Down, Init, 2-Way, ExStart, Exchange, Loading, Full. In Init hat ein Router den Hello des anderen gesehen, in 2-Way sieht er sich selbst darin. Ab ExStart beginnt der Datenbankaustausch, Loading holt fehlende LSAs nach."}, {"t": "order", "d": 5, "q": "Bring den Ablauf einer 802.1X-Anmeldung am Switch in die richtige Reihenfolge.", "o": ["Der Client sendet EAPOL-Start.", "Der Switch fragt per EAP-Request/Identity nach der Identität.", "Der Client antwortet, der Switch packt die Antwort in einen RADIUS Access-Request an ISE.", "Client und ISE handeln die EAP-Methode aus, etwa EAP-TLS.", "ISE sendet Access-Accept mit VLAN, dACL oder SGT.", "Der Switch schaltet den Port für den Client frei."], "e": "Start, Identität, RADIUS, EAP-Methode, Accept, Freischaltung. Der Switch ist nur Vermittler (Authenticator): Er reicht EAP zwischen Client (Supplicant) und ISE (Authentication Server) durch und setzt am Ende das Ergebnis um."}, {"t": "order", "d": 2, "q": "Bring den Ablauf einer LISP-Auflösung in die richtige Reihenfolge.", "o": ["Der ITR erhält ein Paket an eine EID, für die er keinen Cache-Eintrag hat.", "Der ITR schickt einen Map-Request an den Map-Resolver.", "Der Map-Resolver reicht die Anfrage an den Map-Server weiter.", "Der Map-Server leitet sie an den ETR weiter, der die EID registriert hat.", "Der ETR antwortet dem ITR direkt mit einem Map-Reply.", "Der ITR speichert die Zuordnung und kapselt das Paket an den RLOC."], "e": "Anfrage über Map-Resolver und Map-Server, Antwort direkt vom ETR. Der Map-Server kennt die Registrierungen, antwortet aber standardmäßig nicht selbst, sondern leitet weiter. Danach liegt die Zuordnung EID → RLOC im Map-Cache des ITR."}, {"t": "order", "d": 2, "q": "Bring den Aufbau eines IPsec-Tunnels mit IKEv1 in die richtige Reihenfolge.", "o": ["Verkehr trifft die Crypto-ACL und löst die Verhandlung aus.", "Phase 1: Die Peers einigen sich auf Verschlüsselung, Hash, Authentisierung und DH-Gruppe.", "Phase 1: Diffie-Hellman-Austausch erzeugt das gemeinsame Geheimnis.", "Phase 1: Die Peers authentisieren sich per Pre-Shared Key oder Zertifikat.", "Phase 2 (Quick Mode): Die IPsec-SAs mit Transform-Set werden ausgehandelt.", "Die Daten fließen verschlüsselt per ESP."], "e": "Auslöser, Phase 1 (Policy, DH, Authentisierung), Phase 2, Daten. Phase 1 baut den geschützten Kanal (ISAKMP-SA, Zustand QM_IDLE), Phase 2 handelt darin die eigentlichen IPsec-SAs für die Nutzdaten aus."}, {"t": "order", "d": 6, "q": "Bring den Terraform-Arbeitsablauf in die richtige Reihenfolge.", "o": ["Konfiguration in .tf-Dateien schreiben", "terraform init", "terraform plan", "terraform apply", "terraform destroy"], "e": "Schreiben, init, plan, apply, später destroy. init lädt die Provider, plan vergleicht Code und State und zeigt die Änderungen, apply führt sie aus. destroy baut alles wieder ab."}, {"t": "order", "d": 6, "q": "Bring die Inbetriebnahme eines neuen Switches per Catalyst Center PnP in die richtige Reihenfolge.", "o": ["Der Switch startet ohne Konfiguration.", "Er holt sich per DHCP eine Adresse und die Adresse des PnP-Servers (Option 43 oder DNS).", "Er meldet sich bei Catalyst Center.", "Ein Administrator weist das Gerät einem Standort zu (Claim).", "Catalyst Center spielt Image und Konfigurationsvorlage ein.", "Das Gerät erscheint als verwaltet im Inventar."], "e": "Booten, DHCP, Kontakt, Claim, Provisionierung, Inventar. Der Switch braucht nur den Weg zum Controller, alles Weitere kommt zentral. Das ist Zero-Touch-Provisioning."}, {"t": "order", "d": 3, "q": "Bring die Schritte, mit denen Spanning Tree eine schleifenfreie Topologie baut, in die richtige Reihenfolge.", "o": ["Root Bridge wählen (kleinste Bridge-ID)", "Auf jedem anderen Switch den Root Port bestimmen", "Auf jedem Segment den Designated Port bestimmen", "Alle übrigen Ports blockieren"], "e": "Root Bridge, Root Ports, Designated Ports, Rest blockieren. Jeder Schritt baut auf dem vorigen auf: Ohne Root Bridge gibt es keine Root-Pfadkosten, ohne Root Ports keine Entscheidung je Segment."}, {"t": "match", "d": 1, "q": "Ordne die Cisco-SD-WAN-Komponenten ihrer Ebene zu.", "l": ["Validator (vBond)", "Manager (vManage)", "Controller (vSmart)", "WAN Edge"], "o": ["Orchestration Plane", "Management Plane", "Control Plane", "Data Plane"], "c": [0, 1, 2, 3], "e": "Validator = Orchestration, Manager = Management, Controller = Control, WAN Edge = Data. Der Validator macht den Erstkontakt und die Authentisierung, der Manager die Konfiguration, der Controller verteilt per OMP Routen und Policies, die Edges leiten weiter."}, {"t": "match", "d": 1, "q": "Ordne die SD-Access-Rollen ihrer Aufgabe zu.", "l": ["Control Plane Node", "Border Node", "Edge Node", "ISE", "Catalyst Center"], "o": ["LISP Map-Server und Map-Resolver", "Übergang zu Netzen außerhalb der Fabric", "Anschluss der Endgeräte und Anycast-Gateway", "Authentisierung und Zuweisung der SGT", "Design, Automatisierung und Assurance"], "c": [0, 1, 2, 3, 4], "e": "Control Plane Node = LISP-Datenbank, Border = Ausgang, Edge = Endgeräte und Gateway, ISE = Identität und SGT, Catalyst Center = Steuerung. Daten laufen per VXLAN, die Policy per SGT."}, {"t": "match", "d": 3, "q": "Ordne die OSPF-LSA-Typen ihrer Beschreibung zu.", "l": ["Typ 1", "Typ 2", "Typ 3", "Typ 4", "Typ 5", "Typ 7"], "o": ["Router-LSA: Links eines Routers in seiner Area", "Network-LSA: Multiaccess-Segment, erzeugt vom DR", "Summary-LSA: Netze aus anderen Areas, erzeugt vom ABR", "ASBR-Summary: Weg zum ASBR in einer anderen Area", "External-LSA: redistributierte Routen", "NSSA-External: externe Routen innerhalb einer NSSA"], "c": [0, 1, 2, 3, 4, 5], "e": "1 Router, 2 Network, 3 Summary, 4 ASBR-Summary, 5 External, 7 NSSA-External. Typ 4 gibt es nur, weil andere Areas wissen müssen, wie sie den ASBR erreichen, dessen Typ-5-LSAs sie sehen."}, {"t": "match", "d": 3, "q": "Ordne jede Aussage dem passenden FHRP zu.", "l": ["Offener Standard nach RFC 5798", "Lastverteilung über einen AVG und mehrere AVFs", "Cisco-Protokoll mit Active- und Standby-Router", "Die virtuelle IP darf die echte Adresse eines Routers sein", "preempt ist standardmäßig eingeschaltet"], "o": ["HSRP", "VRRP", "GLBP"], "c": [1, 2, 0, 1, 1], "e": "VRRP ist der Standard, darf die echte Router-IP nutzen und hat preempt standardmäßig an. GLBP verteilt Last, indem der AVG verschiedenen Clients verschiedene virtuelle MACs gibt. HSRP ist Cisco-proprietär mit Active/Standby und ohne preempt ab Werk."}, {"t": "match", "d": 3, "q": "Ordne die QoS-Werkzeuge ihrer Wirkung zu.", "l": ["Klassifizierung und Markierung", "Policing", "Shaping", "LLQ (priority)", "WRED"], "o": ["Erkennt Verkehr und setzt DSCP oder CoS", "Verwirft oder markiert Verkehr über einer Rate sofort", "Puffert Verkehr über einer Rate und sendet ihn später", "Strikte Vorrang-Warteschlange mit eingebautem Limit", "Verwirft früh und zufällig, bevor die Warteschlange voll ist"], "c": [0, 1, 2, 3, 4], "e": "Markieren, verwerfen, puffern, vorziehen, früh verwerfen. Policing kappt hart und verursacht keine Verzögerung, Shaping glättet und erzeugt Verzögerung. LLQ ist für Sprache, WRED verhindert, dass alle TCP-Flows gleichzeitig bremsen."}, {"t": "match", "d": 2, "q": "Ordne die Produkte dem Hypervisor-Typ zu.", "l": ["VMware ESXi", "Microsoft Hyper-V", "KVM", "Oracle VirtualBox", "VMware Workstation"], "o": ["Typ 1 (läuft direkt auf der Hardware)", "Typ 2 (läuft auf einem Betriebssystem)"], "c": [0, 0, 0, 1, 1], "e": "ESXi, Hyper-V und KVM sind Typ 1, VirtualBox und Workstation Typ 2. KVM ist Teil des Linux-Kernels und wird deshalb meist Typ 1 zugeordnet."}, {"t": "match", "d": 6, "q": "Ordne die HTTP-Statuscodes ihrer Bedeutung zu.", "l": ["200", "201", "204", "401", "403", "404"], "o": ["OK, Antwort mit Inhalt", "Ressource angelegt", "Erfolgreich, ohne Inhalt", "Nicht authentisiert", "Authentisiert, aber nicht berechtigt", "Ressource nicht gefunden"], "c": [0, 1, 2, 3, 4, 5], "e": "2xx heißt Erfolg, 4xx Fehler des Clients. 401 fragt: Wer bist du? 403 sagt: Ich weiß, wer du bist, aber das darfst du nicht."}, {"t": "match", "d": 6, "q": "Ordne die YANG-Knotentypen ihrer Beschreibung zu.", "l": ["container", "list", "leaf", "leaf-list"], "o": ["Gruppiert Knoten, hat selbst keinen Wert", "Mehrere Einträge, unterschieden durch einen Schlüssel", "Genau ein Wert mit Datentyp", "Mehrere Werte desselben Typs"], "c": [0, 1, 2, 3], "e": "container gruppiert, list hat Einträge mit Schlüssel, leaf hält einen Wert, leaf-list mehrere. In JSON wird ein container zum Objekt, eine list oder leaf-list zum Array."}, {"t": "match", "d": 6, "q": "Ordne die Protokolle ihrem Transport und Datenformat zu.", "l": ["NETCONF", "RESTCONF", "gNMI"], "o": ["SSH (Port 830), XML", "HTTPS, JSON oder XML", "gRPC über HTTP/2, Protobuf"], "c": [0, 1, 2], "e": "NETCONF nutzt SSH und XML, RESTCONF HTTPS mit JSON oder XML, gNMI gRPC mit Protobuf. Alle drei arbeiten mit YANG-Modellen."}, {"t": "match", "d": 4, "q": "Ordne die Syslog-Level ihrem Namen zu.", "l": ["0", "2", "3", "4", "5", "6"], "o": ["Emergencies", "Critical", "Errors", "Warnings", "Notifications", "Informational"], "c": [0, 1, 2, 3, 4, 5], "e": "0 Emergencies, 1 Alerts, 2 Critical, 3 Errors, 4 Warnings, 5 Notifications, 6 Informational, 7 Debugging. Merkhilfe: „Every Awesome Cisco Engineer Will Need Ice cream Daily“."}, {"t": "match", "d": 5, "q": "Ordne jede Eigenschaft TACACS+ oder RADIUS zu.", "l": ["Nutzt TCP Port 49", "Nutzt UDP 1812 und 1813", "Verschlüsselt das ganze Paket", "Trennt Authentisierung, Autorisierung und Accounting", "Standard für 802.1X-Netzzugang"], "o": ["TACACS+", "RADIUS"], "c": [0, 1, 0, 0, 1], "e": "TACACS+: TCP 49, ganzes Paket verschlüsselt, AAA getrennt, ideal für Geräteadministration mit Befehlsautorisierung. RADIUS: UDP, verschlüsselt nur das Passwort, Standard für Netzzugang per 802.1X."}, {"t": "match", "d": 6, "q": "Ordne die Werkzeuge ihrem Arbeitsprinzip zu.", "l": ["Ansible", "Puppet", "Chef", "Terraform"], "o": ["Agentenlos, Push über SSH oder API", "Agent holt den Sollzustand vom Server (Pull)", "Deklarativ mit State-Datei, vor allem für Infrastruktur"], "c": [0, 1, 1, 2], "e": "Ansible schiebt agentenlos, Puppet und Chef ziehen mit Agent, Terraform beschreibt den Zielzustand und merkt sich den Ist-Zustand in einer State-Datei."}, {"t": "match", "d": 3, "q": "Ordne die Multicast-Begriffe ihrer Aufgabe zu.", "l": ["IGMP", "PIM", "Rendezvous Point", "RPF-Prüfung"], "o": ["Hosts melden dem Router, welche Gruppen sie empfangen wollen", "Router bauen untereinander die Verteilbäume", "Wurzel des Shared Tree bei PIM Sparse Mode", "Akzeptiert Multicast nur auf dem Interface Richtung Quelle"], "c": [0, 1, 2, 3], "e": "IGMP zwischen Host und Router, PIM zwischen Routern, der RP als Treffpunkt von Quelle und Empfängern, RPF gegen Schleifen."}]};
const KEY='encor_sim';
let POOL=BUILTIN,Q,DOM,WEIGHT;
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich=s=>esc(s).replace(/&lt;(\/?)(code|b)&gt;/g,'<$1$2>');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const typ=q=>q.t||'choice';
const qid=q=>{let h=5381;const s=(q.q||'')+'|'+(q.x||'');for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const poolKey=()=>KEY+(POOL===BUILTIN?'':'_custom');
function usePool(p){POOL=p;Q=p.questions;DOM=p.domains||{1:'Alle Fragen'};WEIGHT=p.weights||null;}
usePool(BUILTIN);

// ---------- Startseite ----------
function home(){clearInterval(timer);S=null;
  const hist=lsGet(poolKey()+'_hist')||[],wrong=(lsGet(poolKey()+'_wrong')||[]).filter(id=>Q.some(q=>qid(q)===id));
  const custom=POOL!==BUILTIN,examN=Math.min(POOL.examN||60,Q.length),examSec=custom?Math.round(examN*(BUILTIN.examSec/BUILTIN.examN)):POOL.examSec;
  const nDD=Q.filter(q=>typ(q)!=='choice').length,nX=Q.filter(q=>q.x).length;
  let h=`<h1>${esc(POOL.title)}</h1><p class="sub">${Q.length} Fragen${nX?`, davon ${nX} mit Exhibit`:''}${nDD?` und ${nDD} zum Ordnen oder Zuordnen`:''}. Läuft offline im Browser.</p>`;
  if(custom)h+=`<div class="card"><b>Eigener Fragenpool geladen.</b> <span class="sub">Ergebnisse und Wiederholungsliste werden getrennt vom eingebauten Pool gespeichert.</span><div class="nav"><button class="sec" onclick="usePool(BUILTIN);home()">Zurück zum eingebauten Pool</button></div></div>`;
  h+=`<div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (${examN} Fragen, ${Math.round(examSec/60)} Minuten)<small>${WEIGHT?'Zufallsauswahl nach Domänengewicht':'Zufallsauswahl'}, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, ${Math.round((custom?Q.length*BUILTIN.allSec/BUILTIN.questions.length:POOL.allSec)/60)} Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  if(wrong.length)h+=`<button onclick="start('wrong')">Falsch beantwortete wiederholen (${wrong.length})<small>Jede Frage verschwindet von der Liste, sobald du sie richtig beantwortest</small></button>`;
  if(nDD)h+=`<button class="sec" onclick="start('dd')">Ordnen und Zuordnen (${nDD})<small>Nur die Drag-and-drop-Fragen</small></button>`;
  if(nX)h+=`<button class="sec" onclick="start('ex')">Exhibits (${nX})<small>Nur Fragen mit Ausgaben, Konfigurationen oder Code</small></button>`;
  for(const d of Object.keys(DOM)){const n=Q.filter(q=>String(q.d||1)===d).length;if(n)h+=`<button class="sec" onclick="start('practice','${d}')">${Object.keys(DOM).length>1?`Domäne ${d}: `:''}${esc(DOM[d])}<small>${n} Fragen${WEIGHT&&WEIGHT[d]?` · Gewicht ${WEIGHT[d]} %`:''}</small></button>`}
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<div class="card"><h2>Eigene Fragen</h2><p class="sub" style="margin:0">Der Player lädt jeden Fragenpool im JSON-Format dieser Simulation. Speichere den eingebauten Pool als Vorlage, ergänze eigene Fragen und lade die Datei wieder. Das Format steht in der README.</p>
  <div class="nav"><button class="sec" onclick="document.getElementById('file').click()">Fragenpool laden (JSON)</button><button class="sec" onclick="exportPool()">Aktuellen Pool als JSON speichern</button></div><div id="msg" class="sub" style="margin-top:8px"></div></div>`;
  h+=`<p class="sub">Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}

// ---------- Eigene Pools ----------
function validate(p){const qs=Array.isArray(p)?p:p&&p.questions;if(!Array.isArray(qs)||!qs.length)throw new Error('Keine Fragen gefunden. Erwartet wird ein Array oder ein Objekt mit "questions".');
  qs.forEach((q,i)=>{const n=`Frage ${i+1}`;if(!q.q)throw new Error(`${n}: Feld "q" fehlt.`);const t=typ(q);
    if(t==='choice'){if(!Array.isArray(q.o)||q.o.length<2)throw new Error(`${n}: "o" braucht mindestens zwei Antworten.`);if(!Array.isArray(q.c)||!q.c.length||q.c.some(c=>!(c>=0&&c<q.o.length)))throw new Error(`${n}: "c" muss gültige Indizes der richtigen Antworten enthalten.`)}
    else if(t==='order'){if(!Array.isArray(q.o)||q.o.length<2)throw new Error(`${n}: "o" braucht mindestens zwei Elemente in richtiger Reihenfolge.`)}
    else if(t==='match'){if(!Array.isArray(q.l)||!Array.isArray(q.o)||!Array.isArray(q.c)||q.c.length!==q.l.length||q.c.some(c=>!(c>=0&&c<q.o.length)))throw new Error(`${n}: Zuordnung braucht "l", "o" und für jedes Element in "l" einen Index in "c".`)}
    else throw new Error(`${n}: unbekannter Typ "${t}".`);});
  if(Array.isArray(p))p={questions:p};
  return{title:p.title||'Eigener Fragenpool',domains:p.domains||null,weights:p.weights||null,examN:p.examN||60,questions:qs};}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=validate(JSON.parse(r.result));if(!p.domains){const ds=[...new Set(p.questions.map(q=>String(q.d||1)))];p.domains=Object.fromEntries(ds.map(d=>[d,ds.length>1?'Domäne '+d:'Alle Fragen']))}usePool(p);home();}
    catch(err){home();document.getElementById('msg').textContent='Konnte die Datei nicht laden: '+err.message}};
  r.readAsText(f,'utf-8');e.target.value='';});
function exportPool(){const p={title:POOL.title,domains:POOL.domains,weights:POOL.weights,examN:POOL.examN,questions:Q};
  const b=new Blob([JSON.stringify(p,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(POOL===BUILTIN?KEY.replace(/_sim$/,''):'fragenpool')+'-fragen.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}

// ---------- Ablauf ----------
function start(mode,dom){
  let qs;const custom=POOL!==BUILTIN,examN=Math.min(POOL.examN||60,Q.length);
  if(mode==='exam'){if(WEIGHT){qs=[];for(const d in WEIGHT)qs.push(...shuffle(Q.filter(q=>String(q.d)===d)).slice(0,Math.round(examN*WEIGHT[d]/100)));qs=shuffle(qs)}else qs=shuffle(Q).slice(0,examN)}
  else if(mode==='all')qs=shuffle(Q);
  else if(mode==='wrong'){const w=lsGet(poolKey()+'_wrong')||[];qs=shuffle(Q.filter(q=>w.includes(qid(q))))}
  else if(mode==='dd')qs=shuffle(Q.filter(q=>typ(q)!=='choice'));
  else if(mode==='ex')qs=shuffle(Q.filter(q=>q.x));
  else qs=shuffle(Q.filter(q=>String(q.d||1)===String(dom)));
  qs=qs.map(q=>{const t=typ(q);
    if(t==='choice')return{...q,order:shuffle(q.o.map((_,i)=>i))};
    if(t==='order')return{...q};
    return{...q,lorder:shuffle(q.l.map((_,i)=>i)),porder:shuffle(q.o.map((_,i)=>i))}});
  const ans=qs.map(q=>{const t=typ(q);if(t==='choice')return[];
    if(t==='order'){let a;do{a=shuffle(q.o.map((_,i)=>i))}while(q.o.length>1&&a.every((v,i)=>v===i));return a}
    return q.l.map(()=>null)});
  const per=custom?BUILTIN.examSec/BUILTIN.examN:0;
  const left=mode==='exam'?(custom?Math.round(qs.length*per):POOL.examSec):mode==='all'?(custom?Math.round(qs.length*BUILTIN.allSec/BUILTIN.questions.length):POOL.allSec):0;
  const practice=!['exam','all'].includes(mode);
  S={mode,dom,practice,qs,i:0,ans,touched:qs.map(()=>false),done:qs.map(()=>false),left,sel:null};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function answered(i){const q=S.qs[i],t=typ(q);if(t==='choice')return S.ans[i].length>0;if(t==='order')return S.touched[i];return S.ans[i].every(x=>x!==null);}
const ok=i=>{const q=S.qs[i],a=S.ans[i],t=typ(q);
  if(t==='choice')return a.length===q.c.length&&q.c.every(x=>a.includes(x));
  if(t==='order')return S.touched[i]&&a.every((v,k)=>v===k);
  return a.every((v,k)=>v===q.c[k]);};

function render(){
  const q=S.qs[S.i],t=typ(q),locked=S.practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length}${Object.keys(DOM).length>1?` · Domäne ${q.d}`:''}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}`;
  if(t==='choice')h+=renderChoice(q,locked);else if(t==='order')h+=renderOrder(q,locked);else h+=renderMatch(q,locked);
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${rich(q.e||'')}</div>`;
  h+=`<div class="nav">`;
  if(!S.practice)h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(S.practice&&!locked)h+=`<button onclick="check()" ${answered(S.i)?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(!S.practice||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(!S.practice&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(S.practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(!S.practice){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.qs.filter((_,i)=>answered(i)).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${answered(i)?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;
  if(!locked){if(t==='order')wireOrder();if(t==='match')wireMatch();}}

function renderChoice(q,locked){const multi=q.c.length>1;
  let h=`<div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${rich(q.o[oi])}</span></label>`});
  return h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}

// Reihenfolge: Ziehen oder Pfeile
function renderOrder(q,locked){const a=S.ans[S.i];
  let h=`<div class="hint">Bring die Elemente in die richtige Reihenfolge: ziehen oder mit den Pfeilen verschieben.</div><ol class="ord" id="ord">`;
  a.forEach((v,k)=>{const cls=locked?(v===k?'ok':'bad'):'';
    h+=`<li draggable="${!locked}" data-k="${k}" class="${cls}"><span class="n">${k+1}.</span><span class="t">${rich(q.o[v])}</span>${locked?(v!==k?`<span class="right">gehört auf Platz ${v+1}</span>`:''):`<button class="sec" ${k==0?'disabled':''} onclick="mv(${k},-1)" aria-label="nach oben">↑</button><button class="sec" ${k==a.length-1?'disabled':''} onclick="mv(${k},1)" aria-label="nach unten">↓</button>`}</li>`});
  h+=`</ol>`;
  if(locked&&!ok(S.i))h+=`<div class="hint">Richtige Reihenfolge:</div><ol>${q.o.map(x=>`<li>${rich(x)}</li>`).join('')}</ol>`;
  return h;}
function mv(k,d){const a=S.ans[S.i],j=k+d;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];S.touched[S.i]=true;render();}
function wireOrder(){const ol=document.getElementById('ord');if(!ol)return;let from=null;
  ol.querySelectorAll('li').forEach(li=>{
    li.addEventListener('dragstart',e=>{from=+li.dataset.k;li.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(from))}catch(_){}});
    li.addEventListener('dragend',()=>li.classList.remove('drag'));
    li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over')});
    li.addEventListener('dragleave',()=>li.classList.remove('over'));
    li.addEventListener('drop',e=>{e.preventDefault();const to=+li.dataset.k;if(from===null||from===to)return;const a=S.ans[S.i];const [x]=a.splice(from,1);a.splice(to,0,x);S.touched[S.i]=true;render();});});}

// Zuordnung: Karte antippen, dann Feld antippen, oder ziehen
function renderMatch(q,locked){const a=S.ans[S.i];const reuse=q.o.length<q.l.length||q.reuse;
  let h=`<div class="hint">Ordne jedem Begriff links die passende Karte zu: ziehen, oder erst die Karte und dann das Feld antippen.${reuse?' Eine Karte kann mehrfach passen.':''}</div>`;
  if(!locked){const used=new Set(a.filter(x=>x!==null));
    h+=`<div class="pool" id="pool">${q.porder.filter(p=>reuse||!used.has(p)).map(p=>`<span class="chip${S.sel===p?' pick':''}" draggable="true" data-p="${p}">${rich(q.o[p])}</span>`).join('')||'<span class="hint">Alle Karten verteilt.</span>'}</div>`;}
  q.lorder.forEach(li=>{const v=a[li];let cls='zone';if(locked)cls+=v===q.c[li]?' ok':' bad';
    h+=`<div class="mrow"><div>${rich(q.l[li])}</div><div><div class="${cls}" data-l="${li}">${v===null?'<span class="ph">hier ablegen</span>':`<span class="chip" data-p="${v}" data-from="${li}">${rich(q.o[v])}</span>`}</div>${locked&&v!==q.c[li]?`<div class="right">richtig: ${rich(q.o[q.c[li]])}</div>`:''}</div></div>`});
  return h;}
function place(li,p){const q=S.qs[S.i],a=S.ans[S.i];const reuse=q.o.length<q.l.length||q.reuse;
  if(!reuse){const k=a.indexOf(p);if(k>=0)a[k]=null;}
  a[li]=p;S.sel=null;render();}
function wireMatch(){let drag=null;
  app.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('dragstart',e=>{drag={p:+ch.dataset.p,from:ch.dataset.from};try{e.dataTransfer.setData('text/plain',ch.dataset.p)}catch(_){}});
    ch.addEventListener('click',e=>{e.stopPropagation();if(ch.dataset.from!==undefined){S.ans[S.i][+ch.dataset.from]=null;S.sel=null;render();return}
      S.sel=S.sel===+ch.dataset.p?null:+ch.dataset.p;render();});});
  app.querySelectorAll('.zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();if(!drag)return;if(drag.from!==undefined)S.ans[S.i][+drag.from]=null;place(+z.dataset.l,drag.p);drag=null;});
    z.addEventListener('click',()=>{if(S.sel!==null)place(+z.dataset.l,S.sel);});});
  const pool=document.getElementById('pool');
  if(pool){pool.addEventListener('dragover',e=>e.preventDefault());pool.addEventListener('drop',e=>{e.preventDefault();if(drag&&drag.from!==undefined){S.ans[S.i][+drag.from]=null;drag=null;render()}});}}

function check(){S.done[S.i]=true;const id=qid(S.qs[S.i]);let w=lsGet(poolKey()+'_wrong')||[];
  if(ok(S.i))w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id);lsSet(poolKey()+'_wrong',w);render();}
function go(d){S.i+=d;S.sel=null;render();}
function jump(i){S.i=i;S.sel=null;render();}
function confirmFinish(){const n=S.qs.filter((_,i)=>!answered(i)).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function ansText(q,i){const a=S.ans[i],t=typ(q);
  if(t==='choice')return a.length?a.map(x=>rich(q.o[x])).join(' · '):'<em>keine</em>';
  if(t==='order')return S.touched[i]?a.map(x=>rich(q.o[x])).join(' → '):'<em>nicht sortiert</em>';
  return q.l.map((l,k)=>`${rich(l)}: ${a[k]===null?'–':rich(q.o[a[k]])}`).join(' · ');}
function rightText(q){const t=typ(q);
  if(t==='choice')return q.c.map(x=>rich(q.o[x])).join(' · ');
  if(t==='order')return q.o.map(rich).join(' → ');
  return q.l.map((l,k)=>`${rich(l)}: ${rich(q.o[q.c[k]])}`).join(' · ');}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{const d=q.d||1;per[d]=per[d]||{r:0,n:0};per[d].n++;if(ok(i))per[d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=n?Math.round(100*r/n):0;
  const name={exam:'Prüfung',all:'Alle Fragen',wrong:'Wiederholung',dd:'Ordnen/Zuordnen',ex:'Exhibits',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet(poolKey()+'_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet(poolKey()+'_hist',hist.slice(-20));
  if(!S.practice){let w=lsGet(poolKey()+'_wrong')||[];S.qs.forEach((q,i)=>{const id=qid(q);if(ok(i))w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id)});lsSet(poolKey()+'_wrong',w);}
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'} Falsche Fragen landen in der Liste „Falsch beantwortete wiederholen“.</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${Object.keys(DOM).length>1?d+' ':''}${esc(DOM[d]||'')}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${rich(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${ansText(q,i)}</div><div style="color:var(--ok)">Richtig: ${rightText(q)}</div><div class="expl">${rich(q.e||'')}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
