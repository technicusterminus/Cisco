<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENCOR Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:800px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
code{background:var(--chip);border-radius:4px;padding:0 4px;font:.88em Menlo,Consolas,monospace}pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
/* Reihenfolge */
.ord{list-style:none;padding:0;margin:8px 0}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card);cursor:grab;touch-action:none}
.ord li.drag{opacity:.4}.ord li.over{border-color:var(--acc);border-style:dashed}
.ord .n{color:var(--mut);font-variant-numeric:tabular-nums;min-width:1.4em}
.ord .t{flex:1}
.ord button{padding:2px 9px;font-size:.9rem}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.bad{border-color:var(--bad);background:var(--badbg)}
/* Zuordnung */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;min-height:48px;margin:8px 0}
.chip{border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:grab;font-size:.92rem;user-select:none}
.chip.pick{background:var(--acc);color:#fff}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.zone{min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.zone.over{border-color:var(--acc)}.zone .ph{color:var(--mut);font-size:.85rem;padding:0 6px}
.zone.ok{border:1px solid var(--ok);background:var(--okbg)}.zone.bad{border:1px solid var(--bad);background:var(--badbg)}
.right{color:var(--ok);font-size:.85rem}
@media(max-width:560px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<input type="file" id="file" accept=".json,application/json" class="hide">
<script>
const BUILTIN={title:'CCNP ENCOR 350-401 v1.2 · Prüfungssimulation',domains:{1:'Architektur',2:'Virtualisierung',3:'Infrastruktur',4:'Network Assurance',5:'Security',6:'Automation'},weights:{1:15,2:10,3:30,4:10,5:20,6:15},examN:60,examSec:4500,allSec:13800,questions:[{"d": 1, "q": "Welche Schicht des dreistufigen Campus-Designs bildet die Grenze zwischen Layer 2 und Layer 3 und setzt Policies und Summaries um?", "o": ["Distribution", "Access", "Core", "Edge"], "c": [0], "e": "Distribution. Sie sammelt die Access-Switches ein, trägt die Gateways (SVIs) und fasst Routen zusammen. Access schließt nur Endgeräte an, Core verbindet die Blöcke nur schnell miteinander."}, {"d": 1, "q": "Wann ist ein Collapsed Core (Zwei-Schichten-Design) sinnvoll?", "o": ["Bei kleineren Standorten, wo Core und Distribution in einer Schicht zusammengelegt werden können.", "Nur in Rechenzentren mit Spine-Leaf.", "Wenn mehr als 20 Gebäude angebunden sind.", "Wenn kein Routing eingesetzt wird."], "c": [0], "e": "Bei kleinen Standorten. Dort übernimmt eine Schicht die Aufgaben von Distribution und Core zugleich und spart Geräte. Ein eigener Core lohnt sich erst, wenn viele Distribution-Blöcke verbunden werden müssen."}, {"d": 1, "q": "Welche Vorteile bietet ein geroutetes Access-Layer (Layer 3 bis zum Access-Switch)? (Wähle zwei)", "o": ["Kein Spanning Tree zwischen Access und Distribution nötig, Failover per Routing-Protokoll", "Kleinere Broadcast- und Fehlerdomänen", "VLANs können beliebig über das Gebäude gespannt werden", "Es werden keine IP-Subnetze pro Access-Switch benötigt"], "c": [0, 1], "e": "Kein STP auf den Uplinks und kleinere Broadcast-Domänen. Bei Routed Access endet Layer 2 am Access-Switch, die Uplinks sind geroutet und per ECMP beide aktiv. Der Preis: Ein VLAN kann nicht mehr über mehrere Access-Switches reichen, und jeder Access-Switch braucht eigene Subnetze."}, {"d": 1, "q": "Welche Aussage über Spine-Leaf ist richtig?", "o": ["Jeder Leaf ist mit jedem Spine verbunden, Endgeräte hängen nur an Leafs.", "Spines sind untereinander verbunden, Leafs nur an einem Spine.", "Endgeräte hängen direkt an den Spines.", "Leafs sind untereinander im Ring verbunden."], "c": [0], "e": "Jeder Leaf hängt an jedem Spine, Endgeräte nur an Leafs. Dadurch ist jeder Weg Leaf → Spine → Leaf gleich lang, und ECMP verteilt über alle Spines. Spines sind untereinander nicht verbunden."}, {"d": 1, "q": "Welche Funktion hat der Fabric Edge Node in SD-Access?", "o": ["Er verbindet Endpunkte mit der Fabric, ordnet sie Segmenten zu und kapselt in VXLAN.", "Er verbindet die Fabric mit externen Netzen.", "Er speichert die Endpunkt-zu-Locator-Zuordnung.", "Er ist der Policy-Controller."], "c": [0], "e": "Der Fabric Edge schließt Endgeräte an, ordnet sie VN und SGT zu und kapselt ihren Verkehr in VXLAN. Nach außen verbindet der Border Node, das Mapping speichert der Control Plane Node, Controller ist Catalyst Center."}, {"d": 1, "q": "Welches Protokoll nutzt die SD-Access-Control-Plane?", "o": ["LISP", "BGP EVPN", "OSPF", "IS-IS"], "c": [0], "e": "LISP. Der Control Plane Node ist LISP Map Server und Map Resolver und speichert, hinter welchem Edge jeder Endpoint sitzt. Die Daten laufen in VXLAN, die Policy über SGTs."}, {"d": 1, "q": "Welche Datenebene verwendet SD-Access?", "o": ["VXLAN mit SGT-Informationen im Header (VXLAN-GPO)", "GRE", "MPLS L3VPN", "IPsec"], "c": [0], "e": "VXLAN mit Group Policy Option (VXLAN-GPO). Der Header trägt das VN als VNI und die SGT des Absenders. So kann der Ziel-Edge die Policy durchsetzen, ohne die SGT anderweitig zu erfahren."}, {"d": 1, "q": "Welche Rolle hat der SD-WAN Controller (früher vSmart) in Cisco Catalyst SD-WAN?", "o": ["Er verteilt Routen und Policies (OMP) an die Edge-Geräte.", "Er orchestriert die Erstverbindung (Onboarding) und die Authentifizierung.", "Er verwaltet Konfiguration und Monitoring über die GUI.", "Er leitet Datenverkehr der Standorte weiter."], "c": [0], "e": "Er ist die Control Plane und verteilt per OMP Routen, TLOCs, Schlüssel und Policies an die Edges. Erstkontakt und Authentisierung macht der Validator (vBond), Konfiguration der Manager (vManage), Datenverkehr die Edges."}, {"d": 1, "q": "Welche Komponente in Cisco Catalyst SD-WAN ist der erste Kontaktpunkt neuer Geräte und nennt ihnen die Adressen von Controller und Manager?", "o": ["vBond", "vSmart", "vManage", "vAnalytics"], "c": [0], "e": "Der Validator (früher vBond). Er prüft die Geräteidentität, erkennt NAT und teilt den Edges mit, wo Controller und Manager erreichbar sind."}, {"d": 1, "q": "Welches Protokoll tauscht in Cisco SD-WAN Routen, Policies und Schlüssel zwischen den Edges und dem Controller aus?", "o": ["OMP (Overlay Management Protocol)", "OSPF", "LISP", "BFD"], "c": [0], "e": "OMP (Overlay Management Protocol). Es läuft nur zwischen Edges und Controllern, nicht zwischen den Edges direkt. BFD dagegen misst in den Datentunneln die Pfadqualität."}, {"d": 1, "q": "Womit misst SD-WAN die Qualität der Tunnel, um Pfade nach SLA zu wählen?", "o": ["BFD-Probes pro Transport (Loss, Latenz, Jitter)", "SNMP-Polling", "Traceroute", "NetFlow"], "c": [0], "e": "Mit BFD in jedem IPsec-Tunnel. BFD erkennt Ausfälle und misst Verlust, Latenz und Jitter. Diese Werte nutzt Application-Aware Routing für die Pfadwahl."}, {"d": 1, "q": "Welche zwei Aussagen zu QoS-Markierung sind richtig? (Wähle zwei)", "o": ["DSCP umfasst 6 Bit im IP-Header.", "CoS umfasst 3 Bit im 802.1Q-Tag.", "DSCP ist ein Layer-2-Feld.", "CoS ist 6 Bit lang."], "c": [0, 1], "e": "DSCP hat 6 Bit im IP-Header, CoS 3 Bit im 802.1Q-Tag. DSCP ist ein Layer-3-Feld und bleibt über Router hinweg erhalten. CoS ist Layer 2 und existiert nur auf getaggten Links."}, {"d": 1, "q": "Welcher DSCP-Wert gilt für Sprachverkehr (Expedited Forwarding)?", "o": ["46", "34", "26", "18"], "c": [0], "e": "46. Merkhilfe: AFxy = 8x + 2y. AF41 = 34, AF31 = 26, AF21 = 18. EF ist ein Sonderwert mit 46."}, {"d": 1, "q": "Welche Aufgabe hat Shaping im Vergleich zu Policing?", "o": ["Shaping puffert Überschuss und glättet, Policing verwirft oder remarkiert Überschuss.", "Shaping verwirft Überschuss, Policing puffert ihn.", "Beide verwerfen nur ausgehend.", "Shaping gilt nur eingehend."], "c": [0], "e": "Shaping hält Überschuss in einer Queue zurück und sendet ihn später, das kostet Verzögerung. Policing verwirft oder stuft sofort herab. Shaping geht nur ausgehend, Policing in beide Richtungen."}, {"d": 1, "q": "Welche Reihenfolge entspricht dem MQC-Konfigurationsablauf?", "o": ["class-map → policy-map → service-policy am Interface", "policy-map → service-policy → class-map", "service-policy → class-map → policy-map", "access-list → route-map → service-policy"], "c": [0], "e": "class-map → policy-map → service-policy. Erst Verkehr in Klassen sortieren, dann für jede Klasse eine Aktion festlegen, dann die Policy an ein Interface hängen."}, {"d": 1, "q": "Welche Queuing-Methode bietet strikte Priorität für sprachkritischen Verkehr?", "o": ["LLQ (Low Latency Queuing)", "FIFO", "WFQ ohne Priority-Queue", "Tail Drop"], "c": [0], "e": "LLQ (Low Latency Queuing). LLQ ist CBWFQ plus eine Queue mit strikter Priorität. Diese Queue wird bei Stau auf ihre Rate begrenzt, damit die anderen Klassen nicht verhungern."}, {"d": 1, "q": "Welche Wirkung hat WRED?", "o": ["Er verwirft Pakete zufällig schon vor voller Queue, abhängig von der Markierung.", "Er verwirft alle Pakete bei voller Queue gleichzeitig.", "Er priorisiert Sprachpakete strikt.", "Er verschlüsselt Pakete."], "c": [0], "e": "WRED verwirft schon vor voller Queue zufällig einzelne Pakete, zuerst die mit höherer Drop Precedence. So bremsen einzelne TCP-Flows früh, statt dass alle zugleich einbrechen (TCP Global Synchronization)."}, {"d": 1, "q": "Für Sprache mit unter 150 ms Verzögerung werden mehrere Maßnahmen vorgeschlagen. Welche hilft der Sprache nicht?", "o": ["Alle Pakete auf der WAN-Strecke mit einem Shaper auf 100 % der Linkgeschwindigkeit verzögern", "LLQ für EF", "Klassifizierung am Access-Switch (Trust-Boundary)", "Geringe Serialisierungsverzögerung durch Fragmentierung/LFI auf langsamen Links"], "c": [0], "e": "Den gesamten Verkehr knapp an der Linkrate zu shapen. Das erzeugt nur zusätzliche Warteschlangen und Verzögerung. Was Sprache hilft: LLQ für EF, Markierung am Access-Port und auf langsamen Links Fragmentierung (LFI), damit große Pakete die Sprachpakete nicht aufhalten."}, {"d": 1, "q": "Welche Rolle hat die Trust-Boundary im QoS-Design?", "o": ["Ab hier werden Markierungen als vertrauenswürdig akzeptiert, davor wird neu markiert oder verworfen.", "Sie begrenzt die Bandbreite des Uplinks.", "Sie legt die VLAN-Grenzen fest.", "Sie bestimmt die Root Bridge."], "c": [0], "e": "Ab der Trust-Boundary werden Markierungen ungeprüft übernommen, davor wird neu markiert. Typisch liegt sie am Access-Port oder am IP-Telefon. So kann sich kein normales Endgerät selbst Vorrang geben."}, {"d": 1, "q": "Welche Aussage über HSRP-Version 2 stimmt?", "o": ["Sie unterstützt IPv6 und nutzt die Multicast-Adresse 224.0.0.102.", "Sie nutzt 224.0.0.2 und unterstützt nur Gruppen 0–255.", "Sie ist offen standardisiert wie VRRP.", "Sie teilt Last nativ auf alle Router."], "c": [0], "e": "HSRPv2 unterstützt IPv6, Gruppen 0–4095 und nutzt 224.0.0.102. HSRPv1 nutzt 224.0.0.2 und nur Gruppen 0–255. HSRP ist in beiden Versionen Cisco-proprietär und verteilt keine Last, das kann GLBP."}, {"d": 1, "q": "Welches FHRP verteilt Last auf mehrere Gateways mit einer virtuellen IP über mehrere virtuelle MACs?", "o": ["GLBP", "HSRP", "VRRP", "STP"], "c": [0], "e": "GLBP. Der Active Virtual Gateway (AVG) beantwortet ARP-Anfragen für die eine virtuelle IP abwechselnd mit verschiedenen virtuellen MACs. Jede vMAC gehört einem anderen Router (AVF), so verteilen sich die Clients."}, {"d": 1, "q": "Welche zwei Schritte sind nötig, damit ein HSRP-Router nach Wiederkehr die aktive Rolle übernimmt? (Wähle zwei)", "o": ["Höhere Priorität als der aktuelle Active", "preempt aktiviert", "Gleiche Priorität wie der Standby", "Eine größere Hello-Zeit"], "c": [0, 1], "e": "Höhere Priorität und preempt. Ohne preempt holt sich ein Router die Active-Rolle nicht zurück, egal wie hoch seine Priorität ist. Preempt ist bei HSRP standardmäßig aus, bei VRRP an."}, {"d": 1, "q": "Was beschreibt den Border Node in SD-Access?", "o": ["Er verbindet die SD-Access-Fabric mit Netzen außerhalb (WAN, Rechenzentrum, Internet).", "Er verbindet Endgeräte mit Access-Ports.", "Er speichert die Host-Tracking-Datenbank.", "Er erzeugt SGT-Zuordnungen."], "c": [0], "e": "Der Border Node verbindet die Fabric mit allem außerhalb: WAN, Rechenzentrum, Internet. Er übergibt zwischen VXLAN/LISP in der Fabric und normalem Routing draußen."}, {"d": 1, "q": "Welche Eigenschaft unterscheidet Cisco Catalyst Center (früher DNA Center) von klassischem CLI-Management?", "o": ["Es bietet intent-basierte Automatisierung, Assurance und Policy über eine zentrale Plattform.", "Es ersetzt alle Routing-Protokolle im Netz.", "Es läuft nur auf einem einzelnen Switch.", "Es verwendet ausschließlich SNMPv1."], "c": [0], "e": "Catalyst Center bietet Automation, Assurance und Policy zentral auf einer Plattform. Man beschreibt die Absicht (Intent), und der Controller setzt sie per CLI, NETCONF oder API auf den Geräten um. Routing-Protokolle ersetzt es nicht."}, {"d": 1, "q": "Welche beiden Optionen sind Merkmale einer Underlay-Netzwerkarchitektur in SD-Access? (Wähle zwei)", "o": ["Reines IP-Netz zwischen den Fabric-Knoten (L3-Routing)", "Transportiert die VXLAN-Overlay-Pakete", "Führt Endpunkte in virtuellen Netzen (VNs)", "Trägt SGT-Policy-Regeln der Endpunkte direkt"], "c": [0, 1], "e": "Das Underlay ist ein reines IP-Netz zwischen den Fabric-Knoten und transportiert die VXLAN-Pakete. VNs und SGT-Regeln gehören zum Overlay, das Underlay kennt sie nicht."}, {"d": 1, "q": "Welches Merkmal hat ein Cloud-Zugang über Direct Connect/ExpressRoute gegenüber einem Internet-VPN?", "o": ["Dedizierte, private Verbindung mit planbarer Latenz und Bandbreite.", "Er ist immer billiger.", "Er nutzt automatisch IPsec-Verschlüsselung.", "Er benötigt keine Routing-Konfiguration."], "c": [0], "e": "Eine dedizierte, private Leitung mit planbarer Latenz und Bandbreite. Sie ist nicht automatisch verschlüsselt und braucht trotzdem Routing (meist BGP). Billiger als Internet ist sie in der Regel auch nicht."}, {"d": 2, "q": "Welcher Hypervisor-Typ läuft direkt auf der Hardware ohne Host-Betriebssystem?", "o": ["Typ 1", "Typ 2", "Container-Runtime", "Emulator"], "c": [0], "e": "Typ 1, auch Bare Metal genannt, z. B. ESXi oder KVM. Typ 2 läuft als Programm auf einem Betriebssystem, z. B. VirtualBox oder VMware Workstation."}, {"d": 2, "q": "Was unterscheidet Container von virtuellen Maschinen?", "o": ["Container teilen sich den Kernel des Hosts und sind leichter.", "Container haben einen eigenen Kernel pro Instanz.", "Container brauchen immer einen Hypervisor.", "Container laufen nicht auf Linux."], "c": [0], "e": "Container teilen sich den Kernel des Hosts und sind dadurch klein und schnell. Getrennt werden sie über Namespaces und cgroups. Eine VM bringt ihren eigenen Kernel mit und ist stärker isoliert."}, {"d": 2, "q": "Welche Funktion hat ein virtueller Switch (vSwitch) wie Open vSwitch?", "o": ["Er verbindet VMs untereinander und mit dem physischen Netz auf Layer 2.", "Er routet zwischen Autonomen Systemen.", "Er ersetzt den Hypervisor.", "Er terminiert IPsec-VPNs."], "c": [0], "e": "Ein vSwitch verbindet VMs untereinander und über die physischen Uplinks mit dem Netz, auf Layer 2. Über Portgruppen ordnet er VMs VLANs zu und taggt den Verkehr auf dem Trunk-Uplink."}, {"d": 2, "q": "Wie heißt das Konzept, Netzwerkfunktionen wie einen Router oder eine Firewall als Software auf Standard-Servern zu betreiben?", "o": ["NFV (Network Functions Virtualization)", "SDN-Controller", "TRILL", "MPLS"], "c": [0], "e": "NFV (Network Functions Virtualization). Router, Firewall oder WAN-Optimierer laufen als VM oder Container, z. B. Catalyst 8000V. SDN ist etwas anderes: die zentrale Steuerung des Netzes durch einen Controller."}, {"d": 2, "q": "Ein VRF-Lite trennt Routingtabellen. Welche Aussage ist richtig?", "o": ["Gleiche IP-Präfixe können in verschiedenen VRFs unabhängig existieren.", "VRFs teilen eine globale Routingtabelle mit VLAN-Tags.", "VRF-Lite benötigt MPLS.", "VRFs benötigen immer BGP."], "c": [0], "e": "Gleiche Präfixe dürfen in verschiedenen VRFs existieren, weil jede VRF ihre eigene Routing-Tabelle hat. VRF-Lite braucht dafür weder MPLS noch BGP. Zwischen zwei Routern braucht jede VRF aber ein eigenes Subinterface."}, {"d": 2, "q": "Welcher Befehl ordnet ein Interface einem VRF zu?", "o": ["ip vrf forwarding KUNDE_A (bzw. vrf forwarding KUNDE_A)", "ip route vrf KUNDE_A", "ip vrf bind KUNDE_A", "vrf member KUNDE_A (IOS)"], "c": [0], "e": "<code>vrf forwarding NAME</code> (alte Syntax: <code>ip vrf forwarding NAME</code>). Falle: Dabei wird die IP-Adresse des Interfaces gelöscht und muss neu gesetzt werden."}, {"d": 2, "q": "Ein Ping aus dem VRF funktioniert nicht. Welcher Befehl ist richtig?", "o": ["ping vrf KUNDE_A 10.1.1.1", "ping 10.1.1.1 vrf KUNDE_A source", "ping 10.1.1.1 table KUNDE_A", "vrf ping 10.1.1.1"], "c": [0], "e": "<code>ping vrf KUNDE_A 10.1.1.1</code>. Das Muster gilt für alle VRF-Befehle: <code>show ip route vrf NAME</code>, <code>traceroute vrf NAME</code>. Ohne vrf sucht der Router in der globalen Tabelle."}, {"d": 2, "q": "Welche Aussage über GRE ist richtig?", "o": ["GRE kapselt beliebige Protokolle, bietet aber keine Verschlüsselung.", "GRE verschlüsselt mit AES.", "GRE kann nur IPv4 transportieren.", "GRE nutzt Port 500."], "c": [0], "e": "GRE packt fast alles ein, auch Multicast und Routing-Protokolle, verschlüsselt aber nichts. GRE ist IP-Protokoll 47, kein Port. Für Verschlüsselung kombiniert man es mit IPsec."}, {"d": 2, "q": "Welcher Vorteil hat GRE over IPsec gegenüber reinem IPsec-Tunnel-Modus?", "o": ["Routing-Protokolle und Multicast laufen über den Tunnel.", "Höhere Verschlüsselungsstärke.", "Kein MTU-Overhead.", "Keine Konfiguration von Schlüsseln."], "c": [0], "e": "Über GRE over IPsec laufen Routing-Protokolle und Multicast. Klassisches IPsec transportiert nur Unicast-IP, OSPF-Hellos sind aber Multicast. GRE verpackt sie in Unicast, IPsec verschlüsselt das GRE-Paket."}, {"d": 2, "q": "Welche beiden Phasen hat IKEv1 beim Aufbau eines IPsec-Tunnels? (Wähle zwei)", "o": ["Phase 1 baut die IKE-SA auf.", "Phase 2 baut die IPsec-SA für den Datenverkehr auf.", "Phase 1 verschlüsselt den Nutzverkehr.", "Phase 2 authentifiziert die Gegenstelle erstmals."], "c": [0, 1], "e": "Phase 1 baut die IKE-SA auf, Phase 2 die IPsec-SAs für die Daten. In Phase 1 authentisieren sich die Peers und erzeugen per Diffie-Hellman einen sicheren Kanal. Darin handeln sie in Phase 2 die Schlüssel für den Nutzverkehr aus."}, {"d": 2, "q": "Welches Protokoll des IPsec-Frameworks bietet Verschlüsselung der Nutzdaten?", "o": ["ESP (IP-Protokoll 50)", "AH (IP-Protokoll 51)", "GRE (IP-Protokoll 47)", "IKE UDP 500"], "c": [0], "e": "ESP (IP-Protokoll 50) verschlüsselt und schützt die Integrität. AH (51) schützt nur die Integrität, verschlüsselt nicht und funktioniert nicht durch NAT."}, {"d": 2, "q": "Welche Methode erlaubt IPsec durch NAT?", "o": ["NAT-Traversal (ESP in UDP 4500)", "AH im Transportmodus", "Doppeltes NAT", "GRE ohne Schutz"], "c": [0], "e": "NAT-Traversal. IKE erkennt auf UDP 500 ein NAT-Gerät und verpackt ESP danach in UDP 4500. NAT kann ESP ohne Ports sonst nicht übersetzen."}, {"d": 2, "q": "Welcher Vorteil bietet VTI (Virtual Tunnel Interface) gegenüber Crypto Maps?", "o": ["Der Tunnel ist ein routbares Interface, auf dem sich Routing-Protokolle und QoS direkt konfigurieren lassen.", "Er ist zwingend ohne IKE.", "Er benötigt keine IPsec-Profile.", "Er funktioniert nur ohne Verschlüsselung."], "c": [0], "e": "Ein VTI ist ein normales, routbares Interface. Was dorthin geroutet wird, wird verschlüsselt, und Routing-Protokolle und QoS laufen direkt darauf. Bei Crypto Maps bestimmt dagegen eine ACL, was verschlüsselt wird."}, {"d": 2, "q": "Welche Aufgabe haben die LISP-Map-Server/Map-Resolver?", "o": ["Sie halten EID-zu-RLOC-Zuordnungen und beantworten Map-Requests.", "Sie verschlüsseln den Tunnelverkehr.", "Sie routen Pakete über das Underlay.", "Sie vergeben DHCP-Adressen."], "c": [0], "e": "Sie speichern die Zuordnung EID → RLOC und beantworten Anfragen danach. ETRs melden ihre Endpoints beim Map Server an, ITRs fragen beim Map Resolver nach, wo ein Ziel sitzt."}, {"d": 2, "q": "Welcher Port wird für die LISP-Datenebene genutzt?", "o": ["UDP 4341", "UDP 4789", "UDP 4500", "TCP 179"], "c": [0], "e": "UDP 4341 für Daten, 4342 für Steuernachrichten. Nicht verwechseln: VXLAN nutzt UDP 4789, NAT-T UDP 4500."}, {"d": 2, "q": "Welcher UDP-Zielport gilt für VXLAN?", "o": ["4789", "4341", "4500", "500"], "c": [0], "e": "UDP 4789. VXLAN packt Ethernet-Frames in UDP und kennzeichnet das Segment mit einer 24-Bit-VNI."}, {"d": 2, "q": "Warum ist VXLAN gegenüber VLANs für große Rechenzentren vorteilhaft?", "o": ["24-Bit-VNI statt 12-Bit-VLAN-ID, L2-Segmente über L3-Underlay.", "Es braucht kein Underlay.", "Es ersetzt BGP.", "Es verwendet keine Kapselung."], "c": [0], "e": "Die VNI hat 24 Bit statt 12, also rund 16 Millionen statt 4.094 Segmente. Außerdem lassen sich Layer-2-Segmente über ein geroutetes Underlay spannen, ohne STP im Transportnetz."}, {"d": 2, "q": "Wofür dient der VTEP in einem VXLAN-Netz?", "o": ["Er kapselt und entkapselt Frames am Rand der Overlay-Segmente.", "Er führt Spanning Tree aus.", "Er verteilt SGT-Tags.", "Er vergibt IP-Adressen."], "c": [0], "e": "Der VTEP ist der Tunnelendpunkt: Er packt Frames in VXLAN ein und am anderen Ende wieder aus. Das kann ein Leaf-Switch, ein Hypervisor oder ein Border-Gerät sein."}, {"d": 3, "q": "Welcher Switch wird in einem Rapid-PVST+-Netz Root Bridge für VLAN 10?", "x": "SW1: priority 32778, MAC 0011.1111.1111\nSW2: priority 28682, MAC 0022.2222.2222\nSW3: priority 28682, MAC 0000.3333.3333\nSW4: priority 32778, MAC 0000.4444.4444", "o": ["SW3", "SW1", "SW2", "SW4"], "c": [0], "e": "SW3. Gewählt wird die niedrigste Bridge-ID: zuerst die Priorität, dann die MAC. SW2 und SW3 haben beide 28682 (28672 + VLAN 10), SW3 hat die niedrigere MAC."}, {"d": 3, "q": "Welche Rolle hat ein Port, der in RSTP als Backup-Port arbeitet?", "o": ["Er ist ein redundanter Weg zum selben Segment auf demselben Switch (Alternative zum Designated Port).", "Er ist ein Pfad zur Root Bridge über einen anderen Switch.", "Er ist der beste Pfad zur Root Bridge.", "Er verbindet zwei Root Bridges."], "c": [0], "e": "Ein Backup Port ist ein zweiter Port desselben Switches am selben Segment, Ersatz für dessen Designated Port. Ein Alternate Port ist dagegen ein Ersatzweg zur Root über einen anderen Switch."}, {"d": 3, "q": "Welche Zustände kennt RSTP?", "o": ["Discarding, Learning, Forwarding", "Blocking, Listening, Learning, Forwarding", "Disabled, Blocking, Forwarding", "Discarding, Listening, Forwarding"], "c": [0], "e": "Discarding, Learning, Forwarding. RSTP fasst die alten 802.1D-Zustände Disabled, Blocking und Listening zu Discarding zusammen."}, {"d": 3, "q": "Welche Funktion hat BPDU Guard an einem PortFast-Port?", "o": ["Der Port geht beim Empfang einer BPDU in err-disabled.", "Der Port blockiert dauerhaft den Verkehr.", "Der Port wird zur Root Bridge.", "Der Port sendet zusätzliche BPDUs."], "c": [0], "e": "Der Port geht in err-disabled, sobald eine BPDU ankommt. So wird verhindert, dass jemand an einem Endgeräteport einen Switch anschließt. Zurück per <code>shutdown</code>/<code>no shutdown</code> oder errdisable recovery."}, {"d": 3, "q": "Welcher Schutzmechanismus verhindert, dass ein Switch hinter einem Port per besserer BPDU zur Root Bridge wird?", "o": ["Root Guard", "BPDU Filter", "Loop Guard", "UDLD"], "c": [0], "e": "Root Guard. Kommt eine bessere BPDU an, setzt er den Port auf root-inconsistent und blockiert ihn. Sobald die besseren BPDUs aufhören, erholt sich der Port von selbst."}, {"d": 3, "q": "Wogegen schützt Loop Guard?", "o": ["Gegen Loops durch ausbleibende BPDUs (z. B. unidirektionale Links) an Non-Designated-Ports.", "Gegen fremde Root Bridges.", "Gegen MAC-Flooding.", "Gegen DHCP-Spoofing."], "c": [0], "e": "Loop Guard schützt vor Schleifen, wenn auf einem blockierten Port die BPDUs ausbleiben, z. B. wegen eines einseitig defekten Links. Statt in Forwarding zu gehen, wird der Port loop-inconsistent."}, {"d": 3, "q": "200 VLANs sind bei MST auf Instanz 0 (IST) und Instanz 1 verteilt. Wie viele STP-Instanzen laufen?", "o": ["Zwei (Instanz 0 und Instanz 1)", "200", "Eine pro Bridge", "Vier"], "c": [0], "e": "Zwei. MST rechnet pro Instanz einen Baum, nicht pro VLAN. Rapid PVST+ bräuchte für 200 VLANs 200 Instanzen."}, {"d": 3, "q": "Was muss auf zwei Switches übereinstimmen, damit sie zur selben MST-Region gehören? (Wähle drei)", "o": ["Region-Name", "Revisionsnummer", "VLAN-zu-Instanz-Zuordnung", "Bridge-Priorität", "Hello-Zeit"], "c": [0, 1, 2], "e": "Region-Name, Revisionsnummer und VLAN-zu-Instanz-Zuordnung. Aus diesen drei Werten bildet MST einen Prüfwert (Digest). Weicht einer ab, gehören die Switches zu verschiedenen Regionen. Priorität und Timer spielen dafür keine Rolle."}, {"d": 3, "q": "Welche Konfiguration führt zu einer funktionierenden EtherChannel-Bündelung mit LACP?", "o": ["Beide Seiten active oder active/passive", "Beide Seiten passive", "Eine Seite on, die andere active", "Eine Seite desirable, die andere active"], "c": [0], "e": "Beide Seiten active oder eine active und eine passive. Mindestens eine Seite muss LACP aktiv anstoßen. „on“ ist statisch ohne LACP und passt nicht zu active, desirable gehört zu PAgP."}, {"d": 3, "q": "Wodurch entsteht eine Native-VLAN-Mismatch-Meldung auf einem Trunk?", "o": ["Die Native VLANs beider Trunk-Enden sind unterschiedlich konfiguriert.", "Die Trunk-Encapsulation ist dot1q auf beiden Seiten.", "Beide Seiten nutzen VLAN 1.", "Ein Port ist im Access-Modus."], "c": [0], "e": "Die beiden Trunk-Enden haben unterschiedliche Native VLANs. Ungetaggte Frames landen dann auf der Gegenseite im falschen VLAN. CDP meldet das, und STP kann den Port blockieren."}, {"d": 3, "q": "Welcher Befehl zeigt, welche VLANs auf einem Trunk tatsächlich weitergeleitet werden (nicht gepruned, nicht gesperrt)?", "o": ["show interfaces trunk", "show vlan brief", "show spanning-tree", "show mac address-table"], "c": [0], "e": "<code>show interfaces trunk</code>. Der letzte Block „forwarding state and not pruned“ zeigt, was wirklich weitergeleitet wird. Davor stehen „allowed“ (erlaubt) und „allowed and active“ (erlaubt und lokal angelegt)."}, {"d": 3, "q": "Ein Access-Port im Voice-VLAN: Welche zwei Aussagen sind korrekt? (Wähle zwei)", "o": ["Daten laufen untagged im Access-VLAN.", "Sprache wird mit 802.1Q-Tag im Voice-VLAN gesendet.", "Das Telefon nutzt immer das Native VLAN.", "Voice-VLAN erfordert einen vollständigen Trunk."], "c": [0, 1], "e": "Der PC sendet ungetaggt im Access-VLAN, das Telefon getaggt im Voice-VLAN. Mit <code>switchport voice vlan</code> bleibt der Port ein Access-Port. Ein voller Trunk ist dafür nicht nötig."}, {"d": 3, "q": "Welche OSPF-Timer gelten standardmäßig auf Broadcast-Netzen?", "o": ["10 Sekunden (Dead 40 Sekunden)", "30 Sekunden (Dead 120)", "5 Sekunden (Dead 20)", "60 Sekunden (Dead 180)"], "c": [0], "e": "Hello 10 Sekunden, Dead 40 Sekunden. Das gilt auch für Point-to-Point. Auf NBMA und Point-to-Multipoint sind es 30 und 120 Sekunden."}, {"d": 3, "q": "Welche OSPF-Zustände durchläuft eine Nachbarschaft bis zur vollen Adjazenz?", "o": ["Down, Init, 2-Way, ExStart, Exchange, Loading, Full", "Down, Attempt, Init, Full", "Init, ExStart, Loading, Full, Established", "Idle, Connect, OpenSent, Established"], "c": [0], "e": "Down, Init, 2-Way, ExStart, Exchange, Loading, Full. Falle: Zwei DROTHER bleiben untereinander bewusst in 2-Way, nur mit DR und BDR werden sie Full."}, {"d": 3, "q": "Wie wird der DR in einem OSPF-Broadcast-Segment gewählt?", "o": ["Höchste Interface-Priorität, bei Gleichstand höchste Router-ID, ohne Präemption.", "Niedrigste Router-ID.", "Höchste IP im Netz, immer präemptiv.", "Der Router mit der niedrigsten Kosten."], "c": [0], "e": "Höchste Interface-Priorität, bei Gleichstand höchste Router-ID. Die Wahl ist nicht präemptiv: Ein später startender Router mit besserer Priorität verdrängt den DR nicht. Priorität 0 heißt nie DR oder BDR."}, {"d": 3, "q": "Welche Multicast-Adresse verwenden OSPF-Router, um DR und BDR zu erreichen?", "o": ["224.0.0.6", "224.0.0.5", "224.0.0.9", "224.0.0.10"], "c": [0], "e": "224.0.0.6. An diese Adresse schicken DROTHER ihre Updates für DR und BDR. 224.0.0.5 erreicht alle OSPF-Router. Zum Vergleich: RIP 224.0.0.9, EIGRP 224.0.0.10."}, {"d": 3, "q": "Welcher LSA-Typ beschreibt ein Netz mit DR (Broadcast-Segment) und wird vom DR erzeugt?", "o": ["Typ 2", "Typ 1", "Typ 3", "Typ 5"], "c": [0], "e": "Typ 2 (Network-LSA). Nur der DR erzeugt ihn und listet darin alle Router am Segment. Übersicht: Typ 1 Router, Typ 3 Summary vom ABR, Typ 4 ASBR-Summary, Typ 5 External, Typ 7 NSSA-External."}, {"d": 3, "q": "Welche Area sperrt externe Routen (Typ 5), erhält aber weiter die Routen anderer Areas (Typ 3) und eine Default-Route?", "o": ["Stub-Area", "Backbone-Area", "NSSA ohne no-summary", "Standard-Area"], "c": [0], "e": "Die Stub Area. Sie sperrt Typ 4 und 5 und bekommt stattdessen eine Default-Route vom ABR. Totally Stubby sperrt zusätzlich Typ 3, bis auf die Default-Route."}, {"d": 3, "q": "Welche Area erlaubt einen ASBR und blockiert dennoch Typ-5-LSAs aus anderen Teilen?", "o": ["NSSA (Typ 7 wird am ABR zu Typ 5 übersetzt)", "Stub-Area", "Totally Stubby Area", "Area 0"], "c": [0], "e": "NSSA. Ein ASBR in der NSSA speist externe Routen als Typ 7 ein. Der ABR übersetzt sie in Typ 5 für die übrigen Areas. Typ-5-LSAs von außen kommen trotzdem nicht in die NSSA."}, {"d": 3, "q": "Welche Voraussetzung gilt für einen Virtual Link?", "o": ["Er verbindet eine nicht angeschlossene Area über eine Transit-Area mit dem Backbone.", "Er verbindet zwei Area-0-Segmente beliebig.", "Er benötigt MPLS.", "Er funktioniert durch eine Stub-Area."], "c": [0], "e": "Ein Virtual Link verbindet eine Area, die keinen direkten Kontakt zu Area 0 hat, über eine Transit-Area mit dem Backbone. Er ist eine Notlösung und funktioniert nicht durch Stub-Areas."}, {"d": 3, "q": "Welche Formel nutzt OSPF für die Kosten (Standard)?", "o": ["Referenzbandbreite 100 Mbit/s geteilt durch Interface-Bandbreite", "10^7 geteilt durch Bandbreite in kbit/s plus Delay", "Hop-Anzahl", "Konstanter Wert 1 pro Interface"], "c": [0], "e": "Referenzbandbreite 100 Mbit/s geteilt durch die Interface-Bandbreite. Falle: 100 Mbit/s, 1 Gbit/s und 10 Gbit/s haben damit alle die Kosten 1. Abhilfe: <code>auto-cost reference-bandwidth</code> auf allen Routern gleich erhöhen."}, {"d": 3, "q": "Welche Maßnahme verhindert OSPF-Hellos auf einem Interface, hält das Netz aber in der Datenbank?", "o": ["passive-interface", "no ip ospf", "ip ospf cost 65535", "network entfernen"], "c": [0], "e": "<code>passive-interface</code>. Das Interface sendet keine Hellos und bildet keine Nachbarn, sein Netz wird aber weiter angekündigt. <code>no ip ospf</code> oder das Entfernen des network-Statements würde das Netz aus OSPF nehmen."}, {"d": 3, "q": "Welche Authentifizierung ist bei OSPFv2 ab IOS-XE üblich und sicherer als Klartext?", "o": ["HMAC-SHA (Key Chain / Authentication Trailer)", "Type 0 Null-Authentifizierung", "Type 1 Klartextpasswort", "SNMPv1"], "c": [0], "e": "HMAC-SHA über eine Key Chain. Sie ist der aktuelle Stand. MD5 (Typ 2) ist älter, Klartext (Typ 1) schützt praktisch nicht."}, {"d": 3, "q": "Welche OSPFv3-Eigenschaft unterscheidet es von OSPFv2?", "o": ["Es läuft pro Link, nutzt Link-Local-Adressen und Router-ID bleibt 32 Bit.", "Es nutzt 128-Bit-Router-IDs.", "Es benötigt kein Router-ID.", "Es nutzt IP-Protokoll 88."], "c": [0], "e": "OSPFv3 läuft pro Link, spricht mit Nachbarn über Link-Local-Adressen und behält eine 32-Bit-Router-ID. Es nutzt wie OSPFv2 IP-Protokoll 89. 88 ist EIGRP."}, {"d": 3, "q": "Welche Metrik nutzt EIGRP standardmäßig (K-Werte)?", "o": ["Bandbreite und Delay (K1 und K3)", "Hop-Anzahl", "Last und Zuverlässigkeit", "Kosten wie OSPF"], "c": [0], "e": "Bandbreite und Delay. Standard ist K1 = K3 = 1, die übrigen K-Werte sind 0. Nachbarn müssen identische K-Werte haben, sonst gibt es keine Nachbarschaft."}, {"d": 3, "q": "Was beschreibt der Feasible Successor in EIGRP?", "o": ["Ein Backup-Pfad, dessen Reported Distance kleiner als die Feasible Distance des Successors ist.", "Der Pfad mit der niedrigsten Hop-Anzahl.", "Ein Pfad ohne Schleifenschutz.", "Der aktive Pfad."], "c": [0], "e": "Ein Ersatzweg, dessen Reported Distance kleiner ist als die Feasible Distance des Successors. Dann ist der Nachbar näher am Ziel als man selbst, sein Weg kann also nicht über einen zurückführen. Fällt der Successor aus, springt der Feasible Successor ohne Query sofort ein."}, {"d": 3, "q": "Warum kann eine Route in EIGRP „stuck in active“ geraten?", "o": ["Auf Queries kommt keine Antwort von allen Nachbarn rechtzeitig zurück.", "Weil die Hello-Zeit zu kurz ist.", "Weil ein Feasible Successor existiert.", "Weil Auto-Summary an ist."], "c": [0], "e": "Weil auf eine Query nicht alle Nachbarn rechtzeitig antworten. Ohne Feasible Successor fragt EIGRP seine Nachbarn. Bleibt eine Antwort aus, wird die Route „stuck in active“, und die Nachbarschaft wird zurückgesetzt. Stub-Router und Summaries begrenzen, wie weit Queries laufen."}, {"d": 3, "q": "Welcher EIGRP-Befehl begrenzt Queries zu einem Remote-Router, der nur Zielnetze lokal bedient?", "o": ["eigrp stub connected summary", "passive-interface default", "auto-summary", "variance 2"], "c": [0], "e": "<code>eigrp stub connected summary</code>. Ein Stub-Router bekommt keine Queries mehr. Er kündigt nur seine direkt verbundenen Netze und Summaries an."}, {"d": 3, "q": "Wie verteilt EIGRP Last auf ungleiche Pfade?", "o": ["Mit variance werden Feasible Successors in die Tabelle aufgenommen, wenn Metrik < Variance × FD.", "Mit maximum-paths allein über beliebige Metrik.", "Gar nicht.", "Mit metric weights."], "c": [0], "e": "Mit <code>variance</code>. Ein zusätzlicher Weg wird genutzt, wenn seine Metrik kleiner ist als Variance mal beste Metrik und er Feasible Successor ist. Ohne Feasibility Condition kommt er nicht in Frage."}, {"d": 3, "q": "Wie sieht die Konfigurationsstruktur von EIGRP im Named Mode aus?", "o": ["router eigrp NAME mit address-family ipv4 unicast autonomous-system N", "router eigrp N mit network 0.0.0.0", "ip eigrp N", "router eigrp N neighbor"], "c": [0], "e": "<code>router eigrp NAME</code> mit <code>address-family ipv4 unicast autonomous-system N</code>. Der Named Mode fasst IPv4, IPv6 sowie Interface- und Topologie-Einstellungen in einer Struktur zusammen."}, {"d": 3, "q": "Welcher Wert ist die Standard-Administrative-Distance von eBGP?", "o": ["20", "200", "90", "110"], "c": [0], "e": "20. Übersicht: eBGP 20, EIGRP intern 90, OSPF 110, EIGRP extern 170, iBGP 200."}, {"d": 3, "q": "Warum baut man iBGP-Sessions meist zwischen Loopbacks mit <code>update-source</code> auf?", "o": ["Der Peering-Pfad bleibt bei Ausfall eines Links bestehen.", "iBGP funktioniert nur über Loopbacks.", "Loopbacks sind für TCP 179 nötig.", "Es ist zwingend für eBGP."], "c": [0], "e": "Damit die Session einen Linkausfall übersteht. Die Loopback ist über jeden verbleibenden Weg im IGP erreichbar. Voraussetzung: Das IGP kennt die Loopbacks."}, {"d": 3, "q": "Warum muss bei eBGP-Peering über Loopbacks `ebgp-multihop` konfiguriert werden?", "o": ["Standardmäßig hat eBGP TTL 1 und akzeptiert keine Pakete über mehr als einen Hop.", "eBGP unterstützt keine Loopbacks.", "Weil AD 200 ist.", "Weil Port 179 gesperrt ist."], "c": [0], "e": "Weil eBGP standardmäßig mit TTL 1 sendet und nur direkt verbundene Nachbarn akzeptiert. Eine Loopback ist einen Hop weiter weg. <code>ebgp-multihop 2</code> erhöht die TTL."}, {"d": 3, "q": "Welche Regel gilt für iBGP-Split-Horizon?", "o": ["Eine von einem iBGP-Peer gelernte Route wird nicht an andere iBGP-Peers weitergegeben.", "Alle Routen werden an alle Peers weitergegeben.", "eBGP-Routen werden nicht an iBGP-Peers gesendet.", "iBGP kennt keine Regel."], "c": [0], "e": "Eine Route, die ein Router von einem iBGP-Nachbarn gelernt hat, gibt er nicht an andere iBGP-Nachbarn weiter. So entstehen keine Schleifen innerhalb des AS. Lösung für die Verteilung: Full Mesh, Route Reflector oder Confederation."}, {"d": 3, "q": "Welche Reihenfolge entspricht dem BGP-Best-Path-Anfang?", "o": ["Weight → Local Preference → lokal erzeugt → AS-Path-Länge → Origin → MED", "AS-Path → Weight → MED → Origin", "MED → Local Preference → Weight", "Origin → AS-Path → Weight"], "c": [0], "e": "Weight → Local Preference → lokal erzeugt → AS_PATH-Länge → Origin → MED. Danach folgen eBGP vor iBGP, IGP-Kosten zum Next-Hop, ältester eBGP-Pfad und Router-ID."}, {"d": 3, "q": "Welches Attribut beeinflusst, wie ein benachbartes AS Verkehr zu deinem AS sendet (eingehend)?", "o": ["AS-Path-Prepending oder MED", "Weight", "Local Preference", "Origin"], "c": [0], "e": "AS-Path-Prepending oder MED. Damit veränderst du deine eigenen Ankündigungen, und andere AS wählen ihren Weg zu dir danach. Weight und Local Preference steuern dagegen nur, welchen Ausgang dein eigenes AS nimmt."}, {"d": 3, "q": "Welches Attribut ist Cisco-proprietär und nur auf dem lokalen Router gültig?", "o": ["Weight", "Local Preference", "MED", "AS-Path"], "c": [0], "e": "Weight. Es gilt nur auf dem eigenen Router und wird nie weitergegeben. Der höchste Wert gewinnt, selbst erzeugte Routen haben standardmäßig 32768."}, {"d": 3, "q": "Welche Aufgabe hat ein Route Reflector?", "o": ["Er reflektiert iBGP-Routen an Clients und löst damit das Full-Mesh-Problem.", "Er filtert alle eBGP-Routen.", "Er ersetzt IGP.", "Er hält nur Default-Routen."], "c": [0], "e": "Er gibt iBGP-Routen an seine Clients weiter und hebt damit die iBGP-Split-Horizon-Regel für sie auf. So braucht nicht jeder iBGP-Router eine Session zu jedem anderen. ORIGINATOR_ID und CLUSTER_LIST verhindern Schleifen."}, {"d": 3, "q": "Welche BGP-Community verhindert, dass eine Route an eBGP-Peers weitergegeben wird?", "o": ["no-export", "no-advertise", "internet", "route-target"], "c": [0], "e": "no-export. Die Route bleibt im eigenen AS und geht nicht an eBGP-Nachbarn. no-advertise ist strenger: Die Route geht an gar keinen Nachbarn."}, {"d": 3, "q": "Welche Zustände hat eine BGP-Sitzung bis zur Verbindung?", "o": ["Idle, Connect, Active, OpenSent, OpenConfirm, Established", "Down, Init, Full", "Listen, Learn, Forward", "Idle, Active, Passive"], "c": [0], "e": "Idle, Connect, Active, OpenSent, OpenConfirm, Established. Falle: Steht eine Session dauerhaft auf Active, kommt die TCP-Verbindung nicht zustande, z. B. wegen fehlender Route, ACL oder falscher Adresse."}, {"d": 3, "q": "Welche Art der Routen-Aktualisierung nutzt BGP?", "o": ["Inkrementelle Updates über TCP 179", "Periodische Vollupdates über UDP", "Multicast 224.0.0.5", "Flooding von LSAs"], "c": [0], "e": "Inkrementelle Updates über TCP 179. Nach dem ersten Austausch schickt BGP nur noch Änderungen. Periodische Vollupdates gibt es nicht."}, {"d": 3, "q": "OSPF und EIGRP werden an zwei Routern gegenseitig redistribuiert. Was verhindert Schleifen und Umwege?", "o": ["Route-Tags und Filter mit Distribute-Lists/Route-Maps an den Redistributionspunkten", "Höhere Hello-Zeiten", "Entfernen von passive-interface", "Auto-Summary"], "c": [0], "e": "Route-Tags mit Filtern an jedem Redistributionspunkt. Jeder Router markiert, was er einspeist, und filtert Routen mit dieser Markierung auf dem Rückweg. So kommt keine Route in ihr Ursprungsprotokoll zurück."}, {"d": 3, "q": "Was fehlt, damit redistribute ospf 1 in EIGRP funktioniert?", "o": ["Eine Metrik (z. B. redistribute ospf 1 metric 10000 100 255 1 1500)", "subnets-Parameter", "Eine ACL", "Nichts, EIGRP nimmt die OSPF-Metrik"], "c": [0], "e": "Eine Seed-Metrik, z. B. <code>redistribute ospf 1 metric 10000 100 255 1 1500</code> oder <code>default-metric</code>. Ohne Metrik übernimmt EIGRP keine Fremdrouten. Umgekehrt braucht OSPF auf älteren IOS-Versionen den Parameter <code>subnets</code>."}, {"d": 3, "q": "Welche Voraussetzung gilt für Policy-Based Routing mit set ip next-hop?", "o": ["Der Next-Hop muss direkt erreichbar (verbunden) sein, die route-map wird auf dem Eingangs-Interface angewendet.", "Die route-map hängt am Ausgangs-Interface.", "Der Next-Hop kann beliebig entfernt sein.", "PBR ersetzt das IGP."], "c": [0], "e": "Der Next-Hop muss direkt verbunden sein, und die Route-Map hängt am Eingangsinterface. PBR entscheidet beim Eintreffen des Pakets. Für Verkehr, den der Router selbst erzeugt, braucht es <code>ip local policy</code>."}, {"d": 3, "q": "Welche Übersetzung nutzt NAT-Overload (PAT)?", "o": ["Viele Inside-Local-Adressen auf eine Inside-Global-Adresse mit unterschiedlichen Ports", "1:1-Übersetzung ohne Ports", "Nur Outside-Adressen", "Übersetzung ohne ACL"], "c": [0], "e": "Viele interne Adressen werden auf eine öffentliche Adresse übersetzt und über den Quellport unterschieden. <code>show ip nat translations</code> zeigt deshalb Paare aus Adresse und Port."}, {"d": 3, "q": "Wie heißt die Adresse eines internen Hosts, so wie das Internet sie sieht?", "o": ["Inside Global", "Inside Local", "Outside Local", "Outside Global"], "c": [0], "e": "Inside Global. Inside heißt: der Host gehört zu dir. Global heißt: so sieht man ihn von außen. Inside Local ist seine interne Adresse."}, {"d": 3, "q": "Welche Aussage über Multicast-IGMP stimmt?", "o": ["Hosts melden Gruppenmitgliedschaft per IGMP an den lokalen Router.", "IGMP verbindet Router untereinander.", "IGMP ersetzt PIM.", "IGMP gilt nur für IPv6."], "c": [0], "e": "Hosts melden per IGMP ihrem lokalen Router, welche Gruppen sie empfangen wollen. Zwischen Routern läuft PIM. IGMP Snooping auf Switches sorgt dafür, dass Multicast nur an die Ports mit Empfängern geht."}, {"d": 3, "q": "Welche Rolle hat der Rendezvous Point (RP) in PIM Sparse Mode?", "o": ["Treffpunkt für Quellen und Empfänger im Shared Tree (*,G)", "Er erzeugt Multicast-Verkehr.", "Er ist der IGMP-Querier.", "Er filtert Unicast."], "c": [0], "e": "Er ist der Treffpunkt von Quellen und Empfängern im Shared Tree (*,G). Empfänger melden sich beim RP an, Quellen registrieren sich dort. Danach kann der Empfänger auf den direkten Baum (S,G) wechseln."}, {"d": 3, "q": "Wofür wird der RPF-Check in Multicast genutzt?", "o": ["Er prüft, ob ein Multicast-Paket auf dem Interface ankommt, das laut Unicast-Tabelle zur Quelle führt.", "Er wählt den RP.", "Er filtert nach Port.", "Er prüft TTL."], "c": [0], "e": "Er prüft, ob ein Multicast-Paket auf dem Interface ankommt, über das der Router per Unicast die Quelle erreichen würde. Wenn nicht, wird es verworfen. Das verhindert Schleifen und doppelte Pakete."}, {"d": 3, "q": "Welche Methode verteilt die RP-Information dynamisch und ist ein offener Standard?", "o": ["BSR (Bootstrap Router)", "Auto-RP", "Static-RP", "MSDP"], "c": [0], "e": "BSR (Bootstrap Router), Teil von PIMv2. Auto-RP ist Cisco-proprietär (224.0.1.39/40). Statisch heißt: auf jedem Router von Hand."}, {"d": 3, "q": "Welcher Multicast-Bereich ist für den lokalen Link reserviert und wird von Routern nicht weitergeleitet?", "o": ["224.0.0.0/24", "239.0.0.0/8", "232.0.0.0/8", "224.0.1.0/24"], "c": [0], "e": "224.0.0.0/24. Pakete dorthin bleiben im lokalen Segment, z. B. OSPF- und EIGRP-Hellos. 239.0.0.0/8 ist privat für die eigene Organisation, 232.0.0.0/8 ist SSM."}, {"d": 3, "q": "Welche Eigenschaft hat ein Layer-3-EtherChannel?", "o": ["Die IP-Adresse liegt auf dem Port-Channel-Interface, die Mitglieder sind no switchport.", "Die IP liegt auf jedem Mitglied.", "Er benötigt VLANs.", "Er funktioniert nur mit LACP."], "c": [0], "e": "Die IP-Adresse liegt am Port-Channel-Interface, die Mitglieder sind <code>no switchport</code> ohne eigene Adresse. Er funktioniert mit LACP, PAgP oder statisch."}, {"d": 3, "q": "Welcher Befehl zeigt den Hash-Algorithmus der Lastverteilung im EtherChannel?", "o": ["show etherchannel load-balance", "show etherchannel summary", "show lacp neighbor", "show interfaces port-channel"], "c": [0], "e": "<code>show etherchannel load-balance</code>. EtherChannel verteilt nach einem Hash, z. B. aus Quell- und Ziel-IP, nicht paketweise. Ein Flow bleibt deshalb immer auf einem Link."}, {"d": 4, "q": "Welche Syslog-Schweregrade sind niedriger (also kritischer) als Warning?", "o": ["Emergency, Alert, Critical, Error", "Notice, Informational, Debug", "Nur Error", "Alert und Warning"], "c": [0], "e": "Emergency, Alert, Critical, Error (Level 0–3). Je kleiner die Zahl, desto schwerer. Warning ist 4, danach folgen Notice 5, Informational 6, Debug 7."}, {"d": 4, "q": "Welcher Befehl begrenzt die auf der Konsole angezeigten Meldungen auf Warnungen und schwerere?", "o": ["logging console warnings", "logging buffered warnings", "logging trap warnings", "logging monitor 4 debugging"], "c": [0], "e": "<code>logging console warnings</code>. Jedes Ziel hat seinen eigenen Befehl: console für die Konsole, buffered für den RAM-Puffer, trap für den Syslog-Server, monitor für SSH-Sitzungen."}, {"d": 4, "q": "Welche Wirkung hat service timestamps log datetime msec?", "o": ["Logeinträge erhalten Datum, Uhrzeit und Millisekunden.", "Der Router synchronisiert die Zeit mit NTP.", "Logs werden verschlüsselt.", "Der Router sendet Logs an mehrere Server."], "c": [0], "e": "Jede Log-Meldung bekommt Datum, Uhrzeit und Millisekunden. Die Uhrzeit selbst stellt das nicht, dafür braucht es NTP. Ohne einheitliche Zeit lassen sich Logs mehrerer Geräte nicht vergleichen."}, {"d": 4, "q": "Welche Stratum-Angabe bedeutet in NTP „nicht synchronisiert“?", "o": ["16", "0", "1", "15"], "c": [0], "e": "16. Stratum zählt die Stufen bis zur Referenzuhr: 0 ist die Uhr selbst (z. B. GPS), 1 der direkt angeschlossene Server, jede weitere Stufe zählt eins hoch. 16 ist der vereinbarte Wert für „ungültig“."}, {"d": 4, "q": "Mit welchem Befehl bietet ein Router seine eigene Uhr als NTP-Quelle an, wenn keine externe Zeit verfügbar ist?", "o": ["ntp master", "ntp server", "ntp peer", "ntp broadcast"], "c": [0], "e": "<code>ntp master</code>. Der Router meldet sich dann standardmäßig mit Stratum 8. <code>ntp server</code> macht ihn dagegen zum Client eines anderen Servers."}, {"d": 4, "q": "Womit authentisiert NTP auf Cisco-Geräten seine Zeitquellen?", "o": ["Symmetrische Schlüssel (MD5/SHA) mit ntp authenticate, ntp authentication-key und ntp trusted-key", "TLS-Zertifikate", "Kerberos", "Nur ACL"], "c": [0], "e": "Mit symmetrischen Schlüsseln (MD5 oder SHA): <code>ntp authenticate</code>, <code>ntp authentication-key</code>, <code>ntp trusted-key</code> und <code>ntp server X key N</code>. So akzeptiert der Router nur Zeit von Servern, die den Schlüssel kennen."}, {"d": 4, "q": "Welche Version von SNMP bietet Authentifizierung und Verschlüsselung?", "o": ["SNMPv3 mit authPriv", "SNMPv2c", "SNMPv1", "SNMPv2 ohne Community"], "c": [0], "e": "SNMPv3 mit authPriv. v1 und v2c schicken die Community im Klartext. v3 kennt drei Stufen: noAuthNoPriv, authNoPriv (nur Anmeldung) und authPriv (Anmeldung und Verschlüsselung)."}, {"d": 4, "q": "Welche SNMP-Nachricht sendet ein Agent ohne Abfrage an den Manager und erwartet eine Bestätigung?", "o": ["Inform", "Trap", "Get", "Set"], "c": [0], "e": "Inform. Ein Trap wird ohne Bestätigung gesendet und kann verloren gehen. Ein Inform bestätigt der Manager, sonst wird er wiederholt. Get und Set kommen vom Manager, nicht vom Agenten."}, {"d": 4, "q": "Welche beiden UDP-Ports nutzt SNMP? (Wähle zwei)", "o": ["161", "162", "514", "123"], "c": [0, 1], "e": "161 und 162. Auf 161 fragt der Manager den Agenten ab, auf 162 schickt der Agent Traps und Informs an den Manager. 514 ist Syslog, 123 NTP."}, {"d": 4, "q": "Welches Protokoll exportiert Flow-Daten mit Template-basiertem, erweiterbarem Format (IETF-Standard)?", "o": ["IPFIX (NetFlow v10)", "NetFlow v5", "sFlow", "SPAN"], "c": [0], "e": "IPFIX, auch NetFlow v10 genannt. Es ist der IETF-Standard auf Basis von NetFlow v9 und arbeitet wie v9 mit Templates. v5 hat ein festes Format und kann nur IPv4."}, {"d": 4, "q": "Welche Komponenten braucht Flexible NetFlow? (Wähle drei)", "o": ["Flow Record", "Flow Exporter", "Flow Monitor", "Flow Mirror", "Flow Policy-Map"], "c": [0, 1, 2], "e": "Flow Record, Flow Exporter und Flow Monitor. Der Record legt fest, was erfasst wird, der Exporter, wohin gesendet wird. Der Monitor verbindet beides und hängt am Interface."}, {"d": 4, "q": "Welche Aussage über Local SPAN stimmt?", "o": ["Quell- und Zielport liegen auf demselben Switch, der Zielport verwirft normalen Verkehr.", "Der Zielport kann beliebig als Trunk weiterleiten.", "Das Ziel liegt auf einem anderen Switch.", "SPAN verschlüsselt gespiegelte Daten."], "c": [0], "e": "Quelle und Ziel liegen auf demselben Switch, und der Zielport leitet keinen normalen Verkehr weiter. Er gibt nur die Kopien aus. Über mehrere Switches spiegelt RSPAN (per VLAN), über Router ERSPAN (per GRE)."}, {"d": 4, "q": "Welche SPAN-Variante transportiert gespiegelten Verkehr über Layer-3-Netze?", "o": ["ERSPAN", "RSPAN", "Local SPAN", "VSPAN"], "c": [0], "e": "ERSPAN. Es verpackt die Kopien in GRE und kann sie dadurch über geroutete Netze schicken. RSPAN bleibt auf Layer 2 und braucht ein eigenes VLAN über die Trunks."}, {"d": 4, "q": "Was misst IP SLA mit icmp-echo?", "o": ["Erreichbarkeit und Antwortzeit zu einem Ziel", "Bandbreitenauslastung", "MTU", "Anzahl der Hops"], "c": [0], "e": "Ob das Ziel antwortet und wie lange die Antwort dauert. IP SLA misst aktiv mit eigenen Testpaketen. Neben ICMP gibt es auch UDP-Jitter, TCP-Connect und HTTP."}, {"d": 4, "q": "Wie lässt sich eine statische Route anhand von IP SLA bedingen?", "o": ["track 1 ip sla 10 reachability und ip route ... track 1", "ip route ... sla 10", "ip sla enable route", "route-map set sla"], "c": [0], "e": "Mit <code>track 1 ip sla 10 reachability</code> und <code>ip route … track 1</code>. Antwortet das Ziel nicht mehr, geht Track 1 auf down, und die Route verschwindet aus der Routing-Tabelle."}, {"d": 4, "q": "Was braucht eine IP-SLA-Messung vom Typ udp-jitter auf dem Zielgerät?", "o": ["Einen IP SLA Responder", "Nichts, UDP-Jitter funktioniert gegen jedes Gerät", "Einen NTP-Authentifizierungsschlüssel", "Eine GRE-Verbindung"], "c": [0], "e": "Einen IP SLA Responder (<code>ip sla responder</code>). Er setzt eigene Zeitstempel und rechnet seine Bearbeitungszeit heraus. Erst damit lassen sich Jitter und Laufzeit pro Richtung messen."}, {"d": 4, "q": "Welche Funktion bietet Cisco Catalyst Center Assurance?", "o": ["Gesundheits- und Problemübersicht mit Ursachenanalyse und Telemetrie von Geräten und Clients", "Nur Konfigurationsvorlagen", "Verschlüsselung des Verkehrs", "Router-IDs vergeben"], "c": [0], "e": "Assurance zeigt den Zustand von Netz, Geräten und Clients und hilft bei der Ursachenanalyse. Dazu wertet es Telemetrie, NetFlow, SNMP und Syslog aus und schlägt Maßnahmen vor."}, {"d": 4, "q": "Mit welchen Protokollen arbeitet Model-Driven Telemetry?", "o": ["gRPC/gNMI mit YANG-Modellen", "SNMPv1", "Syslog", "NetFlow v5"], "c": [0], "e": "Mit gRPC bzw. gNMI und YANG-Modellen. Das Gerät schickt die Daten selbst, regelmäßig oder bei Änderung. SNMP muss dagegen abgefragt werden."}, {"d": 4, "q": "Welche Information zeigt show ip sla statistics?", "o": ["Ergebnisse der letzten Messungen (Latenz, Jitter, Verlust, Erfolg/Fehler)", "Die Konfiguration der Probes", "Die Routingtabelle", "MAC-Adressen"], "c": [0], "e": "Die Ergebnisse der letzten Messungen: Antwortzeit, Erfolg oder Fehler, bei Jitter-Messungen auch Jitter und Verlust. Die Einstellungen zeigt <code>show ip sla configuration</code>."}, {"d": 5, "q": "Mit welchem Befehl wirkt eine ACL auf den Zugriff über die VTY-Lines?", "o": ["access-class 10 in unter line vty 0 15", "ip access-group 10 in unter line vty", "access-list 10 vty", "ip access-class 10"], "c": [0], "e": "<code>access-class 10 in</code> unter <code>line vty 0 15</code>. Falle: <code>ip access-group</code> gibt es nur an Interfaces, nicht an Lines."}, {"d": 5, "q": "Welche ACL-Aussage ist richtig?", "o": ["Standard-ACLs filtern nur nach Quelladresse und sollten nahe am Ziel platziert werden.", "Erweiterte ACLs filtern nur nach Quelle.", "Standard-ACLs sollten nahe an der Quelle stehen.", "ACLs filtern nur ausgehend."], "c": [0], "e": "Standard-ACLs prüfen nur die Quelle und gehören nah ans Ziel. Nah an der Quelle würden sie den Absender für alle Ziele sperren. Extended-ACLs setzt man dagegen nah an die Quelle, weil sie das Ziel mitprüfen."}, {"d": 5, "q": "Welcher Befehl fügt eine Zeile in eine benannte ACL an Position 15 ein?", "o": ["15 permit tcp any any eq 443 im ACL-Konfigurationsmodus", "ip access-list insert 15", "access-list 15 add", "permit 443 after 15"], "c": [0], "e": "Im Konfigurationsmodus der benannten ACL die Zeile mit Sequenznummer eingeben: <code>15 permit tcp any any eq 443</code>. <code>no 15</code> löscht sie wieder, <code>ip access-list resequence</code> nummeriert neu."}, {"d": 5, "q": "Welche Wirkung hat das log-Schlüsselwort in einer ACL-Zeile?", "o": ["Treffer werden protokolliert (Syslog)", "Die Zeile wird bevorzugt ausgewertet", "Die Zeile wird verschlüsselt", "Der Verkehr wird gespiegelt"], "c": [0], "e": "Jeder Treffer wird ins Syslog geschrieben. Das Logging ist gedrosselt und kostet trotzdem CPU, deshalb nur gezielt einsetzen."}, {"d": 5, "q": "Wogegen schützt Control Plane Policing (CoPP)?", "o": ["Gegen Überlastung der Router-CPU durch Verkehr an die Control Plane", "Gegen Pakete, die den Router durchqueren", "Gegen ARP-Spoofing", "Gegen DHCP-Spoofing"], "c": [0], "e": "Gegen Überlastung der CPU durch Verkehr, der an den Router selbst gerichtet ist. CoPP ist eine Policing-Policy unter <code>control-plane</code>. Verkehr, der nur durch den Router hindurchgeht, erfasst sie nicht."}, {"d": 5, "q": "Welcher Faktor passt bei Mehrfaktor-Authentisierung zu „etwas, das man ist“?", "o": ["Fingerabdruck", "Passwort", "Smartcard", "PIN"], "c": [0], "e": "Ein Fingerabdruck, also ein biometrisches Merkmal. Die drei Faktoren: Wissen (Passwort, PIN), Besitz (Smartcard, Token), Sein (Biometrie)."}, {"d": 5, "q": "Welches AAA-Protokoll verschlüsselt den gesamten Payload und trennt Authentifizierung, Autorisierung und Accounting?", "o": ["TACACS+", "RADIUS", "LDAP", "Kerberos"], "c": [0], "e": "TACACS+. Es verschlüsselt das ganze Paket, nutzt TCP 49 und trennt die drei A. Dadurch kann es jeden Befehl einzeln autorisieren. RADIUS verschlüsselt nur das Passwort."}, {"d": 5, "q": "Welche beiden Aussagen zu RADIUS sind richtig? (Wähle zwei)", "o": ["Authentifizierung und Autorisierung werden kombiniert.", "Nur das Passwort im Paket ist verschlüsselt.", "Es nutzt TCP 49.", "Es erlaubt keine Accounting-Nachrichten."], "c": [0, 1], "e": "RADIUS fasst Authentisierung und Autorisierung in einer Antwort zusammen und verschlüsselt nur das Passwort. Es nutzt UDP 1812/1813 und kennt Accounting. TCP 49 ist TACACS+."}, {"d": 5, "q": "Welcher Befehl aktiviert AAA auf einem Cisco-Gerät als ersten Schritt?", "o": ["aaa new-model", "aaa enable", "aaa authentication on", "radius-server enable"], "c": [0], "e": "<code>aaa new-model</code>. Danach folgen Server-Gruppen, Methodenlisten und deren Bindung an die Lines. Vorher einen lokalen Benutzer anlegen, sonst droht Aussperren."}, {"d": 5, "q": "Welche Methodenliste verhindert, dass man sich bei Ausfall des TACACS+-Servers aussperrt?", "o": ["aaa authentication login default group tacacs+ local", "aaa authentication login default group tacacs+", "aaa authorization default none", "aaa accounting default none"], "c": [0], "e": "<code>aaa authentication login default group tacacs+ local</code>. Antwortet kein Server, prüft der Router lokal. Falle: Lehnt der Server ab, greift local nicht. Fallback gibt es nur bei Schweigen, nicht bei Nein."}, {"d": 5, "q": "Welche Rollen hat 802.1X? (Wähle drei)", "o": ["Supplicant", "Authenticator", "Authentication Server", "Proxy", "Reflector"], "c": [0, 1, 2], "e": "Supplicant, Authenticator und Authentication Server. Der Supplicant ist das Endgerät, der Authenticator der Switch oder AP, der Authentication Server meist ISE per RADIUS."}, {"d": 5, "q": "Welche Methode erlaubt 802.1X für Geräte ohne Supplicant (z. B. Drucker)?", "o": ["MAB (MAC Authentication Bypass)", "Port Security sticky", "WebAuth auf dem Server", "PortFast"], "c": [0], "e": "MAB (MAC Authentication Bypass). Der Switch meldet die MAC-Adresse des Geräts als Identität an RADIUS. Schwäche: MAC-Adressen lassen sich fälschen."}, {"d": 5, "q": "Welche Aufgabe hat Web Authentication (WebAuth)?", "o": ["Authentifizierung per Webportal für Clients ohne 802.1X-Supplicant, typisch als Gastzugang", "Verschlüsselung der Daten", "Spanning Tree Absicherung", "Router-Authentifizierung"], "c": [0], "e": "Anmeldung über eine Webseite für Geräte ohne 802.1X, typisch für Gäste. Der Browser wird auf das Portal umgeleitet. Oft ist WebAuth die letzte Stufe nach 802.1X und MAB."}, {"d": 5, "q": "Welches Protokoll trägt EAP-Nachrichten im Layer 2 zwischen Supplicant und Authenticator?", "o": ["EAPoL", "RADIUS", "TACACS+", "CDP"], "c": [0], "e": "EAPoL (EAP over LAN). Es läuft nur zwischen Endgerät und Switch. Der Switch packt die EAP-Nachrichten dann in RADIUS und schickt sie an den Server."}, {"d": 5, "q": "Welche Methode in Cisco TrustSec bildet die Grundlage für rollenbasierte Policy?", "o": ["Security Group Tag (SGT)", "VLAN-ID", "IP-Adresse", "MAC-Adresse"], "c": [0], "e": "Die Security Group Tag (SGT). Jedes Gerät gehört über seine SGT zu einer Gruppe, und SGACLs regeln, welche Gruppen miteinander reden dürfen, unabhängig von IP-Adresse und VLAN."}, {"d": 5, "q": "Wo wird eine SGACL angewendet?", "o": ["Am Ziel-Gerät (Enforcement Point) anhand von Quell-SGT und Ziel-SGT", "Auf dem RADIUS-Server", "Nur auf der Firewall", "Am Client"], "c": [0], "e": "Am Durchsetzungspunkt vor dem Ziel, meist am Switch, an dem das Zielgerät hängt. Dort kennt man beide Gruppen: die Quell-SGT aus dem Paket und die Ziel-SGT vom lokalen Gerät."}, {"d": 5, "q": "Welche Technologie verschlüsselt Layer-2-Verkehr Hop-by-Hop zwischen Switches?", "o": ["MACsec (802.1AE)", "IPsec", "TLS", "GRE"], "c": [0], "e": "MACsec (IEEE 802.1AE). Es verschlüsselt jeden Ethernet-Frame zwischen zwei direkt verbundenen Geräten. Die Schlüssel handelt MKA aus."}, {"d": 5, "q": "Was ist ein Merkmal von DHCP Snooping?", "o": ["Ports werden als trusted oder untrusted markiert; DHCP-Server-Antworten auf untrusted Ports werden verworfen.", "Es filtert ARP-Pakete.", "Es authentifiziert Clients.", "Es verschlüsselt DHCP."], "c": [0], "e": "Ports werden als trusted oder untrusted markiert, und DHCP-Server-Antworten auf untrusted Ports werden verworfen. So kann kein fremder DHCP-Server Adressen verteilen. Nebenbei entsteht eine Binding-Tabelle aus MAC, IP, VLAN und Port."}, {"d": 5, "q": "Welche Funktion nutzt die DHCP-Snooping-Binding-Tabelle, um ARP-Pakete zu prüfen?", "o": ["Dynamic ARP Inspection (DAI)", "Port Security", "BPDU Guard", "Storm Control"], "c": [0], "e": "Dynamic ARP Inspection (DAI). Sie vergleicht jede ARP-Nachricht mit der DHCP-Snooping-Tabelle und verwirft ARP mit falscher Zuordnung von MAC und IP. Das verhindert ARP-Spoofing."}, {"d": 5, "q": "Welche Violation-Aktion bei Port Security erzeugt nur Log und Zähler, lässt den Port aber aktiv?", "o": ["restrict", "protect", "shutdown", "err-disable"], "c": [0], "e": "restrict. Unerlaubte Frames werden verworfen, gezählt und geloggt, der Port bleibt aktiv. protect verwirft nur still. shutdown (Standard) schaltet den Port in err-disabled."}, {"d": 5, "q": "Wie viele sichere MAC-Adressen erlaubt Port Security standardmäßig?", "o": ["1", "2", "8", "Unbegrenzt"], "c": [0], "e": "Eine. Mit <code>switchport port-security maximum N</code> lässt sich das ändern. Mit sticky werden gelernte MACs in die laufende Konfiguration übernommen."}, {"d": 5, "q": "Welche Aufgabe hat IP Source Guard?", "o": ["Er filtert Pakete auf untrusted Ports anhand von IP/MAC aus der Snooping-Binding-Tabelle.", "Er verschlüsselt IP-Pakete.", "Er schützt vor Root-Bridge-Wechsel.", "Er begrenzt Broadcast-Stürme."], "c": [0], "e": "Er filtert auf untrusted Ports alle Pakete, deren Absender nicht zur DHCP-Snooping-Tabelle passt. So kann kein Gerät eine fremde IP-Adresse vortäuschen."}, {"d": 5, "q": "Welche Methode verhindert VLAN-Hopping durch Switch-Spoofing?", "o": ["Ports fest auf switchport mode access setzen und DTP mit switchport nonegotiate bzw. Access-Modus abschalten", "Mehr VLANs anlegen", "Native VLAN auf 1 belassen", "STP deaktivieren"], "c": [0], "e": "Ports fest auf <code>switchport mode access</code> setzen und DTP abschalten. Dann kann ein Endgerät keinen Trunk aushandeln. Ungenutzte Ports zusätzlich in ein leeres VLAN legen und abschalten."}, {"d": 5, "q": "Welche Zeile gehört zu einer Zone-Based-Firewall-Konfiguration?", "o": ["zone-pair security IN-OUT source INSIDE destination OUTSIDE", "ip inspect inside", "ip access-group INSIDE in", "firewall zone INSIDE nat"], "c": [0], "e": "<code>zone-pair security IN-OUT source INSIDE destination OUTSIDE</code>. Eine ZBFW besteht aus Zonen, einer inspect-Policy und einem Zone-Pair mit Richtung. Ohne Zone-Pair ist Verkehr zwischen zwei Zonen verboten."}, {"d": 5, "q": "Welche Aktion einer ZBFW-Policy erlaubt Rückverkehr automatisch (stateful)?", "o": ["inspect", "pass", "drop", "log"], "c": [0], "e": "inspect. Es merkt sich jede Verbindung und lässt die Antworten automatisch zurück. pass erlaubt nur in eine Richtung, der Rückweg braucht eine eigene Regel."}, {"d": 5, "q": "Was zeichnet eine Next-Generation Firewall (NGFW) aus?", "o": ["Anwendungserkennung, Benutzer-Identität, IPS und URL-Filterung zusätzlich zu Port/Protokoll", "Nur Layer-3-Filterung", "Ausschließlich NAT", "Reine VPN-Terminierung"], "c": [0], "e": "Sie erkennt Anwendungen und Benutzer und bringt IPS und URL-Filter mit, zusätzlich zu Port und Protokoll. Beispiel: Cisco Secure Firewall Threat Defense. Eine einfache Firewall sieht nur Adressen und Ports."}, {"d": 5, "q": "Wodurch unterscheidet sich ein IPS von einem IDS?", "o": ["IPS sitzt inline und kann blockieren, IDS beobachtet passiv und alarmiert.", "IPS beobachtet passiv, IDS blockiert.", "Beide sind identisch.", "IDS verschlüsselt Verkehr."], "c": [0], "e": "Ein IPS sitzt im Datenweg und kann blockieren, ein IDS bekommt nur Kopien und kann nur melden. Ein IDS hängt dafür z. B. an einem SPAN-Port oder einem Tap."}, {"d": 5, "q": "Was leisten Secure Boot und der Trust Anchor in Cisco-Hardware?", "o": ["Er prüft beim Start die Integrität der Firmware und des Betriebssystems über eine Hardware-Verankerung.", "Er verschlüsselt Konfigurationsdateien.", "Er ersetzt AAA.", "Er erkennt Malware im Netzwerk."], "c": [0], "e": "Sie prüfen beim Start, ob Firmware und Betriebssystem echt und unverändert sind. Die Prüfung ist in einem Hardware-Chip verankert und lässt sich deshalb nicht per Software umgehen."}, {"d": 5, "q": "Welches Passwortverfahren (Cisco Typ) wird mit enable algorithm-type scrypt secret erzeugt?", "o": ["Typ 9", "Typ 5", "Typ 7", "Typ 0"], "c": [0], "e": "Typ 9 (scrypt). Übersicht: Typ 0 Klartext, Typ 7 umkehrbar (service password-encryption), Typ 5 MD5, Typ 8 PBKDF2-SHA-256, Typ 9 scrypt. Sicher sind nur 8 und 9."}, {"d": 5, "q": "Welche Aussage über SSH auf Cisco-Geräten ist richtig?", "o": ["Zum Aktivieren sind Hostname, Domänenname und ein RSA-Schlüssel nötig.", "SSH funktioniert ohne Schlüssel.", "SSH verwendet UDP 22.", "SSH Version 1 ist empfohlen."], "c": [0], "e": "Hostname, Domänenname und ein RSA-Schlüssel. Ohne Schlüssel startet der SSH-Server nicht. Dann: <code>crypto key generate rsa modulus 2048</code>, <code>ip ssh version 2</code> und <code>transport input ssh</code> an den VTYs. SSH nutzt TCP 22."}, {"d": 5, "q": "Welche Methode schützt Management-Zugriffe zusätzlich nach dem Prinzip der geringsten Rechte?", "o": ["Rollenbasierte CLI-Views oder TACACS+-Kommandoautorisierung", "Gemeinsames enable secret für alle", "Telnet mit ACL", "Auto-Logout nach 24 Stunden"], "c": [0], "e": "Befehlsautorisierung per TACACS+ oder rollenbasierte CLI-Views. Jeder Admin bekommt nur die Befehle, die er braucht. Ein gemeinsames enable secret gibt dagegen allen alles."}, {"d": 5, "q": "Welcher Mechanismus begrenzt Broadcast- und Multicast-Stürme am Switch-Port?", "o": ["Storm Control", "Port Security", "BPDU Guard", "DAI"], "c": [0], "e": "Storm Control. Es vergleicht die Rate von Broadcast-, Multicast- oder Unicast-Verkehr mit einem Schwellwert und blockiert darüber oder sendet einen Trap."}, {"d": 5, "q": "Was ist der Grundsatz von Zero Trust beim Zugriff?", "o": ["Jeder Zugriff wird unabhängig vom Standort anhand von Identität, Gerätezustand und Kontext geprüft.", "Intern wird grundsätzlich vertraut.", "Nur der Perimeter wird geschützt.", "Passwörter werden nie geändert."], "c": [0], "e": "Jeder Zugriff wird geprüft, egal ob er von innen oder außen kommt: nach Identität, Zustand des Geräts und Kontext. Der Standort im Netz allein verschafft kein Vertrauen mehr."}, {"d": 5, "q": "Welche Aussage über Cisco ISE (Identity Services Engine) ist richtig?", "o": ["Sie ist RADIUS/TACACS+-Server mit Profiling, Posture und SGT-Policy.", "Sie ist ein Routing-Protokoll.", "Sie ersetzt Firewalls.", "Sie arbeitet nur mit WLAN."], "c": [0], "e": "ISE ist RADIUS- und TACACS+-Server mit Profiling, Posture und SGT-Policy. Sie vergibt nach der Anmeldung VLAN, dACL oder SGT und prüft, ob das Gerät die Vorgaben erfüllt."}, {"d": 5, "q": "Welche Auswirkung hat eine dACL (downloadable ACL) in ISE-Szenarien?", "o": ["Die ACL wird vom RADIUS-Server pro Sitzung auf den Port heruntergeladen.", "Die ACL wird nur lokal konfiguriert.", "Sie gilt für alle Ports.", "Sie ersetzt VLANs."], "c": [0], "e": "Der Switch bekommt die ACL bei der Anmeldung per RADIUS von ISE und wendet sie nur für diese Sitzung an. So gilt für jedes Gerät seine eigene Regel, ohne lokale ACL auf dem Switch."}, {"d": 6, "q": "Welche Datenstruktur ist in JSON ein Array?", "o": ["[ ]", "{ }", "( )", "< >"], "c": [0], "e": "<code>[ ]</code>. Ein Array ist eine Liste von Werten. Ein Objekt <code>{ }</code> enthält dagegen Paare aus Schlüssel und Wert, die Schlüssel in doppelten Anführungszeichen."}, {"d": 6, "q": "Welcher Wert ist in JSON ungültig?", "o": ["'Name': 'R1' mit einfachen Anführungszeichen", "\"Name\": \"R1\"", "\"Aktiv\": true", "\"Ports\": [1, 2]"], "c": [0], "e": "<code>'Name': 'R1'</code> mit einfachen Anführungszeichen. JSON erlaubt nur doppelte. true, false und null werden klein geschrieben."}, {"d": 6, "q": "Wie lautet der Wert von data[\"interfaces\"][1][\"name\"]?", "x": "data = {\"interfaces\": [{\"name\": \"Gi0/0\"}, {\"name\": \"Gi0/1\"}]}", "o": ["Gi0/1", "Gi0/0", "interfaces", "1"], "c": [0], "e": "Gi0/1. Arrays beginnen bei Index 0, also ist [1] das zweite Element."}, {"d": 6, "q": "Welche HTTP-Methode legt per REST eine neue Ressource an?", "o": ["POST", "GET", "PUT", "DELETE"], "c": [0], "e": "POST. Übersicht: GET liest, POST legt neu an, PUT ersetzt, PATCH ändert teilweise, DELETE löscht."}, {"d": 6, "q": "Welcher HTTP-Statuscode bedeutet „Ressource erfolgreich angelegt“?", "o": ["201", "200", "204", "400"], "c": [0], "e": "201 Created. 200 heißt nur OK, 204 heißt erfolgreich ohne Inhalt."}, {"d": 6, "q": "Welche Statuscodes bedeuten Client-Fehler? (Wähle zwei)", "o": ["401", "404", "302", "503"], "c": [0, 1], "e": "401 und 404. Codes mit 4 am Anfang sind Fehler des Clients, mit 5 Fehler des Servers, mit 3 Umleitungen."}, {"d": 6, "q": "Wofür steht idempotent bei REST?", "o": ["Mehrfache gleiche Anfrage führt zum selben Ergebnis wie eine einzelne.", "Die Anfrage ist verschlüsselt.", "Die Anfrage ändert nie Daten.", "Die Anfrage braucht kein Token."], "c": [0], "e": "Mehrfaches Senden derselben Anfrage hat dasselbe Ergebnis wie einmaliges Senden. PUT und DELETE sind idempotent, POST nicht: Zweimal POST kann zwei Objekte anlegen."}, {"d": 6, "q": "Welches Protokoll nutzt NETCONF als Transport und welcher Port ist Standard?", "o": ["SSH, TCP 830", "HTTP, TCP 80", "TLS, TCP 443", "UDP 161"], "c": [0], "e": "SSH auf TCP 830. NETCONF schickt XML über SSH. RESTCONF nutzt dagegen HTTPS auf 443 mit JSON oder XML."}, {"d": 6, "q": "Welche Aufgabe hat YANG?", "o": ["Datenmodellierungssprache für Konfigurations- und Zustandsdaten", "Transportprotokoll", "Automatisierungswerkzeug mit Agent", "Skriptsprache"], "c": [0], "e": "YANG ist eine Sprache, um Konfigurations- und Zustandsdaten zu beschreiben. Es legt Aufbau, Typen und erlaubte Werte fest. Transportiert werden die Daten von NETCONF, RESTCONF oder gNMI."}, {"d": 6, "q": "Welche NETCONF-Operation holt nur die Konfigurationsdaten?", "o": ["get-config", "get", "edit-config", "copy-config"], "c": [0], "e": "<code>get-config</code>. <code>get</code> liefert Konfiguration und Betriebszustand, <code>edit-config</code> ändert."}, {"d": 6, "q": "Wie unterscheidet sich der candidate-Datastore in NETCONF vom running-Datastore?", "o": ["Änderungen werden erst im candidate vorbereitet und mit commit übernommen.", "candidate ist read-only.", "candidate enthält nur Betriebsdaten.", "candidate ersetzt startup."], "c": [0], "e": "Im Candidate werden Änderungen erst gesammelt und dann mit <code>commit</code> auf einmal in running übernommen. Vor dem commit kann man sie mit <code>discard-changes</code> verwerfen."}, {"d": 6, "q": "Welche Header sind für eine RESTCONF-Anfrage mit JSON typisch?", "o": ["Accept: application/yang-data+json", "Content-Type: text/plain", "Accept: application/xml-rpc", "Authorization: none"], "c": [0], "e": "<code>Accept: application/yang-data+json</code>. Damit fordert der Client die Antwort als JSON an. Für XML: <code>application/yang-data+xml</code>."}, {"d": 6, "q": "Welches Tool arbeitet agentenlos über SSH und nutzt YAML-Playbooks?", "o": ["Ansible", "Puppet", "Chef", "SaltStack mit Minion"], "c": [0], "e": "Ansible. Es arbeitet ohne Agent über SSH und schickt die Konfiguration von einem zentralen Rechner (Push). Puppet und Chef brauchen einen Agenten auf jedem Gerät."}, {"d": 6, "q": "Welcher Satz beschreibt Terraform?", "o": ["Deklaratives Infrastructure-as-Code-Werkzeug mit plan und apply sowie State-Datei", "Imperatives Konfigurationsskript", "Agentenbasiertes Pull-Modell", "Netzwerk-Monitoring-Tool"], "c": [0], "e": "Terraform beschreibt die Infrastruktur deklarativ und merkt sich den Ist-Stand in einer State-Datei. <code>plan</code> zeigt die nötigen Änderungen, <code>apply</code> führt sie aus."}, {"d": 6, "q": "Welche zwei Aussagen zu Ansible sind richtig? (Wähle zwei)", "o": ["Das Inventory beschreibt die Zielgeräte.", "Playbooks sind in YAML geschrieben.", "Ansible benötigt auf jedem Gerät einen Agenten.", "Module werden in Java geschrieben."], "c": [0, 1], "e": "Das Inventory listet die Zielgeräte, und Playbooks werden in YAML geschrieben. Ansible braucht keinen Agenten, und seine Module sind in Python geschrieben."}, {"d": 6, "q": "Welches Python-Konstrukt iteriert über die Schlüssel und Werte eines Dictionarys?", "o": ["for k, v in d.items():", "for k in d.values():", "for i in range(d):", "while d:"], "c": [0], "e": "<code>for k, v in d.items():</code>. <code>items()</code> liefert Schlüssel und Wert als Paar, <code>keys()</code> nur die Schlüssel, <code>values()</code> nur die Werte."}, {"d": 6, "q": "Was gibt print(type(json.loads('{\"a\": 1}'))) aus?", "o": ["<class 'dict'>", "<class 'list'>", "<class 'str'>", "<class 'json'>"], "c": [0], "e": "<code><class 'dict'></code>. <code>json.loads</code> macht aus einem JSON-Text ein Python-Dictionary."}, {"d": 6, "q": "Welche Methode wandelt ein Python-Dictionary in einen JSON-String?", "o": ["json.dumps()", "json.loads()", "json.parse()", "dict.tojson()"], "c": [0], "e": "<code>json.dumps()</code>. Merkhilfe: das s steht für String. dumps macht aus Python-Daten Text, loads aus Text Python-Daten."}, {"d": 6, "q": "Welches Ergebnis hat requests.get(url, verify=False)?", "o": ["Die Zertifikatsprüfung wird deaktiviert (unsicher, nur für Labs)", "Anfrage mit Authentifizierung", "Nur HEAD-Anfrage", "Verschlüsselung wird erzwungen"], "c": [0], "e": "Die Zertifikatsprüfung wird abgeschaltet. Die Verbindung ist zwar verschlüsselt, aber du weißt nicht, ob der Server echt ist. Das ist nur im Labor vertretbar."}, {"d": 6, "q": "Welches Format hat die Antwort bei RESTCONF, wenn Accept application/yang-data+xml gesendet wird?", "o": ["XML", "JSON", "YAML", "CSV"], "c": [0], "e": "XML. Der Accept-Header bestimmt das Format der Antwort."}, {"d": 6, "q": "Welche EEM-Komponente reagiert auf ein Ereignis auf dem Gerät?", "o": ["Applet mit event-Anweisung (z. B. event syslog pattern) und action-Zeilen", "Route-Map", "Class-Map", "Prefix-List"], "c": [0], "e": "Ein EEM-Applet mit einer event-Zeile als Auslöser und action-Zeilen als Reaktion. Beispiel: <code>event syslog pattern</code> löst aus, eine action führt dann CLI-Befehle aus oder schreibt ins Syslog."}, {"d": 6, "q": "Welche Kommunikationsart nutzt Model-Driven-Telemetry im Gegensatz zu SNMP-Polling?", "o": ["Push per Dial-Out oder Dial-In (z. B. gRPC) mit Abonnements", "Periodisches Pull per UDP", "Broadcast", "TFTP-Transfer"], "c": [0], "e": "Push: Das Gerät schickt die Daten selbst an einen Collector, per Abonnement (Subscription), z. B. über gRPC. SNMP muss dagegen regelmäßig abgefragt werden."}, {"d": 6, "q": "Welche Komponente sendet im Cisco Catalyst Center Konfigurationen an Geräte?", "o": ["Southbound-Schnittstelle (CLI, NETCONF, SNMP)", "Northbound-REST-API", "Westbound-API", "vBond"], "c": [0], "e": "Die Southbound-Schnittstelle. Darüber spricht Catalyst Center per CLI, NETCONF oder SNMP mit den Geräten. Northbound ist die REST-API, über die Skripte mit Catalyst Center sprechen."}, {"d": 6, "q": "Welche Eigenschaft ist bei Infrastructure as Code wichtig?", "o": ["Konfiguration liegt versioniert im Repository und ist reproduzierbar.", "Änderungen erfolgen nur manuell per CLI.", "Es gibt keine Tests.", "Alle Geräte werden einzeln gepflegt."], "c": [0], "e": "Die Konfiguration liegt versioniert in einem Repository und lässt sich jederzeit gleich wieder ausrollen. Änderungen werden geprüft und sind nachvollziehbar, statt von Hand auf jedem Gerät."}, {"d": 6, "q": "Welche Git-Operation lädt lokale Commits in ein entferntes Repository?", "o": ["git push", "git pull", "git clone", "git merge"], "c": [0], "e": "<code>git push</code>. pull holt Änderungen und führt sie zusammen, clone kopiert ein Repository, push lädt lokale Commits hoch."}, {"d": 6, "q": "Welche Aufgabe hat eine Webhook-Callback-URL in der Automatisierung?", "o": ["Ein System sendet ereignisgesteuert HTTP-Anfragen an die URL (Push statt Polling)", "Sie ersetzt die REST-API", "Sie verschlüsselt Anmeldedaten", "Sie ist ein Datenbank-Index"], "c": [0], "e": "Ein System schickt bei einem Ereignis selbst eine HTTP-Anfrage an diese URL. Das ist Push statt Polling: Niemand muss ständig nachfragen, ob etwas passiert ist."}, {"d": 6, "q": "Welche zwei Verfahren schützen einen REST-Zugriff? (Wähle zwei)", "o": ["Token (z. B. Bearer/OAuth)", "TLS (HTTPS)", "Klartext-Basic-Auth über HTTP", "Anonymous Access"], "c": [0, 1], "e": "TLS (HTTPS) und Tokens. TLS schützt den Transport, Tokens begrenzen Laufzeit und Rechte. Basic Auth über reines HTTP schickt Benutzer und Passwort praktisch im Klartext."}, {"d": 6, "q": "Was ist bei KI im Netzbetrieb der Unterschied zwischen Predictive und Prescriptive Analytics?", "o": ["Predictive sagt Probleme anhand von Mustern voraus, Prescriptive schlägt Gegenmaßnahmen vor.", "P
