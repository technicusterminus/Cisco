<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENCOR Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"d": 1, "q": "Welche Schicht des dreistufigen Campus-Designs übernimmt typischerweise Policy, Routing-Zusammenfassung und Layer-3-Grenze zu den Access-Switches?", "x": null, "o": ["Distribution", "Access", "Core", "Edge"], "c": [0], "e": "Die Distribution-Schicht aggregiert Access-Switches, terminiert VLANs (L2/L3-Grenze) und setzt Policy, Summarization und Redundanz ein. Der Core transportiert nur schnell."}, {"d": 1, "q": "Wann ist ein Collapsed Core (Zwei-Schichten-Design) sinnvoll?", "x": null, "o": ["Bei kleineren Standorten, wo Core und Distribution in einer Schicht zusammengelegt werden können.", "Nur in Rechenzentren mit Spine-Leaf.", "Wenn mehr als 20 Gebäude angebunden sind.", "Wenn kein Routing eingesetzt wird."], "c": [0], "e": "Collapsed Core spart Geräte und Komplexität bei kleinen Campus-Umgebungen; bei Wachstum wird eine eigene Core-Schicht nötig."}, {"d": 1, "q": "Welche Vorteile bietet ein geroutetes Access-Layer (Layer 3 bis zum Access-Switch)? (Wähle zwei)", "x": null, "o": ["Kein Spanning Tree zwischen Access und Distribution nötig, Failover per Routing-Protokoll", "Kleinere Broadcast- und Fehlerdomänen", "VLANs können beliebig über das Gebäude gespannt werden", "Es werden keine IP-Subnetze pro Access-Switch benötigt"], "c": [0, 1], "e": "Routed Access begrenzt L2-Domänen auf den Access-Switch, nutzt ECMP und schnelle Konvergenz. Der Preis: VLANs lassen sich nicht über mehrere Access-Switches spannen."}, {"d": 1, "q": "Welche Aussage über Spine-Leaf ist richtig?", "x": null, "o": ["Jeder Leaf ist mit jedem Spine verbunden, Endgeräte hängen nur an Leafs.", "Spines sind untereinander verbunden, Leafs nur an einem Spine.", "Endgeräte hängen direkt an den Spines.", "Leafs sind untereinander im Ring verbunden."], "c": [0], "e": "Spine-Leaf liefert gleiche Pfadlänge zwischen allen Leafs und gutes ECMP für Ost-West-Verkehr."}, {"d": 1, "q": "Welche Funktion hat der Fabric Edge Node in SD-Access?", "x": null, "o": ["Er verbindet Endpunkte mit der Fabric, ordnet sie Segmenten zu und kapselt in VXLAN.", "Er verbindet die Fabric mit externen Netzen.", "Er speichert die Endpunkt-zu-Locator-Zuordnung.", "Er ist der Policy-Controller."], "c": [0], "e": "Fabric Edge Nodes sind Access-Switches der Fabric; Border Nodes verbinden nach außen, Control Plane Nodes halten die LISP-Datenbank, Catalyst Center ist der Controller."}, {"d": 1, "q": "Welches Protokoll nutzt die SD-Access-Control-Plane?", "x": null, "o": ["LISP", "BGP EVPN", "OSPF", "IS-IS"], "c": [0], "e": "Die SD-Access-Control-Plane basiert auf LISP (Map-Server/Resolver auf dem Control Plane Node); die Datenebene ist VXLAN, die Policy basiert auf SGTs."}, {"d": 1, "q": "Welche Datenebene verwendet SD-Access?", "x": null, "o": ["VXLAN mit SGT-Informationen im Header (VXLAN-GPO)", "GRE", "MPLS L3VPN", "IPsec"], "c": [0], "e": "SD-Access kapselt Verkehr in VXLAN und trägt die Scalable Group Tag im Header für die Policy durch die Fabric."}, {"d": 1, "q": "Welche Rolle hat der vSmart-Controller in Cisco SD-WAN?", "x": null, "o": ["Er verteilt Routen und Policies (OMP) an die Edge-Geräte.", "Er orchestriert die Erstverbindung (Onboarding) und die Authentifizierung.", "Er verwaltet Konfiguration und Monitoring über die GUI.", "Er leitet Datenverkehr der Standorte weiter."], "c": [0], "e": "vSmart = Control Plane (OMP, Policy); vBond = Orchestrierung und Authentifizierung; vManage = Management; vEdge/cEdge = Datenebene."}, {"d": 1, "q": "Welche Komponente in Cisco SD-WAN stellt zuerst die Verbindung zwischen neuen Geräten und dem Overlay her und gibt die Adressen von vSmart/vManage bekannt?", "x": null, "o": ["vBond", "vSmart", "vManage", "vAnalytics"], "c": [0], "e": "vBond ist der Orchestrator: er authentifiziert, hilft bei NAT-Traversal und verteilt die Adressen der anderen Controller."}, {"d": 1, "q": "Welches Protokoll tauscht in Cisco SD-WAN Routing-, Policy- und Verschlüsselungsinformationen zwischen Edge-Geräten und vSmart aus?", "x": null, "o": ["OMP (Overlay Management Protocol)", "OSPF", "LISP", "BFD"], "c": [0], "e": "OMP läuft zwischen vEdge/cEdge und vSmart; BFD misst die Pfadqualität auf den Datentunneln."}, {"d": 1, "q": "Welche Technologie nutzt SD-WAN, um die Qualität von Tunneln zu messen und Pfade entsprechend zu wählen?", "x": null, "o": ["BFD-Probes pro Transport (Loss, Latenz, Jitter)", "SNMP-Polling", "Traceroute", "NetFlow"], "c": [0], "e": "BFD läuft in jedem IPsec-Tunnel und liefert die Messwerte für die Application-Aware-Routing-Entscheidungen."}, {"d": 1, "q": "Welche zwei Aussagen zu QoS-Markierung sind richtig? (Wähle zwei)", "x": null, "o": ["DSCP umfasst 6 Bit im IP-Header.", "CoS umfasst 3 Bit im 802.1Q-Tag.", "DSCP ist ein Layer-2-Feld.", "CoS ist 6 Bit lang."], "c": [0, 1], "e": "DSCP (6 Bit, im ToS-Byte) ist Layer 3, CoS (3 Bit, 802.1p im 802.1Q-Tag) Layer 2 und bleibt nur auf Trunks erhalten."}, {"d": 1, "q": "Welcher DSCP-Wert gilt für Sprachverkehr (Expedited Forwarding)?", "x": null, "o": ["46", "34", "26", "18"], "c": [0], "e": "EF = DSCP 46 (binär 101110); AF41 = 34, AF31 = 26, AF21 = 18."}, {"d": 1, "q": "Welche Aufgabe hat Shaping im Vergleich zu Policing?", "x": null, "o": ["Shaping puffert Überschuss und glättet, Policing verwirft oder remarkiert Überschuss.", "Shaping verwirft Überschuss, Policing puffert ihn.", "Beide verwerfen nur ausgehend.", "Shaping gilt nur eingehend."], "c": [0], "e": "Shaping glättet über Warteschlangen (erhöht Delay), Policing ist hart und kann ein- und ausgehend greifen."}, {"d": 1, "q": "Welche Reihenfolge entspricht dem MQC-Konfigurationsablauf?", "x": null, "o": ["class-map → policy-map → service-policy am Interface", "policy-map → service-policy → class-map", "service-policy → class-map → policy-map", "access-list → route-map → service-policy"], "c": [0], "e": "MQC: Verkehr klassifizieren (class-map), Aktionen festlegen (policy-map), per service-policy anwenden."}, {"d": 1, "q": "Welche Queuing-Methode bietet strikte Priorität für sprachkritischen Verkehr?", "x": null, "o": ["LLQ (Low Latency Queuing)", "FIFO", "WFQ ohne Priority-Queue", "Tail Drop"], "c": [0], "e": "LLQ ergänzt CBWFQ um eine strikte Prioritätswarteschlange (priority). Sie wird zusätzlich begrenzt, damit andere Klassen nicht verhungern."}, {"d": 1, "q": "Welche Wirkung hat WRED?", "x": null, "o": ["Er verwirft Pakete zufällig schon vor voller Queue, abhängig von der Markierung.", "Er verwirft alle Pakete bei voller Queue gleichzeitig.", "Er priorisiert Sprachpakete strikt.", "Er verschlüsselt Pakete."], "c": [0], "e": "WRED vermeidet TCP-Global-Synchronization, indem es beginnend mit niedriger Priorität zufällig verwirft."}, {"d": 1, "q": "Eine Policy soll Sprache mit Delay unter 150 ms transportieren. Welche Maßnahme gehört nicht in die Priorisierung?", "x": null, "o": ["Alle Pakete auf der WAN-Strecke mit einem Shaper auf 100 % der Linkgeschwindigkeit verzögern", "LLQ für EF", "Klassifizierung am Access-Switch (Trust-Boundary)", "Geringe Serialisierungsverzögerung durch Fragmentierung/LFI auf langsamen Links"], "c": [0], "e": "Shaping nahe der Linkrate kann Delay erhöhen; Sprache braucht niedrige, konstante Verzögerung durch Priority-Queue und Trust-Boundary."}, {"d": 1, "q": "Welche Rolle hat die Trust-Boundary im QoS-Design?", "x": null, "o": ["Ab hier werden Markierungen als vertrauenswürdig akzeptiert, davor wird neu markiert oder verworfen.", "Sie begrenzt die Bandbreite des Uplinks.", "Sie legt die VLAN-Grenzen fest.", "Sie bestimmt die Root Bridge."], "c": [0], "e": "Typisch liegt die Trust-Boundary am IP-Telefon bzw. Access-Switch-Port; Endgeräten dahinter wird nicht vertraut."}, {"d": 1, "q": "Welche Aussage über HSRP-Version 2 stimmt?", "x": null, "o": ["Sie unterstützt IPv6 und nutzt die Multicast-Adresse 224.0.0.102.", "Sie nutzt 224.0.0.2 und unterstützt nur Gruppen 0–255.", "Sie ist offen standardisiert wie VRRP.", "Sie teilt Last nativ auf alle Router."], "c": [0], "e": "HSRPv2: Gruppen 0–4095, IPv6, Multicast 224.0.0.102 (v1: 224.0.0.2). HSRP ist Cisco-proprietär; GLBP verteilt Last."}, {"d": 1, "q": "Welches FHRP verteilt Last auf mehrere Gateways mit einer virtuellen IP über mehrere virtuelle MACs?", "x": null, "o": ["GLBP", "HSRP", "VRRP", "STP"], "c": [0], "e": "GLBP: ein AVG vergibt virtuelle MACs an AVFs; Clients erhalten per ARP unterschiedliche MACs."}, {"d": 1, "q": "Welche zwei Schritte sind nötig, damit ein HSRP-Router nach Wiederkehr die aktive Rolle übernimmt? (Wähle zwei)", "x": null, "o": ["Höhere Priorität als der aktuelle Active", "preempt aktiviert", "Gleiche Priorität wie der Standby", "Eine größere Hello-Zeit"], "c": [0, 1], "e": "Preempt ist standardmäßig aus. Bei Gleichstand der Priorität gewinnt die höhere IP."}, {"d": 1, "q": "Was beschreibt den Border Node in SD-Access?", "x": null, "o": ["Er verbindet die SD-Access-Fabric mit Netzen außerhalb (WAN, Rechenzentrum, Internet).", "Er verbindet Endgeräte mit Access-Ports.", "Er speichert die Host-Tracking-Datenbank.", "Er erzeugt SGT-Zuordnungen."], "c": [0], "e": "Border Nodes übersetzen zwischen Fabric (VXLAN/LISP) und externen Netzen; Policy-Mapping bleibt über SGT-Propagation erhalten."}, {"d": 1, "q": "Welche Eigenschaft unterscheidet Cisco Catalyst Center (früher DNA Center) von klassischem CLI-Management?", "x": null, "o": ["Es bietet intent-basierte Automatisierung, Assurance und Policy über eine zentrale Plattform.", "Es ersetzt alle Routing-Protokolle im Netz.", "Es läuft nur auf einem einzelnen Switch.", "Es verwendet ausschließlich SNMPv1."], "c": [0], "e": "Catalyst Center ist Controller für Automation, Assurance, Policy und SD-Access; nach unten nutzt es CLI, SNMP, NETCONF, REST."}, {"d": 1, "q": "Welche beiden Optionen sind Merkmale einer Underlay-Netzwerkarchitektur in SD-Access? (Wähle zwei)", "x": null, "o": ["Reines IP-Netz zwischen den Fabric-Knoten (L3-Routing)", "Transportiert die VXLAN-Overlay-Pakete", "Führt Endpunkte in virtuellen Netzen (VNs)", "Trägt SGT-Policy-Regeln der Endpunkte direkt"], "c": [0, 1], "e": "Das Underlay ist das IP-Routing (meist IS-IS/OSPF) zwischen Fabric-Knoten, das Overlay besteht aus VXLAN-Tunneln und VNs."}, {"d": 1, "q": "Welches Merkmal hat ein Cloud-Zugang über Direct Connect/ExpressRoute gegenüber einem Internet-VPN?", "x": null, "o": ["Dedizierte, private Verbindung mit planbarer Latenz und Bandbreite.", "Er ist immer billiger.", "Er nutzt automatisch IPsec-Verschlüsselung.", "Er benötigt keine Routing-Konfiguration."], "c": [0], "e": "Dedizierte Verbindungen sind berechenbar, aber nicht automatisch verschlüsselt; Verschlüsselung muss zusätzlich konfiguriert werden."}, {"d": 2, "q": "Welcher Hypervisor-Typ läuft direkt auf der Hardware ohne Host-Betriebssystem?", "x": null, "o": ["Typ 1", "Typ 2", "Container-Runtime", "Emulator"], "c": [0], "e": "Typ-1-Hypervisor (z. B. ESXi, KVM-basiert) läuft auf der Hardware; Typ 2 (VirtualBox, VMware Workstation) auf einem Host-OS."}, {"d": 2, "q": "Was unterscheidet Container von virtuellen Maschinen?", "x": null, "o": ["Container teilen sich den Kernel des Hosts und sind leichter.", "Container haben einen eigenen Kernel pro Instanz.", "Container brauchen immer einen Hypervisor.", "Container laufen nicht auf Linux."], "c": [0], "e": "Container isolieren auf Prozessebene (Namespaces, cgroups); VMs virtualisieren Hardware inklusive eigenem Kernel."}, {"d": 2, "q": "Welche Funktion hat ein virtueller Switch (vSwitch) wie Open vSwitch?", "x": null, "o": ["Er verbindet VMs untereinander und mit dem physischen Netz auf Layer 2.", "Er routet zwischen Autonomen Systemen.", "Er ersetzt den Hypervisor.", "Er terminiert IPsec-VPNs."], "c": [0], "e": "vSwitches schalten Frames zwischen vNICs und Uplinks; VLANs und Trunks lassen sich darüber auf VMs abbilden."}, {"d": 2, "q": "Welche Technologie erlaubt eine NFV-Funktion (z. B. virtueller Router CSR1000v) auf Standard-Hardware?", "x": null, "o": ["NFV (Network Functions Virtualization)", "SDN-Controller", "TRILL", "MPLS"], "c": [0], "e": "NFV löst Netzwerkfunktionen von dedizierter Hardware und betreibt sie als VMs/Container."}, {"d": 2, "q": "Ein VRF-Lite trennt Routingtabellen. Welche Aussage ist richtig?", "x": null, "o": ["Gleiche IP-Präfixe können in verschiedenen VRFs unabhängig existieren.", "VRFs teilen eine globale Routingtabelle mit VLAN-Tags.", "VRF-Lite benötigt MPLS.", "VRFs benötigen immer BGP."], "c": [0], "e": "VRF-Lite nutzt getrennte Tabellen ohne MPLS; Verbindung per Subinterface/VLAN pro VRF und Routing pro VRF."}, {"d": 2, "q": "Welcher Befehl ordnet ein Interface einem VRF zu?", "x": null, "o": ["ip vrf forwarding KUNDE_A (bzw. vrf forwarding KUNDE_A)", "ip route vrf KUNDE_A", "ip vrf bind KUNDE_A", "vrf member KUNDE_A (IOS)"], "c": [0], "e": "Nach der VRF-Zuordnung wird die IP-Adresse des Interfaces entfernt und muss neu gesetzt werden."}, {"d": 2, "q": "Ein Ping aus dem VRF funktioniert nicht. Welcher Befehl ist richtig?", "x": null, "o": ["ping vrf KUNDE_A 10.1.1.1", "ping 10.1.1.1 vrf KUNDE_A source", "ping 10.1.1.1 table KUNDE_A", "vrf ping 10.1.1.1"], "c": [0], "e": "Befehle mit VRF-Bezug haben die Form ping vrf NAME, show ip route vrf NAME, traceroute vrf NAME."}, {"d": 2, "q": "Welche Aussage über GRE ist richtig?", "x": null, "o": ["GRE kapselt beliebige Protokolle, bietet aber keine Verschlüsselung.", "GRE verschlüsselt mit AES.", "GRE kann nur IPv4 transportieren.", "GRE nutzt Port 500."], "c": [0], "e": "GRE (IP-Protokoll 47) transportiert Multicast und Routing-Protokolle, schützt aber nicht. Mit IPsec ergibt sich GRE over IPsec."}, {"d": 2, "q": "Welcher Vorteil hat GRE over IPsec gegenüber reinem IPsec-Tunnel-Modus?", "x": null, "o": ["Routing-Protokolle und Multicast laufen über den Tunnel.", "Höhere Verschlüsselungsstärke.", "Kein MTU-Overhead.", "Keine Konfiguration von Schlüsseln."], "c": [0], "e": "Klassisches IPsec transportiert nur Unicast-IP; GRE ergänzt Multicast und dynamisches Routing."}, {"d": 2, "q": "Welche beiden Phasen hat IKEv1 beim Aufbau eines IPsec-Tunnels? (Wähle zwei)", "x": null, "o": ["Phase 1 baut die IKE-SA auf.", "Phase 2 baut die IPsec-SA für den Datenverkehr auf.", "Phase 1 verschlüsselt den Nutzverkehr.", "Phase 2 authentifiziert die Gegenstelle erstmals."], "c": [0, 1], "e": "Phase 1 = sicherer Kanal (Authentifizierung, DH), Phase 2 = IPsec-SAs mit Transform-Set."}, {"d": 2, "q": "Welches Protokoll des IPsec-Frameworks bietet Verschlüsselung der Nutzdaten?", "x": null, "o": ["ESP (IP-Protokoll 50)", "AH (IP-Protokoll 51)", "GRE (IP-Protokoll 47)", "IKE UDP 500"], "c": [0], "e": "ESP verschlüsselt und authentifiziert; AH authentifiziert nur und kann NAT nicht passieren."}, {"d": 2, "q": "Welche Methode erlaubt IPsec durch NAT?", "x": null, "o": ["NAT-Traversal (ESP in UDP 4500)", "AH im Transportmodus", "Doppeltes NAT", "GRE ohne Schutz"], "c": [0], "e": "NAT-T kapselt ESP in UDP-Port 4500, nachdem IKE (UDP 500) NAT erkannt hat."}, {"d": 2, "q": "Welcher Vorteil bietet VTI (Virtual Tunnel Interface) gegenüber Crypto Maps?", "x": null, "o": ["Der Tunnel ist ein routbares Interface, auf dem sich Routing-Protokolle und QoS direkt konfigurieren lassen.", "Er ist zwingend ohne IKE.", "Er benötigt keine IPsec-Profile.", "Er funktioniert nur ohne Verschlüsselung."], "c": [0], "e": "Mit VTI wird der geschützte Verkehr per Routing zum Tunnel geleitet, statt per ACL in der Crypto Map."}, {"d": 2, "q": "Welche Aufgabe haben die LISP-Map-Server/Map-Resolver?", "x": null, "o": ["Sie halten EID-zu-RLOC-Zuordnungen und beantworten Map-Requests.", "Sie verschlüsseln den Tunnelverkehr.", "Sie routen Pakete über das Underlay.", "Sie vergeben DHCP-Adressen."], "c": [0], "e": "LISP trennt Identität (EID) und Ort (RLOC); xTRs registrieren beim Map-Server und fragen beim Map-Resolver an."}, {"d": 2, "q": "Welcher Port wird für die LISP-Datenebene genutzt?", "x": null, "o": ["UDP 4341", "UDP 4789", "UDP 4500", "TCP 179"], "c": [0], "e": "LISP-Daten: UDP 4341, LISP-Control: UDP 4342. VXLAN nutzt UDP 4789."}, {"d": 2, "q": "Welcher UDP-Zielport gilt für VXLAN?", "x": null, "o": ["4789", "4341", "4500", "500"], "c": [0], "e": "VXLAN kapselt Ethernet-Frames in UDP/4789, mit 24-Bit-VNI (über 16 Mio. Segmente)."}, {"d": 2, "q": "Warum ist VXLAN gegenüber VLANs für große Rechenzentren vorteilhaft?", "x": null, "o": ["24-Bit-VNI statt 12-Bit-VLAN-ID, L2-Segmente über L3-Underlay.", "Es braucht kein Underlay.", "Es ersetzt BGP.", "Es verwendet keine Kapselung."], "c": [0], "e": "VLAN-ID hat 4094 nutzbare Werte, die VNI über 16 Millionen; VXLAN dehnt L2 über L3-Netze."}, {"d": 2, "q": "Wofür dient der VTEP in einem VXLAN-Netz?", "x": null, "o": ["Er kapselt und entkapselt Frames am Rand der Overlay-Segmente.", "Er führt Spanning Tree aus.", "Er verteilt SGT-Tags.", "Er vergibt IP-Adressen."], "c": [0], "e": "Ein VTEP ist Start- und Endpunkt der VXLAN-Tunnel (Leaf, Hypervisor oder Border)."}, {"d": 3, "q": "Welcher Switch wird in einem Rapid-PVST+-Netz Root Bridge für VLAN 10?", "x": "SW1: priority 32778, MAC 0011.1111.1111\nSW2: priority 28682, MAC 0022.2222.2222\nSW3: priority 28682, MAC 0000.3333.3333\nSW4: priority 32778, MAC 0000.4444.4444", "o": ["SW3", "SW1", "SW2", "SW4"], "c": [0], "e": "Niedrigste Priorität (28682 = 28672 + VLAN 10) gewinnt; bei Gleichstand entscheidet die niedrigere MAC: SW3."}, {"d": 3, "q": "Welche Rolle hat ein Port, der in RSTP als Backup-Port arbeitet?", "x": null, "o": ["Er ist ein redundanter Weg zum selben Segment auf demselben Switch (Alternative zum Designated Port).", "Er ist ein Pfad zur Root Bridge über einen anderen Switch.", "Er ist der beste Pfad zur Root Bridge.", "Er verbindet zwei Root Bridges."], "c": [0], "e": "Alternate = alternativer Weg zur Root über anderen Switch, Backup = zweiter Port desselben Switches am gleichen Segment."}, {"d": 3, "q": "Welche Zustände kennt RSTP?", "x": null, "o": ["Discarding, Learning, Forwarding", "Blocking, Listening, Learning, Forwarding", "Disabled, Blocking, Forwarding", "Discarding, Listening, Forwarding"], " ort 1 (GigabitEthernet0/1)\nBridge ID  Priority 32769  Address 0022.2222.2222\n\nInterface   Role Sts Cost Prio.Nbr Type\nGi0/1       Root FWD 4    128.1    P2p\nGi0/2       Altn BLK 4    128.2    P2p\nGi0/3       Desg FWD 4    128.3    P2p", "o": ["Gi0/1", "Gi0/2", "Gi0/3", "Keiner, R2 ist die Root Bridge"], "c": [0], "e": "Gi0/1 ist als Root im Zustand FWD. Gi0/2 ist Alternate (blockiert), Gi0/3 Designated. R2 ist nicht Root, da Root ID ≠ Bridge ID."}, {"d": 3, "q": "Warum kommt keine BGP-Sitzung zustande?", "x": "R1# show ip bgp summary\nNeighbor     V   AS MsgRcvd MsgSent  Up/Down  State/PfxRcd\n203.0.113.2  4  65002       0       5  00:05:12  Active\n\nR1# show running-config | section router bgp\nrouter bgp 65001\n neighbor 203.0.113.2 remote-as 65003", "o": ["remote-as stimmt nicht mit der AS-Nummer des Nachbarn (65002 laut Tabelle) überein.", "Das BGP-Passwort fehlt.", "Die eBGP-Peers müssen in derselben AS liegen.", "Der Router benötigt eine Router-ID im IPv6-Format."], "c": [0], "e": "Falsche AS-Nummer im neighbor-Befehl führt zu Fehlern bei OPEN (Bad Peer AS), der Zustand springt zwischen Active und Idle."}, {"d": 4, "q": "Welche Aussage zu diesem IP-SLA-Ergebnis stimmt?", "x": "R1# show ip sla statistics\nIPSLAs Latest Operation Statistics\nIPSLA operation id: 10\n  Latest RTT: NoConnection/Busy/Timeout\nLatest operation return code: Timeout\nNumber of successes: 0\nNumber of failures: 12", "o": ["Das Ziel antwortet nicht; ein daran gekoppeltes Tracking-Objekt wäre down.", "Das Ziel ist erreichbar, aber langsam.", "Die Messung ist noch nicht gestartet.", "Der Responder fehlt für ICMP-Echo."], "c": [0], "e": "Timeout bei ICMP-Echo bedeutet keine Antwort; bei Fehler wird die getrackte Route entfernt."}, {"d": 5, "q": "Warum wird der Client am Port nicht authentifiziert?", "x": "SW1# show authentication sessions interface gi0/5\n  Interface:   GigabitEthernet0/5\n  MAC Address: 0050.7966.6801\n  Status:      Unauth\n  Method status list:\n     dot1x      Failed over\n     mab        Not run", "o": ["Der Client hat keinen 802.1X-Supplicant (Failover), MAB ist nicht konfiguriert oder nicht aktiv.", "Der Client hat ein falsches Passwort eingegeben.", "Der Port ist in err-disabled.", "Spanning Tree blockiert den Port."], "c": [0], "e": "„Failed over“ bedeutet, dass 802.1X keinen Supplicant fand; ohne mab im Authentifizierungsablauf bleibt der Client Unauth."}, {"d": 5, "q": "Welche Wirkung hat die ACL auf Verkehr von 10.1.1.10 zu 10.2.2.20 per HTTP?", "x": "ip access-list extended TEST\n 10 deny tcp 10.1.1.0 0.0.0.255 any eq 80\n 20 permit tcp host 10.1.1.10 any eq 80\n 30 permit ip any any\ninterface g0/0\n ip access-group TEST in", "o": ["Der Verkehr wird verworfen, weil Zeile 10 zuerst trifft.", "Der Verkehr wird erlaubt, weil Zeile 20 genauer ist.", "Der Verkehr wird erlaubt, weil Zeile 30 alles erlaubt.", "Der Verkehr wird gespiegelt."], "c": [0], "e": "ACLs werden von oben nach unten ausgewertet; der erste Treffer entscheidet, Genauigkeit zählt nicht."}, {"d": 6, "q": "Was gibt dieser Python-Code aus?", "x": "data = {\"devices\": [{\"name\": \"R1\", \"up\": True}, {\"name\": \"R2\", \"up\": False}]}\nfor d in data[\"devices\"]:\n    if not d[\"up\"]:\n        print(d[\"name\"])", "o": ["R2", "R1", "R1 und R2", "True"], "c": [0], "e": "Die Schleife gibt nur den Namen der Geräte aus, deren up-Wert False ist."}, {"d": 6, "q": "Welche Aktion erzeugt die folgende REST-Anfrage?", "x": "PUT /restconf/data/ietf-interfaces:interfaces/interface=Gi0%2F1\nContent-Type: application/yang-data+json\n{\"ietf-interfaces:interface\":{\"name\":\"Gi0/1\",\"enabled\":false}}", "o": ["Sie ersetzt die Konfiguration von Gi0/1 und schaltet das Interface administrativ ab.", "Sie liest den Zustand von Gi0/1.", "Sie löscht das Interface.", "Sie fügt ein zusätzliches Interface hinzu."], "c": [0], "e": "PUT ersetzt die Ressource; enabled=false entspricht shutdown."}];
const DOM={1:'Architektur',2:'Virtualisierung',3:'Infrastruktur',4:'Network Assurance',5:'Security',6:'Automation'};
const WEIGHT={1:15,2:10,3:30,4:10,5:20,6:15};
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function home(){clearInterval(timer);S=null;

  let h=`<h1>CCNP ENCOR 350-401 v1.2 · Prüfungssimulation</h1><p class="sub">${Q.length} Fragen, gewichtet nach den sechs Domänen. Läuft offline im Browser.</p>
  <div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Prüfung (60 Fragen, 75 Minuten)<small>Zufallsauswahl nach Domänengewicht, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, 180 Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  for(const d of Object.keys(DOM))h+=`<button class="sec" onclick="start('practice',${d})">Domäne ${d}: ${DOM[d]}<small>${Q.filter(q=>q.d==d).length} Fragen · Gewicht ${WEIGHT[d]} %</small></button>`;
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<p class="sub">Hinweis: Die Fragen sind eigene Übungsfragen im Stil der Prüfung, keine Original-Prüfungsfragen. Die Bestehensgrenze der echten Prüfung ist nicht öffentlich festgelegt (Richtwert etwa 82 %); hier gilt 80 % als Orientierung.</p>`;
  app.innerHTML=h;}
function start(mode,dom){
  let qs;
  if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(60*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?4500:mode==='all'?10800:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){

  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Domäne ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${esc(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Prüfung',all:'Alle Fragen',practice:'Üben D'+S.dom}[S.mode];
  const hist=lsGet('encor_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('encor_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Domäne</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${esc(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
</body>
