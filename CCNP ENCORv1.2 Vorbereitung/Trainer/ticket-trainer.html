<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCNP ENCOR · Ticket-Trainer</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f;--warn:#e0b252}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .6em}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 4px}
.sym{font-size:1.05rem;font-weight:600}
code{background:var(--chip);border-radius:4px;padding:0 4px;font:.88em Menlo,Consolas,monospace}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.45 Menlo,Consolas,monospace;margin:8px 0}
pre .p{color:var(--ok)}pre .m{color:var(--bad)}
.hintbox{border-left:4px solid var(--warn);background:var(--chip);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card);color:var(--ink);font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.expl p{margin:.3em 0}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
td.num{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--acc)}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.stat b{color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const LABS=[{"n": "01", "t": "OSPFv2 Multi-Area"}, {"n": "02", "t": "EIGRP (Named Mode) und OSPFv3"}, {"n": "03", "t": "eBGP Dual-Homing und Policy"}, {"n": "04", "t": "Policy-Based Routing mit IP SLA"}, {"n": "05", "t": "VLANs, Trunks und EtherChannel"}, {"n": "06", "t": "Spanning Tree, MST und Schutzfunktionen"}, {"n": "07", "t": "First-Hop-Redundanz: HSRP, VRRP und GLBP"}, {"n": "08", "t": "NTP, Syslog und SNMPv3"}, {"n": "09", "t": "NAT und PAT"}, {"n": "10", "t": "ACLs und Control-Plane Policing"}, {"n": "11", "t": "Gerätezugriff und AAA"}, {"n": "12", "t": "Multicast mit IGMP und PIM Sparse Mode"}, {"n": "13", "t": "VRF-Lite mit überlappenden Adressen"}, {"n": "14", "t": "GRE, IPsec und VTI"}, {"n": "15", "t": "LISP: Map-Server, Map-Resolver, xTR"}, {"n": "16", "t": "VXLAN: VTEP, VNI und Ingress Replication"}, {"n": "17", "t": "QoS mit MQC: Markieren, Policing, Shaping, LLQ"}, {"n": "18", "t": "Flexible NetFlow, SPAN und RSPAN"}, {"n": "19", "t": "RESTCONF, NETCONF, YANG und EEM"}, {"n": "23", "t": "Capstone: Campus und Edge, Fehlersuche im Gesamtnetz"}, {"n": "24", "t": "Capstone: WAN, eBGP und IPsec-Overlay, Fehlersuche"}, {"n": "25", "t": "EIGRP klassisch: Nachbarschaft, Authentifizierung, Summary und Stub"}, {"n": "26", "t": "iBGP mit Route Reflector, Local Preference und Communities"}, {"n": "27", "t": "Redistribution zwischen OSPF und EIGRP mit Tags und Filtern"}, {"n": "28", "t": "OSPF vertieft: Area-Typen, Summarisierung und Authentifizierung"}, {"n": "29", "t": "Policy-Based Routing nach Quelle und Anwendung"}, {"n": "30", "t": "Capstone: Routing-Fehlersuche (OSPF, EIGRP, BGP, Redistribution)"}];
const T=[{"l": "01", "n": 1, "dev": "R1", "s": "R1 und R2 werden nicht Nachbarn, `show ip ospf neighbor` ist auf R1 leer, Area 0 ist isoliert.", "h": "`show ip ospf interface Gi0/0` zeigt auf beiden Seiten Authentisierung mit Key-Chain. `debug ip ospf adj` meldet dann „Mismatched Authentication Key“.", "u": "Die SHA-256-Schlüssel der Key-Chain unterscheiden sich (Authentifizierungsfehler, Hello wird verworfen).", "f": "Key-String auf R1 an R2 angleichen, Nachbarschaft prüfen.", "d": "- key-string LabKey123\n+ key-string LabKey999"}, {"l": "01", "n": 2, "dev": "R3", "s": "R3 erscheint nirgends als Nachbar, R2 und R4 sehen nur sich gegenseitig.", "h": "`show ip ospf interface brief` auf R3 listet Gi0/0 nicht oder `show ip protocols` zeigt es unter „Passive Interface(s)“.", "u": "`passive-interface default` ohne Ausnahme: R3 sendet auf Gi0/0 keine Hellos.", "f": "`no passive-interface GigabitEthernet0/0` unter `router ospf 1`.", "d": "- no passive-interface GigabitEthernet0/0"}, {"l": "01", "n": 3, "dev": "R2", "s": "R1 sieht vier einzelne /24 (10.1.16–19) statt der Zusammenfassung.", "h": "`show ip ospf database summary` auf R1 zeigt die vier /24 einzeln. Vergleiche die `area range` auf R2 mit den tatsächlichen Netzen: 10.1.16.0/22 umfasst 16 bis 19.", "u": "Die `area range` beschreibt ein falsches Netz (10.1.20.0/22) und greift nicht.", "f": "Range auf 10.1.16.0 255.255.252.0 korrigieren.", "d": "- area 1 range 10.1.16.0 255.255.252.0\n+ area 1 range 10.1.20.0 255.255.252.0"}, {"l": "01", "n": 4, "dev": "R4", "s": "R4 bleibt in `INIT`/taucht nicht als Nachbar auf, während R3 und R2 sich sehen.", "h": "`show ip ospf interface Gi0/0` auf R4 und auf dem Nachbarn vergleichen: Die Zeile „Timer intervals configured, Hello …, Dead …“ unterscheidet sich.", "u": "Hello-Intervall 5 s auf R4 passt nicht zu den anderen (10 s): Hello-Parameter-Mismatch.", "f": "Hello-Intervall auf R4 entfernen (Default 10 s).", "d": "- ip ospf 1 area 1\n-  ip ospf priority 100\n+ ip ospf 1 area 1\n+  ip ospf priority 100\n+  ip ospf hello-interval 5"}, {"l": "02", "n": 1, "dev": "R2", "s": "R2 hat keinen EIGRP-Nachbarn zu R1 oder R3, `show ip eigrp neighbors` ist leer, IPv6/OSPFv3 läuft normal.", "h": "`show eigrp protocols` oder `show running-config | section router eigrp` auf R2: Die AS-Nummer in der address-family weicht von R1 und R3 ab.", "u": "AS-Nummer 101 statt 100 auf R2: EIGRP-Pakete mit anderer AS werden ignoriert.", "f": "AS-Nummer auf R2 wieder auf 100 setzen.", "d": "- autonomous-system 100\n+ autonomous-system 101"}, {"l": "02", "n": 2, "dev": "R1", "s": "R1–R2 funktioniert, aber der Direktlink R1–R3 bildet keine Nachbarschaft (Log: Authentifizierungsfehler).", "h": "Das Log auf R1 oder R3 meldet die Authentisierung. `show eigrp address-family ipv4 interfaces detail Gi0/1` zeigt den Authentisierungsmodus, die Passwörter vergleichst du in der Konfiguration.", "u": "Auf R1 Gi0/1 gilt ein anderes HMAC-Passwort als auf R3.", "f": "Passwort auf R1 Gi0/1 an R3 angleichen.", "d": "- af-interface GigabitEthernet0/1\n-    no passive-interface\n-    authentication mode hmac-sha-256 0 LabKey123\n+ af-interface GigabitEthernet0/1\n+    no passive-interface\n+    authentication mode hmac-sha-256 0 FalschesPW"}, {"l": "02", "n": 3, "dev": "R2", "s": "R2–R3 bildet keine EIGRP-Nachbarschaft, R3 ist nur über den Direktlink R1–R3 erreichbar (Pfadwahl bei R1 ungewöhnlich).", "h": "`show eigrp address-family ipv4 interfaces` auf R2 listet Gi0/1 nicht. In der Konfiguration steht `passive-interface` unter `af-interface default`.", "u": "Interface Gi0/1 ist per `af-interface default` passiv und nicht freigegeben.", "f": "`no passive-interface` unter `af-interface GigabitEthernet0/1` setzen.", "d": "-   af-interface GigabitEthernet0/1\n-    no passive-interface\n+   af-interface GigabitEthernet0/1"}, {"l": "02", "n": 4, "dev": "R2", "s": "Im IPv6-Netz fehlt die Nachbarschaft R2–R3 (EIGRP IPv4 läuft), `show ospfv3 neighbor` zeigt auf R2 keinen Nachbarn an Gi0/1.", "h": "`show ospfv3 interface brief` auf R2 und R3: Gi0/1 steht auf beiden Seiten in einer anderen Area.", "u": "Area-Mismatch: R2 nutzt Area 1, R3 Area 0 auf demselben Link.", "f": "Interface auf `ospfv3 1 ipv6 area 0` zurückstellen.", "d": "- interface GigabitEthernet0/1\n-  ospfv3 1 ipv6 area 0\n+ interface GigabitEthernet0/1\n+  ospfv3 1 ipv6 area 1"}, {"l": "03", "n": 1, "dev": "R1", "s": "Die Session R1–R2 kommt nicht hoch (Idle/Active), das Log meldet eine falsche Nachbar-AS.", "h": "Das Log zeigt `%BGP-3-NOTIFICATION … peer in wrong AS`. `show ip bgp summary` listet den Nachbarn mit der konfigurierten, falschen AS.", "u": "Auf R1 ist die erwartete Remote-AS 65011 statt 65010 eingetragen.", "f": "`remote-as 65010` setzen.", "d": "- neighbor 10.12.0.2 remote-as 65010\n+ neighbor 10.12.0.2 remote-as 65011"}, {"l": "03", "n": 2, "dev": "R1", "s": "R1 wählt zu 198.51.100.0/24 den Pfad über ISP-B, obwohl ISP-A bevorzugt sein soll (LocPrf überall 100).", "h": "`show ip bgp 198.51.100.0` zeigt beide Pfade mit Local Preference 100. `show ip bgp neighbors 10.12.0.2 | include route-map` bleibt leer: Die Route-Map hängt nicht an der Sitzung.", "u": "Die Route-Map FROM-ISPA hängt nicht an der Sitzung. Ohne sie herrscht Gleichstand bis zu den letzten Tie-Breakern. Der Pfad über ISP-B ist der ältere eBGP-Pfad, denn die Sitzung zu ISP-A kam erst mit Ticket 1 hoch. Auch bei der Router-ID läge ISP-B vorn (3.3.3.3 gegen 20.20.20.20).", "f": "`neighbor 10.12.0.2 route-map FROM-ISPA in`, danach `clear ip bgp 10.12.0.2 soft in`.", "d": "-  neighbor 10.12.0.2 route-map FROM-ISPA in"}, {"l": "03", "n": 3, "dev": "R1", "s": "Auf R2 erscheint 198.51.100.0/24 zusätzlich mit AS-Path `65001 65020 65100`, R1 wird zum Transit.", "h": "`show ip bgp neighbors 10.12.0.2 advertised-routes` auf R1 enthält auch Präfixe von ISP-B.", "u": "Der Ausgangsfilter zu ISP-A fehlt; R1 reicht ISP-B-Routen weiter.", "f": "`neighbor 10.12.0.2 route-map TO-ISPA out` setzen.", "d": "-  neighbor 10.12.0.2 route-map TO-ISPA out"}, {"l": "03", "n": 4, "dev": "R4", "s": "Weder R2 noch R3 lernen 198.51.100.0/24, R1 hat keine Internet-Route.", "h": "`show ip bgp` auf R4 enthält 198.51.100.0/24 nicht. Vergleiche das `network`-Statement mit `show ip route 198.51.100.0`: Die Maske muss exakt passen.", "u": "Das `network`-Statement passt (Maske /25) nicht zur Route in der RIB (/24), also wird nichts angekündigt.", "f": "Maske auf 255.255.255.0 korrigieren.", "d": "-  network 198.51.100.0 mask 255.255.255.0\n+  network 198.51.100.0 mask 255.255.255.128"}, {"l": "03", "n": 5, "dev": "R1", "s": "Der Kundenbereich 203.0.113.0/24 ist aus dem Internet nicht erreichbar, R2/R3 sehen kein Präfix von R1.", "h": "`show ip bgp` auf R1 hat 203.0.113.0/24 nicht als lokale Route. `show ip route 203.0.113.0` zeigt nur ein /25 nach Null0, das `network`-Statement verlangt aber /24.", "u": "Die Null0-Anker-Route (/25) stimmt nicht mit dem `network`-Statement (/24) überein.", "f": "Anker-Route auf /24 korrigieren.", "d": "- ip route 203.0.113.0 255.255.255.0 Null0\n+ ip route 203.0.113.0 255.255.255.128 Null0"}, {"l": "04", "n": 1, "dev": "R1", "s": "Die Route-Map ist konfiguriert, aber H1 läuft weiter über ISP1 (`show route-map` zeigt 0 Treffer).", "h": "`show route-map` zeigt 0 Treffer. `show ip interface Gi0/0 | include policy` meldet keine Policy, `show ip interface Gi0/1` dagegen schon.", "u": "`ip policy` hängt am WAN-Interface Gi0/1 statt am LAN-Interface Gi0/0: PBR wirkt nur auf Pakete, die dort eingehen.", "f": "Policy von Gi0/1 entfernen, an Gi0/0 binden.", "d": "- interface GigabitEthernet0/0\n-  ip policy route-map PBR\n+ interface GigabitEthernet0/1\n+  ip policy route-map PBR"}, {"l": "04", "n": 2, "dev": "R1", "s": "PBR-Route-Map ist am LAN aktiv, aber H1 nimmt nicht den Weg über ISP2.", "h": "`show access-lists` zeigt bei der PBR-ACL keine Treffer. Vergleiche die Quelladresse in der ACL mit der echten Adresse von H1.", "u": "Die ACL referenziert eine falsche Quelladresse (.21).", "f": "ACL auf 192.168.1.11 korrigieren.", "d": "- permit ip host 192.168.1.11 any\n+ permit ip host 192.168.1.21 any"}, {"l": "04", "n": 3, "dev": "R1", "s": "H1 läuft nicht über ISP2, obwohl ACL und Policy stimmen; `show track 1` ist Down.", "h": "`show track 1` ist Down. `show ip sla statistics` meldet, dass die Operation nie gelaufen ist, `show ip sla configuration` zeigt keine Schedule.", "u": "Die IP-SLA-Operation wurde nie geplant: ohne `ip sla schedule` gibt es keine Messung, der Track bleibt Down und PBR verwirft den Next-Hop.", "f": "`ip sla schedule 1 life forever start-time now` ergänzen.", "d": "- ip sla schedule 1 life forever start-time now"}, {"l": "04", "n": 4, "dev": "R3", "s": "H1 hat Internet-Ausfall (Pings zu 8.8.8.8 scheitern), H2 funktioniert; der Pfad bis R3 steht.", "h": "`traceroute 8.8.8.8` von H1 endet bei R3. `show ip route 0.0.0.0` auf R3 meldet „Network not in table“.", "u": "ISP2 (R3) hat keine Default-Route Richtung R4: Pakete, die PBR dorthin lenkt, werden verworfen.", "f": "Default-Route auf R3 setzen (`ip route 0.0.0.0 0.0.0.0 10.0.34.2`).", "d": "- ip route 0.0.0.0 0.0.0.0 10.0.34.2"}, {"l": "05", "n": 1, "dev": "SW2", "s": "Po1 kommt nicht hoch: Auf SW1 sind die Ports `s` (suspended), H1 hat keine Verbindung.", "h": "`show etherchannel summary` auf SW1 zeigt die Ports mit `(s)`. Auf SW2 zeigt derselbe Befehl den Modus `on`, also kein Protokoll, während SW1 LACP spricht.", "u": "Statischer Modus `on` auf SW2 trifft LACP `active` auf SW1: LACPDUs werden nicht beantwortet, der Channel wird nicht gebildet.", "f": "SW2 auf `passive` oder `active` zurückstellen.", "d": "- channel-group 1 mode passive\n+ channel-group 1 mode on"}, {"l": "05", "n": 2, "dev": "SW3", "s": "H2 (VLAN 20) hat weder Gateway noch Verbindung, H3 (VLAN 10) funktioniert.", "h": "`show interfaces trunk` auf SW3: In der Zeile „Vlans allowed on trunk“ fehlt VLAN 20 bei Po2.", "u": "VLAN 20 fehlt in der Allowed-Liste von Po2 auf SW3.", "f": "`switchport trunk allowed vlan 10,20` auf Po2 setzen.", "d": "- interface Port-channel2\n-  switchport mode trunk\n-  switchport trunk native vlan 99\n-  switchport trunk allowed vlan 10,20\n+ interface Port-channel2\n+  switchport mode trunk\n+  switchport trunk native vlan 99\n+  switchport trunk allowed vlan 10"}, {"l": "05", "n": 3, "dev": "R1", "s": "Alle Hosts in VLAN 20 erreichen ihr Gateway 10.10.20.1 nicht, VLAN 10 ist in Ordnung.", "h": "`show interfaces Gi0/0.20` auf R1 zeigt „Encapsulation 802.1Q Virtual LAN, Vlan ID 21“.", "u": "Das Subinterface erwartet VLAN-Tag 21 statt 20.", "f": "`encapsulation dot1Q 20` setzen.", "d": "- interface GigabitEthernet0/0.20\n-  encapsulation dot1Q 20\n+ interface GigabitEthernet0/0.20\n+  encapsulation dot1Q 21"}, {"l": "05", "n": 4, "dev": "SW3", "s": "H3 (10.10.10.13) erreicht weder H1 noch das Gateway.", "h": "`show vlan brief` auf SW3 zeigt den Port von H3 in VLAN 20, die Adresse von H3 gehört aber zu VLAN 10.", "u": "Der Access-Port von H3 liegt in VLAN 20, die Adresse gehört aber zu VLAN 10.", "f": "`switchport access vlan 10` am Port Gi1/1 setzen.", "d": "- interface GigabitEthernet1/1\n-  switchport mode access\n-  switchport access vlan 10\n+ interface GigabitEthernet1/1\n+  switchport mode access\n+  switchport access vlan 20"}, {"l": "06", "n": 1, "dev": "SW4", "s": "Alle Hosts erreichen sich, aber `show spanning-tree mst` auf SW4 meldet Boundary-Ports zur eigenen MST-Region; die Lastverteilung nach Instanz funktioniert nicht.", "h": "`show spanning-tree mst configuration` auf SW4 und SW1 vergleichen: Der Name unterscheidet sich (Groß- und Kleinschreibung zählt). `show spanning-tree mst configuration digest` zeigt verschiedene Digests.", "u": "Der Region-Name auf SW4 weicht ab (case-sensitive), dadurch ein anderer Digest: SW4 bildet eine eigene Region und alle VLANs hängen am IST.", "f": "Name auf `ENCOR` korrigieren, Digest mit `show spanning-tree mst configuration digest` vergleichen.", "d": "- name ENCOR\n+ name Encor"}, {"l": "06", "n": 2, "dev": "SW2", "s": "Instanz 2 hat dieselbe Root wie Instanz 1 (SW1), die VLAN-Lastverteilung fehlt.", "h": "`show spanning-tree mst 2` auf SW1 und SW2: SW1 ist Root für Instanz 2. Die Priorität von SW2 steht dort auf dem Standardwert.", "u": "Auf SW2 fehlt die Priorität 4096 für Instanz 2; SW1 hat dort 8192 und gewinnt.", "f": "`spanning-tree mst 2 priority 4096` auf SW2 setzen.", "d": "- spanning-tree mst 2 priority 4096"}, {"l": "06", "n": 3, "dev": "SW3", "s": "Nachdem jemand an Gi1/1 einen kleinen Switch angeschlossen hat, wechselt die Root und das Netz flattert. SW3 zeigt eine neue Root über Gi1/1.", "h": "`show spanning-tree root` auf SW3 zeigt eine neue Root mit Priorität 0 über den Edge-Port. `show spanning-tree interface <Port> detail` zeigt, dass BPDU Guard nicht aktiv ist.", "u": "BPDU Guard fehlt am Edge-Port: SW5 (Priorität 0) darf BPDUs senden und wird Root.", "f": "`spanning-tree bpduguard enable` am Port setzen (Port ggf. mit shut/no shut zurücksetzen).", "d": "- interface GigabitEthernet1/1\n-  switchport mode access\n-  switchport access vlan 10\n-  spanning-tree portfast\n-  spanning-tree bpduguard enable\n+ interface GigabitEthernet1/1\n+  switchport mode access\n+  switchport access vlan 10\n+  spanning-tree portfast"}, {"l": "07", "n": 1, "dev": "R2", "s": "Auf VLAN 10 melden beide Router `Active`, im Log steht `%HSRP-4-DIFFVIP1`.", "h": "`show standby brief` auf R1 und R2 vergleichen: Die Spalte „Virtual IP“ zeigt verschiedene Adressen.", "u": "Die virtuelle IP auf R2 (10.10.10.10) weicht von R1 (10.10.10.1) ab; beide glauben, einzige Active zu sein.", "f": "VIP auf R2 an R1 angleichen.", "d": "- standby 10 ip 10.10.10.1\n+ standby 10 ip 10.10.10.10"}, {"l": "07", "n": 2, "dev": "R1", "s": "Nach Abschalten von R1 Gi0/2 bleibt R1 HSRP Active, der Verkehr von VLAN 10 geht ins Leere.", "h": "`show standby` auf R1 nach dem Abschalten des Uplinks: Die Priorität sinkt nur auf 105. `show track 1` ist Down, der Decrement reicht aber nicht.", "u": "Decrement 5 senkt die Priorität nur auf 105, R2 hat 100: kein Wechsel.", "f": "Decrement größer als die Differenz (z. B. 20).", "d": "-  standby 10 track 1 decrement 20\n+  standby 10 track 1 decrement 5"}, {"l": "07", "n": 3, "dev": "R2", "s": "VLAN 20 zeigt auf beiden Routern `Master`, Hosts erhalten unregelmäßig Pings.", "h": "`show vrrp brief` auf R1 und R2: Die Gruppennummern unterscheiden sich, beide sind Master ihrer eigenen Gruppe.", "u": "VRRP-Gruppennummer 21 auf R2 statt 20: Die Router bilden getrennte Gruppen mit derselben VIP.", "f": "Gruppen-ID auf 20 korrigieren (und `priority 110` ebenfalls unter Gruppe 20).", "d": "-  vrrp 20 ip 10.10.20.1\n+  vrrp 21 ip 10.10.20.1"}, {"l": "07", "n": 4, "dev": "R1", "s": "Nach dem Wiederanschalten von R1 Gi0/2 bleibt R2 Active, obwohl R1 höhere Priorität hat.", "h": "`show standby` auf R1 zeigt Priorität 110, aber keine Zeile „Preemption enabled“.", "u": "Ohne `preempt` übernimmt der Router mit höherer Priorität die Active-Rolle nicht zurück.", "f": "`standby 10 preempt` ergänzen.", "d": "-  standby 10 preempt"}, {"l": "08", "n": 1, "dev": "R1", "s": "Weder R2 noch R3 synchronisieren; `show ntp associations` zeigt auf R2 `~` und Stratum 16 (R1 selbst hat keine Quelle).", "h": "`show ntp status` auf R1 meldet „Clock is unsynchronized, stratum 16, no reference clock“. R1 ist aber als Server für R2 und R3 gedacht.", "u": "R1 hat keine Zeitquelle und ist unsynchronisiert, der `ntp master`-Befehl fehlt.", "f": "`ntp master 3` auf R1 setzen (und eine Weile warten).", "d": "- ntp master 3"}, {"l": "08", "n": 2, "dev": "R2", "s": "R2 hat eine Assoziation mit R1, aber sie wird nie als Sys.Peer gewählt; `authenticated` steht auf `no`.", "h": "`show ntp associations detail` auf R2 zeigt „authenticated: no“ oder „bad authentication“. In der Konfiguration fehlt `ntp trusted-key 1`.", "u": "Key 1 ist definiert, aber nicht als `trusted-key` freigegeben: Pakete mit dieser Key-ID werden nicht akzeptiert.", "f": "`ntp trusted-key 1` auf R2.", "d": "- ntp trusted-key 1"}, {"l": "08", "n": 3, "dev": "R3", "s": "R3 bleibt unsynchronisiert, `show ntp associations` zeigt Reach 0 zu 10.0.23.10.", "h": "`show ntp associations` auf R3 zeigt Reach 0. Die Server-Adresse in der Konfiguration gibt es im Netz nicht.", "u": "Tippfehler in der Server-Adresse.", "f": "Server-Adresse auf 10.0.23.1 korrigieren.", "d": "- ntp server 10.0.23.1 key 1\n+ ntp server 10.0.23.10 key 1"}, {"l": "08", "n": 4, "dev": "R2", "s": "In `show logging` auf R2 fehlen Link-Up-Meldungen (`%LINEPROTO-5-UPDOWN`), obwohl der Link geflappt hat.", "h": "`show logging | include Trap logging` oder `Buffer logging` auf R2 zeigt „level errors“. Link-Meldungen haben Severity 5 und werden ausgefiltert.", "u": "Level `errors` (3) blendet Meldungen der Severity 5 (notifications) aus.", "f": "Level auf `informational` oder `notifications` setzen.", "d": "- logging buffered 16384 informational\n+ logging buffered 16384 errors"}, {"l": "09", "n": 1, "dev": "R1", "s": "Weder PC1 noch PC2 erreichen den ISP, `show ip nat translations` ist leer (Quelladresse bleibt privat).", "h": "`show ip nat translations` ist leer. `show ip nat statistics` listet bei „Inside interfaces“ nichts oder nicht Gi0/0.", "u": "Am LAN-Interface fehlt `ip nat inside`: Pakete werden nicht übersetzt.", "f": "`ip nat inside` auf Gi0/0 setzen.", "d": "- interface GigabitEthernet0/0\n-  ip nat inside\n+ interface GigabitEthernet0/0"}, {"l": "09", "n": 2, "dev": "R1", "s": "Dasselbe Bild trotz korrektem Interface-Setup: keine Übersetzung, der ISP sieht nichts.", "h": "`show ip nat statistics` zeigt die Interfaces richtig. `show access-lists` zeigt bei der NAT-ACL keine Treffer, weil das Netz nicht zum LAN passt.", "u": "Die ACL für PAT beschreibt 192.168.1.0/24, das LAN ist aber 192.168.10.0/24.", "f": "ACL auf das richtige Subnetz korrigieren.", "d": "- access-list 1 permit 192.168.10.0 0.0.0.255\n+ access-list 1 permit 192.168.1.0 0.0.0.255"}, {"l": "09", "n": 3, "dev": "R1", "s": "PC1 kommt raus, PC2 danach nicht mehr; `show ip nat statistics` zeigt Misses.", "h": "`show ip nat statistics` zeigt steigende Misses. `show running-config | include ip nat inside source` endet ohne `overload`.", "u": "Ohne `overload` kann die Interface-Adresse nur einem Host zugeordnet werden (1:1).", "f": "`overload` ergänzen.", "d": "- ip nat inside source list 1 interface GigabitEthernet0/1 overload\n+ ip nat inside source list 1 interface GigabitEthernet0/1"}, {"l": "09", "n": 4, "dev": "R1", "s": "Der ISP erreicht 203.0.113.10 (Server) nicht, `show ip nat translations` zeigt die Zuordnung zu .11.", "h": "`show ip nat translations` zeigt die statische Zuordnung auf .11. Ein Ping von R1 auf 172.16.0.11 bleibt ohne Antwort.", "u": "Das statische NAT zeigt auf eine nicht vorhandene innere Adresse (172.16.0.11).", "f": "Innere Adresse auf 172.16.0.10 korrigieren.", "d": "- ip nat inside source static 172.16.0.10 203.0.113.10\n+ ip nat inside source static 172.16.0.11 203.0.113.10"}, {"l": "10", "n": 1, "dev": "R1", "s": "Seit der ACL am Edge funktioniert aus dem LAN nichts mehr (kein Ping nach 8.8.8.8, kein HTTP von außen), Zähler der ersten Zeile steigt.", "h": "`show access-lists` zeigt steigende Treffer auf der ersten Zeile `deny ip any any`, alle anderen Zeilen bleiben bei 0.", "u": "Ein `deny ip any any` steht vor allen Permit-Zeilen und verwirft alles (Shadowing).", "f": "Das frühe Deny entfernen, Reihenfolge der Zeilen prüfen.", "d": "-  10 permit icmp any any echo-reply\n+  5 deny ip any any\n+  10 permit icmp any any echo-reply"}, {"l": "10", "n": 2, "dev": "R1", "s": "SRV kann trotz `deny` ins LAN pingen.", "h": "`show ip interface` am DMZ-Interface zeigt die ACL als „Outgoing access list“. Gedacht ist sie für Verkehr, der aus der DMZ kommt.", "u": "Die ACL steht auf `out` statt `in`: Sie prüft nur Verkehr zur DMZ, nicht den, der aus ihr kommt.", "f": "Richtung auf `in` stellen.", "d": "- interface GigabitEthernet0/2\n-  ip access-group DMZ-IN in\n+ interface GigabitEthernet0/2\n+  ip access-group DMZ-IN out"}, {"l": "10", "n": 3, "dev": "R1", "s": "`show policy-map control-plane` zeigt bei `CM-ICMP` null Treffer, Ping-Flut wird nicht begrenzt.", "h": "`show policy-map control-plane` zeigt bei CM-ICMP 0 Pakete. `show access-lists` zeigt in der zugehörigen ACL `permit udp`.", "u": "Die ACL für die CoPP-Klasse matcht UDP statt ICMP.", "f": "Auf `permit icmp any any` korrigieren.", "d": "- ip access-list extended ICMP-ACL\n-  permit icmp any any\n+ ip access-list extended ICMP-ACL\n+  permit udp any any"}, {"l": "10", "n": 4, "dev": "R1", "s": "Telnet von PC1 auf R1 wird sofort getrennt, obwohl PC1 im Management-Netz liegen soll.", "h": "`show access-lists MGMT` zeigt bei jedem Telnet-Versuch Treffer auf dem impliziten Deny. Das erlaubte Netz in der ACL passt nicht zu PC1.", "u": "Die Standard-ACL MGMT erlaubt 192.168.1.0/24 statt 192.168.10.0/24; die vty-`access-class` verwirft PC1.", "f": "ACL auf 192.168.10.0 0.0.0.255 korrigieren.", "d": "-  permit 192.168.10.0 0.0.0.255\n+  permit 192.168.1.0 0.0.0.255"}, {"l": "11", "n": 1, "dev": "R1", "s": "Solange TACACS+ nicht erreichbar ist (das ist hier immer der Fall), kann sich niemand per Telnet anmelden, auch `admin` nicht.", "h": "`show running-config | include aaa authentication` zeigt die Methodenliste nur mit `group`, ohne `local` am Ende. `debug aaa authentication` meldet beim Anmelden einen Timeout ohne weitere Methode.", "u": "Die Methodenliste hat kein Fallback `local`: bei Server-Timeout gibt es keine weitere Methode.", "f": "`local` als letzte Methode ergänzen (Aussperr-Schutz).", "d": "- aaa authentication login VTY_LIST group TACGRP local\n+ aaa authentication login VTY_LIST group TACGRP"}, {"l": "11", "n": 2, "dev": "R1", "s": "Login per Telnet klappt, aber `admin` landet in `R1>` statt `R1#`.", "h": "`show privilege` nach dem Login zeigt Level 1. In der Konfiguration fehlt `aaa authorization exec`, oder die Line verweist nicht darauf.", "u": "Ohne Exec-Autorisierung gilt das Default-Privileg der Line (1), das Privileg des Benutzers wird nicht übernommen.", "f": "`aaa authorization exec VTY_LIST group TACGRP local` setzen und auf der Line mit `authorization exec VTY_LIST` verknüpfen.", "d": "- aaa authorization exec VTY_LIST group TACGRP local"}, {"l": "11", "n": 3, "dev": "R1", "s": "Telnet-Anmeldung schlägt für alle Benutzer fehl, im Log steht `no method list`.", "h": "Das Log meldet „no method list“. Vergleiche den Namen unter `line vty` mit `show running-config | include aaa authentication login`: Bindestrich gegen Unterstrich.", "u": "Die Line referenziert eine nicht existierende Methodenliste (`VTY-LIST` statt `VTY_LIST`).", "f": "Namen der Methodenliste angleichen.", "d": "- login authentication VTY_LIST\n+ login authentication VTY-LIST"}, {"l": "11", "n": 4, "dev": "R1", "s": "Audit-Befund: untätige vty-Sitzungen laufen nie ab.", "h": "`show running-config | section line vty` zeigt `exec-timeout 0 0`.", "u": "`exec-timeout 0 0` deaktiviert das Idle-Timeout der vty-Lines.", "f": "`exec-timeout 5 0` setzen (je nach Policy).", "d": "-  transport input telnet\n-  exec-timeout 5 0\n- line con 0\n+  transport input telnet\n+  exec-timeout 0 0\n+ line con 0"}, {"l": "12", "n": 1, "dev": "R3", "s": "R3 hat keinen PIM-Nachbarn zu R2; REC1 bekommt keine Pakete, REC2 funktioniert.", "h": "`show ip pim neighbor` auf R3 ist leer. `show ip pim interface` listet den Uplink nicht.", "u": "`ip pim sparse-mode` fehlt auf dem Uplink von R3.", "f": "PIM auf R3 Gi0/0 aktivieren.", "d": "- interface GigabitEthernet0/0\n-  ip pim sparse-mode\n+ interface GigabitEthernet0/0"}, {"l": "12", "n": 2, "dev": "R4", "s": "REC2 empfängt keine Pakete, `show ip pim rp mapping` auf R4 zeigt einen anderen RP als auf den übrigen Routern.", "h": "`show ip pim rp mapping` auf R4 zeigt eine andere RP-Adresse als auf R2 und R3.", "u": "R4 kennt eine falsche RP-Adresse, sein (*,G)-Join geht ins Leere.", "f": "RP-Adresse auf 10.255.0.2 korrigieren.", "d": "- ip pim rp-address 10.255.0.2\n+ ip pim rp-address 10.255.0.9"}, {"l": "12", "n": 3, "dev": "R1", "s": "Weder REC1 noch REC2 empfangen etwas, obwohl alle Join-Zustände stehen. Auf R1 gibt es keine `(S,G)`-Einträge.", "h": "`show ip mroute` auf R1 zeigt keine `(S,G)`-Einträge. `show ip pim interface` listet das Quell-LAN Gi0/1 nicht.", "u": "Das Quell-LAN-Interface von R1 (Gi0/1) ist nicht PIM-aktiv: Der First-Hop-Router erkennt die Quelle nicht und sendet keine Register-Nachricht.", "f": "PIM Sparse Mode auf R1 Gi0/1.", "d": "- interface GigabitEthernet0/1\n-  ip pim sparse-mode\n+ interface GigabitEthernet0/1"}, {"l": "12", "n": 4, "dev": "R2", "s": "Der RP zeigt `(*,G)`-Einträge nicht und Multicast wird auf R2 nicht weitergeleitet.", "h": "`show ip mroute` auf R2 meldet, dass Multicast-Routing nicht aktiv ist. In der Konfiguration fehlt `ip multicast-routing`.", "u": "`ip multicast-routing` fehlt auf R2: Der Router lässt keinen Multicast-Verkehr zu.", "f": "Befehl global auf R2 setzen.", "d": "- ip multicast-routing"}, {"l": "13", "n": 1, "dev": "R1", "s": "Im Log steht `Address 10.1.1.1 overlaps with GigabitEthernet0/0`, BLUE-Site 1 (CB1) ist nicht erreichbar.", "h": "Die Log-Meldung „overlaps with GigabitEthernet0/0“ zeigt den Konflikt. `show ip vrf interfaces` listet das BLUE-Interface unter RED.", "u": "Das BLUE-Interface wurde der VRF RED zugewiesen; die gleiche IP kollidiert dort mit Gi0/0.", "f": "`vrf forwarding BLUE` setzen und IP neu vergeben.", "d": "- interface GigabitEthernet0/1\n-  vrf forwarding BLUE\n+ interface GigabitEthernet0/1\n+  vrf forwarding RED"}, {"l": "13", "n": 2, "dev": "R2", "s": "RED läuft Ende zu Ende, BLUE hat zwischen R1 und R2 keine OSPF-Nachbarschaft.", "h": "`show ip ospf vrf BLUE neighbor` auf R2 ist leer. `show interfaces` am BLUE-Subinterface zeigt eine andere VLAN-ID als auf R1.", "u": "VLAN-Tag des BLUE-Subinterfaces ist 201 statt 200: R1 und R2 sprechen nicht im selben VLAN.", "f": "Tag auf 200 korrigieren.", "d": "- interface GigabitEthernet0/2.200\n-  encapsulation dot1Q 200\n+ interface GigabitEthernet0/2.200\n+  encapsulation dot1Q 201"}, {"l": "13", "n": 3, "dev": "R2", "s": "CB2 bildet keinen Nachbarn zu R2, die BLUE-Site 2 (192.168.2.0/24) fehlt in der Routing-Tabelle von R1.", "h": "`show ip ospf 2 interface brief` auf R2 listet Gi0/1 nicht. Das `network`-Statement für 10.2.2.0/30 fehlt.", "u": "Auf R2 fehlt in OSPF 2 (VRF BLUE) das Netz zum Kunden: Das Interface Gi0/1 nimmt nicht an OSPF teil.", "f": "Netzwerk-Statement für 10.2.2.0/30 ergänzen.", "d": "- router ospf 2 vrf BLUE\n-  router-id 2.2.2.2\n-  network 10.2.2.0 0.0.0.3 area 0\n+ router ospf 2 vrf BLUE\n+  router-id 2.2.2.2"}, {"l": "13", "n": 4, "dev": "CR2", "s": "RED-Site 2 ist nicht erreichbar (192.168.2.0/24 fehlt in VRF RED auf R1), BLUE funktioniert.", "h": "`show ip route vrf RED` auf R1 hat 192.168.2.0/24 nicht. `show ip ospf interface brief` auf CR2 listet die Loopback nicht, weil das `network`-Statement ein anderes Netz nennt.", "u": "Die Loopback-LAN von CR2 wird in OSPF nicht angekündigt (falsches Netz).", "f": "Netzwerk-Statement auf 192.168.2.0 korrigieren.", "d": "- network 192.168.2.0 0.0.0.255 area 0\n+ network 192.168.22.0 0.0.0.255 area 0"}, {"l": "14", "n": 1, "dev": "CE2", "s": "Tunnel0 ist up/up, aber OSPF-Nachbar bleibt aus. `show crypto isakmp sa` zeigt MM_NO_STATE bzw. nichts.", "h": "`show crypto isakmp sa` zeigt MM_NO_STATE. `debug crypto isakmp` meldet einen Fehler bei der Authentisierung. Die Keys vergleichst du in der Konfiguration (`crypto isakmp key` bzw. Keyring).", "u": "Pre-Shared Keys unterscheiden sich: Phase 1 scheitert.", "f": "Key auf CE2 an CE1 angleichen.", "d": "- crypto isakmp key CiscoLab123 address 198.51.100.1\n+ crypto isakmp key CiscoLab999 address 198.51.100.1"}, {"l": "14", "n": 2, "dev": "CE1", "s": "`show crypto isakmp sa` zeigt `QM_IDLE`, aber über den Tunnel geht nichts: Der OSPF-Nachbar bleibt aus, `encaps` und `decaps` stehen auf 0.", "h": "Phase 1 steht also, Phase 2 nicht. `show crypto ipsec sa` zeigt keine aktive ESP-SA, das Log bzw. `debug crypto ipsec` meldet, dass kein Proposal passt. `show crypto ipsec transform-set` zeigt AES-128 auf CE1 und AES-256 auf CE2.", "u": "Die Transform-Sets passen nicht zusammen (AES-128 gegen AES-256). Ohne gemeinsames Proposal entsteht keine IPsec-SA, deshalb verschlüsselt CE1 nichts und die Zähler bleiben bei 0.", "f": "Transform-Set auf beiden Seiten gleich konfigurieren.", "d": "- crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac\n+ crypto ipsec transform-set TS esp-aes 128 esp-sha256-hmac"}, {"l": "14", "n": 3, "dev": "CE1", "s": "Tunnel0 zeigt up/up (Keepalive nicht aktiv), aber nichts kommt an; `show crypto isakmp sa` bleibt leer.", "h": "`show interfaces Tunnel0` auf CE1 zeigt ein Tunnelziel, das es nicht gibt. Ein Ping auf diese Adresse scheitert.", "u": "Tunnelziel zeigt auf eine nicht existierende Adresse.", "f": "Tunnelziel auf 203.0.113.1 setzen.", "d": "- tunnel destination 203.0.113.1\n+ tunnel destination 203.0.113.11"}, {"l": "14", "n": 4, "dev": "CE2", "s": "Tunnel und IPsec stehen, aber OSPF-Nachbarschaft fehlt, LANs sind nicht erreichbar.", "h": "`show ip ospf interface brief` auf CE2 listet Tunnel0 nicht.", "u": "OSPF auf CE2 enthält das Tunnelnetz nicht; Tunnel0 nimmt nicht am Routing teil.", "f": "Tunnelnetz 172.16.0.0/30 in OSPF aufnehmen (oder `ip ospf 1 area 0` am Interface).", "d": "-  network 172.16.0.0 0.0.0.3 area 0"}, {"l": "14", "n": 5, "dev": "CE2", "s": "Tunnel flappt zyklisch, das Log zeigt `%TUN-5-RECURDOWN` (Tunnel Interface is Down, recursive routing).", "h": "Das Log zeigt `%TUN-5-RECURDOWN`. `show ip route <Tunnelziel>` auf CE1 zeigt einen Weg über Tunnel0, also über sich selbst.", "u": "CE2 kündigt das Transfernetz im Overlay-OSPF an; CE1 lernt es über den Tunnel und routet das Tunnelziel durch den eigenen Tunnel.", "f": "Transfernetz aus OSPF nehmen, nur Overlay und LANs im IGP.", "d": "-  network 192.168.2.0 0.0.0.255 area 0\n+  network 192.168.2.0 0.0.0.255 area 0\n+  network 203.0.113.0 0.0.0.3 area 0"}, {"l": "15", "n": 1, "dev": "xTR2", "s": "SITE2 wird auf dem MSMR nie als registriert angezeigt, H1 erreicht H2 nicht (Map-Reply negativ).", "h": "`show lisp site` auf dem MSMR zeigt SITE2 als nicht registriert. `debug lisp control-plane map-server-registration` meldet einen Authentisierungsfehler.", "u": "Der Authentifizierungs-Schlüssel auf xTR2 passt nicht zum Site-Key auf dem MSMR: Map-Register wird abgelehnt.", "f": "Key auf xTR2 anpassen.", "d": "- key LispKey123\n+ key LispFalsch"}, {"l": "15", "n": 2, "dev": "xTR1", "s": "xTR1 registriert sein EID-Netz nicht beim MSMR (SITE1 `no`), Rückverkehr von H2 funktioniert nicht.", "h": "`show lisp site` zeigt SITE1 mit „no“. `show ip lisp` auf xTR1 meldet die ETR-Funktion als deaktiviert.", "u": "`ipv4 etr` fehlt: Der Router übernimmt keine ETR-Funktion, sendet keine Map-Register und entkapselt nicht.", "f": "`ipv4 etr` aktivieren.", "d": "-   ipv4 etr"}, {"l": "15", "n": 3, "dev": "xTR2", "s": "Der MSMR zeigt SITE2 nicht registriert, im Log `EID-prefix not configured`.", "h": "Das Log auf dem MSMR meldet „EID-prefix not configured“. `show running-config | section router lisp` auf xTR2 zeigt ein anderes Präfix im `database-mapping`.", "u": "xTR2 registriert ein anderes EID-Präfix (192.168.22.0/24) als im MSMR-Site erlaubt.", "f": "`database-mapping` auf 192.168.2.0/24 korrigieren.", "d": "- database-mapping 192.168.2.0/24 locator-set RLOC\n+ database-mapping 192.168.22.0/24 locator-set RLOC"}, {"l": "15", "n": 4, "dev": "xTR1", "s": "H1 erreicht H2 nie, `show ip lisp map-cache` ist leer (keine Map-Requests).", "h": "`show ip lisp map-cache` auf xTR1 ist leer. `show ip lisp` zeigt keinen Map-Resolver.", "u": "Ohne `ipv4 itr map-resolver` weiß der ITR nicht, wen er für Mappings fragen soll.", "f": "Map-Resolver 10.0.99.1 eintragen.", "d": "-   ipv4 itr map-resolver 10.0.99.1"}, {"l": "16", "n": 1, "dev": "LEAF2", "s": "H1 und H2 im selben Subnetz erreichen sich nicht, `show nve vni` zeigt auf LEAF2 eine andere VNI.", "h": "`show nve vni` auf LEAF1 und LEAF2 vergleichen: VLAN 10 hängt an verschiedenen VNIs.", "u": "VLAN 10 ist auf LEAF2 auf VNI 10011 gemappt, auf LEAF1 auf 10010: Das Segment stimmt nicht überein.", "f": "VNI auf beiden Leafs identisch machen.", "d": "-   vn-segment 10010\n+   vn-segment 10011"}, {"l": "16", "n": 2, "dev": "LEAF1", "s": "`show nve peers` ist auf LEAF1 leer oder zeigt einen Peer ohne Verkehr.", "h": "`show nve peers` auf LEAF1 ist leer. `show running-config interface nve1` zeigt eine Peer-IP, die es nicht gibt.", "u": "Die Ingress-Replication-Peerliste zeigt auf eine falsche VTEP-Adresse.", "f": "Peer-IP auf 10.255.0.2 korrigieren.", "d": "-       peer-ip 10.255.0.2\n+       peer-ip 10.255.0.22"}, {"l": "16", "n": 3, "dev": "LEAF2", "s": "Die Verbindung steht nie, `show nve interface` zeigt `Admin down`.", "h": "`show nve interface` auf LEAF2 meldet „Admin down“.", "u": "Das NVE-Interface ist administrativ ausgeschaltet.", "f": "`no shutdown` am nve1.", "d": "- interface nve1\n-   no shutdown\n+ interface nve1\n+   shutdown"}, {"l": "16", "n": 4, "dev": "LEAF1", "s": "LEAF2 erreicht 10.255.0.1 nicht (Ping auf die VTEP-Adresse scheitert), NVE-Peer bleibt down.", "h": "`show ip route 10.255.0.1` auf LEAF2 findet nichts. `show ip ospf interface brief` auf LEAF1 listet Loopback0 nicht.", "u": "Die VTEP-Loopback wird nicht ins Underlay-OSPF aufgenommen: Der Gegen-VTEP hat keine Route.", "f": "`ip router ospf 1 area 0.0.0.0` an Loopback0 ergänzen.", "d": "- interface loopback0\n-   ip address 10.255.0.1/32\n-   ip router ospf 1 area 0.0.0.0\n+ interface loopback0\n+   ip address 10.255.0.1/32"}, {"l": "17", "n": 1, "dev": "R1", "s": "Die Klasse VOICE bleibt in `show policy-map interface` bei null Paketen, obwohl H1 mit DSCP 46 sendet.", "h": "`show policy-map interface` zeigt bei VOICE 0 Pakete. `show class-map VOICE` zeigt `match-all` mit zwei DSCP-Werten.", "u": "`match-all` mit zwei verschiedenen DSCP-Werten kann nie zutreffen (ein Paket hat genau einen DSCP).", "f": "`match-any` verwenden oder nur `match dscp ef` behalten.", "d": "- class-map match-any VOICE\n-  match dscp ef\n+ class-map match-all VOICE\n+  match dscp ef\n+  match dscp cs5"}, {"l": "17", "n": 2, "dev": "R1", "s": "Der WAN-Link wird überfüllt, Voice leidet, `show policy-map interface Gi0/1` zeigt keine Policy.", "h": "`show policy-map interface Gi0/1` zeigt keine Policy. `show running-config | include service-policy` findet sie unter Gi0/0.", "u": "Die Ausgangs-Policy hängt am LAN-Interface Gi0/0 statt am WAN-Interface Gi0/1; dort entsteht der Engpass.", "f": "Policy an Gi0/1 (output) binden.", "d": "- interface GigabitEthernet0/1\n-  service-policy output WAN\n+ interface GigabitEthernet0/0\n+  service-policy output WAN"}, {"l": "17", "n": 3, "dev": "R1", "s": "Der Durchsatz Richtung SRV bricht auf einen winzigen Bruchteil ein, Pings dauern extrem lang.", "h": "`show policy-map interface Gi0/1` zeigt eine Shaping-Rate von 20 000 bit/s, also 1 % des Sollwerts.", "u": "`shape average` erwartet bit/s. Eingetragen sind 20 000 bit/s statt 2 000 000 bit/s (2 Mbit/s), zwei Nullen fehlen.", "f": "Rate auf 2000000 korrigieren.", "d": "- shape average 2000000\n+ shape average 20000"}, {"l": "17", "n": 4, "dev": "R1", "s": "Der Gast (H3) wird als Voice klassifiziert und nimmt der echten Sprache die Priority-Queue weg.", "h": "`show policy-map interface` am LAN zeigt in der Gast-Klasse `set dscp ef`. In der Voice-Klasse am WAN tauchen Pakete von H3 auf.", "u": "Der Gast-Verkehr wird auf DSCP EF gesetzt statt auf Default und begrenzt: Missbrauch der Trust Boundary.", "f": "Auf `set dscp default` und einen Policer zurückstellen.", "d": "- policy-map MARK\n-  class GUEST-CM\n-   set dscp default\n-   police rate 256000 bps conform-action transmit exceed-action drop\n+ policy-map MARK\n+  class GUEST-CM\n+   set dscp ef"}, {"l": "18", "n": 1, "dev": "R1", "s": "`show flow monitor MON cache` ist leer, obwohl Verkehr läuft; der Exporter zählt keine Pakete.", "h": "`show flow monitor MON cache` ist leer. `show flow interface` zeigt den Monitor an keinem Interface.", "u": "Der Flow-Monitor ist auf keinem Interface aktiviert.", "f": "`ip flow monitor MON input|output` am Interface Gi0/0 setzen.", "d": "-  ip flow monitor MON input\n-  ip flow monitor MON output"}, {"l": "18", "n": 2, "dev": "R1", "s": "Im Flow-Cache stehen nur noch Einträge je Host-Paar und Protokoll, Anwendungen (Ports) lassen sich nicht unterscheiden.", "h": "`show flow record` zeigt keine `match transport`-Felder. Im Cache gibt es pro Host-Paar und Protokoll nur eine Zeile.", "u": "Der Record enthält keine Transport-Port-Key-Felder, daher werden alle Flows zwischen zwei Hosts zusammengefasst.", "f": "`match transport source-port/destination-port` im Record ergänzen (Monitor-Zuordnung beachten: Record ändern geht nur ohne aktive Anwendung).", "d": "-  match transport source-port\n-  match transport destination-port"}, {"l": "18", "n": 3, "dev": "SW2", "s": "ANA2 sieht nichts vom RSPAN-Verkehr von H2, lokales SPAN auf SW1 funktioniert.", "h": "`show interfaces trunk` auf SW2 zeigt VLAN 999 nicht bei den erlaubten VLANs.", "u": "Das Remote-VLAN 999 ist am SW2-Trunk nicht erlaubt: Die gespiegelten Frames kommen nicht an.", "f": "VLAN 999 in der Allowed-Liste ergänzen.", "d": "- interface GigabitEthernet0/0\n-  switchport mode trunk\n-  switchport nonegotiate\n-  switchport trunk allowed vlan 10,999\n+ interface GigabitEthernet0/0\n+  switchport mode trunk\n+  switchport nonegotiate\n+  switchport trunk allowed vlan 10"}, {"l": "18", "n": 4, "dev": "SW1", "s": "ANA1 sieht H1-Verkehr nicht, `show monitor session 1` zeigt ein anderes Ziel.", "h": "`show monitor session 1` auf SW1 zeigt einen anderen Zielport als den, an dem ANA1 hängt.", "u": "Das SPAN-Ziel zeigt auf Gi1/3, ANA1 hängt aber an Gi1/2.", "f": "Ziel-Port auf Gi1/2 setzen.", "d": "- monitor session 1 destination interface GigabitEthernet1/2\n+ monitor session 1 destination interface GigabitEthernet1/3"}, {"l": "19", "n": 1, "dev": "CSR1", "s": "RESTCONF-Aufrufe liefern `401 Unauthorized`, obwohl Benutzer und Passwort stimmen.", "h": "Die API antwortet mit 401. `show running-config | include ip http` zeigt keine Zeile `ip http authentication local`.", "u": "Ohne `ip http authentication local` prüft der HTTP-Server nicht gegen lokale Benutzer.", "f": "`ip http authentication local` setzen.", "d": "- ip http authentication local"}, {"l": "19", "n": 2, "dev": "CSR1", "s": "Die NETCONF-Verbindung auf Port 830 wird abgelehnt (`Connection refused`).", "h": "Die Verbindung auf Port 830 wird abgelehnt. `show netconf-yang status` meldet NETCONF als deaktiviert, oder `netconf-yang` fehlt in der Konfiguration.", "u": "NETCONF-YANG ist nicht aktiviert, der SSH-Subsystem-Listener auf 830 fehlt.", "f": "`netconf-yang` aktivieren.", "d": "- netconf-yang"}, {"l": "19", "n": 3, "dev": "CSR1", "s": "`curl https://…/restconf/` hängt oder bricht mit Connection refused ab, SSH funktioniert.", "h": "`curl` bekommt keine Verbindung. `show ip http server secure status` meldet den HTTPS-Server als deaktiviert.", "u": "HTTPS-Server ist ausgeschaltet; RESTCONF braucht `ip http secure-server`.", "f": "`ip http secure-server` aktivieren.", "d": "- ip http secure-server"}, {"l": "19", "n": 4, "dev": "CSR1", "s": "Beim Link-Flap auf Gi2 erscheint die EEM-Syslog-Zeile nie, `show event manager policy registered` zeigt das Applet.", "h": "`show event manager history events` zeigt kein ausgelöstes Ereignis. Vergleiche das Pattern mit dem echten Text in `show logging`.", "u": "Das Pattern nutzt die Kurzform `Gi2`, der Syslog-Text enthält `GigabitEthernet2`.", "f": "Pattern auf den vollständigen Interface-Namen anpassen.", "d": "- event syslog pattern \"Interface GigabitEthernet2, changed state\"\n+ event syslog pattern \"Interface Gi2, changed state\""}, {"l": "19", "n": 5, "dev": "R2", "s": "`show track 1` auf CSR1 ist Down (IP SLA 2.2.2.2 schlägt fehl), R2 antwortet nicht.", "h": "`show ip sla statistics` auf CSR1 meldet Timeouts. `show ip route 0.0.0.0` auf R2 zeigt einen Next-Hop, den es nicht gibt.", "u": "R2 hat die Rückroute zu CSR1 verfehlt: Default-Route zeigt auf eine falsche Adresse, Echo-Reply kann nicht zurück.", "f": "Default-Route auf 10.0.12.1 korrigieren.", "d": "- ip route 0.0.0.0 0.0.0.0 10.0.12.1\n+ ip route 0.0.0.0 0.0.0.0 10.0.12.11"}, {"l": "23", "n": 1, "dev": "SW1", "s": "H20 erreicht seinen Gateway nicht, H10 schon. Von R1 aus ist 10.10.20.12 nicht erreichbar.", "h": "`show interfaces trunk` auf SW1: Beim Trunk zu R1 fehlt VLAN 20 in „Vlans allowed on trunk“.", "u": "Auf dem Trunk SW1 Gi0/0 (zum HSRP-Active R1) ist nur VLAN 10 erlaubt: Das VLAN 20 erreicht R1 nicht.", "f": "`switchport trunk allowed vlan 10,20` auf SW1 Gi0/0 (oder `add 20`).", "d": "- interface GigabitEthernet0/0\n-  switchport mode trunk\n-  switchport nonegotiate\n-  switchport trunk allowed vlan 10,20\n+ interface GigabitEthernet0/0\n+  switchport mode trunk\n+  switchport nonegotiate\n+  switchport trunk allowed vlan 10"}, {"l": "23", "n": 2, "dev": "R2", "s": "Nach dem Reparieren des Trunks melden in VLAN 10 beide Router `Active`. `show standby brief` auf R1 und R2 zeigt jeweils `Active` und keinen Standby-Partner; Hosts erhalten ARP-Antworten verschiedener Router.", "h": "`show standby brief` auf R1 und R2 zeigt jeweils Active ohne Standby-Partner. `show standby` zeigt auf R2 Version 1, auf R1 Version 2.", "u": "R2 verwendet auf dem Subinterface .10 HSRP Version 1, R1 Version 2: die Router sprechen unterschiedliche Multicast-Adressen (224.0.0.2 / 224.0.0.102) und sehen sich nicht.", "f": "`standby version 2` auf R2 `Gi0/0.10` ergänzen.", "d": "-  standby version 2\n-  standby 10 ip 10.10.10.1\n+  standby 10 ip 10.10.10.1"}, {"l": "23", "n": 3, "dev": "EDGE", "s": "Alles funktioniert, aber beim Test (Abschalten von R1) verlieren alle Hosts das Internet, obwohl R2 HSRP Active wird. `show ip ospf neighbor` auf EDGE zeigt nur R1.", "h": "`show ip ospf neighbor` auf EDGE listet nur R1. `show ip protocols` auf EDGE führt Gi0/1 unter „Passive Interface(s)“.", "u": "EDGE belässt Gi0/1 (zu R2) passiv: Es gibt keine OSPF-Nachbarschaft zu R2 und damit keinen Rückweg über R2.", "f": "`no passive-interface GigabitEthernet0/1` unter `router ospf 1` auf EDGE.", "d": "-  no passive-interface GigabitEthernet0/1"}, {"l": "23", "n": 4, "dev": "EDGE", "s": "H10 erreicht 8.8.8.8, H20 nicht, obwohl das Routing stimmt. `show ip nat translations` enthält nur Einträge aus 10.10.10.x.", "h": "`show ip nat translations` enthält nur Adressen aus 10.10.10.x. `show access-lists` zeigt, dass die NAT-ACL nur 10.10.10.0/24 erlaubt.", "u": "Die NAT-ACL erlaubt nur 10.10.10.0/24: Pakete aus VLAN 20 werden nicht übersetzt und mit privater Quelladresse verworfen.", "f": "ACL auf `10.10.0.0 0.0.255.255` (oder zweite Zeile für VLAN 20).", "d": "- access-list 1 permit 10.10.0.0 0.0.255.255\n+ access-list 1 permit 10.10.10.0 0.0.0.255"}, {"l": "23", "n": 5, "dev": "R1", "s": "H20 kann H10 anpingen, obwohl die Segmente getrennt sein sollen. `show access-lists` zeigt keine Treffer auf der deny-Zeile.", "h": "`show access-lists` auf R1 zeigt Treffer auf `permit ip any any`, die `deny`-Zeile darunter bleibt bei 0.", "u": "Die ACL wird von oben nach unten geprüft: `permit ip any any` steht vor dem `deny`, die deny-Zeile wird nie erreicht.", "f": "Reihenfolge ändern (ACL entfernen und mit `deny` zuerst neu anlegen, oder Sequenznummern nutzen).", "d": "-  deny ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255\n-  permit ip any any\n+  permit ip any any\n+  deny ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255"}, {"l": "23", "n": 6, "dev": "SW2", "s": "`show spanning-tree root` zeigt für VLAN 10 und 20 SW2 als Root, Design verlangt SW1. Der Verkehr der Hosts nimmt einen Umweg, SW1 hat `Root port Po1`.", "h": "`show spanning-tree root` zeigt SW2 als Root. `show spanning-tree vlan 10` auf SW2 nennt Priorität 0 plus VLAN-ID.", "u": "SW2 hat Priorität 0 (statt 61440) und gewinnt die Root-Wahl im Access-Bereich: Das Spanning Tree weicht vom Design ab.", "f": "Priorität auf 61440 zurücksetzen (und per `spanning-tree vlan 10,20 root primary` oder Root Guard schützen).", "d": "- spanning-tree vlan 10,20 priority 61440\n+ spanning-tree vlan 10,20 priority 0"}, {"l": "23", "n": 7, "dev": "SW2", "s": "Po1 bündelt nicht: `show etherchannel summary` zeigt auf SW1 `(s)`/`(I)`-Ports, die Verbindung zu H10 und H20 ist unzuverlässig oder fällt ganz aus.", "h": "`show etherchannel summary` auf SW1 zeigt Ports mit `(s)` oder `(I)`. Auf SW2 steht der Modus `on`, auf SW1 `active`.", "u": "SW1 verhandelt per LACP (`active`), SW2 steht auf `on` und sendet keine LACPDUs: Die Seiten finden nicht zusammen.", "f": "`channel-group 1 mode passive` (oder `active`) auf SW2, beide Seiten LACP.", "d": "-  channel-group 1 mode passive\n+  channel-group 1 mode on"}, {"l": "23", "n": 8, "dev": "R2", "s": "`show ntp status` auf R2: `Clock is unsynchronized`, R1 ist synchron. `show ntp associations` zeigt Reach 0.", "h": "`show ntp associations` auf R2 zeigt Reach 0 zu einer Adresse, die es nicht gibt.", "u": "Tippfehler in der NTP-Server-Adresse (…33 statt …3).", "f": "`ntp server 10.255.0.3` auf R2.", "d": "- ntp server 10.255.0.3\n+ ntp server 10.255.0.33"}, {"l": "23", "n": 9, "dev": "R2", "s": "SSH von R1 auf R2 wird abgewiesen (`Connection refused by remote host`), Telnet dagegen geht.", "h": "`show running-config | section line vty` auf R2 zeigt `transport input telnet`.", "u": "`transport input telnet` erlaubt auf den vty-Lines kein SSH, und Telnet überträgt Zugangsdaten im Klartext.", "f": "`transport input ssh` auf R2 `line vty 0 4`.", "d": "-  login local\n-  transport input ssh\n+  login local\n+  transport input telnet"}, {"l": "23", "n": 10, "dev": "EDGE", "s": "H10/H20 erreichen 8.8.8.8 nicht. EDGE erreicht den ISP, R1 und R2 haben aber keine Default-Route (`show ip route 0.0.0.0` → `Network not in table`).", "h": "`show ip route 0.0.0.0` auf R1 meldet „Network not in table“. `show running-config | section router ospf` auf EDGE zeigt kein `default-information originate`.", "u": "EDGE gibt die statische Default-Route nicht per OSPF weiter: `default-information originate` fehlt.", "f": "`default-information originate` unter `router ospf 1` auf EDGE.", "d": "-  default-information originate"}, {"l": "24", "n": 1, "dev": "R1", "s": "Die BGP-Session R1–ISP kommt nicht hoch (`Idle`/`Active`), im Log steht `%BGP-3-NOTIFICATION: sent to neighbor 198.51.100.2 2/2 (peer in wrong AS)`.", "h": "Das Log zeigt `peer in wrong AS`. `show ip bgp summary` auf R1 nennt beim ISP-Nachbarn eine andere AS als die echte.", "u": "Auf R1 ist der Nachbar-AS mit 65010 statt 65000 konfiguriert.", "f": "`neighbor 198.51.100.2 remote-as 65000`.", "d": "-  neighbor 198.51.100.2 remote-as 65000\n+  neighbor 198.51.100.2 remote-as 65010"}, {"l": "24", "n": 2, "dev": "R2", "s": "R1 lernt das Transportnetz von R2 nicht (`show ip bgp` ohne 203.0.113.0/30), R1 erreicht 203.0.113.1 nicht, der Tunnel kommt von R1 aus nicht hoch.", "h": "`show ip bgp` auf R1 enthält 203.0.113.0/30 nicht. `show running-config | section router bgp` auf R2 zeigt kein `network`-Statement dafür.", "u": "R2 kündigt sein Transportnetz nicht an: `network 203.0.113.0 mask 255.255.255.252` fehlt.", "f": "`network`-Statement unter `router bgp 65002` ergänzen.", "d": "-  network 203.0.113.0 mask 255.255.255.252"}, {"l": "24", "n": 3, "dev": "ISP", "s": "R2 erreicht 198.51.100.1 nicht: Im BGP-Table von R2 fehlt 198.51.100.0/30, obwohl R1 es ankündigt. Beim ISP steht der Prefix in `show ip bgp neighbors 198.51.100.1 received-routes`, nicht aber im Table.", "h": "`show ip bgp neighbors 198.51.100.1 received-routes` auf dem ISP zeigt das Präfix, `show ip bgp` nicht. Die Prefix-List in der Eingangsrichtung nennt ein anderes Netz.", "u": "Die eingehende Prefix-Liste des ISP für R1 erlaubt den falschen Prefix (198.51.100.4/30): R1s Ankündigung wird verworfen.", "f": "Prefix-Liste auf `198.51.100.0/30` korrigieren und `clear ip bgp 198.51.100.1 soft in`.", "d": "- ip prefix-list FROM-R1 seq 5 permit 198.51.100.0/30\n+ ip prefix-list FROM-R1 seq 5 permit 198.51.100.4/30"}, {"l": "24", "n": 4, "dev": "R1", "s": "Nach der Underlay-Korrektur ist Tunnel0 auf R1 `up/up`, aber R2 sieht keinen Tunnel-Verkehr und `show crypto isakmp sa` ist leer.", "h": "`show interfaces Tunnel0` auf R1 zeigt als Ziel die Adresse des ISP, nicht die von R2.", "u": "Die Tunnel-Destination auf R1 zeigt auf die Adresse des ISP statt auf R2: GRE-Pakete landen beim ISP und werden dort nicht weiterverarbeitet.", "f": "`tunnel destination 203.0.113.1`.", "d": "-  tunnel destination 203.0.113.1\n+  tunnel destination 203.0.113.2"}, {"l": "24", "n": 5, "dev": "R2", "s": "`show crypto isakmp sa` bleibt in `MM_KEY_EXCH`/`MM_NO_STATE`, der OSPF-Nachbar fehlt, Pings durch den Tunnel scheitern.", "h": "`show crypto isakmp sa` bleibt in MM_KEY_EXCH oder MM_NO_STATE. `debug crypto isakmp` meldet einen Fehler bei der Authentisierung.", "u": "Der Pre-shared Key auf R2 weicht von R1 ab (LabKey321 vs. LabKey123): Phase 1 scheitert bei der Authentifizierung.", "f": "PSK auf beiden Seiten angleichen.", "d": "- crypto isakmp key LabKey123 address 198.51.100.1\n+ crypto isakmp key LabKey321 address 198.51.100.1"}, {"l": "24", "n": 6, "dev": "R2", "s": "Nach der IPsec-Korrektur bleibt der OSPF-Nachbar in `EXSTART`/`EXCHANGE` hängen (`%OSPF-5-ADJCHG` wechselt, `Neighbor ... stuck`).", "h": "`show ip ospf neighbor` zeigt EXSTART oder EXCHANGE. `show ip interface Tunnel0 | include MTU` zeigt auf R1 1400, auf R2 1476.", "u": "MTU-Mismatch: R1 hat Tunnel-MTU 1400, R2 den Standard (1476): OSPF verwirft die DBD-Pakete.", "f": "`ip mtu 1400` auf Tunnel0 von R2.", "d": "-  ip mtu 1400"}, {"l": "24", "n": 7, "dev": "R2", "s": "Nach der MTU-Korrektur kommt noch immer kein OSPF-Nachbar hoch; das Log meldet `%OSPF-4-ERRRCV: Received invalid packet: Mismatch Authentication Key`.", "h": "Das Log meldet „Mismatch Authentication Key“. `show ip ospf interface Tunnel0` zeigt auf beiden Seiten MD5, die Keys vergleichst du in der Konfiguration.", "u": "Der MD5-Key auf R2 weicht ab: OSPF verwirft jedes Paket.", "f": "Gleichen Key `OspfKey` auf beiden Seiten setzen.", "d": "-  ip ospf message-digest-key 1 md5 OspfKey\n+  ip ospf message-digest-key 1 md5 OspfKey2"}, {"l": "24", "n": 8, "dev": "R2", "s": "OSPF-Nachbar `FULL`, aber H1 erreicht H2 nicht; R1 hat keine Route nach 192.168.2.0/24.", "h": "`show ip route 192.168.2.0` auf R1 findet nichts. `show ip ospf interface brief` auf R2 listet das LAN nicht.", "u": "R2 bindet sein LAN nicht in OSPF ein: Das Netz wird nicht angekündigt.", "f": "`network 192.168.2.0 0.0.0.255 area 0` unter `router ospf 1` auf R2.", "d": "-  network 192.168.2.0 0.0.0.255 area 0"}, {"l": "24", "n": 9, "dev": "R1", "s": "H3 (Gast) pingt H1 erfolgreich und sogar 10.99.0.2. `show ip route vrf GUEST` ist leer, die Gast-LAN liegt in der globalen Routing-Tabelle.", "h": "`show ip vrf interfaces` auf R1 listet Gi0/2 nicht unter GUEST.", "u": "Gi0/2 gehört nicht zum VRF GUEST: Es gibt keine Isolation, das Interface nutzt die globale Tabelle.", "f": "`ip vrf forwarding GUEST` am Interface, danach IP neu setzen.", "d": "-  ip vrf forwarding GUEST"}, {"l": "25", "n": 1, "dev": "R2", "s": "R1 und R2 bilden keine Nachbarschaft (`show ip eigrp neighbors` leer am Link); `debug eigrp packets` meldet einen Authentifizierungsfehler.", "h": "`debug eigrp packets` auf R1 oder R2 meldet „authentication mismatch“. `show key chain` zeigt auf beiden Seiten verschiedene Key-Strings.", "u": "Der Schlüssel in der Key-Chain von R2 weicht von R1 ab (EigrpKez statt EigrpKey).", "f": "Key-String auf beiden Seiten angleichen.", "d": "-   key-string EigrpKey\n+   key-string EigrpKez"}, {"l": "25", "n": 2, "dev": "R3", "s": "R3 hat keine Nachbarn: `show ip eigrp neighbors` ist leer, auf R1 und R2 steht `K-value mismatch`.", "h": "Das Log auf R1 und R2 meldet „K-value mismatch“. `show ip protocols` auf R3 zeigt andere Metrik-Gewichte.", "u": "R3 verwendet andere K-Werte (K2 aktiv). EIGRP-Nachbarn müssen identische Metrik-Gewichte haben.", "f": "`metric weights` auf R3 entfernen (Standard 0 1 0 1 0 0).", "d": "-  no auto-summary\n+  no auto-summary\n+  metric weights 0 1 1 1 0 0"}, {"l": "25", "n": 3, "dev": "R4", "s": "R4 hat keinen Nachbarn zu R2, 192.168.4.0/24 fehlt überall.", "h": "`show ip protocols` auf R4 zeigt AS 101, auf R2 AS 100.", "u": "R4 läuft in AS 101, die anderen Router in AS 100: Nachbarschaft nur innerhalb gleicher AS.", "f": "`router eigrp 100` auf R4 (Konfiguration übernehmen).", "d": "- router eigrp 100\n+ router eigrp 101"}, {"l": "25", "n": 4, "dev": "R1", "s": "R3 zeigt für das 172.16er-Netz zwei verschiedene Routen: `172.16.0.0/22` (über R2) und `172.16.0.0/23` (direkt von R1). Verkehr in 172.16.2.0/24 nimmt den Umweg.", "h": "`show ip route 172.16.0.0` auf R3 zeigt zwei Summaries mit verschiedener Maske. Die Konfiguration von R1 zeigt an Gi0/1 `summary-address` mit /23.", "u": "Die Summary-Maske auf R1 Gi0/1 ist /23 statt /22: R3 bekommt direkt eine andere, zu kleine Summary.", "f": "Maske 255.255.252.0 auf Gi0/1.", "d": "- interface GigabitEthernet0/1\n-  ip summary-address eigrp 100 172.16.0.0 255.255.252.0\n+ interface GigabitEthernet0/1\n+  ip summary-address eigrp 100 172.16.0.0 255.255.254.0"}, {"l": "25", "n": 5, "dev": "R4", "s": "Nach Behebung der Nachbarschaft: R1 erreicht 192.168.4.1 nicht, obwohl R4 Nachbar von R2 ist.", "h": "`show ip route 192.168.4.0` auf R2 findet nichts. `show ip protocols` auf R4 nennt „Stub, receive-only“.", "u": "`receive-only` unterdrückt jegliche Ankündigung: R4 bewirbt auch das direkt verbundene Netz nicht.", "f": "`eigrp stub connected`.", "d": "-  eigrp stub connected\n+  eigrp stub receive-only"}, {"l": "25", "n": 6, "dev": "R2", "s": "R2 und R3 sind direkt verbunden, aber `show ip eigrp neighbors` auf R2 zeigt R3 nicht (Nachbarschaft nur über R1).", "h": "`show ip eigrp interfaces` auf R2 listet Gi0/1 nicht. `show ip protocols` führt es als passiv.", "u": "Der Link zu R3 ist auf R2 passiv: Es werden keine Hellos gesendet.", "f": "`no passive-interface GigabitEthernet0/1` unter `router eigrp 100` auf R2.", "d": "-  no passive-interface GigabitEthernet0/1"}, {"l": "26", "n": 1, "dev": "R1, R3", "s": "Die iBGP-Session R1–R3 bleibt `Active`/`Idle`, auf R1 steht R3 nicht im Zustand `Established`. R1–R2 läuft.", "h": "Vergleiche die Neighbor-Konfiguration für R2 und R3 auf R1 (`show run | section bgp`): Bei R3 fehlt `update-source`. Auf R3 fehlt es ebenso. `debug ip bgp` zeigt Verbindungsversuche von 10.0.13.1 und 10.0.13.2, erwartet werden 10.255.0.1 und 10.255.0.3.", "u": "Auf beiden Seiten fehlt `update-source Loopback0`. Jede Seite baut die TCP-Verbindung von ihrer Link-Adresse auf, die Gegenseite kennt aber nur die Loopback als Nachbarn und verwirft den Versuch. Fehlt es nur auf einer Seite, kommt die Sitzung meist trotzdem hoch, weil die andere Seite von ihrer Loopback aus verbindet.", "f": "Auf R1 `neighbor 10.255.0.3 update-source Loopback0`, auf R3 `neighbor 10.255.0.1 update-source Loopback0`.", "d": "  ! R1\n-  neighbor 10.255.0.3 update-source Loopback0\n  ! R3\n-  neighbor 10.255.0.1 update-source Loopback0"}, {"l": "26", "n": 2, "dev": "R2", "s": "R1 und R3 listen die Prefixe von ISP1 mit Next-Hop 192.0.2.2 ohne `>` (nicht Best), `show ip bgp` zeigt `inaccessible`.", "h": "`show ip bgp` auf R1 und R3 zeigt die ISP1-Präfixe ohne `>`. `show ip bgp <Präfix>` meldet den Next-Hop 192.0.2.2 als „inaccessible“.", "u": "Der Next-Hop der eBGP-Routen (192.0.2.2) liegt nicht im IGP; ohne `next-hop-self` kann der RR/R3 ihn nicht auflösen.", "f": "`next-hop-self` auf R2 Richtung R1.", "d": "-  neighbor 10.255.0.1 next-hop-self"}, {"l": "26", "n": 3, "dev": "R2", "s": "Der Verkehr zu 203.0.113.0/24 verlässt das AS über ISP2, obwohl ISP1 bevorzugt sein soll.", "h": "`show ip bgp 203.0.113.0` auf R1 zeigt beim ISP1-Pfad Local Preference 50, beim ISP2-Pfad 100.", "u": "Local-Pref 50 auf den ISP1-Routen: Die ISP2-Route (Standard 100) gewinnt.", "f": "`set local-preference 200` in `ISP1-IN`.", "d": "-  set local-preference 200\n+  set local-preference 50"}, {"l": "26", "n": 4, "dev": "R1", "s": "R3 zeigt `show ip bgp community 65001:100` leer, obwohl R2 die Community setzt und R1 sie hat.", "h": "`show ip bgp community 65001:100` auf R3 ist leer, auf R1 nicht. `show ip bgp neighbors 10.255.0.3 | include Community` auf R1 zeigt, dass keine Communities gesendet werden.", "u": "R1 sendet Communities nicht an R3 (`send-community` fehlt).", "f": "`neighbor 10.255.0.3 send-community` auf R1.", "d": "-  neighbor 10.255.0.3 send-community"}, {"l": "26", "n": 5, "dev": "R3", "s": "Die eBGP-Session R3–ISP2 steht auf `Idle`; im Log `Notification … (peer in wrong AS)`.", "h": "Das Log auf R3 meldet „peer in wrong AS“. `show ip bgp summary` nennt bei ISP2 eine falsche AS.", "u": "Falsche AS-Nummer des Nachbarn auf R3.", "f": "`remote-as 65200`.", "d": "-  neighbor 192.0.2.6 remote-as 65200\n+  neighbor 192.0.2.6 remote-as 65201"}, {"l": "26", "n": 6, "dev": "R2", "s": "R1 und R3 erreichen 10.255.0.2 nicht, die iBGP-Session zu R2 bleibt unten, obwohl der Link steht.", "h": "`show ip route 10.255.0.2` auf R1 findet nichts. `show ip ospf interface brief` auf R2 listet die Loopback nicht.", "u": "Die OSPF-Wildcard 0.0.255.255 erfasst nur 10.0.x.x: Die Loopback 10.255.0.2 liegt nicht im Prozess.", "f": "Wildcard 0.255.255.255 oder eigenes `network` für die Loopback.", "d": "-  network 10.0.0.0 0.255.255.255 area 0\n+  network 10.0.0.0 0.0.255.255 area 0"}, {"l": "27", "n": 1, "dev": "R2", "s": "R4 lernt über R2 keine OSPF-Routen; `show ip route` auf R4 zeigt 10.1.0.0/24 nur (falls überhaupt) über R3.", "h": "`show ip route` auf R4 zeigt die OSPF-Netze nicht über R2. `show ip eigrp topology` auf R2 meldet sie mit unendlicher Metrik, weil kein `metric` beim `redistribute` steht.", "u": "Beim Einspeisen in EIGRP fehlt die Seed-Metrik: Die Routen haben eine unendliche Metrik und werden nicht übernommen.", "f": "Metrik angeben (`metric 10000 100 255 1 1500`) oder `default-metric` setzen.", "d": "-  redistribute ospf 1 metric 10000 100 255 1 1500 route-map O2E\n+  redistribute ospf 1 route-map O2E"}, {"l": "27", "n": 2, "dev": "R3", "s": "Über R3 erscheinen keine EIGRP-Netze in OSPF; R1 sieht 10.4.0.0/24 nur über R2 mit Metrik 20.", "h": "`show ip ospf database external` auf R1 enthält keine Netze von R3. In der Konfiguration von R3 fehlt `subnets`.", "u": "Ohne `subnets` redistribuiert OSPF nur klassische Netze, die /24-Subnetze werden verworfen.", "f": "`subnets` ergänzen.", "d": "-  redistribute eigrp 100 subnets route-map E2O\n+  redistribute eigrp 100 route-map E2O"}, {"l": "27", "n": 3, "dev": "R3", "s": "Auf R4 und R3 pendelt 10.1.0.0/24 zwischen den Domänen, R1 sieht die eigene Route als `O E2` mit Tag 2 zurück (Rückkopplung).", "h": "`show ip route 10.1.0.0` auf R1 zeigt eine externe Route mit Tag 2. Die Route-Map E2O auf R3 enthält keine Zeile `match tag 1`.", "u": "Der Filter erkennt den Tag 1 nicht: Aus OSPF stammende, in EIGRP gesehene Routen werden von R3 erneut nach OSPF gegeben.", "f": "`match tag 1` in `E2O` auf R3.", "d": "- route-map E2O deny 10\n-  match tag 1\n+ route-map E2O deny 10\n+  match tag 9"}, {"l": "27", "n": 4, "dev": "R2", "s": "R1 lernt 10.4.1.0/24, obwohl das Netz lokal bleiben sollte.", "h": "`show ip route 10.4.1.0` auf R1 zeigt die Route. `show ip prefix-list` auf R2 nennt ein anderes Netz.", "u": "Die Prefix-Liste enthält das falsche Netz (10.4.2.0/24); 10.4.1.0/24 wird nicht gefiltert.", "f": "Prefix auf 10.4.1.0/24 korrigieren.", "d": "- ip prefix-list LOCAL-ONLY seq 5 permit 10.4.1.0/24\n+ ip prefix-list LOCAL-ONLY seq 5 permit 10.4.2.0/24"}, {"l": "27", "n": 5, "dev": "R4", "s": "R3 und R4 haben keine EIGRP-Nachbarschaft; R4 erreicht OSPF-Netze nur über R2.", "h": "`show ip eigrp neighbors` auf R4 listet R3 nicht. `show ip eigrp interfaces` auf R4 zeigt den Link zu R3 nicht.", "u": "Der Link R3–R4 ist auf R4 nicht im EIGRP-Prozess (`network` fehlt).", "f": "`network 10.0.34.0 0.0.0.3` auf R4.", "d": "-  network 10.0.34.0 0.0.0.3"}, {"l": "27", "n": 6, "dev": "R3", "s": "R1 und R3 bilden keine OSPF-Nachbarschaft; im Log `Mismatched Area ID`/hängt in `INIT`.", "h": "Das Log meldet „Mismatched Area ID“. `show ip ospf interface brief` auf R1 und R3 zeigt für den Link verschiedene Areas.", "u": "Der Link liegt auf R3 in Area 1, auf R1 in Area 0.", "f": "Area 0 auf R3.", "d": "-  network 10.0.13.0 0.0.0.3 area 0\n+  network 10.0.13.0 0.0.0.3 area 1"}, {"l": "28", "n": 1, "dev": "R3", "s": "R2 und R3 bilden keine Nachbarschaft; `debug ip ospf adj` zeigt `Hello from … with mismatched Stub/Transit area option bit`.", "h": "`debug ip ospf adj` zeigt „mismatched Stub/Transit area option bit“. `show ip ospf` auf R3 führt Area 1 als normale Area.", "u": "Auf R3 fehlt `area 1 stub`: Die Area-Typen weichen ab (E-Bit).", "f": "`area 1 stub` auf R3.", "d": "-  area 1 stub"}, {"l": "28", "n": 2, "dev": "R2", "s": "R1 sieht drei einzelne Routen 192.168.1.0/24, 192.168.2.0/24, 192.168.3.0/24 und nur 192.168.0.0/24 als Summary.", "h": "`show ip route ospf` auf R1 zeigt drei einzelne /24 und ein Summary für nur ein /24. Die `area range` auf R2 hat die Maske 255.255.255.0.", "u": "Der Range deckt nur 192.168.0.0/24 ab, die anderen Netze werden einzeln ausgegeben.", "f": "Maske 255.255.252.0 im `area range`.", "d": "-  area 1 range 192.168.0.0 255.255.252.0\n+  area 1 range 192.168.0.0 255.255.255.0"}, {"l": "28", "n": 3, "dev": "R1", "s": "R1 und R2 sind in `INIT`/ohne Nachbarschaft, Log: `Mismatched Authentication key`.", "h": "Das Log meldet „Mismatched Authentication Key“. `show ip ospf interface` zeigt auf beiden Seiten MD5, die Passwörter vergleichst du in der Konfiguration.", "u": "Das MD5-Passwort auf R1 weicht von R2 ab.", "f": "Passwort angleichen.", "d": "-  ip ospf message-digest-key 1 md5 OspfKey\n+  ip ospf message-digest-key 1 md5 OspfKez"}, {"l": "28", "n": 4, "dev": "R4", "s": "172.31.0.0/24 fehlt in Area 0, R1 sieht keine externe Route.", "h": "`show ip ospf database external` enthält 172.31.0.0 nicht. Die Konfiguration auf R4 zeigt `redistribute static` ohne `subnets`.", "u": "Ohne `subnets` wird das /24-Netz nicht redistribuiert (nur klassische Netze).", "f": "`redistribute static subnets`.", "d": "-  redistribute static subnets\n+  redistribute static"}, {"l": "28", "n": 5, "dev": "R4", "s": "R4 hat keinen OSPF-Nachbarn zu R2, obwohl der Link steht.", "h": "`show ip ospf neighbor` auf R4 ist leer. `show ip protocols` führt Gi0/0 als passiv.", "u": "Das Uplink-Interface von R4 ist passiv: Es werden keine Hellos gesendet.", "f": "`no passive-interface GigabitEthernet0/0` auf R4.", "d": "-  no passive-interface GigabitEthernet0/0"}, {"l": "28", "n": 6, "dev": "R2", "s": "R3 trägt trotz Stub-Area alle Inter-Area-Routen (O IA) statt nur der Default-Route.", "h": "`show ip route` auf R3 zeigt O-IA-Routen. `show ip ospf` auf R2 nennt Area 1 als Stub, aber nicht „no summary“.", "u": "Ohne `no-summary` sendet der ABR weiter Typ-3-LSAs in die Area: nur Stub, nicht Totally Stubby.", "f": "`area 1 stub no-summary` auf dem ABR.", "d": "-  area 1 stub no-summary\n+  area 1 stub"}, {"l": "29", "n": 1, "dev": "R1", "s": "H2 und Web-Verkehr gehen über Provider A; `show ip policy` ist leer.", "h": "`show ip policy` ist leer. `show ip interface Gi0/2 | include policy` meldet keine Policy.", "u": "Die Route-Map ist nicht am Eingangs-Interface Gi0/2 aktiviert.", "f": "`ip policy route-map PBR` unter Gi0/2.", "d": "-  ip policy route-map PBR"}, {"l": "29", "n": 2, "dev": "R1", "s": "H2 nimmt den normalen Weg, die Zähler der Sequenz 10 bleiben 0.", "h": "`show route-map PBR` zeigt bei Sequenz 10 null Treffer. `show access-lists` zeigt die Host-Adresse .21 statt .12.", "u": "Die ACL trifft die falsche Quelladresse (10.1.0.21).", "f": "Host-Adresse auf 10.1.0.12 korrigieren.", "d": "-  permit ip host 10.1.0.12 any\n+  permit ip host 10.1.0.21 any"}, {"l": "29", "n": 3, "dev": "R1", "s": "H2 geht über Provider A, obwohl Sequenz 10 auf `permit` steht und in `show route-map PBR` Treffer zählt.", "h": "`show route-map PBR` zeigt bei Sequenz 10 den Next-Hop 10.0.31.2. `show ip route 10.0.31.2` liefert nur die Default über R2: Die Adresse liegt in keinem angeschlossenen Netz.", "u": "Zahlendreher im Next-Hop (10.0.31.2 statt 10.0.13.2). `set ip next-hop` greift nur, wenn der Next-Hop direkt angeschlossen ist. Sonst ignoriert R1 die Anweisung und routet das Paket normal, also über die Default zu Provider A.", "f": "Next-Hop 10.0.13.2 (R3).", "d": "-  set ip next-hop 10.0.13.2\n+  set ip next-hop 10.0.31.2"}, {"l": "29", "n": 4, "dev": "R1", "s": "H2 geht über Provider A, obwohl ACL und Next-Hop stimmen; nur Web-Verkehr (Sequenz 20) wird umgeleitet.", "h": "`show route-map PBR` zeigt Sequenz 10 als `deny`. Nur Sequenz 20 zählt Treffer.", "u": "`deny` in einer PBR-Route-Map heißt: Das Paket wird nicht per Policy behandelt, sondern normal geroutet.", "f": "Sequenz 10 auf `permit`.", "d": "- route-map PBR permit 10\n+ route-map PBR deny 10"}, {"l": "29", "n": 5, "dev": "R3", "s": "H2 (über Provider B) erreicht den Server nicht; die Traceroute endet bei R3.", "h": "`traceroute` von H2 endet bei R3. `show ip route 192.0.2.44` auf R3 findet nichts.", "u": "R3 hat keine Route zum Server: Das Paket wird verworfen.", "f": "Statische Route auf R3 (`ip route 192.0.2.44 255.255.255.255 10.0.34.2`).", "d": "- ip route 192.0.2.44 255.255.255.255 10.0.34.2"}, {"l": "30", "n": 1, "dev": "R1", "s": "Kein BGP: R1 hat keine Default-Route, R2/R3/R4 erreichen 203.0.113.1 nicht.", "h": "Das Log auf R1 meldet „peer in wrong AS“. `show ip bgp summary` nennt beim Provider eine falsche AS.", "u": "Falsche AS-Nummer des Providers auf R1.", "f": "`remote-as 65000`.", "d": "-  neighbor 198.51.100.2 remote-as 65000\n+  neighbor 198.51.100.2 remote-as 65010"}, {"l": "30", "n": 2, "dev": "R1", "s": "BGP steht, R1 hat eine Default-Route, aber R2 und R3 haben keine.", "h": "`show ip route 0.0.0.0` auf R2 meldet „Network not in table“. `show running-config | section router ospf` auf R1 zeigt kein `default-information originate`.", "u": "R1 gibt die Default nicht in OSPF weiter.", "f": "`default-information originate` unter `router ospf 1` auf R1.", "d": "-  default-information originate"}, {"l": "30", "n": 3, "dev": "R2", "s": "R2 und R3 bilden keine Nachbarschaft; Mismatched Stub/Transit-Option im Debug.", "h": "`debug ip ospf adj` meldet „mismatched Stub/Transit area option bit“. `show ip ospf` auf R2 führt Area 1 nicht als Stub.", "u": "Area 1 ist nur auf R3 als Stub definiert.", "f": "`area 1 stub` auf R2.", "d": "-  area 1 stub"}, {"l": "30", "n": 4, "dev": "R2", "s": "R1 und R3 sehen 172.20.4.0/24 nicht.", "h": "`show ip ospf database external` auf R1 enthält 172.20.4.0 nicht. Auf R2 fehlt `subnets` beim `redistribute eigrp`.", "u": "Ohne `subnets` redistribuiert OSPF nur klassenbehaftete Netze.", "f": "`subnets` ergänzen.", "d": "-  redistribute eigrp 100 subnets\n+  redistribute eigrp 100"}, {"l": "30", "n": 5, "dev": "R2", "s": "Auf R4 fehlen die OSPF-Routen (R3-Loopback, 10.0.12.0/30); nur die statische Default erreicht R2.", "h": "`show ip route` auf R4 enthält keine OSPF-Netze. `show ip eigrp topology` auf R2 zeigt sie ohne gültige Metrik, weil die Seed-Metrik fehlt.", "u": "Ohne Seed-Metrik übernimmt EIGRP die OSPF-Routen nicht.", "f": "Metrik angeben (`metric 10000 100 255 1 1500`).", "d": "-  redistribute ospf 1 metric 10000 100 255 1 1500\n+  redistribute ospf 1"}, {"l": "30", "n": 6, "dev": "R4", "s": "R4 erreicht 203.0.113.1 nicht, schon der erste Hop im Traceroute bleibt stumm. Die Default-Route steht aber in `show ip route`.", "h": "`show ip route 0.0.0.0` auf R4 zeigt `directly connected, via Loopback10`. Die Pakete verlassen R4 also nie Richtung R2.", "u": "Die statische Default zeigt auf das falsche Ausgangs-Interface. Eine Loopback leitet nichts weiter, R4 verwirft die Pakete. Weil die statische Route Distanz 1 hat, verdrängt sie auch eine Default, die per EIGRP kommt.", "f": "`no ip route 0.0.0.0 0.0.0.0 Loopback10`, dann `ip route 0.0.0.0 0.0.0.0 10.0.24.1` (R2).", "d": "- ip route 0.0.0.0 0.0.0.0 10.0.24.1\n+ ip route 0.0.0.0 0.0.0.0 Loopback10"}, {"l": "30", "n": 7, "dev": "R3", "s": "Das Netz 192.168.3.0/24 fehlt auf R1/R2, Pings von R3-Lo10 ins Internet scheitern am Rückweg.", "h": "`show ip route 192.168.3.0` auf R2 findet nichts. `show ip ospf interface brief` auf R3 listet Lo10 nicht.", "u": "R3 nimmt Lo10 nicht in OSPF auf.", "f": "`network 192.168.3.0 0.0.0.255 area 1` auf R3.", "d": "-  network 192.168.3.0 0.0.0.255 area 1"}, {"l": "30", "n": 8, "dev": "ISP", "s": "Pings aus den 10er-Netzen an 203.0.113.1 scheitern auf dem Rückweg, obwohl das Routing intern stimmt. Der Traceroute zeigt den Hinweg bis zum ISP.", "h": "`show ip route 10.0.0.0` auf dem ISP findet nichts, obwohl `show run | include ip route` die Route enthält. Ihr Next-Hop 198.51.100.5 liegt in keinem angeschlossenen Netz.", "u": "Tippfehler im Next-Hop der Rückroute (198.51.100.5 statt .1). Ein Next-Hop, den der Router nicht auflösen kann, macht die statische Route ungültig, sie landet nicht in der Routing-Tabelle.", "f": "Next-Hop 198.51.100.1 (R1).", "d": "- ip route 10.0.0.0 255.0.0.0 198.51.100.1\n+ ip route 10.0.0.0 255.0.0.0 198.51.100.5"}];
const KEY='encor_tickets';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const id=t=>t.l+'-'+t.n;
const labTitle=n=>(LABS.find(l=>l.n===n)||{}).t||'';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
let P=load(),S=null;

// Ablenker: zuerst andere Tickets desselben Labs, dann ähnliche Ursachen aus anderen Labs
const words=s=>new Set(s.toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3));
function distractors(t){
  const same=shuffle(T.filter(x=>x.l===t.l&&x.n!==t.n));
  let out=same.slice(0,3);
  if(out.length<3){const w=words(t.u);
    const rest=T.filter(x=>x.l!==t.l).map(x=>{const v=words(x.u);let k=0;v.forEach(y=>{if(w.has(y))k++});return{x,k:k+Math.random()}})
      .sort((a,b)=>b.k-a.k).slice(0,12).map(o=>o.x);
    out=out.concat(shuffle(rest).slice(0,3-out.length));}
  return out;}

function home(){
  const done=Object.values(P).filter(v=>v==='ok').length,open=T.filter(t=>P[id(t)]!=='ok').length;
  let h=`<h1>CCNP ENCOR · Ticket-Trainer</h1><p class="sub">${T.length} Fehler-Tickets aus ${LABS.length} Labs. Du liest das Symptom und wählst die Ursache. Läuft offline im Browser.</p>
  <div class="card"><h2>Starten</h2>
  <div class="row"><label for="lab">Lab:</label><select id="lab"><option value="">Alle Labs (${T.length} Tickets)</option>${LABS.map(l=>`<option value="${l.n}">Lab ${l.n} – ${esc(l.t)} (${T.filter(t=>t.l===l.n).length})</option>`).join('')}</select></div>
  <div class="nav"><button onclick="start(false)">Alle Tickets</button><button class="sec" onclick="start(true)" ${open?'':'disabled'}>Nur noch nicht sicher gelöste (${open})</button></div>
  <p class="sub" style="margin-top:12px">„Sicher gelöst“ heißt: richtig ohne Hinweis. Mit Hinweis oder falsch bleibt ein Ticket offen und kommt bei „noch nicht sicher gelöste“ wieder.</p></div>
  <div class="card"><h2>Fortschritt</h2><div class="stat"><span>Sicher gelöst: <b>${done}</b> von ${T.length}</span></div>
  <table style="margin-top:8px">${LABS.map(l=>{const ts=T.filter(t=>t.l===l.n),k=ts.filter(t=>P[id(t)]==='ok').length;
    return `<tr><td>Lab ${l.n} – ${esc(l.t)}</td><td class="num">${k} / ${ts.length}</td><td style="width:90px"><div class="bar"><i style="width:${100*k/ts.length}%"></i></div></td></tr>`}).join('')}</table>
  <div class="nav"><button class="sec" onclick="reset()">Fortschritt zurücksetzen</button></div></div>
  <div class="card"><h2>So gehst du vor</h2><p>Lies das Symptom und überlege zuerst, welchen Befehl du an der Konsole eingeben würdest. Erst dann schaust du auf die Antworten. Den Hinweis nimmst du nur, wenn du keinen Ansatz hast: Er zeigt, wie man die Ursache findet.</p>
  <p class="sub">Die Tickets stammen aus den Repair-Topologien der Labs. Im Lab selbst findest du Topologie und Adressen.</p></div>`;
  app.innerHTML=h;}
function reset(){if(!confirm('Fortschritt wirklich löschen?'))return;P={};save();home();}
function start(onlyOpen){
  const lab=document.getElementById('lab').value;
  let qs=T.filter(t=>!lab||t.l===lab);if(onlyOpen)qs=qs.filter(t=>P[id(t)]!=='ok');
  if(!qs.length){alert('Für diese Auswahl ist nichts offen.');return}
  S={qs:shuffle(qs),i:0,r:{ok:0,hint:0,bad:0}};next(true);}
function next(first){if(!first)S.i++;if(S.i>=S.qs.length)return done();
  const t=S.qs[S.i];S.t=t;S.hint=false;S.pick=null;S.opts=shuffle([t,...distractors(t)]);render();}
function render(){const t=S.t,answered=S.pick!==null;
  let h=`<div class="card"><div class="top"><span>Ticket ${S.i+1} von ${S.qs.length}</span><span>✔ ${S.r.ok} · mit Hinweis ${S.r.hint} · ✘ ${S.r.bad}</span></div>
  <div class="sub" style="margin:0">Lab ${t.l} – ${esc(labTitle(t.l))} · Ticket ${t.n} · Gerät: ${esc(t.dev)}</div>
  <div class="lbl">Symptom</div><div class="sym">${md(t.s)}</div>`;
  if(S.hint||answered)h+=`<div class="hintbox"><b>So findest du es:</b> ${md(t.h)}</div>`;
  else h+=`<div class="nav"><button class="sec" onclick="S.hint=true;render()">Hinweis zeigen</button></div>`;
  h+=`<div class="lbl">Welche Ursache passt?</div>`;
  S.opts.forEach((o,i)=>{let cls='opt';if(answered){if(o===t)cls+=' ok';else if(i===S.pick)cls+=' bad'}
    h+=`<button class="${cls}" ${answered?'disabled':''} onclick="choose(${i})">${md(o.u)}</button>`});
  if(answered){const right=S.opts[S.pick]===t;
    h+=`<div class="expl"><p><b>${right?(S.hint?'Richtig, mit Hinweis.':'Richtig.'):'Nicht ganz.'}</b> ${md(t.u)}</p><p><b>Fix:</b> ${md(t.f)}</p>${t.d?`<pre>${t.d.split('\n').map(l=>`<span class="${l[0]==='+'?'m':l[0]==='-'?'p':''}">${esc(l)}</span>`).join('\n')}</pre><p class="sub" style="margin:0">Grün mit − ist die Soll-Konfiguration, rot mit + der eingebaute Fehler.</p>`:''}</div>
    <div class="nav"><button onclick="next()">${S.i<S.qs.length-1?'Nächstes Ticket':'Auswertung'}</button><button class="sec" onclick="home()">Beenden</button></div>`}
  else h+=`<div class="nav"><button class="sec" onclick="home()">Beenden</button></div>`;
  h+=`</div>`;app.innerHTML=h;}
function choose(i){if(S.pick!==null)return;S.pick=i;const t=S.t,right=S.opts[i]===t;
  const k=right?(S.hint?'hint':'ok'):'bad';S.r[k]++;
  if(k==='hint'&&P[id(t)]==='ok'){}else P[id(t)]=k;save();render();}
function done(){const n=S.qs.length;
  app.innerHTML=`<div class="card"><h1>Runde beendet</h1><div class="stat" style="font-size:1rem"><span>Richtig ohne Hinweis: <b>${S.r.ok}</b></span><span>Mit Hinweis: <b>${S.r.hint}</b></span><span>Falsch: <b>${S.r.bad}</b></span><span>von ${n}</span></div>
  <p>${S.r.ok===n?'Alles ohne Hinweis gelöst.':'Die offenen Tickets kommen beim Start mit „Nur noch nicht sicher gelöste“ wieder.'}</p>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
