hostname xTR1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.1.1 255.255.255.252
 no shutdown
ip route 0.0.0.0 0.0.0.0 10.0.1.2
router lisp
 locator-set RLOC
  10.0.1.1 priority 1 weight 100
  exit
 eid-table default instance-id 0
  database-mapping 192.168.1.0/24 locator-set RLOC
  ipv4 etr map-server 10.0.99.1 key LispKey123
  ipv4 itr
  exit
