hostname CSR1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet1
 ip address dhcp
 no shutdown
interface GigabitEthernet2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 no shutdown
ip route 2.2.2.2 255.255.255.255 10.0.12.2
username admin privilege 15 secret Lab#2026!
ip domain name lab.local
ip ssh version 2
ip http server
restconf
ip sla 1
 icmp-echo 2.2.2.2 source-interface Loopback0
 frequency 10
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
event manager applet LINKFLAP
 event syslog pattern "Interface Gi2, changed state"
 action 1.0 syslog msg "EEM: Link Gi2 hat Status gewechselt"
 action 2.0 cli command "enable"
 action 3.0 cli command "show ip interface brief | redirect flash:ipint.txt"
