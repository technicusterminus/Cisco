hostname R2
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 no shutdown
interface GigabitEthernet0/0
 ip address 10.0.12.2 255.255.255.252
 no shutdown
ip route 0.0.0.0 0.0.0.0 10.0.12.1
