hostname R3
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 no shutdown
interface GigabitEthernet0/0
 ip address 10.13.0.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.34.0.1 255.255.255.252
 no shutdown
