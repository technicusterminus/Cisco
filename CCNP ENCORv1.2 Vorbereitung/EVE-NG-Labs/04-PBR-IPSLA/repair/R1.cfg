hostname R1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 ip address 10.0.13.1 255.255.255.252
 no shutdown
ip route 0.0.0.0 0.0.0.0 10.0.12.2
ip access-list extended H1-ONLY
 permit ip host 192.168.1.21 any
ip access-list extended TO-9
 permit icmp any host 9.9.9.9
ip sla 1
 icmp-echo 10.0.13.2 source-interface GigabitEthernet0/2
 frequency 5
track 1 ip sla 1 reachability
route-map PBR permit 10
 match ip address H1-ONLY
 set ip next-hop verify-availability 10.0.13.2 10 track 1
route-map LOCAL permit 10
 match ip address TO-9
 set ip next-hop 10.0.13.2
interface GigabitEthernet0/1
 ip policy route-map PBR
ip local policy route-map LOCAL
