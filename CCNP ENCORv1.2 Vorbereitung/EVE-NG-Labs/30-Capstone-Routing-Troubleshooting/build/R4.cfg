hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 no shutdown
interface Loopback10
 ip address 172.20.4.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/0
 ip address 10.0.24.2 255.255.255.252
 no shutdown
