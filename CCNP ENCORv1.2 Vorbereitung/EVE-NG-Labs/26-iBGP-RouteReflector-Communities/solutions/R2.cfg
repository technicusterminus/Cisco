router ospf 1
 network 10.0.0.0 0.255.255.255 area 0
ip bgp-community new-format
router bgp 65001
 bgp router-id 10.255.0.2
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.1 next-hop-self
 neighbor 10.255.0.1 send-community
 neighbor 192.0.2.2 remote-as 65100
 neighbor 192.0.2.2 route-map ISP1-IN in
route-map ISP1-IN permit 10
 set local-preference 200
 set community 65001:100 additive
