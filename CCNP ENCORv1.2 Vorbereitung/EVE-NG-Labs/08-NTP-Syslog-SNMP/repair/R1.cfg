hostname R1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 no shutdown
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
ip route 2.2.2.2 255.255.255.255 10.0.12.2
ip route 3.3.3.3 255.255.255.255 10.0.12.2
ip route 10.0.23.0 255.255.255.252 10.0.12.2
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
ntp authenticate
ntp authentication-key 1 md5 NtpKey123
ntp trusted-key 1
service timestamps log datetime msec localtime show-timezone year
logging buffered 16384 informational
logging source-interface Loopback0
snmp-server view V-ALL iso included
snmp-server group MON v3 priv read V-ALL
snmp-server user monitor MON v3 auth sha AuthPass123 priv aes 128 PrivPass123
