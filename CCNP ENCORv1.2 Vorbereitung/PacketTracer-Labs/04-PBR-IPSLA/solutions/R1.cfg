ip access-list extended H1-ONLY
 permit ip host 192.168.1.11 any
ip access-list extended TO-9
 permit icmp any host 9.9.9.9
ip sla 1
 icmp-echo 10.0.13.2 source-interface GigabitEthernet0/2
 frequency 5
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
route-map PBR permit 10
 match ip address H1-ONLY
 set ip next-hop verify-availability 10.0.13.2 10 track 1
route-map LOCAL permit 10
 match ip address TO-9
 set ip next-hop 10.0.13.2
interface GigabitEthernet0/0
 ip policy route-map PBR
ip local policy route-map LOCAL
