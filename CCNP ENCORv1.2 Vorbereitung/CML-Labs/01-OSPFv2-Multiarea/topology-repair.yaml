lab:
  title: Lab 01 – OSPFv2 Multi-Area (Repair)
  description: OSPF-Areas, ABR/ASBR, DR/BDR, Summarization, Stub/NSSA, Authentifizierung und typische OSPF-Fehler.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    router ospf 1
     router-id 1.1.1.1
    interface Loopback0
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip ospf 1 area 0
     ip ospf authentication key-chain OSPFKEY
     ip ospf hello-interval 3
     ip ospf dead-interval 12
    key chain OSPFKEY
     key 1
      key-string LabKey999
      cryptographic-algorithm hmac-sha-256
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 300
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.1.234.2 255.255.255.0
     no shutdown
    router ospf 1
     router-id 2.2.2.2
     area 1 range 10.1.20.0 255.255.252.0
    interface Loopback0
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip ospf 1 area 0
     ip ospf authentication key-chain OSPFKEY
     ip ospf hello-interval 3
     ip ospf dead-interval 12
    interface GigabitEthernet0/1
     ip ospf 1 area 1
     ip ospf priority 0
    key chain OSPFKEY
     key 1
      key-string LabKey123
      cryptographic-algorithm hmac-sha-256
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: SW
  node_definition: unmanaged_switch
  x: 500
  y: 200
  configuration: ''
  tags: []
  interfaces:
  - id: i0
    label: port0
    slot: 0
    type: physical
  - id: i1
    label: port1
    slot: 1
    type: physical
  - id: i2
    label: port2
    slot: 2
    type: physical
  - id: i3
    label: port3
    slot: 3
    type: physical
  - id: i4
    label: port4
    slot: 4
    type: physical
  - id: i5
    label: port5
    slot: 5
    type: physical
  - id: i6
    label: port6
    slot: 6
    type: physical
  - id: i7
    label: port7
    slot: 7
    type: physical
- id: n3
  label: R3
  node_definition: iosv
  x: 700
  y: 100
  configuration: |
    hostname R3
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 3.3.3.3 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.1.234.3 255.255.255.0
     no shutdown
    interface Loopback10
     ip address 10.1.16.1 255.255.255.0
     no shutdown
    interface Loopback11
     ip address 10.1.17.1 255.255.255.0
     no shutdown
    interface Loopback12
     ip address 10.1.18.1 255.255.255.0
     no shutdown
    interface Loopback13
     ip address 10.1.19.1 255.255.255.0
     no shutdown
    router ospf 1
     router-id 3.3.3.3
     passive-interface default
     interface Loopback0
     ip ospf 1 area 1
    interface GigabitEthernet0/0
     ip ospf 1 area 1
     ip ospf priority 200
    interface range Loopback10 - 13
     ip ospf 1 area 1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n4
  label: R4
  node_definition: iosv
  x: 700
  y: 300
  configuration: |
    hostname R4
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 4.4.4.4 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.1.234.4 255.255.255.0
     no shutdown
    ip route 198.51.100.0 255.255.255.0 Null0
    router ospf 1
     router-id 4.4.4.4
     redistribute static metric-type 1 subnets
    interface Loopback0
     ip ospf 1 area 1
    interface GigabitEthernet0/0
     ip ospf 1 area 1
     ip ospf priority 100
     ip ospf hello-interval 5
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
