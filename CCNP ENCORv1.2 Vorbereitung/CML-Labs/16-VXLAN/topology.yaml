lab:
  title: 'Lab 16 – VXLAN: VTEP, VNI und Ingress Replication'
  description: Zwei NX-OS-Leafs spannen VLAN 10 über ein geroutetes Underlay als VXLAN-Segment (VNI 10010). Statische Ingress Replication statt EVPN, damit die Grundmechanik sichtbar bleibt. **Ressourcenhungrig:** N
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
