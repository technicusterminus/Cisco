lab:
  title: ENCOR Lab 06 - Automation und Assurance
  description: NETCONF/RESTCONF, EEM, IP SLA + Track, SNMPv3, Syslog, SPAN (ENCOR 4.x, 6.x)
  notes: 'Aufgaben: siehe README.md im selben Ordner'
  version: 0.2.0
nodes:
- id: n0
  label: EXT
  node_definition: external_connector
  x: 50
  y: 150
  configuration: virbr0
  tags: []
  interfaces:
  - id: i0
    label: port
    slot: 0
    type: physical
- id: n1
  label: CSR1
  node_definition: csr1000v
  x: 300
  y: 150
  configuration: |
    hostname CSR1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet1
     ip address dhcp
     no shutdown
    interface GigabitEthernet2
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    ip route 10.0.23.0 255.255.255.248 10.0.12.2
    ip route 2.2.2.2 255.255.255.255 10.0.12.2
  tags: []
  interfaces:
  - id: i0
    label: GigabitEthernet1
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet2
    slot: 1
    type: physical
  - id: i2
    label: GigabitEthernet3
    slot: 2
    type: physical
  - id: i3
    label: GigabitEthernet4
    slot: 3
    type: physical
- id: n2
  label: R2
  node_definition: iosv
  x: 550
  y: 150
