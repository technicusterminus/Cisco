- id: n2
  label: ISP
  node_definition: iosv
  x: 350
  y: -80
  configuration: |
    hostname ISP
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 192.0.2.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 203.0.113.2 255.255.255.252
     no shutdown
    router bgp 65000
     neighbor 198.51.100.1 remote-as 65001
     neighbor 198.51.100.1 prefix-list FROM-R1 in
     neighbor 203.0.113.1 remote-as 65002
     neighbor 203.0.113.1 prefix-list FROM-R2 in
     network 192.0.2.1 mask 255.255.255.255
    ip prefix-list FROM-R1 seq 5 permit 198.51.100.4/30
    ip prefix-list FROM-R2 seq 5 permit 203.0.113.0/30
