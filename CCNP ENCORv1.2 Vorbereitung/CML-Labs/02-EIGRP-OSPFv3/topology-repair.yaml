lab:
  title: Lab 02 – EIGRP (Named Mode) und OSPFv3 (Repair)
  description: 'Dual-Stack-Dreieck: IPv4 mit EIGRP im Named Mode (inkl. Unequal-Cost-Load-Balancing, Summarization, Authentifizierung), IPv6 mit OSPFv3 Address-Families. So vergleichst du beide IGPs am selben Netz.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     ipv6 address 2001:db8:ff::1/128
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     ipv6 address 2001:db8:12::1/64
     bandwidth 10000
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     ipv6 address 2001:db8:13::1/64
     bandwidth 2000
     no shutdown
    ipv6 unicast-routing
    router eigrp LAB
     address-family ipv4 unicast autonomous-system 100
      eigrp router-id 1.1.1.1
      af-interface default
       passive-interface
      exit-af-interface
      af-interface GigabitEthernet0/0
       no passive-interface
       authentication mode hmac-sha-256 0 LabKey123
      exit-af-interface
      af-interface GigabitEthernet0/1
       no passive-interface
       authentication mode hmac-sha-256 0 FalschesPW
      exit-af-interface
      topology base
       variance 6
      exit-af-topology
      network 1.1.1.1 0.0.0.0
      network 10.0.12.0 0.0.0.3
      network 10.0.13.0 0.0.0.3
     exit-address-family
    router ospfv3 1
     router-id 1.1.1.1
     address-family ipv6 unicast
     exit-address-family
    interface Loopback0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/1
     ospfv3 1 ipv6 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 300
  y: 60
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     ipv6 address 2001:db8:ff::2/128
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     ipv6 address 2001:db8:12::2/64
     bandwidth 10000
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.1 255.255.255.252
     ipv6 address 2001:db8:23::1/64
     bandwidth 10000
     no shutdown
    ipv6 unicast-routing
    router eigrp LAB
     address-family ipv4 unicast autonomous-system 101
      eigrp router-id 2.2.2.2
      af-interface default
       passive-interface
      exit-af-interface
      af-interface GigabitEthernet0/0
       no passive-interface
       authentication mode hmac-sha-256 0 LabKey123
      exit-af-interface
      af-interface GigabitEthernet0/1
       authentication mode hmac-sha-256 0 LabKey123
      exit-af-interface
      network 2.2.2.2 0.0.0.0
      network 10.0.12.0 0.0.0.3
      network 10.0.23.0 0.0.0.3
     exit-address-family
    router ospfv3 1
     router-id 2.2.2.2
     address-family ipv6 unicast
     exit-address-family
    interface Loopback0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/1
     ospfv3 1 ipv6 area 1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R3
  node_definition: iosv
  x: 300
  y: 340
  configuration: |
    hostname R3
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 3.3.3.3 255.255.255.255
     ipv6 address 2001:db8:ff::3/128
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.23.2 255.255.255.252
     ipv6 address 2001:db8:23::2/64
     bandwidth 10000
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.2 255.255.255.252
     ipv6 address 2001:db8:13::2/64
     bandwidth 2000
     no shutdown
    interface Loopback10
     ip address 10.3.0.1 255.255.255.0
     no shutdown
    interface Loopback11
     ip address 10.3.1.1 255.255.255.0
     no shutdown
    interface Loopback12
     ip address 10.3.2.1 255.255.255.0
     no shutdown
    interface Loopback13
     ip address 10.3.3.1 255.255.255.0
     no shutdown
    ipv6 unicast-routing
    router eigrp LAB
     address-family ipv4 unicast autonomous-system 100
      eigrp router-id 3.3.3.3
      af-interface default
       passive-interface
      exit-af-interface
      af-interface GigabitEthernet0/0
       no passive-interface
       authentication mode hmac-sha-256 0 LabKey123
       summary-address 10.3.0.0 255.255.252.0
      exit-af-interface
      af-interface GigabitEthernet0/1
       no passive-interface
       authentication mode hmac-sha-256 0 LabKey123
       summary-address 10.3.0.0 255.255.252.0
      exit-af-interface
      network 3.3.3.3 0.0.0.0
      network 10.0.23.0 0.0.0.3
      network 10.0.13.0 0.0.0.3
      network 10.3.0.0 0.0.3.255
     exit-address-family
    router ospfv3 1
     router-id 3.3.3.3
     address-family ipv6 unicast
     exit-address-family
    interface Loopback0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/1
     ospfv3 1 ipv6 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
- id: l1
  n1: n1
  n2: n2
  i1: i2
  i2: i1
  label: R2-GigabitEthernet0/1<->R3-GigabitEthernet0/0
- id: l2
  n1: n0
  n2: n2
  i1: i2
  i2: i2
  label: R1-GigabitEthernet0/1<->R3-GigabitEthernet0/1
