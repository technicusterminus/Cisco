lab:
  title: Lab 14 – GRE, IPsec und VTI
  description: 'Standortvernetzung über ein unsicheres Transportnetz: GRE-Tunnel, OSPF darüber, IPsec Tunnel Protection (IKEv1), anschließend IKEv2 und VTI. Dazu MTU/MSS und das typische Rekursiv-Routing-Problem.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: CE1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname CE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface Loopback100
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 198.51.100.2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: ISP
  node_definition: iosv
  x: 350
  y: 200
  configuration: |
    hostname ISP
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 8.8.8.8 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 203.0.113.2 255.255.255.252
     no shutdown
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: CE2
  node_definition: iosv
  x: 600
  y: 200
  configuration: |
    hostname CE2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface Loopback100
     ip address 192.168.2.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 203.0.113.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 203.0.113.2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: CE1-GigabitEthernet0/0<->ISP-GigabitEthernet0/0
- id: l1
  n1: n1
  n2: n2
  i1: i2
  i2: i1
  label: ISP-GigabitEthernet0/1<->CE2-GigabitEthernet0/0
