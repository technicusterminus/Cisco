lab:
  title: Lab 06 – Spanning Tree, MST und Schutzfunktionen
  description: 'Vier Switches im Dreiecksverbund plus „Rogue“-Switch: Rapid-PVST, Root-Platzierung und Lastverteilung, Umstieg auf MST, PortFast, BPDU Guard, Root Guard, Loop Guard und typische STP-Fehler.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
