lab:
  title: Lab 09 – NAT und PAT (Repair)
  description: 'Edge-Router mit LAN, DMZ und ISP: PAT (Overload), dynamisches NAT mit Pool, statisches NAT und Port-Forwarding. Du lernst die vier NAT-Adressbegriffe, die Reihenfolge der Operationen und die typischen'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
