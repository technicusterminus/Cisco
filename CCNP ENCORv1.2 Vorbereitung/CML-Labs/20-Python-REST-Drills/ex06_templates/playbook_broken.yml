# Aufgabe 6b: Dieses Ansible-Playbook enthaelt Fehler. Behebe sie, bis check_playbook.py "OK" meldet.
- name: Switch-Basiskonfiguration
  gather_facts: true
  connection: local
  tasks:
    - name: VLAN anlegen
      ios_config:
        lines: vlan 10
        parents:
          - name USERS
    - name: Interface konfigurieren
      cisco.ios.ios_config:
        lines:
          - description Uplink
          - switchport mode trunk
        parents: interface GigabitEthernet0/1
      notify: speichern
