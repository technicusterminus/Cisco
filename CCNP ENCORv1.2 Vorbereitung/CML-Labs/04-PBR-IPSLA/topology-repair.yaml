lab:
  title: Lab 04 – Policy-Based Routing mit IP SLA (Repair)
  description: 'Branch-Router mit zwei Providern: bestimmte Quelle per PBR über ISP2, Rest über ISP1. Der PBR-Next-Hop wird per IP SLA und Track überwacht. Dazu Local-PBR für routereigenen Verkehr.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
