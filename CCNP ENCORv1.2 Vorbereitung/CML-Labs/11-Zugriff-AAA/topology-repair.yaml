lab:
  title: Lab 11 – Gerätezugriff und AAA (Repair)
  description: Lines, lokale Benutzer, Privilege Levels, Login-Härtung und AAA mit TACACS+ (Server absichtlich nicht erreichbar, damit du das Fallback-Verhalten siehst). Der „Admin-PC“ R2 meldet sich per Telnet am G
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    ip route 2.2.2.2 255.255.255.255 10.0.12.2
    username admin privilege 15 algorithm-type scrypt secret Adm1nSecret
    username helpdesk privilege 5 algorithm-type scrypt secret Help1Secret
    enable algorithm-type scrypt secret EnableSecret1
    privilege exec level 5 show ip interface brief
    privilege exec level 5 ping
    aaa new-model
    tacacs server TAC1
     address ipv4 10.0.12.99
     key TacKey123
     timeout 2
    aaa group server tacacs+ TACGRP
     server name TAC1
    aaa authentication login default local
    aaa authentication login VTY_LIST group TACGRP
    aaa accounting exec default start-stop group TACGRP
    login block-for 60 attempts 3 within 30
    login on-failure log
    line vty 0 4
     login authentication VTY-LIST
     authorization exec VTY_LIST
     transport input telnet
     exec-timeout 0 0
    line con 0
     exec-timeout 5 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 450
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    ip route 1.1.1.1 255.255.255.255 10.0.12.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
