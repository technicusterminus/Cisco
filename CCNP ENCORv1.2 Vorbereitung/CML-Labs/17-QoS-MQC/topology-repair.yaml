- id: n4
  label: R1
  node_definition: iosv
  x: 350
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.10.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.12.2
    ip access-list extended GUEST
     permit ip host 192.168.10.13 any
    class-map match-all VOICE
     match dscp ef
     match dscp cs5
    class-map match-any VIDEO
     match dscp af41
    class-map match-any CRIT
     match dscp af31
    class-map match-all GUEST-CM
     match access-group name GUEST
    policy-map MARK
     class GUEST-CM
      set dscp ef
    policy-map QUEUE
     class VOICE
      priority percent 20
     class VIDEO
      bandwidth percent 30
     class CRIT
      bandwidth percent 25
     class class-default
      fair-queue
      random-detect dscp-based
    policy-map WAN
     class class-default
      shape average 2000
      service-policy QUEUE
    interface GigabitEthernet0/0
     service-policy input MARK
    interface GigabitEthernet0/0
     service-policy output WAN
  tags: []
  interfaces:
