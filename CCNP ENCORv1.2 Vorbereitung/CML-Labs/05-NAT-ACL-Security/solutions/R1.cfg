ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
username admin privilege 15 algorithm-type scrypt secret Lab#2026!
username operator privilege 5 algorithm-type scrypt secret Op#2026!
enable algorithm-type scrypt secret Enable#2026!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
privilege exec level 5 show ip route
privilege exec level 5 show ip interface brief
ip access-list standard MGMT
 permit 192.168.10.0 0.0.0.255
line vty 0 4
 transport input ssh
 access-class MGMT in
 exec-timeout 5 0
login block-for 60 attempts 3 within 30
login on-failure log
no ip http server
no ip http secure-server
no ip source-route
no service tcp-small-servers
no service udp-small-servers
access-list 1 permit 192.168.10.0 0.0.0.255
interface GigabitEthernet0/0
 ip nat inside
interface GigabitEthernet0/2
 ip nat inside
interface GigabitEthernet0/1
 ip nat outside
 ip verify unicast source reachable-via rx
 ip access-group OUTSIDE-IN in
ip nat inside source list 1 interface GigabitEthernet0/1 overload
ip nat inside source static 172.16.0.10 203.0.113.10
ip access-list extended OUTSIDE-IN
 permit icmp any any echo-reply
 permit tcp any any established
 permit tcp any host 203.0.113.10 eq 80
 permit tcp any host 203.0.113.10 eq 443
 permit udp any eq 53 any
 deny ip any any log
ip access-list extended DMZ-IN
 deny ip 172.16.0.0 0.0.0.255 192.168.10.0 0.0.0.255
 permit ip any any
interface GigabitEthernet0/2
 ip access-group DMZ-IN in
ip access-list extended LAN-IN
 permit icmp 192.168.10.0 0.0.0.255 172.16.0.0 0.0.0.255
 permit tcp 192.168.10.0 0.0.0.255 172.16.0.0 0.0.0.255 eq 80
 permit tcp 192.168.10.0 0.0.0.255 172.16.0.0 0.0.0.255 eq 443
 deny ip 192.168.10.0 0.0.0.255 172.16.0.0 0.0.0.255
 permit ip any any
interface GigabitEthernet0/0
 ip access-group LAN-IN in
