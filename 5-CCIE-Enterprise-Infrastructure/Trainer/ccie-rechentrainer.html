<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIE EI Rechentrainer</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:800px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modes button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-size:.9rem}
.modes button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.q{font-weight:600;font-size:1.05rem;margin-bottom:12px}
code{background:var(--chip);padding:1px 6px;border-radius:4px;font-family:Menlo,Consolas,monospace;font-size:.9em}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.84rem/1.45 Menlo,Consolas,monospace;margin:8px 0 12px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;font-size:.88rem;margin:4px 0 12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap}
table.t th{color:var(--mut);font-weight:600}
.row{display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:center;margin:8px 0}
.row>label{color:var(--mut);font-size:.9rem}
input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem}
input[type=text]{font-family:Menlo,Consolas,monospace}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.checks label{display:flex;gap:6px;align-items:center;font-size:.95rem}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
.mark{width:1.4em;text-align:center;font-weight:700}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.sol{color:var(--mut);font-size:.85rem;grid-column:2/3}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions button{border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;background:var(--acc);color:#fff}
.actions button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.steps{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:.95rem}
.steps ol{padding-left:20px;margin:6px 0}.steps li{margin:3px 0}
.stat{color:var(--mut);font-size:.9rem;margin-top:10px}
.hide{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr auto}.row>label{grid-column:1/-1}.sol{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<h1>Rechentrainer · CCIE Enterprise Infrastructure</h1>
<p class="sub">Zufallsaufgaben zu MTU und MSS, OSPF-Kosten, EIGRP-Metrik, Summarization und Multicast-MAC, jeweils mit Lösungsweg. Läuft offline im Browser.</p>
<div class="card"><div class="modes" id="modes"></div></div>
<div class="card" id="task"></div>
<div class="stat" id="stat"></div>
</main>
<script>
// ---------- Hilfsfunktionen ----------
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const table=(head,rows)=>`<div class="tw"><table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const L='ABCDE';

// ---------- MTU und MSS ----------
const ENC=[
 {n:'GRE-Tunnel (IPv4)',o:24,t:'20 Byte äußerer IP-Header + 4 Byte GRE'},
 {n:'GRE-Tunnel mit Tunnel-Key',o:28,t:'20 Byte äußerer IP-Header + 4 Byte GRE + 4 Byte Key'},
 {n:'VXLAN',o:50,t:'14 Byte inneres Ethernet + 20 Byte IP + 8 Byte UDP + 8 Byte VXLAN'},
 {n:'MPLS mit einem Label',o:4,t:'1 × 4 Byte Label'},
 {n:'MPLS L3VPN (Transport- und VPN-Label)',o:8,t:'2 × 4 Byte Label'},
 {n:'MPLS mit drei Labels (z. B. TE und FRR)',o:12,t:'3 × 4 Byte Label'}];
function genMtu(){const e=pick(ENC),m=pick([1500,1500,1500,1400,1600,9000,9100]);const pay=m-e.o,mss=pay-40;
  const hint=e.n==='VXLAN'?`Die 50 Byte enthalten das innere Ethernet. Wer „VXLAN-Overhead“ rechnet, meint den ganzen Block vom äußeren IP-Header bis zum inneren Ethernet.`:'';
  return{q:`Das Underlay überträgt IP-Pakete bis <code>${m}</code> Byte. Darüber läuft: <b>${e.n}</b>. Wie groß ist die größte Nutzlast, also die IP-MTU im Overlay, und welche TCP-MSS passt dazu (IPv4, ohne TCP-Optionen)?`,
   fields:[{l:'Overlay-IP-MTU (Byte)',a:String(pay)},{l:'TCP-MSS (Byte)',a:String(mss)}],
   steps:`<ol><li><b>Overhead:</b> ${e.t} = ${e.o} Byte.</li><li><b>IP-MTU im Overlay:</b> ${m} − ${e.o} = <b>${pay}</b>.</li><li><b>TCP-MSS:</b> ${pay} − 40 (20 IP + 20 TCP) = <b>${mss}</b>.</li></ol>${hint}`};}

// ---------- OSPF-Kosten ----------
const BWN={'10 Mbit/s':10,'100 Mbit/s':100,'1 Gbit/s':1000,'10 Gbit/s':10000,'40 Gbit/s':40000};
function genCost(){for(let t=0;t<300;t++){const ref=pick([100,1000,10000,100000]);const bws=Object.keys(BWN);
  const mk=()=>[pick(bws),pick(bws)];const A=mk(),B=mk();
  const c=b=>Math.max(1,Math.floor(ref/BWN[b]));const ca=c(A[0])+c(A[1]),cb=c(B[0])+c(B[1]);
  const sel=ca<cb?'Pfad A':cb<ca?'Pfad B':'gleich (ECMP)';
  if(t<250&&sel==='gleich (ECMP)')continue;
  return{q:`Auf allen Routern steht <code>auto-cost reference-bandwidth ${ref}</code> (Mbit/s). Zwei Pfade zum selben Ziel bestehen aus je zwei Links mit diesen Bandbreiten. Wie hoch sind die Gesamtkosten, und welchen Pfad wählt OSPF?`,
   x:table(['Pfad','Link 1','Link 2'],[['A',A[0],A[1]],['B',B[0],B[1]]]),
   fields:[{l:'Kosten Pfad A',a:String(ca)},{l:'Kosten Pfad B',a:String(cb)},{l:'Gewählter Pfad',sel:['Pfad A','Pfad B','gleich (ECMP)'],a:sel}],
   steps:`<ol><li><b>Kosten je Link</b> = Referenzbandbreite ÷ Linkbandbreite (beide in Mbit/s), abgerundet, mindestens 1.</li><li>Pfad A: ${A.map(b=>`${ref} ÷ ${BWN[b]} → ${c(b)}`).join(' und ')} = <b>${ca}</b>.</li><li>Pfad B: ${B.map(b=>`${ref} ÷ ${BWN[b]} → ${c(b)}`).join(' und ')} = <b>${cb}</b>.</li><li>Der Pfad mit den niedrigeren Gesamtkosten gewinnt: <b>${sel}</b>.</li></ol>`};}
  throw new Error('Kosten');}

// ---------- EIGRP-Metrik ----------
const EB=[[1000000,'1 Gbit/s'],[100000,'100 Mbit/s'],[10000,'10 Mbit/s'],[1544,'T1 (1544 kbit/s)'],[64,'64 kbit/s']];
const ED=[10,100,1000,20000];
function genEm(){const n=rnd(2,4);const hops=Array.from({length:n},()=>({b:pick(EB),d:pick(ED)}));
  const bw=Math.min(...hops.map(h=>h.b[0]));const dl=hops.reduce((a,h)=>a+h.d,0);
  const x=Math.floor(10000000/bw),y=dl/10,m=256*(x+y);
  return{q:`Ein EIGRP-Router lernt ein Ziel über diese ausgehenden Interfaces entlang des Pfades. Die K-Werte sind Standard. Wie hoch ist die Metrik, die er für das Ziel berechnet?`,
   x:table(['Link','Bandbreite','Delay'],hops.map((h,i)=>[i+1,h.b[1],h.d+' µs'])),
   fields:[{l:'Kleinste Bandbreite (kbit/s)',a:String(bw)},{l:'Delay-Summe (µs)',a:String(dl)},{l:'Metrik',a:String(m)}],
   steps:`<ol><li><b>Bandbreite:</b> Der kleinste Wert zählt: ${bw} kbit/s. Anteil: 10⁷ ÷ ${bw} = <b>${x}</b> (ganzzahlig abgerundet).</li><li><b>Delay:</b> Summe aller Delays = ${dl} µs. In Zehnern von Mikrosekunden: ${dl} ÷ 10 = <b>${y}</b>.</li><li><b>Metrik</b> bei K1 = K3 = 1: 256 × (${x} + ${y}) = <b>${m}</b>.</li></ol>`};}

// ---------- Summarization ----------
const ip4=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.');
function genSum(){for(let t=0;t<500;t++){const p=pick([20,21,22,23]);const span=1<<(24-p);const base=(10<<24)+(rnd(0,200)<<16)+(rnd(0,255)<<8);
  const start=base-(base%(span<<8));const all=Array.from({length:span},(_,i)=>start+(i<<8));
  const k=rnd(Math.max(2,span-3),span);let subset=shuffle(all).slice(0,k).sort((a,b)=>a-b);
  let len=32;for(let L=32;L>=8;L--){const m=L===0?0:(0xFFFFFFFF<<(32-L))>>>0;if(subset.every(a=>(a&m)>>>0===(subset[0]&m)>>>0)){len=L;break}}
  if(len!==p)continue;
  const m=(0xFFFFFFFF<<(32-len))>>>0,sum=(subset[0]&m)>>>0;const miss=all.filter(a=>!subset.includes(a));
  return{q:`Ein Router soll diese /24-Netze mit einer einzigen Route zusammenfassen, und zwar mit dem längsten Präfix, das alle abdeckt.`,
   x:`<pre>${esc(subset.map(a=>ip4(a)+'/24').join('\n'))}</pre>`,
   fields:[{l:'Zusammenfassung (CIDR)',a:ip4(sum)+'/'+len},{l:'Enthält die Summary Netze, die nicht aufgeführt sind?',sel:['ja','nein'],a:miss.length?'ja':'nein'}],
   steps:`<ol><li>Vergleiche das dritte Oktett in Binärform und suche den gemeinsamen Anfang. Bei ${len} Bit stimmen alle Netze überein, bei ${len+1} nicht mehr.</li><li>Die Summary lautet <b>${ip4(sum)}/${len}</b> und deckt ${span} Netze vom Typ /24 ab.</li>${miss.length?`<li>Nicht aufgeführt, aber enthalten: ${miss.map(a=>ip4(a)+'/24').join(', ')}. Diese Löcher zieht der Router mit auf sich. Pakete dorthin lassen sich verwerfen oder leiten in eine Schleife, wenn nichts Genaueres existiert.</li>`:'<li>Die Summary deckt genau die aufgeführten Netze ab, es gibt keine Löcher.</li>'}</ol>`};}
  throw new Error('Summary');}

// ---------- Multicast-MAC ----------
function genMac(){const g=[pick([224,225,226,232,233,238,239]),rnd(0,255),rnd(0,255),rnd(1,254)];
  const b2=g[1]&127;const h=n=>n.toString(16).padStart(2,'0');const mac=`01:00:5e:${h(b2)}:${h(g[2])}:${h(g[3])}`;
  return{q:`Auf einem Switch kommt Multicast für <code>${g.join('.')}</code> an. Auf welche Ziel-MAC-Adresse bildet der Host die Gruppe ab, und wie viele IP-Gruppen teilen sich dieselbe MAC?`,
   fields:[{l:'Ziel-MAC (Format 01:00:5e:xx:xx:xx)',a:mac},{l:'Gruppen pro MAC',sel:['1','8','32','256'],a:'32'}],
   steps:`<ol><li>Der MAC beginnt immer mit <code>01:00:5e</code>. Das erste Bit der unteren 24 Bit ist 0.</li><li>Die unteren <b>23 Bit</b> der IP-Adresse kommen in die MAC: Das zweite Oktett (${g[1]}) wird mit 127 maskiert → ${b2} = ${h(b2)}. Dazu ${h(g[2])} und ${h(g[3])}.</li><li>Ergebnis: <b>${mac}</b>.</li><li>Von den 28 Bit der Gruppenadresse gehen nur 23 in die MAC ein, 5 Bit fallen weg: 2⁵ = <b>32</b> Gruppen teilen sich eine MAC. Das ist der Grund für Hinweise, Adressen mit gleichen unteren 23 Bit zu meiden.</li></ol>`};}

const gens={mtu:{name:'MTU und MSS',gen:genMtu},cost:{name:'OSPF-Kosten und Pfadwahl',gen:genCost},em:{name:'EIGRP-Metrik',gen:genEm},sum:{name:'Summarization',gen:genSum},mac:{name:'Multicast-MAC',gen:genMac}};


// ---------- UI ----------
let cur='mtu',task=null,stats={r:0,t:0},counted=false;
const modesEl=document.getElementById('modes'),taskEl=document.getElementById('task'),statEl=document.getElementById('stat');
function renderModes(){modesEl.innerHTML='';Object.entries({all:{name:'Gemischt'},...gens}).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.name;b.className=k===cur?'on':'';b.onclick=()=>{cur=k;renderModes();next()};modesEl.appendChild(b)});}
function next(){counted=false;const k=cur==='all'?pick(Object.keys(gens)):cur;task=gens[k].gen();
  let h=`<div class="q">${task.q}</div>${task.x||''}`;
  task.fields.forEach((f,i)=>{let inp;
    if(f.sel)inp=`<select id="f${i}"><option value="">– wählen –</option>${f.sel.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
    else if(f.multi)inp=`<div class="checks" id="f${i}">${f.multi.map(o=>`<label><input type="checkbox" value="${esc(o)}">${esc(o)}</label>`).join('')}</div>`;
    else inp=`<input type="text" id="f${i}" autocomplete="off" spellcheck="false">`;
    h+=`<div class="row"><label for="f${i}">${f.l}</label>${inp}<span class="mark" id="m${i}"></span><span class="sol hide" id="s${i}"></span></div>`});
  h+=`<div class="actions"><button id="chk">Prüfen</button><button class="sec" id="sol">Lösung</button><button class="sec" id="nxt">Nächste Aufgabe</button></div><div class="steps hide" id="steps"></div>`;
  taskEl.innerHTML=h;document.getElementById('chk').onclick=check;document.getElementById('sol').onclick=solve;document.getElementById('nxt').onclick=next;
  taskEl.querySelectorAll('input[type=text]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));}
const nrm=s=>String(s).trim().toLowerCase().replace(/\s+/g,'');
function val(f,i){const el=document.getElementById('f'+i);if(f.multi)return[...el.querySelectorAll('input:checked')].map(x=>x.value);return el.value;}
function good(f,v){if(f.multi){const a=new Set(f.a);return v.length===a.size&&v.every(x=>a.has(x))}return nrm(v)===nrm(f.a);}
function check(){let ok=0;task.fields.forEach((f,i)=>{const g=good(f,val(f,i));mark(i,g);if(g)ok++});
  if(!counted){stats.t++;if(ok===task.fields.length)stats.r++;counted=true}
  if(ok===task.fields.length)showSteps();updateStat();}
function mark(i,g){const el=document.getElementById('f'+i),m=document.getElementById('m'+i);el.classList.remove('ok','bad');el.classList.add(g?'ok':'bad');m.className='mark '+(g?'ok':'bad');m.textContent=g?'✓':'✗';}
function solve(){task.fields.forEach((f,i)=>{const g=good(f,val(f,i));mark(i,g);if(!g){const s=document.getElementById('s'+i);s.textContent='Richtig: '+(f.multi?f.a.join(', '):f.a);s.classList.remove('hide')}});
  if(!counted){stats.t++;counted=true}showSteps();updateStat();}
function showSteps(){const s=document.getElementById('steps');s.innerHTML='<strong>Lösungsweg</strong>'+task.steps;s.classList.remove('hide');}
function updateStat(){statEl.textContent=`Gelöst ohne Hilfe: ${stats.r} von ${stats.t} Aufgaben`;}
renderModes();next();updateStat();
</script>
</body>
</html>
