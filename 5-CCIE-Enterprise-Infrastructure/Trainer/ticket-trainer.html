<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIE Enterprise Infrastructure · Ticket-Trainer</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f;--warn:#e0b252}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .6em}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 4px}
.sym{font-size:1.05rem;font-weight:600}
code{background:var(--chip);border-radius:4px;padding:0 4px;font:.88em Menlo,Consolas,monospace}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.45 Menlo,Consolas,monospace;margin:8px 0}
pre .p{color:var(--ok)}pre .m{color:var(--bad)}
.hintbox{border-left:4px solid var(--warn);background:var(--chip);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card);color:var(--ink);font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.expl p{margin:.3em 0}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
td.num{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--acc)}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.stat b{color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const LABS=[{"n": "C1", "t": "BGP: allowas-in, private AS, GTSM und bedingte Ankündigung"}, {"n": "C2", "t": "Multicast: Anycast RP mit MSDP, RPF-Umleitung und SSM"}, {"n": "C3", "t": "OSPF: Virtual Link mit Authentisierung, NSSA, Typ-3-Filter und Netzwerktypen"}, {"n": "C4", "t": "MPLS L3VPN: Shared Services, AS-Override und Route-Target-Design"}, {"n": "C5", "t": "DMVPN Phase 3 mit IKEv2 und BGP mit dynamischen Nachbarn"}, {"n": "C6", "t": "EIGRP Named Mode: SHA-256, Unequal-Cost Load Balancing und Stub mit Leak-Map"}];
const T=[{"l": "C1", "n": 1, "dev": "BR", "s": "BR erreicht das Netz der Zentrale nicht: `ping 198.51.100.1 source Loopback1` scheitert, und `show ip bgp` auf BR enthält 198.51.100.0/24 nicht, obwohl ISP1 das Netz kennt.", "h": "Auf ISP1 zeigt `show ip bgp 198.51.100.0` das Netz mit dem Pfad `65001`, an BR geht es also als `64501 65001`. `show ip bgp neighbors 10.0.21.1` auf BR zählt abgelehnte Präfixe wegen AS-Pfad-Schleife. In der BGP-Konfiguration von BR fehlt `allowas-in`.", "u": "Ohne `allowas-in` verwirft BR jede Route, in deren AS-Pfad der eigene AS 65001 steht. Das ist der normale eBGP-Schleifenschutz, hier aber unerwünscht, weil beide Standorte denselben AS nutzen.", "f": "`neighbor 10.0.21.1 allowas-in 1` unter `router bgp 65001` auf BR.", "d": "- neighbor 10.0.21.1 allowas-in 1"}, {"l": "C1", "n": 2, "dev": "ISP2", "s": "Die BGP-Sitzung zwischen HQ und ISP2 bleibt down, obwohl `ping 10.0.12.1` von HQ klappt.", "h": "`show ip bgp summary` auf HQ zeigt 10.0.12.1 in *Idle* oder *Active*. `show ip bgp neighbors 10.0.12.1` auf HQ nennt GTSM mit einer minimalen eingehenden TTL von 254. Auf ISP2 fehlt `ttl-security` für 10.0.12.2.", "u": "GTSM nur auf einer Seite: HQ erwartet eine TTL von mindestens 254, ISP2 sendet eBGP-Pakete mit TTL 1. HQ verwirft sie, bevor BGP sie sieht.", "f": "`neighbor 10.0.12.2 ttl-security hops 1` unter `router bgp 64502` auf ISP2.", "d": "- neighbor 10.0.12.2 ttl-security hops 1"}, {"l": "C1", "n": 3, "dev": "ISP1", "s": "Der Internet-Router NET sieht 198.51.100.0/24 und 203.0.113.0/24 mit dem privaten AS 65001 im Pfad.", "h": "`show ip bgp` auf NET: Pfad `64501 65001`. In der Konfiguration von ISP1 fehlt für 10.0.31.2 die Zeile `remove-private-as`, ISP2 hat sie für seinen Nachbarn NET.", "u": "ISP1 gibt den AS-Pfad unverändert an NET weiter. Private AS-Nummern (64512 bis 65534) gehören nicht ins Internet.", "f": "`neighbor 10.0.31.2 remove-private-as` auf ISP1, danach `clear ip bgp 10.0.31.2 soft out`.", "d": "- neighbor 10.0.31.2 remove-private-as"}, {"l": "C1", "n": 4, "dev": "ISP1", "s": "ISP2 bekommt 198.51.100.0/24 von HQ, obwohl ISP1 läuft. NET hat das Netz von beiden Providern in der BGP-Tabelle.", "h": "`show ip bgp 0.0.0.0` auf HQ: keine Default-Route. Damit ist die Non-Exist-Bedingung erfüllt, `show ip bgp neighbors 10.0.12.1 | include Condition` zeigt *Advertise*. Auf ISP1 fehlt `default-originate` für 10.0.11.2.", "u": "Die Default-Route von ISP1 ist der Merker für die Bedingung. Fehlt sie, hält HQ ISP1 für ausgefallen und kündigt das Netz dauerhaft bei ISP2 an.", "f": "`neighbor 10.0.11.2 default-originate` unter `router bgp 64501` auf ISP1.", "d": "- neighbor 10.0.11.2 default-originate"}, {"l": "C1", "n": 5, "dev": "HQ", "s": "Ausfalltest: Nach `shutdown` auf HQ Gi0/0 erreicht NET das Netz 198.51.100.0/24 auch nach zwei Minuten nicht. ISP2 bekommt die Backup-Route nie.", "h": "`show ip bgp neighbors 10.0.12.1 | include Condition` auf HQ bleibt auch nach dem Ausfall bei *Withdraw*. `show ip prefix-list DEFAULT` zeigt `0.0.0.0/0 le 32`: Die Liste passt auf jede Route, auch auf 192.0.2.0/24 von ISP2.", "u": "Mit `le 32` beschreibt die Prefix-Liste nicht mehr nur die Default-Route, sondern alle Präfixe. Die Bedingung gilt als erfüllt, solange irgendeine passende Route existiert, und von ISP2 kommen weiter Routen. Die Backup-Ankündigung wird deshalb nie ausgelöst.", "f": "`no ip prefix-list DEFAULT seq 5` und `ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0` auf HQ.", "d": "-ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0\n+ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0 le 32"}, {"l": "C2", "n": 1, "dev": "R2", "s": "R3 hat keinen einzigen PIM-Nachbarn.", "h": "`show ip pim interface` auf R2: Gi0/1 fehlt in der Liste. Ohne PIM auf dieser Seite gibt es zwischen R2 und R3 keine Nachbarschaft, und R3 hat keinen anderen PIM-Nachbarn.", "u": "PIM fehlt auf R2 Gi0/1. Der einzige Multicast-Weg zwischen R2 und R3 ist damit tot.", "f": "`ip pim sparse-mode` unter Gi0/1 auf R2.", "d": "- ip pim sparse-mode"}, {"l": "C2", "n": 2, "dev": "R2", "s": "`show ip msdp summary` auf R2 und R3 zeigt keine Sitzung im Zustand Up.", "h": "`show ip msdp summary` auf R2 nennt den Peer 10.0.0.13 statt 10.0.0.3, im Zustand Down. R3 wartet vergeblich auf 10.0.0.2.", "u": "Tippfehler in der Peer-Adresse. R2 versucht, 10.0.0.13 zu erreichen, die es nicht gibt, und nimmt keine Verbindung von 10.0.0.3 an, weil diese Adresse bei R2 nicht als Peer eingetragen ist.", "f": "`no ip msdp peer 10.0.0.13` und `ip msdp peer 10.0.0.3 connect-source Loopback0` auf R2.", "d": "-ip msdp peer 10.0.0.3 connect-source Loopback0\n+ip msdp peer 10.0.0.13 connect-source Loopback0"}, {"l": "C2", "n": 3, "dev": "R1", "s": "Die Rendezvous Points bekommen von der Quelle nichts mit: `show ip mroute 239.1.1.1` auf R2 zeigt keinen Eintrag mit 10.1.1.10, auch während SRC an 239.1.1.1 sendet.", "h": "`show ip pim rp mapping` auf R1 nennt 10.255.255.254. `show ip route 10.255.255.254` findet keine Route, R1 kann seine Register-Nachrichten nicht zustellen.", "u": "Falsche RP-Adresse auf R1. Als First-Hop-Router muss R1 die Quelle beim RP registrieren; an eine Adresse, die niemand trägt, kommt keine Register-Nachricht an. SSM braucht keinen RP und läuft deshalb weiter.", "f": "`no ip pim rp-address 10.255.255.254` und `ip pim rp-address 10.255.255.255` auf R1.", "d": "-ip pim rp-address 10.255.255.255\n+ip pim rp-address 10.255.255.254"}, {"l": "C2", "n": 4, "dev": "R3", "s": "RCV empfängt die Multicast-Pings von SRC weiterhin nicht, obwohl R3 die Quelle 10.1.1.10 kennt (`show ip msdp sa-cache`).", "h": "`show ip rpf 10.1.1.10` auf R3 nennt GigabitEthernet0/0 mit dem RPF-Nachbarn 10.0.13.1. Auf diesem Interface läuft kein PIM (`show ip pim interface`), also kann R3 dorthin keinen Join schicken.", "u": "Die RPF-Prüfung folgt dem Unicast-Routing, und das zeigt über die Firewall-Strecke ohne PIM. Die statische Mroute, die den RPF-Weg auf R2 umlenkt, fehlt.", "f": "`ip mroute 10.1.1.0 255.255.255.0 10.0.23.1` auf R3.", "d": "-ip mroute 10.1.1.0 255.255.255.0 10.0.23.1"}, {"l": "C2", "n": 5, "dev": "R3", "s": "Die SSM-Gruppe 232.1.1.1 fehlt in `show ip igmp groups` auf R3, obwohl RCV sie mit der Quelle 10.1.1.10 abonniert hat.", "h": "`show ip igmp interface GigabitEthernet0/2` auf R3 zeigt IGMP-Version 2. RCV meldet sich mit IGMPv3 und Quellangabe an, R3 wertet auf diesem Interface aber keine Quellen aus. Für den SSM-Bereich 232.0.0.0/8 nimmt R3 ohne Quelle keine Anmeldung an.", "u": "IGMPv3 fehlt am Empfänger-Interface. Ohne Version 3 gibt es keine quellspezifischen Anmeldungen und damit kein SSM.", "f": "`ip igmp version 3` unter Gi0/2 auf R3.", "d": "- ip igmp version 3"}, {"l": "C3", "n": 1, "dev": "R5", "s": "R5 steht mit R2 in FULL, hat aber keine einzige OSPF-Route. R2 kennt das LAN von R5 (10.5.5.0/24) nicht.", "h": "`show ip ospf interface GigabitEthernet0/0` auf R5: Netzwerktyp POINT_TO_POINT. Auf R2 ist Gi0/1 BROADCAST mit R2 als DR. Die Hello- und Dead-Timer sind gleich (10/40), deshalb wird die Nachbarschaft FULL. In der Datenbank beschreibt R5 den Link aber als Punkt-zu-Punkt, R2 als Transitnetz mit DR; die SPF-Berechnung findet keine beidseitige Verbindung.", "u": "Netzwerktyp-Mismatch zwischen Broadcast und Punkt-zu-Punkt: Nachbarschaft FULL, aber keine Routen über diesen Link.", "f": "`no ip ospf network point-to-point` unter Gi0/0 auf R5 (oder beide Seiten auf point-to-point).", "d": "+ ip ospf network point-to-point"}, {"l": "C3", "n": 2, "dev": "R2", "s": "R5 hat Routen zu den internen Netzen, erreicht aber 192.0.2.1 (Internet über R1) nicht.", "h": "`show ip route 0.0.0.0` auf R5: keine Route. `show ip ospf database external` auf R2 zeigt die Default-Route von R1 als Typ-5-LSA, in die NSSA gelangt sie aber nicht. `show ip ospf database nssa-external` auf R5 enthält kein 0.0.0.0.", "u": "Eine NSSA bekommt, anders als eine Totally NSSA, keine Default-Route automatisch. Der ABR muss sie mit `default-information-originate` als Typ-7-LSA erzeugen.", "f": "`area 3 nssa default-information-originate` unter `router ospf 1` auf R2.", "d": "- area 3 nssa default-information-originate\n+ area 3 nssa"}, {"l": "C3", "n": 3, "dev": "R2", "s": "Das Testnetz 10.1.99.0/24 soll nicht in Area 3 gelangen. R5 hat es trotzdem in der Routing-Tabelle, obwohl R2 einen Filter hat.", "h": "`show ip ospf database summary 10.1.99.0` auf R5 zeigt das Typ-3-LSA von R2. In der Konfiguration von R2 steht `area 3 filter-list prefix NO-TEST out`: Das filtert Routen, die Area 3 verlassen, nicht die, die hineingehen.", "u": "Falsche Richtung. `in` filtert die Typ-3-LSAs, die der ABR in die Area hinein erzeugt, `out` die, die er aus der Area heraus meldet. Da NO-TEST nur 10.1.99.0/24 sperrt und dieses Netz nicht aus Area 3 stammt, filtert `out` gar nichts.", "f": "`no area 3 filter-list prefix NO-TEST out` und `area 3 filter-list prefix NO-TEST in` auf R2.", "d": "- area 3 filter-list prefix NO-TEST in\n+ area 3 filter-list prefix NO-TEST out"}, {"l": "C3", "n": 4, "dev": "R3", "s": "R1 und R2 kennen die Netze von R4 nicht. `show ip ospf virtual-links` auf R3 zeigt den Virtual Link zu 1.1.1.1, aber keine Nachbarschaft im Zustand FULL.", "h": "`debug ip ospf adj` auf R1 meldet beim Virtual Link einen falschen Authentisierungstyp (Mismatched Authentication type). `show running-config | section router ospf` auf R3: `area 0 authentication message-digest` fehlt.", "u": "Der Virtual Link ist ein Interface in Area 0 und übernimmt deren Authentisierungstyp. R1 verlangt MD5, R3 sendet ohne Authentisierung. Damit ist Area 2 vom Backbone abgeschnitten.", "f": "`area 0 authentication message-digest` unter `router ospf 1` auf R3.", "d": "- area 0 authentication message-digest"}, {"l": "C3", "n": 5, "dev": "R3", "s": "R1 sieht statt der Zusammenfassung 10.4.4.0/23 die beiden Einzelnetze 10.4.4.0/24 und 10.4.5.0/24.", "h": "`show ip route ospf` auf R1: zwei O-IA-Routen mit /24. Auf R3 steht `area 1 range 10.4.4.0 255.255.254.0`, die Netze liegen aber in Area 2.", "u": "Zusammenfassung unter der falschen Area. Eine Range fasst nur Netze der Area zusammen, unter der sie steht, und in Area 1 gibt es 10.4.x nicht.", "f": "`no area 1 range 10.4.4.0 255.255.254.0` und `area 2 range 10.4.4.0 255.255.254.0` auf R3.", "d": "- area 2 range 10.4.4.0 255.255.254.0\n+ area 1 range 10.4.4.0 255.255.254.0"}, {"l": "C4", "n": 1, "dev": "CEA1", "s": "PE1 lernt von CEA1 kein einziges Präfix, obwohl die BGP-Sitzung steht.", "h": "`show bgp vpnv4 unicast vrf A summary` auf PE1: Nachbar 192.168.11.2 mit 0 empfangenen Präfixen. Auf CEA1 steht `network 10.100.1.0 mask 255.255.0.0`, in der Routing-Tabelle gibt es aber nur 10.100.1.0/24. `show ip bgp` auf CEA1 ist leer.", "u": "Falsche Maske im `network`-Befehl. BGP kündigt ein `network` nur an, wenn genau dieses Präfix mit dieser Maske in der Routing-Tabelle steht.", "f": "`no network 10.100.1.0 mask 255.255.0.0` und `network 10.100.1.0 mask 255.255.255.0` auf CEA1.", "d": "- network 10.100.1.0 mask 255.255.255.0\n+ network 10.100.1.0 mask 255.255.0.0"}, {"l": "C4", "n": 2, "dev": "PE2", "s": "CEA2 erreicht das Netz von CEA1 (10.100.1.0/24) nicht.", "h": "`show ip bgp` auf CEA2 enthält 10.100.1.0/24 nicht. PE2 sendet es mit dem Pfad `64500 65100` (`show bgp vpnv4 unicast vrf A neighbors 192.168.12.2 advertised-routes`), CEA2 sieht den eigenen AS und verwirft es. Auf PE2 fehlt `as-override` für 192.168.12.2.", "u": "Beide Standorte nutzen AS 65100. Ohne `as-override` steht 65100 im AS-Pfad, und der eBGP-Schleifenschutz von CEA2 greift.", "f": "`neighbor 192.168.12.2 as-override` unter `address-family ipv4 vrf A` auf PE2.", "d": "-  neighbor 192.168.12.2 as-override"}, {"l": "C4", "n": 3, "dev": "PE2", "s": "CEA1 hat keine Route zu 10.100.2.0/24, und auch der Shared-Server CES kennt das Netz von CEA2 nicht.", "h": "`show bgp vpnv4 unicast all 10.100.2.0` auf PE2 zeigt das Präfix mit dem Extended Community RT:64500:101. PE1 und die VRF SHARED importieren 64500:100.", "u": "Falsches Export-RT in VRF A auf PE2. Die Route verlässt die VRF mit 64500:101, und niemand importiert dieses RT, weder PE1 noch die lokale VRF SHARED.", "f": "`no route-target export 64500:101` und `route-target export 64500:100` in VRF A auf PE2.", "d": "-  route-target export 64500:100\n+  route-target export 64500:101"}, {"l": "C4", "n": 4, "dev": "PE1", "s": "CEA1 erreicht den Shared-Server 10.200.0.1 nicht, CEA2 schon.", "h": "`show ip route vrf A 10.200.0.0` auf PE1: keine Route. `show bgp vpnv4 unicast all 10.200.0.0` auf PE1 zeigt das Präfix mit RT:64500:999, übernommen aber nur in VRF B. `show vrf detail A` auf PE1: Import nur 64500:100.", "u": "VRF A auf PE1 importiert das Route Target der Shared Services nicht. Der Server kündigt richtig an, PE1 übernimmt die Route nur nicht in VRF A.", "f": "`route-target import 64500:999` unter `vrf definition A` → `address-family ipv4` auf PE1.", "d": "-  route-target import 64500:999"}, {"l": "C4", "n": 5, "dev": "PE2", "s": "Kunde B erreicht den Shared-Server nicht: `ping vrf B 10.200.0.1 source Loopback10` auf PE1 scheitert, obwohl PE1 in VRF B eine Route zu 10.200.0.0/24 hat.", "h": "Hin geht es, zurück nicht: `show ip bgp` auf CES enthält 10.110.1.0/24 nicht. `show vrf detail SHARED` auf PE2 zeigt die Imports 64500:999 und 64500:100, 64500:200 fehlt.", "u": "Shared Services muss die Netze aller berechtigten Kunden importieren, sonst fehlt der Rückweg. Typisch für einseitige Fehler: Die Route zum Server ist da, die Antwort findet nicht zurück.", "f": "`route-target import 64500:200` in der VRF SHARED auf PE2.", "d": "-  route-target import 64500:200"}, {"l": "C5", "n": 1, "dev": "S1", "s": "S1 ist nicht im DMVPN: `show dmvpn` auf S1 zeigt den Hub nicht im Zustand UP. Das Underlay ist in Ordnung.", "h": "`show crypto ikev2 sa` auf S1: keine SA. `debug crypto ikev2` auf dem Hub meldet beim IKE_SA_INIT, dass kein passender Vorschlag gefunden wurde (NO_PROPOSAL_CHOSEN). `show crypto ikev2 proposal` auf S1 nennt die DH-Gruppe 19, der Hub erwartet 14.", "u": "Die IKEv2-Vorschläge passen nicht zusammen. S1 bietet nur DH-Gruppe 19 an, der Hub akzeptiert nur 14. IKE scheitert, bevor überhaupt authentisiert wird.", "f": "Unter `crypto ikev2 proposal PROP` auf S1 `no group 19` und `group 14`.", "d": "- group 14\n+ group 19"}, {"l": "C5", "n": 2, "dev": "S2", "s": "S2 taucht in `show dmvpn` auf dem Hub nicht auf. `ping 198.51.100.1 source GigabitEthernet0/0` von S2 klappt.", "h": "`show crypto ikev2 sa` auf S2 zeigt keine SA im Status READY. `debug crypto ikev2` auf dem Hub meldet beim IKE_AUTH einen Authentisierungsfehler. Der Keyring auf S2 enthält `DMVPN-Lab-Kei`.", "u": "Unterschiedlicher Pre-Shared Key: IKE_SA_INIT klappt, IKE_AUTH scheitert. Ohne IPsec-SA kommt die NHRP-Registrierung von S2 nicht beim Hub an.", "f": "Im Keyring KR auf S2 unter `peer ANY` `pre-shared-key DMVPN-Lab-Key`.", "d": "-  pre-shared-key DMVPN-Lab-Key\n+  pre-shared-key DMVPN-Lab-Kei"}, {"l": "C5", "n": 3, "dev": "HUB", "s": "Die Tunnel stehen und beide Spokes sind registriert, aber keiner hat eine BGP-Sitzung zum Hub. Die Spokes kennen 10.10.0.0/16 nicht.", "h": "`show ip bgp summary` auf S1: Nachbar 172.16.0.1 in *Active*. Auf dem Hub erscheinen keine dynamischen Nachbarn, `show running-config | include listen` nennt 172.16.1.0/24. Die Tunneladressen liegen in 172.16.0.0/24.", "u": "Der Hub nimmt BGP-Verbindungen nur aus dem konfigurierten Bereich an. Die Spokes verbinden sich aus 172.16.0.0/24 und werden abgewiesen. Von sich aus baut der Hub keine Sitzung auf, er kennt die Spokes ja nicht.", "f": "`no bgp listen range 172.16.1.0/24 peer-group SPOKES` und `bgp listen range 172.16.0.0/24 peer-group SPOKES` auf dem Hub.", "d": "- bgp listen range 172.16.0.0/24 peer-group SPOKES\n+ bgp listen range 172.16.1.0/24 peer-group SPOKES"}, {"l": "C5", "n": 4, "dev": "HUB", "s": "Verkehr zwischen den Spokes läuft dauerhaft über den Hub: `traceroute 10.10.2.1 source Loopback1` von S1 zeigt auch beim dritten Versuch 172.16.0.1 als ersten Hop.", "h": "`show ip route nhrp` auf S1 bleibt leer, `show ip nhrp` enthält keinen Eintrag für 10.10.2.0/24. `show running-config interface Tunnel0` auf dem Hub: `ip nhrp redirect` fehlt.", "u": "Ohne Redirect erfahren die Spokes nie, dass es einen direkten Weg gibt. Der Hub leitet weiter und bleibt im Pfad.", "f": "`ip nhrp redirect` unter Tunnel0 auf dem Hub.", "d": "- ip nhrp redirect"}, {"l": "C5", "n": 5, "dev": "S1", "s": "Von S2 zu S1 entsteht nach dem ersten Paket ein direkter Weg, von S1 zu S2 bleibt der Verkehr beim Hub.", "h": "Nach Verkehr in beide Richtungen zeigt `show ip route nhrp` auf S2 die Route 10.10.1.0/24 über 172.16.0.2, auf S1 aber keine Route zu 10.10.2.0/24. `show running-config interface Tunnel0` auf S1: `ip nhrp shortcut` fehlt.", "u": "Der Hub schickt S1 einen Redirect, aber ohne `ip nhrp shortcut` stellt S1 keine Auflösungsanfrage und installiert keine Shortcut-Route. Auf Anfragen von S2 antwortet S1 trotzdem, deshalb klappt die andere Richtung.", "f": "`ip nhrp shortcut` unter Tunnel0 auf S1.", "d": "- ip nhrp shortcut"}, {"l": "C6", "n": 1, "dev": "R2", "s": "R2 hat keine EIGRP-Nachbarn. Im Log steht bei jedem Versuch `K-value mismatch`.", "h": "Im Log von R2 und seinen Nachbarn: `K-value mismatch`. `show eigrp protocols` auf R2 nennt K2 = 1, die Nachbarn haben K2 = 0. In der Konfiguration von R2 steht `metric weights 0 1 1 1 0 0 0`.", "u": "Unterschiedliche K-Werte. EIGRP-Nachbarn müssen dieselben K-Werte haben, sonst lehnen sie die Nachbarschaft ab.", "f": "`no metric weights` (oder `metric weights 0 1 0 1 0 0 0`) unter der Address-Family auf R2.", "d": "+  metric weights 0 1 1 1 0 0 0"}, {"l": "C6", "n": 2, "dev": "R3", "s": "R3 hat keine EIGRP-Nachbarn. Die Links sind up, Pings zu R1 und R4 klappen.", "h": "`show eigrp address-family ipv4 neighbors` auf R3 ist leer. `debug eigrp packets` auf R1 zeigt Pakete von 10.0.13.2, die an der Authentisierung scheitern. Der Schlüssel auf R3 lautet `EIGRP-lab` statt `EIGRP-Lab`.", "u": "Falsches Passwort für HMAC-SHA-256. Groß- und Kleinschreibung zählt, der Hash passt nicht.", "f": "`authentication mode hmac-sha-256 EIGRP-Lab` unter `af-interface default` auf R3.", "d": "-   authentication mode hmac-sha-256 EIGRP-Lab\n+   authentication mode hmac-sha-256 EIGRP-lab"}, {"l": "C6", "n": 3, "dev": "R4", "s": "Das Netz 10.4.2.0/24 fehlt auf allen anderen Routern, 10.4.1.0/24 ist da.", "h": "`show eigrp address-family ipv4 interfaces` auf R4 listet Loopback1, aber nicht Loopback2. Die Wildcard 0.0.1.255 deckt nur 10.4.0.0 bis 10.4.1.255 ab.", "u": "Zu enge Wildcard im `network`-Befehl. 10.4.2.1 liegt außerhalb, Loopback2 nimmt nicht an EIGRP teil.", "f": "`no network 10.4.0.0 0.0.1.255` und `network 10.4.0.0 0.0.3.255` auf R4.", "d": "-  network 10.4.0.0 0.0.3.255\n+  network 10.4.0.0 0.0.1.255"}, {"l": "C6", "n": 4, "dev": "R1", "s": "R1 schickt Verkehr zu 10.4.1.0/24 nur über R2, obwohl der Weg über R3 als Feasible Successor bereitsteht.", "h": "`show ip eigrp topology 10.4.1.0/24` auf R1 zeigt Successor und Feasible Successor, `show ip route 10.4.1.0` nur einen Weg. Unter `topology base` fehlt `variance 2`.", "u": "Ohne Varianz nutzt EIGRP nur Wege mit der besten Metrik. Der Feasible Successor bleibt Reserve.", "f": "`variance 2` unter `topology base` auf R1.", "d": "-   variance 2"}, {"l": "C6", "n": 5, "dev": "R4", "s": "Ausfalltest: Nach `shutdown` auf R1 Gi0/0 verliert R2 seine Default-Route und erreicht 192.0.2.1 nicht mehr, obwohl R4 über R3 weiter angebunden ist.", "h": "Während des Tests: `show ip route 0.0.0.0` auf R2 ist leer. `show ip protocols` auf R4 nennt den Stub ohne Leak-Map. R4 kennt die Default-Route von R3, gibt sie als Stub aber nicht weiter.", "u": "Ein Stub gibt nur seine eigenen Netze weiter. Ohne Leak-Map ist R2 nach dem Ausfall seines Links zu R1 auf die Netze von R4 beschränkt.", "f": "`eigrp stub connected leak-map LEAK-DEFAULT` auf R4.", "d": "-  eigrp stub connected leak-map LEAK-DEFAULT\n+  eigrp stub connected"}];
const KEY='ccie_tickets';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const id=t=>t.l+'-'+t.n;
const labTitle=n=>(LABS.find(l=>l.n===n)||{}).t||'';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
let P=load(),S=null;

// Ablenker: zuerst andere Tickets desselben Labs, dann ähnliche Ursachen aus anderen Labs
const words=s=>new Set(s.toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3));
function distractors(t){
  const same=shuffle(T.filter(x=>x.l===t.l&&x.n!==t.n));
  let out=same.slice(0,3);
  if(out.length<3){const w=words(t.u);
    const rest=T.filter(x=>x.l!==t.l).map(x=>{const v=words(x.u);let k=0;v.forEach(y=>{if(w.has(y))k++});return{x,k:k+Math.random()}})
      .sort((a,b)=>b.k-a.k).slice(0,12).map(o=>o.x);
    out=out.concat(shuffle(rest).slice(0,3-out.length));}
  return out;}

function home(){
  const done=Object.values(P).filter(v=>v==='ok').length,open=T.filter(t=>P[id(t)]!=='ok').length;
  let h=`<h1>CCIE Enterprise Infrastructure · Ticket-Trainer</h1><p class="sub">${T.length} Fehler-Tickets aus ${LABS.length} Labs. Du liest das Symptom und wählst die Ursache. Läuft offline im Browser.</p>
  <div class="card"><h2>Starten</h2>
  <div class="row"><label for="lab">Lab:</label><select id="lab"><option value="">Alle Labs (${T.length} Tickets)</option>${LABS.map(l=>`<option value="${l.n}">Lab ${l.n} – ${esc(l.t)} (${T.filter(t=>t.l===l.n).length})</option>`).join('')}</select></div>
  <div class="nav"><button onclick="start(false)">Alle Tickets</button><button class="sec" onclick="start(true)" ${open?'':'disabled'}>Nur noch nicht sicher gelöste (${open})</button></div>
  <p class="sub" style="margin-top:12px">„Sicher gelöst“ heißt: richtig ohne Hinweis. Mit Hinweis oder falsch bleibt ein Ticket offen und kommt bei „noch nicht sicher gelöste“ wieder.</p></div>
  <div class="card"><h2>Fortschritt</h2><div class="stat"><span>Sicher gelöst: <b>${done}</b> von ${T.length}</span></div>
  <table style="margin-top:8px">${LABS.map(l=>{const ts=T.filter(t=>t.l===l.n),k=ts.filter(t=>P[id(t)]==='ok').length;
    return `<tr><td>Lab ${l.n} – ${esc(l.t)}</td><td class="num">${k} / ${ts.length}</td><td style="width:90px"><div class="bar"><i style="width:${100*k/ts.length}%"></i></div></td></tr>`}).join('')}</table>
  <div class="nav"><button class="sec" onclick="reset()">Fortschritt zurücksetzen</button></div></div>
  <div class="card"><h2>So gehst du vor</h2><p>Lies das Symptom und überlege zuerst, welchen Befehl du an der Konsole eingeben würdest. Erst dann schaust du auf die Antworten. Den Hinweis nimmst du nur, wenn du keinen Ansatz hast: Er zeigt, wie man die Ursache findet.</p>
  <p class="sub">Die Tickets stammen aus den Repair-Topologien der Labs. Im Lab selbst findest du Topologie und Adressen.</p></div>`;
  app.innerHTML=h;}
function reset(){if(!confirm('Fortschritt wirklich löschen?'))return;P={};save();home();}
function start(onlyOpen){
  const lab=document.getElementById('lab').value;
  let qs=T.filter(t=>!lab||t.l===lab);if(onlyOpen)qs=qs.filter(t=>P[id(t)]!=='ok');
  if(!qs.length){alert('Für diese Auswahl ist nichts offen.');return}
  S={qs:shuffle(qs),i:0,r:{ok:0,hint:0,bad:0}};next(true);}
function next(first){if(!first)S.i++;if(S.i>=S.qs.length)return done();
  const t=S.qs[S.i];S.t=t;S.hint=false;S.pick=null;S.opts=shuffle([t,...distractors(t)]);render();}
function render(){const t=S.t,answered=S.pick!==null;
  let h=`<div class="card"><div class="top"><span>Ticket ${S.i+1} von ${S.qs.length}</span><span>✔ ${S.r.ok} · mit Hinweis ${S.r.hint} · ✘ ${S.r.bad}</span></div>
  <div class="sub" style="margin:0">Lab ${t.l} – ${esc(labTitle(t.l))} · Ticket ${t.n} · Gerät: ${esc(t.dev)}</div>
  <div class="lbl">Symptom</div><div class="sym">${md(t.s)}</div>`;
  if(S.hint||answered)h+=`<div class="hintbox"><b>So findest du es:</b> ${md(t.h)}</div>`;
  else h+=`<div class="nav"><button class="sec" onclick="S.hint=true;render()">Hinweis zeigen</button></div>`;
  h+=`<div class="lbl">Welche Ursache passt?</div>`;
  S.opts.forEach((o,i)=>{let cls='opt';if(answered){if(o===t)cls+=' ok';else if(i===S.pick)cls+=' bad'}
    h+=`<button class="${cls}" ${answered?'disabled':''} onclick="choose(${i})">${md(o.u)}</button>`});
  if(answered){const right=S.opts[S.pick]===t;
    h+=`<div class="expl"><p><b>${right?(S.hint?'Richtig, mit Hinweis.':'Richtig.'):'Nicht ganz.'}</b> ${md(t.u)}</p><p><b>Fix:</b> ${md(t.f)}</p>${t.d?`<pre>${t.d.split('\n').map(l=>`<span class="${l[0]==='+'?'m':l[0]==='-'?'p':''}">${esc(l)}</span>`).join('\n')}</pre><p class="sub" style="margin:0">Grün mit − ist die Soll-Konfiguration, rot mit + der eingebaute Fehler.</p>`:''}</div>
    <div class="nav"><button onclick="next()">${S.i<S.qs.length-1?'Nächstes Ticket':'Auswertung'}</button><button class="sec" onclick="home()">Beenden</button></div>`}
  else h+=`<div class="nav"><button class="sec" onclick="home()">Beenden</button></div>`;
  h+=`</div>`;app.innerHTML=h;}
function choose(i){if(S.pick!==null)return;S.pick=i;const t=S.t,right=S.opts[i]===t;
  const k=right?(S.hint?'hint':'ok'):'bad';S.r[k]++;
  if(k==='hint'&&P[id(t)]==='ok'){}else P[id(t)]=k;save();render();}
function done(){const n=S.qs.length;
  app.innerHTML=`<div class="card"><h1>Runde beendet</h1><div class="stat" style="font-size:1rem"><span>Richtig ohne Hinweis: <b>${S.r.ok}</b></span><span>Mit Hinweis: <b>${S.r.hint}</b></span><span>Falsch: <b>${S.r.bad}</b></span><span>von ${n}</span></div>
  <p>${S.r.ok===n?'Alles ohne Hinweis gelöst.':'Die offenen Tickets kommen beim Start mit „Nur noch nicht sicher gelöste“ wieder.'}</p>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;window.scrollTo(0,0);}
home();
</script>
</body>
</html>
