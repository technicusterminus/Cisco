ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
route-map LEAK-DEFAULT permit 10
 match ip address prefix-list DEFAULT
interface Loopback1
 delay 10
interface Loopback2
 delay 10
router eigrp CCIE
 address-family ipv4 unicast autonomous-system 100
  af-interface default
   authentication mode hmac-sha-256 EIGRP-Lab
  exit-af-interface
  network 10.0.24.0 0.0.0.3
  network 10.0.34.0 0.0.0.3
  network 10.4.0.0 0.0.3.255
  eigrp router-id 10.0.0.4
  eigrp stub connected leak-map LEAK-DEFAULT
 exit-address-family
