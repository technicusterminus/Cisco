hostname NET
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 10.0.31.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.32.2 255.255.255.252
 no shutdown
interface Loopback1
 ip address 192.0.2.1 255.255.255.0
