lab:
  title: 'Lab C4 – MPLS L3VPN: Shared Services, AS-Override und Route-Target-Design'
  description: Ein Provider verbindet zwei Standorte von Kunde A, die beide AS 65100 nutzen, und stellt einen Shared-Services-Server bereit, den Kunde A und Kunde B erreichen dürfen. Untereinander müssen A und B getrennt bleiben. Du entwirfst die Route Targets so, dass genau das herauskommt, und löst das Problem mit dem gleichen Kunden-AS per `as-override`. Core, LDP und die VPNv4-Sitzung sind vorgegeben.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: CEA1
  node_definition: iosv
  x: 50
  y: 100
  configuration: |
    hostname CEA1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.11.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.100.1.1 255.255.255.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: PE1
  node_definition: iosv
  x: 250
  y: 250
  configuration: |
    hostname PE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     mpls ip
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
    router bgp 64500
     bgp router-id 10.255.0.1
     bgp log-neighbor-changes
     no bgp default ipv4-unicast
     neighbor 10.255.0.2 remote-as 64500
     neighbor 10.255.0.2 update-source Loopback0
     address-family vpnv4
      neighbor 10.255.0.2 activate
      neighbor 10.255.0.2 send-community extended
     exit-address-family
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
