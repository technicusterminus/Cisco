lab:
  title: 'Lab C4 – MPLS L3VPN: Shared Services, AS-Override und Route-Target-Design (Repair)'
  description: Ein Provider verbindet zwei Standorte von Kunde A, die beide AS 65100 nutzen, und stellt einen Shared-Services-Server bereit, den Kunde A und Kunde B erreichen dürfen. Untereinander müssen A und B getrennt bleiben. Du entwirfst die Route Targets so, dass genau das herauskommt, und löst das Problem mit dem gleichen Kunden-AS per `as-override`. Core, LDP und die VPNv4-Sitzung sind vorgegeben.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: CEA1
  node_definition: iosv
  x: 50
  y: 100
  configuration: |
    hostname CEA1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.11.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.100.1.1 255.255.255.0
    router bgp 65100
     bgp router-id 10.100.1.1
     bgp log-neighbor-changes
     network 10.100.1.0 mask 255.255.0.0
     neighbor 192.168.11.1 remote-as 64500
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: PE1
  node_definition: iosv
  x: 250
  y: 250
  configuration: |
    hostname PE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     mpls ip
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
    router bgp 64500
     bgp router-id 10.255.0.1
     bgp log-neighbor-changes
     no bgp default ipv4-unicast
     neighbor 10.255.0.2 remote-as 64500
     neighbor 10.255.0.2 update-source Loopback0
     address-family vpnv4
      neighbor 10.255.0.2 activate
      neighbor 10.255.0.2 send-community extended
     exit-address-family
    vrf definition A
     rd 64500:100
     address-family ipv4
      route-target export 64500:100
      route-target import 64500:100
     exit-address-family
    vrf definition B
     rd 64500:200
     address-family ipv4
      route-target export 64500:200
      route-target import 64500:200
      route-target import 64500:999
     exit-address-family
    interface GigabitEthernet0/1
     vrf forwarding A
     ip address 192.168.11.1 255.255.255.252
    interface Loopback10
     vrf forwarding B
     ip address 10.110.1.1 255.255.255.0
    router bgp 64500
     address-family ipv4 vrf A
      neighbor 192.168.11.2 remote-as 65100
      neighbor 192.168.11.2 activate
      neighbor 192.168.11.2 as-override
     exit-address-family
     address-family ipv4 vrf B
      redistribute connected
     exit-address-family
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: PE2
  node_definition: iosv
  x: 550
  y: 250
  configuration: |
    hostname PE2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     mpls ip
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    interface GigabitEthernet0/2
     no shutdown
    mpls label protocol ldp
    mpls ldp router-id Loopback0 force
    router ospf 1
     router-id 10.255.0.2
     network 10.255.0.2 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
    router bgp 64500
     bgp router-id 10.255.0.2
     bgp log-neighbor-changes
     no bgp default ipv4-unicast
     neighbor 10.255.0.1 remote-as 64500
     neighbor 10.255.0.1 update-source Loopback0
     address-family vpnv4
      neighbor 10.255.0.1 activate
      neighbor 10.255.0.1 send-community extended
     exit-address-family
    vrf definition A
     rd 64500:100
     address-family ipv4
      route-target export 64500:101
      route-target import 64500:100
      route-target import 64500:999
     exit-address-family
    vrf definition SHARED
     rd 64500:999
     address-family ipv4
      route-target export 64500:999
      route-target import 64500:999
      route-target import 64500:100
     exit-address-family
    interface GigabitEthernet0/1
     vrf forwarding A
     ip address 192.168.12.1 255.255.255.252
    interface GigabitEthernet0/2
     vrf forwarding SHARED
     ip address 192.168.13.1 255.255.255.252
    router bgp 64500
     address-family ipv4 vrf A
      neighbor 192.168.12.2 remote-as 65100
      neighbor 192.168.12.2 activate
     exit-address-family
     address-family ipv4 vrf SHARED
      neighbor 192.168.13.2 remote-as 65200
      neighbor 192.168.13.2 activate
     exit-address-family
  tags: []
  interfaces:
