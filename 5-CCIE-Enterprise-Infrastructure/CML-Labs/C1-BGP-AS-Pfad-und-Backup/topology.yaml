lab:
  title: 'Lab C1 – BGP: allowas-in, private AS, GTSM und bedingte Ankündigung'
  description: Ein Unternehmen mit dem privaten AS 65001 hängt mit Zentrale (HQ) und Filiale (BR) am Provider ISP1, die Zentrale zusätzlich an ISP2 als Backup. Weil beide Standorte denselben AS nutzen, verwirft die Filiale die Routen der Zentrale. Du löst das mit `allowas-in`, entfernst den privaten AS beim Provider, schützt eine Sitzung mit GTSM und kündigst das Netz der Zentrale bei ISP2 nur an, wenn ISP1 ausfällt.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: HQ
  node_definition: iosv
  x: 400
  y: 450
  configuration: |
    hostname HQ
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.11.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 198.51.100.1 255.255.255.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
