lab:
  title: Lab C5 – DMVPN Phase 3 mit IKEv2 und BGP mit dynamischen Nachbarn (Repair)
  description: 'Ein Hub und zwei Spokes bauen über einen Internet-Router ein DMVPN auf, diesmal geschützt mit IPsec und IKEv2. Das Routing läuft über iBGP: Der Hub nimmt Spokes über einen Listen-Range ohne einzelne Nachbar-Einträge an und gibt ihnen nur eine Zusammenfassung. Die direkten Wege zwischen den Spokes entstehen per NHRP-Redirect und -Shortcut, jeweils mit eigener IPsec-Verbindung.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: HUB
  node_definition: iosv
  x: 350
  y: 50
  configuration: |
    hostname HUB
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.10.100.1 255.255.255.0
    ip route 0.0.0.0 0.0.0.0 198.51.100.2
    crypto ikev2 proposal PROP
     encryption aes-cbc-256
     integrity sha256
     group 14
    crypto ikev2 policy POL
     proposal PROP
    crypto ikev2 keyring KR
     peer ANY
      address 0.0.0.0 0.0.0.0
      pre-shared-key DMVPN-Lab-Key
    crypto ikev2 profile IKEV2-DMVPN
     match identity remote address 0.0.0.0
     authentication remote pre-share
     authentication local pre-share
     keyring local KR
    crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac
     mode transport
    crypto ipsec profile IPSEC-DMVPN
     set transform-set TS
     set ikev2-profile IKEV2-DMVPN
    interface Tunnel0
     ip address 172.16.0.1 255.255.255.0
     no ip redirects
     ip mtu 1400
     ip tcp adjust-mss 1360
     ip nhrp network-id 1
     ip nhrp map multicast dynamic
     tunnel source GigabitEthernet0/0
     tunnel mode gre multipoint
     tunnel protection ipsec profile IPSEC-DMVPN
    router bgp 65000
     bgp router-id 10.10.100.1
     bgp log-neighbor-changes
     neighbor SPOKES peer-group
     neighbor SPOKES remote-as 65000
     bgp listen range 172.16.1.0/24 peer-group SPOKES
     network 10.10.100.0 mask 255.255.255.0
     aggregate-address 10.10.0.0 255.255.0.0 summary-only
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: INET
  node_definition: iosv
  x: 350
  y: 250
  configuration: |
    hostname INET
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 198.51.100.6 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 198.51.100.10 255.255.255.252
     no shutdown
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
