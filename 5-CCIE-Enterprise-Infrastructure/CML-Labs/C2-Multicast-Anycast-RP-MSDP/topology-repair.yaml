lab:
  title: 'Lab C2 – Multicast: Anycast RP mit MSDP, RPF-Umleitung und SSM (Repair)'
  description: Zwei Rendezvous Points teilen sich eine Anycast-Adresse und tauschen ihre aktiven Quellen per MSDP aus. Der kürzeste Unicast-Weg zur Quelle führt über eine Firewall-Strecke ohne Multicast, deshalb scheitert die RPF-Prüfung, bis eine statische Mroute den Weg umlenkt. Dazu kommt Source-Specific Multicast mit IGMPv3, das ganz ohne RP auskommt.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: SRC
  node_definition: iosv
  x: 100
  y: 100
  configuration: |
    hostname SRC
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    no ip routing
    interface GigabitEthernet0/0
     ip address 10.1.1.10 255.255.255.0
     no shutdown
    ip default-gateway 10.1.1.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R1
  node_definition: iosv
  x: 100
  y: 250
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.0.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.1.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.13.1 255.255.255.252
     ip ospf cost 100
     no shutdown
    router ospf 1
     router-id 10.0.0.1
     passive-interface GigabitEthernet0/0
     network 10.0.0.1 0.0.0.0 area 0
     network 10.1.1.0 0.0.0.255 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.0.13.0 0.0.0.3 area 0
    ip multicast-routing
    ip pim rp-address 10.255.255.254
    ip pim ssm default
    interface GigabitEthernet0/0
     ip pim sparse-mode
    interface GigabitEthernet0/1
     ip pim sparse-mode
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R2
  node_definition: iosv
  x: 450
  y: 250
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.0.0.2 255.255.255.255
    interface Loopback1
     ip address 10.255.255.255 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.1 255.255.255.252
     no shutdown
    router ospf 1
     router-id 10.0.0.2
     network 10.0.0.2 0.0.0.0 area 0
     network 10.255.255.255 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.0.23.0 0.0.0.3 area 0
    ip multicast-routing
    ip pim rp-address 10.255.255.255
    ip pim ssm default
    ip msdp peer 10.0.0.13 connect-source Loopback0
    ip msdp originator-id Loopback0
    interface Loopback1
     ip pim sparse-mode
    interface GigabitEthernet0/0
     ip pim sparse-mode
    interface GigabitEthernet0/1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n3
  label: R3
  node_definition: iosv
  x: 450
  y: 450
  configuration: |
    hostname R3
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.0.0.3 255.255.255.255
    interface Loopback1
     ip address 10.255.255.255 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.13.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.3.3.1 255.255.255.0
     no shutdown
    router ospf 1
     router-id 10.0.0.3
     passive-interface GigabitEthernet0/2
     network 10.0.0.3 0.0.0.0 area 0
     network 10.255.255.255 0.0.0.0 area 0
     network 10.0.13.0 0.0.0.3 area 0
     network 10.0.23.0 0.0.0.3 area 0
     network 10.3.3.0 0.0.0.255 area 0
    ip multicast-routing
    ip pim rp-address 10.255.255.255
    ip pim ssm default
    ip msdp peer 10.0.0.2 connect-source Loopback0
    ip msdp originator-id Loopback0
    interface Loopback1
     ip pim sparse-mode
    interface GigabitEthernet0/1
     ip pim sparse-mode
    interface GigabitEthernet0/2
     ip pim sparse-mode
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n4
  label: RCV
  node_definition: iosv
  x: 450
  y: 600
  configuration: |
    hostname RCV
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    no ip routing
    interface GigabitEthernet0/0
     ip address 10.3.3.10 255.255.255.0
     no shutdown
    ip default-gateway 10.3.3.1
    interface GigabitEthernet0/0
     ip igmp version 3
     ip igmp join-group 239.1.1.1
     ip igmp join-group 232.1.1.1 source 10.1.1.10
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: SRC-GigabitEthernet0/0<->R1-GigabitEthernet0/0
- id: l1
