hostname R2
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 10.0.12.2 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.23.1 255.255.255.252
 no shutdown
interface Loopback1
 ip address 10.2.2.2 255.255.255.0
