links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: H1-GigabitEthernet0/0<->R1-GigabitEthernet0/0
- id: l1
  n1: n1
  n2: n2
  i1: i2
  i2: i1
  label: R1-GigabitEthernet0/1<->R2-GigabitEthernet0/0
- id: l2
