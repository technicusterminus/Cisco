lab:
  title: Lab E5 – DHCP-Server und DHCP-Relay über mehrere Router (Repair)
  description: Ein zentraler DHCP-Server (R2) versorgt zwei LANs hinter zwei Relay-Routern. Du baust Pools, Ausschlüsse und `ip helper-address` auf, verfolgst den Ablauf mit `debug ip dhcp server packet` und lernst, wie giaddr den Pool bestimmt, warum der Server eine Route zum Relay braucht und was Option 82 ändert.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: H1
  node_definition: iosv
  x: 0
  y: 150
  configuration: |
    hostname H1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address dhcp
     no shutdown
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R1
  node_definition: iosv
  x: 200
  y: 150
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.1.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.12.2
    interface GigabitEthernet0/0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R2
  node_definition: iosv
  x: 400
  y: 150
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.1 255.255.255.252
     no shutdown
    ip route 10.1.1.0 255.255.255.0 10.0.12.1
    ip dhcp excluded-address 10.1.1.1 10.1.1.254
    ip dhcp excluded-address 10.1.2.1 10.1.2.10
    ip dhcp pool LAN1
     network 10.1.1.0 255.255.255.0
     default-router 10.1.1.1
     dns-server 192.0.2.53
     domain-name lab.example
     lease 0 8
    ip dhcp pool LAN2
     network 10.1.20.0 255.255.255.0
     default-router 10.1.2.1
     dns-server 192.0.2.53
     domain-name lab.example
     lease 0 8
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n3
  label: R3
  node_definition: iosv
  x: 600
  y: 150
  configuration: |
    hostname R3
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.23.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.1.2.1 255.255.255.0
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.23.1
    interface GigabitEthernet0/1
     ip helper-address 10.0.32.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n4
  label: H2
  node_definition: iosv
  x: 800
  y: 150
  configuration: |
    hostname H2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address dhcp
     no shutdown
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
