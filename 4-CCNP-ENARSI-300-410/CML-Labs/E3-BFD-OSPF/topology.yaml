lab:
  title: Lab E3 – BFD für schnelle Fehlererkennung mit OSPF
  description: Drei Router mit OSPF, davon zwei über einen Layer-2-Switch verbunden. Fällt ein Port hinter dem Switch aus, merkt der Nachbar das nur über den OSPF-Dead-Timer. Mit BFD sinkt die Erkennungszeit von 40 Sekunden auf unter eine Sekunde. Dazu die BFD-Timer-Aushandlung und die typischen Fehler bei der Konfiguration.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 200
  y: 100
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.1.1.1 255.255.255.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
