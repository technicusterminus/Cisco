lab:
  title: 'Lab E6 – IPv6 First Hop Security: RA Guard und DHCPv6 Guard (Repair)'
  description: Im IPv6-Zugangsnetz kann jeder Host Router Advertisements und DHCPv6-Antworten senden. Du richtest auf dem Switch RA Guard und DHCPv6 Guard ein, sodass nur der Router-Port als Router und DHCPv6-Server gilt, und siehst, wie sich der Zustand am Host ändert. Dazu die Einordnung von IPv6 Snooping, ND Inspection und Source Guard.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: SW
  node_definition: iosvl2
  x: 300
  y: 150
  configuration: |
    hostname SW
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     switchport mode access
     no shutdown
    interface GigabitEthernet0/1
     switchport mode access
     no shutdown
    interface GigabitEthernet0/2
     switchport mode access
     no shutdown
    ipv6 nd raguard policy HOST-POLICY
     device-role router
    ipv6 nd raguard policy ROUTER-POLICY
     device-role router
    ipv6 dhcp guard policy SERVER-POLICY
     device-role client
    ipv6 dhcp guard policy CLIENT-POLICY
     device-role client
    interface GigabitEthernet0/0
     ipv6 nd raguard attach-policy HOST-POLICY
     ipv6 dhcp guard attach-policy SERVER-POLICY
    interface GigabitEthernet0/1
     ipv6 nd raguard attach-policy HOST-POLICY
     ipv6 dhcp guard attach-policy CLIENT-POLICY
    interface GigabitEthernet0/2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
