<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIE EI Prüfungssimulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:800px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
code{background:var(--chip);border-radius:4px;padding:0 4px;font:.88em Menlo,Consolas,monospace}pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
/* Reihenfolge */
.ord{list-style:none;padding:0;margin:8px 0}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card);cursor:grab;touch-action:none}
.ord li.drag{opacity:.4}.ord li.over{border-color:var(--acc);border-style:dashed}
.ord .n{color:var(--mut);font-variant-numeric:tabular-nums;min-width:1.4em}
.ord .t{flex:1}
.ord button{padding:2px 9px;font-size:.9rem}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.bad{border-color:var(--bad);background:var(--badbg)}
/* Zuordnung */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;min-height:48px;margin:8px 0}
.chip{border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:grab;font-size:.92rem;user-select:none}
.chip.pick{background:var(--acc);color:#fff}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.zone{min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.zone.over{border-color:var(--acc)}.zone .ph{color:var(--mut);font-size:.85rem;padding:0 6px}
.zone.ok{border:1px solid var(--ok);background:var(--okbg)}.zone.bad{border:1px solid var(--bad);background:var(--badbg)}
.right{color:var(--ok);font-size:.85rem}
@media(max-width:560px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<input type="file" id="file" accept=".json,application/json" class="hide">
<script>
const BUILTIN={title:'CCIE Enterprise Infrastructure · Prüfungssimulation',domains:{"1": "Network Infrastructure", "2": "Software Defined Infrastructure", "3": "Transport Technologies", "4": "Security und Services", "5": "Automation und Programmierbarkeit"},examN:60,examSec:5400,allSec:10000,questions:[{"d":1,"q":"Ein Access-Port zum Kunden-Switch empfängt plötzlich bessere BPDUs, die Root Bridge soll aber im eigenen Netz bleiben. Welche Funktion setzt du am Port ein?","o":["Root Guard: Der Port geht auf root-inconsistent, solange bessere BPDUs kommen.","BPDU Guard: Der Port geht bei jedem BPDU auf err-disabled und bleibt es.","Loop Guard: Der Port geht auf loop-inconsistent, solange BPDUs fehlen.","BPDU Filter: Der Port ignoriert alle empfangenen BPDUs dauerhaft."],"c":[0],"e":"Root Guard. Der Port wird bei überlegenen BPDUs auf root-inconsistent gesetzt (blockiert) und erholt sich selbst, sobald diese ausbleiben. BPDU Guard ist für PortFast-Ports, Loop Guard schützt vor BPDU-Verlust."},{"d":1,"q":"Ein Fiberlink arbeitet nur in eine Richtung, ein Switch empfängt keine BPDUs mehr und schaltet den Port auf Forwarding, es entsteht eine Schleife. Welche zwei Funktionen verhindern das? (Wähle zwei)","o":["Loop Guard","UDLD","Root Guard","BPDU Guard"],"c":[0,1],"e":"Loop Guard setzt den Port bei fehlenden BPDUs auf loop-inconsistent, UDLD erkennt die einseitige Verbindung selbst und kann den Port auf err-disabled setzen. Root Guard und BPDU Guard schützen vor anderen Fehlern."},{"d":1,"q":"Zwei MST-Switches haben gleichen Regionsnamen und gleiche Revision, aber unterschiedliche VLAN-zu-Instanz-Zuordnung. Was ist die Folge?","o":["Sie bilden getrennte Regionen und sehen sich über Boundary-Ports.","Sie bilden eine Region, die abweichende Zuordnung wird übernommen.","Der Port zwischen ihnen geht auf err-disabled und bleibt down.","Beide Switches fallen auf PVST+ zurück und tauschen keine BPDUs."],"c":[0],"e":"Name, Revision und das VLAN-zu-Instanz-Mapping (als Digest) müssen identisch sein. Sonst sind es getrennte Regionen, die Verbindung ist ein Boundary-Port, und alle Instanzen laufen als eine einzige Instanz (CIST) über die Grenze."},{"t":"match","d":1,"q":"Ordne den Rapid-PVST+-Portrollen die Beschreibung zu.","l":["Root","Designated","Alternate","Backup"],"o":["Bester Weg zur Root Bridge auf diesem Switch","Weiterleitender Port für ein Segment","Blockierter Ersatzweg zur Root über einen anderen Switch","Blockierter Ersatz für denselben Segmentzugang auf demselben Switch"],"c":[0,1,2,3],"e":"Root = bester Weg zur Root, Designated = Weiterleitung für ein Segment, Alternate = Ersatz zur Root über einen anderen Switch, Backup = Ersatz-Port am selben Segment desselben Switches (z. B. über einen Hub)."},{"d":1,"q":"Wie hoch sind die STP-Pfadkosten eines 1-Gbit/s-Ports in MST ohne Änderung der Standardwerte?","o":["20000 (long path cost method)","4 (short path cost method)","19 (short path cost method)","2000 (long path cost method)"],"c":[0],"e":"MST nutzt die Long-Methode: 1 Gbit/s = 20000, 10 Gbit/s = 2000. PVST+ und Rapid PVST+ nutzen standardmäßig die Short-Methode (1 Gbit/s = 4). Beide Seiten müssen dieselbe Methode nutzen."},{"d":1,"q":"Welche Moduskombinationen bilden einen EtherChannel? (Wähle zwei)","o":["LACP active und LACP passive","PAgP desirable und PAgP auto","LACP passive und LACP passive","PAgP auto und PAgP auto"],"c":[0,1],"e":"Mindestens eine Seite muss aktiv verhandeln (LACP <code>active</code> bzw. PAgP <code>desirable</code>). Passive/passive und auto/auto warten beide, es entsteht kein Channel. LACP und PAgP lassen sich nicht mischen."},{"d":1,"q":"Ein Port-Channel hat <code>port-channel min-links 2</code>, aktiv ist nur noch ein Mitgliedsport. Was passiert?","o":["Der Port-Channel geht down, obwohl ein Mitglied noch läuft.","Der Port-Channel bleibt up und nutzt das einzelne Mitglied.","Der letzte Port wird auf err-disabled gesetzt, der Channel bleibt up.","Der Port-Channel wechselt auf PAgP und verhandelt neu."],"c":[0],"e":"Mit <code>min-links 2</code> muss der Channel mindestens zwei aktive Mitglieder haben, sonst wird er als down gemeldet. So schaltet man auf einen Ersatzpfad um, statt mit zu wenig Bandbreite zu laufen."},{"d":1,"q":"Eine große Dateiübertragung zwischen zwei Servern nutzt nur einen Link eines Port-Channels aus vier Gigabit-Links. Was ist die Ursache?","o":["Der Hash über Quell- und Zieladresse ordnet einen Flow immer demselben Mitglied zu.","Der Port-Channel verteilt Pakete Round-Robin, nur ein Link ist aktiv.","Nur der Master-Link trägt Daten, die anderen sind Standby.","Der Port-Channel ist im LACP-Standby-Modus und nutzt einen Link."],"c":[0],"e":"EtherChannel verteilt Flows per Hash (<code>port-channel load-balance</code>), ein einzelner Flow bleibt immer auf einem Link, um Paketumordnung zu vermeiden. Mit mehr Flows oder einem anderen Hash (z. B. Ports) verteilt sich die Last besser."},{"d":1,"q":"Auf einem Trunk meldet CDP einen Native-VLAN-Mismatch (1 gegenüber 99). Welche Folge ist wahrscheinlich?","x":"%CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet0/1 (1), with SW2 GigabitEthernet0/1 (99).","o":["Ungetaggter Verkehr landet im anderen VLAN, PVST+ meldet Fehler.","Der Trunk fällt auf einen Access-Port zurück und leitet nur VLAN 1.","Der Trunk bleibt stabil, nur CDP-Frames gehen verloren.","Alle getaggten Frames werden auf dem Trunk verworfen."],"c":[0],"e":"Ungetaggte Frames werden im Native VLAN der Gegenseite abgesetzt, das führt zu VLAN-Leaks, und Rapid/PVST+ meldet <code>*SPANTREE-2-RECV_PVID_ERR</code>. Der Trunk selbst bleibt up."},{"d":1,"q":"Welche Aussage zu Private VLANs stimmt?","o":["Isolated-Ports erreichen nur den Promiscuous-Port, Community-Ports auch ihre Community.","Isolated-Ports erreichen alle Community-Ports, aber keinen Promiscuous-Port.","Community-Ports erreichen nur den Promiscuous-Port, nicht ihre Community.","Promiscuous-Ports erreichen nur Isolated-Ports, aber keine Community."],"c":[0],"e":"Isolated: nur zum Promiscuous-Port (z. B. Gateway). Community: untereinander und zum Promiscuous-Port. Der Promiscuous-Port erreicht alle."},{"d":1,"q":"Worin unterscheidet sich UDLD Aggressive von UDLD Normal?","o":["Aggressive setzt den Port bei verstummtem Nachbarn auf err-disabled.","Normal setzt den Port auf err-disabled, Aggressive nur ein Log.","Aggressive arbeitet nur auf Kupfer, Normal nur auf Fiber.","Normal erkennt keine einseitigen Links, Aggressive erkennt sie."],"c":[0],"e":"Aggressive sendet nach Verlust der Hellos mehrere Proben und schaltet den Port bei Misserfolg ab. Normal markiert nur Ports mit fehlerhafter Verkabelung (zum Beispiel vertauschte Adern), erkennt aber einseitige Links."},{"d":1,"q":"Beide Seiten eines Links stehen auf <code>switchport mode dynamic auto</code>. Was entsteht?","o":["Ein Access-Port, ein Trunk wird nicht verhandelt.","Ein Trunk, weil DTP automatisch aushandelt.","Ein err-disabled Port wegen DTP-Konflikt.","Ein Trunk, aber nur für VLAN 1."],"c":[0],"e":"Dynamic auto wartet auf eine Anfrage und fragt nicht selbst. Beide passiv ergibt Access. Mindestens eine Seite muss <code>dynamic desirable</code> oder <code>trunk</code> sein."},{"d":1,"q":"Wofür steht die Einstellung <code>l2protocol-tunnel</code> an einem 802.1Q-Tunnel-Port?","o":["Sie reicht CDP, STP oder LACP des Kunden durch den Provider.","Sie verschlüsselt die Kundenframes mit MACsec im Tunnel.","Sie erhöht die MTU des Tunnels um den zweiten Tag.","Sie blockiert die Kunden-VLANs im Provider-Netz."],"c":[0],"e":"Ohne Tunneling würde der Provider-Switch solche Frames selbst verarbeiten. Mit <code>l2protocol-tunnel</code> werden sie transparent durchgereicht. Die MTU-Anpassung (+4 Byte) ist ein eigener Schritt."},{"d":1,"q":"Wie viel größer muss die MTU im Provider-Netz bei 802.1Q-Tunneling (Q-in-Q) mindestens sein?","o":["4 Byte, also 1504 Byte pro Kunden-Frame","8 Byte, also 1508 Byte","2 Byte, also 1502 Byte","Nichts, der zweite Tag ersetzt den ersten"],"c":[0],"e":"Q-in-Q fügt einen zweiten 4-Byte-802.1Q-Tag hinzu, die Ethernet-MTU (Payload) bleibt, aber die Frame-Größe wächst. Der Provider-Port muss entsprechend größere Frames akzeptieren (<code>system mtu</code> bzw. <code>jumbo</code>)."},{"d":1,"q":"Welche Aufgabe hat Storm Control an einem Switchport?","o":["Sie begrenzt Broadcast, Multicast oder Unicast und kann den Port abschalten.","Sie begrenzt die Zahl der MAC-Adressen und sperrt den Port bei Überschreitung.","Sie wirft BPDUs auf einem PortFast-Port weg und setzt err-disabled.","Sie begrenzt die Rate der Management-Verbindungen zum Switch."],"c":[0],"e":"Storm Control misst pro Verkehrsart die Rate (Prozent oder pps) und kann beim Überschreiten Verkehr verwerfen, einen Trap senden oder den Port auf err-disabled setzen."},{"d":1,"q":"Welches Verfahren nutzt CEF standardmäßig für das Load Balancing über mehrere gleichwertige Pfade?","o":["Per Destination, Hash aus Quell- und Ziel-IP","Per-Packet im Round-Robin über alle Pfade","Per-Flow auf Basis der Layer-4-Ports allein","Gewichtet nach der Interface-Bandbreite der Pfade"],"c":[0],"e":"Per-Destination (genauer Source/Destination-Hash) hält die Pakete eines Flows in Reihenfolge. Per-Packet ist möglich, kann aber Pakete umordnen. Ungleiche Pfade (unequal cost) nutzt CEF nur bei EIGRP-Variance."},{"d":1,"q":"Große Übertragungen über einen Tunnel hängen, kleine funktionieren. Eine ACL blockiert ICMP komplett. Welche Funktion bricht damit?","o":["Path MTU Discovery, weil ICMP „Fragmentation needed“ fehlt","Die TTL-Auswertung, weil ICMP Time Exceeded fehlt","Die ARP-Auflösung, weil ICMP-Echo nötig ist","Die Router Discovery, weil ICMP Redirects fehlen"],"c":[0],"e":"Mit gesetztem DF-Bit schickt ein Router bei zu großen Paketen ICMP Typ 3 Code 4 zurück. Wird das gefiltert, bleibt das Paket hängen (Black Hole). Abhilfe: ICMP erlauben oder <code>ip tcp adjust-mss</code>."},{"d":1,"q":"Welche TCP-MSS setzt du typischerweise auf einem GRE-over-IPsec-Tunnel mit MTU 1400?","o":["1360 (Tunnel-MTU minus 40 Byte für IP- und TCP-Header)","1460 (Ethernet-MTU minus IP- und TCP-Header)","1400 (gleich der Tunnel-MTU)","1500 (volle Ethernet-MTU)"],"c":[0],"e":"MSS = MTU − 20 (IP) − 20 (TCP) = 1360. <code>ip tcp adjust-mss 1360</code> am Tunnel sorgt dafür, dass TCP-Sitzungen von Anfang an passende Segmente nutzen."},{"d":1,"q":"Welche Link-Local-Adresse bildet ein Interface mit MAC 0011.2233.4455 per EUI-64?","o":["FE80::211:22FF:FE33:4455","FE80::11:22FF:FE33:4455","FE80::211:2233:4455:FFFE","FE80::0011:2233:4455:0000"],"c":[0],"e":"FF FE wird in die Mitte der MAC eingefügt und das Universal/Local-Bit (7. Bit) gekippt, aus 00 wird 02. Ergebnis 0211:22FF:FE33:4455."},{"d":1,"q":"Welche Zieladresse nutzt Duplicate Address Detection für ein neues IPv6-Interface?","o":["Die Solicited-Node-Adresse (FF02::1:FFxx:xxxx), Quelle ::","FF02::1 (All Nodes), Quelle die neue Adresse","FF02::2 (All Routers), Quelle die Link-Local","Die Anycast-Adresse des Subnetzes, Quelle ::"],"c":[0],"e":"DAD: Neighbor Solicitation an die Solicited-Node-Adresse der zu prüfenden Adresse, mit unspezifizierter Quelle (::). Antwortet jemand, ist die Adresse doppelt."},{"d":1,"q":"Wann sendet ein Router einen ICMP-Redirect?","o":["Wenn Eingang und Ausgang dasselbe Interface sind und ein besserer Router existiert.","Wenn die TTL des Pakets abgelaufen ist.","Wenn die Zieladresse in keiner Route steht.","Wenn das Paket größer als die MTU ist und DF gesetzt ist."],"c":[0],"e":"Redirect: Der Absender könnte den besseren Next Hop direkt erreichen. Am Router lässt er sich mit <code>no ip redirects</code> abschalten (üblich bei Härtung)."},{"d":1,"q":"Wie sieht die Redundanz von zwei gleichartigen Uplinks aus, wenn auf dem Router zwei Routen gleicher AD und Metrik liegen?","o":["Beide Pfade werden in die RIB eingetragen und per ECMP genutzt.","Nur die Route mit der niedrigeren Router-ID wird eingetragen.","Nur die zuerst gelernte Route wird eingetragen, die zweite wartet.","Beide werden eingetragen, aber nur eine wird per CEF genutzt."],"c":[0],"e":"Gleiche AD und Metrik ergeben Equal Cost Multipath, bis zu <code>maximum-paths</code> (Standard je nach Protokoll 4 oder 6). Bei BGP gelten zusätzliche Regeln (z. B. Router-ID als Tiebreaker ohne Multipath)."},{"d":1,"q":"Wie funktioniert die rekursive Next-Hop-Auflösung bei <code>ip route 10.0.0.0 255.0.0.0 192.168.1.2</code>?","o":["Der Router sucht eine Route zu 192.168.1.2 und nutzt deren Ausgangsinterface.","Der Router sendet ARP für 10.0.0.0 und nutzt das Ergebnis.","Der Router nutzt immer die Default-Route zum Next Hop.","Der Router ersetzt den Next Hop durch die eigene Loopback-Adresse."],"c":[0],"e":"Ein Next Hop ohne Interface muss rekursiv aufgelöst werden. Die Auflösung kostet CEF-Zeit, ist aber normal. Zeigt die Route auf sich selbst (Rekursion über die gleiche Route), wird sie verworfen."},{"d":1,"q":"Warum nutzt traceroute standardmäßig UDP-Pakete mit steigender TTL, und was antwortet das Zwischengerät?","o":["Zwischenhop: Time Exceeded, Ziel: Port Unreachable.","Das Zwischengerät sendet TCP RST, das Ziel ICMP Echo Reply.","Das Zwischengerät sendet ICMP Redirect, das Ziel ICMP Echo Reply.","Beide senden ICMP Destination Unreachable (Host)."],"c":[0],"e":"Hops melden mit Time Exceeded (Typ 11), das Ziel mit Port Unreachable (Typ 3 Code 3), weil kein Dienst auf dem hohen UDP-Port lauscht. Filtern von ICMP macht Traceroute unvollständig."},{"d":1,"q":"Ein Router hat zwei Routen zum Präfix, eine per OSPF (AD 110, Metrik 20), eine per EIGRP extern (AD 170, Metrik 1000). Welche wird genutzt?","o":["Die OSPF-Route, weil die AD niedriger ist","Die EIGRP-Route, weil die Metrik höher ist","Beide, weil die Protokolle verschieden sind","Die EIGRP-Route, weil sie jünger ist"],"c":[0],"e":"Verglichen wird zuerst die AD, die Metrik nur innerhalb eines Protokolls. 110 schlägt 170."},{"d":1,"q":"Ein Router erhält für 10.1.1.0/24 sowohl einen Eintrag aus EIGRP als auch ein statisches Floating-Route mit AD 200. Wann wird die statische genutzt?","o":["Nur wenn die EIGRP-Route aus der Tabelle verschwindet.","Immer parallel, wegen ECMP.","Nur wenn die Metrik der EIGRP-Route über 200 liegt.","Sobald BFD das Interface als down meldet, unabhängig von EIGRP."],"c":[0],"e":"Floating Static Routes mit höherer AD als das dynamische Protokoll liegen in der Tabelle erst, wenn die bessere Route fehlt."},{"d":1,"q":"Wie nutzt man IP SLA mit einer statischen Route, damit sie bei Ausfall eines entfernten Ziels verschwindet?","o":["Eine Messung per Track-Objekt mit der Route verknüpfen: <code>ip route … track 1</code>","Die Route mit <code>permanent</code> versehen und die Messung loggen","Die Route in eine Route-Map mit <code>set ip next-hop verify</code> legen","Per <code>ip sla schedule</code> direkt auf dem Interface abbilden"],"c":[0],"e":"Mit <code>track 1 ip sla 1 reachability</code> und <code>ip route … track 1</code> wird die Route bei einem Fehlschlag aus der Tabelle genommen."},{"t":"order","d":1,"q":"Bring die Schritte der IPv6-Autokonfiguration (SLAAC) in die richtige Reihenfolge.","o":["Link-Local-Adresse bilden","Duplicate Address Detection für die Link-Local","Router Solicitation senden","Router Advertisement mit Präfix empfangen","Globale Adresse aus Präfix und Interface-ID bilden und DAD durchführen"],"e":"Erst Link-Local und DAD, dann RS an FF02::2, RA mit Präfix und A-Flag, danach die globale Adresse und deren DAD."},{"d":1,"q":"Welches Feld im Router Advertisement sagt dem Host, dass die Adresse nur per DHCPv6 vergeben wird?","o":["Das M-Flag (Managed Address Configuration)","Das A-Flag (Autonomous) im Präfix","Das L-Flag (On-Link) im Präfix","Das R-Flag (Router) im Header"],"c":[0],"e":"M = Adresse per DHCPv6, O = weitere Konfiguration per DHCPv6. Das A-Flag erlaubt SLAAC, das L-Flag markiert das Präfix als on-link."},{"d":1,"q":"Wie funktioniert VTP Version 3 zum Schutz gegen versehentliche Überschreibung?","o":["Nur der Primary Server schreibt, per <code>vtp primary</code> festgelegt.","Jeder Server schreibt, die höchste Revision gewinnt wie bei v1.","Die Konfiguration wird nur per Passwort geschützt, ohne Primary.","Alle Switches schreiben gleichzeitig, der Master wird per Wahl bestimmt."],"c":[0],"e":"VTPv3 kennt Primary und Secondary Server. Nur der Primary kann ändern (<code>vtp primary</code>), und die Revisionsnummer allein überschreibt keine Datenbank mehr."},{"d":1,"q":"Welche klassische EIGRP-Metrik ergibt sich bei einem Pfad mit kleinster Bandbreite 10000 kbit/s und einem summierten Delay von 1100 µs (Standard-K-Werte)?","o":["284160","28416","1110","256000"],"c":[0],"e":"Metrik = 256 × (10<sup>7</sup>/Bandbreite in kbit/s + Delay in 10 µs). 10<sup>7</sup>/10000 = 1000, Delay 1100 µs = 110. (1000 + 110) × 256 = 284160."},{"d":1,"q":"Warum gibt es im Named Mode die Wide Metrics?","o":["Die 32-Bit-Metrik trennt Links ab 10 Gbit/s nicht mehr, 64 Bit lösen das.","Die Wide Metrics erlauben mehr als 6 gleichwertige Pfade in der RIB.","Sie ersetzen DUAL durch einen Link-State-Algorithmus mit LSAs.","Sie verschlüsseln die Metrik in Updates gegen Manipulation."],"c":[0],"e":"Klassische EIGRP-Bandbreite wird bei 10 Gbit/s und mehr auf 1 abgerundet, damit sind schnelle Links nicht unterscheidbar. Wide Metrics (64 Bit) mit Skalierung (RIB-Scaling) sorgen für feinere Auflösung."},{"d":1,"q":"Welche Maßnahmen begrenzen den Query-Bereich und helfen gegen Stuck-in-Active? (Wähle zwei)","o":["EIGRP-Stub-Konfiguration an Spokes","Summarization an der Grenze der Query-Domäne","Höheres Hello-Intervall auf den Links","Höhere Variance auf allen Routern"],"c":[0,1],"e":"Stub-Router werden nicht gefragt, und eine Summary beantwortet Queries für Teilnetze sofort. Hello-Timer und Variance ändern nichts am Reichweitenverhalten von Queries."},{"d":1,"q":"Ein Spoke ist als <code>eigrp stub</code> konfiguriert, soll aber zusätzlich eine bestimmte Route weitergeben. Was nutzt du?","o":["<code>eigrp stub leak-map NAME</code> mit Route-Map","<code>eigrp stub redistributed</code> mit Prefix-List","<code>eigrp stub receive-only</code> mit Distribute-List","<code>eigrp stub connected static</code> mit Route-Tag"],"c":[0],"e":"Mit <code>leak-map</code> lassen sich bestimmte Routen trotz Stub weitergeben. <code>redistributed</code> und <code>static</code> erlauben nur ganze Routenklassen, <code>receive-only</code> kündigt nichts an."},{"d":1,"q":"Wozu dient ein <code>offset-list</code> in EIGRP?","o":["Er addiert einen Wert zur Metrik und beeinflusst die Pfadwahl.","Er verschiebt die AD der Routen um einen festen Wert.","Er verschiebt die Hello-Intervalle auf dem Interface.","Er filtert Routen und setzt den Zähler der Fehlversuche zurück."],"c":[0],"e":"<code>offset-list 1 in 500 Gi0/0</code> erhöht die Metrik der passenden eingehenden Routen um 500, um einen Pfad weniger attraktiv zu machen."},{"d":1,"q":"Wie bauen zwei EIGRP-Router über ein Provider-Netz ohne MPLS und ohne Multicast eine Nachbarschaft auf?","o":["Mit EIGRP Over the Top (OTP), das Pakete per LISP als Unicast überträgt","Mit EIGRP Stub, das Updates per HTTP tunnelt","Mit EIGRP Named Mode, der automatisch GRE aufbaut","Mit EIGRP over MPLS, das Labels über das Internet verteilt"],"c":[0],"e":"EIGRP OTP: Statische Nachbarn mit <code>remote … lisp-encap</code>, Transport per LISP-Header. Der Provider sieht nur normale IP-Pakete. Das Muster wird oft statt DMVPN genutzt."},{"d":1,"q":"Welche Routen kündigt ein Router mit <code>eigrp stub receive-only</code> an?","o":["Keine, er nimmt Routen an, gibt aber nichts weiter.","Nur verbundene Routen und Summaries.","Nur statische und redistribuierte Routen.","Alle Routen, aber ohne Query-Antworten."],"c":[0],"e":"Receive-only schließt alle anderen Optionen aus und kündigt keine Routen an. Der Nachbar muss dann statisch oder per Default auf den Stub zeigen."},{"d":1,"q":"Wo siehst du Nachfolger, die die Feasibility Condition nicht erfüllen?","o":["In <code>show ip eigrp topology all-links</code>","In <code>show ip eigrp topology</code> ohne Zusatz","In <code>show ip route eigrp</code> mit Zusatz <code>all</code>","In <code>show ip eigrp neighbors detail</code>"],"c":[0],"e":"Die normale Topologietabelle zeigt nur Successor und Feasible Successors. Mit <code>all-links</code> erscheinen alle gelernten Pfade."},{"d":1,"q":"Welche Standard-Timer nutzt EIGRP auf Ethernet, und was ändert sich bei Links mit 1,544 Mbit/s oder weniger (NBMA)?","o":["Hello 5 s und Hold 15 s, bei langsamem NBMA 60 s und 180 s","Hello 10 s und Hold 40 s, bei NBMA 30 s und 120 s","Hello 5 s und Hold 15 s, bei NBMA unverändert","Hello 60 s und Hold 180 s auf allen Links"],"c":[0],"e":"5/15 Sekunden auf schnellen Links, 60/180 auf niedrigen Bandbreiten. Der Hold-Wert wird im Hello mitgeschickt, Unterschiede verhindern die Nachbarschaft nicht."},{"d":1,"q":"Welche Standard-K-Werte nutzt EIGRP, und was passiert bei einer Abweichung?","o":["K1 = K3 = 1, andere 0, bei Abweichung keine Nachbarschaft","K2 = K4 = 1, alle anderen 0, Abweichung wird toleriert","K1 = K2 = K3 = 1, alle anderen 0, Abweichung wird toleriert","K1 bis K5 = 1, bei Abweichung gilt der niedrigere Wert"],"c":[0],"e":"Bandbreite (K1) und Delay (K3). K-Wert-Mismatch löst die Meldung „K-value mismatch“ aus, die Nachbarschaft kommt nicht zustande."},{"d":1,"q":"Warum benötigt ein ASBR im OSPF Typ-4-LSAs?","o":["Der ABR meldet anderen Areas den Weg zum ASBR, weil Typ 5 überall geflutet wird.","Typ-4-LSAs enthalten die externen Präfixe selbst, Typ 5 nur Metriken.","Typ-4-LSAs ersetzen den DR in Multi-Access-Netzen.","Typ-4-LSAs transportieren NSSA-Routen in den Backbone."],"c":[0],"e":"Ein Router in Area 2 sieht ein Typ-5-LSA mit dem ASBR als Advertising Router. Ohne Typ 4 wüsste er nicht, wie er den ASBR in Area 1 erreicht."},{"d":1,"q":"In einer NSSA mit zwei ABRs übersetzt nur einer Typ 7 in Typ 5. Welcher?","o":["Der ABR mit der höchsten Router-ID (Standard)","Der ABR mit der niedrigsten Router-ID","Der DR der NSSA","Beide, jeder in seine Richtung"],"c":[0],"e":"Der Translator wird per Router-ID gewählt (höchste gewinnt). Mit <code>area X nssa translate type7 always</code> lässt sich das erzwingen."},{"d":1,"q":"Ein Typ-5-LSA hat eine Forwarding-Adresse, die nicht in der Routing-Tabelle steht. Was passiert?","o":["Die externe Route wird nicht installiert.","Die Route wird mit dem ASBR als Next Hop installiert.","Die Route wird installiert, die Metrik wird um 1 erhöht.","Der Router fordert ein neues LSA vom ASBR an."],"c":[0],"e":"Mit gesetzter Forwarding-Adresse zeigt die Route auf diese, nicht auf den ASBR. Ist sie nicht erreichbar, ist die externe Route nutzlos und wird nicht in die RIB aufgenommen."},{"d":1,"q":"OSPF kennt für dasselbe Präfix Routen als O, O IA, O E1 und O E2. Welche wird bevorzugt?","o":["O, dann O IA, dann O E1, dann O E2, unabhängig von den Kosten","Die mit den niedrigsten Kosten, unabhängig vom Typ","O E1 vor O, weil die externe Metrik zählt","O IA vor O, weil sie vom ABR kommt"],"c":[0],"e":"Die Rangfolge ist fest: Intra-Area, Inter-Area, E1, E2. Erst innerhalb gleicher Typen entscheiden die Kosten."},{"d":1,"q":"Wie verhinderst du am ABR, dass Area 1 bestimmte Inter-Area-Präfixe lernt?","o":["<code>area 1 filter-list prefix NAME in</code> oder <code>out</code>","<code>distribute-list NAME in</code> unter <code>router ospf</code>","<code>area 1 stub no-summary</code> am ABR","<code>ip ospf database-filter all out</code> am Interface"],"c":[0],"e":"<code>area filter-list prefix</code> filtert Typ-3-LSAs beim Weg in oder aus einer Area. Eine Distribute-List würde nur die RIB betreffen, nicht die LSDB der anderen Router."},{"d":1,"q":"Welchen Zweck hat <code>max-metric router-lsa on-startup wait-for-bgp</code>?","o":["Der Router wird beim Start als Transit gemieden, bis BGP konvergiert hat.","Der Router blockiert OSPF-Hellos, bis BGP alle Routen hat.","Die Metrik aller Interfaces wird dauerhaft auf 65535 gesetzt.","OSPF wartet auf die Konvergenz von BGP, bevor SPF läuft."],"c":[0],"e":"Stub Router Advertisement: Der Router kündigt maximale Kosten an, damit kein Verkehr über ihn läuft, solange er noch nicht bereit ist. So werden Blackholes beim Neustart vermieden."},{"d":1,"q":"Was bewirkt <code>prefix-suppression</code> in OSPF?","o":["Transit-Link-Präfixe werden nicht angekündigt, nur Loopbacks bleiben.","Alle Präfixe werden zu einer Summary zusammengefasst.","Typ-3-LSAs werden nicht in Stub-Areas geflutet.","Hellos werden mit weniger Optionen gesendet."],"c":[0],"e":"Transit-Netze brauchen oft keine Route. Mit Prefix Suppression sinkt die Zahl der Einträge, Konvergenz wird schneller und die Angriffsfläche kleiner."},{"d":1,"q":"Welche Kosten hat ein 10-Gbit/s-Interface in OSPF, wenn <code>auto-cost reference-bandwidth 100000</code> gesetzt ist?","o":["10","1","100","1000"],"c":[0],"e":"Kosten = Referenzbandbreite / Interface-Bandbreite = 100000 Mbit/s / 10000 Mbit/s = 10. Die Referenz sollte auf allen Routern gleich sein."},{"d":1,"q":"Was bedeuten die drei Werte in <code>timers throttle spf 50 200 5000</code>?","o":["Start 50 ms, Hold 200 ms, Maximum 5000 ms","Maximalzeit 50 ms, Hold 200 ms, Start 5000 ms","Hello 50 s, Dead 200 s, Wait 5000 s","Anzahl, Intervall und Dauer der SPF-Berechnung"],"c":[0],"e":"Start, Hold und Maximum in Millisekunden. Bei Folge-Ereignissen verdoppelt sich die Hold-Time bis zum Maximum, danach sinkt sie wieder. Damit lässt sich Konvergenz beschleunigen, ohne CPU-Last zu riskieren."},{"d":1,"q":"Welche OSPFv3-Instanz-ID-Bereiche gelten für Address Families?","o":["0–31 für IPv6 Unicast und 64–95 für IPv4 Unicast","0–63 für IPv6 und 64–127 für IPv4","0–15 für IPv6 und 16–31 für IPv4","Alle 0–255, ohne Trennung nach Address Family"],"c":[0],"e":"Instanz 0–31 IPv6 Unicast, 32–63 IPv6 Multicast, 64–95 IPv4 Unicast, 96–127 IPv4 Multicast. Über die Instance-ID laufen mehrere OSPFv3-Prozesse auf demselben Link."},{"d":1,"q":"Was macht IP Fast Reroute (LFA) in OSPF?","o":["Es berechnet vorab einen Ersatz-Next-Hop und schaltet in unter 50 ms um.","Es sendet Hellos im Millisekunden-Takt und baut Nachbarn neu auf.","Es verteilt alle Routen doppelt und wartet auf Bestätigung.","Es berechnet nach Ausfall den Pfad per Dijkstra auf einem Hilfsrouter."],"c":[0],"e":"Loop-Free Alternates sind vorab berechnete Ersatzpfade (<code>fast-reroute per-prefix enable</code>). Beim Link-Ausfall wird sofort umgeschaltet, noch bevor SPF neu läuft."},{"d":1,"q":"Wozu dient <code>ip ospf multi-area 1</code> auf einem Interface in Area 0?","o":["Der Link bekommt eine zusätzliche Verbindung in Area 1.","Es lässt das Interface zwei DRs für zwei Areas wählen.","Es erzeugt eine zweite OSPF-Prozess-ID auf dem Link.","Es verteilt Area-0-Routen automatisch in Area 1."],"c":[0],"e":"Multi-Area Adjacency ermöglicht, einen Link in zwei Areas zu nutzen. Damit bleibt eine Intra-Area-Route bevorzugt, ohne dass eine Backdoor-Strecke in die falsche Area fällt."},{"d":1,"q":"Wie lange bleibt ein OSPF-LSA maximal in der Datenbank, und wann wird es vom Ursprung erneuert?","o":["Max-Age 3600 s, Refresh nach 1800 s","Max-Age 1800 s, Refresh nach 900 s","Max-Age 7200 s, Refresh nach 3600 s","Max-Age 3600 s, Refresh nach 3600 s"],"c":[0],"e":"Der Ursprung erneuert LSAs alle 30 Minuten (LSRefreshTime), nach 60 Minuten ohne Erneuerung würde das LSA aus der Datenbank fallen."},{"d":1,"q":"Welcher Netzwerktyp braucht manuelle <code>neighbor</code>-Einträge, wählt aber keinen DR?","o":["Point-to-Multipoint non-broadcast mit manuellen Nachbarn","Broadcast","Point-to-Point","Non-Broadcast (NBMA)"],"c":[0],"e":"P2MP non-broadcast: kein Multicast, manuelle Nachbarn, kein DR/BDR. Der NBMA-Typ braucht ebenfalls Nachbarn, wählt aber einen DR."},{"t":"order","d":1,"q":"Bring die BGP-Pfadwahlkriterien in die Reihenfolge, in der Cisco IOS sie prüft.","o":["Höchstes Weight","Höchste Local Preference","Lokal erzeugter Pfad","Kürzester AS-Pfad","Niedrigster Origin-Code","Niedrigster MED","eBGP vor iBGP","Niedrigste IGP-Metrik zum Next Hop","Ältester eBGP-Pfad","Niedrigste Router-ID","Kürzeste Cluster-Liste","Niedrigste Nachbaradresse"],"e":"Weight, LocPrf, lokal erzeugt, AS-Pfad-Länge, Origin (i < e < ?), MED, eBGP vor iBGP, IGP-Metrik, ältester eBGP-Pfad, niedrigste Router-ID, kürzeste Cluster-Liste, niedrigste Nachbaradresse. Das Weight ist nur Cisco-lokal."},{"d":1,"q":"Was unterscheidet eine BGP-Confederation von Route Reflectors beim Umgang mit eBGP zwischen Sub-ASen?","o":["Zwischen Sub-ASen laufen Confed-eBGP-Sitzungen, Local Preference und Next Hop bleiben erhalten.","Zwischen Sub-ASen laufen iBGP-Sitzungen, die Local Preference wird zurückgesetzt.","Zwischen Sub-ASen laufen eBGP-Sitzungen, der Next Hop wird immer ersetzt.","Zwischen Sub-ASen werden keine BGP-Sitzungen, sondern IGP-Verbindungen genutzt."],"c":[0],"e":"Confederation teilt ein AS in Sub-ASen mit eigenem Full-Mesh. Zwischen Sub-ASen gilt Confed-eBGP, das AS_CONFED_SEQUENCE im Pfad nutzt, aber LocPrf, MED und Next Hop erhält, als wäre es ein AS."},{"d":1,"q":"Ein Route Reflector bekommt ein Präfix von einem Non-Client. An wen reflektiert er es?","o":["An alle Clients, nicht an andere Non-Clients","An alle Clients und alle Non-Clients","Nur an eBGP-Peers","An keinen, Reflection gilt nur für Clients"],"c":[0],"e":"Von Non-Client: nur an Clients. Von Client: an Clients und Non-Clients. Von eBGP: an alle. Non-Clients müssen untereinander ein Full Mesh bilden."},{"t":"match","d":1,"q":"Ordne die BGP-Optionen ihrer Wirkung zu.","l":["local-as","as-override","allowas-in","remove-private-as"],"o":["Peer sieht ein anderes AS (AS-Migration)","Ersetzt die AS des Peers im Pfad durch die eigene","Akzeptiert die eigene AS im empfangenen Pfad","Entfernt private AS-Nummern aus ausgehenden Pfaden"],"c":[0,1,2,3],"e":"<code>local-as</code> für Migrationen, <code>as-override</code> am PE bei gleicher Kunden-AS, <code>allowas-in</code> am CE, <code>remove-private-as</code> am Provider-Rand."},{"d":1,"q":"Zwei eBGP-Pfade zum selben Präfix kommen von zwei verschiedenen Nachbar-ASen mit gleich langem AS-Pfad, Maximum-Paths ist 4. Es wird nur ein Pfad installiert. Was fehlt?","o":["<code>bgp bestpath as-path multipath-relax</code> aktivieren","<code>bgp always-compare-med</code>","<code>bgp deterministic-med</code>","<code>neighbor … next-hop-self</code>"],"c":[0],"e":"Multipath verlangt gleiche Nachbar-AS, außer man lockert mit <code>multipath-relax</code> (gleiche Länge reicht dann)."},{"d":1,"q":"Wozu dienen <code>advertise-map</code> und <code>non-exist-map</code> bei <code>neighbor … advertise-map … non-exist-map …</code>?","o":["Das Präfix wird nur angekündigt, solange die Non-Exist-Map-Route fehlt.","Beide Maps filtern ankommende Routen per Prefix-List.","Sie begrenzen die Zahl der Präfixe, die ein Peer senden darf.","Sie setzen Communities auf Pfade abhängig vom AS-Pfad."],"c":[0],"e":"Conditional Advertisement: Backup-Pfad zu ISP2 wird erst angekündigt, wenn die Route von ISP1 verschwindet (Non-Exist) oder bei Exist-Map, wenn sie vorhanden ist."},{"d":1,"q":"Welche Standardwerte hat BGP Route Flap Dampening?","o":["Penalty 1000 je Flap, Suppress 2000, Reuse 750, Half-Life 15 Minuten","Penalty 500 je Flap, Suppress 1000, Reuse 250, Half-Life 5 Minuten","Penalty 1000 je Flap, Suppress 750, Reuse 2000, Half-Life 15 Minuten","Penalty 2000 je Flap, Suppress 1000, Reuse 500, Half-Life 30 Minuten"],"c":[0],"e":"Bei Überschreiten von 2000 wird die Route unterdrückt und erst unter 750 wieder verwendet. Die Strafe halbiert sich alle 15 Minuten."},{"d":1,"q":"Welches Problem löst BGP PIC (Prefix Independent Convergence)?","o":["Bei Ausfall wird sofort auf einen vorberechneten Ersatzpfad umgeschaltet.","Es verteilt jedes Präfix gleichzeitig auf alle Peers, ohne Reihenfolge.","Es gruppiert Präfixe per Route-Map und sendet sie in einem einzigen Update.","Es unterdrückt Updates für Präfixe, die kein Peer abonniert hat."],"c":[0],"e":"PIC legt Primär- und Backup-Pfad in der Forwarding-Struktur ab (gemeinsame Pfadliste). Beim Ausfall genügt eine Änderung statt Millionen einzelner FIB-Updates."},{"d":1,"q":"Was bewirkt <code>neighbor 10.0.0.2 ttl-security hops 1</code>?","o":["Pakete mit TTL unter 254 werden verworfen, selbst sendet er TTL 255.","Der Router erlaubt eBGP über bis zu einen zusätzlichen Hop.","Der Router sendet BGP-Pakete mit TTL 1 und verwirft alle anderen.","Der Router verlangt TCP-MD5 mit einem TTL-Feld im Header."],"c":[0],"e":"GTSM: Pakete mit zu niedriger TTL stammen nicht von einem direkten Nachbarn und werden verworfen. Das schützt vor entfernten Angriffen auf die Sitzung. Nicht kombinierbar mit <code>ebgp-multihop</code>."},{"d":1,"q":"Die BGP-Sitzung kommt nicht hoch, im Log steht die Meldung. Was ist die wahrscheinliche Ursache?","x":"%TCP-6-BADAUTH: No MD5 digest from 10.0.0.2(179) to 10.0.0.1(51223) tableid - 0","o":["Der Nachbar sendet ohne MD5-Passwort, lokal ist eins gesetzt.","Die AS-Nummer des Nachbarn ist falsch konfiguriert.","Die MTU zwischen den Peers ist zu klein für das Open.","Die Hold-Time ist auf beiden Seiten verschieden."],"c":[0],"e":"<code>No MD5 digest from</code> heißt: Das Paket kam ohne Signatur, obwohl wir eine erwarten. Passwort auf beiden Seiten identisch setzen oder entfernen."},{"d":1,"q":"Wann reagiert BGP bei der Standardeinstellung auf Änderungen des Next Hops in der RIB?","o":["Ereignisgesteuert per Next Hop Tracking, nach kurzer Verzögerung","Alle 60 Sekunden durch den BGP-Scanner","Erst nach Ablauf der Hold-Time","Nur nach manuellem <code>clear ip bgp</code>"],"c":[0],"e":"Next Hop Tracking reagiert in Sekunden (kritisch 3 s, unkritisch 5 s) statt durch periodisches Scannen. Der alte Scanner arbeitete mit 60 Sekunden."},{"d":1,"q":"Was bewirkt <code>neighbor 10.0.0.2 default-originate</code>?","o":["Der Nachbar bekommt 0.0.0.0/0, auch ohne eigene Default-Route.","Der Router sendet die Default-Route nur, wenn sie in der RIB liegt.","Der Router akzeptiert von dem Nachbarn nur eine Default-Route.","Der Router setzt die Default-Route bei allen Peers auf Weight 0."],"c":[0],"e":"<code>default-originate</code> erzeugt die Default-Route für diesen Nachbarn, optional gebunden an eine Route-Map. Alle anderen Präfixe gehen weiter nach der Policy."},{"d":1,"q":"Wozu dient <code>as-set</code> bei <code>aggregate-address … as-set summary-only</code>?","o":["Es trägt die AS-Nummern der Teilrouten in den AS-Pfad ein.","Es setzt das Origin der Summary auf Incomplete.","Es unterdrückt die Atomic-Aggregate-Markierung für Peers.","Es erzeugt eine Community pro Teilnetz."],"c":[0],"e":"Ohne <code>as-set</code> geht die AS-Pfad-Information der Teilrouten verloren und die Route wird als Atomic Aggregate markiert. Mit as-set bleibt die Schleifenvermeidung erhalten."},{"d":1,"q":"Was passiert mit bestehenden Communities, wenn eine Route-Map <code>set community 65000:100</code> ohne <code>additive</code> setzt?","o":["Alle vorhandenen Communities werden ersetzt.","Die neue Community wird angehängt.","Die Route wird verworfen.","Nur die Well-known Communities werden ersetzt."],"c":[0],"e":"Ohne <code>additive</code> überschreibt <code>set community</code> alle Communities. Mit <code>additive</code> wird angehängt."},{"d":1,"q":"Wozu dient <code>bgp deterministic-med</code>?","o":["Pfade werden nach Nachbar-AS gruppiert, die Wahl wird reihenfolgeunabhängig.","Der MED wird immer zwischen allen Pfaden verglichen.","Der MED wird beim Senden auf 0 gesetzt.","Ein fehlender MED wird als schlechtester Wert gewertet."],"c":[0],"e":"Ohne die Option hängt die Wahl bei MED vom Alter der Pfade ab. Deterministic MED vergleicht innerhalb jeder Nachbar-AS-Gruppe und danach die Gewinner."},{"d":1,"q":"Welcher Unterschied besteht zwischen Route Refresh und <code>soft-reconfiguration inbound</code>?","o":["Soft-Reconfiguration speichert eine Kopie, Route Refresh fordert neu an.","Route Refresh speichert eine Kopie, Soft-Reconfiguration fordert neu an.","Beide speichern eine Kopie, nur auf unterschiedlichen Prozessen.","Beide trennen die Sitzung kurz, aber nur Refresh bewahrt die Tabelle."],"c":[0],"e":"Route Refresh braucht keine Kopie, spart Speicher und wird bevorzugt. Soft-Reconfiguration ist nötig, wenn der Nachbar keinen Refresh unterstützt oder man vor der Policy sehen will."},{"d":1,"q":"Welcher Pfad gewinnt für 10.9.0.0/16, wenn alle früheren Kriterien gleich sind?","x":"R1# show ip bgp 10.9.0.0\n   Network      Next Hop   Metric LocPrf Weight Path\n * 10.9.0.0/16   10.0.0.2        0    100      0 65020 ?\n *>10.9.0.0/16   10.0.0.3        0    100      0 65030 i","o":["Der Pfad über 10.0.0.3 wegen Origin <code>i</code>","Der Pfad über 10.0.0.2 wegen Origin <code>?</code>","Beide, wegen ECMP","Der Pfad über 10.0.0.2, weil er älter ist"],"c":[0],"e":"Origin-Reihenfolge: IGP (<code>i</code>) vor EGP (<code>e</code>) vor Incomplete (<code>?</code>). Ein <code>?</code> deutet auf Redistribution in BGP hin."},{"d":1,"q":"Ein Route Reflector hat <code>neighbor … next-hop-self</code> für Clients gesetzt. Warum ändert sich der Next Hop reflektierter iBGP-Routen trotzdem nicht?","o":["Reflektierte Routen behalten ihren Next Hop, es braucht <code>next-hop-self all</code>.","Weil der RR den Next Hop immer durch seine Loopback ersetzt.","Weil <code>next-hop-self</code> nur für eBGP gilt.","Weil der RR keine Attribute verändern darf, auch nicht bei eBGP."],"c":[0],"e":"Ein RR darf bei reflektierten Routen den Next Hop standardmäßig nicht ändern. Mit <code>next-hop-self all</code> (IOS) wird das erzwungen."},{"d":1,"q":"Wie bewertet BGP Origin Validation per RPKI einen Präfix, dessen Ursprungs-AS nicht zur ROA passt?","o":["<code>invalid</code>","<code>not-found</code>","<code>valid</code>","<code>unknown-origin</code>"],"c":[0],"e":"Drei Zustände: valid (ROA passt), invalid (ROA vorhanden, aber falsche AS oder zu lange Maske), not-found (keine ROA). Invalid-Routen lassen sich verwerfen oder abwerten."},{"t":"order","d":1,"q":"Bring die Schritte beim PIM-SM-Aufbau (ASM) in die richtige Reihenfolge.","o":["Empfänger meldet per IGMP die Gruppe an","Der letzte Router sendet ein (*,G)-Join zum RP","Quelle sendet, der DR kapselt Pakete in PIM-Register","Der RP sendet ein (S,G)-Join zur Quelle, Register-Stop folgt","Der letzte Router wechselt auf den kürzesten Pfad (SPT)"],"e":"IGMP-Report, (*,G)-Join über den Shared Tree, Register der Quelle an den RP, RP baut den Source Tree auf, dann SPT-Switchover am Last-Hop-Router."},{"d":1,"q":"Multicast-Verkehr wird am Router verworfen, <code>show ip mroute</code> meldet „RPF failure“. Was bedeutet das?","o":["Das Paket kam auf einem Interface an, über das die Quelle nicht erreichbar ist.","Der Router hat den RP nicht erreicht und sendet es per Broadcast.","Die TTL des Pakets war bei der Ankunft schon 0.","Das IGMP-Querier-Interface ist auf einem anderen Port."],"c":[0],"e":"Reverse Path Forwarding: Eingehende Multicast-Pakete werden nur akzeptiert, wenn die Route zur Quelle (oder zum RP bei (*,G)) auf dasselbe Interface zeigt. Abhilfe: Routing korrigieren oder <code>ip mroute</code>."},{"d":1,"q":"Welche Voraussetzungen hat PIM Source-Specific Multicast?","o":["IGMPv3 am Empfänger, Gruppen im Bereich 232.0.0.0/8, kein RP","IGMPv2 am Empfänger, Gruppen in 239.0.0.0/8, Anycast RP","IGMPv1 am Empfänger, Gruppen in 224.0.0.0/24, Auto-RP","IGMPv3 am Empfänger, Gruppen in 225.0.0.0/8, mit BSR"],"c":[0],"e":"SSM braucht kein RP, weil der Empfänger die Quelle selbst nennt ((S,G)-Join). IGMPv3 (oder URD/IGMP-Mapping) ist nötig, der Standardbereich ist 232.0.0.0/8."},{"d":1,"q":"Wozu dient MSDP in einem Anycast-RP-Design?","o":["Die RPs tauschen aktive Quellen aus und kennen sie alle.","MSDP verteilt Gruppen-zu-RP-Zuordnungen wie BSR.","MSDP ersetzt IGMP zwischen Empfänger und DR.","MSDP verschlüsselt PIM-Register zwischen RPs."],"c":[0],"e":"Anycast RP: mehrere RPs mit derselben Adresse. Per MSDP (Source-Active-Meldungen) erfahren sie voneinander die Quellen. Alternativ <code>ip pim anycast-rp</code> mit PIM-Registern."},{"d":1,"q":"Welches Verfahren zur RP-Verteilung ist Cisco-proprietär und nutzt 224.0.1.39 und 224.0.1.40?","o":["Auto-RP","BSR","Static RP","Anycast RP mit MSDP"],"c":[0],"e":"Auto-RP: RP-Announce an 224.0.1.39, Mapping-Agent verteilt per 224.0.1.40. Beides muss im Sparse-Mode-Netz erreichbar sein (<code>ip pim autorp listener</code>). BSR ist der offene Standard."},{"d":1,"q":"Wer sendet in einem LAN-Segment mit mehreren PIM-Routern Joins für Empfänger und Registers für Quellen?","o":["Der PIM-DR (höchste Priorität, dann höchste IP)","Der IGMP-Querier mit der niedrigsten IP-Adresse","Jeder PIM-Router für seine eigenen Empfänger","Der RP, der am Segment sitzt"],"c":[0],"e":"Der DR nimmt IGMP-Reports entgegen und baut den Baum, außerdem kapselt er Quellen-Daten für den RP. Querier und DR können unterschiedliche Router sein."},{"d":1,"q":"Auf einem Switch ohne Multicast-Routing im VLAN sendet niemand IGMP-Queries, und IGMP Snooping verliert Einträge. Was ist zu tun?","o":["Einen IGMP-Snooping-Querier im VLAN aktivieren","Auf dem Switch <code>ip pim sparse-mode</code> aktivieren","Das VLAN auf Flooding von Multicast umstellen","Das IGMP-Timeout auf dem Router auf 0 setzen"],"c":[0],"e":"Snooping verlässt sich auf Queries, damit Hosts regelmäßig Reports senden. Ohne Router muss der Switch selbst Querier sein."},{"d":1,"q":"Wie sieht die Layer-2-Zieladresse für die Multicast-Gruppe 239.129.1.1 aus?","o":["0100.5E01.0101","0100.5E81.0101","0100.5E00.8101","0100.5E01.0181"],"c":[0],"e":"Die unteren 23 Bit der IP-Adresse kommen hinter 01:00:5E. Aus 129 wird 129 − 128 = 1 (das oberste Bit entfällt). Daraus 01-00-5E-01-01-01. 32 IP-Gruppen teilen sich eine MAC."},{"d":1,"q":"Wann behält ein Last-Hop-Router bei Standardeinstellungen den Shared Tree statt auf den SPT zu wechseln?","o":["Nur mit <code>ip pim spt-threshold infinity</code>","Immer, bis die Quelle 10 Paket/s sendet","Nur wenn der RP am Last-Hop-Router sitzt","Nie, der Wechsel ist Pflicht bei PIM-SM"],"c":[0],"e":"Standard: Nach dem ersten Paket wechselt der Last-Hop-Router auf den kürzesten Pfad. Mit <code>infinity</code> bleibt er auf dem RP-Baum, was Zustand spart."},{"d":1,"q":"Im <code>show ip mroute</code> steht RP 0.0.0.0 und Incoming interface Null für eine Gruppe. Was bedeutet das?","x":"R2# show ip mroute 239.1.1.1\n(*, 239.1.1.1), 00:03:11/stopped, RP 0.0.0.0, flags: SPF\n  Incoming interface: Null, RPF nbr 0.0.0.0\n  Outgoing interface list: Null","o":["Für die Gruppe ist kein RP bekannt.","Der RP ist ausgefallen, ein neuer ist gewählt.","Der Router ist selbst der RP der Gruppe.","Die Gruppe nutzt PIM-Dense-Mode."],"c":[0],"e":"Mit RP 0.0.0.0 und Interface Null kann der Router keinen Shared Tree aufbauen. Ursache: kein statischer RP, keine Auto-RP-/BSR-Mappings oder Gruppen-Filter."},{"d":1,"q":"Wofür ist PIM Bidirectional geeignet?","o":["Für viele Quellen und Empfänger, nur Shared Tree mit Designated Forwarder","Für einzelne Quellen mit vielen Empfängern im Source Tree","Für Gruppen ohne RP in 232.0.0.0/8","Für Multicast zwischen zwei Autonomen Systemen"],"c":[0],"e":"BIDIR hat keine (S,G)-Zustände und keine Register-Meldungen. Der Designated Forwarder pro Segment leitet Verkehr in beide Richtungen auf dem Shared Tree. Das skaliert bei vielen Quellen."},{"t":"match","d":2,"q":"Ordne den SD-Access-Fabric-Rollen ihre Aufgabe zu.","l":["Control Plane Node","Edge Node","Border Node","Intermediate Node"],"o":["LISP Map-Server und Map-Resolver für Endpunktadressen","Verbindet Endgeräte, ist ITR/ETR und Anycast-Gateway","Verbindet die Fabric mit dem Rest des Netzes","Reines Underlay-Gerät ohne Fabric-Funktionen"],"c":[0,1,2,3],"e":"Control Plane (LISP) kennt, wo Endpunkte sitzen. Edge hängt Clients an, kapselt und entkapselt. Border bindet externe Netze an. Intermediate Nodes leiten nur das Underlay-IP weiter."},{"d":2,"q":"Welche Kapselung nutzt SD-Access im Data Plane, und was trägt sie zusätzlich zum Datenpaket?","o":["VXLAN-GPO mit VN (VNI) und Scalable Group Tag","GRE mit Key, es trägt VRF-ID und QoS-Markierung","MPLS mit zwei Labels, sie tragen VRF und Gruppe","IPsec im Tunnelmodus, es trägt Zertifikat und Gruppe"],"c":[0],"e":"VXLAN-GPO (VXLAN-GBP): Das VNI identifiziert das virtuelle Netz (VRF), das Group-ID-Feld trägt den SGT. Damit lassen sich Gruppenrichtlinien auch nach dem Routing durchsetzen."},{"d":2,"q":"Ein Border Node soll Internetverkehr und alle unbekannten Ziele aus der Fabric ableiten. Welcher Typ passt?","o":["Externer Border, der eine Default-Route in die Fabric einspeist","Interner Border, der alle Außenrouten in LISP registriert","Fabric-in-a-Box mit Anycast-Gateway","Edge Node mit Default-Route zum Control-Plane-Node"],"c":[0],"e":"Interner Border: bekannte Netze (z. B. Rechenzentrum), die er in LISP einträgt. Externer Border: Default für alles Unbekannte. „Anywhere“-Border vereint beides."},{"d":2,"q":"Wie unterscheiden sich Macro- und Micro-Segmentierung in SD-Access?","o":["Macro trennt über virtuelle Netze, Micro über SGTs innerhalb eines VN.","Macro nutzt SGTs, Micro virtuelle Netze mit eigenem Underlay.","Macro gilt am Edge, Micro nur am Border, beide mit VLANs.","Macro trennt nur Wireless, Micro nur kabelgebundene Clients."],"c":[0],"e":"VNs bilden getrennte Routing-Domänen, SGTs und SGACLs regeln innerhalb eines VN, wer mit wem kommunizieren darf. Beides arbeitet mit ISE-Policy."},{"d":2,"q":"Welche Rolle hat die Cisco ISE in SD-Access?","o":["Sie authentifiziert Endpunkte und weist SGT und VN zu.","Sie ist Control Plane Node und beantwortet LISP-Anfragen.","Sie verteilt IP-Adressen per DHCP in der Fabric.","Sie baut den VXLAN-Tunnel zwischen Edge und Border."],"c":[0],"e":"ISE ist die Policy-Engine. Catalyst Center orchestriert und integriert sich mit ISE, die Autorisierung (SGT, VLAN/VN) kommt aus den ISE-Profilen."},{"d":2,"q":"Welches Routingprotokoll konfiguriert Catalyst Center LAN Automation im Underlay?","o":["IS-IS","OSPF","EIGRP","BGP"],"c":[0],"e":"LAN Automation richtet ein geroutetes Underlay mit IS-IS ein (Loopbacks, Point-to-Point-Links). Manuell sind auch OSPF oder EIGRP möglich, aber nicht der Automationsweg."},{"d":2,"q":"Wie wird WLAN-Client-Verkehr in einer Fabric mit Fabric-Wireless transportiert?","o":["Der AP kapselt per VXLAN zum Edge, der WLC steuert nur die Control Plane.","Der AP kapselt per CAPWAP zum WLC, der WLC speist ihn ins Fabric ein.","Der Client-Verkehr geht unverschlüsselt per VLAN direkt zum Border.","Der AP nutzt LISP zur Registrierung und kapselt per GRE."],"c":[0],"e":"Fabric-APs senden Daten direkt per VXLAN an den Edge Node. Der WLC bleibt für Control Plane, Registrierung und Roaming-Management zuständig."},{"d":2,"q":"Wie wird Multicast in einer SD-Access-Fabric im Overlay unterstützt?","o":["Per Head-End-Replication oder natives Underlay-Multicast","Nur per VLAN-Flooding im Overlay","Nur per MSDP zwischen den Border Nodes","Gar nicht, Multicast wird in SD-Access verworfen"],"c":[0],"e":"Head-End-Replication kopiert Pakete pro Edge im Edge-Node als Unicast. Natives Multicast im Underlay (PIM-SSM) skaliert besser, braucht aber mehr Konfiguration."},{"d":2,"q":"Wozu dient bei SD-Access Fabric-Edge der Anycast-Gateway?","o":["Alle Edges nutzen dieselbe Gateway-IP und -MAC, Roaming bleibt im Subnetz.","Er verteilt die SGT-Zuordnungen an alle ISE-Knoten.","Er bündelt mehrere Border Nodes zu einem logischen Gerät.","Er ersetzt den DHCP-Server und gibt feste Adressen aus."],"c":[0],"e":"Jeder Edge Node hat für das Subnetz dasselbe Gateway. Bewegt sich ein Client, behält er seine IP und sein Gateway, nur die LISP-Registrierung ändert sich."},{"d":2,"q":"Welche Aufgabe hat in Cisco SD-WAN das OMP (Overlay Management Protocol)?","o":["Es verteilt Routen, TLOCs und Policies zwischen vSmart und den Edges.","Es baut IPsec-Tunnel zwischen den Edges auf und tauscht Schlüssel.","Es verbindet WAN Edges mit dem vBond und authentifiziert Zertifikate.","Es misst die Pfadqualität und löst BFD-Alarme aus."],"c":[0],"e":"OMP läuft zwischen den Edges und vSmart (über DTLS/TLS) und ist das Routing-Protokoll des Overlays. Tunnel- und Schlüsselaufbau übernehmen IPsec bzw. IKE, die Pfadqualität BFD."},{"d":2,"q":"Woraus besteht ein TLOC in Cisco SD-WAN?","o":["System-IP, Color und Encapsulation","Router-ID, VPN-ID und Prefix","Site-ID, Tunnel-Key und DSCP","Zertifikat, Seriennummer und Serial-Number-Liste"],"c":[0],"e":"Ein TLOC (Transport Locator) beschreibt einen Anschlusspunkt: Adresse (System-IP), Color (z. B. mpls, biz-internet) und Encapsulation (IPsec/GRE)."},{"d":2,"q":"Welche Protokolle nutzen WAN Edges für Control Connections zu vSmart und vManage, und welche Rolle hat BFD?","o":["DTLS oder TLS für Control, BFD misst die Pfadqualität im Tunnel.","IPsec ESP für die Control Plane, BFD prüft die Zertifikate.","GRE für die Control Plane, BFD verteilt die Policies.","TLS für die Data Plane, BFD erzeugt die Tunnel-Schlüssel."],"c":[0],"e":"Control Connections laufen per DTLS (UDP) oder TLS (TCP), die Data Plane per IPsec. BFD läuft in jedem Datentunnel und liefert Latenz, Loss und Jitter für die Pfadwahl."},{"d":2,"q":"Welche VPN-IDs haben in Cisco SD-WAN feste Aufgaben?","o":["VPN 0 für Transport, VPN 512 für Management, 1–511 für Service-VPNs","VPN 0 für Management, VPN 512 für Transport, 1–511 für Overlay","VPN 1 für Transport, VPN 511 für Management, Rest für Kunden","VPN 0 für Overlay, VPN 1 für Management, Rest ungenutzt"],"c":[0],"e":"VPN 0 enthält die Transport-Interfaces (Underlay), VPN 512 ist das Out-of-Band-Management, die Service-VPNs 1 bis 511 transportieren Nutzdaten."},{"d":2,"q":"Welche Policy-Art steuert in SD-WAN, dass eine Anwendung nur Pfade mit weniger als 2 % Paketverlust nutzt?","o":["Application-Aware Routing Policy mit SLA-Klassen","Centralized Control Policy auf dem vSmart","Localized Data Policy am WAN Edge","Zentrale CoPP-Policy auf dem vManage"],"c":[0],"e":"App-Route-Policy bewertet Pfade nach SLA (Loss, Latency, Jitter) und wählt für die Anwendung einen passenden Tunnel. Control Policies verändern Routen, Data Policies leiten Verkehr nach Match."},{"d":2,"q":"Wie findet ein neuer WAN Edge per Zero-Touch Provisioning die Controller?","o":["Über den Cloud-PnP-/ZTP-Dienst, der die vBond-Adresse liefert","Per Broadcast im LAN, den der vManage beantwortet","Über eine vorkonfigurierte Liste aller vSmarts im Flash","Über BGP-Peering mit dem Provider-Router"],"c":[0],"e":"Das Gerät holt per DHCP eine Adresse, kontaktiert den PnP-/ZTP-Server und erhält vBond-Adresse und Organisation. Danach folgt die Zertifikatsprüfung und die Control Connection."},{"d":2,"q":"Was verhindert die Einstellung <code>restrict</code> bei einem TLOC-Color?","o":["Tunnel zwischen unterschiedlichen Colors werden nicht aufgebaut.","Es verhindert Tunnel zu Standorten ohne BFD.","Es blockiert alle Tunnel zum Management-VPN.","Es begrenzt die Anzahl der Tunnel auf eine pro Edge."],"c":[0],"e":"Mit <code>restrict</code> bildet ein Edge nur Tunnel zu Zielen mit gleicher Color. So bleibt MPLS-Verkehr getrennt von Internet-Verkehr."},{"d":3,"q":"Ein GRE-Tunnel flappt mit der Meldung <code>%TUN-5-RECURDOWN</code>. Was ist die Ursache?","o":["Die Tunnel-Destination ist über den Tunnel selbst erreichbar.","Der Tunnel nutzt GRE-Key, der Gegenseite fehlt.","Die MTU des Tunnels ist größer als die des Underlays.","GRE-Keepalives sind auf einer Seite aus."],"c":[0],"e":"Routet die Tunnel-Destination über das Tunnel-Interface, bricht der Tunnel ab, steht auf, und wiederholt es. Lösung: Zieladresse über das Underlay-Interface routen (z. B. eigene Static Route oder VRF)."},{"d":3,"q":"Wie viele Nachrichten hat der IKEv2-Aufbau mit einer Child SA im Normalfall?","o":["Vier (IKE_SA_INIT und IKE_AUTH mit je Anfrage und Antwort)","Sechs im Main Mode und drei im Quick Mode","Drei im Aggressive Mode","Zwei im IKE_SA_INIT, keine weiteren"],"c":[0],"e":"IKEv2 braucht vier Nachrichten für IKE SA und die erste Child SA. IKEv1 nutzte 6 (Main Mode) oder 3 (Aggressive Mode) für Phase 1 und 3 (Quick Mode) für Phase 2."},{"d":3,"q":"Was unterscheidet eine VTI von einer klassischen Crypto Map?","o":["Die VTI ist ein Routing-Interface, die Crypto Map schützt per ACL-Match.","Die VTI nutzt immer IKEv1, die Crypto Map nur IKEv2.","Die VTI verschlüsselt nur Multicast, die Crypto Map nur Unicast.","Die VTI braucht keine IPsec-Profile, die Crypto Map schon."],"c":[0],"e":"Route-based (VTI): Verkehr, der durch das Interface geroutet wird, wird verschlüsselt. Policy-based (Crypto Map): Die ACL entscheidet. Mit VTI lassen sich Routing-Protokolle und QoS leichter einsetzen."},{"d":3,"q":"Wozu dient Perfect Forward Secrecy (PFS) bei IPsec?","o":["Jede Child SA bekommt einen neuen DH-Austausch, ein Schlüsselverlust bleibt begrenzt.","Der IKE-SA-Schlüssel bleibt bei Neuverhandlung unverändert.","Die ESP-Pakete erhalten zusätzlich einen AH-Header.","Der Schlüssel wird aus dem PSK abgeleitet und im Klartext gesichert."],"c":[0],"e":"Ohne PFS werden Child-SA-Schlüssel aus dem IKE-SA-Schlüssel abgeleitet. Mit PFS fließt ein neuer DH-Schlüssel ein, damit ist ein späteres Knacken eines einzelnen Schlüssels folgenlos."},{"d":3,"q":"Welche Standard-Lebensdauern gelten für IKE-SA und IPsec-SA?","o":["IKE-SA 86400 s (24 h), IPsec-SA 3600 s (1 h)","IKE-SA 3600 s, IPsec-SA 86400 s","IKE-SA 28800 s, IPsec-SA 1800 s","Beide 86400 s"],"c":[0],"e":"Die IKE-SA lebt bei Cisco standardmäßig 24 Stunden, die IPsec-SA 1 Stunde (oder 4.608.000 KB Datenmenge). Es gilt jeweils der kleinere ausgehandelte Wert."},{"t":"order","d":3,"q":"Bring die Objekte einer IKEv2-Konfiguration für einen VTI-Tunnel in eine sinnvolle Aufbaureihenfolge.","o":["IKEv2-Proposal","IKEv2-Policy mit dem Proposal","IKEv2-Keyring","IKEv2-Profile mit Keyring und Match","IPsec-Transform-Set und IPsec-Profile","<code>tunnel protection ipsec profile</code> am Tunnel"],"e":"Proposal, Policy, Keyring, Profile, Transform-Set und IPsec-Profile, am Ende wird das IPsec-Profile am Tunnel angewendet. Jedes Objekt verweist auf das vorherige."},{"d":3,"q":"Was bewirkt Dead Peer Detection (DPD) im periodischen Modus?","o":["Regelmäßige Prüf-Pakete erkennen einen toten Peer und räumen die SAs ab.","Der Peer wird nur bei Datenverkehr geprüft und sonst nie.","DPD verschlüsselt jede Prüf-Nachricht mit einem eigenen Schlüssel.","DPD erzeugt bei jedem Hello eine neue IPsec-SA."],"c":[0],"e":"Periodisch (<code>crypto isakmp keepalive 10 3 periodic</code>) prüft auch ohne Verkehr. On-Demand sendet nur, wenn Pakete zum Peer gehen und keine Antwort kommt."},{"d":3,"q":"ESP-Pakete werden wegen QoS in anderer Reihenfolge ausgeliefert, Gegenseite meldet Replay-Fehler. Was ist die Abhilfe?","o":["Anti-Replay-Fenster vergrößern oder QoS-Reihenfolge anpassen","MTU des Tunnels auf 1500 erhöhen","IKE-Lifetime auf 60 Sekunden verkürzen","Auf AH statt ESP umschalten"],"c":[0],"e":"ESP führt Sequenznummern und ein Gleitfenster. Außerhalb des Fensters ankommende Pakete werden verworfen. Mit <code>crypto ipsec security-association replay window-size</code> (oder QoS vor der Verschlüsselung) lässt sich das lösen."},{"d":3,"q":"Wie erreichst du in DMVPN Phase 3, dass Spokes nur eine Summary vom Hub bekommen und trotzdem direkte Tunnel aufbauen?","o":["Hub sendet Summary, <code>ip nhrp redirect</code> am Hub, <code>ip nhrp shortcut</code> an Spokes","Hub sendet alle Spoke-Routen einzeln mit <code>no ip next-hop-self</code>","Spokes tauschen ihre Routen per eigene EIGRP-Nachbarschaft","Hub setzt <code>ip nhrp map multicast</code> für alle Spokes"],"c":[0],"e":"Der Hub redirectet den ersten Verkehr, der Spoke fragt per NHRP den Ziel-Spoke an und installiert ein Shortcut. Die Routing-Tabelle kann bei Phase 3 klein bleiben."},{"d":3,"q":"Der Hub soll BGP-Sitzungen zu beliebigen Spokes im Tunnelnetz 10.99.0.0/24 annehmen, ohne jeden Spoke einzeln zu konfigurieren. Was nutzt du?","o":["<code>bgp listen range 10.99.0.0/24 peer-group SPOKES</code>","<code>neighbor 10.99.0.0 remote-as external</code>","<code>bgp dynamic-spokes enable 10.99.0.0/24</code>","<code>ip nhrp bgp 10.99.0.0/24</code>"],"c":[0],"e":"Dynamic Neighbors: Der Hub nimmt Sitzungen von Adressen im Bereich an und ordnet sie der Peer-Group zu. Das passt zu DMVPN, weil Spokes erst nach NHRP-Registrierung erreichbar sind."},{"t":"order","d":3,"q":"Bring den NHRP-Resolutionsablauf zwischen zwei Spokes in DMVPN Phase 3 in die richtige Reihenfolge.","o":["Spoke A sendet das erste Paket für Spoke B an den Hub","Der Hub leitet es weiter und sendet einen NHRP Redirect an Spoke A","Spoke A schickt einen NHRP Resolution Request über den Hub an Spoke B","Spoke B antwortet direkt an Spoke A mit der NBMA-Adresse","Spoke A baut den Tunnel auf und installiert den Shortcut"],"e":"Das erste Paket läuft über den Hub, der Redirect löst die NHRP-Anfrage aus, und die Antwort kommt direkt vom Ziel-Spoke. Danach laufen die folgenden Pakete direkt."},{"d":3,"q":"Eine Route im IGP wird als /24 zusammengefasst, und LDP bindet für die Loopbacks der PE nur noch das Summary-Label. Was passiert im L3VPN?","o":["Der LSP zum PE bricht, weil LDP nur exakte IGP-Präfixe bindet.","LDP bindet automatisch Labels für alle Teilrouten der Summary.","Der PE schickt VPN-Pakete ohne Transport-Label weiter.","BGP wechselt automatisch auf RSVP-TE als Label-Protokoll."],"c":[0],"e":"LDP bindet Labels nur für Präfixe, die exakt in der RIB stehen. Loopbacks der PEs müssen als /32 im IGP bleiben (nicht summarisieren)."},{"d":3,"q":"Welches Problem löst <code>mpls ldp sync</code>?","o":["Der IGP-Link wird erst bevorzugt, wenn LDP dort steht, ohne Blackholing.","Es synchronisiert die LDP-Labels mit BGP-Labels der VPN-Routen.","Es gleicht die Uhrzeit der Router für LDP-Sitzungen ab.","Es startet LDP und IGP gleichzeitig nach einem Neustart."],"c":[0],"e":"Ohne Synchronisation kann der IGP-Pfad aktiv sein, bevor LDP steht. Dann hat der Pfad kein Label und VPN-Verkehr geht verloren. Mit Sync meldet OSPF/IS-IS hohe Kosten, bis LDP bereit ist."},{"d":3,"q":"Wie blendest du in Traceroute die Hops im MPLS-Kern für den Kunden aus?","o":["<code>no mpls ip propagate-ttl</code> am Ingress-PE","<code>mpls ip propagate-ttl</code> am P-Router","<code>no ip unreachables</code> auf allen P-Routern","<code>mpls ldp explicit-null</code> am Ingress-PE"],"c":[0],"e":"Ohne TTL-Propagation setzt der PE im Label eine feste TTL (255). Der Kunde sieht den Kern als einen Hop."},{"t":"match","d":3,"q":"Ordne den Inter-AS-MPLS-VPN-Optionen ihr Verfahren zu.","l":["Option A","Option B","Option C"],"o":["Back-to-Back VRFs, pro VPN ein Interface zwischen ASBRs","MP-eBGP VPNv4 zwischen den ASBRs","Multihop MP-eBGP VPNv4 zwischen Route Reflectors, Labels per BGP zu PE-Loopbacks"],"c":[0,1,2],"e":"A ist einfach, aber skaliert schlecht (je ein Interface pro VPN). B tauscht VPNv4-Routen mit Labels am ASBR aus. C verlegt den VPNv4-Austausch zu den RRs und braucht BGP-LU für die Erreichbarkeit der PE-Loopbacks."},{"d":3,"q":"Was brauchen die PEs für einen Pseudowire (EoMPLS) als Signalisierung?","o":["Eine Targeted-LDP-Sitzung zwischen den PE-Loopbacks","Eine BGP-VPNv4-Sitzung zwischen den PEs","RSVP-TE-Tunnel zwischen CE-Routern","Eine IS-IS-Nachbarschaft zwischen CE und PE"],"c":[0],"e":"Der Pseudowire wird per Targeted LDP (Forward Equivalence Class VC-ID) zwischen den PEs aufgebaut. Am Interface verknüpft <code>xconnect</code> den Port mit dem Pseudowire."},{"d":3,"q":"Wie viele Netze lassen sich mit der 24-Bit-VNI in VXLAN adressieren?","o":["Etwa 16 Millionen","4096","65536","Etwa 1 Million"],"c":[0],"e":"24 Bit ergeben rund 16,7 Millionen VNIs gegenüber 4094 VLANs mit 12 Bit."},{"t":"match","d":3,"q":"Ordne den BGP-EVPN-Routentypen ihre Funktion zu.","l":["Typ 2","Typ 3","Typ 5"],"o":["MAC/IP-Advertisement eines Endpunkts","Inclusive Multicast, für BUM-Verkehr","IP-Prefix-Route für Layer-3-Netze"],"c":[0,1,2],"e":"Typ 2 verteilt MACs und IPs, Typ 3 meldet, wohin BUM-Replikation geht, Typ 5 transportiert Präfixe (z. B. externe Netze oder VRF-Routen)."},{"d":3,"q":"Wozu dient der Anycast-Gateway in einer VXLAN-EVPN-Fabric?","o":["Alle Leafs tragen dieselbe Gateway-IP und -MAC, Hosts bleiben beim Verschieben im Gateway.","Er bündelt Spines zu einem Cluster mit gemeinsamer Router-ID.","Er verteilt BUM-Verkehr per Multicast an alle VTEPs.","Er ersetzt EVPN-Typ-2-Routen durch statische ARP-Einträge."],"c":[0],"e":"Jeder Leaf antwortet lokal auf das Gateway. Damit gibt es kein Hairpinning zum zentralen Router, und VMs können unverändert wandern."},{"d":3,"q":"Was bewirkt ARP-Suppression in einer EVPN-Fabric?","o":["Der Leaf beantwortet ARP aus der EVPN-Tabelle und flutet nicht.","Der Leaf blockiert alle ARP-Anfragen aus dem Overlay.","Der Leaf wandelt ARP in ICMP-Echo um.","Der Leaf sendet ARP nur an den Spine mit höherer Priorität."],"c":[0],"e":"Aus Typ-2-Routen kennt der Leaf IP-MAC-Zuordnungen. Er beantwortet ARP/ND lokal, das senkt BUM-Verkehr in der Fabric."},{"d":4,"q":"Ein Helpdesk-Account soll auf Level 15 nur <code>show</code>-Befehle ausführen dürfen. Welche AAA-Funktion setzt das pro Befehl durch?","o":["<code>aaa authorization commands 15 default group tacacs+ local</code>","<code>aaa authorization exec default group radius local</code>","<code>aaa accounting commands 15 default start-stop group tacacs+</code>","<code>aaa authentication enable default group tacacs+ enable</code>"],"c":[0],"e":"Command Authorization fragt den TACACS+-Server vor jedem Befehl. Exec-Authorization legt nur Privileg-Level beim Login fest, Accounting protokolliert nur, Enable-Authentication prüft das Passwort für <code>enable</code>."},{"d":4,"q":"Ein Endgerät soll nach einer Statusänderung im NAC neu autorisiert werden, ohne dass es sich neu verbindet. Welche Funktion nutzt der Server?","o":["RADIUS Change of Authorization (CoA, UDP 3799)","RADIUS Accounting-Interim mit UDP 1813","TACACS+ Command Authorization auf TCP 49","SNMP-Set auf dem Switchport mit UDP 161"],"c":[0],"e":"Der Server (z. B. ISE) sendet CoA an den Switch, der die Sitzung neu bewertet oder trennt. Das ist die Grundlage für Posture und dynamische Quarantäne."},{"t":"match","d":4,"q":"Ordne den 802.1X-Host-Modi ihr Verhalten zu.","l":["Single-Host","Multi-Host","Multi-Domain","Multi-Auth"],"o":["Genau ein Gerät, die MAC wird authentifiziert","Nach der ersten Authentifizierung dürfen alle weiteren Geräte durch","Je ein Daten- und ein Voice-Gerät, getrennt authentifiziert","Jedes Gerät am Port wird einzeln authentifiziert"],"c":[0,1,2,3],"e":"Single-Host: ein Gerät. Multi-Host: das erste öffnet den Port für alle. Multi-Domain (MDA): ein Daten- und ein Voice-Endpunkt. Multi-Auth: beliebig viele, jedes einzeln."},{"d":4,"q":"Ein Drucker unterstützt kein 802.1X und soll trotzdem authentifiziert werden. Was nutzt du?","o":["MAC Authentication Bypass (MAB), die MAC dient als Credential","Guest VLAN ohne Authentifizierung für alle Geräte","Web Authentication über einen Captive Portal","Port Security mit statischer MAC ohne RADIUS"],"c":[0],"e":"MAB nutzt die MAC des Geräts als Credential gegenüber RADIUS. Es ist weniger sicher als 802.1X (MACs lassen sich fälschen), dient aber als Fallback für Geräte ohne Supplicant."},{"d":4,"q":"Welche Eigenschaften hat MACsec (802.1AE)?","o":["Hop-by-Hop-Verschlüsselung auf Layer 2, Schlüssel per MKA","Ende-zu-Ende-Verschlüsselung auf Layer 3 zwischen Routern.","Verschlüsselung nur für das Management-VLAN per IPsec.","Die Verschlüsselung der 802.1X-Anmeldedaten per EAP-TLS."],"c":[0],"e":"MACsec schützt Ethernet-Frames zwischen direkt verbundenen Geräten (Switch-Switch oder Host-Switch) mit AES-GCM. MKA (MACsec Key Agreement) verhandelt die Schlüssel, oft nach 802.1X."},{"d":4,"q":"Welche Tabelle ist die Grundlage für IP Source Guard auf einem Access-Port?","o":["Die DHCP-Snooping-Binding-Tabelle","Die CAM-Tabelle mit allen gelernten MACs","Die ARP-Tabelle des Gateways","Die Routing-Tabelle des Switches"],"c":[0],"e":"IPSG filtert den Verkehr je Port auf die Quelladresse (und optional MAC), die DHCP Snooping gelernt hat. Statische Hosts brauchen manuelle Bindings."},{"d":4,"q":"Ein Switch sieht wiederholt ARP-Antworten mit falscher IP-MAC-Zuordnung. Welche Funktion verhindert das?","o":["Dynamic ARP Inspection mit DHCP-Snooping-Bindings","Port Security mit sticky MAC","Storm Control für Broadcast","BPDU Guard am Access-Port"],"c":[0],"e":"DAI prüft ARP-Pakete gegen die Binding-Tabelle und verwirft Fälschungen. Uplinks werden als <code>ip arp inspection trust</code> markiert."},{"d":4,"q":"In welche Subinterfaces teilt Control Plane Protection (CPPr) die Control Plane?","o":["Host, Transit und CEF-Exception","Ingress, Egress und Self","Control, Data und Management","Unicast, Multicast und Broadcast"],"c":[0],"e":"CPPr unterscheidet drei Subinterfaces: Host (Verkehr zum Router), Transit (durchlaufender Verkehr, der im Softwarepfad landet) und CEF-Exception (Pakete, die CEF nicht selbst weiterleitet, z. B. ARP oder TTL-Ablauf). Damit lassen sich Policies feiner anwenden als mit CoPP."},{"d":4,"q":"Was unterscheidet eine VACL (VLAN ACL) von einer Port-ACL (PACL)?","o":["Die VACL gilt für alle Pakete im VLAN, die PACL für einen Layer-2-Port eingehend.","Die VACL gilt nur für geroutete Pakete, die PACL nur für gebridgte.","Die VACL gilt nur ausgehend, die PACL nur eingehend.","Die VACL filtert nur Layer 2, die PACL filtert nur Layer 3."],"c":[0],"e":"Eine VACL filtert Verkehr im VLAN (gebridgt und geroutet), unabhängig vom Port. Eine PACL liegt am physischen Layer-2-Port und gilt eingehend."},{"d":4,"q":"Welche Eigenschaft haben reflexive ACLs?","o":["Sie erzeugen temporäre Rückrichtungs-Einträge für von innen gestartete Sitzungen.","Sie ersetzen die Statusverfolgung durch das Schlüsselwort <code>established</code>.","Sie erlauben immer UDP-Antwortverkehr ohne Zustandsprüfung.","Sie können nur auf Standard-ACLs angewendet werden."],"c":[0],"e":"Mit <code>reflect</code> und <code>evaluate</code> in einer benannten ACL entstehen temporäre Einträge für den Rückverkehr. Sie erlauben zustandsähnliches Filtern ohne Firewall."},{"d":4,"q":"Welcher DSCP-Wert gehört zu AF41?","o":["34","46","41","32"],"c":[0],"e":"AFxy hat den DSCP-Wert 8x + 2y: AF41 = 8·4 + 2·1 = 34. EF ist 46, CS4 ist 32."},{"d":4,"q":"Welchen DSCP-Wert hat AF31?","o":["26","24","28","30"],"c":[0],"e":"AF31 = 8·3 + 2·1 = 26. AF32 = 28 und AF33 = 30. CS3 = 24."},{"d":4,"q":"Welcher Zeitintervall-Wert (Tc) ergibt sich bei einer Shaping-Rate (CIR) von 8 Mbit/s und Bc = 8000 Bit?","o":["1 ms","8 ms","10 ms","125 ms"],"c":[0],"e":"Tc = Bc / CIR = 8000 Bit / 8.000.000 Bit/s = 0,001 s = 1 ms. Pro Intervall dürfen 8000 Bit gesendet werden."},{"d":4,"q":"Was unterscheidet Policing und Shaping?","o":["Policing verwirft oder markiert den Überschuss, Shaping puffert und sendet später.","Policing puffert den Überschuss, Shaping verwirft ihn.","Shaping arbeitet nur eingehend, Policing nur ausgehend.","Policing gilt für Layer 2, Shaping für Layer 3."],"c":[0],"e":"Policing ist stufenlos und erzeugt Drops (oder Remarking). Shaping glättet den Verkehr mit Warteschlangen und erzeugt Jitter."},{"d":4,"q":"Welche zusätzliche Fähigkeit bietet ein Two-Rate-Three-Color-Policer (<code>police cir … pir …</code>)?","o":["Er unterscheidet conform, exceed und violate nach CIR und PIR.","Er puffert den Überschuss zwischen CIR und PIR.","Er teilt die Bandbreite fest zwischen Klassen auf.","Er markiert nur Pakete der niedrigsten Priorität."],"c":[0],"e":"Bis zur CIR conform, zwischen CIR und PIR exceed, darüber violate. Jeder Zustand kann eine eigene Aktion haben (senden, markieren, verwerfen)."},{"d":4,"q":"Was gilt für die Prioritätswarteschlange (<code>priority</code>) in LLQ bei Überlast?","o":["Sie wird implizit auf die konfigurierte Rate begrenzt, damit andere Klassen nicht verhungern.","Sie nutzt immer die gesamte Bandbreite, wenn Pakete vorliegen.","Sie wird nur bei Überlast ausgeschaltet.","Sie wird in WRED-Gruppen aufgeteilt."],"c":[0],"e":"LLQ ist eine strikte Warteschlange, aber der Verkehr wird bei Staus implizit gepolicet (Rate aus <code>priority percent</code>). Ohne Stau darf sie mehr nutzen."},{"d":4,"q":"Wozu dient WRED?","o":["Es verwirft bei wachsender Queue zufällig nach DSCP und beugt TCP-Synchronisation vor.","Es verwirft alle Pakete einer Klasse, sobald die Queue voll ist.","Es leitet überschüssige Pakete in eine zweite Queue um.","Es priorisiert Sprache strikt vor allen anderen Klassen."],"c":[0],"e":"Tail Drop trifft alle Flows gleichzeitig und führt zu synchronen TCP-Einbrüchen. WRED beginnt früher und nach Drop-Precedence unterschiedlich zu verwerfen."},{"d":4,"q":"Wie wirkt sich <code>match-all</code> gegenüber <code>match-any</code> in einer Class-Map aus?","o":["Bei match-all müssen alle Bedingungen zutreffen, bei match-any reicht eine.","Bei match-all reicht eine Bedingung, bei match-any müssen alle zutreffen.","Beide sind gleich, match-all ist nur eine ältere Schreibweise.","Match-all gilt nur für ACLs, match-any für DSCP."],"c":[0],"e":"<code>match-all</code> ist ein logisches UND, <code>match-any</code> ein ODER. Standard bei Cisco ist match-all."},{"d":4,"q":"Ein WAN-Link hat 50 Mbit/s, Sprache soll Vorrang haben, alles andere wird fair geteilt. Wie baust du die Policy auf?","o":["Parent-Policy mit <code>shape average 50000000</code> und Child-Policy mit LLQ und CBWFQ","Eine Policy mit <code>police 50000000</code> an der Ausgangsseite","Eine Policy mit <code>priority</code> ohne Shaping","Zwei Policies, eine pro Richtung, ohne Parent"],"c":[0],"e":"Hierarchisches QoS: Die Parent-Policy shaped auf die Link-Rate, damit sich der Stau im Router und nicht im Provider bildet, die Child-Policy priorisiert (LLQ) und gewichtet (CBWFQ)."},{"d":4,"q":"Welche virtuelle MAC-Adresse nutzt HSRP Version 1 für Gruppe 10?","o":["0000.0C07.AC0A","0000.0C9F.F00A","0000.5E00.010A","0007.B400.0A01"],"c":[0],"e":"HSRPv1: 0000.0C07.ACxx (xx = Gruppe in Hex). HSRPv2: 0000.0C9F.Fxxx. VRRP: 0000.5E00.01xx. GLBP: 0007.B400.xxyy."},{"d":4,"q":"Welche Standardwerte gelten für HSRP-Priorität und Preemption?","o":["Priorität 100, Preemption aus","Priorität 100, Preemption an","Priorität 150, Preemption aus","Priorität 0, Preemption an"],"c":[0],"e":"HSRP: Priority 100, <code>standby preempt</code> ist standardmäßig aus. Bei VRRP ist Preemption dagegen standardmäßig an."},{"d":4,"q":"Worin unterscheidet sich GLBP von HSRP?","o":["GLBP verteilt Clients per mehrere virtuelle MACs, HSRP nutzt ein aktives Gateway.","GLBP nutzt eine einzige virtuelle MAC für alle Gateways.","GLBP ist ein offener Standard, HSRP Cisco-proprietär.","GLBP arbeitet nur mit IPv6, HSRP nur mit IPv4."],"c":[0],"e":"Im GLBP beantwortet der AVG (Active Virtual Gateway) ARP-Anfragen mit verschiedenen virtuellen MACs der AVFs, so entsteht Lastverteilung. VRRP ist der offene Standard."},{"d":4,"q":"Der aktive HSRP-Router soll seine Priorität um 20 senken, wenn sein WAN-Uplink ausfällt. Was brauchst du?","o":["Ein Track-Objekt und <code>standby 1 track 1 decrement 20</code>","<code>standby 1 preempt delay 20</code> auf dem Uplink","<code>standby 1 timers 1 20</code> am Gateway-Interface","<code>standby 1 authentication 20</code> am Uplink"],"c":[0],"e":"Object Tracking verbindet den Zustand des Uplinks mit der HSRP-Priorität. Dazu braucht der Standby-Router <code>preempt</code>, damit er die Rolle auch übernimmt."},{"d":4,"q":"Welche Standard-Timer nutzt HSRP?","o":["Hello 3 Sekunden, Hold 10 Sekunden","Hello 1 Sekunde, Hold 3 Sekunden","Hello 5 Sekunden, Hold 15 Sekunden","Hello 10 Sekunden, Hold 30 Sekunden"],"c":[0],"e":"3/10 Sekunden. Mit <code>standby timers msec 200 msec 750</code> geht es deutlich schneller. BFD für HSRP ist eine weitere Option."},{"d":4,"q":"Welche Adresse ist in dieser Ausgabe Inside Global?","x":"R1# show ip nat translations\nPro Inside global     Inside local       Outside local      Outside global\ntcp 203.0.113.5:51514 192.168.1.10:51514 198.51.100.7:443 198.51.100.7:443","o":["203.0.113.5","192.168.1.10","198.51.100.7","10.0.0.9"],"c":[0],"e":"Inside Global ist die Adresse des internen Hosts, wie sie im Internet erscheint (203.0.113.5). Inside Local ist 192.168.1.10. Outside Local und Outside Global sind hier gleich (198.51.100.7)."},{"d":4,"q":"Welches Präfix nutzt NAT64 standardmäßig, um IPv4-Adressen in IPv6 einzubetten?","o":["64:ff9b::/96","2002::/16","fe80::/10","::ffff:0:0/96"],"c":[0],"e":"Das Well-Known Prefix 64:ff9b::/96. Die letzten 32 Bit tragen die IPv4-Adresse. DNS64 erzeugt passende AAAA-Einträge."},{"d":4,"q":"Was passiert in einer Zone-Based Firewall mit Verkehr zwischen zwei Zonen ohne Zone-Pair?","o":["Er wird verworfen, zwischen Zonen gilt Default-Deny.","Er wird erlaubt, bis eine Policy ihn blockiert.","Er wird nur geloggt und weitergeleitet.","Er wird über die Self-Zone umgeleitet."],"c":[0],"e":"ZBFW arbeitet mit Zonen. Ohne Zone-Pair mit Service-Policy wird zwischen Zonen verworfen. Interfaces in derselben Zone dürfen untereinander kommunizieren. Die Self-Zone steht für den Router selbst."},{"d":4,"q":"Welche Eigenschaft hat RSPAN gegenüber lokalem SPAN?","o":["Gespiegelter Verkehr läuft über ein RSPAN-VLAN zu einem anderen Switch.","Gespiegelter Verkehr wird über GRE zu einem Router gesendet.","Gespiegelter Verkehr wird nur auf demselben Switch ausgewertet.","Gespiegelter Verkehr wird per IPsec zum Monitor gesendet."],"c":[0],"e":"RSPAN nutzt ein spezielles VLAN (<code>remote-span</code>) über Trunks. ERSPAN kapselt den gespiegelten Verkehr dagegen in GRE und erlaubt Layer-3-Strecken."},{"d":4,"q":"Wie transportiert ERSPAN gespiegelten Verkehr zum Analyzer?","o":["Verkapselt in GRE über IP, auch über Router","In einem RSPAN-VLAN über Trunks","Per SNMP-Trap an den Collector","Als NetFlow-Export mit UDP 2055"],"c":[0],"e":"ERSPAN (Encapsulated RSPAN) kapselt Pakete mit GRE und leitet sie routbar an den Analyzer. Damit ist Mirroring über Layer-3-Netze möglich."},{"d":4,"q":"Für welche IP-SLA-Messung muss die Uhr auf beiden Geräten synchron sein?","o":["Für One-Way-Delay
