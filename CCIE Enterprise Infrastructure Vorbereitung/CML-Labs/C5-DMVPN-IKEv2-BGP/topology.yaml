lab:
  title: Lab C5 – DMVPN Phase 3 mit IKEv2 und BGP mit dynamischen Nachbarn
  description: 'Ein Hub und zwei Spokes bauen über einen Internet-Router ein DMVPN auf, diesmal geschützt mit IPsec und IKEv2. Das Routing läuft über iBGP: Der Hub nimmt Spokes über einen Listen-Range ohne einzelne Nachbar-Einträge an und gibt ihnen nur eine Zusammenfassung. Die direkten Wege zwischen den Spokes entstehen per NHRP-Redirect und -Shortcut, jeweils mit eigener IPsec-Verbindung.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: HUB
  node_definition: iosv
  x: 350
  y: 50
  configuration: |
    hostname HUB
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.10.100.1 255.255.255.0
    ip route 0.0.0.0 0.0.0.0 198.51.100.2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
