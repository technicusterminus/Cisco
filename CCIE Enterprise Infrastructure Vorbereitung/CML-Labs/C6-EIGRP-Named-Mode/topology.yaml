lab:
  title: 'Lab C6 – EIGRP Named Mode: SHA-256, Unequal-Cost Load Balancing und Stub mit Leak-Map'
  description: 'Vier Router im EIGRP Named Mode mit HMAC-SHA-256. Der Weg von der Zentrale zur Filiale führt über zwei Verteiler mit unterschiedlicher Verzögerung: Mit `variance` nutzt R1 beide, sofern der zweite die Feasibility Condition erfüllt. Die Filiale R4 ist ein Stub und damit nie Transit, gibt per Leak-Map aber die Default-Route weiter, damit ein Verteiler bei einem Linkausfall nicht abgeschnitten ist.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 350
  y: 50
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.1.1.1 255.255.255.0
    interface Loopback100
     ip address 192.0.2.1 255.255.255.255
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
