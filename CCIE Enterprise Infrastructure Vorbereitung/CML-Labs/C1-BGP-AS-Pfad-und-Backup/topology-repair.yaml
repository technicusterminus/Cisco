lab:
  title: 'Lab C1 – BGP: allowas-in, private AS, GTSM und bedingte Ankündigung (Repair)'
  description: Ein Unternehmen mit dem privaten AS 65001 hängt mit Zentrale (HQ) und Filiale (BR) am Provider ISP1, die Zentrale zusätzlich an ISP2 als Backup. Weil beide Standorte denselben AS nutzen, verwirft die Filiale die Routen der Zentrale. Du löst das mit `allowas-in`, entfernst den privaten AS beim Provider, schützt eine Sitzung mit GTSM und kündigst das Netz der Zentrale bei ISP2 nur an, wenn ISP1 ausfällt.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: HQ
  node_definition: iosv
  x: 400
  y: 450
  configuration: |
    hostname HQ
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.11.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 198.51.100.1 255.255.255.0
    ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0 le 32
    ip prefix-list OWN seq 5 permit 198.51.100.0/24
    route-map LP-ISP1 permit 10
     set local-preference 200
    route-map ADV-BACKUP permit 10
     match ip address prefix-list OWN
    route-map ISP1-DEFAULT permit 10
     match ip address prefix-list DEFAULT
    router bgp 65001
     bgp router-id 10.255.0.1
     bgp log-neighbor-changes
     network 198.51.100.0 mask 255.255.255.0
     neighbor 10.0.11.1 remote-as 64501
     neighbor 10.0.11.1 allowas-in 1
     neighbor 10.0.11.1 prefix-list OWN out
     neighbor 10.0.11.1 route-map LP-ISP1 in
     neighbor 10.0.12.1 remote-as 64502
     neighbor 10.0.12.1 ttl-security hops 1
     neighbor 10.0.12.1 advertise-map ADV-BACKUP non-exist-map ISP1-DEFAULT
     neighbor 10.0.12.1 prefix-list OWN out
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: ISP1
  node_definition: iosv
  x: 150
  y: 280
  configuration: |
    hostname ISP1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
