lab:
  title: 'Lab C3 – OSPF: Virtual Link mit Authentisierung, NSSA, Typ-3-Filter und Netzwerktypen (Repair)'
  description: 'Fünf Router in vier Areas: Area 2 hängt nicht an Area 0 und braucht einen Virtual Link durch Area 1, der wegen der MD5-Authentisierung im Backbone eine eigene Falle hat. Dazu eine NSSA mit ASBR, die ihre Default-Route erst bekommt, wenn der ABR sie erzeugt, ein Typ-3-Filter, der in die richtige Richtung zeigen muss, und ein Netzwerktyp-Mismatch, bei dem die Nachbarschaft FULL ist und trotzdem keine Route ankommt.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 350
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.1.1.1 255.255.255.0
    interface Loopback99
     ip address 10.1.99.1 255.255.255.0
    interface Loopback100
     ip address 192.0.2.1 255.255.255.255
    router ospf 1
     router-id 1.1.1.1
     area 0 authentication message-digest
     area 1 virtual-link 3.3.3.3 message-digest-key 1 md5 CCIE
     default-information originate always
    interface GigabitEthernet0/0
     ip ospf message-digest-key 1 md5 CCIE
     ip ospf 1 area 0
    interface GigabitEthernet0/1
     ip ospf 1 area 1
    interface Loopback1
     ip ospf network point-to-point
     ip ospf 1 area 0
    interface Loopback99
     ip ospf network point-to-point
     ip ospf 1 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 550
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.25.1 255.255.255.252
     no shutdown
    ip prefix-list NO-TEST seq 5 deny 10.1.99.0/24
    ip prefix-list NO-TEST seq 10 permit 0.0.0.0/0 le 32
    router ospf 1
     router-id 2.2.2.2
     area 0 authentication message-digest
     area 3 nssa
     area 3 filter-list prefix NO-TEST out
    interface GigabitEthernet0/0
     ip ospf message-digest-key 1 md5 CCIE
     ip ospf 1 area 0
    interface GigabitEthernet0/1
     ip ospf 1 area 3
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R3
