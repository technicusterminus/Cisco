  configuration: |
    hostname R5
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.25.2 255.255.255.252
     no shutdown
    interface Loopback1
     ip address 10.5.5.1 255.255.255.0
    ip route 172.16.5.0 255.255.255.0 Null0
