hostname RCV
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
no ip routing
interface GigabitEthernet0/0
 ip address 10.3.3.10 255.255.255.0
 no shutdown
ip default-gateway 10.3.3.1
interface GigabitEthernet0/0
 ip igmp version 3
 ip igmp join-group 239.1.1.1
 ip igmp join-group 232.1.1.1 source 10.1.1.10
