hostname PE2
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.2 255.255.255.252
 mpls ip
 no shutdown
interface GigabitEthernet0/1
 no shutdown
interface GigabitEthernet0/2
 no shutdown
mpls label protocol ldp
mpls ldp router-id Loopback0 force
router ospf 1
 router-id 10.255.0.2
 network 10.255.0.2 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
router bgp 64500
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 64500
 neighbor 10.255.0.1 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 send-community extended
 exit-address-family
vrf definition A
 rd 64500:100
 address-family ipv4
  route-target export 64500:101
  route-target import 64500:100
  route-target import 64500:999
 exit-address-family
vrf definition SHARED
 rd 64500:999
 address-family ipv4
  route-target export 64500:999
  route-target import 64500:999
  route-target import 64500:100
 exit-address-family
interface GigabitEthernet0/1
 vrf forwarding A
 ip address 192.168.12.1 255.255.255.252
interface GigabitEthernet0/2
 vrf forwarding SHARED
 ip address 192.168.13.1 255.255.255.252
router bgp 64500
 address-family ipv4 vrf A
  neighbor 192.168.12.2 remote-as 65100
  neighbor 192.168.12.2 activate
 exit-address-family
 address-family ipv4 vrf SHARED
  neighbor 192.168.13.2 remote-as 65200
  neighbor 192.168.13.2 activate
 exit-address-family
