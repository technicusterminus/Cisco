hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 10.0.34.2 255.255.255.252
 no shutdown
interface Loopback1
 ip address 10.4.4.1 255.255.255.0
interface Loopback2
 ip address 10.4.5.1 255.255.255.0
router ospf 1
 router-id 4.4.4.4
interface GigabitEthernet0/0
 ip ospf 1 area 2
interface Loopback1
 ip ospf network point-to-point
 ip ospf 1 area 2
interface Loopback2
 ip ospf network point-to-point
 ip ospf 1 area 2
