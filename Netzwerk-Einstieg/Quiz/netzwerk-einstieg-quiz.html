<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netzwerk-Einstieg Quiz</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#183047;--mut:#5b7080;--acc:#177f79;--ok:#1b9b87;--bad:#c0392b;--line:#dce5ec;--chip:#edf3f6;--okbg:#e6f6f1;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17232f;--ink:#e3edf4;--mut:#93a8b7;--acc:#4fc3b7;--ok:#3ec9a7;--bad:#ff7b6b;--line:#2a3b49;--chip:#213242;--okbg:#14302b;--badbg:#3a1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:780px;margin:0 auto}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff}
button.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.modes button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.modes small{display:block;opacity:.85}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
pre{background:var(--chip);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.4 Menlo,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt input{margin-top:.35em}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--chip);border-radius:6px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:2rem;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"d": 1, "q": "Welches Gerät verbindet verschiedene Netze miteinander?", "x": null, "o": ["Router", "Switch", "Hub", "Access Point"], "c": [0], "e": "Der Router arbeitet mit IP-Adressen und verbindet Netze, der Switch verbindet Geräte innerhalb eines Netzes."}, {"d": 1, "q": "Was ist ein Server?", "x": null, "o": ["Ein Gerät oder Programm, das einen Dienst bereitstellt", "Ein Kabel zwischen zwei Switches", "Ein Gerät, das nur WLAN sendet", "Ein Programm zum Anzeigen von Webseiten"], "c": [0], "e": "Der Nutzer des Dienstes heißt Client."}, {"d": 1, "q": "Wie nennt man ein Netz in einem einzelnen Gebäude?", "x": null, "o": ["LAN", "WAN", "MAN", "PAN"], "c": [0], "e": "WAN verbindet Standorte über große Entfernungen."}, {"d": 1, "q": "Wie lang darf ein Kupfer-Netzwerkkabel höchstens sein?", "x": null, "o": ["100 Meter", "10 Meter", "300 Meter", "1 Kilometer"], "c": [0], "e": "Darüber braucht man Glasfaser oder ein Zwischengerät."}, {"d": 1, "q": "Welches Medium eignet sich für mehrere Kilometer?", "x": null, "o": ["Singlemode-Glasfaser", "Cat6-Kupferkabel", "Multimode-Glasfaser mit LED", "Telefonkabel"], "c": [0], "e": "Singlemode hat einen dünnen Kern und große Reichweite."}, {"d": 1, "q": "Wofür steht PoE?", "x": null, "o": ["Strom und Daten über dasselbe Netzwerkkabel", "Ein Verschlüsselungsverfahren", "Ein Routingprotokoll", "Ein Funkstandard"], "c": [0], "e": "Typisch für Access Points, IP-Telefone, Kameras."}, {"d": 1, "q": "Auf welcher OSI-Schicht arbeitet ein Switch?", "x": null, "o": ["Schicht 2", "Schicht 1", "Schicht 3", "Schicht 7"], "c": [0], "e": "Switch: MAC-Adressen (Layer 2). Router: IP (Layer 3)."}, {"d": 1, "q": "Wie heißt die Dateneinheit auf Schicht 2?", "x": null, "o": ["Frame", "Paket", "Segment", "Bit"], "c": [0], "e": "Layer 3: Paket, Layer 4: Segment."}, {"d": 1, "q": "Auf welcher Schicht arbeiten TCP und UDP?", "x": null, "o": ["Transportschicht (Schicht 4)", "Vermittlungsschicht", "Sicherungsschicht", "Anwendungsschicht"], "c": [0], "e": "Dort liegen auch die Ports."}, {"d": 1, "q": "Was bedeutet Kapselung?", "x": null, "o": ["Jede Schicht fügt ihren Header hinzu.", "Daten werden komprimiert.", "Daten werden gelöscht.", "Pakete werden verdoppelt."], "c": [0], "e": "Beim Empfänger wird in umgekehrter Reihenfolge ausgepackt."}, {"d": 2, "q": "Was ist eine MAC-Adresse?", "x": null, "o": ["Eine 48-Bit-Hardwareadresse der Netzwerkkarte", "Eine logische Adresse im Internet", "Ein Passwort fürs WLAN", "Ein Portname"], "c": [0], "e": "Sie gilt nur im lokalen Netz."}, {"d": 2, "q": "Was tut ein Switch mit einem Frame an eine unbekannte MAC-Adresse?", "x": null, "o": ["Er sendet ihn an alle Ports außer dem Eingangsport.", "Er verwirft ihn.", "Er sendet ihn an den Router.", "Er hält ihn zurück."], "c": [0], "e": "Das nennt man Flooding."}, {"d": 2, "q": "Wozu dient ARP?", "x": null, "o": ["Zur Auflösung einer IP-Adresse in eine MAC-Adresse", "Zur Übersetzung von Namen in IPs", "Zur automatischen Adressvergabe", "Zur Verschlüsselung"], "c": [0], "e": "DNS löst Namen, DHCP vergibt Adressen."}, {"d": 2, "q": "Wie viele Kollisionsdomänen hat ein Switch mit 8 belegten Ports?", "x": null, "o": ["8", "1", "2", "16"], "c": [0], "e": "Jeder Switch-Port ist eine eigene Kollisionsdomäne."}, {"d": 2, "q": "Was ist ein VLAN?", "x": null, "o": ["Eine logische Aufteilung eines Switches in getrennte Netze", "Ein schnelleres Kabel", "Ein Funkstandard", "Ein Verschlüsselungsverfahren"], "c": [0], "e": "VLANs trennen Broadcast-Domänen."}, {"d": 2, "q": "Welche Adresse ist privat?", "x": null, "o": ["192.168.5.20", "8.8.8.8", "172.40.1.1", "200.1.1.1"], "c": [0], "e": "Privat: 10/8, 172.16/12, 192.168/16."}, {"d": 2, "q": "Was bedeutet eine Adresse 169.254.10.5 auf einem PC?", "x": null, "o": ["Es gab keine DHCP-Antwort.", "Der PC nutzt eine feste Adresse vom Admin.", "Der PC ist im Internet.", "Der PC hat IPv6 aktiviert."], "c": [0], "e": "APIPA vergibt sich der Host selbst."}, {"d": 2, "q": "Wofür steht 127.0.0.1?", "x": null, "o": ["Loopback, der eigene Rechner", "Das Default Gateway", "Der DNS-Server", "Der Broadcast"], "c": [0], "e": "Geeignet, um den eigenen Netzwerk-Stack zu testen."}, {"d": 2, "q": "Wie viele nutzbare Hosts hat ein /24?", "x": null, "o": ["254", "256", "255", "253"], "c": [0], "e": "2^8 − 2."}, {"d": 2, "q": "Wie viele nutzbare Hosts hat ein /26?", "x": null, "o": ["62", "64", "60", "30"], "c": [0], "e": "2^6 − 2."}, {"d": 2, "q": "Welche Maske gehört zu /27?", "x": null, "o": ["255.255.255.224", "255.255.255.192", "255.255.255.240", "255.255.255.248"], "c": [0], "e": "Blockgröße 32."}, {"d": 2, "q": "Welche Broadcastadresse hat 192.168.1.64/26?", "x": null, "o": ["192.168.1.127", "192.168.1.128", "192.168.1.126", "192.168.1.255"], "c": [0], "e": "Blockgröße 64: .64 bis .127."}, {"d": 2, "q": "Welches Präfix reicht für mindestens 50 Hosts?", "x": null, "o": ["/26", "/27", "/25", "/28"], "c": [0], "e": "/26 bietet 62 Hosts."}, {"d": 2, "q": "Zwei Hosts: 10.1.1.20/25 und 10.1.1.200/25. Sind sie im selben Subnetz?", "x": null, "o": ["Nein", "Ja", "Nur mit VLAN", "Nur über WLAN"], "c": [0], "e": "/25 teilt bei .128."}, {"d": 2, "q": "Welche Länge hat eine IPv6-Adresse?", "x": null, "o": ["128 Bit", "32 Bit", "64 Bit", "48 Bit"], "c": [0], "e": "IPv4 hat 32 Bit."}, {"d": 3, "q": "Was entscheidet ein Router, wenn mehrere Routen passen?", "x": null, "o": ["Er nimmt die Route mit dem längsten Präfix.", "Er nimmt die zuletzt gelernte.", "Er nimmt immer die Default Route.", "Er würfelt."], "c": [0], "e": "Longest Prefix Match."}, {"d": 3, "q": "Was bedeutet die Route 0.0.0.0/0?", "x": null, "o": ["Default Route: Alles, was sonst nirgends passt", "Das Loopback-Netz", "Ein Fehler", "Das Broadcast-Netz"], "c": [0], "e": "Sie zeigt meist Richtung Provider."}, {"d": 3, "q": "Was passiert mit der TTL beim Weiterleiten?", "x": null, "o": ["Sie wird um 1 verringert.", "Sie wird um 1 erhöht.", "Sie bleibt gleich.", "Sie wird gelöscht."], "c": [0], "e": "Bei 0 wird das Paket verworfen."}, {"d": 3, "q": "Welche Routenquelle hat die niedrigste AD?", "x": null, "o": ["Direkt verbunden (0)", "OSPF (110)", "RIP (120)", "EIGRP (90)"], "c": [0], "e": "Static hat 1, EIGRP 90, OSPF 110."}, {"d": 3, "q": "Wie läuft der TCP-Handshake ab?", "x": null, "o": ["SYN, SYN/ACK, ACK", "ACK, SYN, FIN", "SYN, ACK, SYN/ACK", "HELLO, OK, GO"], "c": [0], "e": "Danach beginnt der Datenaustausch."}, {"d": 3, "q": "Welcher Port gehört zu HTTPS?", "x": null, "o": ["443", "80", "22", "53"], "c": [0], "e": "HTTP: 80."}, {"d": 3, "q": "Welcher Port gehört zu SSH?", "x": null, "o": ["22", "23", "25", "110"], "c": [0], "e": "Telnet: 23."}, {"d": 3, "q": "Welches Protokoll übersetzt Namen in IP-Adressen?", "x": null, "o": ["DNS", "DHCP", "ARP", "NAT"], "c": [0], "e": "DHCP vergibt Adressen."}, {"d": 3, "q": "Wie lautet der DHCP-Ablauf?", "x": null, "o": ["Discover, Offer, Request, Acknowledge", "Request, Offer, Discover, Ack", "Hello, Offer, Ack, Done", "Offer, Discover, Ack, Request"], "c": [0], "e": "Kurz DORA."}, {"d": 3, "q": "Wozu dient NAT?", "x": null, "o": ["Private Adressen werden in öffentliche übersetzt.", "Namen in IPs übersetzen", "MAC-Adressen verschlüsseln", "VLANs trennen"], "c": [0], "e": "PAT nutzt zusätzlich Ports."}, {"d": 3, "q": "Warum nutzt Sprache meist UDP?", "x": null, "o": ["Wiederholung würde die Verzögerung erhöhen, Verspätetes ist wertlos.", "UDP ist verschlüsselt.", "UDP ist zuverlässiger.", "TCP geht nicht über WLAN."], "c": [0], "e": "Geringer Overhead zählt mehr als Zuverlässigkeit."}, {"d": 3, "q": "Welches Protokoll ist verbindungslos?", "x": null, "o": ["UDP", "TCP", "SSH", "HTTP"], "c": [0], "e": "TCP baut eine Verbindung auf."}, {"d": 4, "q": "Welche Frequenz bietet nur drei überlappungsfreie Kanäle?", "x": null, "o": ["2,4 GHz", "5 GHz", "6 GHz", "60 GHz"], "c": [0], "e": "Kanäle 1, 6 und 11."}, {"d": 4, "q": "Wofür steht SSID?", "x": null, "o": ["Der Name eines WLANs", "Die MAC-Adresse des AP", "Das Passwort", "Der Kanal"], "c": [0], "e": "BSSID = MAC des Funkmoduls."}, {"d": 4, "q": "Welche WLAN-Sicherheit sollte man nicht mehr nutzen?", "x": null, "o": ["WEP", "WPA2", "WPA3", "WPA2-Enterprise"], "c": [0], "e": "WEP ist gebrochen."}, {"d": 4, "q": "Was ist der Unterschied zwischen WPA2-Personal und -Enterprise?", "x": null, "o": ["Personal nutzt einen gemeinsamen Schlüssel, Enterprise Anmeldung pro Benutzer.", "Personal ist unverschlüsselt.", "Enterprise ist nur 2,4 GHz.", "Kein Unterschied."], "c": [0], "e": "Enterprise nutzt 802.1X und RADIUS."}, {"d": 4, "q": "Was verwaltet ein Wireless LAN Controller?", "x": null, "o": ["Viele Access Points zentral", "Nur die Firewall", "Nur DHCP", "Nur VLANs"], "c": [0], "e": "Die APs sprechen über CAPWAP mit dem Controller."}, {"d": 4, "q": "Welche Schutzziele hat die CIA-Triade?", "x": null, "o": ["Vertraulichkeit, Integrität, Verfügbarkeit", "Kontrolle, Identität, Authentizität", "Kryptografie, Internet, Antivirus", "Kosten, Zeit, Qualität"], "c": [0], "e": "Confidentiality, Integrity, Availability."}, {"d": 4, "q": "Was ist Phishing?", "x": null, "o": ["Täuschung per gefälschter Nachricht, um Zugangsdaten zu erlangen", "Ein Überlastungsangriff", "Ein Routingprotokoll", "Ein Kabelfehler"], "c": [0], "e": "Die häufigste Schwachstelle ist der Mensch."}, {"d": 4, "q": "Was unterscheidet IPS von IDS?", "x": null, "o": ["IPS kann Angriffe blockieren, IDS meldet nur.", "IDS blockiert, IPS meldet.", "Beide blockieren nicht.", "Beide sind Firewalls."], "c": [0], "e": "IPS sitzt inline im Datenpfad."}, {"d": 4, "q": "Was ist MFA?", "x": null, "o": ["Anmeldung mit mehreren unabhängigen Faktoren", "Ein VPN-Protokoll", "Ein WLAN-Standard", "Ein Backup-Verfahren"], "c": [0], "e": "Wissen, Besitz, Inhärenz."}, {"d": 4, "q": "Was bedeutet die 3-2-1-Backup-Regel?", "x": null, "o": ["3 Kopien, 2 Medien, 1 extern", "3 Server, 2 Switches, 1 Router", "3 Tage, 2 Wochen, 1 Monat", "3 Passwörter, 2 Faktoren, 1 Token"], "c": [0], "e": "Schützt auch gegen Ransomware."}, {"d": 5, "q": "Was prüfst du, wenn 8.8.8.8 antwortet, ein Name aber nicht?", "x": null, "o": ["DNS-Einstellungen", "Das Kabel", "Die Subnetzmaske", "Die MAC-Adresse"], "c": [0], "e": "IP-Konnektivität besteht."}, {"d": 5, "q": "Ping zum Gateway klappt, zu 8.8.8.8 nicht. Wo suchst du?", "x": null, "o": ["Hinter dem Gateway (Routing, NAT, Provider)", "Beim Kabel zum PC", "Bei der Tastatur", "Beim ARP-Cache"], "c": [0], "e": "Das lokale Netz funktioniert."}, {"d": 5, "q": "Welcher Befehl zeigt die IP-Konfiguration unter Windows?", "x": null, "o": ["ipconfig /all", "ifconfig", "show ip", "netstat -r"], "c": [0], "e": "ifconfig/ip addr sind Linux/macOS."}, {"d": 5, "q": "Welcher Befehl zeigt den Weg zu einem Ziel unter Windows?", "x": null, "o": ["tracert", "traceroute", "nslookup", "arp -a"], "c": [0], "e": "traceroute gibt es unter Linux/macOS."}, {"d": 5, "q": "Womit analysierst du Pakete im Detail?", "x": null, "o": ["Wireshark", "Notepad", "Paint", "Excel"], "c": [0], "e": "Zum Mitschneiden und Analysieren von Verkehr."}, {"d": 5, "q": "Wie wechselst du in der Cisco-CLI in den privilegierten Modus?", "x": null, "o": ["enable", "configure terminal", "exit", "show"], "c": [0], "e": "configure terminal wechselt in den Konfigurationsmodus."}, {"d": 5, "q": "Welcher Befehl speichert die Konfiguration dauerhaft?", "x": null, "o": ["copy running-config startup-config", "save config", "write erase", "reload"], "c": [0], "e": "Ohne Speichern ist nach dem Neustart alles weg."}, {"d": 5, "q": "Welcher Befehl zeigt Interfaces mit IP-Adresse und Status?", "x": null, "o": ["show ip interface brief", "show running-config only", "show version", "show clock"], "c": [0], "e": "Kurzübersicht aller Interfaces."}, {"d": 5, "q": "Wie gibst du einem Interface eine IP-Adresse?", "x": null, "o": ["interface g0/0, dann ip address ... und no shutdown", "ip set g0/0", "address ip g0/0", "hostname g0/0"], "c": [0], "e": "Ohne no shutdown bleibt das Interface down."}, {"d": 5, "q": "Was bedeutet \"% Invalid input detected\"?", "x": null, "o": ["Tippfehler oder falscher Modus", "Der Switch ist defekt.", "Das Passwort ist falsch.", "Das Kabel ist lose."], "c": [0], "e": "Mit ? siehst du die möglichen Befehle."}];
const DOM={1:'Geräte, Kabel, Schichtenmodell (Kap. 1–2)',2:'Ethernet, IP-Adressen, Subnetting (Kap. 4–6)',3:'Routing und Dienste (Kap. 7–8)',4:'WLAN und Sicherheit (Kap. 9–10)',5:'Fehlersuche und Cisco-CLI (Kap. 11–12)'};
const WEIGHT={1:20,2:20,3:20,4:20,5:20};
const app=document.getElementById('app');
let S=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function home(){clearInterval(timer);S=null;
  const hist=lsGet('ccna_sim_hist')||[];
  let h=`<h1>Netzwerk-Einstieg · Quiz</h1><p class="sub">${Q.length} Fragen, gleichmäßig verteilt auf die fünf Themenblöcken. Läuft offline im Browser.</p>
  <div class="card modes"><h2>Modus wählen</h2>
  <button onclick="start('exam')">Quiz (30 Fragen, 30 Minuten)<small>Zufallsauswahl aus allen Blöcken, Auswertung erst am Ende</small></button>
  <button onclick="start('all')">Alle Fragen (${Q.length}, 60 Minuten)<small>Komplettdurchlauf, Auswertung am Ende</small></button>
  <h2 style="margin-top:18px">Üben mit sofortigem Feedback</h2>`;
  for(const d of Object.keys(DOM))h+=`<button class="sec" onclick="start('practice',${d})">Block ${d}: ${DOM[d]}<small>${Q.filter(q=>q.d==d).length} Fragen · </small></button>`;
  h+=`</div>`;
  if(hist.length){h+=`<div class="card"><h2>Letzte Ergebnisse</h2><table><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr>`+hist.slice(-6).reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.m)}</td><td>${x.r} von ${x.n} (${x.p} %)</td></tr>`).join('')+`</table></div>`}
  h+=`<p class="sub">Hinweis: Eigene Übungsfragen für den Einstieg. 80 % gelten hier als Orientierung für den Übergang zur CCNA.</p>`;
  app.innerHTML=h;}
function start(mode,dom){
  let qs;
  if(mode==='exam'){qs=[];const w={};let tot=0;for(const d in WEIGHT){w[d]=Math.round(30*WEIGHT[d]/100)}
    for(const d in w)qs.push(...shuffle(Q.filter(q=>q.d==d)).slice(0,w[d]));qs=shuffle(qs);}
  else if(mode==='all')qs=shuffle(Q);
  else qs=shuffle(Q.filter(q=>q.d==dom));
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,order:idx}});
  S={mode,dom,qs,i:0,ans:qs.map(()=>[]),done:qs.map(()=>false),left:mode==='exam'?1800:mode==='all'?3600:0};
  clearInterval(timer);
  if(S.left)timer=setInterval(()=>{S.left--;const e=document.getElementById('clock');if(e)e.textContent=fmt(S.left);if(S.left<=0){clearInterval(timer);finish()}},1000);
  render();}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function render(){
  const q=S.qs[S.i],multi=q.c.length>1,practice=S.mode==='practice',locked=practice&&S.done[S.i];
  let h=`<div class="card"><div class="top"><span>Frage ${S.i+1} von ${S.qs.length} · Block ${q.d}</span><span>${S.left?'⏱ <span id="clock">'+fmt(S.left)+'</span>':''}</span></div>
  <div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
  <div class="hint">${multi?`Wähle ${q.c.length} Antworten.`:'Wähle eine Antwort.'}</div>`;
  q.order.forEach(oi=>{const sel=S.ans[S.i].includes(oi);let cls='opt'+(sel?' sel':'');
    if(locked){if(q.c.includes(oi))cls='opt ok';else if(sel)cls='opt bad'}
    h+=`<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="a" ${sel?'checked':''} ${locked?'disabled':''} onchange="pick(${oi})"><span>${esc(q.o[oi])}</span></label>`});
  if(locked)h+=`<div class="expl"><strong>${ok(S.i)?'Richtig.':'Nicht ganz.'}</strong> ${esc(q.e)}</div>`;
  h+=`<div class="nav">`;
  if(S.mode!=='practice')h+=`<button class="sec" ${S.i==0?'disabled':''} onclick="go(-1)">Zurück</button>`;
  if(practice&&!locked)h+=`<button onclick="check()" ${S.ans[S.i].length?'':'disabled'}>Prüfen</button>`;
  if(S.i<S.qs.length-1&&(S.mode!=='practice'||locked))h+=`<button onclick="go(1)">Weiter</button>`;
  if(S.mode!=='practice'&&S.i==S.qs.length-1)h+=`<button onclick="confirmFinish()">Abgeben</button>`;
  if(practice&&locked&&S.i==S.qs.length-1)h+=`<button onclick="finish()">Auswertung</button>`;
  h+=`<button class="sec" onclick="home()">Abbrechen</button></div></div>`;
  if(S.mode!=='practice'){h+=`<div class="card"><div class="hint">Übersicht (beantwortet: ${S.ans.filter(a=>a.length).length} von ${S.qs.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px">`+
    S.qs.map((_,i)=>`<button class="${S.ans[i].length?'':'sec'}" style="padding:4px 9px;${i==S.i?'outline:2px solid var(--acc)':''}" onclick="jump(${i})">${i+1}</button>`).join('')+`</div></div>`}
  app.innerHTML=h;}
function pick(oi){const q=S.qs[S.i],a=S.ans[S.i];if(q.c.length>1){const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi)}else S.ans[S.i]=[oi];render();}
const ok=i=>{const q=S.qs[i],a=S.ans[i];return a.length===q.c.length&&q.c.every(x=>a.includes(x))};
function check(){S.done[S.i]=true;render();}
function go(d){S.i+=d;render();}
function jump(i){S.i=i;render();}
function confirmFinish(){const n=S.ans.filter(a=>!a.length).length;if(n&&!confirm(`${n} Frage(n) sind unbeantwortet. Trotzdem abgeben?`))return;finish();}
function finish(){clearInterval(timer);
  const per={};S.qs.forEach((q,i)=>{per[q.d]=per[q.d]||{r:0,n:0};per[q.d].n++;if(ok(i))per[q.d].r++});
  const r=S.qs.filter((_,i)=>ok(i)).length,n=S.qs.length,p=Math.round(100*r/n);
  const name={exam:'Quiz',all:'Alle Fragen',practice:'Üben Block '+S.dom}[S.mode];
  const hist=lsGet('ccna_sim_hist')||[];hist.push({t:new Date().toLocaleString('de-DE'),m:name,r,n,p});lsSet('ccna_sim_hist',hist.slice(-20));
  let h=`<div class="card"><h1>Ergebnis</h1><div class="big ${p>=80?'pass':'fail'}">${r} von ${n} · ${p} %</div>
  <p class="sub">${p>=80?'Über der Orientierungsmarke von 80 %.':'Unter der Orientierungsmarke von 80 %. Die Auswertung unten zeigt, wo es hakt.'}</p>
  <table><tr><th>Block</th><th>Richtig</th><th></th></tr>`+Object.keys(per).sort().map(d=>`<tr><td>${d} ${DOM[d]}</td><td>${per[d].r} / ${per[d].n}</td><td><div class="bar"><i style="width:${100*per[d].r/per[d].n}%"></i></div></td></tr>`).join('')+`</table>
  <div class="nav"><button onclick="home()">Zum Start</button></div></div>`;
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>!ok(x.i));
  if(wrong.length){h+=`<div class="card"><h2>Falsch oder offen (${wrong.length})</h2>`+wrong.map(({q,i})=>`<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="q">${esc(q.q)}</div>${q.x?`<pre>${esc(q.x)}</pre>`:''}
    <div>Deine Antwort: ${S.ans[i].length?S.ans[i].map(x=>esc(q.o[x])).join(' · '):'<em>keine</em>'}</div><div style="color:var(--ok)">Richtig: ${q.c.map(x=>esc(q.o[x])).join(' · ')}</div><div class="expl">${esc(q.e)}</div></div>`).join('')+`</div>`}
  app.innerHTML=h;window.scrollTo(0,0);}
home();
</script>
