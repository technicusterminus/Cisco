# Baut Access Policies und einen Tenant mit zwei EPGs und Contract.
# Aufruf:  ansible-playbook -i ansible-inventory.yml ansible-tenant.yml
# Braucht: pip install ansible  (enthaelt die Collection cisco.aci)
- name: ACI-Konfiguration gegen den Simulator
  hosts: apic-sim
  gather_facts: false
  module_defaults:
    group/cisco.aci.all:
      host: "{{ aci_host }}"
      port: "{{ aci_port }}"
      username: "{{ aci_user }}"
      password: "{{ aci_pass }}"
      use_ssl: false
      validate_certs: false
  tasks:
    # ---------------- Access Policies ----------------
    - name: VLAN Pool
      cisco.aci.aci_vlan_pool:
        pool: VLAN-Pool-Ansible
        pool_allocation_mode: static
    - name: Encap Block
      cisco.aci.aci_vlan_pool_encap_block:
        pool: VLAN-Pool-Ansible
        pool_allocation_mode: static
        block_start: 200
        block_end: 249
    - name: Physical Domain
      cisco.aci.aci_domain:
        domain: PhysDom-Ansible
        domain_type: phys
    - name: Domain an VLAN Pool
      cisco.aci.aci_domain_to_vlan_pool:
        domain: PhysDom-Ansible
        domain_type: phys
        pool: VLAN-Pool-Ansible
        pool_allocation_mode: static
    - name: AAEP
      cisco.aci.aci_aep:
        aep: AAEP-Ansible
    - name: AAEP an Domain
      cisco.aci.aci_aep_to_domain:
        aep: AAEP-Ansible
        domain: PhysDom-Ansible
        domain_type: phys
    - name: Interface Policy Group
      cisco.aci.aci_interface_policy_leaf_policy_group:
        lag_type: leaf
        policy_group: IPG-Ansible
        aep: AAEP-Ansible
    - name: Interface Profile
      cisco.aci.aci_interface_policy_leaf_profile:
        leaf_interface_profile: IntProf-Ansible
    - name: Access Port Selector Ports 1/21-30
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        leaf_interface_profile: IntProf-Ansible
        access_port_selector: Ports-21-30
        port_blk: block21
        from_port: 21
        to_port: 30
        policy_group: IPG-Ansible
    - name: Switch Profile
      cisco.aci.aci_switch_policy_leaf_profile:
        leaf_profile: SwProf-Ansible
    - name: Leaf Selector 101-102
      cisco.aci.aci_switch_leaf_selector:
        leaf_profile: SwProf-Ansible
        leaf: L101-102
        leaf_node_blk: blk101
        from: 101
        to: 102
    - name: Interface Profile an Switch Profile
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        leaf_profile: SwProf-Ansible
        interface_selector: IntProf-Ansible

    # ---------------- Tenant ----------------
    - name: Tenant
      cisco.aci.aci_tenant:
        tenant: Ansible
        description: angelegt mit Ansible
    - name: VRF
      cisco.aci.aci_vrf:
        tenant: Ansible
        vrf: Prod
    - name: Bridge Domains
      cisco.aci.aci_bd:
        tenant: Ansible
        bd: "{{ item }}"
        vrf: Prod
      loop: [BD-Web, BD-App]
    - name: Subnetze
      cisco.aci.aci_bd_subnet:
        tenant: Ansible
        bd: "{{ item.bd }}"
        gateway: "{{ item.gw }}"
        mask: 24
        scope: private
      loop:
        - { bd: BD-Web, gw: 10.30.10.1 }
        - { bd: BD-App, gw: 10.30.20.1 }
    - name: Application Profile
      cisco.aci.aci_ap:
        tenant: Ansible
        ap: Webshop
    - name: EPGs
      cisco.aci.aci_epg:
        tenant: Ansible
        ap: Webshop
        epg: "{{ item.epg }}"
        bd: "{{ item.bd }}"
      loop:
        - { epg: Web, bd: BD-Web }
        - { epg: App, bd: BD-App }
    - name: EPGs an Physical Domain
      cisco.aci.aci_epg_to_domain:
        tenant: Ansible
        ap: Webshop
        epg: "{{ item }}"
        domain: PhysDom-Ansible
        domain_type: phys
      loop: [Web, App]
    - name: Static Ports
      cisco.aci.aci_static_binding_to_epg:
        tenant: Ansible
        ap: Webshop
        epg: "{{ item.epg }}"
        encap_id: "{{ item.vlan }}"
        interface_type: switch_port
        pod_id: 1
        leafs: "{{ item.leaf }}"
        interface: "{{ item.port }}"
        interface_mode: trunk
      loop:
        - { epg: Web, vlan: 210, leaf: 101, port: "1/21" }
        - { epg: App, vlan: 220, leaf: 102, port: "1/22" }
    - name: Filter
      cisco.aci.aci_filter:
        tenant: Ansible
        filter: tcp-8080
    - name: Filter Entry
      cisco.aci.aci_filter_entry:
        tenant: Ansible
        filter: tcp-8080
        entry: tcp-8080
        ether_type: ip
        ip_protocol: tcp
        dst_port: 8080
    - name: Contract
      cisco.aci.aci_contract:
        tenant: Ansible
        contract: web-to-app
        scope: context
    - name: Subject
      cisco.aci.aci_contract_subject:
        tenant: Ansible
        contract: web-to-app
        subject: app
        reverse_filter: true
    - name: Subject an Filter
      cisco.aci.aci_contract_subject_to_filter:
        tenant: Ansible
        contract: web-to-app
        subject: app
        filter: tcp-8080
    - name: Provider und Consumer
      cisco.aci.aci_epg_to_contract:
        tenant: Ansible
        ap: Webshop
        epg: "{{ item.epg }}"
        contract: web-to-app
        contract_type: "{{ item.type }}"
      loop:
        - { epg: App, type: provider }
        - { epg: Web, type: consumer }

    # ---------------- Abfrage ----------------
    - name: Faults im Tenant abfragen
      cisco.aci.aci_rest:
        path: /api/mo/uni/tn-Ansible.json?rsp-subtree-include=faults,no-scoped
        method: get
      register: faults
    - name: Faults anzeigen
      ansible.builtin.debug:
        msg: "{{ faults.imdata | map(attribute='faultInst.attributes.descr') | list }}"
