hostname SW1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
spanning-tree mode rapid-pvst
vlan 10
 name USERS
vlan 999
 name RSPAN
 remote-span
interface GigabitEthernet0/0
 switchport mode access
 switchport access vlan 10
interface GigabitEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,999
interface GigabitEthernet1/0
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
interface GigabitEthernet1/1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
interface GigabitEthernet1/2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
monitor session 1 source interface GigabitEthernet1/0 both
monitor session 1 destination interface GigabitEthernet1/3
monitor session 2 source interface GigabitEthernet1/1 both
monitor session 2 destination remote vlan 999
