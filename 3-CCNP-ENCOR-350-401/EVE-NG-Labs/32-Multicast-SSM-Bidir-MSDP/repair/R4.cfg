hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.34.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 192.168.4.1 255.255.255.0
 no shutdown
router ospf 1
 router-id 10.255.0.4
 network 10.255.0.4 0.0.0.0 area 0
 network 10.0.34.0 0.0.0.3 area 0
 network 192.168.4.0 0.0.0.255 area 0
ip multicast-routing
ip pim bidir-enable
ip pim ssm default
ip pim rp-address 10.255.0.100 10
ip pim rp-address 10.255.0.200 20 bidir
access-list 10 permit 239.1.0.0 0.0.255.255
access-list 20 permit 239.2.0.0 0.0.255.255
interface Loopback0
 ip pim sparse-mode
interface GigabitEthernet0/0
 ip pim sparse-mode
interface GigabitEthernet0/1
 ip pim sparse-mode
