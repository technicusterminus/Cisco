hostname R1
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.14.1 255.255.255.252
 no shutdown
ip prefix-list A2-IN seq 5 deny 10.1.18.0/24
ip prefix-list A2-IN seq 10 permit 0.0.0.0/0 le 32
router ospf 1
 router-id 10.255.0.1
 area 2 filter-list prefix A2-IN out
interface Loopback0
 ip ospf 1 area 0
interface GigabitEthernet0/0
 ip ospf 1 area 0
interface GigabitEthernet0/1
 ip ospf network point-to-point
 ip ospf 1 area 2
