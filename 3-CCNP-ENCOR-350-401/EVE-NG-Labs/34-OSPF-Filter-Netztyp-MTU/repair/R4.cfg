hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.14.2 255.255.255.252
 no shutdown
interface Loopback20
 ip address 10.2.20.1 255.255.255.0
interface Loopback21
 ip address 10.2.21.1 255.255.255.0
ip route 198.51.100.0 255.255.255.0 Null0
ip route 203.0.113.0 255.255.255.0 Null0
ip prefix-list EXT-OK seq 5 permit 198.51.100.0/25
route-map EXT permit 10
 match ip address prefix-list EXT-OK
router ospf 1
 router-id 10.255.0.4
 redistribute static subnets route-map EXT
interface Loopback0
 ip ospf 1 area 2
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 2
interface Loopback20
 ip ospf network point-to-point
 ip ospf 1 area 2
interface Loopback21
 ip ospf network point-to-point
 ip ospf 1 area 2
