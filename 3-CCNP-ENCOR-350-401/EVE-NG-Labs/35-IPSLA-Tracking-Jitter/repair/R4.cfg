hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
interface Loopback1
 ip address 10.255.1.4 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.24.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.34.2 255.255.255.252
 no shutdown
ip route 192.168.1.0 255.255.255.0 10.0.24.1
ip route 192.168.1.0 255.255.255.0 10.0.34.1
ip route 10.0.12.0 255.255.255.252 10.0.24.1
ip route 10.0.13.0 255.255.255.252 10.0.34.1
line vty 0 4
 password cisco
 login
 transport input telnet
