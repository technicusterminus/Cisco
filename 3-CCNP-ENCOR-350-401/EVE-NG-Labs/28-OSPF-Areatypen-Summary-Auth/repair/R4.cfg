hostname R4
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 no shutdown
interface GigabitEthernet0/0
 ip address 10.0.24.2 255.255.255.252
 no shutdown
ip route 172.31.0.0 255.255.255.0 Null0
router ospf 1
 passive-interface default
 network 10.0.24.0 0.0.0.3 area 2
 network 10.255.0.4 0.0.0.0 area 2
 area 2 nssa
 redistribute static
