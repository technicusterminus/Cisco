hostname MSMR
no ip domain-lookup
service timestamps log datetime msec
line con 0
 exec-timeout 0 0
 logging synchronous
interface GigabitEthernet0/0
 ip address 10.0.99.1 255.255.255.252
 no shutdown
ip route 0.0.0.0 0.0.0.0 10.0.99.2
router lisp
 site SITE1
  authentication-key LispKey123
  eid-prefix 192.168.1.0/24
  exit
 site SITE2
  authentication-key LispKey123
  eid-prefix 192.168.2.0/24
  exit
 ipv4 map-server
 ipv4 map-resolver
 exit
