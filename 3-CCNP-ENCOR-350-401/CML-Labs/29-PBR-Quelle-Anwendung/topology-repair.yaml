lab:
  title: Lab 29 – Policy-Based Routing nach Quelle und Anwendung (Repair)
  description: 'Ein Branch-Router mit zwei Providern: Die Routing-Tabelle sendet alles über Provider A, per PBR wird ein bestimmter Host und Web-Verkehr über Provider B geleitet. Dazu die Wirkung von `deny` in einer '
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 150
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.1.0.1 255.255.255.0
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.12.2
    ip access-list extended H2-ONLY
     permit ip host 10.1.0.21 any
    ip access-list extended WEB
     permit tcp any any eq 80
    route-map PBR deny 10
     match ip address H2-ONLY
     set ip next-hop 10.0.31.2
    route-map PBR permit 20
     match ip address WEB
     set ip next-hop 10.0.13.2
    interface GigabitEthernet0/2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
