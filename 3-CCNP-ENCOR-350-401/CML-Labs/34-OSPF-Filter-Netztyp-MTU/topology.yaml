lab:
  title: 'Lab 34 – OSPF: Routen filtern (ABR, ASBR, lokal) und Nachbarschaften mit Netztyp- und MTU-Fehlern'
  description: Das Blueprint nennt bei OSPF ausdrücklich Filterung, Nachbarschaft und die Netztypen Point-to-Point und Broadcast. Lab 01 und 28 decken Areas, Summaries und Authentisierung ab, gefiltert wird dort nicht. Hier lernst du die vier Stellen kennen, an denen OSPF Routen zurückhalten kann, und warum es innerhalb einer Area keine fünfte gibt. Dazu kommen zwei Nachbarschaftsfehler, die in `show ip ospf neighbor` harmlos aussehen.
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 400
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.14.1 255.255.255.252
     no shutdown
