lab:
  title: Lab 18 – Flexible NetFlow, SPAN und RSPAN (Repair)
  description: 'Verkehr sichtbar machen: Flexible NetFlow auf einem Router (Record, Exporter, Monitor), lokales SPAN und RSPAN über einen Trunk zwischen zwei Switches. ERSPAN wird als Konfigurationsübung ohne CML-Tes'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  x: 250
  y: 150
  configuration: |
    hostname SW1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    spanning-tree mode rapid-pvst
    vlan 10
     name USERS
    vlan 999
     name RSPAN
     remote-span
    interface GigabitEthernet0/0
     switchport mode access
     switchport access vlan 10
    interface GigabitEthernet0/1
     switchport mode trunk
     switchport nonegotiate
     switchport trunk allowed vlan 10,999
    interface GigabitEthernet1/0
     switchport mode access
     switchport access vlan 10
     spanning-tree portfast
    interface GigabitEthernet1/1
     switchport mode access
     switchport access vlan 10
     spanning-tree portfast
    interface GigabitEthernet1/2
     switchport mode access
     switchport access vlan 10
     spanning-tree portfast
    monitor session 1 source interface GigabitEthernet1/0 both
    monitor session 1 destination interface GigabitEthernet1/3
    monitor session 2 source interface GigabitEthernet1/1 both
    monitor session 2 destination remote vlan 999
  tags: []
