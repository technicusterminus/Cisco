lab:
  title: 'Lab 24 – Capstone: WAN, eBGP und IPsec-Overlay, Fehlersuche (Repair)'
  description: Zwei Standorte sind per eBGP an einen ISP angebunden und über einen GRE-Tunnel mit IPsec-Schutz verbunden. Darüber läuft OSPF mit Authentifizierung. Dazu ein VRF-Lite für Gäste am Standort 1. Neun Feh
  notes: |-
    ## Lab 24 — WAN- und Overlay-Transfer

    **Stufe:** Transfer · **Zeitbox:** 100 Minuten

    **Blueprint:** 2.2.a–b, 3.2.b (IPv4), 3.2.c.

    **Voraussetzung:** 03, 13, 14 und 01

    **Start:** Reparaturvariante mit Provider, Transport, Overlay und Kundenendpunkten.

    **Auftrag:** Stelle die Startsymptome nach, sortiere Transport und Overlay und stelle die Site-Pfade wieder her. Begründe, warum jede Bedienhandlung den kleinstmöglichen Bereich betrifft.

    **Grenzen:** Behalte Adressplan und bereitgestellte Infrastruktur bei. Nimm für Gegenproben vorübergehend erzeugte Fehler zurück.

    **Erfolgskriterium:** Belege den vorgesehenen eBGP-Transport, die geschützten Overlay-Pfade und getrennte Kundenerreichbarkeit.

    **Gegenprobe:** Ein Underlay-Ping darf keinen IPsec-Erfolg vortäuschen; Nachweis per SA-Zähler.

    **Wiederholung oder Transfer:** 30 für Routing unter geänderten Randbedingungen

    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Die BGP-Session R1–ISP kommt nicht hoch (`Idle`/`Active`), im Log steht `%BGP-3-NOTIFICATION: sent to neighbor 198.51.100.2 2/2 (peer in wrong AS)`.

    **Ticket 2:** R1 lernt das Transportnetz von R2 nicht (`show ip bgp` ohne 203.0.113.0/30), R1 erreicht 203.0.113.1 nicht, der Tunnel kommt von R1 aus nicht hoch.

    **Ticket 3:** R2 erreicht 198.51.100.1 nicht: Im BGP-Table von R2 fehlt 198.51.100.0/30, obwohl R1 es ankündigt. Beim ISP steht der Prefix in `show ip bgp neighbors 198.51.100.1 received-routes`, nicht aber im Table.

    **Ticket 4:** Nach der Underlay-Korrektur ist Tunnel0 auf R1 `up/up`, aber R2 sieht keinen Tunnel-Verkehr und `show crypto isakmp sa` ist leer.

    **Ticket 5:** `show crypto isakmp sa` bleibt in `MM_KEY_EXCH`/`MM_NO_STATE`, der OSPF-Nachbar fehlt, Pings durch den Tunnel scheitern.

    **Ticket 6:** Nach der IPsec-Korrektur bleibt der OSPF-Nachbar in `EXSTART`/`EXCHANGE` hängen (`%OSPF-5-ADJCHG` wechselt, `Neighbor ... stuck`).

    **Ticket 7:** Nach der MTU-Korrektur kommt noch immer kein OSPF-Nachbar hoch; das Log meldet `%OSPF-4-ERRRCV: Received invalid packet: Mismatch Authentication Key`.

    **Ticket 8:** OSPF-Nachbar `FULL`, aber H1 erreicht H2 nicht; R1 hat keine Route nach 192.168.2.0/24.

    **Ticket 9:** H3 (Gast) pingt H1 erfolgreich und sogar 10.99.0.2. `show ip route vrf GUEST` ist leer, die Gast-LAN liegt in der globalen Routing-Tabelle.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 100
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/2
     no shutdown
    router bgp 65001
     neighbor 198.51.100.2 remote-as 65010
     network 198.51.100.0 mask 255.255.255.252
    ip vrf GUEST
     rd 65001:100
    interface GigabitEthernet0/2
     ip address 192.168.3.1 255.255.255.0
    crypto isakmp policy 10
     encryption aes 256
     hash sha
     authentication pre-share
     group 2
    crypto isakmp key LabKey123 address 203.0.113.1
    crypto ipsec transform-set TS esp-aes 256 esp-sha-hmac
     mode transport
    crypto ipsec profile PROF
     set transform-set TS
    interface Tunnel0
     ip address 10.99.0.1 255.255.255.252
     ip mtu 1400
     tunnel source GigabitEthernet0/0
     tunnel destination 203.0.113.2
     tunnel protection ipsec profile PROF
     ip ospf authentication message-digest
     ip ospf message-digest-key 1 md5 OspfKey
    router ospf 1
     passive-interface GigabitEthernet0/1
     network 10.99.0.0 0.0.0.3 area 0
     network 192.168.1.0 0.0.0.255 area 0
