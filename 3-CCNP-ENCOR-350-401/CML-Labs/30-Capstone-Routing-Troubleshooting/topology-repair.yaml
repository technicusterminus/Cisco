lab:
  title: 'Lab 30 – Capstone: Routing-Fehlersuche (OSPF, EIGRP, BGP, Redistribution) (Repair)'
  description: 'Ein Unternehmensnetz mit OSPF (Area 0 und Stub-Area 1), einem EIGRP-Standort, eBGP zum Provider und Default-Route-Weitergabe. Acht Fehler quer durch alle Protokolle, teils voneinander verdeckt: Die Au'
  notes: |-
    ## Lab 30 — Abschluss Routing im kombinierten Netz

    **Stufe:** Transfer · **Zeitbox:** 90 Minuten

    **Blueprint:** 3.2.a, 3.2.b (IPv4), 3.2.c.

    **Voraussetzung:** 01, 03, 25, 27 und 34

    **Start:** Reparaturvariante mit Provider und internen Routingdomänen.

    **Auftrag:** Rekonstruiere schrittweise die Pfade vom Provider zu den internen Netzen. Bearbeite die Tickets in begründeter Reihenfolge und wähle pro Mechanismus den stärksten Nachweis.

    **Grenzen:** Behalte Adressplan und bereitgestellte Infrastruktur bei. Nimm für Gegenproben vorübergehend erzeugte Fehler zurück.

    **Erfolgskriterium:** Erreichbarkeit, Präfixursprung und vorgesehene Routingentscheidung sind pro Ticket nachvollziehbar.

    **Gegenprobe:** Ein Ersatzpfad darf eine fehlerhafte Nachbarschaft oder unerwünschte Rückverteilung nicht verdecken.

    **Wiederholung oder Transfer:** 24 und 23 für andere Architekturgrenzen

    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Kein BGP: R1 hat keine Default-Route, R2/R3/R4 erreichen 203.0.113.1 nicht.

    **Ticket 2:** BGP steht, R1 hat eine Default-Route, aber R2 und R3 haben keine.

    **Ticket 3:** R2 und R3 bilden keine Nachbarschaft; Mismatched Stub/Transit-Option im Debug.

    **Ticket 4:** R1 und R3 sehen 172.20.4.0/24 nicht.

    **Ticket 5:** Auf R4 fehlen die OSPF-Routen (R3-Loopback, 10.0.12.0/30); nur die statische Default erreicht R2.

    **Ticket 6:** R4 erreicht 203.0.113.1 nicht, schon der erste Hop im Traceroute bleibt stumm. Die Default-Route steht aber in `show ip route`.

    **Ticket 7:** Das Netz 192.168.3.0/24 fehlt auf R1/R2, Pings von R3-Lo10 ins Internet scheitern am Rückweg.

    **Ticket 8:** Pings aus den 10er-Netzen an 203.0.113.1 scheitern auf dem Rückweg, obwohl das Routing intern stimmt. Der Traceroute zeigt den Hinweg bis zum ISP.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: ISP
  node_definition: iosv
  x: 300
  y: -100
  configuration: |
    hostname ISP
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 203.0.113.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    ip route 10.0.0.0 255.0.0.0 198.51.100.5
    ip route 172.20.0.0 255.255.0.0 198.51.100.1
    ip route 192.168.0.0 255.255.0.0 198.51.100.1
    router bgp 65000
     neighbor 198.51.100.1 remote-as 65001
     neighbor 198.51.100.1 default-originate
     network 203.0.113.0 mask 255.255.255.0
