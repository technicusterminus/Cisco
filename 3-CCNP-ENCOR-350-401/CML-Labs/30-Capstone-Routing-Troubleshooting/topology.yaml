lab:
  title: 'Lab 30 – Capstone: Routing-Fehlersuche (OSPF, EIGRP, BGP, Redistribution)'
  description: 'Ein Unternehmensnetz mit OSPF (Area 0 und Stub-Area 1), einem EIGRP-Standort, eBGP zum Provider und Default-Route-Weitergabe. Acht Fehler quer durch alle Protokolle, teils voneinander verdeckt: Die Au'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: ISP
  node_definition: iosv
  x: 300
  y: -100
  configuration: |
    hostname ISP
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 203.0.113.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.2 255.255.255.252
     no shutdown
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
