lab:
  title: 'Lab 28 – OSPF vertieft: Area-Typen, Summarisierung und Authentifizierung (Repair)'
  description: Ein ABR verbindet Area 0 mit einer Totally-Stubby-Area und einer NSSA. Dazu Zusammenfassung am ABR, Redistribution im NSSA und MD5-Authentifizierung. Du liest LSA-Typen und verstehst, warum Area-Typen
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 50
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 10.1.0.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface Loopback10
     ip ospf network point-to-point
    interface GigabitEthernet0/0
     ip ospf authentication message-digest
     ip ospf message-digest-key 1 md5 OspfKez
    router ospf 1
     passive-interface default
     no passive-interface GigabitEthernet0/0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.255.0.1 0.0.0.0 area 0
     network 10.1.0.0 0.0.0.255 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 300
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.23.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.24.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/0
     ip ospf authentication message-digest
     ip ospf message-digest-key 1 md5 OspfKey
    router ospf 1
     passive-interface default
     no passive-interface GigabitEthernet0/0
     no passive-interface GigabitEthernet0/1
     no passive-interface GigabitEthernet0/2
     network 10.0.12.0 0.0.0.3 area 0
     network 10.255.0.2 0.0.0.0 area 0
     network 10.0.23.0 0.0.0.3 area 1
     network 10.0.24.0 0.0.0.3 area 2
     area 1 stub
     area 1 range 192.168.0.0 255.255.255.0
     area 2 nssa
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
