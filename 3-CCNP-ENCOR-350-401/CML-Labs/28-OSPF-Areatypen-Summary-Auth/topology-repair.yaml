lab:
  title: 'Lab 28 – OSPF vertieft: Area-Typen, Summarisierung und Authentifizierung (Repair)'
  description: Ein ABR verbindet Area 0 mit einer Totally-Stubby-Area und einer NSSA. Dazu Zusammenfassung am ABR, Redistribution im NSSA und MD5-Authentifizierung. Du liest LSA-Typen und verstehst, warum Area-Typen
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** R2 und R3 bilden keine Nachbarschaft; `debug ip ospf adj` zeigt `Hello from … with mismatched Stub/Transit area option bit`.

    **Ticket 2:** R1 sieht drei einzelne Routen 192.168.1.0/24, 192.168.2.0/24, 192.168.3.0/24 und nur 192.168.0.0/24 als Summary.

    **Ticket 3:** R1 und R2 sind in `INIT`/ohne Nachbarschaft, Log: `Mismatched Authentication key`.

    **Ticket 4:** 172.31.0.0/24 fehlt in Area 0, R1 sieht keine externe Route.

    **Ticket 5:** R4 hat keinen OSPF-Nachbarn zu R2, obwohl der Link steht.

    **Ticket 6:** R3 trägt trotz Stub-Area alle Inter-Area-Routen (O IA) statt nur der Default-Route.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 50
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 10.1.0.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface Loopback10
     ip ospf network point-to-point
    interface GigabitEthernet0/0
     ip ospf authentication message-digest
     ip ospf message-digest-key 1 md5 OspfKez
    router ospf 1
     passive-interface default
     no passive-interface GigabitEthernet0/0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.255.0.1 0.0.0.0 area 0
     network 10.1.0.0 0.0.0.255 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
