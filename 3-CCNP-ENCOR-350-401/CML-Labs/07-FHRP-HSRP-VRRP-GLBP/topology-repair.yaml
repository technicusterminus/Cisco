lab:
  title: 'Lab 07 – First-Hop-Redundanz: HSRP, VRRP und GLBP (Repair)'
  description: Zwei Distribution-Router, ein Access-Switch, drei VLANs mit je einem anderen FHRP-Protokoll. Dazu Tracking, Preemption, Timer und die Frage, welche Redundanzstufe (Link, Gerät, Standort) Hochverfügbar
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Auf VLAN 10 melden beide Router `Active`, im Log steht `%HSRP-4-DIFFVIP1`.

    **Ticket 2:** Nach Abschalten von R1 Gi0/2 bleibt R1 HSRP Active, der Verkehr von VLAN 10 geht ins Leere.

    **Ticket 3:** VLAN 20 zeigt auf beiden Routern `Master`, Hosts erhalten unregelmäßig Pings.

    **Ticket 4:** Nach dem Wiederanschalten von R1 Gi0/2 bleibt R2 Active, obwohl R1 höhere Priorität hat.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 100
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    track 1 interface GigabitEthernet0/2 line-protocol
    interface GigabitEthernet0/0.10
     encapsulation dot1Q 10
     ip address 10.10.10.2 255.255.255.0
     standby version 2
     standby 10 ip 10.10.10.1
     standby 10 priority 110
     standby 10 track 1 decrement 5
    interface GigabitEthernet0/0.20
     encapsulation dot1Q 20
     ip address 10.10.20.2 255.255.255.0
     vrrp 20 ip 10.10.20.1
     vrrp 20 priority 100
    interface GigabitEthernet0/0.30
     encapsulation dot1Q 30
     ip address 10.10.30.2 255.255.255.0
     glbp 30 ip 10.10.30.1
     glbp 30 priority 110
     glbp 30 preempt
     glbp 30 load-balancing round-robin
    router ospf 1
     passive-interface default
     no passive-interface GigabitEthernet0/1
     no passive-interface GigabitEthernet0/2
     network 10.0.0.0 0.255.255.255 area 0
