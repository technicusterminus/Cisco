lab:
  title: Lab 27 – Redistribution zwischen OSPF und EIGRP mit Tags und Filtern (Repair)
  description: Zwei Routing-Domänen (OSPF und EIGRP) werden an **zwei** Punkten gegenseitig verbunden. Ohne Schutz entstehen Routing-Schleifen und Rückkopplungen. Du lernst Metrik-Zuweisung, Route-Tags, Route-Maps u
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 50
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 10.1.0.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface Loopback10
     ip ospf network point-to-point
    router ospf 1
     network 10.0.12.0 0.0.0.3 area 0
     network 10.0.13.0 0.0.0.3 area 0
     network 10.255.0.1 0.0.0.0 area 0
     network 10.1.0.0 0.0.0.255 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 120
  y: 220
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.24.1 255.255.255.252
     no shutdown
    ip prefix-list LOCAL-ONLY seq 5 permit 10.4.2.0/24
    route-map E2O deny 5
     match ip address prefix-list LOCAL-ONLY
    route-map E2O deny 10
     match tag 1
    route-map E2O permit 20
     set tag 2
     set metric 20
    route-map O2E deny 10
     match tag 2
    route-map O2E permit 20
     set tag 1
    router ospf 1
     network 10.0.12.0 0.0.0.3 area 0
     network 10.255.0.2 0.0.0.0 area 0
     redistribute eigrp 100 subnets route-map E2O
    router eigrp 100
     network 10.0.24.0 0.0.0.3
     no auto-summary
     redistribute ospf 1 route-map O2E
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R3
  node_definition: iosv
  x: 480
  y: 220
  configuration: |
    hostname R3
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.3 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.13.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.34.1 255.255.255.252
     no shutdown
    ip prefix-list LOCAL-ONLY seq 5 permit 10.4.1.0/24
    route-map E2O deny 5
     match ip address prefix-list LOCAL-ONLY
    route-map E2O deny 10
     match tag 9
    route-map E2O permit 20
     set tag 2
     set metric 100
    route-map O2E deny 10
     match tag 2
    route-map O2E permit 20
     set tag 1
    router ospf 1
     network 10.0.13.0 0.0.0.3 area 1
     network 10.255.0.3 0.0.0.0 area 0
     redistribute eigrp 100 route-map E2O
    router eigrp 100
     network 10.0.34.0 0.0.0.3
     no auto-summary
     redistribute ospf 1 metric 10000 100 255 1 1500 route-map O2E
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n3
  label: R4
  node_definition: iosv
  x: 300
  y: 390
  configuration: |
    hostname R4
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.4 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 10.4.0.1 255.255.255.0
     no shutdown
    interface Loopback11
     ip address 10.4.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.24.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.34.2 255.255.255.252
     no shutdown
    router eigrp 100
     network 10.0.24.0 0.0.0.3
     network 10.4.0.0 0.0.1.255
     network 10.255.0.4 0.0.0.0
     no auto-summary
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
