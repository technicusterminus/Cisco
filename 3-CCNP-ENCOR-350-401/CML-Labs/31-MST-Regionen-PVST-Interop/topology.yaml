- id: n0
  label: DS1
  node_definition: iosvl2
  x: 100
  y: 0
  configuration: |
    hostname DS1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    vlan 10
     name USERS
    vlan 20
     name SERVERS
    vlan 30
     name VOICE
    spanning-tree mode rapid-pvst
    interface GigabitEthernet0/0
