lab:
  title: 'Lab 31 – MST vertieft: Regionen, Instanzen, Pfadkosten und PVST-Interop (Reparatur)'
  description: 'Vier Switches in einer MST-Region, ein Legacy-Switch mit Rapid-PVST: Region planen, Root je Instanz, Pfadkosten pro Instanz, IST, Boundary und PVST-Simulation.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: DS1
  node_definition: iosvl2
  x: 100
  y: 0
  configuration: |
    hostname DS1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    vlan 10
     name USERS
    vlan 20
     name SERVERS
    vlan 30
     name VOICE
    spanning-tree mode rapid-pvst
    interface GigabitEthernet0/0
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport nonegotiate
    interface GigabitEthernet0/1
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport nonegotiate
    interface GigabitEthernet0/2
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport nonegotiate
    ip routing
    interface Vlan10
     ip address 10.10.10.1 255.255.255.0
     no shutdown
    interface Vlan20
     ip address 10.10.20.1 255.255.255.0
     no shutdown
    interface Vlan30
     ip address 10.10.30.1 255.255.255.0
     no shutdown
    spanning-tree mst configuration
     name CAMPUS
     revision 1
     instance 1 vlan 10,30
     instance 2 vlan 20
    spanning-tree mode mst
    spanning-tree mst 0-1 priority 4096
    spanning-tree mst 2 priority 8192
  tags: []
  interfaces:
