lab:
  title: 'Lab 32 – Multicast vertieft: IGMPv3 und SSM, Bidir-PIM, Anycast-RP mit MSDP'
  description: 'Lab 12 hat PIM Sparse Mode mit einem RP gezeigt. Hier baust du auf demselben Netz nacheinander die drei Verfahren, die das Blueprint zusätzlich nennt: Source-Specific Multicast mit IGMPv3 (kein RP), Bidirectional PIM (nur Shared Tree, kein `(S,G)`) und zwei RPs mit gleicher Adresse, die sich ihre Quellen per MSDP mitteilen. Jedes Verfahren bekommt einen eigenen Gruppenbereich, damit du sie nebeneinander vergleichen kannst.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 192.168.1.0 0.0.0.255 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
