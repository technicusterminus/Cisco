lab:
  title: 'Lab 32 – Multicast vertieft: IGMPv3 und SSM, Bidir-PIM, Anycast-RP mit MSDP (Repair)'
  description: 'Lab 12 hat PIM Sparse Mode mit einem RP gezeigt. Hier baust du auf demselben Netz nacheinander die drei Verfahren, die das Blueprint zusätzlich nennt: Source-Specific Multicast mit IGMPv3 (kein RP), Bidirectional PIM (nur Shared Tree, kein `(S,G)`) und zwei RPs mit gleicher Adresse, die sich ihre Quellen per MSDP mitteilen. Jedes Verfahren bekommt einen eigenen Gruppenbereich, damit du sie nebeneinander vergleichen kannst.'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** SSM: REC ist 232.1.1.1 mit Quelle 192.168.1.10 beigetreten, bekommt aber nichts. Auf R4 gibt es keinen `(S,G)`-Eintrag für die Gruppe.

    **Ticket 2:** Bidir: Der Ping von SRC an 239.2.1.1 bleibt unbeantwortet. Die Gruppe 239.1.1.1 ist davon nicht betroffen, sobald die übrigen Tickets gelöst sind.

    **Ticket 3:** Anycast-RP: `show ip msdp summary` zeigt auf R2 und R3 keinen Peer im Zustand `Up`.

    **Ticket 4:** Anycast-RP: Auch mit stehender MSDP-Sitzung antwortet REC nicht auf Pings an 239.1.1.1. Der SA-Cache auf R3 bleibt leer, während SRC sendet.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 192.168.1.0 0.0.0.255 area 0
    ip multicast-routing
    ip pim bidir-enable
    ip pim ssm default
    ip pim rp-address 10.255.0.100 10
    ip pim rp-address 10.255.0.200 20 bidir
    access-list 10 permit 239.1.0.0 0.0.255.255
    access-list 20 permit 239.2.0.0 0.0.255.255
    interface Loopback0
     ip pim sparse-mode
    interface GigabitEthernet0/0
     ip pim sparse-mode
    interface GigabitEthernet0/1
     ip pim sparse-mode
  tags: []
  interfaces:
