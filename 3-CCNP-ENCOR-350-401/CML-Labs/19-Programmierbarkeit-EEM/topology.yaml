lab:
  title: Lab 19 – RESTCONF, NETCONF, YANG und EEM
  description: 'Ein IOS-XE-Router wird programmierbar: RESTCONF und NETCONF aktivieren, YANG-Daten lesen und per HTTP-Methoden ändern, HTTP-Statuscodes lesen und ein EEM-Applet schreiben. Für die Python-Teile brauchs'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: EXT
  node_definition: external_connector
  x: 50
  y: 150
  configuration: virbr0
  tags: []
  interfaces:
  - id: i0
    label: port
    slot: 0
    type: physical
- id: n1
  label: CSR1
  node_definition: csr1000v
  x: 300
  y: 150
  configuration: |
    hostname CSR1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet1
     ip address dhcp
     no shutdown
    interface GigabitEthernet2
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    ip route 2.2.2.2 255.255.255.255 10.0.12.2
  tags: []
  interfaces:
  - id: i0
    label: GigabitEthernet1
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet2
    slot: 1
    type: physical
  - id: i2
    label: GigabitEthernet3
    slot: 2
    type: physical
  - id: i3
    label: GigabitEthernet4
    slot: 3
    type: physical
- id: n2
  label: R2
  node_definition: iosv
  x: 550
  y: 150
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.12.1
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i0
  i2: i0
  label: EXT-port<->CSR1-GigabitEthernet1
- id: l1
  n1: n1
  n2: n2
  i1: i1
  i2: i1
  label: CSR1-GigabitEthernet2<->R2-GigabitEthernet0/0
