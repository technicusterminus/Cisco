     no shutdown
    ip route 192.168.1.0 255.255.255.0 10.0.12.1
    ip route 10.255.0.4 255.255.255.255 10.0.24.2
    ip route 10.255.1.4 255.255.255.255 10.0.24.2
  tags: []
