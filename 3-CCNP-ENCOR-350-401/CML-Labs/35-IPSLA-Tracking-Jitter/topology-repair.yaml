lab:
  title: 'Lab 35 – IP SLA vertieft: Tracking mit Floating Static, UDP-Jitter mit Responder, TCP-Connect (Repair)'
  description: 'Lab 04 nutzt IP SLA nur als Zulieferer für PBR. Ziel 4.4 verlangt, IP SLA selbst zu konfigurieren und zu prüfen. Hier baust du einen Standort mit zwei Providern: Eine Messung überwacht den Weg über ISP1 und schaltet bei einem Ausfall *hinter* dem Provider-Router auf ISP2 um. Dabei läufst du absichtlich in die zwei klassischen Fehler (Messung nicht gestartet, Messung folgt der Umschaltung). Danach misst du Jitter und Paketverlust mit einem Responder und die Antwortzeit eines TCP-Dienstes.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 200
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    ip sla 1
     icmp-echo 10.255.1.4 source-interface GigabitEthernet0/1
     threshold 500
     timeout 1000
     frequency 5
    ip sla 2
     udp-jitter 10.255.1.4 16384 num-packets 20 interval 20
     threshold 1
     frequency 30
    ip sla schedule 2 life forever start-time now
    ip sla 3
     tcp-connect 10.255.1.4 23 control disable
     frequency 30
    ip sla schedule 3 life forever start-time now
    ip sla logging traps
    ip sla reaction-configuration 1 react timeout threshold-type immediate action-type trapOnly
    track 1 ip sla 1 reachability
     delay down 10 up 30
    track 2 ip sla 2 state
    ip route 10.255.1.4 255.255.255.255 10.0.12.2
    ip route 0.0.0.0 0.0.0.0 10.0.12.2 track 1
    ip route 0.0.0.0 0.0.0.0 10.0.13.2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
