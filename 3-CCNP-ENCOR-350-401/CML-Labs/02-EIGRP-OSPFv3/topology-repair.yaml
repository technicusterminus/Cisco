lab:
  title: Lab 02 – EIGRP (Named Mode) und OSPFv3 (Repair)
  description: 'Dual-Stack-Dreieck: IPv4 mit EIGRP im Named Mode (inkl. Unequal-Cost-Load-Balancing, Summarization, Authentifizierung), IPv6 mit OSPFv3 Address-Families. So vergleichst du beide IGPs am selben Netz.'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** R2 hat keinen EIGRP-Nachbarn zu R1 oder R3, `show ip eigrp neighbors` ist leer, IPv6/OSPFv3 läuft normal.

    **Ticket 2:** R1–R2 funktioniert, aber der Direktlink R1–R3 bildet keine Nachbarschaft (Log: Authentifizierungsfehler).

    **Ticket 3:** R2–R3 bildet keine EIGRP-Nachbarschaft, R3 ist nur über den Direktlink R1–R3 erreichbar (Pfadwahl bei R1 ungewöhnlich).

    **Ticket 4:** Im IPv6-Netz fehlt die Nachbarschaft R2–R3 (EIGRP IPv4 läuft), `show ospfv3 neighbor` zeigt auf R2 keinen Nachbarn an Gi0/1.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     ipv6 address 2001:db8:ff::1/128
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     ipv6 address 2001:db8:12::1/64
     bandwidth 10000
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     ipv6 address 2001:db8:13::1/64
     bandwidth 2000
     no shutdown
    ipv6 unicast-routing
    router eigrp LAB
     address-family ipv4 unicast autonomous-system 100
      eigrp router-id 1.1.1.1
      af-interface default
       passive-interface
      exit-af-interface
      af-interface GigabitEthernet0/0
       no passive-interface
       authentication mode hmac-sha-256 0 LabKey123
      exit-af-interface
      af-interface GigabitEthernet0/1
       no passive-interface
       authentication mode hmac-sha-256 0 FalschesPW
      exit-af-interface
      topology base
       variance 6
      exit-af-topology
      network 1.1.1.1 0.0.0.0
      network 10.0.12.0 0.0.0.3
      network 10.0.13.0 0.0.0.3
     exit-address-family
    router ospfv3 1
     router-id 1.1.1.1
     address-family ipv6 unicast
     exit-address-family
    interface Loopback0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/0
     ospfv3 1 ipv6 area 0
    interface GigabitEthernet0/1
     ospfv3 1 ipv6 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
