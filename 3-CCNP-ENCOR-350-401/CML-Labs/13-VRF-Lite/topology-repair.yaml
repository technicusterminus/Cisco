lab:
  title: Lab 13 – VRF-Lite mit überlappenden Adressen (Repair)
  description: Zwei Kunden (RED, BLUE) teilen sich zwei Router und einen Link, nutzen aber dieselben IP-Bereiche. Mit VRF-Lite trennst du Routing-Tabellen, nutzt Subinterfaces als Trunk und OSPF pro VRF.
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Im Log steht `Address 10.1.1.1 overlaps with GigabitEthernet0/0`, BLUE-Site 1 (CB1) ist nicht erreichbar.

    **Ticket 2:** RED läuft Ende zu Ende, BLUE hat zwischen R1 und R2 keine OSPF-Nachbarschaft.

    **Ticket 3:** CB2 bildet keinen Nachbarn zu R2, die BLUE-Site 2 (192.168.2.0/24) fehlt in der Routing-Tabelle von R1.

    **Ticket 4:** RED-Site 2 ist nicht erreichbar (192.168.2.0/24 fehlt in VRF RED auf R1), BLUE funktioniert.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 250
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     no shutdown
    interface GigabitEthernet0/1
     no shutdown
    interface GigabitEthernet0/2
     no shutdown
    vrf definition RED
     address-family ipv4
    vrf definition BLUE
     address-family ipv4
    interface GigabitEthernet0/0
     vrf forwarding RED
     ip address 10.1.1.1 255.255.255.252
    interface GigabitEthernet0/1
     vrf forwarding RED
     ip address 10.1.1.1 255.255.255.252
    interface GigabitEthernet0/2.100
     encapsulation dot1Q 100
     vrf forwarding RED
     ip address 10.0.12.1 255.255.255.252
    interface GigabitEthernet0/2.200
     encapsulation dot1Q 200
     vrf forwarding BLUE
     ip address 10.0.12.1 255.255.255.252
    router ospf 1 vrf RED
     router-id 1.1.1.1
     network 10.1.1.0 0.0.0.3 area 0
     network 10.0.12.0 0.0.0.3 area 0
    router ospf 2 vrf BLUE
     router-id 1.1.1.2
     network 10.1.1.0 0.0.0.3 area 0
     network 10.0.12.0 0.0.0.3 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
