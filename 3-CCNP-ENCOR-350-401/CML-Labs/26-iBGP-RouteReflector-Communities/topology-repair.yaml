lab:
  title: Lab 26 – iBGP mit Route Reflector, Local Preference und Communities (Repair)
  description: 'Ein AS mit drei Routern und zwei Upstream-Providern: iBGP über Loopbacks mit Route Reflector, `next-hop-self`, Pfadsteuerung per Local Preference und Markierung per Community. Der OSPF-Underlay liefer'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Die iBGP-Session R1–R3 bleibt `Active`/`Idle`, auf R1 steht R3 nicht im Zustand `Established`. R1–R2 läuft.

    **Ticket 2:** R1 und R3 listen die Prefixe von ISP1 mit Next-Hop 192.0.2.2 ohne `>` (nicht Best), `show ip bgp` zeigt `inaccessible`.

    **Ticket 3:** Der Verkehr zu 203.0.113.0/24 verlässt das AS über ISP2, obwohl ISP1 bevorzugt sein soll.

    **Ticket 4:** R3 zeigt `show ip bgp community 65001:100` leer, obwohl R2 die Community setzt und R1 sie hat.

    **Ticket 5:** Die eBGP-Session R3–ISP2 steht auf `Idle`; im Log `Notification … (peer in wrong AS)`.

    **Ticket 6:** R1 und R3 erreichen 10.255.0.2 nicht, die iBGP-Session zu R2 bleibt unten, obwohl der Link steht.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 60
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    router ospf 1
     network 10.0.0.0 0.255.255.255 area 0
    ip bgp-community new-format
    router bgp 65001
     bgp router-id 10.255.0.1
     neighbor 10.255.0.2 remote-as 65001
     neighbor 10.255.0.2 update-source Loopback0
     neighbor 10.255.0.2 route-reflector-client
     neighbor 10.255.0.2 send-community
     neighbor 10.255.0.3 remote-as 65001
     neighbor 10.255.0.3 route-reflector-client
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 120
  y: 230
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 192.0.2.1 255.255.255.252
     no shutdown
    router ospf 1
     network 10.0.0.0 0.0.255.255 area 0
    ip bgp-community new-format
    router bgp 65001
     bgp router-id 10.255.0.2
     neighbor 10.255.0.1 remote-as 65001
     neighbor 10.255.0.1 update-source Loopback0
     neighbor 10.255.0.1 send-community
     neighbor 192.0.2.2 remote-as 65100
     neighbor 192.0.2.2 route-map ISP1-IN in
    route-map ISP1-IN permit 10
     set local-preference 50
     set community 65001:100 additive
