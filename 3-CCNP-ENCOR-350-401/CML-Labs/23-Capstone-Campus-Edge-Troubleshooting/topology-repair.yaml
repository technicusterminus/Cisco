lab:
  title: 'Lab 23 – Capstone: Campus und Edge, Fehlersuche im Gesamtnetz (Repair)'
  description: 'Ein komplettes kleines Campus-Netz mit Internet-Edge: Access-Switch mit EtherChannel, Distribution-Router mit HSRP, OSPF, NAT, ACL, NTP und SSH. Der Schwerpunkt liegt auf der Reparatur: Zehn Fehler au'
  notes: |-
    ## Lab 23 — Abschlusslab Campus und Edge

    **Stufe:** Transfer · **Zeitbox:** 110 Minuten

    **Blueprint:** 3.1.a–c, 3.2.b (IPv4), 3.3.a (NTP), 3.3.b–c, 5.1.a, 5.2.a.

    **Voraussetzung:** 05–11, 01, 33 und idealerweise 31

    **Start:** Starte die Reparaturvariante. Campus, Gateway-Paar, Edge und ISP sind als Szenario gegeben.

    **Auftrag:** Bearbeite die Tickets schichtweise, priorisiere Abhängigkeiten und dokumentiere je Ursache die kleinste wirksame Änderung. Wähle deine Nachweise selbst.

    **Grenzen:** Behalte Adressplan und bereitgestellte Infrastruktur bei. Nimm für Gegenproben vorübergehend erzeugte Fehler zurück.

    **Erfolgskriterium:** Hosts, Gateway, Routing und Edge-Funktion erreichen den vereinbarten Endzustand. Mindestens ein Befund pro bearbeitetem Ticket zeigt die Ursache vor und die Wirkung nach dem Fix.

    **Gegenprobe:** Weise einen funktionsfähigen Kontrollfluss nach und zeige, dass ein unzulässiger Verkehrsfluss weiterhin blockiert ist.

    **Wiederholung oder Transfer:** 24 als Gegenprobe mit anderer Architektur

    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** H20 erreicht seinen Gateway nicht, H10 schon. Von R1 aus ist 10.10.20.12 nicht erreichbar.

    **Ticket 2:** Nach dem Reparieren des Trunks melden in VLAN 10 beide Router `Active`. `show standby brief` auf R1 und R2 zeigt jeweils `Active` und keinen Standby-Partner; Hosts erhalten ARP-Antworten verschiedener Router.

    **Ticket 3:** Alles funktioniert, aber beim Test (Abschalten von R1) verlieren alle Hosts das Internet, obwohl R2 HSRP Active wird. `show ip ospf neighbor` auf EDGE zeigt nur R1.

    **Ticket 4:** H10 erreicht 8.8.8.8, H20 nicht, obwohl das Routing stimmt. `show ip nat translations` enthält nur Einträge aus 10.10.10.x.

    **Ticket 5:** H20 kann H10 anpingen, obwohl die Segmente getrennt sein sollen. `show access-lists` zeigt keine Treffer auf der deny-Zeile.

    **Ticket 6:** `show spanning-tree root` zeigt für VLAN 10 und 20 SW2 als Root, Design verlangt SW1. Der Verkehr der Hosts nimmt einen Umweg, SW1 hat `Root port Po1`.

    **Ticket 7:** Po1 bündelt nicht: `show etherchannel summary` zeigt auf SW1 `(s)`/`(I)`-Ports, die Verbindung zu H10 und H20 ist unzuverlässig oder fällt ganz aus.

    **Ticket 8:** `show ntp status` auf R2: `Clock is unsynchronized`, R1 ist synchron. `show ntp associations` zeigt Reach 0.

    **Ticket 9:** SSH von R1 auf R2 wird abgewiesen (`Connection refused by remote host`), Telnet dagegen geht.

    **Ticket 10:** H10/H20 erreichen 8.8.8.8 nicht. EDGE erreicht den ISP, R1 und R2 haben aber keine Default-Route (`show ip route 0.0.0.0` → `Network not in table`).

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
