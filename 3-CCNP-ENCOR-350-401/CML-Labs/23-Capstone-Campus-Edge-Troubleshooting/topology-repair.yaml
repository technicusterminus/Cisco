lab:
  title: 'Lab 23 – Capstone: Campus und Edge, Fehlersuche im Gesamtnetz (Repair)'
  description: 'Ein komplettes kleines Campus-Netz mit Internet-Edge: Access-Switch mit EtherChannel, Distribution-Router mit HSRP, OSPF, NAT, ACL, NTP und SSH. Der Schwerpunkt liegt auf der Reparatur: Zehn Fehler au'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 150
  y: 100
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/0.10
     encapsulation dot1Q 10
     ip address 10.10.10.2 255.255.255.0
     standby version 2
     standby 10 ip 10.10.10.1
     standby 10 priority 110
     standby 10 preempt
    interface GigabitEthernet0/0.20
     encapsulation dot1Q 20
     ip address 10.10.20.2 255.255.255.0
     standby version 2
     standby 20 ip 10.10.20.1
     standby 20 priority 110
     standby 20 preempt
     ip access-group V20-IN in
    ip access-list extended V20-IN
     permit ip any any
     deny ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255
    router ospf 1
     passive-interface default
     no passive-interface GigabitEthernet0/1
     no passive-interface GigabitEthernet0/2
     network 10.0.0.0 0.255.255.255 area 0
    ntp server 10.255.0.3
    ip domain-name lab.local
    username admin privilege 15 secret Lab-Passw0rd!
    ip ssh version 2
    line vty 0 4
     login local
     transport input ssh
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
