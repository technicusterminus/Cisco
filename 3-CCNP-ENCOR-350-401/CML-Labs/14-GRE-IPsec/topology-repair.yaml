lab:
  title: Lab 14 – GRE, IPsec und VTI (Repair)
  description: 'Standortvernetzung über ein unsicheres Transportnetz: GRE-Tunnel, OSPF darüber, IPsec Tunnel Protection (IKEv1), anschließend IKEv2 und VTI. Dazu MTU/MSS und das typische Rekursiv-Routing-Problem.'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Tunnel0 ist up/up, aber OSPF-Nachbar bleibt aus. `show crypto isakmp sa` zeigt MM_NO_STATE bzw. nichts.

    **Ticket 2:** `show crypto isakmp sa` zeigt `QM_IDLE`, aber über den Tunnel geht nichts: Der OSPF-Nachbar bleibt aus, `encaps` und `decaps` stehen auf 0.

    **Ticket 3:** Tunnel0 zeigt up/up (Keepalive nicht aktiv), aber nichts kommt an; `show crypto isakmp sa` bleibt leer.

    **Ticket 4:** Tunnel und IPsec stehen, aber OSPF-Nachbarschaft fehlt, LANs sind nicht erreichbar.

    **Ticket 5:** Tunnel flappt zyklisch, das Log zeigt `%TUN-5-RECURDOWN` (Tunnel Interface is Down, recursive routing).

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: CE1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname CE1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface Loopback100
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 198.51.100.2
    interface Tunnel0
     ip address 172.16.0.1 255.255.255.252
     tunnel source GigabitEthernet0/0
     tunnel destination 203.0.113.11
     ip mtu 1400
     ip tcp adjust-mss 1360
     ip ospf network point-to-point
     tunnel protection ipsec profile PROF
    crypto isakmp policy 10
     encryption aes 256
     hash sha256
     authentication pre-share
     group 14
    crypto isakmp key CiscoLab123 address 203.0.113.1
    crypto ipsec transform-set TS esp-aes 128 esp-sha256-hmac
     mode transport
    crypto ipsec profile PROF
     set transform-set TS
    router ospf 1
     router-id 1.1.1.1
     network 172.16.0.0 0.0.0.3 area 0
     network 192.168.1.0 0.0.0.255 area 0
