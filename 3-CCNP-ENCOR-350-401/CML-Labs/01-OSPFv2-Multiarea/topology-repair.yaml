lab:
  title: Lab 01 – OSPFv2 Multi-Area (Repair)
  description: OSPF-Areas, ABR/ASBR, DR/BDR, Summarization, Stub/NSSA, Authentifizierung und typische OSPF-Fehler.
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** R1 und R2 werden nicht Nachbarn, `show ip ospf neighbor` ist auf R1 leer, Area 0 ist isoliert.

    **Ticket 2:** R3 erscheint nirgends als Nachbar, R2 und R4 sehen nur sich gegenseitig.

    **Ticket 3:** R1 sieht vier einzelne /24 (10.1.16–19) statt der Zusammenfassung.

    **Ticket 4:** R4 bleibt in `INIT`/taucht nicht als Nachbar auf, während R3 und R2 sich sehen.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    router ospf 1
     router-id 1.1.1.1
    interface Loopback0
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip ospf 1 area 0
     ip ospf authentication key-chain OSPFKEY
     ip ospf hello-interval 3
     ip ospf dead-interval 12
    key chain OSPFKEY
     key 1
      key-string LabKey999
      cryptographic-algorithm hmac-sha-256
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 300
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.1.234.2 255.255.255.0
     no shutdown
    router ospf 1
     router-id 2.2.2.2
     area 1 range 10.1.20.0 255.255.252.0
    interface Loopback0
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip ospf 1 area 0
     ip ospf authentication key-chain OSPFKEY
     ip ospf hello-interval 3
     ip ospf dead-interval 12
    interface GigabitEthernet0/1
     ip ospf 1 area 1
     ip ospf priority 0
    key chain OSPFKEY
     key 1
      key-string LabKey123
      cryptographic-algorithm hmac-sha-256
