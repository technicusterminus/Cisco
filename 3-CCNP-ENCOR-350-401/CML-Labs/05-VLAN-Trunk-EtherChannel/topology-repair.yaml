lab:
  title: Lab 05 – VLANs, Trunks und EtherChannel (Repair)
  description: 'Drei Switches, Router-on-a-Stick und drei Hosts: 802.1Q-Trunks (Native VLAN, Allowed VLANs, DTP, VTP) und EtherChannel mit LACP, PAgP und statischem Modus.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  x: 350
  y: 150
  configuration: |
    hostname SW1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    spanning-tree mode rapid-pvst
    vtp mode transparent
    vlan 10
     name USERS
    vlan 20
     name SERVERS
    vlan 99
     name NATIVE
    interface range GigabitEthernet0/0 - 1
     channel-group 1 mode active
    interface range GigabitEthernet0/2 - 3
     channel-group 2 mode desirable
    interface Port-channel1
     switchport mode trunk
     switchport trunk native vlan 99
     switchport trunk allowed vlan 10,20
    interface Port-channel2
     switchport mode trunk
     switchport trunk native vlan 99
     switchport trunk allowed vlan 10,20
    interface GigabitEthernet1/0
     switchport mode trunk
     switchport nonegotiate
     switchport trunk native vlan 99
     switchport trunk allowed vlan 10,20
    port-channel load-balance src-dst-ip
  tags: []
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
