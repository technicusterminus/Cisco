lab:
  title: Routing Assurance – Störung eingrenzen
  version: 0.2.0
  description: OSPF, eBGP und IP SLA auf drei IOSv-Routern.
  notes: |-
    Ein Dienst fällt aus, das Kontrollziel antwortet. Nutze auf PROBE als Quelle Loopback0. Unterscheide OSPF, BGP, Filterung und Rückweg. Stelle den Dienst bei weiter aktiver Eingangsfilterung wieder her.
    Adressen, Ablauf und Erfolgskriterien stehen im README der Praxisstrecke Routing-Assurance.
nodes:
- id: n0
  label: PROBE
  node_definition: iosv
  x: 0
  y: 0
  configuration: |
    hostname PROBE
    no ip domain-lookup
    service timestamps log datetime msec
    logging buffered 32768 informational
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    !
    interface GigabitEthernet0/0
     ip address 10.0.0.1 255.255.255.252
     ip ospf network point-to-point
     ip ospf cost 10
     no shutdown
    !
    interface GigabitEthernet0/1
     ip address 10.0.0.5 255.255.255.252
     ip ospf network point-to-point
     ip ospf cost 100
     no shutdown
    !
    router ospf 1
     router-id 10.255.0.1
     passive-interface default
     no passive-interface GigabitEthernet0/0
     no passive-interface GigabitEthernet0/1
     network 10.0.0.0 0.0.0.7 area 0
     network 10.255.0.1 0.0.0.0 area 0
    !
    ip sla 10
     icmp-echo 203.0.113.10 source-interface Loopback0
     frequency 5
    ip sla schedule 10 life forever start-time now
    end
  tags: []
  interfaces:
  - {id: i0, label: Loopback0, type: loopback}
  - {id: i1, label: GigabitEthernet0/0, slot: 0, type: physical}
  - {id: i2, label: GigabitEthernet0/1, slot: 1, type: physical}
- id: n1
  label: EDGE
  node_definition: iosv
  x: 300
  y: 0
  configuration: |
    hostname EDGE
    no ip domain-lookup
    service timestamps log datetime msec
    logging buffered 32768 informational
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
     no shutdown
    !
    interface GigabitEthernet0/0
     ip address 10.0.0.2 255.255.255.252
     ip ospf network point-to-point
     ip ospf cost 10
     no shutdown
    !
    interface GigabitEthernet0/1
     ip address 10.0.0.6 255.255.255.252
     ip ospf network point-to-point
     ip ospf cost 100
     no shutdown
    !
    interface GigabitEthernet0/2
     ip address 192.0.2.1 255.255.255.252
     no shutdown
    !
    router ospf 1
     router-id 10.255.0.2
     passive-interface default
     no passive-interface GigabitEthernet0/0
     no passive-interface GigabitEthernet0/1
     network 10.0.0.0 0.0.0.7 area 0
     network 10.255.0.2 0.0.0.0 area 0
     default-information originate always
    !
    ip prefix-list SERVICES seq 20 permit 198.51.100.10/32
    router bgp 65010
     bgp router-id 10.255.0.2
     neighbor 192.0.2.2 remote-as 65020
     neighbor 192.0.2.2 prefix-list SERVICES in
     network 10.255.0.1 mask 255.255.255.255
    end
  tags: []
  interfaces:
  - {id: i0, label: Loopback0, type: loopback}
  - {id: i1, label: GigabitEthernet0/0, slot: 0, type: physical}
  - {id: i2, label: GigabitEthernet0/1, slot: 1, type: physical}
  - {id: i3, label: GigabitEthernet0/2, slot: 2, type: physical}
- id: n2
  label: ISP
  node_definition: iosv
  x: 600
  y: 0
  configuration: |
    hostname ISP
    no ip domain-lookup
    service timestamps log datetime msec
    logging buffered 32768 informational
    interface Loopback0
     ip address 203.0.113.10 255.255.255.255
     no shutdown
    !
    interface Loopback1
     ip address 198.51.100.10 255.255.255.255
     no shutdown
    !
    interface GigabitEthernet0/0
     ip address 192.0.2.2 255.255.255.252
     no shutdown
    !
    router bgp 65020
     bgp router-id 192.0.2.2
     neighbor 192.0.2.1 remote-as 65010
     network 203.0.113.10 mask 255.255.255.255
     network 198.51.100.10 mask 255.255.255.255
    end
  tags: []
  interfaces:
  - {id: i0, label: Loopback0, type: loopback}
  - {id: i1, label: GigabitEthernet0/0, slot: 0, type: physical}
links:
- {id: l0, n1: n0, i1: i1, n2: n1, i2: i1, label: Transit A}
- {id: l1, n1: n0, i1: i2, n2: n1, i2: i2, label: Transit B}
- {id: l2, n1: n1, i1: i3, n2: n2, i2: i1, label: eBGP}
