lab:
  title: 'Lab 33 – Diagnose: Ping und Traceroute lesen, Debug und Conditional Debug sicher einsetzen (Repair)'
  description: 'Ziel 4.1 verlangt, Netzprobleme mit Debugs, Conditional Debugs, Traceroute, Ping, SNMP und Syslog einzugrenzen. SNMP und Syslog übst du in Lab 08. Hier geht es um die Werkzeuge an der Konsole: Du lernst, die Zeichen von Ping und Traceroute als Befund zu lesen, eine MTU-Engstelle auszumessen und Debug-Ausgaben so einzugrenzen, dass sie den Router nicht lahmlegen. Das Netz ist fertig geroutet, damit die Werkzeuge im Mittelpunkt stehen.'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** H1 erreicht SRV nicht. Der Ping von H1 zeigt `U.U.U`.

    **Ticket 2:** Der Ping von H1 zu SRV geht, aber Traceroute bricht in Zeile 3 mit `!A` ab. Das Monitoring meldet den Standort deshalb als gestört.

    **Ticket 3:** Anwender melden: Anmelden am Server geht, große Dateien übertragen hängt. `ping 192.168.3.10 size 1500 df-bit` von H1 zeigt nur Punkte, kein `M`.

    **Ticket 4:** Auf R1 läuft `debug ip icmp` laut `show debugging`, aber `show logging` zeigt keine einzige Debug-Zeile.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
