lab:
  title: 'Lab 33 – Diagnose: Ping und Traceroute lesen, Debug und Conditional Debug sicher einsetzen'
  description: 'Ziel 4.1 verlangt, Netzprobleme mit Debugs, Conditional Debugs, Traceroute, Ping, SNMP und Syslog einzugrenzen. SNMP und Syslog übst du in Lab 08. Hier geht es um die Werkzeuge an der Konsole: Du lernst, die Zeichen von Ping und Traceroute als Befund zu lesen, eine MTU-Engstelle auszumessen und Debug-Ausgaben so einzugrenzen, dass sie den Router nicht lahmlegen. Das Netz ist fertig geroutet, damit die Werkzeuge im Mittelpunkt stehen.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 200
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
    interface GigabitEthernet0/0
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    router ospf 1
     router-id 10.255.0.1
     network 10.255.0.1 0.0.0.0 area 0
     network 192.168.1.0 0.0.0.255 area 0
     network 10.0.12.0 0.0.0.3 area 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
