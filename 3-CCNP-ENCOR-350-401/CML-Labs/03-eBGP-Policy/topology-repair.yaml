lab:
  title: Lab 03 – eBGP Dual-Homing und Policy (Repair)
  description: 'Kunde mit zwei Providern: eBGP-Sessions, Best-Path-Auswahl, Local-Preference, AS-Path-Prepending, MED, No-Transit-Filter und Soft-Reset. Private AS-Nummern dienen nur der Übung.'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** Die Session R1–R2 kommt nicht hoch (Idle/Active), das Log meldet eine falsche Nachbar-AS.

    **Ticket 2:** R1 wählt zu 198.51.100.0/24 den Pfad über ISP-B, obwohl ISP-A bevorzugt sein soll (LocPrf überall 100).

    **Ticket 3:** Auf R2 erscheint 198.51.100.0/24 zusätzlich mit AS-Path `65001 65020 65100`, R1 wird zum Transit.

    **Ticket 4:** Weder R2 noch R3 lernen 198.51.100.0/24, R1 hat keine Internet-Route.

    **Ticket 5:** Der Kundenbereich 203.0.113.0/24 ist aus dem Internet nicht erreichbar, R2/R3 sehen kein Präfix von R1.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.12.0.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.13.0.1 255.255.255.252
     no shutdown
    ip route 203.0.113.0 255.255.255.128 Null0
    ip as-path access-list 1 permit ^$
    route-map FROM-ISPA permit 10
     set local-preference 200
    route-map TO-ISPA permit 10
     match as-path 1
    route-map TO-ISPB permit 10
     match as-path 1
     set as-path prepend 65001 65001 65001
    router bgp 65001
     bgp router-id 1.1.1.1
     neighbor 10.12.0.2 remote-as 65011
     neighbor 10.13.0.2 remote-as 65020
     network 203.0.113.0 mask 255.255.255.0
     neighbor 10.13.0.2 route-map TO-ISPB out
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 350
  y: 100
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.12.0.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.24.0.1 255.255.255.252
     no shutdown
    router bgp 65010
     bgp router-id 20.20.20.20
     neighbor 10.12.0.1 remote-as 65001
     neighbor 10.24.0.2 remote-as 65100
  tags: []
  interfaces:
