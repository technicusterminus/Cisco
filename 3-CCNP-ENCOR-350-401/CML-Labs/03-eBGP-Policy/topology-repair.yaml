lab:
  title: Lab 03 – eBGP Dual-Homing und Policy (Repair)
  description: 'Kunde mit zwei Providern: eBGP-Sessions, Best-Path-Auswahl, Local-Preference, AS-Path-Prepending, MED, No-Transit-Filter und Soft-Reset. Private AS-Nummern dienen nur der Übung.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.12.0.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.13.0.1 255.255.255.252
     no shutdown
    ip route 203.0.113.0 255.255.255.128 Null0
    ip as-path access-list 1 permit ^$
    route-map FROM-ISPA permit 10
     set local-preference 200
    route-map TO-ISPA permit 10
     match as-path 1
    route-map TO-ISPB permit 10
     match as-path 1
     set as-path prepend 65001 65001 65001
    router bgp 65001
     bgp router-id 1.1.1.1
     neighbor 10.12.0.2 remote-as 65011
     neighbor 10.13.0.2 remote-as 65020
     network 203.0.113.0 mask 255.255.255.0
     neighbor 10.13.0.2 route-map TO-ISPB out
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 350
  y: 100
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 2.2.2.2 255.255.255.255
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.12.0.2 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.24.0.1 255.255.255.252
     no shutdown
    router bgp 65010
     bgp router-id 20.20.20.20
     neighbor 10.12.0.1 remote-as 65001
     neighbor 10.24.0.2 remote-as 65100
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
