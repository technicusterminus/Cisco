lab:
  title: 'Lab 36 – EEM-Applets: Ereignisse, Aktionen und die typischen Fallen (Repair)'
  description: 'Ziel 6.6 verlangt, ein EEM-Applet zu konstruieren, das konfiguriert, Fehler eingrenzt oder Daten sammelt. Lab 19 zeigt zwei Applets am Rand. Hier baust du sechs kleine Applets, eines je Ereignistyp, und lernst dabei die Stellen kennen, an denen Applets in der Praxis und in Prüfungs-Exhibits scheitern: fehlendes `enable`, die Sortierung der Aktionsnummern, Muster, die nie treffen, und die Bedeutung von `sync` und `skip`.'
  notes: 'Aufgaben: siehe README.md'
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 100
  y: 200
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     ip ospf network point-to-point
     ip ospf 1 area 0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.21.1 255.255.255.252
     ip ospf network point-to-point
     ip ospf 1 area 0
     no shutdown
    router ospf 1
     router-id 10.255.0.1
    file prompt quiet
    event manager applet REPORT
     event none
     action 1.0 cli command "enable"
     action 2.0 cli command "show ip ospf neighbor"
     action 3.0 puts "$_cli_result"
    event manager applet OSPF-DOWN
     event syslog pattern "OSPF-5-ADJCHANGE.*from FULL to"
     action 1.0 cli command "enable"
     action 2.0 cli command "show ip ospf neighbor | append flash:ospf-down.txt"
     action 3.0 cli command "show ip interface brief | append flash:ospf-down.txt"
     action 4.0 syslog priority warnings msg "EEM: OSPF-Nachbar verloren, Daten in flash:ospf-down.txt"
    event manager applet FLAPGUARD
     event syslog pattern "OSPF-5-ADJCHG.*GigabitEthernet0/1 from FULL to" occurs 3 period 300
     action 1.0 cli command "enable"
     action 2.0 cli command "configure terminal"
     action 3.0 cli command "interface GigabitEthernet0/1"
     action 10.0 cli command "shutdown"
     action 5.0 cli command "end"
     action 6.0 syslog priority critical msg "EEM: Gi0/1 flattert, Interface abgeschaltet"
    event manager applet NO-DEBUG-ALL
     event cli pattern "^debug all" sync no skip no
     action 1.0 syslog priority warnings msg "EEM: debug all ist auf diesem Geraet gesperrt"
    event manager applet BACKUP
     event cli pattern "^write memory" sync yes
     action 2.0 cli command "copy running-config flash:backup.cfg"
     action 3.0 syslog msg "EEM: Sicherung nach flash:backup.cfg angestossen"
     action 4.0 set _exit_status "1"
    event manager applet HEARTBEAT
     event timer watchdog time 300
     action 1.0 syslog msg "EEM: Heartbeat"
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 500
  y: 200
  configuration: |
    hostname R2
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.2 255.255.255.255
     ip ospf 1 area 0
    interface GigabitEthernet0/0
     ip address 10.0.12.2 255.255.255.252
     ip ospf network point-to-point
     ip ospf 1 area 0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.21.2 255.255.255.252
     ip ospf network point-to-point
     ip ospf 1 area 0
     no shutdown
    router ospf 1
     router-id 10.255.0.2
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
- id: l1
  n1: n0
  n2: n1
  i1: i2
  i2: i2
  label: R1-GigabitEthernet0/1<->R2-GigabitEthernet0/1
