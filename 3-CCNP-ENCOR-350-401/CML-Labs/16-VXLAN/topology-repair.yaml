lab:
  title: 'Lab 16 – VXLAN: VTEP, VNI und Ingress Replication (Repair)'
  description: Zwei NX-OS-Leafs spannen VLAN 10 über ein geroutetes Underlay als VXLAN-Segment (VNI 10010). Statische Ingress Replication statt EVPN, damit die Grundmechanik sichtbar bleibt. **Ressourcenhungrig:** N
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** H1 und H2 im selben Subnetz erreichen sich nicht, `show nve vni` zeigt auf LEAF2 eine andere VNI.

    **Ticket 2:** `show nve peers` ist auf LEAF1 leer oder zeigt einen Peer ohne Verkehr.

    **Ticket 3:** Die Verbindung steht nie, `show nve interface` zeigt `Admin down`.

    **Ticket 4:** LEAF2 erreicht 10.255.0.1 nicht (Ping auf die VTEP-Adresse scheitert), NVE-Peer bleibt down.

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: LEAF1
  node_definition: nxosv9000
  x: 250
  y: 200
  configuration: |
    hostname LEAF1
    feature ospf
    router ospf 1
      router-id 10.255.0.1
    feature nv overlay
    feature vn-segment-vlan-based
    vlan 10
      vn-segment 10010
    interface loopback0
      ip address 10.255.0.1/32
    interface Ethernet1/1
      mtu 9216
      no switchport
      ip address 10.0.12.1/30
      ip router ospf 1 area 0.0.0.0
      no shutdown
    interface Ethernet1/2
      switchport
      switchport access vlan 10
      no shutdown
    interface nve1
      no shutdown
      source-interface loopback0
      member vni 10010
        ingress-replication protocol static
          peer-ip 10.255.0.22
