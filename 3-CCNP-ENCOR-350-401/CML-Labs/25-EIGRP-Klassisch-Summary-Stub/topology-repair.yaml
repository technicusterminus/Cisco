lab:
  title: 'Lab 25 – EIGRP klassisch: Nachbarschaft, Authentifizierung, Summary und Stub (Repair)'
  description: 'EIGRP im klassischen Modus über vier Router: Nachbarschaftsbedingungen (AS, K-Werte, Authentifizierung), Summarisierung, Stub-Router und das Lesen der Topology Table (Feasible Successor, FD/RD). Dazu '
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** R1 und R2 bilden keine Nachbarschaft (`show ip eigrp neighbors` leer am Link); `debug eigrp packets` meldet einen Authentifizierungsfehler.

    **Ticket 2:** R3 hat keine Nachbarn: `show ip eigrp neighbors` ist leer, auf R1 und R2 steht `K-value mismatch`.

    **Ticket 3:** R4 hat keinen Nachbarn zu R2, 192.168.4.0/24 fehlt überall.

    **Ticket 4:** R3 zeigt für das 172.16er-Netz zwei verschiedene Routen: `172.16.0.0/22` (über R2) und `172.16.0.0/23` (direkt von R1). Verkehr in 172.16.2.0/24 nimmt den Umweg.

    **Ticket 5:** Nach Behebung der Nachbarschaft: R1 erreicht 192.168.4.1 nicht, obwohl R4 Nachbar von R2 ist.

    **Ticket 6:** R2 und R3 sind direkt verbunden, aber `show ip eigrp neighbors` auf R2 zeigt R3 nicht (Nachbarschaft nur über R1).

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 300
  y: 50
  configuration: |
    hostname R1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface Loopback0
     ip address 10.255.0.1 255.255.255.255
     no shutdown
    interface Loopback10
     ip address 172.16.0.1 255.255.255.0
     no shutdown
    interface Loopback11
     ip address 172.16.1.1 255.255.255.0
     no shutdown
    interface Loopback12
     ip address 172.16.2.1 255.255.255.0
     no shutdown
    interface Loopback13
     ip address 172.16.3.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/0
     ip address 10.0.12.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.13.1 255.255.255.252
     no shutdown
    router eigrp 100
     eigrp router-id 10.255.0.1
     network 10.0.12.0 0.0.0.3
     network 10.0.13.0 0.0.0.3
     network 10.255.0.1 0.0.0.0
     network 172.16.0.0 0.0.3.255
     no auto-summary
     passive-interface default
     no passive-interface GigabitEthernet0/0
     no passive-interface GigabitEthernet0/1
    key chain KC
     key 1
      key-string EigrpKey
    interface GigabitEthernet0/0
     ip authentication mode eigrp 100 md5
     ip authentication key-chain eigrp 100 KC
    interface GigabitEthernet0/0
     ip summary-address eigrp 100 172.16.0.0 255.255.252.0
    interface GigabitEthernet0/1
     ip summary-address eigrp 100 172.16.0.0 255.255.254.0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
