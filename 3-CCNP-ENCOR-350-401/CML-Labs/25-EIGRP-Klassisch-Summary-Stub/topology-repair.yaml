     no shutdown
    interface GigabitEthernet0/2
     ip address 10.0.24.1 255.255.255.252
     no shutdown
    router eigrp 100
     eigrp router-id 10.255.0.2
     network 10.0.12.0 0.0.0.3
     network 10.0.23.0 0.0.0.3
     network 10.0.24.0 0.0.0.3
