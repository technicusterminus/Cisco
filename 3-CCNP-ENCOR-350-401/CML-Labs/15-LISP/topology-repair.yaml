lab:
  title: 'Lab 15 – LISP: Map-Server, Map-Resolver, xTR (Repair)'
  description: 'Trennung von Identität (EID) und Ort (RLOC): zwei xTR-Standorte, ein kombinierter Map-Server/Map-Resolver und ein „Internet“-Core, der nur RLOCs kennt. Hinweis: Setzt voraus, dass dein IOSv-Image LISP'
  notes: |-
    ## Reparieren

    Importiere diese Datei als separates Lab. Reproduziere pro Ticket das Symptom, dokumentiere den Befund und belege die Wirkung der Korrektur. Stelle den Testzustand nach jedem Versuch wieder her.

    **Ticket 1:** SITE2 wird auf dem MSMR nie als registriert angezeigt, H1 erreicht H2 nicht (Map-Reply negativ).

    **Ticket 2:** xTR1 registriert sein EID-Netz nicht beim MSMR (SITE1 `no`), Rückverkehr von H2 funktioniert nicht.

    **Ticket 3:** Der MSMR zeigt SITE2 nicht registriert, im Log `EID-prefix not configured`.

    **Ticket 4:** H1 erreicht H2 nie, `show ip lisp map-cache` ist leer (keine Map-Requests).

    Die Topologiedaten, gestufte Hinweise und Lösungen findest du in den Lab-Unterlagen.
  version: 0.2.0
nodes:
- id: n0
  label: xTR1
  node_definition: iosv
  x: 250
  y: 200
  configuration: |
    hostname xTR1
    no ip domain-lookup
    service timestamps log datetime msec
    line con 0
     exec-timeout 0 0
     logging synchronous
    interface GigabitEthernet0/0
     ip address 192.168.1.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 10.0.1.1 255.255.255.252
     no shutdown
    ip route 0.0.0.0 0.0.0.0 10.0.1.2
    router lisp
     locator-set RLOC
      10.0.1.1 priority 1 weight 100
      exit
     eid-table default instance-id 0
      database-mapping 192.168.1.0/24 locator-set RLOC
      ipv4 etr map-server 10.0.99.1 key LispKey123
      ipv4 itr
      exit
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: xTR2
